  async function mesh(settings, prompt, cb, signal) {
    const r = await complete(settings, 'd3', 'You are Nexora 3D 1, a low-poly 3D modeller.',
      'Model this as a low-poly mesh (40-400 faces), ground at y=0, about 2 units tall, centred on x/z. ' +
      'Return only JSON: {"name": string, "vertices": [[x,y,z],...], "faces": [[i,j,k,...],...] (0-based, counter-clockwise seen from outside), "colors": ["#rrggbb" per face]}.\n\nModel: ' + prompt, cb, signal);
    const m = extractJson(r.text);
    if (!Array.isArray(m.vertices) || !Array.isArray(m.faces)) throw apiError('Ogiltig 3D-modell i svaret.');
    return m;
  }

  // ------------------------------------------------------------------ Astryx 5 Pro: the agent
  const AGENT_SYSTEM = GAME_SYSTEM + `

You are Nexora Astryx 5 Pro, an autonomous game-building agent. You do not answer with code in text; you work through tools:
1. write_game – write the complete game (one HTML document).
2. run_game – run it in a real browser. You get runtime errors, whether the canvas animates, and a screenshot after the game has been started and played with the keyboard.
3. Look hard at the result. Fix problems with edit_game (small exact replacements) or write_game (larger rewrites), then run_game again.
4. finish – only after a run with no errors where the screenshot shows the game working. Give a short summary in Swedish.
Always run the game at least once before finishing. Stay under about ten tool calls.`;

  const AGENT_TOOLS = [
    { name: 'write_game', eager_input_streaming: true,
      description: 'Write the complete game as one self-contained HTML document. Replaces the current game entirely.',
      input_schema: { type: 'object', properties: { title: { type: 'string', description: 'Game title in Swedish' }, html: { type: 'string', description: 'The full HTML document' } }, required: ['title', 'html'] } },
    { name: 'edit_game', eager_input_streaming: true,
      description: 'Replace one exact snippet in the current game. `find` must occur exactly once. Prefer this for small fixes.',
      input_schema: { type: 'object', properties: { find: { type: 'string' }, replace: { type: 'string' } }, required: ['find', 'replace'] } },
    { name: 'run_game',
      description: 'Run the current game in a headless browser for about four seconds: presses Space to start, then arrow keys and WASD. Returns runtime errors, console errors, canvas activity and a screenshot.',
      input_schema: { type: 'object', properties: {}, required: [] } },
    { name: 'finish',
      description: 'Finish when the game is written, tested and working. The summary is shown to the player.',
      input_schema: { type: 'object', properties: { summary: { type: 'string', description: 'Two or three sentences in Swedish' } }, required: ['summary'] } },
  ];

  const isStr = v => typeof v === 'string';
  function validate(name, input) {
    if (!input || typeof input !== 'object') return 'input is not an object';
    if (name === 'write_game') return isStr(input.html) && input.html.length > 200 && isStr(input.title) ? null : 'write_game needs `title` and a complete `html` document';
    if (name === 'edit_game') return isStr(input.find) && input.find.length > 0 && isStr(input.replace) ? null : 'edit_game needs `find` and `replace` strings';
    if (name === 'finish') return isStr(input.summary) ? null : 'finish needs `summary`';
    if (name === 'run_game') return null;
    return 'unknown tool ' + name;
  }

  // One streamed Messages API turn, reassembled into content blocks we can send back unchanged.
  // conf (optional): { system, tools, spec, betas: [], extra: {} } – defaults to the HTML agent.
  async function agentTurn(settings, messages, hooks, signal, conf) {
    conf = conf || {};
    const spec = conf.spec || ANTHROPIC.astryx;
    const body = Object.assign({ model: spec.model, max_tokens: spec.max_tokens, stream: true, system: conf.system || AGENT_SYSTEM, tools: conf.tools || AGENT_TOOLS,
      thinking: spec.thinking, output_config: spec.output_config, cache_control: { type: 'ephemeral' }, fallbacks: 'default', messages }, conf.extra || {});
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST', signal, body: JSON.stringify(body),
      headers: { 'content-type': 'application/json', 'x-api-key': settings.anthropicKey, 'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true', 'anthropic-beta': ['server-side-fallback-2026-07-01'].concat(conf.betas || []).join(',') },
    });
    if (!res.ok) throw await httpError(res);
    const blocks = [];
    let stop = null;
    await readSSE(res, ev => {
      if (ev.type === 'content_block_start') {
        const b = Object.assign({}, ev.content_block);
        if (b.type === 'tool_use') { b._json = ''; hooks.step && hooks.step('tool_start', b.name); }
        blocks[ev.index] = b;
      } else if (ev.type === 'content_block_delta') {
        const b = blocks[ev.index], d = ev.delta;
        if (!b) return;
        if (d.type === 'text_delta') { b.text = (b.text || '') + d.text; hooks.text && hooks.text(d.text); }
        else if (d.type === 'thinking_delta') { b.thinking = (b.thinking || '') + d.thinking; hooks.thinking && hooks.thinking(d.thinking); }
        else if (d.type === 'signature_delta') b.signature = (b.signature || '') + d.signature;
        else if (d.type === 'input_json_delta') { b._json += d.partial_json; hooks.progress && hooks.progress(b.name, b._json.length); }
      } else if (ev.type === 'content_block_stop') {
        const b = blocks[ev.index];
        if (b && b.type === 'tool_use') {
          try { b.input = b._json ? JSON.parse(b._json) : {}; b._bad = null; } catch (e) { b.input = {}; b._bad = b._json; }
        }
      } else if (ev.type === 'message_delta' && ev.delta) stop = ev.delta.stop_reason || stop;
      else if (ev.type === 'error') throw apiError('AI-fel: ' + ((ev.error && ev.error.message) || 'okänt'));
    }, signal);
    if (stop === 'refusal') throw apiError('Astryx avböjde den här förfrågan. Försök formulera spelidén annorlunda.');
    if (stop === 'max_tokens') throw apiError('Astryx svar blev för långt och klipptes av. Be om ett mindre spel.');
    // After a mid-output fallback only text before the last `fallback` marker is echoed (and nothing there is run).
    let cut = -1;
    blocks.forEach((b, i) => { if (b && b.type === 'fallback') cut = i; });
    const content = [], calls = [];
    blocks.forEach((b, i) => {
      if (!b || b.type === 'fallback') return;
      if (i < cut && b.type !== 'text') return;
      if (b.type === 'tool_use') { content.push({ type: 'tool_use', id: b.id, name: b.name, input: b.input }); calls.push(b); }
      else if (b.type === 'text') { if (b.text) content.push({ type: 'text', text: b.text }); }
      else if (b.type === 'thinking') content.push({ type: 'thinking', thinking: b.thinking || '', signature: b.signature || '' });
      else content.push(b);
    });
    return { content, calls, stop };
  }

  // hooks: { runGame(html) → {errors, frames, colors, animating, image}, step(kind, detail), thinking(t), progress(tool, chars) }
  async function agent(settings, prompt, opts, hooks, signal) {
    const state = { html: null, title: null, summary: null, runs: 0, turns: 0 };
    if (settings.provider !== 'anthropic') return agentPipeline(settings, prompt, opts, hooks, signal, state);
    if (!settings.anthropicKey) throw apiError('Lägg in din Anthropic API-nyckel under Inställningar, eller välj Nexora Local.');
    const messages = [{ role: 'user', content: gamePrompt(prompt, opts) }];
    for (state.turns = 1; state.turns <= 14; state.turns++) {
      const turn = await agentTurn(settings, messages, hooks, signal);
      messages.push({ role: 'assistant', content: turn.content });
      if (!turn.calls.length) break;
      const results = [];
      let done = false;
      for (const c of turn.calls) {
        const r = { type: 'tool_result', tool_use_id: c.id };
        const bad = c._bad != null ? JSON.stringify({ INVALID_JSON: c._bad.slice(0, 2000) }) : validate(c.name, c.input);
        if (bad) { r.is_error = true; r.content = bad; results.push(r); continue; }
        const inp = c.input;
        if (c.name === 'write_game') {
          state.html = inp.html; state.title = inp.title;
          hooks.step && hooks.step('write', Math.round(inp.html.length / 1000) + ' kB');
          r.content = 'Saved (' + inp.html.length + ' chars). Run it with run_game.';
        } else if (c.name === 'edit_game') {
          const n = state.html ? state.html.split(inp.find).length - 1 : 0;
          if (n !== 1) { r.is_error = true; r.content = state.html ? '`find` occurs ' + n + ' times; it must occur exactly once.' : 'There is no game yet; use write_game.'; }
          else { state.html = state.html.replace(inp.find, () => inp.replace); r.content = 'Edited.'; hooks.step && hooks.step('edit', inp.find.slice(0, 60)); }
        } else if (c.name === 'run_game') {
          if (!state.html) { r.is_error = true; r.content = 'There is no game yet; use write_game first.'; }
          else {
            hooks.step && hooks.step('run');
            const t = await hooks.runGame(state.html);
            state.runs++;
            hooks.step && hooks.step('ran', t.errors.length ? t.errors.length + ' fel' : 'inga fel');
            r.content = [{ type: 'text', text: JSON.stringify({ errors: t.errors, canvas_colours: t.colors, animating: t.animating, frames_rendered: t.frames }) }];
            if (t.image) r.content.push({ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: t.image } });
          }
        } else if (c.name === 'finish') {
          if (!state.runs) { r.is_error = true; r.content = 'Run the game with run_game before finishing.'; }
          else { state.summary = inp.summary; r.content = 'Done.'; done = true; }
        }
        results.push(r);
      }
      messages.push({ role: 'user', content: results });
      if (done) break;
    }
    if (!state.html) throw apiError('Astryx hann inte skriva något spel. Försök igen.');
    return { html: state.html, title: state.title, summary: state.summary || 'Astryx byggde och testade spelet.', turns: state.turns, runs: state.runs, model: ANTHROPIC.astryx.model };
  }

  // The same plan → write → test → fix loop for endpoints without tool calling.
  async function agentPipeline(settings, prompt, opts, hooks, signal, state) {
    hooks.step && hooks.step('tool_start', 'write_game');
    const g = await generateGame(settings, 'astryx', prompt, opts, { thinking: hooks.thinking, text: (d, all) => hooks.progress && hooks.progress('write_game', all.length) }, signal);
    state.html = g.html; hooks.step && hooks.step('write', Math.round(g.html.length / 1000) + ' kB');
    for (let i = 0; i < 3; i++) {
      hooks.step && hooks.step('run');
      const t = await hooks.runGame(state.html); state.runs++;
      hooks.step && hooks.step('ran', t.errors.length ? t.errors.length + ' fel' : 'inga fel');
      if (!t.errors.length && t.animating) break;
      if (i === 2) break;
      hooks.step && hooks.step('edit', 'rättar ' + (t.errors.length ? t.errors.length + ' fel' : 'stillastående spel'));
      state.html = await fixGame(settings, 'astryx', state.html, t.errors.length ? t.errors : ['The canvas did not change after pressing Space and arrow keys – the game may not start or render.'], { thinking: hooks.thinking }, signal);
    }
    const tm = state.html.match(/<title>([^<]{1,80})<\/title>/i);
    return { html: state.html, title: tm ? tm[1].trim() : null, summary: 'Astryx skrev spelet, testkörde det ' + state.runs + ' gång' + (state.runs > 1 ? 'er' : '') + ' och rättade det som behövdes.', turns: state.runs, runs: state.runs, model: settings.openaiModels.astryx };
  }

  // ------------------------------------------------------------------ Astryx 5 Pro, Godot mode
  // Everything Astryx knows about Godot beyond the base model lives here and in the
  // lessons it saves after each run (see save_lesson) – that is how it is trained.
  const GODOT_GUIDE = `You are Nexora Astryx 5 Pro in Godot mode: an autonomous game studio of one. You build a complete, polished game in Godot 4.7 (GDScript 2) inside a project folder on the user's computer, working for as long as the time budget allows (often an hour or more). Quality matters more than speed.

# How you work
- Python is your hands: run_python executes a Python 3 script with the project folder as working directory. Use it to write project.godot, scenes, GDScript, generated levels and data. write_file is fine for single files.
- godot_run is your eyes: it imports the project, runs the main scene for ~9 s of game time while pressing every InputMap action, and returns errors plus three screenshots. Look at them critically, like a player would.
- Loop: design → build the smallest playable core → godot_run → fix → add one feature → godot_run → … → polish → final godot_run → save_lesson (new pitfalls only) → finish.
- Start with a short design.md (goal, controls, loop, win/lose, art direction, feature list). Tick features off as you go.
- Never finish with errors in the last godot_run or with screenshots that show a blank or broken screen.

# Project rules
- project.godot: config_version=5; [application] config/name, run/main_scene="res://main.tscn", config/features=PackedStringArray("4.7", "Forward Plus"); [display] window/size/viewport_width=1280, viewport_height=720.
- Keep .tscn files tiny (a root node + script). Build the rest in code – hand-written .tscn is the #1 source of load errors. If you write one: [gd_scene load_steps=N format=3], ext_resource ids are strings, load_steps = resources + 1.
- Define input in code at startup (InputMap.add_action / action_add_event with InputEventKey.physical_keycode = KEY_W …). The tester presses every action in InputMap, so every action must do something sensible.
- The game must start playing within ~2 s or on any action (no mouse-only menus). Restart with get_tree().reload_current_scene().
- Never touch _nexora/ (Nexora's test probe) and don't delete project files you did not create.

# GDScript 2 / Godot 4 (the classic mistakes)
- Tabs for indentation, never mixed with spaces. Typed code: var speed := 5.0, func f(x: int) -> void.
- @export, @onready, @tool; signals: button.pressed.connect(_on_pressed); await get_tree().create_timer(1.0).timeout (no yield).
- Renamed APIs: Spatial→Node3D, KinematicBody→CharacterBody3D (velocity property, move_and_slide() without args, is_on_floor() after it), instance()→instantiate(), rand_range→randf_range, deg2rad→deg_to_rad, OS.get_ticks_msec→Time.get_ticks_msec, change_scene→change_scene_to_file, PoolStringArray→PackedStringArray, Engine.editor_hint→Engine.is_editor_hint(), get_world()→get_world_3d(), translation→position.
- := cannot infer from a Variant (e.g. a Dictionary value) – write var x: float = d.value.
- Colors: Color("#rrggbb"); vectors are value types; Array[Node3D] typed arrays.
- UI: CanvasLayer → Control/Label; font size via add_theme_font_size_override("font_size", 28).
- Sound without files: AudioStreamGenerator + push_frame, or build an AudioStreamWAV from a PackedByteArray.
- Many identical objects: MultiMeshInstance3D. Physics: StaticBody3D/CharacterBody3D/Area3D + CollisionShape3D with a Shape3D resource.`;

  const HYPERREAL_GUIDE = `

# Hyperrealistic mode
The user paid for photorealism. Build the world from real photoscanned CC0 assets from Poly Haven:
- search_assets (English keywords, several searches: hero props, nature, architecture) → download_asset. type models → glTF (real-world scale in metres), hdris → .hdr sky, textures → PBR maps (albedo/normal/roughness/ao).
- Use 2k resolution by default, 4k only for the hero asset; 4–10 models, 1 HDRI, 1–3 ground/surface textures.
- Downloaded glTFs load as PackedScene after import: (load("res://assets/polyhaven/<id>/<file>.gltf") as PackedScene).instantiate(). Run godot_run once right after downloading so everything is imported.
- Scatter vegetation/rocks with MultiMeshInstance3D using a mesh taken from the glTF (find_children("*", "MeshInstance3D")[0].mesh); vary scale and rotation; add collisions only where the player can reach.
- WorldEnvironment: PanoramaSkyMaterial with the HDRI, background BG_SKY, ambient + reflections from sky, tonemap_mode = TONE_MAPPER_AGX, sdfgi_enabled, ssao_enabled, ssil_enabled, ssr_enabled, glow_enabled, volumetric_fog_enabled (low density). DirectionalLight3D matching the HDRI sun, shadows on, directional_shadow_max_distance ~120.
- Materials: StandardMaterial3D with albedo_texture, normal_enabled + normal_texture, roughness_texture, ao; uv1_scale or uv1_triplanar for large surfaces.
- project.godot [rendering]: anti_aliasing/quality/msaa_3d=2 and anti_aliasing/quality/use_taa=true. Camera: CameraAttributesPractical, subtle DOF.
- Keep the gameplay first: realism must not make the game unplayable or slow. Credits for every asset are written to assets/polyhaven/CREDITS.md automatically.`;

  const GODOT_TOOLS = [
    { name: 'run_python', eager_input_streaming: true,
      description: 'Run a Python 3 script (standard library only) with the project folder as working directory. Use it to create or change project files. No network, no subprocesses, no files outside the project. Returns exit code, stdout and stderr.',
      input_schema: { type: 'object', properties: { purpose: { type: 'string', description: 'One short sentence in Swedish shown to the user' }, code: { type: 'string' } }, required: ['purpose', 'code'] } },
    { name: 'write_file', eager_input_streaming: true,
      description: 'Write one text file in the project (path relative to the project or res://...). Overwrites.',
      input_schema: { type: 'object', properties: { path: { type: 'string' }, content: { type: 'string' } }, required: ['path', 'content'] } },
    { name: 'read_file', description: 'Read a text file from the project.',
      input_schema: { type: 'object', properties: { path: { type: 'string' } }, required: ['path'] } },
    { name: 'list_files', description: 'List the project files with sizes.', input_schema: { type: 'object', properties: {}, required: [] } },
    { name: 'godot_run',
      description: 'Import the project and run the main scene for about 9 seconds of game time while pressing every InputMap action. Returns errors, whether the run completed, and up to three screenshots.',
      input_schema: { type: 'object', properties: {}, required: [] } },
    { name: 'search_assets', hyperreal: true,
      description: 'Search Poly Haven (CC0, photoscanned, hyperrealistic). type: models, hdris or textures. Query with English keywords. Returns ids, names, tags and polycounts.',
      input_schema: { type: 'object', properties: { query: { type: 'string' }, type: { type: 'string', enum: ['models', 'hdris', 'textures'] } }, required: ['query', 'type'] } },
    { name: 'download_asset', hyperreal: true,
      description: 'Download a Poly Haven asset into the project. Returns res:// paths (glTF for models, .hdr for hdris, map paths for textures).',
      input_schema: { type: 'object', properties: { id: { type: 'string' }, type: { type: 'string', enum: ['models', 'hdris', 'textures'] }, resolution: { type: 'string', enum: ['1k', '2k', '4k'] } }, required: ['id', 'type'] } },
    { name: 'save_lesson',
      description: 'Save one short, general lesson for future Astryx runs: a Godot/GDScript pitfall you actually hit and how to avoid it. Not project-specific. Use sparingly.',
      input_schema: { type: 'object', properties: { lesson: { type: 'string' } }, required: ['lesson'] } },
    { name: 'finish',
      description: 'Finish when the game is complete, the last godot_run had no errors and the screenshots look right. The summary (Swedish, 2–4 sentences) is shown to the player.',
      input_schema: { type: 'object', properties: { summary: { type: 'string' } }, required: ['summary'] } },
  ];

  function godotValidate(name, i) {
    if (!i || typeof i !== 'object') return 'input is not an object';
    const need = { run_python: ['code'], write_file: ['path', 'content'], read_file: ['path'], search_assets: ['query', 'type'], download_asset: ['id', 'type'], save_lesson: ['lesson'], finish: ['summary'] }[name] || [];
    for (const k of need) if (!isStr(i[k]) || (k !== 'content' && !i[k].length)) return name + ' needs a string `' + k + '`';
    return null;
  }

  function godotPrompt(prompt, opts) {
    return ['Game idea: ' + prompt, '',
      'Engine: Godot 4.7 (GDScript). 3D unless the idea is clearly 2D. All player-facing text in Swedish.',
      'Time budget: up to ' + opts.maxMinutes + ' minutes of work. Use it to build, test and improve – but finish before it runs out.',
      opts.hyperreal ? 'HYPERREALISTIC MODE is on: build the world from photoscanned Poly Haven models, an HDRI sky and PBR textures that fit the idea.' : 'Art style: stylised and colourful, built from primitives and procedural materials.',
    ].concat((opts.features || []).map(k => FEATURE_TEXT[k]).filter(Boolean).map(t => t.replace(/Web Audio/g, 'Godot audio'))).join('\n');
  }

  // exec(name, input) runs a tool on the desktop and returns tool_result content.
  async function agentGodot(settings, prompt, opts, hooks, signal) {
    if (!settings.anthropicKey) throw apiError('Godot-läget med Claude kräver en Anthropic API-nyckel. Utan nyckel bygger Nexora Local spelet offline.');
    const started = Date.now(), limitMs = (opts.maxMinutes || 120) * 60000;
    const tools = GODOT_TOOLS.filter(t => opts.hyperreal || !t.hyperreal).map(t => { const c = Object.assign({}, t); delete c.hyperreal; return c; });
    const lessons = (opts.lessons || []).slice(-40);
    const system = GODOT_GUIDE + (opts.hyperreal ? HYPERREAL_GUIDE : '') + (lessons.length ? '\n\n# Lessons from earlier Astryx runs\n' + lessons.map(l => '- ' + l).join('\n') : '');
    const conf = { system, tools, spec: ANTHROPIC.astryxGodot, betas: ['context-management-2025-06-27'], extra: { context_management: { edits: [{ type: 'clear_tool_uses_20250919' }] } } };
    const messages = [{ role: 'user', content: godotPrompt(prompt, opts) }];
    const st = { runs: 0, cleanRuns: 0, turns: 0, summary: null, lastShots: [], lessons: [], warned: false, idle: 0 };
    for (st.turns = 1; st.turns <= 400; st.turns++) {
      const turn = await agentTurn(settings, messages, hooks, signal, conf);
      messages.push({ role: 'assistant', content: turn.content });
      const elapsed = Date.now() - started;
      if (!turn.calls.length) {
        if (st.summary || elapsed > limitMs || ++st.idle > 2) break;
        messages.push({ role: 'user', content: 'Fortsätt med verktygen. Kör godot_run och avsluta med finish när spelet är klart och testat.' });
        continue;
      }
      st.idle = 0;
      const results = [];
      let done = false;
      for (const c of turn.calls) {
        const r = { type: 'tool_result', tool_use_id: c.id };
        const bad = c._bad != null ? JSON.stringify({ INVALID_JSON: c._bad.slice(0, 2000) }) : godotValidate(c.name, c.input);
        if (bad) { r.is_error = true; r.content = bad; results.push(r); continue; }
        if (c.name === 'finish') {
          if (!st.runs) { r.is_error = true; r.content = 'Run godot_run before finishing.'; }
          else { st.summary = c.input.summary; r.content = 'Done.'; done = true; }
        } else if (c.name === 'save_lesson') {
          st.lessons.push(c.input.lesson.slice(0, 300)); hooks.lesson && hooks.lesson(c.input.lesson.slice(0, 300)); r.content = 'Saved.';
        } else {
          try {
            const out = await hooks.exec(c.name, c.input);
            if (c.name === 'godot_run') { st.runs++; if (out.ok) st.cleanRuns++; st.lastShots = out.shots || []; }
            r.content = out.content; if (out.is_error) r.is_error = true;
          } catch (e) { r.is_error = true; r.content = String(e.message || e); }
        }
        results.push(r);
      }
      // Time: tell Astryx how much is left; stop hard at the limit.
      const left = Math.round((limitMs - (Date.now() - started)) / 60000);
      if (!done && left <= Math.max(3, (opts.maxMinutes || 120) * 0.15) && !st.warned) {
        st.warned = true;
        results.push({ type: 'text', text: '⏱ About ' + Math.max(0, left) + ' minutes of the time budget remain. Stop adding features: fix what is broken, run godot_run once more, save lessons and call finish.' });
      }
      messages.push({ role: 'user', content: results });
      if (done) break;
      if (Date.now() - started > limitMs + 5 * 60000) break;
    }
    if (!st.runs) throw apiError('Astryx hann inte testa något spel. Försök igen.');
    return { summary: st.summary || 'Astryx arbetade tills tiden tog slut. Spelet testkördes ' + st.runs + ' gånger.', runs: st.runs, cleanRuns: st.cleanRuns, turns: st.turns, minutes: Math.round((Date.now() - started) / 60000), lessons: st.lessons, shots: st.lastShots, model: ANTHROPIC.astryxGodot.model };
  }

  window.NexoraAI = { MODELS, ROLLOUT, ANTHROPIC, DEFAULT_SETTINGS, GAME_SYSTEM, AGENT_TOOLS, GODOT_TOOLS, GODOT_GUIDE, gamePrompt, generateGame, fixGame, text, image, mesh, agent, agentGodot, extractHtml };
})();

</script>
<script>
/* Nexora app: routing, plans and limits, Studio, tools, library, export. */
(function () {

    async function runAstryx(prompt, features, stepEl, log) {

    // Astryx on Nexora Local: the same build → test → fix loop, with the offline generator doing the writing.
    async function localAgent(prompt, features, hooks) {
      const opts = { dim: st.dim, music: features.includes('music'), sfx: true, multiplayer: features.includes('multiplayer'), quests: true, allowOpenWorld: can('openworld') && st.dim === '2d' };
      let cfg = L.config(prompt, Object.assign({ variant: st.variant || '' }, opts));
      hooks.thinking('Det här låter som ett ' + cfg.genreLabel.toLowerCase() + ' med ' + cfg.tagline.split('· ')[1].toLowerCase() + '. Jag bygger det, testkör det och justerar tills det fungerar.');
      await pause(500);
      let html, t, runs = 0, fixes = 0;
      for (let attempt = 0; attempt < 3; attempt++) {
        hooks.step('tool_start', 'write_game'); await pause(350);
        html = L.buildHtml(cfg, RT); hooks.step('write', Math.round(html.length / 1000) + ' kB');
        hooks.step('tool_start', 'run_game'); hooks.step('run');
        t = await hooks.runGame(html); runs++;
        hooks.step('ran', (t.errors.length ? t.errors.length + ' fel' : 'inga fel') + (t.animating ? ', spelet rör sig' : ', spelet står still'));
        if (!t.errors.length && t.animating) break;
        if (attempt === 2) break;
        fixes++;
        hooks.step('tool_start', 'edit_game');
        hooks.step('edit', t.errors.length ? t.errors[0].slice(0, 80) : 'spelet stod still – bygger en ny variant');

  async function getLessons() {
    if (!lessonsCache) lessonsCache = DESK ? await DESK.call('lessons').catch(() => []) : store.get('lessons', []);
    return lessonsCache;
  }
  async function addLesson(text) {
    const ls = await getLessons();
    if (ls.some(l => l.text === text)) return;
    ls.push({ text, t: Date.now() });
    if (DESK) await DESK.call('saveLessons', { lessons: ls }).catch(() => {}); else store.set('lessons', ls);
  }

  // Poly Haven search terms per theme, for Nexora Local's hyperrealistic builds.
  const THEME_ASSETS = {
    Skog: { models: ['tree', 'fern', 'rock', 'log', 'stump'], hdri: 'forest', tex: 'forest ground' },
    Öken: { models: ['rock', 'cactus', 'barrel', 'crate'], hdri: 'desert', tex: 'sand' },
    Is: { models: ['pine', 'rock', 'boulder'], hdri: 'snow', tex: 'snow' },
    Hav: { models: ['rock', 'boat', 'barrel', 'crate'], hdri: 'sea', tex: 'sand' },
    Lava: { models: ['rock', 'boulder', 'stone'], hdri: 'sunset', tex: 'rock' },
    Skräck: { models: ['dead tree', 'lantern', 'gravestone', 'rock'], hdri: 'night', tex: 'forest ground' },
    Neon: { models: ['barrel', 'crate', 'bench', 'lamp'], hdri: 'night city', tex: 'asphalt' },
    Godis: { models: ['flower', 'tree', 'rock'], hdri: 'sunny', tex: 'grass' },
    Rymd: { models: ['rock', 'boulder', 'stone'], hdri: 'night', tex: 'rock' },
    Nexora: { models: ['tree', 'rock', 'barrel', 'crate'], hdri: 'sky', tex: 'grass' },
  };
  // Training set: varied briefs that exercise different Godot skills.
  const BENCH = [
    'Ett 3D-plattformsspel på flytande öar med rörliga plattformar och checkpoints',
    'Ett top-down 2D-skjutspel i en rymdstation med vågor av fiender och uppgraderingar',

  async function ensureDesktopReady(j) {
    const info = await DESK.call('info');
    if (!info.python) throw new Error('Python 3 hittades inte på datorn. Installera det från python.org (kryssa i "Add to PATH" på Windows) och starta om Nexora.');
    if (!store.get('godotConsent', false)) {
      const ok = await DESK.call('confirm', { title: 'Astryx 5 Pro', ok: 'Godkänn', message: 'Låt Astryx köra kod på den här datorn?',
        detail: 'I Godot-läget skriver Astryx Python-skript och kör dem, och startar Godot för att testa spelet. Koden körs i projektmappen (' + info.projects + ') och spärras från nätverk, andra program och filer utanför projektet.' });
      if (!ok.ok) throw new Error('Du godkände inte att Astryx kör kod på datorn.');
      store.set('godotConsent', true);
    }
    if (!info.godot.path) {
      jobLog(j, '⬇️ Laddar ner Godot ' + info.godot.version + ' (engångsnedladdning, ~80–170 MB)…');
      const off = watchDownloads(j);
      try { await DESK.call('installGodot'); } finally { off(); }
      jobLog(j, '✅ Godot installerat', 'ok');
    }
    return info;
  }
  function watchDownloads(j) {
    let last = 0;
    const f = ev => {
      if (ev.type === 'download' && (ev.done || Date.now() - last > 1500)) {
        last = Date.now();
        j.phase = '⬇️ ' + ev.what + ' ' + (ev.total ? Math.round(ev.got / ev.total * 100) + ' %' : Math.round(ev.got / 1e6) + ' MB');
        jobChanged(j);
      } else if (ev.type === 'status') { j.phase = ev.text; jobChanged(j); }
    };
    deskListeners.add(f);
    return () => deskListeners.delete(f);
  }

  // Runs one Astryx tool on the desktop; returns tool_result content for the agent.
  async function execTool(j, name, input) {
    const P = j.project;
    if (name === 'run_python') {
      jobLog(j, '🐍 ' + (input.purpose || 'Kör Python'));
      const r = await DESK.call('runPython', { project: P, code: input.code, timeout: 240 });
      if (r.exit !== 0) jobLog(j, '⚠️ Python: ' + lastLine(r.stderr || r.stdout), 'warn');
      return { content: JSON.stringify({ exit: r.exit, stdout: r.stdout, stderr: r.stderr, timedOut: r.timedOut }), is_error: r.exit !== 0 };
    }
    if (name === 'write_file') {
      const w = await DESK.call('writeFile', { project: P, file: input.path, content: input.content });
      jobLog(j, '📝 ' + input.path + ' (' + Math.round(w.bytes / 100) / 10 + ' kB)');
      return { content: 'Wrote ' + w.bytes + ' bytes to ' + input.path };
    }
    if (name === 'read_file') { const r = await DESK.call('readFile', { project: P, file: input.path }); return { content: r.content != null ? r.content : r.error, is_error: r.content == null }; }
    if (name === 'list_files') return { content: JSON.stringify((await DESK.call('listFiles', { project: P })).files) };
    if (name === 'godot_run') {
      jobLog(j, '▶️ Importerar och testkör i Godot…');
      j.phase = '▶️ Testkör i Godot';
      const g = await DESK.call('godotRun', { project: P });
      j.runs = (j.runs || 0) + 1;
      if (g.shots.length) j.shots = g.shots.slice(-3).map(x => x.jpeg);
      jobLog(j, g.ok ? '✅ Testkörning ' + j.runs + ': inga fel' : '🐞 Testkörning ' + j.runs + ': ' + g.errors.length + ' fel', g.ok ? 'ok' : 'warn');
      g.errors.slice(0, 3).forEach(e => jobLog(j, '   ' + e.slice(0, 200), 'err'));
      const text = JSON.stringify({ ok: g.ok, completed: g.frames > 0, frames: g.frames, errors: g.errors, screenshots: g.shots.length, windowed: g.windowed, log_tail: (g.log || '').slice(-2500) });
      return { content: [{ type: 'text', text }].concat(g.shots.map(x => ({ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: x.jpeg } }))) };
    }
    if (name === 'search_assets') {
      jobLog(j, '🔎 Söker ' + ({ models: 'modeller', hdris: 'HDRI-himlar', textures: 'texturer' }[input.type] || input.type) + ': "' + input.query + '"');
      const r = await DESK.call('searchAssets', { query: input.query, type: input.type, limit: 10 });
      return { content: JSON.stringify(r) };
    }
    if (name === 'download_asset') {
      jobLog(j, '⬇️ Laddar ner ' + input.id + ' (' + (input.resolution || '2k') + ')');
      const off = watchDownloads(j);
      try {
        const d = await DESK.call('downloadAsset', { project: P, id: input.id, type: input.type, resolution: input.resolution || '2k' });
        (j.assets = j.assets || []).push(input.id);
        return { content: JSON.stringify(d) };
      } finally { off(); }
    }
    throw new Error('okänt verktyg ' + name);
  }

  // Astryx on Nexora Local: plan → (assets) → Python writes the project → Godot test → fix.
  async function localGodotAgent(j) {
    const a = L.config(j.prompt, { dim: '3d', variant: String(j.started) });
    const themeName = a.tagline.split('· ')[1].replace('-tema', '');
    const cfg = { title: a.title, tagline: a.genreLabel.replace('3D-', '') + ' · ' + themeName, seed: a.seed % 2147483647, difficulty: a.difficulty, palette: a.palette, hyperreal: j.hyperreal, models: [], hdri: '', ground_maps: {} };
    jobLog(j, '🧠 Plan: tredjepersonsspel i 3D, ' + themeName.toLowerCase() + '-tema, samla kulor och undvik jägare' + (j.hyperreal ? ', fotorealistisk värld' : ''), 'think');
    if (j.hyperreal) {
      const T = THEME_ASSETS[themeName] || THEME_ASSETS.Nexora, taken = new Set();
      const find = async (query, type) => {
        const r = JSON.parse((await execTool(j, 'search_assets', { query, type })).content).results;
        return r.find(x => !taken.has(x.id));
      };
      try {
        for (const q of T.models) {
          if (cfg.models.length >= 4) break;
          const hit = await find(q, 'models');
          if (!hit) continue;
          taken.add(hit.id);
          cfg.models.push(JSON.parse((await execTool(j, 'download_asset', { id: hit.id, type: 'models', resolution: '2k' })).content).path);
        }
        const sky = await find(T.hdri, 'hdris');
        if (sky) cfg.hdri = JSON.parse((await execTool(j, 'download_asset', { id: sky.id, type: 'hdris', resolution: '2k' })).content).path;
        const tex = await find(T.tex, 'textures');
        if (tex) cfg.ground_maps = JSON.parse((await execTool(j, 'download_asset', { id: tex.id, type: 'textures', resolution: '2k' })).content).maps;
      } catch (e) {
        jobLog(j, '⚠️ Kunde inte hämta alla assets (' + e.message + ') – bygger med det som finns', 'warn');
      }
    }
    const build = async () => {
      await execTool(j, 'write_file', { path: 'nexora_build.json', content: JSON.stringify(cfg, null, 1) });
      const r = await execTool(j, 'run_python', { purpose: 'Skriver Godot-projektet (project.godot, main.tscn, main.gd)', code: "import runpy, sys\nsys.argv = ['nexora_godot_local.py', 'nexora_build.json']\nrunpy.run_path('_nexora/nexora_godot_local.py', run_name='__main__')\n" });
      if (r.is_error) throw new Error('Python-steget misslyckades: ' + lastLine(JSON.parse(r.content).stderr));
      return JSON.parse((await execTool(j, 'godot_run', {})).content[0].text);
    };
    let t = await build();
    if (!t.ok && cfg.models.length) {
      jobLog(j, '🔧 Fel vid testkörning – bygger om utan de nedladdade modellerna');
      cfg.models = [];
      t = await build();
    }
    if (!t.ok) throw new Error('Godot-projektet fick fel vid testkörning: ' + (t.errors[0] || 'okänt'));
    return { title: cfg.title, summary: 'Astryx byggde "' + cfg.title + '" i Godot 4.7 (' + (j.hyperreal ? 'fotorealistisk värld med ' + cfg.models.length + ' Poly Haven-modeller' + (cfg.hdri ? ', HDRI-himmel' : '') + (cfg.ground_maps.albedo ? ' och PBR-mark' : '') : 'stiliserad 3D') + ') och testkörde det ' + j.runs + ' gång' + (j.runs > 1 ? 'er' : '') + ' utan fel. Samla alla kulor innan tiden tar slut.' };
  }

  function refund(j) {
    if (!j.charge) return;
    if (j.charge.credits) addCredits(j.charge.credits, 'Återbetalning: ' + j.title);
    else if (j.charge.quota) { S.usage[month()] = Math.max(0, used() - 1); store.set('usage', S.usage); }
    j.charge = null;
  }

  function startGodotJob(o) {
    const j = { id: 'j' + Date.now().toString(36), title: o.prompt.slice(0, 70), prompt: o.prompt, status: 'running', started: Date.now(), minutes: o.minutes || 120,
      hyperreal: !!o.hyperreal, training: !!o.training, features: o.features || [], log: [], shots: [], runs: 0, provider: S.settings.provider, charge: o.charge || null, phase: 'Startar…' };
    if (j.charge && j.charge.credits) addCredits(-j.charge.credits, (j.hyperreal ? 'Astryx hyperrealistiskt: ' : 'Astryx Godot: ') + j.title);
    if (j.charge && j.charge.quota) { S.usage[month()] = used() + 1; store.set('usage', S.usage); }
    JOBS.unshift(j);
    jobLog(j, '🤖 Astryx 5 Pro startar' + (j.provider === 'anthropic' ? ' (Claude, upp till ' + j.minutes + ' min)' : ' (Nexora Local)') + (j.hyperreal ? ' · 📸 hyperrealistiskt' : ''));
    if (!o.quiet) { render.topOnly(); if (location.hash !== '#astryx') location.hash = 'astryx'; }
    const ctl = new AbortController();
    liveCtl[j.id] = ctl;
    const run = (async () => {
      try {
        await ensureDesktopReady(j);
        const proj = await DESK.call('createProject', { name: o.prompt.slice(0, 30) });
        j.project = proj.id; j.dir = proj.dir;
        jobLog(j, '📁 Projekt: ' + proj.dir);
        let r;
        if (j.provider === 'anthropic') {
          const thinkLine = { cur: null };
          const hooks = {
            exec: (name, input) => execTool(j, name, input),
            step: (kind, detail) => { thinkLine.cur = null; if (kind === 'tool_start') { j.phase = ({ run_python: '🐍 Skriver Python', write_file: '📝 Skriver fil', godot_run: '▶️ Testkör i Godot', search_assets: '🔎 Söker assets', download_asset: '⬇️ Laddar ner', finish: '✅ Avslutar', save_lesson: '🎓 Sparar lärdom' }[detail] || detail) + '…'; jobChanged(j); } },
            thinking: t => { if (!thinkLine.cur) { thinkLine.cur = { t: Date.now(), text: '💭 ', kind: 'think' }; j.log.push(thinkLine.cur); } thinkLine.cur.text += t; jobChanged(j); },
            progress: (tool, n) => { j.phase = (tool === 'run_python' ? '🐍 Skriver Python… ' : '📝 Skriver fil… ') + Math.round(n / 1000) + ' kB'; jobChanged(j); },
            lesson: l => { addLesson(l); jobLog(j, '🎓 Lärdom sparad: ' + l, 'ok'); },
          };
          r = await AI.agentGodot(S.settings, o.prompt, { maxMinutes: j.minutes, hyperreal: j.hyperreal, features: j.features, lessons: (await getLessons()).map(l => l.text) }, hooks, ctl.signal);
          try { const pg = await DESK.call('readFile', { project: j.project, file: 'project.godot' }); const m = /config\/name="([^"]+)"/.exec(pg.content || ''); if (m) r.title = m[1]; } catch (e) { /* keep prompt title */ }
        } else {
          r = await localGodotAgent(j);
        }
        j.status = 'done'; j.summary = r.summary; j.title = r.title || j.title; j.phase = '✅ Klar';
        jobLog(j, '✅ Klart efter ' + fmtDur(Date.now() - j.started) + ' och ' + j.runs + ' testkörning' + (j.runs === 1 ? '' : 'ar'), 'ok');
        const now = Date.now();
        await games.put({ id: 'g' + now.toString(36), type: 'godot', project: j.project, dir: j.dir, title: j.title, prompt: o.prompt, summary: j.summary, thumb: j.shots[j.shots.length - 1] || null,
          model: 'astryx', engine: 'Godot 4.7 · ' + (j.provider === 'anthropic' ? 'Claude' : 'Nexora Local'), hyperreal: j.hyperreal, dim: '3d', genre: j.hyperreal ? 'Godot · hyperrealistiskt' : 'Godot-spel', created: now, updated: now, versions: [] });
        DESK.call('notify', { title: '🤖 Astryx är klar', body: j.title }).catch(() => {});
      } catch (e) {
        const aborted = e.name === 'AbortError' || ctl.signal.aborted;
        j.status = aborted ? 'cancelled' : 'failed'; j.error = e.message; j.phase = aborted ? 'Avbruten' : 'Misslyckades';
        jobLog(j, (aborted ? '⏹ Avbruten' : '❌ ' + e.message), 'err');
        const paid = !!j.charge;
        refund(j);
        if (paid) jobLog(j, '↩️ Kostnaden återbetalades', 'ok');
      } finally {
        j.ended = Date.now(); delete liveCtl[j.id]; jobChanged(j); render.topOnly();
      }
    })();
    j._promise = run;
    return j;
  }

  async function runTraining(n) {
    if (S.settings.provider !== 'anthropic') return toast('Träning kräver Claude (Anthropic-nyckel) – Nexora Local lär sig inte.', 5000);
    const picks = BENCH.slice().sort(() => Math.random() - 0.5).slice(0, n);
    toast('Träningspass startat: ' + n + ' spel à 20 min');
    for (const p of picks) {
      const j = startGodotJob({ prompt: p, minutes: 20, training: true, quiet: true });
      await j._promise;
      if (j.status === 'cancelled') break;
    }
    toast('Träningspasset är klart');
  }

  function godotExportModal(g) {
    const out = h('div', { class: 'small muted' });
    const off = DESK.on(ev => { if (ev.type === 'download') out.textContent = '⬇️ ' + ev.what + ' ' + (ev.total ? Math.round(ev.got / ev.total * 100) + ' %' : ''); if (ev.type === 'status') out.textContent = ev.text; });
    const doExport = async (target, label) => {
      try {
        const info = await DESK.call('info');
        if (!info.godot.templates) {
          const ok = await DESK.call('confirm', { title: 'Exportmallar', ok: 'Ladda ner', message: 'Godots exportmallar behövs (engångsnedladdning, ca 1,3 GB).', detail: 'De används för att bygga .exe, macOS-appar, Linux-program och webbversioner av dina Godot-spel.' });
          if (!ok.ok) return;
          out.textContent = 'Laddar ner exportmallar…';
          await DESK.call('installTemplates');
        }
        out.textContent = 'Exporterar ' + label + '…';
        const r = await DESK.call('godotExport', { project: g.project, target });
        if (!r.ok) { out.textContent = '❌ ' + (r.errors || []).join(' · ').slice(0, 400); return; }
        out.textContent = '✅ ' + label + ' klar (' + (r.size / 1e6).toFixed(1) + ' MB): ' + r.files.join(', ');
        DESK.call('reveal', { file: r.path });
      } catch (e) { out.textContent = '❌ ' + e.message; }
    };
    const close = modal([
      h('h2', null, '📦 Exportera ' + g.title),
      h('div', { class: 'col' }, [['windows', '🪟 Windows (.exe)'], ['macos', '🍎 macOS (.app i .zip)'], ['linux', '🐧 Linux'], ['web', '🌐 Webb (HTML5)']].map(([t, l]) =>
        h('button', { class: 'btn', onclick: () => doExport(t, l) }, l))),
      h('button', { class: 'btn', style: 'margin-top:8px', onclick: async () => { const r = await DESK.call('zipProject', { project: g.project, name: slug(g.title) }); out.textContent = '✅ ' + r.files + ' filer i ' + r.path; DESK.call('reveal', { file: r.path }); } }, '🗂️ Godot-projekt (.zip)'),
      out,
      h('div', { class: 'row' }, h('button', { class: 'btn ghost', onclick: () => { off(); close(); } }, 'Stäng'))]);
  }

        h('tr', null, h('td', null, 'AI'), h('td', null, S.settings.provider === 'anthropic' ? '✅ Claude – Astryx planerar, skriver och testar själv' : 'Nexora Local – snabb offlinebyggare. Lägg in en Anthropic-nyckel under ⚙️ för full agent.'))));

    function jobCard(j) {

    draw();
    const cloud = [['Privat molnlagring', 'Kräver Nexora Cloud'], ['Dedicated servrar', 'Kräver Nexora Cloud'], ['API-åtkomst', 'Kräver Nexora Cloud'], ['Realtidssynk i teamet', 'Kräver Nexora Cloud'], ['Delade projekt', 'Fungerar via projektfiler (.nexora.json)'], ['Versionshantering', 'Fungerar – upp till 30 versioner per spel']];
    if (tier() >= 4) cloud.push(['White Label', 'Byt namn/logga i byggkonfigurationen (nexora/build/build.py)'], ['Egen AI-modell', 'Träna i Colab och koppla in som Egen endpoint']);
    main.append(h('section', { class: 'wrap' }, h('h1', null, 'Team'),
      h('div', { class: 'grid g2' },
        h('div', { class: 'card col' }, h('h3', null, 'Medlemmar ' + (maxMembers === Infinity ? '(obegränsat)' : '(max ' + maxMembers + ')')), list,
          h('div', { class: 'row' }, nameIn, roleSel, h('button', { class: 'btn primary sm', onclick: () => {
            const n = nameIn.value.trim(); if (!n) return;
            if (S.team.length >= maxMembers) return upsell(null, 'Obegränsade teammedlemmar ingår i Enterprise.', 4);
            S.team.push({ name: n, role: roleSel.value }); store.set('team', S.team); nameIn.value = ''; draw();
          } }, 'Bjud in'))),
        h('div', { class: 'card col' }, h('h3', null, 'Status'), h('table', { class: 't' }, cloud.map(([a, b]) => h('tr', null, h('td', null, a), h('td', { class: /Kräver/.test(b) ? 'muted' : '' }, b)))),
          h('p', { class: 'note' }, 'Molnfunktionerna behöver en backend som inte är driftsatt i den här versionen. Teamlistan sparas lokalt; dela projekt genom att exportera "Nexora-projekt" och importera under Mina spel.')))));
  };

  // ---------------------------------------------------------------- downloads
  VIEWS['ladda-ner'] = main => {
    const base = REPO + '/raw/main/nexora/dist/';
    const dl = BUILD.downloads || [];
    const byId = id => dl.find(d => d.id === id);
    const card = (icon, title, sub, id, how) => {
      const d = byId(id);
      return h('div', { class: 'card col' }, h('div', { style: 'font-size:2rem' }, icon), h('h3', null, title), h('p', { class: 'muted small' }, sub),
        d ? h('a', { class: 'btn primary', href: base + d.file, download: d.file }, '⬇️ ' + d.file)
          : id === 'html' ? h('a', { class: 'btn primary', href: base + 'nexora-' + VERSION + '.html', download: 'nexora-' + VERSION + '.html' }, '⬇️ nexora-' + VERSION + '.html')
          : h('span', { class: 'muted small' }, 'Bygget finns inte i den här versionen.'),
        d && d.size ? h('div', { class: 'small muted' }, (d.size / 1e6).toFixed(1) + ' MB · SHA-256 ' + d.sha256.slice(0, 16) + '…') : null,
        h('div', { class: 'small' }, how));
    };
    main.append(h('section', { class: 'wrap' },
      h('h1', null, 'Ladda ner ', h('span', { class: 'grad' }, 'Nexora')),
      h('p', { class: 'muted' }, 'Version ' + VERSION + '. Samma app överallt – den fungerar offline och sparar dina spel på datorn.'),
      h('div', { class: 'grid g2' },
        card('🪟', 'Windows', 'Windows 10/11, 64-bit. Installerar Nexora för din användare (inga administratörsrättigheter behövs) med genväg på skrivbordet och i Start-menyn.', 'exe', h('span', null, 'Om SmartScreen varnar: ', h('b', null, 'Mer info → Kör ändå'), ' (appen är inte kodsignerad).')),
        card('🍎', 'macOS', 'macOS 12+ på Apple Silicon (M1–M4). Öppna DMG-filen och dra Nexora till Program.', 'dmg', h('span', null, 'Första gången: högerklicka på Nexora → ', h('b', null, 'Öppna'), ' (appen är inte notariserad).')),
        card('🐧', 'Linux', 'Debian, Ubuntu, Mint, Pop!_OS (x86-64).', 'deb', h('code', null, 'sudo apt install ./' + ((byId('deb') || {}).file || 'nexora.deb'))),
        card('🌐', 'Webb', 'Kör direkt i webbläsaren utan installation – det är den här sidan.', 'html', h('span', null, 'Kan även sparas som en fil och öppnas offline.')))));
  };

  // ---------------------------------------------------------------- settings
  function settingsModal() {
    const s = JSON.parse(JSON.stringify(S.settings));
    const prov = h('select', null, [['local', 'Nexora Local – offline, gratis'], ['anthropic', 'Anthropic (Claude) – egen API-nyckel'], ['openai', 'Egen endpoint (OpenAI-kompatibel) – t.ex. din Colab-modell']].map(([v, l]) => h('option', { value: v, selected: s.provider === v }, l)));
    const aKey = h('input', { type: 'password', placeholder: 'sk-ant-…', value: s.anthropicKey, autocomplete: 'off' });
    const oBase = h('input', { type: 'url', value: s.openaiBase }), oKey = h('input', { type: 'password', value: s.openaiKey, placeholder: 'valfri', autocomplete: 'off' });
    const oModels = Object.keys(AI.MODELS).map(k => { const i = h('input', { type: 'text', value: s.openaiModels[k] }); i.dataset.k = k; return i; });
    const oImg = h('input', { type: 'checkbox', checked: s.openaiImageApi });
    const aBox = h('div', { class: 'col' }, h('label', { class: 'f' }, 'Anthropic API-nyckel', aKey),
      h('p', { class: 'small muted' }, 'Skapa en nyckel på console.anthropic.com. Nyckeln sparas bara på den här enheten och skickas endast till api.anthropic.com.'));
    const oBox = h('div', { class: 'col' }, h('label', { class: 'f' }, 'Bas-URL', oBase), h('label', { class: 'f' }, 'API-nyckel', oKey),
      h('div', { class: 'grid', style: 'grid-template-columns:1fr 1fr;gap:8px' }, oModels.map(i => h('label', { class: 'f small' }, AI.MODELS[i.dataset.k].name, i))),
      h('label', { class: 'opt' }, oImg, 'Image 1 använder /images/generations'),
      h('p', { class: 'small muted' }, 'Fungerar med OpenAI, vLLM, Ollama (http://localhost:11434/v1), LM Studio och modellen från Colab-anteckningsboken.'));
    const sync = () => { aBox.style.display = prov.value === 'anthropic' ? '' : 'none'; oBox.style.display = prov.value === 'openai' ? '' : 'none'; };
    prov.addEventListener('change', sync); sync();
    const close = modal([
      h('h2', null, '⚙️ Inställningar'),
      h('label', { class: 'f' }, 'AI-leverantör', prov), aBox, oBox,
      h('div', { class: 'row', style: 'margin-top:14px' },
        h('button', { class: 'btn primary', onclick: () => {
          s.provider = prov.value; s.anthropicKey = aKey.value.trim(); s.openaiBase = oBase.value.trim() || AI.DEFAULT_SETTINGS.openaiBase; s.openaiKey = oKey.value.trim(); s.openaiImageApi = oImg.checked;
          oModels.forEach(i => { s.openaiModels[i.dataset.k] = i.value.trim() || AI.DEFAULT_SETTINGS.openaiModels[i.dataset.k]; });
          if (s.provider === 'anthropic' && !s.anthropicKey) { toast('Fyll i API-nyckeln'); return; }
          S.settings = s; store.set('settings', s); close(); toast('Sparat'); render();
        } }, 'Spara'),
        h('button', { class: 'btn ghost', onclick: () => close() }, 'Avbryt'),
        h('button', { class: 'btn ghost danger', style: 'margin-left:auto', onclick: async () => {
          if (!confirm('Radera alla spel, assets och inställningar på den här enheten?')) return;
          try { localStorage.clear(); } catch (e) { /* ignore */ }
          try { (await db()).close(); indexedDB.deleteDatabase('nexora'); } catch (e) { /* ignore */ }
          location.reload();
        } }, 'Radera all data'))]);
  }

  render();
  window.Nexora = { S, PLANS, can, games, render, RT, testGame, released, COST, JOBS, startGodotJob, getLessons };
})();

</script>
</body>
</html>
