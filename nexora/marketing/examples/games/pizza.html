<!doctype html>
<html lang="sv"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pizzarusch</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#2b1a12;touch-action:none}canvas{display:block}</style>
</head><body><canvas id="c"></canvas>
<script>
"use strict";
// Pizzarusch – laga pizzor åt otåliga kunder i en food truck.
// Vänster/höger väljer ingrediens, mellanslag lägger pizzan i ugnen. Rätt pizza till rätt kund!
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const VW = 600, VH = 700;
let W, H, S, OX, OY;
function fit() {
  const d = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  S = Math.min(W / VW, H / VH); OX = (W - VW * S) / 2; OY = (H - VH * S) / 2; ctx.setTransform(d * S, 0, 0, d * S, d * OX, d * OY);
}
addEventListener('resize', fit); fit();

const TOPS = [
  { name: 'Margherita', sauce: '#d6452f', dots: '#fff4d6' },
  { name: 'Peppe', sauce: '#d6452f', dots: '#9e1b1b' },
  { name: 'Svamp', sauce: '#e0c38c', dots: '#7a5230' },
  { name: 'Grön', sauce: '#d6452f', dots: '#3fa34d' },
];
const SKIN = ['#f1c27d', '#c68642', '#8d5524', '#ffdbac', '#e0ac69'], SHIRT = ['#3a86ff', '#ff006e', '#8338ec', '#fb5607', '#06d6a0', '#ffbe0b'];
const keys = {}, demo = !!window.NEXORA_DEMO;
addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'KeyP' || e.code === 'Escape') paused = !paused; if (state !== 'play' && (e.code === 'Space' || e.code === 'Enter')) start(); if (/Arrow|Space/.test(e.code)) e.preventDefault(); });
addEventListener('keyup', e => { keys[e.code] = false; });
cv.addEventListener('pointerdown', e => {
  if (state !== 'play') return start();
  const x = (e.clientX - OX) / S;
  sel = Math.max(0, Math.min(3, Math.floor((x - 60) / 120))); bake();
});

let state = demo ? 'play' : 'title', paused = false, t = 0, score = 0, lives = 3, sel = 0, oven = [], custs, fx = [], spawnT, pressed = {}, aiT = 0;
function start() { state = 'play'; score = 0; lives = 3; custs = [null, null, null]; oven = []; fx = []; spawnT = 0.5; t = 0; if (demo) custs = [0, 1, 2].map(newCust); }
start(); if (!demo) state = 'title';

function newCust(i) { return { top: Math.floor(Math.random() * 4), pat: 1, rate: 0.07 + Math.random() * 0.05 + Math.min(0.08, t / 900), skin: SKIN[i * 7 % 5 + Math.floor(Math.random() * 2) % 5], shirt: SHIRT[Math.floor(Math.random() * 6)], bob: Math.random() * 6, in: 0 }; }
function bake() { if (oven.length < 3) { oven.push({ top: sel, p: 0 }); beep(300 + sel * 80, 0.08); } }
// Gamepad: stick/d-pad acts as the arrow keys, A as Space.
const pad = {};
function readPad() {
  const gp = navigator.getGamepads ? [...navigator.getGamepads()].find(Boolean) : null;
  const b = i => !!(gp && gp.buttons[i] && gp.buttons[i].pressed);
  pad.ArrowLeft = b(14) || (gp && gp.axes[0] < -0.5); pad.ArrowRight = b(15) || (gp && gp.axes[0] > 0.5); pad.Space = b(0);
}
function hit(code) { const on = !!(keys[code] || pad[code]), was = !!pressed[code]; pressed[code] = on; return on && !was; }

let ac = null;
function beep(f, d, type) {
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); const o = ac.createOscillator(), g = ac.createGain(); o.type = type || 'square'; o.frequency.value = f; g.gain.setValueAtTime(0.08, ac.currentTime); g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + d); o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + d); } catch (e) { /* no audio */ }
}

function update(dt) {
  t += dt; readPad();
  if (hit('ArrowLeft') || hit('KeyA')) sel = Math.max(0, sel - 1);
  if (hit('ArrowRight') || hit('KeyD')) sel = Math.min(3, sel + 1);
  if (hit('Space') || hit('Enter')) bake();
  if (demo) {
    aiT -= dt;
    const want = custs.map((c, i) => c ? { c, i } : null).filter(Boolean).filter(o => !oven.some(p => p.top === o.c.top) ).sort((a, b) => a.c.pat - b.c.pat)[0];
    if (want && aiT <= 0) { if (sel < want.c.top) sel++; else if (sel > want.c.top) sel--; else bake(); aiT = 0.3; }
  }
  spawnT -= dt;
  if (spawnT <= 0) { const free = custs.map((c, i) => c ? -1 : i).filter(i => i >= 0); if (free.length) { const i = free[Math.floor(Math.random() * free.length)]; custs[i] = newCust(i); } spawnT = demo ? 0.5 : Math.max(0.9, 2.6 - t * 0.02); }
  custs.forEach((c, i) => {
    if (!c) return;
    c.in = Math.min(1, c.in + dt * 3); c.pat -= c.rate * dt * (demo ? 0.8 : 1);
    if (c.pat <= 0) { custs[i] = null; lives--; fx.push({ x: 110 + i * 190, y: 150, txt: 'Arg kund!', col: '#ff5d5d', t: 1.2 }); beep(120, 0.3, 'sawtooth'); if (lives <= 0) { if (demo) start(); else state = 'over'; } }
  });
  oven.forEach(p => { p.p += dt / 0.9; });
  while (oven.length && oven[0].p >= 1) {
    const p = oven.shift(), i = custs.findIndex(c => c && c.top === p.top);
    if (i >= 0) { const c = custs[i], tip = Math.round(8 + c.pat * 12); score += tip; custs[i] = null; for (let k = 0; k < 7; k++) fx.push({ x: 110 + i * 190, y: 250, vx: (Math.random() - 0.5) * 220, vy: -150 - Math.random() * 160, coin: true, t: 1 }); fx.push({ x: 110 + i * 190, y: 150, txt: '+' + tip, col: '#ffd23f', t: 1 }); beep(880, 0.07); beep(1320, 0.12); }
    else fx.push({ x: 300, y: 420, txt: 'Ingen beställde den…', col: '#ffffffaa', t: 1 });
  }
  fx.forEach(f => { f.t -= dt; if (f.coin) { f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 500 * dt; } else f.y -= 30 * dt; });
  fx = fx.filter(f => f.t > 0);
}

function pizza(x, y, r, top, done) {
  ctx.fillStyle = '#e8b25c'; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  ctx.fillStyle = done === false ? '#f3d7a1' : TOPS[top].sauce; ctx.beginPath(); ctx.arc(x, y, r * 0.8, 0, 7); ctx.fill();
  if (done !== false) { ctx.fillStyle = '#ffe9a8'; for (let k = 0; k < 5; k++) { ctx.beginPath(); ctx.arc(x + Math.cos(k * 1.3) * r * 0.45, y + Math.sin(k * 1.3) * r * 0.45, r * 0.22, 0, 7); ctx.fill(); } }
  ctx.fillStyle = TOPS[top].dots;
  for (let k = 0; k < 6; k++) { ctx.beginPath(); ctx.arc(x + Math.cos(k * 2.4 + 0.5) * r * 0.5, y + Math.sin(k * 2.4 + 0.5) * r * 0.5, r * 0.14, 0, 7); ctx.fill(); }
}
function text(s, x, y, size, col, align) { ctx.font = '800 ' + size + 'px system-ui, sans-serif'; ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillText(s, x + 2, y + 2); ctx.fillStyle = col; ctx.fillText(s, x, y); }

function draw() {
  ctx.fillStyle = '#2b1a12'; ctx.fillRect(-OX / S, -OY / S, W / S, H / S);
  // street + sky behind the serving window
  const g = ctx.createLinearGradient(0, 0, 0, 330); g.addColorStop(0, '#ffb347'); g.addColorStop(1, '#ff6f61');
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, 330);
  ctx.fillStyle = '#6b3fa0'; for (let i = 0; i < 7; i++) ctx.fillRect(i * 95 - 10, 120 - (i % 3) * 30, 70, 220);
  ctx.fillStyle = '#ffd97a'; for (let i = 0; i < 7; i++) for (let j = 0; j < 4; j++) if ((i + j) % 3) ctx.fillRect(i * 95 + 2 + (j % 2) * 30, 140 - (i % 3) * 30 + j * 40, 16, 20);
  // customers
  custs.forEach((c, i) => {
    if (!c) return;
    const x = 110 + i * 190, y = 250 + (1 - c.in) * 120 + Math.sin(t * 6 + c.bob) * (c.pat < 0.3 ? 4 : 1.5);
    ctx.fillStyle = c.shirt; ctx.beginPath(); ctx.ellipse(x, y + 70, 52, 50, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = c.skin; ctx.beginPath(); ctx.arc(x, y, 38, 0, 7); ctx.fill();
    ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(x - 13, y - 4, 5, 0, 7); ctx.arc(x + 13, y - 4, 5, 0, 7); ctx.fill();
    ctx.strokeStyle = '#222'; ctx.lineWidth = 4; ctx.beginPath();
    if (c.pat > 0.5) ctx.arc(x, y + 10, 12, 0.2, Math.PI - 0.2); else { ctx.moveTo(x - 12, y + 18); ctx.lineTo(x + 12, y + 18); }
    ctx.stroke();
    if (c.pat < 0.35) { ctx.beginPath(); ctx.moveTo(x - 22, y - 20); ctx.lineTo(x - 6, y - 14); ctx.moveTo(x + 22, y - 20); ctx.lineTo(x + 6, y - 14); ctx.stroke(); }
    // order bubble + patience
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.roundRect(x - 50, y - 150, 100, 92, 18); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x - 10, y - 60); ctx.lineTo(x + 8, y - 60); ctx.lineTo(x, y - 44); ctx.fill();
    pizza(x, y - 110, 32, c.top);
    ctx.fillStyle = '#0003'; ctx.fillRect(x - 44, y - 64, 88, 8);
    ctx.fillStyle = c.pat > 0.5 ? '#3ddc97' : c.pat > 0.25 ? '#ffc542' : '#ff4d4d'; ctx.fillRect(x - 44, y - 64, 88 * Math.max(0, c.pat), 8);
  });
  // truck: counter, awning, bins, oven
  ctx.fillStyle = '#f7f1e3'; ctx.fillRect(0, 330, VW, 30);
  for (let i = 0; i < 12; i++) { ctx.fillStyle = i % 2 ? '#e63946' : '#fff'; ctx.beginPath(); ctx.moveTo(i * 50, 0); ctx.lineTo(i * 50 + 50, 0); ctx.lineTo(i * 50 + 50, 34); ctx.arc(i * 50 + 25, 34, 25, 0, Math.PI); ctx.fill(); }
  ctx.fillStyle = '#c0392b'; ctx.fillRect(0, 360, VW, 340);
  ctx.fillStyle = '#a93226'; for (let i = 0; i < 6; i++) ctx.fillRect(0, 380 + i * 56, VW, 6);
  ctx.fillStyle = '#8e9aaf'; ctx.fillRect(40, 420, 520, 110); ctx.fillStyle = '#b8c0cc'; ctx.fillRect(40, 420, 520, 14);
  TOPS.forEach((tp, i) => {
    const x = 120 + i * 120, y = 480;
    ctx.fillStyle = '#2d3142'; ctx.beginPath(); ctx.roundRect(x - 48, y - 40, 96, 80, 14); ctx.fill();
    pizza(x, y, 30, i);
    if (i === sel) { ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 6; ctx.beginPath(); ctx.roundRect(x - 54, y - 46, 108, 92, 18); ctx.stroke(); text('▼', x, y - 66 + Math.sin(t * 8) * 4, 26, '#ffd23f'); }
  });
  // oven
  ctx.fillStyle = '#3b3b3b'; ctx.beginPath(); ctx.roundRect(150, 560, 300, 120, 20); ctx.fill();
  const glow = ctx.createRadialGradient(300, 640, 10, 300, 640, 140); glow.addColorStop(0, '#ffb703'); glow.addColorStop(1, '#d62828');
  ctx.fillStyle = glow; ctx.beginPath(); ctx.roundRect(175, 590, 250, 70, 35); ctx.fill();
  oven.forEach((p, k) => { const x = 215 + k * 85 - (1 - Math.min(1, p.p * 4)) * 30; pizza(x, 625, 28, p.top, p.p > 0.6); ctx.fillStyle = '#fff'; ctx.fillRect(x - 28, 660, 56 * p.p, 6); });
  fx.forEach(f => {
    ctx.globalAlpha = Math.min(1, f.t * 2);
    if (f.coin) { ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.ellipse(f.x, f.y, 10, 10 * Math.abs(Math.cos(f.t * 12)), 0, 0, 7); ctx.fill(); }
    else text(f.txt, f.x, f.y, 28, f.col);
    ctx.globalAlpha = 1;
  });
  text('🍕 ' + score + ' kr', 20, 70, 30, '#fff', 'left');
  text('♥'.repeat(Math.max(0, lives)), VW - 20, 70, 30, '#ff4d6d', 'right');
  if (state !== 'play' || paused) {
    ctx.fillStyle = 'rgba(20,10,5,.72)'; ctx.fillRect(0, 0, VW, VH);
    text(paused ? 'PAUS' : state === 'over' ? 'Stängt för dagen!' : 'Pizzarusch', 300, 280, 54, '#ffd23f');
    text(paused ? 'P eller Esc för att fortsätta' : state === 'over' ? 'Du tjänade ' + score + ' kr' : 'Laga rätt pizza innan kunderna tröttnar', 300, 340, 22, '#fff');
    if (!paused) text('Vänster/höger väljer · Mellanslag bakar · Tryck för att spela', 300, 400, 17, '#ffffffcc');
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state === 'play' && !paused) update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body></html>
