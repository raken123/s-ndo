<style>
:root {
  --bg: #07071a;
  --bg2: #0e0d2b;
  --card: rgba(255, 255, 255, 0.045);
  --card2: rgba(255, 255, 255, 0.08);
  --line: rgba(255, 255, 255, 0.1);
  --text: #eeeefe;
  --muted: #a3a3c8;
  --a1: #7c5cff;
  --a2: #22d3ee;
  --a3: #ff4d8d;
  --ok: #3ddc97;
  --warn: #ffc542;
  --grad: linear-gradient(120deg, var(--a1), var(--a2));
  --r: 16px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
body { min-height: 100vh; background:
  radial-gradient(1200px 600px at 85% -10%, rgba(124, 92, 255, 0.22), transparent 60%),
  radial-gradient(900px 500px at -10% 20%, rgba(34, 211, 238, 0.12), transparent 60%), var(--bg); }
a { color: var(--a2); }
button, input, textarea, select { font: inherit; color: inherit; }
h1, h2, h3 { line-height: 1.15; margin: 0 0 0.4em; letter-spacing: -0.02em; }
h1 { font-size: clamp(2.2rem, 6vw, 4rem); font-weight: 850; }
h2 { font-size: clamp(1.5rem, 3.5vw, 2.2rem); font-weight: 800; }
h3 { font-size: 1.1rem; font-weight: 700; }
.grad { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 20px; }

/* top bar */
.top { position: sticky; top: 0; z-index: 20; backdrop-filter: blur(14px); background: rgba(7, 7, 26, 0.72); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 18px; height: 64px; }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 850; font-size: 1.25rem; letter-spacing: -0.02em; cursor: pointer; white-space: nowrap; }
.logo svg { width: 30px; height: 30px; }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs a { color: var(--muted); text-decoration: none; padding: 8px 12px; border-radius: 10px; white-space: nowrap; font-weight: 600; font-size: 0.93rem; }
nav.tabs a:hover { color: var(--text); background: var(--card); }
nav.tabs a.on { color: var(--text); background: var(--card2); }
.who { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--card2); border: 1px solid var(--line); font-size: 0.8rem; font-weight: 700; }
.pill.plan { background: var(--grad); color: #0b0b20; border: 0; cursor: pointer; }
.iconbtn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; cursor: pointer; }
.iconbtn:hover { background: var(--card2); }

/* buttons & forms */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--card2); cursor: pointer; font-weight: 700; text-decoration: none; color: var(--text); transition: transform 0.08s, background 0.15s; }
.btn:hover { background: rgba(255, 255, 255, 0.13); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--grad); color: #0b0b20; border: 0; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.big { padding: 14px 22px; font-size: 1.05rem; border-radius: 14px; }
.btn.sm { padding: 6px 10px; font-size: 0.85rem; border-radius: 10px; }
.btn.ghost { background: transparent; }
.btn.danger { color: #ff8aa8; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.col { display: flex; flex-direction: column; gap: 10px; }
label.f { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 0.9rem; }
input[type=text], input[type=password], input[type=url], textarea, select {
  width: 100%; background: rgba(0, 0, 0, 0.35); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; outline: none; }
input:focus, textarea:focus, select:focus { border-color: var(--a1); box-shadow: 0 0 0 3px rgba(124, 92, 255, 0.25); }
textarea { resize: vertical; min-height: 110px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 8px 14px; cursor: pointer; font-weight: 700; color: var(--muted); }
.seg button.on { background: var(--card2); color: var(--text); }

/* cards */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
.g5 { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
section { padding: 48px 0; }
.hero { padding: 72px 0 40px; text-align: center; }
.hero p.lead { font-size: 1.2rem; color: var(--muted); max-width: 680px; margin: 0 auto 28px; }
.feat .ic { font-size: 1.6rem; }
.lock { font-size: 0.75rem; color: var(--warn); font-weight: 700; }

/* studio */
.studio { display: grid; grid-template-columns: 400px 1fr; gap: 18px; padding: 22px 0 40px; }
@media (max-width: 960px) { .studio { grid-template-columns: 1fr; } }
.panel { display: flex; flex-direction: column; gap: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 5px 10px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); cursor: pointer; font-size: 0.83rem; }
.chip:hover { background: var(--card2); }
.models { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.model { border: 1px solid var(--line); border-radius: 12px; padding: 10px; cursor: pointer; background: var(--card); position: relative; }
.model.on { border-color: var(--a1); background: rgba(124, 92, 255, 0.14); }
.model b { display: block; font-size: 0.92rem; }
.model span { font-size: 0.75rem; color: var(--muted); }
.model .lock { position: absolute; top: 6px; right: 8px; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.opt { display: flex; gap: 8px; align-items: center; font-size: 0.88rem; padding: 6px 8px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); cursor: pointer; }
.opt.locked { opacity: 0.55; }
.opt input { accent-color: var(--a1); }
.stage { display: flex; flex-direction: column; gap: 10px; min-height: 560px; }
.screen { position: relative; flex: 1; min-height: 480px; border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); background: #000; }
.screen iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 30px; color: var(--muted);
  background: radial-gradient(500px 300px at 50% 40%, rgba(124, 92, 255, 0.25), transparent 70%), #07071a; }
.progress { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 14px; background: rgba(7, 7, 26, 0.92); padding: 20px; text-align: center; }
.spinner { width: 46px; height: 46px; border-radius: 50%; border: 4px solid rgba(255, 255, 255, 0.12); border-top-color: var(--a2); animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.log { width: min(640px, 100%); max-height: 200px; overflow: auto; text-align: left; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; background: rgba(0, 0, 0, 0.45); border: 1px solid var(--line); border-radius: 10px; padding: 10px; white-space: pre-wrap; color: #b9b9e8; }
.think { color: #d6c8ff; font-style: italic; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.bar .title { font-weight: 800; margin-right: auto; }

/* my games */
.gcard { display: flex; flex-direction: column; gap: 8px; }
.thumb { aspect-ratio: 16/9; border-radius: 12px; display: grid; place-items: center; font-weight: 850; font-size: 1.2rem; text-align: center; padding: 10px; color: #fff; text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5); }

/* pricing */
.plans { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; align-items: stretch; }
.plancard { display: flex; flex-direction: column; gap: 10px; }
.plancard.cur { border-color: var(--a2); box-shadow: 0 0 0 1px var(--a2) inset; }
.plancard.hot { border-color: var(--a1); background: rgba(124, 92, 255, 0.1); }
.price { font-size: 2rem; font-weight: 850; }
.price small { font-size: 0.9rem; color: var(--muted); font-weight: 600; }
.plancard ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; font-size: 0.9rem; flex: 1; }
.plancard li::before { content: "✓ "; color: var(--ok); font-weight: 800; }

/* tools */
.tool .out { min-height: 60px; white-space: pre-wrap; background: rgba(0, 0, 0, 0.3); border: 1px solid var(--line); border-radius: 12px; padding: 12px; font-size: 0.92rem; max-height: 340px; overflow: auto; }
.art { display: grid; place-items: center; background: repeating-conic-gradient(#1a1a33 0 25%, #121226 0 50%) 0 0/20px 20px; border-radius: 12px; min-height: 220px; overflow: hidden; }
.art svg, .art img { max-width: 100%; max-height: 260px; }
canvas.viewer { width: 100%; height: 260px; border-radius: 12px; background: #0b0b20; display: block; }

/* modal & toast */
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, 0.6); display: grid; place-items: center; padding: 16px; backdrop-filter: blur(4px); }
.modal .card { width: min(560px, 100%); max-height: 90vh; overflow: auto; background: #12122e; }
.modal .card.wide { width: min(1000px, 100%); }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 60; background: #1d1d45; border: 1px solid var(--line); padding: 10px 16px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4); max-width: calc(100% - 32px); }
.code { width: 100%; min-height: 60vh; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre; }
table.t { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
table.t td, table.t th { border-bottom: 1px solid var(--line); padding: 8px 6px; text-align: left; vertical-align: top; }
footer { border-top: 1px solid var(--line); padding: 28px 0 40px; color: var(--muted); font-size: 0.85rem; }
.note { border-left: 3px solid var(--warn); padding: 8px 12px; background: rgba(255, 197, 66, 0.08); border-radius: 0 10px 10px 0; font-size: 0.88rem; }
kbd { background: var(--card2); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; font-size: 0.8em; }
@media (max-width: 640px) {
  .wrap { padding: 0 16px; }
  .top .wrap { gap: 10px; }
  .who .usage { display: none; }
  .models { grid-template-columns: repeat(2, 1fr); }
  .opts { grid-template-columns: 1fr; }
  .screen { min-height: 70vh; }
}

<script>
/* Nexora game runtime.
 *
 * Every function in this file is serialized into the games Nexora exports with
 * Function.prototype.toString(), so none of them may reference anything outside
 * this file. They may call each other: the exporter always embeds the whole set.
 */

function nxRng(seed) {
  let s = (seed >>> 0) || 0x9e3779b9;
  return function () {
    s ^= s << 13; s >>>= 0;
    s ^= s >>> 17;
    s ^= s << 5; s >>>= 0;
    return s / 4294967296;
  };
}

function nxNoise(seed) {
  function h(x, y) {
    let n = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(seed | 0, 1442695041)) | 0;
    n = Math.imul(n ^ (n >>> 13), 1274126177);
    return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
  }
  function sm(t) { return t * t * (3 - 2 * t); }
  function v(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y), u = sm(x - xi), w = sm(y - yi);
    const a = h(xi, yi), b = h(xi + 1, yi), c = h(xi, yi + 1), d = h(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * w + (a - b - c + d) * u * w;
  }
  return function (x, y) {
    let t = 0, amp = 1, f = 1, norm = 0;
    for (let o = 0; o < 4; o++) { t += v(x * f, y * f) * amp; norm += amp; amp *= 0.5; f *= 2; }
    return t / norm;
  };
}

function nxShade(hex, k, fog, fogK) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  r *= k; g *= k; b *= k;
  if (fog) {
    const f = parseInt(fog.slice(1), 16);
    r += (((f >> 16) & 255) - r) * fogK; g += (((f >> 8) & 255) - g) * fogK; b += ((f & 255) - b) * fogK;
  }
  return 'rgb(' + (r < 0 ? 0 : r > 255 ? 255 : r | 0) + ',' + (g < 0 ? 0 : g > 255 ? 255 : g | 0) + ',' + (b < 0 ? 0 : b > 255 ? 255 : b | 0) + ')';
}

/* A small flat-shaded 3D renderer on a 2D canvas (painter's algorithm). */
function Nx3D(ctx) {
  const faces = [];
  const cam = { x: 0, y: 3, z: -8, yaw: 0, pitch: 0.3, fov: 0.9, near: 0.3, far: 70, fog: null };
  let L = [0.45, 0.8, -0.4];
  const l0 = Math.hypot(L[0], L[1], L[2]); L = [L[0] / l0, L[1] / l0, L[2] / l0];
  let W = 1, H = 1, cy = 1, sy = 0, cp = 1, sp = 0;

  function begin(w, h) {
    W = w; H = h; faces.length = 0;
    cy = Math.cos(cam.yaw); sy = Math.sin(cam.yaw); cp = Math.cos(cam.pitch); sp = Math.sin(cam.pitch);
  }
  function toCam(p) {
    const x = p[0] - cam.x, y = p[1] - cam.y, z = p[2] - cam.z;
    const x1 = x * cy - z * sy, z1 = x * sy + z * cy;
    return [x1, y * cp + z1 * sp, -y * sp + z1 * cp];
  }
  function project(p) {
    const c = toCam(p);
    if (c[2] < cam.near) return null;
    const f = H * cam.fov;
    return [W / 2 + c[0] / c[2] * f, H / 2 - c[1] / c[2] * f, c[2]];
  }
  // pts: world-space polygon; normal optional (computed and oriented to the camera if missing)
  function poly(pts, color, normal, alpha) {
    let n = normal;
    if (!n) {
      const a = pts[0], b = pts[1], c = pts[2];
      const u = [b[0] - a[0], b[1] - a[1], b[2] - a[2]], v = [c[0] - a[0], c[1] - a[1], c[2] - a[2]];
      n = [u[1] * v[2] - u[2] * v[1], u[2] * v[0] - u[0] * v[2], u[0] * v[1] - u[1] * v[0]];
      const ln = Math.hypot(n[0], n[1], n[2]) || 1; n = [n[0] / ln, n[1] / ln, n[2] / ln];
      const d = n[0] * (a[0] - cam.x) + n[1] * (a[1] - cam.y) + n[2] * (a[2] - cam.z);
      if (d > 0) n = [-n[0], -n[1], -n[2]];
    } else {
      const a = pts[0];
      if (n[0] * (a[0] - cam.x) + n[1] * (a[1] - cam.y) + n[2] * (a[2] - cam.z) >= 0) return;
    }
    const scr = []; let depth = 0;
    for (let i = 0; i < pts.length; i++) {
      const p = project(pts[i]);
      if (!p) return;
      scr.push(p); depth += p[2];
    }
    depth /= pts.length;
    if (depth > cam.far) return;
    const lit = 0.42 + 0.58 * Math.max(0, n[0] * L[0] + n[1] * L[1] + n[2] * L[2]);
    const fogK = cam.fog ? Math.min(1, Math.max(0, (depth - cam.far * 0.35) / (cam.far * 0.65))) : 0;
    faces.push({ scr, depth, fill: nxShade(color, lit, cam.fog, fogK), alpha: alpha == null ? 1 : alpha });
  }
  function box(x, y, z, sx, sy2, sz, color) {
    const x0 = x - sx / 2, x1 = x + sx / 2, y0 = y, y1 = y + sy2, z0 = z - sz / 2, z1 = z + sz / 2;
    poly([[x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1]], color, [0, 1, 0]);
    poly([[x0, y0, z0], [x0, y0, z1], [x1, y0, z1], [x1, y0, z0]], color, [0, -1, 0]);
    poly([[x0, y0, z0], [x1, y0, z0], [x1, y1, z0], [x0, y1, z0]], color, [0, 0, -1]);
    poly([[x0, y0, z1], [x0, y1, z1], [x1, y1, z1], [x1, y0, z1]], color, [0, 0, 1]);
    poly([[x0, y0, z0], [x0, y1, z0], [x0, y1, z1], [x0, y0, z1]], color, [-1, 0, 0]);
    poly([[x1, y0, z0], [x1, y0, z1], [x1, y1, z1], [x1, y1, z0]], color, [1, 0, 0]);
  }
  // mesh: {vertices:[[x,y,z]], faces:[[i,j,k,...]], colors:[hex per face]}
  function mesh(m, px, py, pz, scale, rotY, fallback) {
    const c = Math.cos(rotY || 0), s = Math.sin(rotY || 0), k = scale || 1;
    const vs = m.vertices.map(v => [px + (v[0] * c + v[2] * s) * k, py + v[1] * k, pz + (-v[0] * s + v[2] * c) * k]);
    for (let i = 0; i < m.faces.length; i++) {
      const f = m.faces[i];
      if (f.length < 3) continue;
      const pts = [];
      for (let j = 0; j < f.length; j++) { const v = vs[f[j]]; if (!v) { pts.length = 0; break; } pts.push(v); }
      if (pts.length >= 3) poly(pts, (m.colors && m.colors[i]) || fallback || '#9aa4ff');
    }
  }
  function flush() {
    faces.sort((a, b) => b.depth - a.depth);
    for (const f of faces) {
      ctx.globalAlpha = f.alpha;
      ctx.beginPath();
      ctx.moveTo(f.scr[0][0], f.scr[0][1]);
      for (let i = 1; i < f.scr.length; i++) ctx.lineTo(f.scr[i][0], f.scr[i][1]);
      ctx.closePath();
      ctx.fillStyle = f.fill; ctx.fill();
      ctx.strokeStyle = f.fill; ctx.lineWidth = 0.6; ctx.stroke();
    }
    ctx.globalAlpha = 1;
    faces.length = 0;
  }
  return { cam, begin, project, poly, box, mesh, flush };
}

/* Shared game shell: canvas, input (keyboard + touch), title/game-over screens, HUD, sound, music. */
function NexoraRuntime(CFG, makeGame) {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const R = {
    CFG, ctx, W: 0, H: 0, state: 'title', score: 0, best: 0, time: 0, lives: 0, shakeT: 0,
    rng: nxRng(CFG.seed), pal: CFG.palette, particles: [], msg: null, msgT: 0,
  };
  try { R.best = +localStorage.getItem('nx_best_' + CFG.id) || 0; } catch (e) { /* sandboxed: no storage */ }

  // ---- input ----
  const down = {}, touch = {}, prev = [{}, {}];
  let cur = [{}, {}];
  const P1 = { left: ['KeyA'], right: ['KeyD'], up: ['KeyW'], down: ['KeyS'], action: ['Space', 'KeyF'] };
  const P2 = { left: ['ArrowLeft'], right: ['ArrowRight'], up: ['ArrowUp'], down: ['ArrowDown'], action: ['Enter', 'ShiftRight', 'Slash'] };
  const SOLO = {
    left: ['ArrowLeft', 'KeyA'], right: ['ArrowRight', 'KeyD'], up: ['ArrowUp', 'KeyW'], down: ['ArrowDown', 'KeyS'],
    action: ['Space', 'Enter', 'KeyZ', 'KeyX', 'KeyJ'],
  };
  function readInput(p) {
    const map = CFG.players === 2 ? (p === 0 ? P1 : P2) : SOLO, o = {};
    for (const k in map) o[k] = map[k].some(c => down[c]) || (p === 0 && !!touch[k]);
    return o;
  }
  R.input = p => cur[p || 0];
  R.hit = (name, p) => cur[p || 0][name] && !prev[p || 0][name];
  addEventListener('keydown', e => {
    if (e.code === 'KeyM') { R.toggleMusic(); return; }
    if (e.code === 'KeyP' && R.state === 'play') { R.paused = !R.paused; return; }
    down[e.code] = true; unlockAudio();
    if (/^(Arrow|Space)/.test(e.code)) e.preventDefault();
  }, { passive: false });
  addEventListener('keyup', e => { down[e.code] = false; });
  addEventListener('blur', () => { for (const k in down) down[k] = false; });

  // touch pad
  const ctrls = CFG.controls || ['left', 'right', 'action'];
  const pad = document.createElement('div');
  pad.style.cssText = 'position:fixed;inset:auto 0 0 0;display:flex;justify-content:space-between;padding:14px;pointer-events:none;user-select:none;-webkit-user-select:none;touch-action:none';
  const L = { left: '◀', right: '▶', up: '▲', down: '▼', action: '●' };
  const leftGrp = document.createElement('div'), rightGrp = document.createElement('div');
  [leftGrp, rightGrp].forEach(g => { g.style.cssText = 'display:flex;gap:10px;align-items:flex-end'; pad.appendChild(g); });
  ctrls.forEach(k => {
    const b = document.createElement('div');
    b.textContent = L[k];
    b.style.cssText = 'width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font:22px system-ui;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);pointer-events:auto;backdrop-filter:blur(4px)';
    const on = e => { e.preventDefault(); touch[k] = true; unlockAudio(); b.style.background = 'rgba(255,255,255,.34)'; };
    const off = e => { e.preventDefault(); touch[k] = false; b.style.background = 'rgba(255,255,255,.14)'; };
    b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off);
    b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
    (k === 'action' || k === 'up' && ctrls.includes('down') === false ? rightGrp : leftGrp).appendChild(b);
  });
  if (matchMedia('(pointer: coarse)').matches) document.body.appendChild(pad);
  cv.addEventListener('pointerdown', () => {
    unlockAudio();
    if (R.state !== 'play') { touch.action = true; setTimeout(() => { touch.action = false; }, 90); }
  });

  // ---- audio ----
  let ac = null, master = null, musicOn = !!CFG.music, musicTimer = null;
  function unlockAudio() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = 0.35; master.connect(ac.destination);
    } catch (e) { ac = null; }
  }
  function tone(f0, f1, dur, type, vol, when) {
    if (!ac) return;
    const t = ac.currentTime + (when || 0), o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(f0, t);
    if (f1) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(vol || 0.3, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, vol) {
    if (!ac) return;
    const n = ac.sampleRate * dur, buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = ac.createBufferSource(), g = ac.createGain(); g.gain.value = vol || 0.4;
    s.buffer = buf; s.connect(g); g.connect(master); s.start();
  }
  R.sfx = function (k) {
    if (CFG.sfx === false || !ac) return;
    if (k === 'jump') tone(320, 720, 0.16, 'square', 0.18);
    else if (k === 'coin') { tone(880, 0, 0.08, 'square', 0.15); tone(1320, 0, 0.14, 'square', 0.15, 0.07); }
    else if (k === 'shoot') tone(900, 220, 0.12, 'sawtooth', 0.1);
    else if (k === 'hit') { tone(220, 60, 0.25, 'sawtooth', 0.25); noise(0.15, 0.2); }
    else if (k === 'boom') noise(0.45, 0.5);
    else if (k === 'power') { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0, 0.12, 'triangle', 0.2, i * 0.07)); }
    else if (k === 'over') { [392, 330, 262, 196].forEach((f, i) => tone(f, 0, 0.22, 'triangle', 0.25, i * 0.15)); }
    else if (k === 'talk') tone(520 + Math.random() * 200, 0, 0.05, 'square', 0.06);
  };
  // procedural background music: a seeded 16-step loop
  const mr = nxRng(CFG.seed ^ 0x5bd1e995);
  const scale = CFG.mood === 'dark' ? [0, 2, 3, 5, 7, 8, 10] : [0, 2, 4, 7, 9];
  const root = 196 * Math.pow(2, Math.floor(mr() * 5) / 12);
  const mel = Array.from({ length: 16 }, () => (mr() < 0.62 ? scale[Math.floor(mr() * scale.length)] + 12 * Math.floor(mr() * 2) : null));
  const bass = [0, 0, scale[3] || 5, scale[4] || 7];
  let step = 0;
  function musicTick() {
    if (!ac || !musicOn || R.state !== 'play' || R.paused) return;
    const n = mel[step % 16];
    if (n !== null) tone(root * Math.pow(2, n / 12), 0, 0.18, 'triangle', 0.07);
    if (step % 4 === 0) tone(root / 2 * Math.pow(2, bass[(step / 4) % 4] / 12), 0, 0.3, 'sine', 0.12);
    if (step % 4 === 2) noise(0.03, 0.05);
    step++;
  }
  R.toggleMusic = () => {
    musicOn = !musicOn;
    R.flash(musicOn ? 'Musik på' : 'Musik av');
  };
  musicTimer = setInterval(musicTick, 60000 / (CFG.bpm || 116) / 4);

  // ---- helpers ----
  R.text = function (s, x, y, size, color, align, weight) {
    ctx.font = (weight || '700') + ' ' + size + 'px ' + (CFG.font || 'system-ui, sans-serif');
    ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillText(s, x + 2, y + 2);
    ctx.fillStyle = color || '#fff'; ctx.fillText(s, x, y);
  };
  R.burst = function (x, y, color, n, speed) {
    for (let i = 0; i < (n || 12); i++) {
      const a = Math.random() * Math.PI * 2, s = (speed || 180) * (0.3 + Math.random());
      R.particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5 + Math.random() * 0.4, color });
    }
  };
  R.drawParticles = function (ox, oy) {
    for (const p of R.particles) {
      ctx.globalAlpha = Math.max(0, p.life * 1.6);
      ctx.fillStyle = p.color; ctx.fillRect(p.x - (ox || 0) - 2, p.y - (oy || 0) - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
  };
  R.shake = t => { R.shakeT = Math.max(R.shakeT, t || 0.25); };
  R.flash = (m, t) => { R.msg = m; R.msgT = t || 1.6; };
  R.add = n => { R.score += n; };
  R.over = function () {
    if (R.state !== 'play') return;
    R.state = 'over'; R.overT = 0; R.sfx('over'); R.shake(0.4);
    if (R.score > R.best) { R.best = R.score; try { localStorage.setItem('nx_best_' + CFG.id, R.best); } catch (e) { /* no storage */ } }
    try { parent.postMessage({ nexora: 'score', id: CFG.id, score: R.score }, '*'); } catch (e) { /* not framed */ }
  };
  R.win = function (m) { R.flash(m || 'Du vann!', 3); R.add(500); R.over(); R.won = true; };

  const game = makeGame(R);
  function resize() {
    const d = Math.min(window.devicePixelRatio || 1, 2);
    R.W = innerWidth; R.H = innerHeight;
    cv.width = R.W * d; cv.height = R.H * d;
    cv.style.width = R.W + 'px'; cv.style.height = R.H + 'px';
    ctx.setTransform(d, 0, 0, d, 0, 0);
    if (game.resize) game.resize();
  }
  addEventListener('resize', resize);
  resize();
  game.reset();

  function start() {
    R.score = 0; R.time = 0; R.won = false; R.particles.length = 0; R.paused = false;
    game.reset(); R.state = 'play'; step = 0;
  }

  let last = performance.now();
  function frame(now) {
    let dt = Math.min(1 / 30, (now - last) / 1000); last = now;
    cur = [readInput(0), readInput(1)];
    if (R.state === 'play' && !R.paused) { R.time += dt; game.update(dt); }
    else if (R.state === 'title' && R.hit('action')) start();
    else if (R.state === 'over') { R.overT += dt; if (R.overT > 0.6 && R.hit('action')) start(); }
    for (const p of R.particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.life -= dt; }
    R.particles = R.particles.filter(p => p.life > 0);
    if (R.msgT > 0) R.msgT -= dt;

    ctx.save();
    if (R.shakeT > 0) { R.shakeT -= dt; ctx.translate((Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10); }
    game.draw(ctx);
    ctx.restore();

    if (R.state === 'play') {
      R.text(String(R.score), 18, 28, 26, '#fff');
      R.text('Rekord ' + R.best, R.W - 18, 28, 16, 'rgba(255,255,255,.8)', 'right', '600');
      if (game.hud) game.hud(ctx);
      if (R.paused) { ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(0, 0, R.W, R.H); R.text('PAUS', R.W / 2, R.H / 2, 44, '#fff', 'center', '800'); }
    }
    if (R.msgT > 0 && R.msg) {
      ctx.globalAlpha = Math.min(1, R.msgT * 2);
      R.text(R.msg, R.W / 2, R.H * 0.22, 26, R.pal.accent, 'center', '800');
      ctx.globalAlpha = 1;
    }
    if (R.state !== 'play') {
      ctx.fillStyle = 'rgba(5,6,16,.62)'; ctx.fillRect(0, 0, R.W, R.H);
      const big = Math.min(64, R.W / 11);
      if (R.state === 'title') {
        R.text(CFG.title, R.W / 2, R.H * 0.36, big, R.pal.accent, 'center', '900');
        R.text(CFG.tagline || '', R.W / 2, R.H * 0.36 + big * 0.9, Math.max(14, big * 0.32), '#e8e8ff', 'center', '500');
        const pulse = 0.6 + 0.4 * Math.sin(now / 260);
        ctx.globalAlpha = pulse;
        R.text(matchMedia('(pointer: coarse)').matches ? 'Tryck för att spela' : 'Tryck MELLANSLAG för att spela', R.W / 2, R.H * 0.62, 20, '#fff', 'center');
        ctx.globalAlpha = 1;
        R.text(CFG.help || '', R.W / 2, R.H * 0.62 + 34, 14, 'rgba(255,255,255,.7)', 'center', '500');
        if (CFG.players === 2) R.text('Spelare 1: WASD + F  ·  Spelare 2: pilar + Enter', R.W / 2, R.H * 0.62 + 58, 14, 'rgba(255,255,255,.7)', 'center', '500');
      } else {
        R.text(R.won ? 'Seger!' : 'Game over', R.W / 2, R.H * 0.38, big, R.won ? R.pal.coin : R.pal.enemy, 'center', '900');
        R.text('Poäng ' + R.score + '   ·   Rekord ' + R.best, R.W / 2, R.H * 0.38 + big, 20, '#fff', 'center', '600');
        if (R.overT > 0.6) R.text('Tryck MELLANSLAG / tryck för att spela igen', R.W / 2, R.H * 0.62, 17, 'rgba(255,255,255,.85)', 'center', '500');
      }
      R.text('Skapat med Nexora', R.W / 2, R.H - 22, 12, 'rgba(255,255,255,.45)', 'center', '500');
    }
    prev[0] = cur[0]; prev[1] = cur[1];
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  return R;
}

<script>
/* Nexora game templates used by the offline generator ("Nexora Local").
 *
 * Like runtime.js, each function is serialized into the exported game with
 * toString(), so it may only use its argument R and the runtime helpers
 * (nxRng, nxNoise, nxShade, Nx3D).
 */

function gamePlatformer(R) {
  const P = R.pal, C = R.CFG, G = 1900, TILE = 32;
  let pl, plats, coins, foes, camX, genX, rng, deco;
  function gen(until) {
    while (genX < until) {
      const gap = 60 + rng() * (90 + C.difficulty * 40), w = 120 + rng() * 260;
      const last = plats[plats.length - 1];
      const y = Math.max(R.H * 0.35, Math.min(R.H - 70, last.y + (rng() - 0.5) * 170));
      const p = { x: genX + gap, y, w, h: R.H - y + 40 };
      plats.push(p);
      const nc = Math.floor(rng() * 4);
      for (let i = 0; i < nc; i++) coins.push({ x: p.x + 30 + i * 34, y: p.y - 46 - (rng() < 0.3 ? 60 : 0), got: false, t: rng() * 6 });
      if (w > 180 && rng() < 0.35 + C.difficulty * 0.12) foes.push({ x: p.x + w / 2, y: p.y - 26, min: p.x + 8, max: p.x + w - 34, vx: 60 + rng() * 60, dead: false });
      if (rng() < 0.3) {
        const fy = p.y - 110 - rng() * 60;
        plats.push({ x: p.x + w * 0.3, y: fy, w: 90 + rng() * 60, h: 16, thin: true });
        coins.push({ x: p.x + w * 0.3 + 30, y: fy - 40, got: false, t: 0 });
      }
      genX = p.x + w;
    }
  }
  return {
    reset() {
      rng = nxRng(C.seed);
      pl = { x: 80, y: R.H - 200, vx: 0, vy: 0, w: 26, h: 34, ground: false, coyote: 0, jumps: 0, face: 1 };
      plats = [{ x: -200, y: R.H - 90, w: 700, h: 200 }];
      coins = []; foes = []; camX = 0; genX = 500;
      deco = Array.from({ length: 40 }, () => ({ x: rng() * 3000, y: rng() * R.H * 0.6, s: 0.5 + rng() * 2 }));
      gen(R.W * 3);
    },
    update(dt) {
      const k = R.input();
      const acc = 2600, max = 260 + C.difficulty * 30;
      if (k.left) { pl.vx -= acc * dt; pl.face = -1; }
      else if (k.right) { pl.vx += acc * dt; pl.face = 1; }
      else pl.vx *= Math.pow(0.0008, dt);
      pl.vx = Math.max(-max, Math.min(max, pl.vx));
      pl.coyote -= dt;
      if ((R.hit('up') || R.hit('action')) && (pl.coyote > 0 || pl.jumps < (C.doubleJump ? 2 : 1))) {
        pl.vy = -680; pl.coyote = 0; pl.jumps++; R.sfx('jump');
      }
      if (!(k.up || k.action) && pl.vy < -250) pl.vy += G * dt * 1.2; // short hop
      pl.vy += G * dt; pl.x += pl.vx * dt;
      const oy = pl.y; pl.y += pl.vy * dt; pl.ground = false;
      for (const p of plats) {
        if (pl.x + pl.w > p.x && pl.x < p.x + p.w) {
          if (oy + pl.h <= p.y + 2 && pl.y + pl.h >= p.y && pl.vy >= 0) {
            pl.y = p.y - pl.h; pl.vy = 0; pl.ground = true; pl.coyote = 0.1; pl.jumps = 0;
          } else if (!p.thin && pl.y + pl.h > p.y + 4 && pl.y < p.y + p.h) {
            pl.x = pl.vx > 0 ? p.x - pl.w : p.x + p.w; pl.vx = 0;
          }
        }
      }
      if (pl.x < camX) { pl.x = camX; pl.vx = 0; }
      for (const c of coins) {
        c.t += dt;
        if (!c.got && Math.abs(pl.x + 13 - c.x) < 24 && Math.abs(pl.y + 17 - c.y) < 28) { c.got = true; R.add(10); R.sfx('coin'); R.burst(c.x, c.y, P.coin, 10); }
      }
      for (const f of foes) {
        if (f.dead) continue;
        f.x += f.vx * dt; if (f.x < f.min || f.x > f.max) f.vx *= -1;
        if (pl.x + pl.w > f.x && pl.x < f.x + 28 && pl.y + pl.h > f.y && pl.y < f.y + 26) {
          if (pl.vy > 0 && pl.y + pl.h - f.y < 18) { f.dead = true; pl.vy = -520; R.add(50); R.sfx('hit'); R.burst(f.x + 14, f.y + 13, P.enemy, 16); }
          else { R.burst(pl.x, pl.y, P.player, 24); R.over(); }
        }
      }
      if (pl.y > R.H + 80) R.over();
      camX = Math.max(camX, pl.x - R.W * 0.35);
      R.score = Math.max(R.score, Math.floor(camX / 10) + coins.filter(c => c.got).length * 10 + foes.filter(f => f.dead).length * 50);
      gen(camX + R.W * 2);
      plats = plats.filter(p => p.x + p.w > camX - 200);
      coins = coins.filter(c => c.x > camX - 100); foes = foes.filter(f => f.x > camX - 100);
    },
    draw(ctx) {
      const g = ctx.createLinearGradient(0, 0, 0, R.H);
      g.addColorStop(0, P.bg1); g.addColorStop(1, P.bg2);
      ctx.fillStyle = g; ctx.fillRect(0, 0, R.W, R.H);
      ctx.fillStyle = P.deco;
      for (const d of deco) { const x = ((d.x - camX * 0.2 * d.s * 0.3) % 3000 + 3000) % 3000 - 200; ctx.globalAlpha = 0.25 + d.s * 0.1; ctx.beginPath(); ctx.arc(x, d.y, d.s * 2.2, 0, 7); ctx.fill(); }
      ctx.globalAlpha = 0.35; ctx.fillStyle = P.bg2;
      for (let i = -1; i < R.W / 240 + 2; i++) { const x = i * 240 - (camX * 0.4) % 240; ctx.beginPath(); ctx.moveTo(x, R.H); ctx.lineTo(x + 120, R.H * 0.55); ctx.lineTo(x + 240, R.H); ctx.fill(); }
      ctx.globalAlpha = 1;
      ctx.save(); ctx.translate(-camX, 0);
      for (const p of plats) {
        ctx.fillStyle = P.ground; ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.fillStyle = P.top; ctx.fillRect(p.x, p.y, p.w, p.thin ? 6 : 10);
        if (!p.thin) { ctx.fillStyle = 'rgba(0,0,0,.12)'; for (let x = p.x; x < p.x + p.w; x += TILE) ctx.fillRect(x, p.y + 14, 2, p.h); }
      }
      for (const c of coins) if (!c.got) {
        ctx.fillStyle = P.coin; ctx.beginPath(); ctx.ellipse(c.x, c.y + Math.sin(c.t * 4) * 3, 9 * Math.abs(Math.cos(c.t * 3)) + 2, 10, 0, 0, 7); ctx.fill();
      }
      for (const f of foes) if (!f.dead) {
        ctx.fillStyle = P.enemy; ctx.beginPath(); ctx.roundRect(f.x, f.y, 28, 26, 8); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.fillRect(f.x + 6, f.y + 7, 5, 6); ctx.fillRect(f.x + 17, f.y + 7, 5, 6);
      }
      ctx.fillStyle = P.player; ctx.beginPath(); ctx.roundRect(pl.x, pl.y, pl.w, pl.h, 7); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.fillRect(pl.x + (pl.face > 0 ? 15 : 5), pl.y + 9, 6, 7);
      ctx.fillStyle = '#111'; ctx.fillRect(pl.x + (pl.face > 0 ? 18 : 6), pl.y + 11, 3, 4);
      ctx.restore();
      R.drawParticles(camX, 0);
    },
  };
}

function gameShooter(R) {
  const P = R.pal, C = R.CFG;
  let pl, shots, foes, eshots, stars, powers, spawnT, fireT, boss, wave;
  function spawn() {
    const pattern = Math.floor(R.rng() * 3), n = 3 + Math.floor(R.rng() * (3 + C.difficulty));
    const x0 = 60 + R.rng() * (R.W - 120);
    for (let i = 0; i < n; i++) foes.push({ x: pattern === 1 ? 40 + (R.W - 80) * i / n : x0, y: -40 - i * 50, hp: 1 + (wave > 4 ? 1 : 0), t: i * 0.3, pattern, base: x0, r: 16 });
  }
  return {
    reset() {
      pl = { x: R.W / 2, y: R.H - 90, spread: 0, inv: 0 };
      shots = []; foes = []; eshots = []; powers = []; spawnT = 1; fireT = 0; boss = null; wave = 0;
      stars = Array.from({ length: 120 }, () => ({ x: Math.random() * R.W, y: Math.random() * R.H, s: Math.random() * 2 + 0.5 }));
    },
    update(dt) {
      const k = R.input(), sp = 380;
      if (k.left) pl.x -= sp * dt; if (k.right) pl.x += sp * dt;
      if (k.up) pl.y -= sp * dt; if (k.down) pl.y += sp * dt;
      pl.x = Math.max(20, Math.min(R.W - 20, pl.x)); pl.y = Math.max(R.H * 0.4, Math.min(R.H - 40, pl.y));
      pl.inv -= dt; fireT -= dt;
      if (fireT <= 0 && (k.action || C.autofire)) {
        fireT = 0.16;
        shots.push({ x: pl.x, y: pl.y - 20, vx: 0 });
        if (pl.spread > 0) { shots.push({ x: pl.x, y: pl.y - 20, vx: -160 }, { x: pl.x, y: pl.y - 20, vx: 160 }); }
        R.sfx('shoot');
      }
      pl.spread -= dt;
      for (const s of stars) { s.y += s.s * 60 * dt; if (s.y > R.H) { s.y = 0; s.x = Math.random() * R.W; } }
      spawnT -= dt;
      if (spawnT <= 0 && !boss) { wave++; spawn(); spawnT = Math.max(0.9, 3 - wave * 0.12 - C.difficulty * 0.3); if (wave % 8 === 0) boss = { x: R.W / 2, y: -80, hp: 30 + wave * 3, max: 30 + wave * 3, t: 0 }; }
      for (const s of shots) { s.y -= 700 * dt; s.x += s.vx * dt; }
      shots = shots.filter(s => s.y > -20);
      for (const f of foes) {
        f.t += dt; f.y += (90 + wave * 4) * dt;
        if (f.pattern === 0) f.x = f.base + Math.sin(f.t * 2.5) * 90;
        if (f.pattern === 2 && f.y > R.H * 0.3) f.x += Math.sign(pl.x - f.x) * 120 * dt;
        if (R.rng() < dt * (0.25 + C.difficulty * 0.15)) eshots.push({ x: f.x, y: f.y, vx: (pl.x - f.x) * 0.4, vy: 220 });
      }
      if (boss) {
        boss.t += dt; boss.y = Math.min(110, boss.y + 60 * dt); boss.x = R.W / 2 + Math.sin(boss.t * 0.8) * R.W * 0.3;

      eshots = eshots.filter(e => e.y < R.H + 20);
      for (const s of shots) {
        for (const f of foes) if (f.hp > 0 && Math.hypot(s.x - f.x, s.y - f.y) < f.r + 4) {
          f.hp--; s.y = -99;
          if (f.hp <= 0) { R.add(25); R.sfx('boom'); R.burst(f.x, f.y, P.enemy, 18); if (R.rng() < 0.08) powers.push({ x: f.x, y: f.y }); }

        }

        ctx.fillStyle = P.coin; ctx.fillRect(boss.x - 30, boss.y - 6, 60, 12);

}

function gameSnake(R) {
  const P = R.pal, C = R.CFG;
  let cell, cols, rows, snake, dir, next, food, t, walls, speed, ox, oy;
  function free() {
    for (let i = 0; i < 500; i++) {
      const p = { x: Math.floor(R.rng() * cols), y: Math.floor(R.rng() * rows) };
      if (!snake.some(s => s.x === p.x && s.y === p.y) && !walls.some(w => w.x === p.x && w.y === p.y)) return p;
    }
    return { x: 0, y: 0 };
  }
  return {
    reset() {
      cell = Math.max(18, Math.floor(Math.min(R.W, R.H - 60) / 24));
      cols = Math.floor(R.W / cell); rows = Math.floor((R.H - 60) / cell);
      ox = (R.W - cols * cell) / 2; oy = 50 + (R.H - 60 - rows * cell) / 2;
      const cx = Math.floor(cols / 2), cy = Math.floor(rows / 2);
      snake = [{ x: cx, y: cy }, { x: cx - 1, y: cy }, { x: cx - 2, y: cy }];
      dir = { x: 1, y: 0 }; next = dir; t = 0; speed = 8 + C.difficulty * 2;
      walls = [];
      const r = nxRng(C.seed);
      for (let i = 0; i < C.difficulty * 3; i++) {
        const wx = Math.floor(r() * cols), wy = Math.floor(r() * rows), len = 3 + Math.floor(r() * 4), h = r() < 0.5;
        for (let j = 0; j < len; j++) { const w = { x: wx + (h ? j : 0), y: wy + (h ? 0 : j) }; if (Math.abs(w.y - cy) > 1) walls.push(w); }
      }
      food = free();
    },
    update(dt) {
      const k = R.input();
      if (k.left && dir.x === 0) next = { x: -1, y: 0 };
      else if (k.right && dir.x === 0) next = { x: 1, y: 0 };
      else if (k.up && dir.y === 0) next = { x: 0, y: -1 };
      else if (k.down && dir.y === 0) next = { x: 0, y: 1 };
      t += dt;
      if (t < 1 / speed) return;
      t = 0; dir = next;
      const h = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
      if (C.wrap) { h.x = (h.x + cols) % cols; h.y = (h.y + rows) % rows; }
      if (h.x < 0 || h.y < 0 || h.x >= cols || h.y >= rows || snake.some(s => s.x === h.x && s.y === h.y) || walls.some(w => w.x === h.x && w.y === h.y)) {
        R.burst(ox + h.x * cell, oy + h.y * cell, P.player, 30); R.over(); return;
      }
      snake.unshift(h);
      if (h.x === food.x && h.y === food.y) {
        R.add(10); R.sfx('coin'); R.burst(ox + h.x * cell + cell / 2, oy + h.y * cell + cell / 2, P.coin, 14);
        food = free(); speed = Math.min(22, speed + 0.35);
      } else snake.pop();
    },
    draw(ctx) {
      ctx.fillStyle = P.bg2; ctx.fillRect(0, 0, R.W, R.H);
      ctx.fillStyle = P.bg1; ctx.fillRect(ox, oy, cols * cell, rows * cell);
      ctx.fillStyle = 'rgba(255,255,255,.035)';
      for (let x = 0; x < cols; x++) for (let y = (x % 2); y < rows; y += 2) ctx.fillRect(ox + x * cell, oy + y * cell, cell, cell);
      ctx.fillStyle = P.ground; for (const w of walls) ctx.fillRect(ox + w.x * cell + 1, oy + w.y * cell + 1, cell - 2, cell - 2);
      ctx.fillStyle = P.coin; ctx.beginPath(); ctx.arc(ox + food.x * cell + cell / 2, oy + food.y * cell + cell / 2, cell * 0.36, 0, 7); ctx.fill();
      snake.forEach((s, i) => {
        ctx.fillStyle = i === 0 ? P.accent : P.player; ctx.globalAlpha = 1 - i / (snake.length * 1.8);
        ctx.beginPath(); ctx.roundRect(ox + s.x * cell + 1, oy + s.y * cell + 1, cell - 2, cell - 2, cell * 0.3); ctx.fill();
      });
      ctx.globalAlpha = 1;
      R.drawParticles();
    },
  };
}

function gameBreakout(R) {
  const P = R.pal, C = R.CFG;
  let pad, balls, bricks, drops, level, lives, wide;
  function build() {
    bricks = [];
    const cols = Math.max(6, Math.floor(R.W / 80)), rows = 4 + Math.min(4, level + C.difficulty);
    const bw = (R.W - 40) / cols, r = nxRng(C.seed + level * 77);
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
      if (r() < 0.12 * (level % 3)) continue;
      bricks.push({ x: 20 + x * bw, y: 80 + y * 26, w: bw - 4, h: 20, hp: r() < 0.15 + level * 0.05 ? 2 : 1, c: y });
    }
  }
  function serve() { balls = [{ x: pad.x, y: pad.y - 14, vx: 0, vy: 0, stuck: true }]; }
  return {
    reset() { level = 0; lives = 3; wide = 0; pad = { x: R.W / 2, y: R.H - 60, w: 110 }; drops = []; build(); serve(); },
    hud() { R.text('♥'.repeat(lives), R.W / 2, 28, 20, R.pal.enemy, 'center'); },
    update(dt) {
      const k = R.input();
      if (k.left) pad.x -= 620 * dt; if (k.right) pad.x += 620 * dt;
      wide -= dt; pad.w = wide > 0 ? 180 : 110;
      pad.x = Math.max(pad.w / 2, Math.min(R.W - pad.w / 2, pad.x));
      const spd = 420 + level * 30 + C.difficulty * 40;
      for (const b of balls) {
        if (b.stuck) { b.x = pad.x; b.y = pad.y - 14; if (k.action || k.up) { b.stuck = false; b.vx = (R.rng() - 0.5) * 300; b.vy = -spd; R.sfx('jump'); } continue; }
        b.x += b.vx * dt; b.y += b.vy * dt;
        if (b.x < 8) { b.x = 8; b.vx = Math.abs(b.vx); } if (b.x > R.W - 8) { b.x = R.W - 8; b.vx = -Math.abs(b.vx); }
        if (b.y < 50) { b.y = 50; b.vy = Math.abs(b.vy); }
        if (b.vy > 0 && b.y > pad.y - 8 && b.y < pad.y + 10 && Math.abs(b.x - pad.x) < pad.w / 2 + 6) {
          const off = (b.x - pad.x) / (pad.w / 2), a = off * 1.05;
          b.vx = Math.sin(a) * spd; b.vy = -Math.cos(a) * spd; R.sfx('coin');
        }
        for (const br of bricks) {
          if (br.hp > 0 && b.x > br.x - 7 && b.x < br.x + br.w + 7 && b.y > br.y - 7 && b.y < br.y + br.h + 7) {
            br.hp--;
            const fromSide = Math.min(Math.abs(b.x - br.x), Math.abs(b.x - br.x - br.w)) < Math.min(Math.abs(b.y - br.y), Math.abs(b.y - br.y - br.h));
            if (fromSide) b.vx *= -1; else b.vy *= -1;
            if (br.hp <= 0) { R.add(10); R.burst(br.x + br.w / 2, br.y + 10, P.accent, 8); if (R.rng() < 0.1) drops.push({ x: br.x + br.w / 2, y: br.y, k: R.rng() < 0.5 ? 'multi' : 'wide' }); }
            R.sfx('hit'); break;
          }
        }
      }
      balls = balls.filter(b => b.y < R.H + 20);
      if (!balls.length) { lives--; R.shake(0.3); if (lives <= 0) R.over(); else serve(); }
      for (const d of drops) {
        d.y += 160 * dt;
        if (d.y > pad.y - 10 && d.y < pad.y + 12 && Math.abs(d.x - pad.x) < pad.w / 2) {
          d.y = R.H + 99; R.sfx('power');
          if (d.k === 'wide') { wide = 12; R.flash('Bred racket!'); }
          else { const b0 = balls[0]; if (b0) for (let i = 0; i < 2; i++) balls.push({ x: b0.x, y: b0.y, vx: (i ? 1 : -1) * 250, vy: -spd * 0.8 }); R.flash('Multiboll!'); }
        }
      }
      drops = drops.filter(d => d.y < R.H + 20);
      if (!bricks.some(b => b.hp > 0)) { level++; R.add(100); R.flash('Nivå ' + (level + 1)); build(); serve(); }
    },
    draw(ctx) {
      const g = ctx.createLinearGradient(0, 0, 0, R.H); g.addColorStop(0, P.bg1); g.addColorStop(1, P.bg2);
      ctx.fillStyle = g; ctx.fillRect(0, 0, R.W, R.H);
      const cols = [P.enemy, P.coin, P.accent, P.player, P.top, P.deco, P.ground, P.enemy];
      for (const b of bricks) if (b.hp > 0) {
        ctx.fillStyle = cols[b.c % cols.length]; ctx.globalAlpha = b.hp > 1 ? 1 : 0.8;
        ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 5); ctx.fill();
        if (b.hp > 1) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke(); }
      }
      ctx.globalAlpha = 1;
      for (const d of drops) { ctx.fillStyle = d.k === 'wide' ? P.coin : P.accent; ctx.beginPath(); ctx.roundRect(d.x - 14, d.y - 7, 28, 14, 7); ctx.fill(); }
      ctx.fillStyle = P.player; ctx.beginPath(); ctx.roundRect(pad.x - pad.w / 2, pad.y, pad.w, 12, 6); ctx.fill();
      ctx.fillStyle = '#fff'; for (const b of balls) { ctx.beginPath(); ctx.arc(b.x, b.y, 7, 0, 7); ctx.fill(); }
      R.drawParticles();
    },
  };
}

function gameDodger(R) {
  const P = R.pal, C = R.CFG;

  return {
    reset() { pl = { x: R.W / 2, y: R.H - 110, shield: 0 }; obs = []; items = []; t = 0; speed = 240 + C.difficulty * 50; lanesY = 0; bonus = 0; },
    update(dt) {
      const k = R.input();
      if (k.left) pl.x -= 440 * dt; if (k.right) pl.x += 440 * dt;
      pl.x = Math.max(24, Math.min(R.W - 24, pl.x));
      speed += dt * 6; t -= dt; lanesY = (lanesY + speed * dt) % 80; pl.shield -= dt;
      if (t <= 0) {
        t = Math.max(0.28, 0.9 - speed / 1400);
        const w = 40 + R.rng() * 90;
        obs.push({ x: R.rng() * (R.W - w) + w / 2, y: -60, w, h: 30 + R.rng() * 40, rot: R.rng() * 6 });
        if (R.rng() < 0.35) items.push({ x: 20 + R.rng() * (R.W - 40), y: -30, k: R.rng() < 0.1 ? 'shield' : 'coin' });
      }
      for (const o of obs) { o.y += speed * dt; o.rot += dt; }
      for (const it of items) it.y += speed * dt;
      for (const it of items) if (Math.abs(it.x - pl.x) < 28 && Math.abs(it.y - pl.y) < 30) {
        it.y = R.H + 99;
        if (it.k === 'coin') { bonus += 15; R.sfx('coin'); R.burst(pl.x, pl.y - 20, P.coin, 10); } else { pl.shield = 5; R.sfx('power'); R.flash('Sköld!'); }
      }
      for (const o of obs) if (Math.abs(o.x - pl.x) < o.w / 2 + 16 && Math.abs(o.y - pl.y) < o.h / 2 + 22) {
        if (pl.shield > 0) { o.y = R.H + 99; R.burst(o.x, o.y, P.enemy, 14); R.sfx('boom'); }
        else { R.burst(pl.x, pl.y, P.player, 30, 260); R.shake(0.5); R.over(); }
      }
      obs = obs.filter(o => o.y < R.H + 80); items = items.filter(i => i.y < R.H + 40);
      R.score = Math.floor(R.time * 10) + bonus;
    },
    draw(ctx) {
      ctx.fillStyle = P.bg1; ctx.fillRect(0, 0, R.W, R.H);
      ctx.fillStyle = P.bg2; ctx.fillRect(R.W * 0.08, 0, R.W * 0.84, R.H);
      ctx.fillStyle = P.deco; ctx.globalAlpha = 0.5;
      for (let y = -80 + lanesY; y < R.H; y += 80) { ctx.fillRect(R.W / 3 - 3, y, 6, 40); ctx.fillRect(R.W * 2 / 3 - 3, y, 6, 40); }
      ctx.globalAlpha = 1;
      for (const it of items) { ctx.fillStyle = it.k === 'coin' ? P.coin : P.accent; ctx.beginPath(); ctx.arc(it.x, it.y, it.k === 'coin' ? 10 : 13, 0, 7); ctx.fill(); }
      for (const o of obs) {
        ctx.save(); ctx.translate(o.x, o.y); ctx.rotate(Math.sin(o.rot) * 0.2);
        ctx.fillStyle = P.enemy; ctx.beginPath(); ctx.roundRect(-o.w / 2, -o.h / 2, o.w, o.h, 8); ctx.fill();
        ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(-o.w / 2 + 6, -o.h / 2 + 6, o.w - 12, 6);
        ctx.restore();

        if (pl.shield > 0) { ctx.strokeStyle = P.accent; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(pl.x, pl.y, 34, 0, 7); ctx.stroke(); }
        ctx.fillStyle = P.player; ctx.beginPath(); ctx.roundRect(pl.x - 18, pl.y - 28, 36, 56, 10); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fillRect(pl.x - 12, pl.y - 18, 24, 12);
      }
      R.drawParticles();
    },
  };
}

function gameCollector(R) {
  const P = R.pal, C = R.CFG, two = C.players === 2;
  let pls, gems, foes, t;
  function place() { return { x: 40 + R.rng() * (R.W - 80), y: 70 + R.rng() * (R.H - 120) }; }
  return {
    reset() {
      pls = [{ x: R.W * 0.4, y: R.H / 2, c: P.player, s: 0, alive: true }];
      if (two) pls.push({ x: R.W * 0.6, y: R.H / 2, c: P.accent, s: 0, alive: true });
      gems = Array.from({ length: 5 }, place); foes = []; t = 2;
    },
    hud() { if (two) R.text('P1 ' + pls[0].s + '   ·   P2 ' + pls[1].s, R.W / 2, 28, 18, '#fff', 'center'); },
    update(dt) {
      pls.forEach((p, i) => {
        if (!p.alive) return;
        const k = R.input(i), sp = 280;
        let dx = (k.right ? 1 : 0) - (k.left ? 1 : 0), dy = (k.down ? 1 : 0) - (k.up ? 1 : 0);
        const l = Math.hypot(dx, dy) || 1; p.x += dx / l * sp * dt; p.y += dy / l * sp * dt;
        p.x = Math.max(16, Math.min(R.W - 16, p.x)); p.y = Math.max(56, Math.min(R.H - 16, p.y));
        for (const g of gems) if (Math.hypot(g.x - p.x, g.y - p.y) < 26) {
          p.s += 10; R.add(10); R.sfx('coin'); R.burst(g.x, g.y, P.coin, 12); Object.assign(g, place());
        }
      });
      t -= dt;
      if (t <= 0) { t = Math.max(1.2, 5 - R.time * 0.05 - C.difficulty); const e = R.rng() < 0.5 ? { x: R.rng() < 0.5 ? -20 : R.W + 20, y: 60 + R.rng() * R.H } : { x: R.rng() * R.W, y: R.H + 20 }; foes.push({ x: e.x, y: e.y, sp: 70 + R.rng() * 60 + C.difficulty * 20 }); }
      for (const f of foes) {
        const alive = pls.filter(p => p.alive);
        if (!alive.length) break;
        const tg = alive.reduce((a, b) => (Math.hypot(a.x - f.x, a.y - f.y) < Math.hypot(b.x - f.x, b.y - f.y) ? a : b));
        const a = Math.atan2(tg.y - f.y, tg.x - f.x); f.x += Math.cos(a) * f.sp * dt; f.y += Math.sin(a) * f.sp * dt;
        for (const p of alive) if (Math.hypot(p.x - f.x, p.y - f.y) < 26) { p.alive = false; R.burst(p.x, p.y, p.c, 30, 240); R.sfx('hit'); R.shake(0.3); }
      }
      if (!pls.some(p => p.alive)) {
        if (two) R.flash(pls[0].s === pls[1].s ? 'Oavgjort!' : (pls[0].s > pls[1].s ? 'Spelare 1 vinner!' : 'Spelare 2 vinner!'), 4);
        R.over();
      }
    },
    draw(ctx) {
      ctx.fillStyle = P.bg1; ctx.fillRect(0, 0, R.W, R.H);
      ctx.strokeStyle = 'rgba(255,255,255,.05)';
      for (let x = 0; x < R.W; x += 48) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, R.H); ctx.stroke(); }
      for (let y = 0; y < R.H; y += 48) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(R.W, y); ctx.stroke(); }
      for (const g of gems) { ctx.fillStyle = P.coin; ctx.beginPath(); ctx.moveTo(g.x, g.y - 12); ctx.lineTo(g.x + 10, g.y); ctx.lineTo(g.x, g.y + 12); ctx.lineTo(g.x - 10, g.y); ctx.closePath(); ctx.fill(); }
      for (const f of foes) { ctx.fillStyle = P.enemy; ctx.beginPath(); ctx.arc(f.x, f.y, 15, 0, 7); ctx.fill(); ctx.fillStyle = '#fff'; ctx.fillRect(f.x - 7, f.y - 5, 4, 5); ctx.fillRect(f.x + 3, f.y - 5, 4, 5); }
      for (const p of pls) if (p.alive) { ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, 16, 0, 7); ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke(); }
      R.drawParticles();
    },
  };
}

function gameOpenWorld(R) {
  const P = R.pal, C = R.CFG, T = 40, N = 160;
  const noise = nxNoise(C.seed), moist = nxNoise(C.seed + 99);
  let map, pl, npcs, items, foes, cam, talk, quest, done, hp, hurtT;
  const Q = C.quests && C.quests.length ? C.quests : [{ giver: 'Vandraren', item: 'kristall', count: 4, text: 'Hitta 4 kristaller åt mig.' }];
  function tile(x, y) {
    const e = noise(x / 22, y / 22), m = moist(x / 30, y / 30), edge = Math.min(x, y, N - 1 - x, N - 1 - y) / 12;
    const h = e - Math.max(0, 1 - edge) * 0.5;
    if (h < 0.34) return 0; // water
    if (h < 0.38) return 1; // sand
    if (h > 0.68) return 4; // rock
    return m > 0.55 ? 3 : 2; // forest / grass
  }

      npcs = Q.map((q, i) => Object.assign(spot(r), { name: q.giver, q: i, lines: q.lines || [q.text], c: [P.accent, P.coin, P.player, P.top][i % 4] }));

      if (npcs[0]) { npcs[0].x = pl.x + 80; npcs[0].y = pl.y; if (!walk(npcs[0].x, npcs[0].y)) { npcs[0].x = pl.x; npcs[0].y = pl.y - 60; } }
      items = []; for (let i = 0; i < 70; i++) items.push(Object.assign(spot(r), { q: i % Q.length, got: false }));
      foes = []; for (let i = 0; i < 26 + C.difficulty * 10; i++) foes.push(Object.assign(spot(r), { hp: 2, t: r() * 9, vx: 0, vy: 0 }));
      foes = foes.filter(f => Math.hypot(f.x - pl.x, f.y - pl.y) > 300);
      quest = -1; done = 0; hp = 5; hurtT = 0; talk = null; cam = { x: pl.x, y: pl.y };
    },
    hud() {
      R.text('♥'.repeat(Math.max(0, hp)), R.W / 2, 28, 20, P.enemy, 'center');
      const q = Q[quest];
      if (q) { const have = items.filter(i => i.q === quest && i.got).length; R.text('Uppdrag: ' + q.text + ' (' + Math.min(have, q.count) + '/' + q.count + ')', 18, R.H - 26, 15, '#fff', 'left', '600'); }
      else if (done < Q.length) R.text('Hitta någon att prata med (tryck ● nära en person)', 18, R.H - 26, 15, '#fff', 'left', '600');
      if (talk) {
        const w = Math.min(560, R.W - 30), x = (R.W - w) / 2, y = R.H - 150;
        R.ctx.fillStyle = 'rgba(8,8,24,.9)'; R.ctx.beginPath(); R.ctx.roundRect(x, y, w, 110, 12); R.ctx.fill();
        R.ctx.strokeStyle = P.accent; R.ctx.lineWidth = 2; R.ctx.stroke();
        R.text(talk.name, x + 16, y + 20, 16, P.accent, 'left', '800');
        const words = talk.line.split(' '); let ln = '', yy = y + 48;
        R.ctx.font = '500 15px system-ui';
        for (const wd of words) { if (R.ctx.measureText(ln + wd).width > w - 32) { R.text(ln, x + 16, yy, 15, '#fff', 'left', '500'); ln = ''; yy += 22; } ln += wd + ' '; }
        R.text(ln, x + 16, yy, 15, '#fff', 'left', '500');
      }
    },
    update(dt) {
      if (talk) {
        if (R.hit('action')) { talk.i++; R.sfx('talk'); if (talk.i >= talk.lines.length) { if (talk.onEnd) talk.onEnd(); talk = null; } else talk.line = talk.lines[talk.i]; }
        return;
      }
      const k = R.input(), sp = 190;
      let dx = (k.right ? 1 : 0) - (k.left ? 1 : 0), dy = (k.down ? 1 : 0) - (k.up ? 1 : 0);
      const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
      if (dx || dy) pl.face = Math.atan2(dy, dx);
      if (walk(pl.x + dx * sp * dt, pl.y)) pl.x += dx * sp * dt;

      pl.atk -= dt; hurtT -= dt;
      if (R.hit('action')) {
        const n = npcs.find(n => Math.hypot(n.x - pl.x, n.y - pl.y) < 60);

            talk = { name: n.name, lines: [q.thanks || 'Fantastiskt! Du klarade det. Här är din belöning.'], onEnd: () => { done++; quest = -1; R.add(250); R.sfx('power'); R.flash('Uppdrag klart!'); if (done >= Q.length) R.win('Alla uppdrag klara!'); } };
          } else if (quest === n.q) talk = { name: n.name, lines: ['Du har ' + have + ' av ' + q.count + '. Fortsätt leta!'] };
          else if (n.q === done) talk = { name: n.name, lines: n.lines.concat([q.text]), onEnd: () => { quest = n.q; R.flash('Nytt uppdrag!'); } };
          else talk = { name: n.name, lines: ['Hej, äventyrare. Kom tillbaka senare, jag kan behöva din hjälp.'] };
          if (talk) { talk.i = 0; talk.line = talk.lines[0]; R.sfx('talk'); }
        } else { pl.atk = 0.25; R.sfx('shoot'); }
      }
      for (const it of items) if (!it.got && it.q === quest && Math.hypot(it.x - pl.x, it.y - pl.y) < 26) { it.got = true; R.add(20); R.sfx('coin'); R.burst(it.x, it.y, P.coin, 12); }
      for (const f of foes) {

        else if (f.t % 3 < dt * 2) { const a = Math.random() * 7; f.vx = Math.cos(a) * 40; f.vy = Math.sin(a) * 40; }
        if (walk(f.x + f.vx * dt, f.y + f.vy * dt)) { f.x += f.vx * dt; f.y += f.vy * dt; }
        if (pl.atk > 0 && d < 58) { f.hp--; f.x -= (pl.x - f.x) / d * 40; f.y -= (pl.y - f.y) / d * 40; R.burst(f.x, f.y, P.enemy, 8); if (f.hp <= 0) { R.add(30); R.sfx('boom'); } }
        else if (d < 24 && hurtT <= 0) { hp--; hurtT = 1; R.sfx('hit'); R.shake(0.25); if (hp <= 0) R.over(); }
      }
      cam.x += (pl.x - cam.x) * Math.min(1, dt * 6); cam.y += (pl.y - cam.y) * Math.min(1, dt * 6);
    },
    draw(ctx) {
      const cols = ['#2b5fa8', '#d8c07a', P.ground, P.top, '#77726e'];
      const ox = cam.x - R.W / 2, oy = cam.y - R.H / 2;
      ctx.fillStyle = cols[0]; ctx.fillRect(0, 0, R.W, R.H);
      const x0 = Math.max(0, Math.floor(ox / T)), y0 = Math.max(0, Math.floor(oy / T));
      const x1 = Math.min(N - 1, Math.ceil((ox + R.W) / T)), y1 = Math.min(N - 1, Math.ceil((oy + R.H) / T));
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
        const t = map[y * N + x]; ctx.fillStyle = cols[t];

        if (t === 3 && (x * 7 + y * 13) % 3 === 0) { ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.beginPath(); ctx.arc(x * T - ox + T / 2, y * T - oy + T / 2, T * 0.42, 0, 7); ctx.fill(); }
        if (t === 0 && (x + y + Math.floor(R.time * 2)) % 7 === 0) { ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(x * T - ox + 8, y * T - oy + 18, 16, 3); }
      }

      ctx.globalAlpha = 1;
    },
  };
}

function gameRunner3D(R) {
  const P = R.pal, C = R.CFG, g3 = Nx3D(R.ctx);
  let lane, x, y, vy, z, obs, coins, speed, nextZ;
  g3.cam.fog = P.bg2; g3.cam.far = 80;
  function gen() {
    while (nextZ < z + 90) {
      nextZ += 7 + R.rng() * 7 - Math.min(4, speed / 20);
      const l = Math.floor(R.rng() * 3) - 1, tall = R.rng() < 0.4;
      obs.push({ l, z: nextZ, h: tall ? 2.4 : 0.9 });
      if (R.rng() < 0.6) { const cl = (l + 1 + Math.floor(R.rng() * 2)) % 3 - 1; for (let i = 0; i < 4; i++) coins.push({ l: cl, z: nextZ + i * 1.6, got: false }); }
    }
  }
  return {
    reset() { lane = 0; x = 0; y = 0; vy = 0; z = 0; obs = []; coins = []; speed = 14 + C.difficulty * 3; nextZ = 22; gen(); },
    update(dt) {
      if (R.hit('left')) lane = Math.max(-1, lane - 1);
      if (R.hit('right')) lane = Math.min(1, lane + 1);
      if ((R.hit('up') || R.hit('action')) && y <= 0) { vy = 9.5; R.sfx('jump'); }
      vy -= 26 * dt; y = Math.max(0, y + vy * dt); if (y === 0) vy = Math.max(0, vy);
      x += (lane * 2.2 - x) * Math.min(1, dt * 14);
      speed += dt * 0.35; z += speed * dt;
      R.score = Math.floor(z) + coins.filter(c => c.got).length * 10;
      for (const c of coins) if (!c.got && Math.abs(c.z - z) < 0.8 && c.l === lane && y < 1.4) { c.got = true; R.sfx('coin'); }
      for (const o of obs) if (Math.abs(o.z - z) < 0.7 && Math.abs(o.l * 2.2 - x) < 1.2 && y < o.h) { R.shake(0.5); R.sfx('hit'); R.over(); }
      obs = obs.filter(o => o.z > z - 5); coins = coins.filter(c => c.z > z - 5);
      gen();
    },
    draw(ctx) {
      const g = ctx.createLinearGradient(0, 0, 0, R.H); g.addColorStop(0, P.bg1); g.addColorStop(1, P.bg2);
      ctx.fillStyle = g; ctx.fillRect(0, 0, R.W, R.H);
      const cam = g3.cam; cam.x = x * 0.6; cam.y = 3.4; cam.z = z - 7; cam.pitch = 0.28; cam.yaw = 0;
      g3.begin(R.W, R.H);
      const seg = 4, z0 = Math.floor(z / seg) * seg;
      for (let i = -1; i < 20; i++) {
        const zz = z0 + i * seg;
        g3.poly([[-3.4, 0, zz], [3.4, 0, zz], [3.4, 0, zz + seg], [-3.4, 0, zz + seg]], (i + z0 / seg) % 2 ? P.ground : P.top, [0, 1, 0]);
        g3.box(-4.2, 0, zz + seg / 2, 0.6, 0.8 + ((zz * 13) % 5) * 0.4, seg * 0.9, P.deco);
        g3.box(4.2, 0, zz + seg / 2, 0.6, 0.8 + ((zz * 7) % 5) * 0.4, seg * 0.9, P.deco);
      }
      for (const o of obs) g3.box(o.l * 2.2, 0, o.z, 1.7, o.h, 0.9, P.enemy);
      for (const c of coins) if (!c.got) g3.box(c.l * 2.2, 0.8 + Math.sin(c.z + R.time * 4) * 0.15, c.z, 0.5, 0.5, 0.2, P.coin);
      if (R.state !== 'over') { g3.box(x, y, z, 0.9, 1.3, 0.9, P.player); g3.box(x, y + 1.3, z, 0.6, 0.5, 0.6, P.accent); }
      g3.flush();
    },
  };
}

function gameArena3D(R) {
  const P = R.pal, C = R.CFG, g3 = Nx3D(R.ctx), S = 14;
  let pl, orbs, foes, pillars, t;
  g3.cam.fog = P.bg2; g3.cam.far = 60;
  function spot() { return { x: (R.rng() - 0.5) * S * 1.8, z: (R.rng() - 0.5) * S * 1.8 }; }
  return {
    reset() {
      pl = { x: 0, z: 0, vx: 0, vz: 0, yaw: 0 };
      const r = nxRng(C.seed); pillars = [];
      for (let i = 0; i < 7; i++) { const p = { x: (r() - 0.5) * S * 1.6, z: (r() - 0.5) * S * 1.6, h: 1 + r() * 3 }; if (Math.hypot(p.x, p.z) > 3) pillars.push(p); }
      orbs = Array.from({ length: 4 }, spot); foes = []; t = 3;
    },
    update(dt) {
      const k = R.input();
      if (k.left) pl.yaw -= 2.6 * dt; if (k.right) pl.yaw += 2.6 * dt;
      const f = (k.up || k.action ? 1 : 0) - (k.down ? 0.6 : 0);
      pl.vx += Math.sin(pl.yaw) * f * 28 * dt; pl.vz += Math.cos(pl.yaw) * f * 28 * dt;
      pl.vx *= Math.pow(0.12, dt); pl.vz *= Math.pow(0.12, dt);
      pl.x = Math.max(-S, Math.min(S, pl.x + pl.vx * dt)); pl.z = Math.max(-S, Math.min(S, pl.z + pl.vz * dt));
      for (const p of pillars) { const d = Math.hypot(pl.x - p.x, pl.z - p.z); if (d < 1.2) { pl.x = p.x + (pl.x - p.x) / d * 1.2; pl.z = p.z + (pl.z - p.z) / d * 1.2; } }
      for (const o of orbs) if (Math.hypot(o.x - pl.x, o.z - pl.z) < 1) { R.add(10); R.sfx('coin'); Object.assign(o, spot()); }
      t -= dt;
      if (t <= 0) { t = Math.max(1.5, 5 - R.time * 0.04 - C.difficulty * 0.5); const a = R.rng() * 7; foes.push({ x: Math.cos(a) * S, z: Math.sin(a) * S, sp: 2.2 + R.rng() * 1.5 + C.difficulty * 0.4 }); }
      for (const e of foes) {
        const d = Math.hypot(pl.x - e.x, pl.z - e.z) || 1; e.x += (pl.x - e.x) / d * e.sp * dt; e.z += (pl.z - e.z) / d * e.sp * dt;
        if (d < 0.9) { R.sfx('hit'); R.shake(0.4); R.over(); }
      }
    },
    draw(ctx) {
      const g = ctx.createLinearGradient(0, 0, 0, R.H); g.addColorStop(0, P.bg1); g.addColorStop(1, P.bg2);
      ctx.fillStyle = g; ctx.fillRect(0, 0, R.W, R.H);
      const cam = g3.cam; cam.yaw = pl.yaw; cam.pitch = 0.45;
      cam.x = pl.x - Math.sin(pl.yaw) * 7; cam.z = pl.z - Math.cos(pl.yaw) * 7; cam.y = 5.5;
      g3.begin(R.W, R.H);
      for (let i = -S; i < S; i += 4) for (let j = -S; j < S; j += 4) g3.poly([[i, 0, j], [i + 4, 0, j], [i + 4, 0, j + 4], [i, 0, j + 4]], ((i + j) / 4) % 2 ? P.ground : P.top, [0, 1, 0]);
      for (let i = -S; i < S; i += 2) { g3.box(i + 1, 0, -S - 0.5, 2, 0.8, 0.4, P.deco); g3.box(i + 1, 0, S + 0.5, 2, 0.8, 0.4, P.deco); g3.box(-S - 0.5, 0, i + 1, 0.4, 0.8, 2, P.deco); g3.box(S + 0.5, 0, i + 1, 0.4, 0.8, 2, P.deco); }
      for (const p of pillars) g3.box(p.x, 0, p.z, 1.2, p.h, 1.2, P.deco);
      for (const o of orbs) g3.box(o.x, 0.4 + Math.sin(R.time * 3 + o.x) * 0.2, o.z, 0.5, 0.5, 0.5, P.coin);
      for (const e of foes) { g3.box(e.x, 0, e.z, 0.9, 0.9, 0.9, P.enemy); }
      if (R.state !== 'over') { g3.box(pl.x, 0, pl.z, 0.9, 1.1, 0.9, P.player); g3.box(pl.x + Math.sin(pl.yaw) * 0.45, 0.6, pl.z + Math.cos(pl.yaw) * 0.45, 0.3, 0.3, 0.3, P.accent); }
      g3.flush();
    },
  };
}

<script>

 * meshes, music and sound effects. */

  const has = (p, words) => words.some(w => starts(p, w));

    { id: 'openworld', label: 'Open world-äventyr', d3: false, words: ['open world', 'open-world', 'öppen värld', 'utforska', 'rpg', 'äventyr', 'quest', 'uppdrag', 'zelda', 'kungarike'] },
    { id: 'runner3d', label: '3D-löpare', d3: true, words: ['löpare', 'runner', 'subway', 'spring', 'endless'] },

    { id: 'snake', label: 'Orm', d3: false, words: ['orm', 'snake', 'mask'] },
    { id: 'breakout', label: 'Blockkross', d3: false, words: ['breakout', 'block', 'tegel', 'brick', 'boll', 'arkanoid', 'krossa'] },
    { id: 'dodger', label: 'Undvik-spel', d3: false, words: ['undvik', 'dodge', 'bil', 'car', 'race', 'racing', 'väg', 'trafik', 'fall'] },
    { id: 'collector', label: 'Samlarspel', d3: false, words: ['samla', 'collect', 'mynt', 'coin', 'diamant', 'gem', 'jaga', 'två spelare', '2 spelare', 'multiplayer', 'kompis'] },
    { id: 'platformer', label: 'Plattformsspel', d3: false, words: ['plattform', 'platform', 'hoppa', 'jump', 'mario', 'ninja', 'hopp'] },
  ];

  const THEMES = [
    { words: ['lava', 'vulkan', 'eld', 'fire', 'helvete', 'drake', 'dragon'], name: 'Lava', mood: 'dark', pal: { bg1: '#2a0a0a', bg2: '#6b1d0c', ground: '#3b1f1a', top: '#ff6a2b', player: '#ffd166', enemy: '#ff3b3b', coin: '#ffe45e', accent: '#ff9f1c', deco: '#ffb38a' } },
    { words: ['is', 'snö', 'vinter', 'ice', 'snow', 'frost', 'pingvin', 'jul'], name: 'Is', mood: 'bright', pal: { bg1: '#cfeaff', bg2: '#6fa8dc', ground: '#e8f4ff', top: '#ffffff', player: '#ff5d8f', enemy: '#3a4fff', coin: '#ffd23f', accent: '#1e90ff', deco: '#ffffff' } },
    { words: ['skog', 'forest', 'djungel', 'jungle', 'natur', 'träd', 'alv'], name: 'Skog', mood: 'bright', pal: { bg1: '#8fd694', bg2: '#2e6b3a', ground: '#4a8a3a', top: '#7bc950', player: '#ff7b54', enemy: '#8a3ab9', coin: '#ffd23f', accent: '#ffe066', deco: '#d8f3dc' } },
    { words: ['hav', 'vatten', 'ocean', 'sea', 'under', 'fisk', 'fish', 'pirat', 'strand'], name: 'Hav', mood: 'bright', pal: { bg1: '#0b3d6b', bg2: '#0a6e8a', ground: '#d9b77a', top: '#f2d49b', player: '#ffb703', enemy: '#e63946', coin: '#ffe45e', accent: '#48cae4', deco: '#90e0ef' } },
    { words: ['neon', 'cyber', 'synth', 'retro', 'framtid', 'future', 'robot', 'hacker'], name: 'Neon', mood: 'dark', pal: { bg1: '#0d0221', bg2: '#261447', ground: '#2e1a47', top: '#ff2a6d', player: '#05d9e8', enemy: '#ff2a6d', coin: '#f9f871', accent: '#d1f7ff', deco: '#7b2fff' } },
    { words: ['godis', 'candy', 'söt', 'kaka', 'glass', 'rosa', 'enhörning', 'unicorn'], name: 'Godis', mood: 'bright', pal: { bg1: '#ffd6e8', bg2: '#ff8fc7', ground: '#b5838d', top: '#ffafcc', player: '#7b2cbf', enemy: '#3a86ff', coin: '#ffbe0b', accent: '#ff006e', deco: '#ffffff' } },
    { words: ['spöke', 'ghost', 'skräck', 'horror', 'zombie', 'halloween', 'natt', 'mörk'], name: 'Skräck', mood: 'dark', pal: { bg1: '#0b0c10', bg2: '#1f2833', ground: '#2b2b2b', top: '#5c5470', player: '#c5c6c7', enemy: '#8ac926', coin: '#ff9f1c', accent: '#b5179e', deco: '#66fcf1' } },
    { words: ['öken', 'desert', 'sand', 'pyramid', 'egypt', 'cowboy'], name: 'Öken', mood: 'bright', pal: { bg1: '#ffcf88', bg2: '#e07a3f', ground: '#c98b4a', top: '#f4c27a', player: '#3d5a80', enemy: '#9d0208', coin: '#fff3b0', accent: '#ffffff', deco: '#fff1d0' } },
  ];
  const SPACE = { name: 'Rymd', mood: 'dark', pal: { bg1: '#05060f', bg2: '#1a1446', ground: '#2c2a5a', top: '#6c63ff', player: '#4cc9f0', enemy: '#f72585', coin: '#ffd60a', accent: '#b8f2e6', deco: '#ffffff' } };
  const DEFAULT = { name: 'Nexora', mood: 'bright', pal: { bg1: '#1b1740', bg2: '#4b2a8a', ground: '#2d2366', top: '#8c7bff', player: '#38e1ff', enemy: '#ff4d8d', coin: '#ffd23f', accent: '#b69cff', deco: '#c9c1ff' } };

  const CONTROLS = {
    platformer: ['left', 'right', 'up'], shooter: ['left', 'right', 'up', 'down', 'action'], snake: ['left', 'right', 'up', 'down'],
    breakout: ['left', 'right', 'action'], dodger: ['left', 'right'], collector: ['left', 'right', 'up', 'down'],
    openworld: ['left', 'right', 'up', 'down', 'action'], runner3d: ['left', 'right', 'up'], arena3d: ['left', 'right', 'up', 'down'],
  };
  const HELP = {
    platformer: 'Pilar/WASD för att springa · Mellanslag/upp för att hoppa · hoppa på fiender',
    shooter: 'Pilar/WASD för att flyga · Mellanslag för att skjuta',
    snake: 'Pilar/WASD för att styra · ät och väx',
    breakout: 'Vänster/höger för racketen · Mellanslag för att serva',
    dodger: 'Vänster/höger för att väja · samla mynt',
    collector: 'Pilar/WASD för att röra dig · samla, undvik jägarna',
