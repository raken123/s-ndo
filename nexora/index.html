  const TEMPLATE_FN = {
    platformer: 'gamePlatformer', shooter: 'gameShooter', snake: 'gameSnake', breakout: 'gameBreakout', dodger: 'gameDodger',
    collector: 'gameCollector', openworld: 'gameOpenWorld', runner3d: 'gameRunner3D', arena3d: 'gameArena3D',
  };

  const NAMES_A = ['Stjärn', 'Skugg', 'Kristall', 'Neon', 'Storm', 'Drak', 'Mån', 'Pixel', 'Frost', 'Glöd', 'Kosmo', 'Turbo'];
  const NAMES_B = ['jakten', 'flykten', 'riket', 'stormen', 'resan', 'kampen', 'legenden', 'rusningen', 'äventyret', 'mysteriet'];
  const PEOPLE = ['Astrid', 'Björn', 'Freja', 'Ivar', 'Saga', 'Leif', 'Ylva', 'Tor', 'Ebba', 'Sigge', 'Tilde', 'Rune', 'Maja', 'Ove'];
  const ROLES = ['smeden', 'fiskaren', 'magikern', 'bagaren', 'vakten', 'jägaren', 'bibliotekarien', 'handlaren', 'vandraren', 'drottningen'];
  const ITEMS = ['kristaller', 'svampar', 'runstenar', 'fjädrar', 'guldmynt', 'stjärnfragment', 'äpplen', 'nycklar', 'pärlor', 'örter'];
  const TRAITS = ['modig', 'misstänksam', 'glad', 'trött', 'nyfiken', 'grinig', 'hemlighetsfull', 'pratglad', 'klok', 'nervös'];
  const WANTS = ['vill hitta sin försvunna bror', 'drömmer om att se havet', 'samlar på gamla kartor', 'vill bli den bästa i byn', 'gömmer ett gammalt svärd', 'letar efter en botemedel mot förbannelsen'];

  function pick(r, arr) { return arr[Math.floor(r() * arr.length)]; }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function rngOf(seed) {
    let s = (seed >>> 0) || 1;
    return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
  }

  function titleFrom(prompt, r, theme) {
    const q = prompt.match(/["“”']([^"“”']{3,40})["“”']/);
    if (q) return q[1];
    const m = prompt.match(/(?:heter|kallat|kallas|named|called)\s+([A-ZÅÄÖa-zåäö0-9 ]{3,30})/i);
    if (m) return cap(m[1].trim());
    const pre = { Lava: 'Lava', Is: 'Is', Skog: 'Skogs', Hav: 'Havs', Neon: 'Neon', Godis: 'Godis', Skräck: 'Skugg', Öken: 'Öken', Rymd: 'Stjärn' }[theme.name];
    return (pre && r() < 0.75 ? pre : pick(r, NAMES_A)) + pick(r, NAMES_B);
  }

  function analyze(prompt, opts) {
    const p = ' ' + prompt.toLowerCase() + ' ';
    const seed = hash(prompt + (opts.variant || ''));
    const r = rngOf(seed);
    const want3d = opts.dim === '3d' || (opts.dim !== '2d' && has(p, [' 3d', '3d-', 'tredimension']));
    let genre = null, best = 0;
    for (const g of GENRES) if (g.d3 === want3d) { const n = score(p, g.words); if (n > best) { best = n; genre = g; } }
    if (!genre && want3d) genre = GENRES.find(g => g.id === (r() < 0.5 ? 'runner3d' : 'arena3d'));
    if (!genre) genre = has(p, ['multiplayer', 'två spelare', '2 spelare']) ? GENRES.find(g => g.id === 'collector') : pick(r, GENRES.filter(g => !g.d3 && g.id !== 'openworld'));
    if (genre.id === 'openworld' && !opts.allowOpenWorld) genre = GENRES.find(g => g.id === 'platformer');
    let theme = THEMES.find(t => has(p, t.words));
    if (!theme && (genre.id === 'shooter' || has(p, ['rymd', 'space', 'planet', 'stjärn']))) theme = SPACE;
    theme = theme || DEFAULT;
    const difficulty = has(p, ['svår', 'hard', 'brutal', 'omöjlig', 'utmanande']) ? 2 : has(p, ['lätt', 'easy', 'barn', 'kids', 'enkel', 'mysig']) ? 0 : 1;
    return { seed, r, genre, theme, difficulty, title: titleFrom(prompt, r, theme) };
  }

  function questsFor(a, n) {
    const r = rngOf(a.seed ^ 0xabc);
    return Array.from({ length: n }, (_, i) => {
      const giver = pick(r, PEOPLE) + ' ' + pick(r, ROLES), item = ITEMS[(a.seed + i * 3) % ITEMS.length], count = 3 + Math.floor(r() * 4);
      return {
        giver, item, count, text: 'Hitta ' + count + ' ' + item + '.',
        lines: [
          pick(r, ['Äntligen någon!', 'Hallå där, främling.', 'Vänta lite!', 'Du ser ut att kunna hjälpa till.']),
          pick(r, ['Stormen i natt spred ut allt jag ägde.', 'Någon har stulit mina saker.', 'Jag behöver dem för ett viktigt recept.', 'Utan dem faller ' + a.theme.name.toLowerCase() + 'riket.']),
        ],
        thanks: pick(r, ['Du är en sann hjälte!', 'Tack! Nu kan jag äntligen sova.', 'Otroligt! Ta den här belöningen.']),
      };
    });
  }

  function config(prompt, opts) {
    const a = analyze(prompt, opts);
    const g = a.genre.id;
    return {
      id: 'g' + a.seed.toString(36),
      seed: a.seed, genre: g, genreLabel: a.genre.label, dim: a.genre.d3 ? '3d' : '2d',
      title: a.title, tagline: a.genre.label + ' · ' + a.theme.name + '-tema',
      palette: a.theme.pal, mood: a.theme.mood, difficulty: a.difficulty,
      controls: CONTROLS[g], help: HELP[g], music: !!opts.music, sfx: opts.sfx !== false,
      bpm: a.theme.mood === 'dark' ? 104 : 124,
      players: opts.multiplayer && g === 'collector' ? 2 : 1,
      doubleJump: /dubbel|double/.test(prompt.toLowerCase()) || a.difficulty === 0,
      autofire: /auto/.test(prompt.toLowerCase()), wrap: /wrap|genom väggar/.test(prompt.toLowerCase()),
      quests: g === 'openworld' ? questsFor(a, opts.quests ? 4 : 2) : undefined,
      prompt,
    };
  }

  function buildHtml(cfg, rt) {
    const fn = rt.templates[TEMPLATE_FN[cfg.genre]];
    const esc = s => String(s).replace(/[<&>"]/g, c => ({ '<': '&lt;', '&': '&amp;', '>': '&gt;', '"': '&quot;' }[c]));
    const safeJson = JSON.stringify(cfg).replace(/</g, '\\u003c');
    return '<!doctype html>\n<html lang="sv"><head><meta charset="utf-8">\n' +
      '<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">\n' +
      '<meta name="generator" content="Nexora">\n<title>' + esc(cfg.title) + '</title>\n' +
      '<style>html,body{margin:0;height:100%;overflow:hidden;background:' + cfg.palette.bg1 + ';touch-action:none}canvas{display:block}</' + 'style>\n' +
      '</head><body><canvas id="c"></canvas>\n<script>\n"use strict";\n' +
      rt.core + '\n' + fn.toString() + '\nNexoraRuntime(' + safeJson + ', ' + fn.name + ');\n</' + 'script></body></html>\n';
  }

  // ---------- text generators ----------
  function story(prompt) {
    const a = analyze(prompt, { dim: '2d' }), r = rngOf(a.seed ^ 11);
    const hero = pick(r, PEOPLE), villain = pick(r, ['Skuggkungen', 'Den Glömda', 'Järnhäxan', 'Mörkerdraken', 'Professor Kaos', 'Stormfursten']);
    const place = a.theme.name + 'landet';
    return [
      '# ' + a.title,
      '',
      '**Premiss.** I ' + place + ' har ' + villain + ' stulit ' + pick(r, ['ljuset', 'de sju kristallerna', 'tiden', 'alla färger', 'kungens krona']) + '. ' + hero + ', en ' + pick(r, TRAITS) + ' ' + pick(r, ROLES).replace(/n$/, '') + ', är den enda som inte har fallit i sömn.',
      '',
      '**Akt 1 – Uppvaknandet.** ' + hero + ' vaknar i en tyst by och hittar ett meddelande: "' + pick(r, ['Följ stjärnorna norrut.', 'Lita inte på spegeln.', 'Nyckeln är under bron.']) + '"',
      '',
      '**Akt 2 – Resan.** Genom ' + pick(r, ['de brinnande slätterna', 'den frusna skogen', 'labyrinten av neon', 'det sjunkna templet']) + ' möter ' + hero + ' allierade, men också ett svek från ' + pick(r, PEOPLE) + '.',
      '',
      '**Akt 3 – Striden.** I ' + villain + 's torn avslöjas sanningen: ' + pick(r, ['skurken var en gång hjälte.', hero + ' och skurken är syskon.', 'allt var en dröm – men dröm kan bli verklighet.', 'kristallerna var aldrig stulna, bara gömda.']),
      '',
      '**Slut.** ' + pick(r, ['Ljuset återvänder och byn firar i tre dagar.', 'Hjälten blir ny väktare över landet.', 'Ett nytt hot anas vid horisonten…']),
    ].join('\n');
  }
  function npcs(prompt, n) {
    const a = analyze(prompt, { dim: '2d' }), r = rngOf(a.seed ^ 22);
    return Array.from({ length: n || 4 }, () => {
      const name = pick(r, PEOPLE);
      return { name, role: pick(r, ROLES), trait: pick(r, TRAITS), want: pick(r, WANTS), line: pick(r, ['"Har du sett min katt?"', '"Här i ' + a.theme.name.toLowerCase() + 'landet händer inget… eller?"', '"Köp något eller gå vidare."', '"Jag vet mer än jag säger."']) };
    });
  }
  function quests(prompt, n) {
    const a = analyze(prompt, { dim: '2d' });
    return questsFor(a, n || 3).map(q => ({ title: cap(q.item) + ' åt ' + q.giver, giver: q.giver, goal: q.text, reward: (q.count * 50) + ' guld', steps: [q.lines[1], 'Utforska och samla ' + q.count + ' ' + q.item + '.', 'Återvänd till ' + q.giver.split(' ')[0] + '.'] }));
  }
  function dialog(prompt) {
    const list = npcs(prompt, 2), r = rngOf(hash(prompt) ^ 33);
    const [x, y] = list;
    return [
      x.name + ': ' + pick(r, ['Du igen?', 'Äntligen är du här.', 'Shh, inte så högt!']),
      y.name + ': ' + pick(r, ['Jag hörde vad som hände vid bron.', 'Vi har inte mycket tid.', 'Jag tog med kartan.']),
      x.name + ': ' + pick(r, ['Då vet du att vi måste gå i natt.', 'Kartan ljuger. Den har alltid ljugit.', 'Bra. Men vem kan vi lita på?']),
      y.name + ': ' + pick(r, ['Ingen. Bara varandra.', 'Smeden. Hon skyldar mig en tjänst.', 'Jag vet inte… men jag följer med.']),
      x.name + ': ' + pick(r, ['Då kör vi.', 'Ta facklan. Vi går.', 'Om vi inte kommer tillbaka – säg inget till mamma.']),
    ].join('\n');
  }

  // ---------- pixel sprite (SVG) ----------
  function sprite(prompt, size) {
    const a = analyze(prompt, { dim: '2d' }), r = rngOf(a.seed ^ 44), n = size || 12, pal = a.theme.pal;
    const colors = [pal.player, pal.accent, pal.enemy, pal.coin];
    const half = Math.ceil(n / 2), grid = [];
    for (let y = 0; y < n; y++) {
      grid.push([]);
      for (let x = 0; x < half; x++) {
        const dx = (x - half + 0.5) / half, dy = (y - n / 2 + 0.5) / (n / 2);
        const pr = 0.85 - Math.hypot(dx * 0.9, dy) * 0.9;
        grid[y][x] = r() < pr ? (r() < 0.75 ? 1 : 2) : 0;
      }
    }
    let rects = '';
    const c1 = pick(r, colors), c2 = pick(r, colors.filter(c => c !== c1));
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      const v = grid[y][x < half ? x : n - 1 - x];
      if (!v) continue;
      rects += '<rect x="' + x + '" y="' + y + '" width="1.02" height="1.02" fill="' + (v === 1 ? c1 : c2) + '"/>';
    }
    // outline + eyes
    const ey = Math.floor(n * 0.4);
    rects += '<rect x="' + (half - 3) + '" y="' + ey + '" width="1" height="1" fill="#fff"/><rect x="' + (n - half + 2) + '" y="' + ey + '" width="1" height="1" fill="#fff"/>';
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 -1 ' + (n + 2) + ' ' + (n + 2) + '" shape-rendering="crispEdges" width="256" height="256">' + rects + '</svg>';
  }

  // ---------- low-poly meshes ----------
  function mesh(prompt) {
    const p = prompt.toLowerCase(), a = analyze(prompt, { dim: '3d' }), r = rngOf(a.seed ^ 55), pal = a.theme.pal;
    const V = [], F = [], Cc = [];
    function add(vs, fs, col) { const o = V.length; vs.forEach(v => V.push(v)); fs.forEach(f => { F.push(f.map(i => i + o)); Cc.push(typeof col === 'function' ? col() : col); }); }
    function cyl(x, y, z, r0, r1, h, seg, col) {
      const vs = [], fs = [];
      for (let i = 0; i < seg; i++) { const t = i / seg * Math.PI * 2; vs.push([x + Math.cos(t) * r0, y, z + Math.sin(t) * r0]); vs.push([x + Math.cos(t) * r1, y + h, z + Math.sin(t) * r1]); }
      for (let i = 0; i < seg; i++) { const j = (i + 1) % seg; fs.push([i * 2, j * 2, j * 2 + 1, i * 2 + 1]); }
      const bot = [], top = []; for (let i = 0; i < seg; i++) { bot.push(i * 2); top.push(i * 2 + 1); }
      fs.push(bot); if (r1 > 0.001) fs.push(top.reverse());
      add(vs, fs, col);
    }
    function boxm(x, y, z, sx, sy, sz, col) {
      const vs = []; for (let i = 0; i < 8; i++) vs.push([x + (i & 1 ? sx : -sx) / 2, y + (i & 2 ? sy : 0), z + (i & 4 ? sz : -sz) / 2]);
      add(vs, [[0, 1, 3, 2], [4, 6, 7, 5], [0, 4, 5, 1], [2, 3, 7, 6], [0, 2, 6, 4], [1, 5, 7, 3]], col);
    }
    function rock(x, y, z, s, col) {
      const vs = [], fs = [], seg = 7;
      vs.push([x, y + s * (1.1 + r() * 0.4), z]);
      for (let i = 0; i < seg; i++) { const t = i / seg * Math.PI * 2, rr = s * (0.8 + r() * 0.4); vs.push([x + Math.cos(t) * rr, y + s * 0.45 * r(), z + Math.sin(t) * rr]); }
      for (let i = 0; i < seg; i++) { const j = (i + 1) % seg; fs.push([0, 1 + i, 1 + j]); }
      const base = []; for (let i = 0; i < seg; i++) base.push(1 + i); fs.push(base);
      add(vs, fs, col);
    }
    let name;
    if (has(p, ['träd', 'tree', 'gran', 'skog'])) {
      name = 'Träd'; cyl(0, 0, 0, 0.18, 0.12, 1.2, 6, '#7a4a2a');
      for (let i = 0; i < 3; i++) cyl(0, 0.9 + i * 0.55, 0, 0.95 - i * 0.25, 0.001, 1.0, 8, i % 2 ? '#2f8f46' : '#3fae57');
    } else if (has(p, ['hus', 'house', 'stuga', 'hem'])) {
      name = 'Hus'; boxm(0, 0, 0, 2, 1.3, 1.6, '#e9d8a6');
      add([[-1.1, 1.3, -0.9], [1.1, 1.3, -0.9], [1.1, 1.3, 0.9], [-1.1, 1.3, 0.9], [0, 2.1, -0.9], [0, 2.1, 0.9]], [[0, 1, 4], [3, 5, 2], [0, 4, 5, 3], [1, 2, 5, 4]], '#ae2012');
      boxm(0, 0, -0.81, 0.4, 0.8, 0.04, '#6b3e26'); boxm(0.6, 0.6, -0.81, 0.35, 0.35, 0.04, '#9bd1ff');
    } else if (has(p, ['skepp', 'ship', 'rymdskepp', 'spaceship', 'raket', 'rocket'])) {
      name = 'Rymdskepp'; cyl(0, 0, 0, 0.45, 0.001, 2.2, 8, pal.player); cyl(0, -0.4, 0, 0.3, 0.45, 0.4, 8, pal.accent);
      add([[0, 0.2, 0], [1.2, -0.3, 0], [0, 1, 0]], [[0, 1, 2]], pal.enemy); add([[0, 0.2, 0], [-1.2, -0.3, 0], [0, 1, 0]], [[0, 1, 2]], pal.enemy);
      add([[0, 0.2, 0], [0, -0.3, 1.2], [0, 1, 0]], [[0, 1, 2]], pal.enemy);
    } else if (has(p, ['bil', 'car', 'racer'])) {
      name = 'Bil'; boxm(0, 0.25, 0, 1.2, 0.45, 2.2, pal.enemy); boxm(0, 0.7, -0.1, 1.0, 0.4, 1.1, '#9bd1ff');
      [[-0.62, 0.7], [0.62, 0.7], [-0.62, -0.7], [0.62, -0.7]].forEach(([x, z]) => cyl(x, 0, z, 0.26, 0.26, 0.2, 8, '#222'));
    } else if (has(p, ['kristall', 'crystal', 'diamant', 'gem', 'ädelsten'])) {
      name = 'Kristall';
      for (let i = 0; i < 5; i++) { const a2 = r() * 6.28, d = i ? 0.35 + r() * 0.3 : 0; cyl(Math.cos(a2) * d, 0, Math.sin(a2) * d, 0.22 + r() * 0.1, 0.001, 0.9 + r() * 1.3, 6, () => pick(r, [pal.accent, pal.player, '#c8b6ff'])); }
    } else if (has(p, ['torn', 'tower', 'slott', 'castle', 'borg'])) {
      name = 'Torn'; cyl(0, 0, 0, 0.8, 0.7, 2.6, 10, '#b8b8c8');
      for (let i = 0; i < 8; i++) { const t = i / 8 * 6.28; boxm(Math.cos(t) * 0.68, 2.6, Math.sin(t) * 0.68, 0.25, 0.3, 0.25, '#9a9ab0'); }
      cyl(0, 2.6, 0, 0.6, 0.001, 1.1, 10, pal.enemy);
    } else if (has(p, ['karaktär', 'character', 'gubbe', 'hjälte', 'hero', 'robot', 'figur'])) {
      name = 'Karaktär'; boxm(0, 0.9, 0, 0.8, 0.9, 0.45, pal.player); boxm(0, 1.85, 0, 0.55, 0.55, 0.55, '#f2d2b0');
      boxm(-0.18, 0, 0, 0.28, 0.9, 0.3, '#334'); boxm(0.18, 0, 0, 0.28, 0.9, 0.3, '#334');
      boxm(-0.55, 1.05, 0, 0.22, 0.75, 0.25, pal.player); boxm(0.55, 1.05, 0, 0.22, 0.75, 0.25, pal.player);
      boxm(-0.12, 2.0, -0.28, 0.08, 0.08, 0.02, '#111'); boxm(0.12, 2.0, -0.28, 0.08, 0.08, 0.02, '#111');
    } else {
      name = 'Sten'; rock(0, 0, 0, 1, '#8d8d99'); rock(0.9, 0, 0.4, 0.5, '#7a7a88'); rock(-0.7, 0, -0.5, 0.4, '#9a9aa8');
    }
    return { name, vertices: V.map(v => v.map(n => Math.round(n * 1000) / 1000)), faces: F, colors: Cc };
  }

  function toObj(m) {
    let s = '# Nexora 3D 1 – ' + (m.name || 'modell') + '\n';
    m.vertices.forEach(v => { s += 'v ' + v.join(' ') + '\n'; });
    m.faces.forEach(f => { s += 'f ' + f.map(i => i + 1).join(' ') + '\n'; });
    return s;
  }

  // ---------- audio rendering (music + sfx) to WAV ----------
  function wav(buffer) {

    if (kind === 'kick') { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.15); g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.3); o.connect(g); g.connect(dest); o.start(t); o.stop(t + 0.32); return; }

  async function music(prompt, seconds) {

    const bpm = has(p, ['snabb', 'fast', 'action', 'boss', 'energi']) ? 150 : has(p, ['lugn', 'calm', 'chill', 'mysig', 'meny']) ? 84 : 118;
    const sr = 44100, len = seconds || 24, ctx = new OfflineAudioContext(2, sr * len, sr);
    const master = ctx.createGain(); master.gain.value = 0.5; master.connect(ctx.destination);
    const scale = dark ? [0, 2, 3, 5, 7, 8, 10] : [0, 2, 4, 5, 7, 9, 11];
    const prog = dark ? [0, 5, 3, 4] : pick(r, [[0, 4, 5, 3], [0, 3, 4, 4], [0, 5, 3, 4]]);
    const root = 110 * Math.pow(2, Math.floor(r() * 7) / 12), beat = 60 / bpm;
    const lead = pick(r, ['square', 'triangle', 'sawtooth']);
    const motif = Array.from({ length: 8 }, () => (r() < 0.8 ? Math.floor(r() * 7) : null));
    const f = deg => root * Math.pow(2, (scale[((deg % 7) + 7) % 7] + 12 * Math.floor(deg / 7)) / 12);
    for (let bar = 0; bar * 4 * beat < len; bar++) {
      const t0 = bar * 4 * beat, chord = prog[bar % 4];

      for (let b = 0; b < 4; b++) {
        note(ctx, master, f(chord) / 2, t0 + b * beat, beat * 0.9, 'triangle', 0.22);
        drum(ctx, master, t0 + b * beat, b % 2 ? 'snare' : 'kick');
        drum(ctx, master, t0 + b * beat + beat / 2, 'hat');
      }
      if (bar >= 2) for (let i = 0; i < 8; i++) {

  }
  async function sfx(kind, seed) {
    const sr = 44100, ctx = new OfflineAudioContext(1, sr * 0.8, sr), r = rngOf(hash(kind + seed));

    if (kind === 'hopp') set('square', 260, 780, 0.22);
    else if (kind === 'mynt') { o.type = 'square'; o.frequency.setValueAtTime(988 * j, 0); o.frequency.setValueAtTime(1319 * j, 0.07); env.gain.setValueAtTime(0.5, 0); env.gain.exponentialRampToValueAtTime(0.001, 0.35); o.start(0); o.stop(0.4); }
    else if (kind === 'laser') set('sawtooth', 1600, 120, 0.25);

      o.type = 'sine'; o.frequency.value = 60; env.gain.setValueAtTime(0.001, 0); o.start(0); o.stop(0.1);
      const b = ctx.createBuffer(1, sr * 0.7, sr), d = b.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (r() * 2 - 1) * Math.pow(1 - i / d.length, 2);
      const s = ctx.createBufferSource(), lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(3000, 0); lp.frequency.exponentialRampToValueAtTime(200, 0.6);
      s.buffer = b; s.connect(lp); lp.connect(g); s.start(0);
    }
    return wav(await ctx.startRendering());
  }

  window.NexoraLocal = { hash, analyze, config, buildHtml, story, npcs, quests, dialog, sprite, mesh, toObj, music, sfx, wav, GENRES, TEMPLATE_FN };
})();

(function () {

  const MODELS = {
    flash: { name: 'Nexora Flash 1', short: 'Flash 1', tag: 'Snabb', kind: 'text', minTier: 0, desc: 'Snabbast. Bra för prototyper och små spel på några sekunder.' },

  };

  // What each Nexora model runs on with the Anthropic provider.
  const ANTHROPIC = {
    flash: { model: 'claude-haiku-4-5', max_tokens: 16000 },
    pro: { model: 'claude-opus-5', max_tokens: 64000, output_config: { effort: 'medium' }, fallbacks: true },
    core: { model: 'claude-opus-5', max_tokens: 64000, thinking: { type: 'adaptive', display: 'summarized' }, output_config: { effort: 'xhigh' }, fallbacks: true },
    image: { model: 'claude-opus-5', max_tokens: 32000, output_config: { effort: 'medium' }, fallbacks: true },
    d3: { model: 'claude-opus-5', max_tokens: 32000, output_config: { effort: 'medium' }, fallbacks: true },
  };

  const DEFAULT_SETTINGS = {
    provider: 'local',
    anthropicKey: '',
    openaiBase: 'https://api.openai.com/v1',
    openaiKey: '',
    openaiModels: { flash: 'gpt-5-fast', pro: 'gpt-6-astra', core: 'gpt-6-astra', image: 'gpt-images-2.5', d3: 'gpt-6-astra' },
    openaiImageApi: true,
  };

  const GAME_SYSTEM = [
    'You are Nexora, an AI game studio. You write complete, polished, playable browser games.',
    'Output exactly one HTML document inside a single ```html fenced block and nothing after it.',
    'Hard requirements:',
    '- Everything inline in that one file: no external scripts, fonts, images, CDNs or network requests. Draw graphics with canvas or inline SVG; make sound with the Web Audio API.',
    '- It runs inside a sandboxed iframe: wrap any localStorage access in try/catch.',
    '- Full-window responsive canvas that handles resize and devicePixelRatio.',
    '- Keyboard controls (arrows/WASD + Space) AND on-screen touch buttons on touch devices.',
    '- A title screen with the game name and how to play, a score/HUD, a game-over or win screen, and restart.',
    '- A steady requestAnimationFrame loop with delta time; no runaway memory growth.',
    '- All player-facing text in Swedish.',
    'Make it genuinely fun: juice (particles, screen shake, sound), a difficulty curve, and a clear goal.',
  ].join('\n');

  const FEATURE_TEXT = {
    threeD: '3D: render in real-time 3D with WebGL or your own canvas projection written from scratch (no libraries).',
    story: 'Story: include a short narrative intro and an ending that pays it off.',
    dialog: 'Dialogue: characters speak in dialogue boxes the player advances with Space/tap.',
    openworld: 'Open world: a large procedurally generated world with a camera that follows the player and a minimap.',
    npc: 'NPCs: several named NPCs with distinct personalities and schedules or behaviours.',
    quest: 'Quests: a quest log with at least three quests, tracked progress and rewards.',
    music: 'Music: a procedural background soundtrack with Web Audio, toggled with M.',
    sfx: 'Sound effects for every important action.',
    multiplayer: 'Multiplayer: local 2-player on one keyboard (P1 WASD+F, P2 arrows+Enter) with split scores.',
    assets: 'Use these user-supplied SVG assets where they fit (embed them as data URIs):',
  };

  function gamePrompt(prompt, opts) {
    const lines = ['Game idea: ' + prompt, '', 'Dimension: ' + (opts.dim === '3d' ? '3D' : '2D') + '.'];
    for (const k of opts.features || []) if (FEATURE_TEXT[k] && k !== 'assets') lines.push(FEATURE_TEXT[k]);
    if (opts.assets && opts.assets.length) {
      lines.push(FEATURE_TEXT.assets);
      opts.assets.slice(0, 6).forEach(a => lines.push('- ' + a.name + ': ' + a.svg.slice(0, 6000)));
    }
    return lines.join('\n');
  }

  function extractHtml(text) {
    const m = text.match(/```html\s*([\s\S]*?)```/i) || text.match(/```\s*(<!doctype[\s\S]*?)```/i);
    if (m) return m[1].trim();
    const i = text.search(/<!doctype html|<html/i);
    if (i >= 0) return text.slice(i).replace(/```\s*$/, '').trim();
    return null;
  }
  function extractJson(text) {
    const m = text.match(/```(?:json)?\s*([\s\S]*?)```/i);
    const s = m ? m[1] : text.slice(text.indexOf('{'), text.lastIndexOf('}') + 1);
    return JSON.parse(s);
  }
  function extractSvg(text) {
    const i = text.search(/<svg[\s>]/i), j = text.lastIndexOf('</svg>');
    return i >= 0 && j > i ? text.slice(i, j + 6) : null;
  }

  async function readSSE(res, onEvent, signal) {
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '';
    for (;;) {
      if (signal && signal.aborted) { reader.cancel(); throw new DOMException('Avbruten', 'AbortError'); }
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf('\n\n')) >= 0) {
        const chunk = buf.slice(0, idx); buf = buf.slice(idx + 2);
        const data = chunk.split('\n').filter(l => l.startsWith('data:')).map(l => l.slice(5).trim()).join('\n');
        if (!data || data === '[DONE]') continue;
        try { onEvent(JSON.parse(data)); } catch (e) { if (e && e.nexora) throw e; }
      }
    }
  }

  function apiError(msg) { const e = new Error(msg); e.nexora = true; return e; }

  async function httpError(res) {
    let detail = '';
    try { const j = await res.json(); detail = (j.error && (j.error.message || j.error.type)) || JSON.stringify(j); } catch (e) { detail = res.statusText; }
    if (res.status === 401) return apiError('Ogiltig API-nyckel (401). Kontrollera nyckeln under Inställningar.');
    if (res.status === 429) return apiError('För många förfrågningar just nu (429). Vänta en stund och försök igen.');
    if (res.status === 529 || res.status >= 500) return apiError('AI-tjänsten är överbelastad (' + res.status + '). Försök igen om en stund.');
    return apiError('API-fel ' + res.status + ': ' + detail);
  }

  // Claude Messages API, streamed.
  async function anthropic(settings, modelKey, system, user, cb, signal) {
    const spec = ANTHROPIC[modelKey];
    const body = { model: spec.model, max_tokens: spec.max_tokens, stream: true, system, messages: [{ role: 'user', content: user }] };

    if (spec.output_config) body.output_config = spec.output_config;

      'content-type': 'application/json',
      'x-api-key': settings.anthropicKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',

  async function openai(settings, modelKey, system, user, cb, signal) {

      method: 'POST', signal,
      headers: Object.assign({ 'content-type': 'application/json' }, settings.openaiKey ? { authorization: 'Bearer ' + settings.openaiKey } : {}),
      body: JSON.stringify({ model, stream: true, messages: [{ role: 'system', content: system }, { role: 'user', content: user }] }),
    });

    const r = await complete(settings, modelKey, GAME_SYSTEM, gamePrompt(prompt, opts), cb, signal);
    const html = extractHtml(r.text);
    if (!html) throw apiError('Modellen returnerade ingen HTML. Försök igen.');
    return { html, model: r.model, stop: r.stop };
  }

  async function fixGame(settings, modelKey, html, errors, cb, signal) {
    const sys = GAME_SYSTEM + '\nYou are now fixing bugs in an existing game. Keep everything that works; change only what is needed.';

    npc: 'Create 4 NPCs for this game in Swedish. For each: name, role, personality, what they want, a signature line. Markdown list.',

  };
  async function text(settings, modelKey, task, prompt, cb, signal) {
    const r = await complete(settings, modelKey, 'You are Nexora, a creative writing assistant for game developers. Answer only with the requested content.', TEXT_TASKS[task] + '\n\nGame: ' + prompt, cb, signal);

    const svg = extractSvg(r.text);
    if (!svg) throw apiError('Ingen SVG i svaret. Försök igen.');
    return { svg };
  }

  async function mesh(settings, prompt, cb, signal) {
    const r = await complete(settings, 'd3', 'You are Nexora 3D 1, a low-poly 3D modeller.',

      'Return only JSON: {"name": string, "vertices": [[x,y,z],...], "faces": [[i,j,k,...],...] (0-based, counter-clockwise seen from outside), "colors": ["#rrggbb" per face]}.\n\nModel: ' + prompt, cb, signal);
    const m = extractJson(r.text);
    if (!Array.isArray(m.vertices) || !Array.isArray(m.faces)) throw apiError('Ogiltig 3D-modell i svaret.');
    return m;
  }

  window.NexoraAI = { MODELS, ANTHROPIC, DEFAULT_SETTINGS, GAME_SYSTEM, gamePrompt, generateGame, fixGame, text, image, mesh, extractHtml };
})();

  // Runs the game hidden for a few seconds and collects runtime errors.
  function collectErrors(html, ms) {
    return new Promise(res => {
      const errs = [], tag = 'nx' + Math.random().toString(36).slice(2);
      const probe = '<script>(function(){function s(m){parent.postMessage({' + tag + ':String(m).slice(0,400)},"*")}' +
        'addEventListener("error",function(e){s((e.message||"Fel")+" (rad "+e.lineno+")")});' +
        'addEventListener("unhandledrejection",function(e){s("Promise: "+(e.reason&&e.reason.message||e.reason))});' +
        'var ce=console.error;console.error=function(){s("console.error: "+[].join.call(arguments," "));ce.apply(console,arguments)};' +
        'setTimeout(function(){try{["keydown","keyup"].forEach(function(t){dispatchEvent(new KeyboardEvent(t,{code:"Space",key:" "}))})}catch(e){s(e)}},600);})();</' + 'script>';
      const withProbe = /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, m => m + probe) : probe + html;
      const f = h('iframe', { sandbox: 'allow-scripts', style: 'position:fixed;left:-9999px;width:800px;height:600px', srcdoc: withProbe });
      const on = e => { if (e.data && e.data[tag] && errs.length < 20) errs.push(e.data[tag]); };
      addEventListener('message', on); document.body.appendChild(f);
      setTimeout(() => { removeEventListener('message', on); f.remove(); res(errs); }, ms || 3500);
    });
  }

      if (S.settings.provider === 'local') {
        out.textContent += errs.length ? '\nKoppla in Claude eller en egen modell under Inställningar för att låta AI:n rätta felen automatiskt.' : '\nSpelet ser friskt ut.';
        return;
      }
      out.textContent += '\nBer ' + AI.MODELS[g.model === 'flash' ? 'flash' : 'pro'].name + ' att rätta spelet…\n';
      try {

        const fixed = await AI.fixGame(S.settings, g.model === 'core' ? 'core' : 'pro', g.html, errs, { text: (d, all) => { if (++n % 40 === 0) out.textContent = out.textContent.replace(/\n· \d+ kB$/, '') + '\n· ' + Math.round(all.length / 1000) + ' kB'; } });

        out.textContent += '\nKlart. Fel efter fix: ' + after.length + (after.length ? '\n' + after.join('\n') : '') + '\n';
        onDone(g);
      } catch (e) { out.textContent += '\nFel: ' + e.message; }
    })();
  }

  const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  function crc32(b) { let c = 0xffffffff; for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0; }
  // Minimal store-only ZIP writer (no compression) – enough for small project exports.
  function zip(files) {
    const enc = new TextEncoder(), parts = [], central = []; let off = 0;
    for (const [name, content] of Object.entries(files)) {
      const nb = enc.encode(name), data = typeof content === 'string' ? enc.encode(content) : content, crc = crc32(data);
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
      lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, nb.length, true);
      parts.push(new Uint8Array(lh.buffer), nb, data);
      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
      ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, nb.length, true); ch.setUint32(42, off, true);
      central.push(new Uint8Array(ch.buffer), nb);
      off += 30 + nb.length + data.length;
    }
    const csize = central.reduce((a, b) => a + b.length, 0), n = Object.keys(files).length;
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true); end.setUint16(8, n, true); end.setUint16(10, n, true); end.setUint32(12, csize, true); end.setUint32(16, off, true);
    return new Blob(parts.concat(central, [new Uint8Array(end.buffer)]), { type: 'application/zip' });
  }

          h('button', { class: 'btn', title: 'Dina spel som träningsdata för Colab-anteckningsboken', onclick: async () => {

  // ---------------------------------------------------------------- tools
  function toolCard(icon, title, feat, body) {

      body);
  }
  function runBtn(label, feat, fn) {
    const b = h('button', { class: 'btn primary sm' }, label);
    b.addEventListener('click', async () => {
      if (feat && !need(feat)) return;
      const old = b.textContent; b.disabled = true; b.textContent = 'Genererar…';
      try { await fn(); } catch (e) { toast(e.message || String(e), 5000); } finally { b.disabled = false; b.textContent = old; }
    });
    return b;
  }
  const useAI = () => S.settings.provider !== 'local';

  VIEWS.verktyg = main => {
    const idea = h('input', { type: 'text', placeholder: 'Spelets idé, t.ex. "ett vikingaäventyr i en frusen skog"' });
    idea.value = S.studio.prompt || '';
    const txt = (task, feat, localFn) => {
      const out = h('div', { class: 'out muted' }, 'Resultatet visas här.');
      return [out, h('div', { class: 'row' }, runBtn('Generera', feat, async () => {
        const p = idea.value.trim() || 'ett äventyrsspel';
        out.classList.remove('muted');
        if (useAI()) { out.textContent = ''; await AI.text(S.settings, 'flash', task, p, { text: (d, all) => { out.textContent = all; } }); }
        else out.textContent = localFn(p);
      }), h('button', { class: 'btn sm ghost', onclick: () => { navigator.clipboard && navigator.clipboard.writeText(out.textContent); toast('Kopierat'); } }, 'Kopiera'))];
    };
    // image
    const art = h('div', { class: 'art' }, h('span', { class: 'muted' }, 'Ingen bild än'));
    const imgIn = h('input', { type: 'text', placeholder: 'T.ex. "en söt drake i pixelstil"' });
    let lastArt = null;
    const imageBody = [imgIn, art, h('div', { class: 'row' },
      runBtn('Generera', 'gfx', async () => {
        const p = imgIn.value.trim() || idea.value.trim() || 'en hjälte';

      h('button', { class: 'btn sm', onclick: () => { if (!lastArt) return toast('Generera en bild först'); if (!need('assets')) return; assets.put({ id: 'a' + Date.now().toString(36), name: lastArt.name, svg: lastArt.svg || null, url: lastArt.url || null, t: Date.now() }).then(() => { toast('Sparad i Mina assets'); drawAssets(); }); } }, 'Spara som asset'),
      h('button', { class: 'btn sm ghost', onclick: () => { if (!lastArt) return; if (lastArt.svg) download(slug(lastArt.name) + '.svg', lastArt.svg, 'image/svg+xml'); else window.open(lastArt.url, '_blank'); } }, 'Ladda ner'))];
    // 3d

    const meshIn = h('input', { type: 'text', placeholder: 'T.ex. "ett torn", "ett träd", "ett rymdskepp"' });

    const g3 = Nx3D(cv.getContext('2d'));
    function spin() {
      const c = cv.getContext('2d'), w = cv.clientWidth || 600, hh = cv.clientHeight || 260, d = Math.min(devicePixelRatio || 1, 2);
      if (cv.width !== w * d) { cv.width = w * d; cv.height = hh * d; }
      c.setTransform(d, 0, 0, d, 0, 0); c.fillStyle = '#0b0b20'; c.fillRect(0, 0, w, hh);
      const vs = curMesh.vertices, ys = vs.map(v => v[1]), top = Math.max.apply(null, ys.concat([1])), span = Math.max(1, top - Math.min.apply(null, ys));
      rot += 0.012; g3.cam.yaw = rot; g3.cam.pitch = 0.35;
      const dist = span * 1.8 + 1.4; g3.cam.x = -Math.sin(rot) * dist; g3.cam.z = -Math.cos(rot) * dist; g3.cam.y = top * 0.5 + dist * 0.36; g3.cam.far = 200; g3.cam.fov = 1.1;
      g3.begin(w, hh);
      for (let i = -3; i < 3; i++) for (let j = -3; j < 3; j++) g3.poly([[i, 0, j], [i + 1, 0, j], [i + 1, 0, j + 1], [i, 0, j + 1]], (i + j) % 2 ? '#1c1c3a' : '#24244a', [0, 1, 0]);
      g3.mesh(curMesh, 0, 0.001, 0, 1, 0);
      g3.flush();
      raf = requestAnimationFrame(spin);
    }
    raf = requestAnimationFrame(spin);
    const meshInfo = h('div', { class: 'small muted' }, curMesh.name + ' · ' + curMesh.faces.length + ' ytor');

    // music

    // sfx

      ['hopp', 'mynt', 'laser', 'explosion', 'powerup', 'träff'].map(k => runBtn(k, 'sfx', async () => {
        const blob = await L.sfx(k, Date.now()), url = URL.createObjectURL(blob), a = new Audio(url); a.play().catch(() => {});
        sfxLast = { k, blob };
      }))), h('button', { class: 'btn sm ghost', onclick: () => sfxLast ? download('nexora-' + sfxLast.k + '.wav', sfxLast.blob) : toast('Generera ett ljud först') }, 'Ladda ner senaste')];
    let sfxLast = null;
    // voice
    const vText = h('textarea', { style: 'min-height:70px' }); vText.value = 'Välkommen, äventyrare. Kungariket behöver din hjälp.';
    const vSel = h('select');
    const fillVoices = () => {
      const vs = (window.speechSynthesis ? speechSynthesis.getVoices() : []);

    const pitch = h('input', { type: 'range', min: 0.5, max: 2, step: 0.1, value: 1 }), rate = h('input', { type: 'range', min: 0.5, max: 1.6, step: 0.1, value: 1 });
    const voiceBody = [vText, vSel, h('label', { class: 'row small' }, h('span', { style: 'width:70px' }, 'Tonhöjd'), pitch), h('label', { class: 'row small' }, h('span', { style: 'width:70px' }, 'Tempo'), rate), h('div', { class: 'row' }, runBtn('Läs upp', 'voice', async () => {
      if (!window.speechSynthesis) throw new Error('Den här webbläsaren saknar talsyntes.');

          h('p', { class: 'small muted' }, 'SVG-assets skickas med till AI:n när du kryssar i "Mina assets" i Studio.')]))));

  };

  // ---------------------------------------------------------------- team
  VIEWS.team = main => {

        h('p', null, 'Teamarbete, delade projekt och versionshantering ingår i ', h('b', null, '🏢 Studio'), ' och ', h('b', null, '👑 Enterprise'), '.'),
        h('div', { class: 'row' }, h('button', { class: 'btn primary', onclick: () => checkout(PLANS[3]) }, 'Välj Studio – 999 kr/mån')))));

    }

    const nameIn = h('input', { type: 'text', placeholder: 'Namn eller e-post' }), roleSel = h('select', null, ['Utvecklare', 'Grafiker', 'Ljud', 'Designer', 'Admin'].map(r => h('option', null, r)));

    }

    const cloud = [['Privat molnlagring', 'Kräver Nexora Cloud'], ['Dedicated servrar', 'Kräver Nexora Cloud'], ['API-åtkomst', 'Kräver Nexora Cloud'], ['Realtidssynk i teamet', 'Kräver Nexora Cloud'], ['Delade projekt', 'Fungerar via projektfiler (.nexora.json)'], ['Versionshantering', 'Fungerar – upp till 30 versioner per spel']];

    main.append(h('section', { class: 'wrap' }, h('h1', null, 'Team'),
      h('div', { class: 'grid g2' },
        h('div', { class: 'card col' }, h('h3', null, 'Medlemmar ' + (maxMembers === Infinity ? '(obegränsat)' : '(max ' + maxMembers + ')')), list,
          h('div', { class: 'row' }, nameIn, roleSel, h('button', { class: 'btn primary sm', onclick: () => {
            const n = nameIn.value.trim(); if (!n) return;
            if (S.team.length >= maxMembers) return upsell(null, 'Obegränsade teammedlemmar ingår i Enterprise.', 4);
            S.team.push({ name: n, role: roleSel.value }); store.set('team', S.team); nameIn.value = ''; draw();
          } }, 'Bjud in'))),
        h('div', { class: 'card col' }, h('h3', null, 'Status'), h('table', { class: 't' }, cloud.map(([a, b]) => h('tr', null, h('td', null, a), h('td', { class: /Kräver/.test(b) ? 'muted' : '' }, b)))),
          h('p', { class: 'note' }, 'Molnfunktionerna behöver en backend som inte är driftsatt i den här versionen. Teamlistan sparas lokalt; dela projekt genom att exportera "Nexora-projekt" och importera under Mina spel.')))));

      return h('div', { class: 'card col' }, h('div', { style: 'font-size:2rem' }, icon), h('h3', null, title), h('p', { class: 'muted small' }, sub),
        d ? h('a', { class: 'btn primary', href: base + d.file, download: d.file }, '⬇️ ' + d.file)
          : id === 'html' ? h('a', { class: 'btn primary', href: base + 'nexora-' + VERSION + '.html', download: 'nexora-' + VERSION + '.html' }, '⬇️ nexora-' + VERSION + '.html')
