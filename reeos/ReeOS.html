/* ===== js/apps/nav.js ===== */
/** Navigation.
 *  Online: OpenStreetMap-rutor + OSRM-rutt med svängar.
 *  Offline: kompassläge med bäring och fågelvägen — hellre en ärlig pil
 *  än en karta som ljuger när täckningen tar slut. */





const TILE = 256;
const tileCache = new Map();     // "z/x/y" -> Image
const MAX_TILES = 260;

/* navigator.onLine kan säga "uppkopplad" när rutorna ändå inte kommer fram
   (tunnel, blockerad brandvägg, död wifi). Vi litar på utfallet, inte flaggan. */
const tileHealth = { ok: 0, fail: 0, since: Date.now() };

function tilesUsable() {
  if (Date.now() - tileHealth.since > 30000) {
    // Ge nätet en ny chans med jämna mellanrum.
    tileHealth.ok = 0;
    tileHealth.fail = 0;
    tileHealth.since = Date.now();
  }
  return !(tileHealth.fail >= 5 && tileHealth.ok === 0);
}

const nav = {
  destination: null,   // { label, lat, lon }
  route: null,         // { coords: [[lat,lon]], steps: [...], distance, duration }
  stepIndex: 0,
  zoom: 15,
  headingUp: true,
  online: navigator.onLine,
  spokenStep: -1,
};

/* ---------- Web Mercator ---------- */
const lon2x = (lon, z) => ((lon + 180) / 360) * 2 ** z;
const lat2y = (lat, z) => {
  const r = (lat * Math.PI) / 180;
  return ((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2) * 2 ** z;
};

function getTile(z, x, y) {
  const max = 2 ** z;
  if (y < 0 || y >= max) return null;
  const wrapped = ((x % max) + max) % max;
  const key = `${z}/${wrapped}/${y}`;
  let img = tileCache.get(key);
  if (!img) {
    img = new Image();
    img.crossOrigin = 'anonymous';
    img.referrerPolicy = 'strict-origin-when-cross-origin';
    img.decoding = 'async';
    img.src = `https://tile.openstreetmap.org/${z}/${wrapped}/${y}.png`;
    img.onload = () => { tileHealth.ok += 1; };
    img.onerror = () => { img.failed = true; tileHealth.fail += 1; };
    tileCache.set(key, img);
    if (tileCache.size > MAX_TILES) tileCache.delete(tileCache.keys().next().value);
  }
  return img.failed ? null : img;
}

/* ---------- Sökning och ruttberäkning ---------- */
async function geocode(query) {
  const url = `https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&accept-language=sv&q=${encodeURIComponent(query)}`;
  const res = await fetch(url, { headers: { Accept: 'application/json' } });
  if (!res.ok) throw new Error('Sökningen svarade inte.');
  const rows = await res.json();
  return rows.map((r) => ({
    label: r.display_name.split(',').slice(0, 2).join(',').trim(),
    full: r.display_name,
    lat: Number(r.lat),
    lon: Number(r.lon),
  }));
}

async function fetchRoute(from, to) {
  const url = `https://router.project-osrm.org/route/v1/driving/${from.lon},${from.lat};${to.lon},${to.lat}`
    + '?overview=full&geometries=geojson&steps=true&annotations=false';
  const res = await fetch(url);
  if (!res.ok) throw new Error('Ruttjänsten svarade inte.');
  const data = await res.json();
  const leg = data?.routes?.[0];
  if (!leg) throw new Error('Hittade ingen körbar väg dit.');
  return {
    coords: leg.geometry.coordinates.map(([lon, lat]) => [lat, lon]),
    distance: leg.distance,
    duration: leg.duration,
    steps: (leg.legs?.[0]?.steps ?? []).map((s) => ({
      lat: s.maneuver.location[1],
      lon: s.maneuver.location[0],
      type: s.maneuver.type,
      modifier: s.maneuver.modifier,
      name: s.name || '',
      distance: s.distance,
    })),
  };
}

const TURN_TEXT = {
  left: 'Sväng vänster', right: 'Sväng höger',
  'slight left': 'Håll vänster', 'slight right': 'Håll höger',
  'sharp left': 'Skarp vänster', 'sharp right': 'Skarp höger',
  straight: 'Fortsätt rakt fram', uturn: 'Vänd',
};

function stepText(step) {
  if (!step) return 'Fortsätt';
  if (step.type === 'arrive') return 'Framme';
  if (step.type === 'depart') return 'Kör iväg';
  if (step.type === 'roundabout' || step.type === 'rotary') return 'In i rondellen';
  return TURN_TEXT[step.modifier] ?? 'Fortsätt';
}

const stepIcon = (step) => {
  const m = step?.modifier ?? '';
  if (step?.type === 'arrive') return 'target';
  if (m.includes('left')) return 'arrowLeft';
  if (m.includes('right')) return 'arrowRight';
  return 'arrowUp';
};

/** Sätt färdmål utifrån röstkommando eller val i listan. */
async function navigateTo(place) {
  nav.destination = place;
  nav.route = null;
  nav.stepIndex = 0;
  nav.spokenStep = -1;
  emit('nav:changed', nav);

  const origin = here() ?? await fixOnce().catch(() => null);
  if (!origin) { toast('Väntar på GPS innan rutten kan beräknas.', 'warn'); return; }
  try {
    nav.route = await fetchRoute(origin, place);
    emit('nav:changed', nav);
    say(`Rutt till ${place.label}. ${fmtDistance(nav.route.distance)}, ${Math.round(nav.route.duration / 60)} minuter.`);
  } catch (err) {
    toast(`${err.message} Visar riktning i stället.`, 'warn', 4200);
    say(`${place.label}. ${fmtDistance(distanceBetween(origin, place))} fågelvägen.`);
  }
}

const currentDestination = () => nav.destination;

function clearRoute() {
  nav.destination = null;
  nav.route = null;
  emit('nav:changed', nav);
}

/* ---------- Appen ---------- */
const navApp = {
  id: 'nav',
  name: 'Navigation',
  icon: 'nav',
  dock: true,
  flush: true,

  mount(root) {
    const canvas = el('canvas', { class: 'map-canvas' });
    const turnCard = el('div', { class: 'turn-card', hidden: true });
    const etaBar = el('div', { class: 'eta-bar' });
    const side = el('div', { class: 'map-side' });
    const panel = el('div', { class: 'screen', style: 'background:var(--r-bg);z-index:5', hidden: true });

    const fab = (name, label, onClick) =>
      el('button', { class: 'map-fab', 'aria-label': label, onClick }, icon(name));

    side.append(
      fab('target', 'Sök färdmål', () => { panel.hidden = false; }),
      fab('nav', 'Växla kartriktning', () => {
        nav.headingUp = !nav.headingUp;
        toast(nav.headingUp ? 'Karta i färdriktning' : 'Karta med norr uppåt');
      }),
      fab('plus', 'Zooma in', () => { nav.zoom = Math.min(18, nav.zoom + 1); }),
      fab('warn', 'Rapportera hinder', () => { emit('alerts:quickreport'); }),
    );

    root.append(
      el('div', { class: 'map-wrap' }, canvas),
      el('div', { class: 'map-overlay' }, turnCard, side, etaBar),
      panel,
    );

    buildSearchPanel(panel);

    /* ----- ritning ----- */
    const ctx = canvas.getContext('2d');
    let raf = 0;

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = canvas.clientWidth * dpr;
      canvas.height = canvas.clientHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    const observer = new ResizeObserver(resize);
    observer.observe(canvas);
    resize();

    function draw() {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      const night = document.body.dataset.theme !== 'day';
      ctx.save();
      ctx.fillStyle = night ? '#070c16' : '#dfe6ef';
      ctx.fillRect(0, 0, w, h);

      const pos = here();
      if (!pos) {
        ctx.fillStyle = night ? '#7c8aa6' : '#4a5568';
        ctx.font = '600 17px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(sensors.status === 'denied' ? 'Platsåtkomst nekad' : 'Söker satelliter…', w / 2, h / 2);
        ctx.restore();
        raf = requestAnimationFrame(draw);
        return;
      }

      const z = nav.zoom;
      const cx = lon2x(pos.lon, z) * TILE;
      const cy = lat2y(pos.lat, z) * TILE;
      // Föraren ser mest värde framåt — lägg egen position en bit ned på skärmen.
      const anchorY = h * 0.68;
      const rot = nav.headingUp && Number.isFinite(sensors.heading) ? (-sensors.heading * Math.PI) / 180 : 0;

      ctx.save();
      ctx.translate(w / 2, anchorY);
      ctx.rotate(rot);
      ctx.translate(-w / 2, -anchorY);

      const project = (lat, lon) => [
        lon2x(lon, z) * TILE - cx + w / 2,
        lat2y(lat, z) * TILE - cy + anchorY,
      ];

      if (nav.online && tilesUsable()) {
        const span = Math.hypot(w, h);
        const x0 = Math.floor((cx - span) / TILE);
        const x1 = Math.ceil((cx + span) / TILE);
        const y0 = Math.floor((cy - span) / TILE);
        const y1 = Math.ceil((cy + span) / TILE);
        ctx.globalAlpha = night ? 0.72 : 1;
        for (let tx = x0; tx <= x1; tx += 1) {
          for (let ty = y0; ty <= y1; ty += 1) {
            const img = getTile(z, tx, ty);
            if (!img?.complete || !img.naturalWidth) continue;
            ctx.drawImage(img, tx * TILE - cx + w / 2, ty * TILE - cy + anchorY, TILE, TILE);
          }
        }
        ctx.globalAlpha = 1;
        if (night) { // dämpa kartan så den inte bländar i mörker
          ctx.fillStyle = 'rgba(6,10,20,.45)';
          ctx.fillRect(-span, -span, w + span * 2, h + span * 2);
        }
      } else {
        drawFallbackGrid(ctx, w, h, cx, cy, night);
      }

      if (nav.route?.coords?.length) {
        ctx.lineWidth = 11;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.strokeStyle = 'rgba(4,20,32,.55)';
        traceRoute(ctx, nav.route.coords, project);
        ctx.lineWidth = 7;
        ctx.strokeStyle = '#38bdf8';
        traceRoute(ctx, nav.route.coords, project);
      } else if (nav.destination) {
        const [dx, dy] = project(nav.destination.lat, nav.destination.lon);
        ctx.setLineDash([12, 10]);
        ctx.lineWidth = 5;
        ctx.strokeStyle = '#38bdf8';
        ctx.beginPath();
        ctx.moveTo(w / 2, anchorY);
        ctx.lineTo(dx, dy);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      for (const hazard of state.hazards) {
        const [hx, hy] = project(hazard.lat, hazard.lon);
        if (hx < -60 || hy < -60 || hx > w + 60 || hy > h + 60) continue;
        ctx.fillStyle = '#fbbf24';
        ctx.beginPath();
        ctx.arc(hx, hy, 9, 0, Math.PI * 2);
        ctx.fill();
      }

      if (state.parking) {
        const [px, py] = project(state.parking.lat, state.parking.lon);
        ctx.fillStyle = '#a78bfa';
        ctx.fillRect(px - 9, py - 9, 18, 18);
      }

      if (nav.destination) {
        const [dx, dy] = project(nav.destination.lat, nav.destination.lon);
        ctx.fillStyle = '#34d399';
        ctx.beginPath();
        ctx.arc(dx, dy, 11, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#04231a';
        ctx.lineWidth = 3;
        ctx.stroke();
      }
      ctx.restore();

      drawOwnMarker(ctx, w / 2, anchorY, nav.headingUp ? 0 : ((sensors.heading ?? 0) * Math.PI) / 180);

      ctx.font = '500 11px system-ui, sans-serif';
      if (nav.online && tilesUsable()) {
        ctx.fillStyle = night ? 'rgba(200,215,240,.55)' : 'rgba(30,40,60,.65)';
        ctx.textAlign = 'right';
        ctx.fillText('© OpenStreetMap-bidragsgivare', w - 8, h - 7);
      } else {
        ctx.fillStyle = night ? 'rgba(160,180,215,.72)' : 'rgba(40,60,90,.7)';
        ctx.textAlign = 'left';
        ctx.font = '600 12px system-ui, sans-serif';
        ctx.fillText(navigator.onLine
          ? 'Ingen kartdata — rutnätet visar skala, inte gator'
          : 'Offline — rutnätet visar skala, inte gator', 12, h - 8);
      }
      ctx.restore();
      raf = requestAnimationFrame(draw);
    }

    raf = requestAnimationFrame(draw);

    /* ----- textpanelerna ----- */
    function renderGuidance() {
      const pos = here();
      const dest = nav.destination;

      if (!dest) {
        turnCard.hidden = true;
        setKids(etaBar, 
          el('div', {}, el('b', { text: Math.round(sensors.speedKmh) || '–' }), el('small', { text: 'km/h' })),
          el('div', {}, el('b', { text: Number.isFinite(sensors.heading) ? compassName(sensors.heading) : '–' }), el('small', { text: 'riktning' })),
          el('div', {}, el('b', { text: sensors.accuracy ? `±${Math.round(sensors.accuracy)} m` : '–' }), el('small', { text: 'GPS' })),
        );
        return;
      }

      const remaining = pos ? distanceBetween(pos, dest) : NaN;

      if (nav.route?.steps?.length && pos) {
        // Nästa manöver = första steget vi ännu inte passerat.
        while (nav.stepIndex < nav.route.steps.length - 1
          && distanceBetween(pos, nav.route.steps[nav.stepIndex]) < 25) nav.stepIndex += 1;
        const step = nav.route.steps[nav.stepIndex];
        const toStep = distanceBetween(pos, step);

        turnCard.hidden = false;
        setKids(turnCard, 
          icon(stepIcon(step), 'turn-icon'),
          el('div', { class: 'grow' },
            el('div', { class: 'turn-dist', text: `${fmtDistance(toStep)} · ${stepText(step)}` }),
            el('div', { class: 'turn-street', text: step.name || dest.label }),
          ),
        );

        // Säg svängen en gång, ca 200 m innan.
        if (toStep < 220 && nav.spokenStep !== nav.stepIndex && step.type !== 'depart') {
          nav.spokenStep = nav.stepIndex;
          say(`Om ${fmtDistance(toStep)}, ${stepText(step)}${step.name ? ` mot ${step.name}` : ''}.`);
          buzz([25, 60, 25]);
        }
      } else {
        const bearing = pos ? bearingBetween(pos, dest) : NaN;
        turnCard.hidden = false;
        setKids(turnCard, 
          icon('target', 'turn-icon'),
          el('div', { class: 'grow' },
            el('div', { class: 'turn-dist', text: fmtDistance(remaining) }),
            el('div', { class: 'turn-street', text: Number.isFinite(bearing) ? `${dest.label} · mot ${compassName(bearing)}` : dest.label }),
          ),
        );
      }

      const speed = sensors.speedKmh > 5 ? sensors.speedKmh : 50;
      const secs = nav.route ? (remaining / Math.max(nav.route.distance, 1)) * nav.route.duration
        : (remaining / (speed / 3.6));
      const eta = new Date(Date.now() + secs * 1000);

      setKids(etaBar, 
        el('div', {}, el('b', { text: fmtDistance(remaining) }), el('small', { text: 'kvar' })),
        el('div', {}, el('b', { text: Number.isFinite(secs) ? fmtDuration(secs * 1000) : '–' }), el('small', { text: 'restid' })),
        el('div', {}, el('b', { text: Number.isFinite(secs) ? eta.toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' }) : '–' }), el('small', { text: 'framme' })),
        el('button', { class: 'btn small', onClick: () => { clearRoute(); renderGuidance(); } }, 'Avsluta'),
      );

      if (Number.isFinite(remaining) && remaining < 60) {
        clearRoute();
        say('Du är framme.');
        toast('Framme vid färdmålet.', 'ok');
      }
    }

    renderGuidance();
    const unbind = [
      on('sensors:fix', renderGuidance),
      on('nav:changed', renderGuidance),
      on('online:changed', (isOnline) => { nav.online = isOnline; }),
    ];
    const tick = setInterval(renderGuidance, 2000);

    return () => {
      cancelAnimationFrame(raf);
      observer.disconnect();
      clearInterval(tick);
      unbind.forEach((fn) => fn());
    };
  },
};

function traceRoute(ctx, coords, project) {
  ctx.beginPath();
  coords.forEach(([lat, lon], i) => {
    const [x, y] = project(lat, lon);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();
}

function drawOwnMarker(ctx, x, y, rot) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.fillStyle = 'rgba(56,189,248,.22)';
  ctx.beginPath();
  ctx.arc(0, 0, 26, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#38bdf8';
  ctx.strokeStyle = '#04202e';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(0, -17);
  ctx.lineTo(12, 14);
  ctx.lineTo(0, 8);
  ctx.lineTo(-12, 14);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

/** Offline-rutnät: ger rörelsekänsla och skala utan att påstå att det är gator. */
function drawFallbackGrid(ctx, w, h, cx, cy, night) {
  const spacing = 64;
  ctx.strokeStyle = night ? 'rgba(120,150,200,.16)' : 'rgba(40,60,90,.16)';
  ctx.lineWidth = 1;
  const ox = -(cx % spacing);
  const oy = -(cy % spacing);
  ctx.beginPath();
  for (let x = ox - spacing; x < w + spacing * 2; x += spacing) { ctx.moveTo(x, -spacing); ctx.lineTo(x, h + spacing); }
  for (let y = oy - spacing; y < h + spacing * 2; y += spacing) { ctx.moveTo(-spacing, y); ctx.lineTo(w + spacing, y); }
  ctx.stroke();
}

/* ---------- Sök- och favoritpanel ---------- */
function buildSearchPanel(panel) {
  const input = el('input', { class: 'input', type: 'search', placeholder: 'Adress eller plats', enterkeyhint: 'search' });
  const results = el('div', { class: 'list' });
  const favorites = el('div', { class: 'list' });

  async function runSearch() {
    const query = input.value.trim();
    if (query.length < 3) { toast('Skriv minst tre tecken.', 'warn'); return; }
    setKids(results, el('div', { class: 'hint', text: 'Söker…' }));
    try {
      const hits = await geocode(query);
      if (!hits.length) { setKids(results, el('div', { class: 'hint', text: 'Inga träffar.' })); return; }
      setKids(results, ...hits.map((hit) => el('button', {
        class: 'list-item',
        onClick: () => { navigateTo(hit); panel.hidden = true; },
      },
        icon('target'),
        el('div', { class: 'li-main' }, el('b', { text: hit.label }), el('small', { text: hit.full })),
        el('button', {
          class: 'btn small',
          onClick: (ev) => { ev.stopPropagation(); saveFavorite(hit); renderFavorites(); },
          text: 'Spara',
        }),
      )));
    } catch {
      setKids(results, el('div', { class: 'hint warn', text: 'Sökning kräver nätverk. Använd en sparad plats i stället.' }));
    }
  }

  function renderFavorites() {
    const items = state.places.filter((p) => p.lat != null);
    setKids(favorites, 
      ...items.map((place) => el('button', {
        class: 'list-item',
        onClick: () => { navigateTo(place); panel.hidden = true; },
      },
        el('span', { class: 'avatar', text: place.label.slice(0, 1).toUpperCase() }),
        el('div', { class: 'li-main' },
          el('b', { text: place.label }),
          el('small', { text: `${place.lat.toFixed(4)}, ${place.lon.toFixed(4)}` })),
        el('span', { class: 'li-end', text: here() ? fmtDistance(distanceBetween(here(), place)) : '' }),
      )),
      items.length ? null : el('div', { class: 'hint', text: 'Inga sparade platser än. Sök fram en adress och tryck Spara, eller spara var du står nu.' }),
    );
  }

  panel.append(
    el('div', { class: 'spread' },
      el('h3', { style: 'font-size:20px;font-weight:800', text: 'Vart ska du?' }),
      el('button', { class: 'btn small', onClick: () => { panel.hidden = true; } }, icon('x'), 'Stäng'),
    ),
    el('div', { class: 'row', style: 'margin:12px 0' },
      el('div', { class: 'grow' }, input),
      el('button', { class: 'btn primary', onClick: runSearch }, 'Sök'),
    ),
    results,
    el('div', { class: 'divider', style: 'margin:16px 0' }),
    el('div', { class: 'spread', style: 'margin-bottom:10px' },
      el('h3', { style: 'font-size:15px;text-transform:uppercase;letter-spacing:.05em;color:var(--r-muted)', text: 'Sparade platser' }),
      el('button', {
        class: 'btn small',
        onClick: async () => {
          try {
            const pos = await fixOnce();
            const label = prompt('Namn på platsen?', 'Ny plats');
            if (!label) return;
            push('places', { id: uid(), label, lat: pos.lat, lon: pos.lon });
            renderFavorites();
            toast('Platsen sparad.', 'ok');
          } catch (err) { toast(err.message, 'err'); }
        },
      }, icon('plus'), 'Spara här'),
    ),
    favorites,
  );

  input.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') runSearch(); });
  renderFavorites();
  on('places:changed', renderFavorites);
}

function saveFavorite(hit) {
  const existing = state.places.find((p) => p.label === hit.label);
  if (existing) { existing.lat = hit.lat; existing.lon = hit.lon; save(); }
  else push('places', { id: uid(), label: hit.label, lat: hit.lat, lon: hit.lon });
  toast(`${hit.label} sparad.`, 'ok');
}

/* ===== js/apps/music.js ===== */
/** Musik från telefonens egna filer. Ingen inloggning, ingen strömning —
 *  spellistan fungerar i tunneln och på grusvägen. */




const audio = new Audio();
audio.preload = 'metadata';

const player = {
  queue: [],       // { id, title, artist, url, file }
  index: -1,
  shuffle: false,
  repeat: false,
  baseVolume: 0.8,
};

/* ---------- Fartanpassad volym ----------
   Vägbruset ökar ungefär med farten. Lyft volymen sakta upp till +25 %
   mellan 50 och 120 km/h så att man slipper skruva under körning. */
function applyVolume() {
  let volume = player.baseVolume;
  if (state.settings.speedVolume) {
    const kmh = Math.min(Math.max(sensors.speedKmh, 50), 120);
    volume *= 1 + ((kmh - 50) / 70) * 0.25;
  }
  audio.volume = Math.min(1, Math.max(0, volume));
}

function titleFromFile(name) {
  const clean = name.replace(/\.[a-z0-9]+$/i, '').replace(/_/g, ' ');
  const parts = clean.split(' - ');
  return parts.length > 1
    ? { artist: parts[0].trim(), title: parts.slice(1).join(' - ').trim() }
    : { artist: 'Okänd artist', title: clean.trim() };
}

function addFiles(fileList) {
  const added = [...fileList]
    .filter((file) => file.type.startsWith('audio/') || /\.(mp3|m4a|aac|ogg|opus|wav|flac)$/i.test(file.name))
    .map((file) => ({ id: `${file.name}-${file.size}`, ...titleFromFile(file.name), url: URL.createObjectURL(file), file }));

  if (!added.length) { toast('Inga ljudfiler i urvalet.', 'warn'); return 0; }
  player.queue.push(...added);
  emit('music:queue', player.queue);
  if (player.index < 0) playAt(0);
  return added.length;
}

function playAt(index) {
  if (!player.queue.length) return;
  player.index = (index + player.queue.length) % player.queue.length;
  const track = player.queue[player.index];
  audio.src = track.url;
  applyVolume();
  audio.play().catch(() => toast('Tryck på play för att starta ljudet.', 'warn'));
  emit('music:track', track);
}

function togglePlay() {
  if (!player.queue.length) { toast('Lägg till musik först.', 'warn'); return; }
  if (audio.paused) audio.play().catch(() => {}); else audio.pause();
}

const next = () => {
  if (!player.queue.length) return;
  playAt(player.shuffle ? Math.floor(Math.random() * player.queue.length) : player.index + 1);
};

const prev = () => {
  if (!player.queue.length) return;
  if (audio.currentTime > 4) { audio.currentTime = 0; return; }
  playAt(player.index - 1);
};

const isPlaying = () => !audio.paused && player.queue.length > 0;
const currentTrack = () => player.queue[player.index] ?? null;

function setVolume(value) {
  player.baseVolume = Math.min(1, Math.max(0, value));
  applyVolume();
}

audio.addEventListener('ended', () => {
  if (player.repeat) { audio.currentTime = 0; audio.play(); return; }
  next();
});
audio.addEventListener('play', () => emit('music:state', true));
audio.addEventListener('pause', () => emit('music:state', false));
on('sensors:fix', applyVolume);

/* Låsskärmens mediaknappar och rattens knappar går via Media Session. */
if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play', () => audio.play());
  navigator.mediaSession.setActionHandler('pause', () => audio.pause());
  navigator.mediaSession.setActionHandler('nexttrack', next);
  navigator.mediaSession.setActionHandler('previoustrack', prev);
  on('music:track', (track) => {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: track.title, artist: track.artist, album: 'ReeOS',
    });
  });
}

const musicApp = {
  id: 'music',
  name: 'Musik',
  icon: 'music',
  dock: true,

  mount(root) {
    const art = el('div', { class: 'art' }, icon('music'));
    const title = el('div', { class: 'track-title', text: 'Ingen låt vald' });
    const sub = el('div', { class: 'track-sub', text: 'Lägg till musik från telefonen' });
    const seekFill = el('i');
    const timeNow = el('span', { text: '0:00' });
    const timeEnd = el('span', { text: '0:00' });
    const playBtn = el('button', { class: 'tbtn play', 'aria-label': 'Spela', onClick: () => { togglePlay(); buzz(); } }, icon('play'));
    const shuffleBtn = el('button', { class: 'tbtn tiny', 'aria-label': 'Blanda', onClick: () => { player.shuffle = !player.shuffle; syncModes(); } }, icon('shuffle'));
    const repeatBtn = el('button', { class: 'tbtn tiny', 'aria-label': 'Upprepa', onClick: () => { player.repeat = !player.repeat; syncModes(); } }, icon('repeat'));
    const queueList = el('div', { class: 'list' });

    const picker = el('input', { type: 'file', accept: 'audio/*', multiple: true, class: 'sr-only' });
    picker.addEventListener('change', () => {
      const count = addFiles(picker.files);
      if (count) toast(`${count} låtar tillagda.`, 'ok');
      picker.value = '';
      renderQueue();
    });

    const seekRail = el('div', { class: 'seek-rail' }, seekFill);
    seekRail.addEventListener('click', (ev) => {
      if (!audio.duration) return;
      const rect = seekRail.getBoundingClientRect();
      audio.currentTime = ((ev.clientX - rect.left) / rect.width) * audio.duration;
    });

    const volume = el('input', { type: 'range', min: '0', max: '100', value: String(player.baseVolume * 100), class: 'grow' });
    volume.addEventListener('input', () => setVolume(Number(volume.value) / 100));

    root.append(
      el('div', { class: 'player' },
        art, title, sub,
        el('div', { class: 'seek' }, seekRail, el('div', { class: 'seek-times' }, timeNow, timeEnd)),
        el('div', { class: 'transport' },
          shuffleBtn,
          el('button', { class: 'tbtn', 'aria-label': 'Föregående', onClick: prev }, icon('prev')),
          playBtn,
          el('button', { class: 'tbtn', 'aria-label': 'Nästa', onClick: next }, icon('next')),
          repeatBtn,
        ),
        el('div', { class: 'row', style: 'width:100%;align-items:center;gap:12px' }, icon('volume'), volume),
      ),
      el('div', { class: 'card' },
        el('div', { class: 'spread', style: 'margin-bottom:10px' },
          el('h3', { style: 'margin:0', text: 'Spellista' }),
          el('button', { class: 'btn small primary', onClick: () => picker.click() }, icon('plus'), 'Lägg till'),
        ),
        queueList,
        picker,
      ),
      el('p', { class: 'hint', style: 'margin-top:10px', text: state.settings.speedVolume
        ? 'Fartanpassad volym är på — ljudet lyfts något i högre fart.'
        : 'Fartanpassad volym är av. Slå på den i Inställningar.' }),
    );

    function syncModes() {
      shuffleBtn.classList.toggle('on', player.shuffle);
      repeatBtn.classList.toggle('on', player.repeat);
    }

    function renderNow() {
      const track = currentTrack();
      title.textContent = track?.title ?? 'Ingen låt vald';
      sub.textContent = track ? track.artist : 'Lägg till musik från telefonen';
      setKids(playBtn, icon(isPlaying() ? 'pause' : 'play'));
      art.classList.toggle('spin', isPlaying());
      renderQueue();
    }

    function renderProgress() {
      const ratio = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
      seekFill.style.width = `${ratio}%`;
      timeNow.textContent = fmtTime(audio.currentTime);
      timeEnd.textContent = fmtTime(audio.duration);
    }

    function renderQueue() {
      setKids(queueList, 
        ...player.queue.map((track, i) => el('button', {
          class: 'list-item', onClick: () => playAt(i),
          style: i === player.index ? 'border-color:var(--r-brand)' : null,
        },
          el('span', { class: 'avatar' }, icon(i === player.index && isPlaying() ? 'pause' : 'play')),
          el('div', { class: 'li-main' }, el('b', { text: track.title }), el('small', { text: track.artist })),
        )),
        player.queue.length ? null : el('div', { class: 'empty' },
          el('b', { text: 'Tom spellista' }),
          el('span', { class: 'hint', text: 'Välj låtar från telefonens minne. De ligger kvar så länge ReeOS är öppet.' })),
      );
    }

    syncModes();
    renderNow();
    renderProgress();

    const unbind = [on('music:track', renderNow), on('music:state', renderNow), on('music:queue', renderQueue)];
    audio.addEventListener('timeupdate', renderProgress);
    audio.addEventListener('loadedmetadata', renderProgress);

    return () => {
      unbind.forEach((fn) => fn());
      audio.removeEventListener('timeupdate', renderProgress);
      audio.removeEventListener('loadedmetadata', renderProgress);
    };
  },
};

/** Telefon. Webben får inte ringa själv — ReeOS lämnar över till telefonens
 *  egen appellare via tel:, vilket i praktiken är ett tryck för föraren. */



const KEYS = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '*', '0', '#'];

function callNumber(number) {
  const clean = String(number).replace(/[^\d+*#]/g, '');
  if (!clean) { toast('Inget nummer att ringa.', 'warn'); return false; }
  buzz([20, 40, 20]);
  location.href = `tel:${clean}`;
  return true;
}

/** Ring en kontakt på namn — används av röstassistenten. */
function callContactByName(name) {
  const needle = name.toLowerCase().trim();
  const match = state.contacts.find((c) => c.name.toLowerCase() === needle)
    ?? state.contacts.find((c) => c.name.toLowerCase().includes(needle));
  if (!match) return { ok: false, reason: `Hittar ingen kontakt som heter ${name}.` };
  if (!match.number) return { ok: false, reason: `${match.name} saknar telefonnummer.` };
  callNumber(match.number);
  return { ok: true, contact: match };
}

/** Parkering: var bilen står, hur lång tid som är betald, och vägen tillbaka.
 *  Allt sparas lokalt — ingen behöver veta var du parkerar. */





let meterTimer = null;

async function saveSpot({ note = '', level = '', photo = null, minutes = 0 } = {}) {
  const pos = await fixOnce();
  const spot = {
    lat: pos.lat, lon: pos.lon, accuracy: pos.accuracy,
    at: Date.now(), note, level, photo,
    meterEndsAt: minutes > 0 ? Date.now() + minutes * 60000 : null,
  };
  setValue('parking', spot);
  emit('parking:changed', spot);
  armMeter();
  return spot;
}

function clearSpot() {
  setValue('parking', null);
  emit('parking:changed', null);
  clearTimeout(meterTimer);
}

/** Larmar fem minuter innan p-tiden går ut, och när den gör det. */
function armMeter() {
  clearTimeout(meterTimer);
  const spot = state.parking;
  if (!spot?.meterEndsAt) return;

  const schedule = (at, fn) => {
    const delay = at - Date.now();
    if (delay <= 0 || delay > 2 ** 31 - 1) return null;
    return setTimeout(fn, delay);
  };

  meterTimer = schedule(spot.meterEndsAt - 5 * 60000, () => {
    buzz([60, 100, 60]);
    say('Fem minuter kvar på parkeringen.', { force: true });
    toast('Fem minuter kvar på p-tiden.', 'warn', 8000);
    meterTimer = schedule(spot.meterEndsAt, expired);
  }) ?? schedule(spot.meterEndsAt, expired);
}

function expired() {
  buzz([120, 80, 120, 80, 120]);
  say('Parkeringstiden har gått ut.', { force: true });
  toast('P-tiden har gått ut.', 'err', 10000);
}

/* ===== js/apps/dashcam.js ===== */
/** Dashcam med rullande minne.
 *  Kameran spelar in hela tiden men behåller bara den senaste minuten — tills
 *  något händer. Då sparas klippet, antingen automatiskt vid en kraftig
 *  inbromsning eller när du trycker på knappen. */





const BUFFER_SECONDS = 60;
const CHUNK_MS = 1000;
const IMPACT_G = 2.6;             // ca 25 m/s² utöver tyngdkraften

const cam = {
  stream: null,
  recorder: null,
  header: null,                   // första biten bär webm-huvudet
  chunks: [],                     // { blob, at }
  running: false,
  startedAt: 0,
  mime: '',
  lastAutoSave: 0,
};

/* ---------- Klipplagring (IndexedDB — blobbar får inte plats i localStorage) ---------- */
const DB_NAME = 'reeos-clips';
let dbPromise = null;

function db() {
  dbPromise ??= new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, 1);
    request.onupgradeneeded = () => request.result.createObjectStore('clips');
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
  return dbPromise;
}

async function putClip(id, blob) {
  const store = (await db()).transaction('clips', 'readwrite').objectStore('clips');
  return new Promise((resolve, reject) => {
    const request = store.put(blob, id);
    request.onsuccess = () => resolve();
    request.onerror = () => reject(request.error);
  });
}

async function getClip(id) {
  const store = (await db()).transaction('clips', 'readonly').objectStore('clips');
  return new Promise((resolve, reject) => {
    const request = store.get(id);
    request.onsuccess = () => resolve(request.result ?? null);
    request.onerror = () => reject(request.error);
  });
}

async function deleteClip(id) {
  const store = (await db()).transaction('clips', 'readwrite').objectStore('clips');
  store.delete(id);
}

/* ---------- Inspelning ---------- */
function pickMime() {
  const candidates = [
    'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus',
    'video/webm', 'video/mp4',
  ];
  return candidates.find((type) => MediaRecorder.isTypeSupported?.(type)) ?? '';
}

async function startCam({ audio = false } = {}) {
  if (cam.running) return cam.stream;
  if (!navigator.mediaDevices?.getUserMedia) throw new Error('Kameran är inte tillgänglig här.');
  if (!window.MediaRecorder) throw new Error('Den här webbläsaren kan inte spela in video.');

  cam.stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } },
    audio,
  });

  cam.mime = pickMime();
  cam.recorder = new MediaRecorder(cam.stream, cam.mime ? { mimeType: cam.mime, videoBitsPerSecond: 2_500_000 } : undefined);
  cam.header = null;
  cam.chunks = [];

  cam.recorder.ondataavailable = (event) => {
    if (!event.data?.size) return;
    // Första biten innehåller strömhuvudet och måste följa med varje sparat klipp.
    if (!cam.header) { cam.header = event.data; return; }
    cam.chunks.push({ blob: event.data, at: Date.now() });
    while (cam.chunks.length > BUFFER_SECONDS) cam.chunks.shift();
  };

  cam.recorder.start(CHUNK_MS);
  cam.running = true;
  cam.startedAt = Date.now();
  emit('dashcam:state', true);
  return cam.stream;
}

function stopCam() {
  try { cam.recorder?.stop(); } catch { /* redan stoppad */ }
  cam.stream?.getTracks().forEach((track) => track.stop());
  cam.stream = null;
  cam.recorder = null;
  cam.header = null;
  cam.chunks = [];
  cam.running = false;
  emit('dashcam:state', false);
}

const camRunning = () => cam.running;

/** Fryser bufferten till ett klipp. */
async function saveEvent(reason = 'manuell') {
  if (!cam.running || !cam.header || !cam.chunks.length) {
    toast('Inget i bufferten att spara ännu.', 'warn');
    return null;
  }
  const parts = [cam.header, ...cam.chunks.map((c) => c.blob)];
  const blob = new Blob(parts, { type: cam.mime || 'video/webm' });
  const id = uid();
  const pos = here();

  try { await putClip(id, blob); }
  catch { toast('Kunde inte spara klippet — minnet är fullt.', 'err'); return null; }

  const meta = {
    id, at: Date.now(), reason,
    seconds: cam.chunks.length,
    size: blob.size,
    speedKmh: Math.round(sensors.speedKmh),
    lat: pos?.lat ?? null, lon: pos?.lon ?? null,
    ext: (cam.mime || 'video/webm').includes('mp4') ? 'mp4' : 'webm',
  };
  push('clips', meta);
  buzz([40, 60, 40]);
  toast(`Klipp sparat (${meta.seconds} s).`, 'ok');
  return meta;
}

/* ---------- Händelsedetektering ---------- */
function initIncidentWatch() {
  let lastSpeed = 0;
  let lastAt = Date.now();

  // Kraftig retardation enligt GPS — fungerar även utan rörelsesensor.
  on('sensors:fix', () => {
    const now = Date.now();
    const dt = (now - lastAt) / 1000;
    lastAt = now;
    if (dt > 0.3 && dt < 6) {
      const decel = (lastSpeed - sensors.speed) / dt;   // m/s²
      if (decel > 6 && lastSpeed > 8) autoSave('kraftig inbromsning');
    }
    lastSpeed = sensors.speed;
  });

  if (window.DeviceMotionEvent) {
    window.addEventListener('devicemotion', (event) => {
      const acc = event.accelerationIncludingGravity;
      if (!acc || acc.x === null) return;
      const g = Math.hypot(acc.x ?? 0, acc.y ?? 0, acc.z ?? 0) / 9.81;
      if (g > IMPACT_G) autoSave('kraftig rörelse');
    });
  }
}

function autoSave(reason) {
  if (!cam.running) return;
  if (Date.now() - cam.lastAutoSave < 20000) return;   // en händelse, inte tio
  cam.lastAutoSave = Date.now();
  say('Händelse sparad.', { force: true });
  saveEvent(reason);
}

/* ===== js/apps/assistant.js ===== */
/** Röstassistenten. Tolkar svenska kommandon lokalt — inga fraser skickas
 *  vidare någonstans, och den svarar även utan nät. */














const has = (text, ...words) => words.some((word) => text.includes(word));

/** Tolka en mening och utför den. Returnerar svaret som ska läsas upp. */
async function handleCommand(raw) {
  const text = raw.toLowerCase().trim();
  if (!text) return 'Jag hörde inget.';

  /* --- navigation --- */
  if (has(text, 'kör mig till', 'navigera till', 'ta mig till', 'åk till')) {
    const target = text.replace(/.*?(kör mig till|navigera till|ta mig till|åk till)\s*/, '').trim();
    if (!target) return 'Vart vill du åka?';

    const saved = state.places.find((p) => p.lat != null && p.label.toLowerCase().includes(target));
    if (saved) { await navigateTo(saved); return `Kör mot ${saved.label}.`; }

    try {
      const [hit] = await geocode(target);
      if (!hit) return `Jag hittar ingen plats som heter ${target}.`;
      await navigateTo(hit);
      return `Kör mot ${hit.label}.`;
    } catch {
      return 'Jag når inte kartsökningen just nu. Välj en sparad plats i stället.';
    }
  }

  if (has(text, 'avbryt rutt', 'avsluta rutt', 'sluta navigera')) {
    clearRoute();
    return 'Rutten är avslutad.';
  }

  // "hur långt har jag kört" handlar om färddagboken, inte om färdmålet.
  if (has(text, 'hur långt', 'hur lång tid', 'när är jag framme') && !has(text, 'har jag kört')) {
    const dest = currentDestination();
    if (!dest) return 'Du har inget färdmål inlagt.';
    const remaining = distanceBetween(here(), dest);
    const speed = sensors.speedKmh > 5 ? sensors.speedKmh : 60;
    return `${fmtDistance(remaining)} kvar till ${dest.label}, ungefär ${Math.round(remaining / 1000 / speed * 60)} minuter.`;
  }

  /* --- musik --- */
  if (has(text, 'spela musik', 'spela upp', 'starta musiken')) {
    if (!isPlaying()) togglePlay();
    open('music');
    const track = currentTrack();
    return track ? `Spelar ${track.title}.` : 'Lägg till musik först.';
  }
  if (has(text, 'pausa', 'stoppa musiken', 'tyst')) {
    if (isPlaying()) togglePlay();
    return 'Pausad.';
  }
  if (has(text, 'nästa låt', 'nästa spår')) { next(); return 'Nästa låt.'; }
  if (has(text, 'föregående låt', 'förra låten')) { prev(); return 'Föregående låt.'; }
  if (has(text, 'vad spelas', 'vilken låt')) {
    const track = currentTrack();
    return track ? `${track.title} med ${track.artist}.` : 'Ingen låt spelas.';
  }

  /* --- telefon --- */
  if (has(text, 'ring ')) {
    const name = text.split('ring ')[1]?.replace(/\s+(upp|till)\s+/, ' ').trim();
    if (!name) return 'Vem vill du ringa?';
    const result = callContactByName(name);
    return result.ok ? `Ringer ${result.contact.name}.` : result.reason;
  }

  /* --- parkering --- */
  if (has(text, 'spara parkering', 'kom ihåg var jag parkerat', 'spara p-plats', 'här står bilen')) {
    try { await saveSpot({ note: 'Sparad med rösten' }); open('parking'); return 'Parkeringen är sparad.'; }
    catch (err) { return err.message; }
  }
  if (has(text, 'var står bilen', 'var är bilen', 'hitta bilen')) {
    if (!state.parking) return 'Du har ingen sparad parkering.';
    open('parking');
    const distance = distanceBetween(here(), state.parking);
    return Number.isFinite(distance) ? `Bilen står ${fmtDistance(distance)} härifrån.` : 'Jag visar parkeringen på skärmen.';
  }
  if (has(text, 'glöm parkeringen', 'rensa parkering')) { clearSpot(); return 'Parkeringen är rensad.'; }

  /* --- väglag --- */
  if (has(text, 'markera', 'rapportera', 'varna för')) {
    const kind = Object.entries(HAZARD_KINDS).find(([key, value]) =>
      text.includes(value.label.toLowerCase()) || text.includes(key)
      || (key === 'pothole' && has(text, 'hål', 'grop'))
      || (key === 'ice' && has(text, 'halt', 'halka', 'is'))
      || (key === 'wildlife' && has(text, 'älg', 'rådjur', 'djur', 'vilt'))
      || (key === 'queue' && has(text, 'kö', 'stopp'))
      || (key === 'roadwork' && has(text, 'vägarbete', 'arbete'))
      || (key === 'camera' && has(text, 'kamera', 'fartkamera')));
    if (!kind) { emit('alerts:quickreport'); return 'Vad ska jag markera?'; }
    reportHazard(kind[0]);
    return `${kind[1].label} markerat här.`;
  }

  /* --- färddagbok --- */
  if (has(text, 'starta resa', 'börja logga')) { startTrip(true); return 'Resan loggas.'; }
  if (has(text, 'avsluta resa', 'sluta logga')) {
    const purpose = has(text, 'tjänst', 'jobb') ? 'tjänst' : 'privat';
    const trip = endTrip({ purpose });
    if (!trip) return 'Ingen resa pågick.';
    return trip.recorded
      ? `Resa sparad: ${trip.km.toFixed(1)} kilometer som ${purpose}.`
      : 'Resan var för kort för att sparas.';
  }
  if (has(text, 'hur långt har jag kört')) {
    const status = tripStatus();
    return status.active ? `${status.km.toFixed(1)} kilometer den här resan.` : `Totalt ${state.stats.totalKm.toFixed(0)} kilometer loggat.`;
  }

  /* --- trötthet --- */
  if (has(text, 'jag tar paus', 'nu rastar jag', 'nollställ körtid')) { takeBreak(); return 'Körtiden är nollställd. Sträck på benen.'; }
  if (has(text, 'hur länge har jag kört', 'är jag trött')) {
    const status = fatigueStatus();
    return `Du har kört ${fmtDuration(status.drivingMs)} sedan senaste pausen.` + (status.dueForBreak ? ' Det är dags att stanna.' : '');
  }

  /* --- dashcam --- */
  if (has(text, 'spara klipp', 'spara händelse', 'filma det där')) {
    if (!camRunning()) { try { await startCam(); } catch (err) { return err.message; } }
    const meta = await saveEvent('röstkommando');
    return meta ? 'Klippet är sparat.' : 'Bufferten är inte fylld ännu.';
  }

  /* --- fart och status --- */
  if (has(text, 'hur fort', 'vilken hastighet')) return `Du kör ${Math.round(sensors.speedKmh)} kilometer i timmen.`;
  if (has(text, 'vad är klockan')) return `Klockan är ${new Date().toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' })}.`;

  /* --- öppna appar --- */
  const screens = {
    karta: 'nav', navigation: 'nav', musik: 'music', telefon: 'phone',
    meddelanden: 'messages', dashcam: 'dashcam', parkering: 'parking',
    färddagbok: 'triplog', väglag: 'alerts', hud: 'hud', inställningar: 'settings', hem: 'home',
  };
  if (has(text, 'öppna', 'visa', 'gå till')) {
    const match = Object.entries(screens).find(([word]) => text.includes(word));
    if (match) { open(match[1]); return `Öppnar ${match[0]}.`; }
  }

  if (has(text, 'hjälp', 'vad kan du')) {
    return 'Säg till exempel: kör mig till Lund, ring hemma, spela musik, spara parkering, markera hål i vägen, eller jag tar paus.';
  }

  return 'Det där förstod jag inte. Säg hjälp för exempel.';
}

/** Öppnar lyssningsvyn och kör kommandot som hörs. */
async function askAssistant() {
  const overlay = document.getElementById('assistant-overlay');
  const heard = el('div', { class: 'heard', text: '' });
  const said = el('div', { class: 'said', text: 'Lyssnar…' });

  if (!canListen) {
    // Utan rösttolkning får man skriva — men bara när bilen står stilla.
    if (sensors.driving) { toast('Rösttolkning saknas i den här webbläsaren.', 'err'); return; }
    const typed = prompt('Vad vill du göra?');
    if (typed) {
      const reply = await handleCommand(typed);
      say(reply);
      toast(reply, '', 5000);
    }
    return;
  }

  overlay.hidden = false;
  setKids(overlay, 
    el('div', { class: 'orb' }),
    heard,
    said,
    el('button', { class: 'btn', onClick: close, text: 'Avbryt' }),
  );

  function close() {
    stopListening();
    overlay.hidden = true;
    unbind();
  }
  const unbind = on('speech:partial', (text) => { heard.textContent = text; });

  try {
    const text = await listen();
    heard.textContent = text;
    said.textContent = 'Tänker…';
    const reply = await handleCommand(text);
    said.textContent = reply;
    say(reply);
    setTimeout(close, 2200);
  } catch (err) {
    said.textContent = err.message;
    setTimeout(close, 1800);
  }
}

/* ===== js/main.js ===== */
/** ReeOS — start och sammankoppling.
 *  Appar registreras här; bakgrundsvakterna startar en gång och lever vidare
 *  oavsett vilken skärm som visas. */



















/* ---------- Register ---------- */
for (const app of [home, navApp, musicApp, phoneApp, messagesApp,
  fatigueApp, parkingApp, dashcamApp, tripApp, alertsApp, hudApp, settingsApp]) {
  register(app);
}

const DOCK = ['home', 'nav', 'music', 'phone', 'fatigue', 'parking', 'dashcam', 'triplog', 'alerts', 'hud', 'settings'];

function buildDock() {
  const dock = $('#dock');
  setKids(dock, ...DOCK.map((id) => {
    const app = allApps().find((a) => a.id === id);
    if (!app) return null;
    return el('button', { class: 'dock-item', dataset: { app: id }, onClick: () => { open(id); buzz(10); } },
      icon(app.icon), el('span', { text: app.name }));
  }).filter(Boolean));
}

function syncDock(activeId) {
  for (const item of $('#dock').children) {
    item.classList.toggle('active', item.dataset.app === activeId);
  }
}

/* ---------- Statusrad ---------- */
function initStatusbar() {
  const clock = $('#sb-clock');
  const speed = $('#sb-speed').querySelector('b');
  const gps = $('#sb-gps');
  const drive = $('#sb-drive');
  const batt = $('#sb-batt');
  const title = $('#sb-title');
  const backBtn = $('#btn-back');

  const tickClock = () => { clock.textContent = fmtClock(); };
  tickClock();
  setInterval(tickClock, 15000);

  $('#btn-home').addEventListener('click', () => open('home'));
  backBtn.addEventListener('click', back);
  $('#btn-mic').addEventListener('click', () => { buzz(); askAssistant(); });

  on('router:changed', ({ id, app }) => {
    title.textContent = app.name;
    backBtn.hidden = id === 'home' || !canGoBack();
    syncDock(id);
  });

  const renderSensors = () => {
    speed.textContent = sensors.status === 'live' ? String(Math.round(sensors.speedKmh)) : '–';
    const live = sensors.status === 'live';
    gps.className = `sb-chip ${live ? 'ok' : sensors.status === 'denied' ? 'warn' : ''}`.trim();
    gps.textContent = live ? 'GPS' : sensors.status === 'denied' ? 'EJ GPS' : 'SÖKER';
    drive.hidden = !sensors.driving;
  };
  on('sensors:fix', renderSensors);
  on('sensors:status', renderSensors);
  renderSensors();

  on('sensors:battery', () => {
    if (sensors.batteryLevel === null) return;
    batt.hidden = false;
    batt.textContent = `${sensors.batteryCharging ? '⚡' : ''}${sensors.batteryLevel}%`;
  });

  $('#btn-mic').classList.toggle('sb-mic', true);
  on('speech:start', () => $('#btn-mic').classList.add('listening'));
  on('speech:end', () => $('#btn-mic').classList.remove('listening'));
}

/* ---------- Tema ---------- */
function applyTheme() {
  const setting = state.settings.theme;
  if (setting === 'auto') {
    // Grov men förutsägbar regel: mörkt läge mellan 19 och 07.
    const hour = new Date().getHours();
    document.body.dataset.theme = (hour >= 19 || hour < 7) ? 'night' : 'day';
  } else {
    document.body.dataset.theme = setting;
  }
}

/* ---------- Fartvarning ---------- */
function initSpeedWarning() {
  let lastWarn = 0;
  on('sensors:overspeed', (kmh) => {
    if (Date.now() - lastWarn < 25000) return;
    lastWarn = Date.now();
    buzz([50, 80, 50]);
    say(`Du kör ${Math.round(kmh)}.`, { force: true });
    toast(`Över inställd gräns: ${Math.round(kmh)} km/h`, 'warn', 4000);
  });
}

/* ---------- Start ---------- */
async function boot() {
  applyTheme();
  setInterval(applyTheme, 5 * 60000);
  on('theme:apply', applyTheme);
  on('settings:changed', ({ key }) => { if (key === 'theme') applyTheme(); });

  buildDock();
  initStatusbar();
  initSpeedWarning();

  // Bakgrundsvakter — dessa ska gå även när deras egen skärm är stängd.
  initTripLogger();
  initFatigueWatch();
  initHazardWatch();
  initIncidentWatch();
  armMeter();

  startGPS();
  watchBattery();
  watchOrientation();
  if (state.settings.wakeLock) keepScreenAwake(true);

  window.addEventListener('online', () => emit('online:changed', true));
  window.addEventListener('offline', () => {
    emit('online:changed', false);
    toast('Offline — kartan visar kompassläge.', 'warn');
  });

  startRouter('home');

  // Bilhållarens vanligaste läge är liggande; påminn en gång.
  if (window.matchMedia('(orientation: portrait)').matches && screen.width < 500) {
    toast('Vrid telefonen till liggande för bästa vy.', '', 4000);
  }

  const boot = $('#boot');
  $('#shell').hidden = false;
  boot.classList.add('gone');
  setTimeout(() => boot.remove(), 500);

  // På file:// finns ingen service worker att registrera; hoppa över tyst.
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => { /* offline-läget är en bonus */ });
  }
}

// Låt boot-skärmen synas ett ögonblick — den signalerar att systemet är igång.
setTimeout(boot, 650);

// Zoom med dubbeltryck är ett olycksfall i bil; stäng av det.
document.addEventListener('dblclick', (ev) => ev.preventDefault(), { passive: false });

</script>
