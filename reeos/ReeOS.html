<style>
/* ReeOS — bilhållarens gränssnitt.
   Designregler: minst 56px träffytor, minst 17px text, hög kontrast,
   inga tunna linjer, ingenting som kräver precision i en gupp. */

:root {
  --r-bg: #05070c;
  --r-panel: #101623;
  --r-panel-2: #172032;
  --r-line: #26324a;
  --r-ink: #eef3ff;
  --r-muted: #93a1bd;
  --r-brand: #38bdf8;
  --r-brand-ink: #062434;
  --r-amber: #fbbf24;
  --r-green: #34d399;
  --r-red: #fb7185;
  --r-violet: #a78bfa;
  --r-radius: 20px;
  --r-gap: 14px;
  --r-tap: 60px;
  --r-shadow: 0 10px 30px rgba(0, 0, 0, .45);
  --r-safe-t: env(safe-area-inset-top, 0px);
  --r-safe-b: env(safe-area-inset-bottom, 0px);
  --r-safe-l: env(safe-area-inset-left, 0px);
  --r-safe-r: env(safe-area-inset-right, 0px);
}

/* Dagläge: samma layout, ljusare panel — läsbart i direkt solljus. */
body[data-theme="day"] {
  --r-bg: #eef2f8;
  --r-panel: #ffffff;
  --r-panel-2: #f2f5fa;
  --r-line: #d3dbe8;
  --r-ink: #101828;
  --r-muted: #5a6880;
  --r-brand: #0369a1;
  --r-brand-ink: #ffffff;
  --r-amber: #b45309;
  --r-green: #047857;
  --r-red: #be123c;
  --r-violet: #6d28d9;
  --r-shadow: 0 8px 24px rgba(16, 24, 40, .12);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

/* hidden-attributet måste slå igenom på element som annars har display satt. */
[hidden] { display: none !important; }

html, body {
  height: 100%;
  overscroll-behavior: none;
}

body {
  background: var(--r-bg);
  color: var(--r-ink);
  font: 500 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-variant-numeric: tabular-nums;
  overflow: hidden;
  user-select: none;
  transition: background .3s ease, color .3s ease;
}

button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; }
svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
svg.filled { fill: currentColor; stroke: none; }

/* ---------- Boot ---------- */
.boot {
  position: fixed; inset: 0; z-index: 90;
  display: grid; place-content: center; justify-items: center; gap: 22px;
  background: radial-gradient(120% 90% at 50% 0%, #12203a 0%, #05070c 62%);
}
.boot.gone { opacity: 0; pointer-events: none; transition: opacity .45s ease; }
.boot-mark { font-size: 54px; font-weight: 800; letter-spacing: -2px; color: #eef3ff; }
.boot-mark span { color: var(--r-brand); }
.boot-bar { width: 210px; height: 5px; border-radius: 99px; background: #1d2942; overflow: hidden; }
.boot-bar i { display: block; height: 100%; width: 40%; border-radius: 99px; background: var(--r-brand); animation: boot-slide 1.1s ease-in-out infinite; }
@keyframes boot-slide { 0% { transform: translateX(-110%);} 100% { transform: translateX(320%);} }
.boot-tip { color: #7f8daa; font-size: 15px; }

/* ---------- Skal ---------- */
.shell {
  height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding: var(--r-safe-t) var(--r-safe-r) var(--r-safe-b) var(--r-safe-l);
}

/* ---------- Statusrad ---------- */
.statusbar {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 14px;
  background: var(--r-panel);
  border-bottom: 1px solid var(--r-line);
}
.sb-btn {
  width: 46px; height: 46px; flex: none;
  display: grid; place-items: center; padding: 11px;
  border-radius: 14px; background: var(--r-panel-2); color: var(--r-ink);
}
.sb-btn:active { transform: scale(.94); }
.sb-mic { background: var(--r-brand); color: var(--r-brand-ink); }
.sb-mic.listening { animation: mic-pulse 1s ease-in-out infinite; }
@keyframes mic-pulse { 50% { box-shadow: 0 0 0 10px rgba(56, 189, 248, .18); } }
.sb-title { font-weight: 700; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-live { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.sb-speed { display: flex; align-items: baseline; gap: 4px; color: var(--r-muted); }
.sb-speed b { font-size: 21px; font-weight: 800; color: var(--r-ink); }
.sb-speed small { font-size: 12px; }
.sb-chip {
  font-size: 12px; font-weight: 800; letter-spacing: .06em;
  padding: 5px 9px; border-radius: 9px;
  background: var(--r-panel-2); color: var(--r-muted);
}
.sb-chip.ok { background: rgba(52, 211, 153, .16); color: var(--r-green); }
.sb-chip.warn { background: rgba(251, 191, 36, .16); color: var(--r-amber); }
.sb-chip.live { background: rgba(56, 189, 248, .18); color: var(--r-brand); }
.sb-right { display: flex; align-items: center; gap: 10px; }
.sb-clock { font-size: 19px; font-weight: 700; }
.sb-batt { font-size: 13px; color: var(--r-muted); }

/* ---------- Vy ---------- */
.viewport { position: relative; overflow: hidden; }
.screen {
  position: absolute; inset: 0;
  overflow-y: auto; overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  padding: var(--r-gap);
  animation: screen-in .18s ease-out;
}
.screen.flush { padding: 0; overflow: hidden; }
@keyframes screen-in { from { opacity: 0; transform: translateY(8px); } }

/* ---------- Dock ---------- */
.dock {
  display: flex; gap: 8px; padding: 8px 14px 10px;
  background: var(--r-panel); border-top: 1px solid var(--r-line);
  overflow-x: auto; scrollbar-width: none;
}
.dock::-webkit-scrollbar { display: none; }
.dock-item {
  flex: 1 0 auto; min-width: 74px;
  display: grid; justify-items: center; gap: 3px;
  padding: 7px 10px; border-radius: 16px; color: var(--r-muted);
}
.dock-item i { display: block; width: 26px; height: 26px; }
.dock-item span { font-size: 11px; font-weight: 700; letter-spacing: .02em; }
.dock-item.active { background: var(--r-panel-2); color: var(--r-ink); }
.dock-item:active { transform: scale(.95); }

/* ---------- Byggstenar ---------- */
.grid { display: grid; gap: var(--r-gap); grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); }
.row { display: flex; gap: var(--r-gap); flex-wrap: wrap; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.stack { display: grid; gap: var(--r-gap); }
.grow { flex: 1; min-width: 0; }

.card {
  background: var(--r-panel); border: 1px solid var(--r-line);
  border-radius: var(--r-radius); padding: 16px;
}
.card.tight { padding: 12px 14px; }
.card h3 { font-size: 15px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--r-muted); margin-bottom: 10px; }

.tile {
  position: relative; display: grid; align-content: space-between; gap: 12px;
  min-height: 132px; padding: 16px;
  border-radius: var(--r-radius); background: var(--r-panel);
  border: 1px solid var(--r-line); color: var(--r-ink); text-align: left;
}
.tile:active { transform: scale(.97); }
.tile i { display: block; width: 32px; height: 32px; color: var(--r-brand); }
.tile b { font-size: 19px; font-weight: 700; display: block; }
.tile small { display: block; font-size: 13px; color: var(--r-muted); font-weight: 500; margin-top: 2px; }
.tile .badge {
  position: absolute; top: 12px; right: 12px;
  font-size: 11px; font-weight: 800; padding: 4px 8px; border-radius: 8px;
  background: var(--r-panel-2); color: var(--r-muted);
}
.tile .badge.hot { background: rgba(251, 113, 133, .18); color: var(--r-red); }
.tile .badge.live { background: rgba(52, 211, 153, .18); color: var(--r-green); }
.tile.special { border-color: rgba(167, 139, 250, .45); background: linear-gradient(160deg, rgba(167, 139, 250, .12), transparent 60%), var(--r-panel); }
.tile.special i { color: var(--r-violet); }
.tile.wide { grid-column: 1 / -1; min-height: 0; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: var(--r-tap); padding: 0 22px;
  border-radius: 16px; background: var(--r-panel-2); color: var(--r-ink);
  font-weight: 700; font-size: 17px; border: 1px solid var(--r-line);
}
.btn i { width: 22px; height: 22px; flex: none; }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--r-brand); color: var(--r-brand-ink); border-color: transparent; }
.btn.danger { background: var(--r-red); color: #2b0710; border-color: transparent; }
.btn.ghost { background: transparent; }
.btn.block { display: flex; width: 100%; }
.btn.small { min-height: 46px; padding: 0 15px; font-size: 15px; border-radius: 13px; }
.btn[disabled] { opacity: .42; pointer-events: none; }
.btn.on { background: var(--r-green); color: #04231a; border-color: transparent; }

.field { display: grid; gap: 7px; }
.field label { font-size: 13px; font-weight: 700; color: var(--r-muted); }
.input {
  min-height: var(--r-tap); width: 100%;
  padding: 0 16px; border-radius: 15px;
  background: var(--r-panel-2); border: 1px solid var(--r-line); color: var(--r-ink);
  user-select: text;
}
textarea.input { padding: 14px 16px; min-height: 100px; resize: none; line-height: 1.45; }
select.input { appearance: none; padding-right: 40px; }

.list { display: grid; gap: 8px; }
.list-item {
  display: flex; align-items: center; gap: 14px; text-align: left; width: 100%;
  min-height: var(--r-tap); padding: 12px 14px;
  background: var(--r-panel); border: 1px solid var(--r-line); border-radius: 16px; color: var(--r-ink);
}
.list-item:active { transform: scale(.985); }
.list-item .avatar {
  width: 44px; height: 44px; flex: none; border-radius: 50%;
  display: grid; place-items: center; font-weight: 800; font-size: 17px;
  background: var(--r-panel-2); color: var(--r-brand);
}
.list-item .li-main { flex: 1; min-width: 0; }
.list-item .li-main b { display: block; font-size: 17px; font-weight: 700; }
.list-item .li-main small { display: block; font-size: 13px; color: var(--r-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list-item .li-end { font-size: 14px; color: var(--r-muted); font-weight: 700; flex: none; }

.toggle { display: flex; align-items: center; justify-content: space-between; gap: 14px; min-height: var(--r-tap); width: 100%; text-align: left; }
.toggle .t-main b { display: block; font-size: 17px; }
.toggle .t-main small { display: block; font-size: 13px; color: var(--r-muted); }
.switch { width: 60px; height: 34px; flex: none; border-radius: 99px; background: var(--r-line); position: relative; transition: background .18s; }
.switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: transform .18s; }
.switch.on { background: var(--r-green); }
.switch.on::after { transform: translateX(26px); }

.empty { display: grid; gap: 8px; justify-items: center; text-align: center; padding: 34px 18px; color: var(--r-muted); }
.empty b { font-size: 18px; color: var(--r-ink); }
.hint { font-size: 13px; color: var(--r-muted); line-height: 1.5; }
.hint.warn { color: var(--r-amber); }
.pill { display: inline-block; font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 99px; background: var(--r-panel-2); color: var(--r-muted); }
.pill.green { background: rgba(52, 211, 153, .16); color: var(--r-green); }
.pill.amber { background: rgba(251, 191, 36, .16); color: var(--r-amber); }
.pill.red { background: rgba(251, 113, 133, .16); color: var(--r-red); }
.pill.violet { background: rgba(167, 139, 250, .18); color: var(--r-violet); }
.big-num { font-size: 46px; font-weight: 800; line-height: 1; letter-spacing: -1.5px; }
.big-num small { font-size: 16px; font-weight: 600; color: var(--r-muted); margin-left: 6px; letter-spacing: 0; }
.divider { height: 1px; background: var(--r-line); margin: 4px 0; }

/* ---------- Toaster ---------- */
.toast-stack { position: fixed; left: 50%; bottom: calc(96px + var(--r-safe-b)); transform: translateX(-50%); display: grid; gap: 8px; z-index: 70; width: min(92vw, 460px); }
.toast {
  padding: 14px 18px; border-radius: 15px; font-weight: 600;
  background: var(--r-panel-2); color: var(--r-ink);
  border: 1px solid var(--r-line); box-shadow: var(--r-shadow);
  animation: toast-in .2s ease-out;
}
.toast.ok { border-color: rgba(52, 211, 153, .5); }
.toast.warn { border-color: rgba(251, 191, 36, .5); }
.toast.err { border-color: rgba(251, 113, 133, .5); }
.toast.out { opacity: 0; transition: opacity .25s ease; }
@keyframes toast-in { from { opacity: 0; transform: translateY(10px); } }

/* ---------- Assistent ---------- */
.assistant-overlay {
  position: fixed; inset: 0; z-index: 80;
  display: grid; place-content: center; justify-items: center; gap: 24px; padding: 30px;
  background: rgba(5, 7, 12, .93); backdrop-filter: blur(10px);
  text-align: center;
}
.orb { width: 130px; height: 130px; border-radius: 50%; background: radial-gradient(circle at 34% 30%, #7dd3fc, #0284c7 62%, #0c4a6e); box-shadow: 0 0 62px rgba(56, 189, 248, .45); animation: orb-breathe 1.5s ease-in-out infinite; }
@keyframes orb-breathe { 50% { transform: scale(1.09); } }
.assistant-overlay .heard { font-size: 25px; font-weight: 700; max-width: 22ch; min-height: 1.4em; }
.assistant-overlay .said { color: var(--r-muted); max-width: 30ch; }

/* ---------- Fullskärmslarm ---------- */
.alert-overlay {
  position: fixed; inset: 0; z-index: 85;
  display: grid; place-content: center; justify-items: center; gap: 22px; padding: 28px;
  text-align: center; background: rgba(120, 20, 40, .96);
  animation: alert-flash 1.1s ease-in-out infinite;
}
.alert-overlay.calm { background: rgba(12, 74, 110, .96); animation: none; }
@keyframes alert-flash { 50% { background: rgba(158, 30, 55, .97); } }
.alert-overlay h2 { font-size: 34px; font-weight: 800; color: #fff; }
.alert-overlay p { font-size: 19px; color: rgba(255, 255, 255, .88); max-width: 26ch; }
.alert-overlay .btn { background: #fff; color: #111; border: 0; min-width: 220px; }

/* ---------- Kartduk ---------- */
.map-wrap { position: absolute; inset: 0; }
.map-canvas { display: block; width: 100%; height: 100%; background: #070c16; }
body[data-theme="day"] .map-canvas { background: #dfe6ef; }
.map-overlay { position: absolute; inset: 0; pointer-events: none; padding: var(--r-gap); display: grid; grid-template-rows: auto 1fr auto; gap: 12px; }
.map-overlay > * { pointer-events: auto; }
.turn-card { display: flex; align-items: center; gap: 16px; padding: 15px 18px; border-radius: var(--r-radius); background: rgba(16, 22, 35, .93); border: 1px solid var(--r-line); box-shadow: var(--r-shadow); }
body[data-theme="day"] .turn-card { background: rgba(255, 255, 255, .95); }
.turn-card .turn-icon { width: 52px; height: 52px; flex: none; color: var(--r-brand); }
.turn-card .turn-dist { font-size: 27px; font-weight: 800; }
.turn-card .turn-street { color: var(--r-muted); font-size: 15px; }
.eta-bar { display: flex; align-items: center; justify-content: space-around; gap: 12px; padding: 13px; border-radius: var(--r-radius); background: rgba(16, 22, 35, .93); border: 1px solid var(--r-line); }
body[data-theme="day"] .eta-bar { background: rgba(255, 255, 255, .95); }
.eta-bar div { text-align: center; }
.eta-bar b { display: block; font-size: 22px; font-weight: 800; }
.eta-bar small { font-size: 12px; color: var(--r-muted); }
.map-side { display: grid; gap: 10px; align-content: start; justify-items: end; }
.map-fab { width: 56px; height: 56px; border-radius: 18px; display: grid; place-items: center; padding: 15px; background: rgba(16, 22, 35, .93); border: 1px solid var(--r-line); color: var(--r-ink); }
body[data-theme="day"] .map-fab { background: rgba(255, 255, 255, .95); }

/* ---------- Musik ---------- */
.player { display: grid; gap: 18px; justify-items: center; text-align: center; padding: 8px 0 14px; }
.art { width: min(46vh, 210px); aspect-ratio: 1; border-radius: 26px; background: linear-gradient(150deg, #1e3a8a, #0ea5e9 55%, #7c3aed); display: grid; place-items: center; color: rgba(255, 255, 255, .82); box-shadow: var(--r-shadow); overflow: hidden; }
.art svg { width: 44%; height: 44%; }
.art.spin { animation: art-spin 9s linear infinite; }
@keyframes art-spin { to { transform: rotate(360deg); } }
.track-title { font-size: 22px; font-weight: 800; max-width: 26ch; }
.track-sub { color: var(--r-muted); font-size: 15px; }
.seek { width: 100%; display: grid; gap: 6px; }
.seek-rail { height: 8px; border-radius: 99px; background: var(--r-line); overflow: hidden; }
.seek-rail i { display: block; height: 100%; background: var(--r-brand); width: 0; }
.seek-times { display: flex; justify-content: space-between; font-size: 12px; color: var(--r-muted); }
.transport { display: flex; align-items: center; justify-content: center; gap: 18px; }
.tbtn { width: 66px; height: 66px; border-radius: 50%; display: grid; place-items: center; padding: 18px; background: var(--r-panel-2); color: var(--r-ink); border: 1px solid var(--r-line); }
.tbtn.play { width: 86px; height: 86px; padding: 24px; background: var(--r-brand); color: var(--r-brand-ink); border-color: transparent; }
.tbtn:active { transform: scale(.94); }
.tbtn.tiny { width: 50px; height: 50px; padding: 14px; }
.tbtn.on { color: var(--r-brand); border-color: var(--r-brand); }

/* ---------- Knappsats ---------- */
.dialpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 380px; margin: 0 auto; width: 100%; }
.dialpad button { min-height: 68px; border-radius: 18px; background: var(--r-panel-2); border: 1px solid var(--r-line); font-size: 26px; font-weight: 700; }
.dialpad button:active { transform: scale(.95); }
.dial-readout { text-align: center; font-size: 32px; font-weight: 800; min-height: 46px; letter-spacing: 1px; user-select: text; }

/* ---------- HUD (speglad för vindruta) ---------- */
.hud { position: absolute; inset: 0; background: #000; color: #7ef6c8; display: grid; place-content: center; justify-items: center; gap: 10px; transform: scaleY(-1); }
.hud.no-mirror { transform: none; }
.hud .hud-speed { font-size: 27vh; font-weight: 800; line-height: .9; letter-spacing: -6px; }
.hud .hud-unit { font-size: 4vh; font-weight: 700; letter-spacing: 6px; opacity: .75; }
.hud .hud-row { display: flex; gap: 30px; font-size: 3.6vh; font-weight: 700; opacity: .82; }
.hud .hud-exit { position: absolute; inset: 0; transform: scaleY(-1); opacity: 0; }
.hud.warn { color: #ffb4b4; }

/* ---------- Dashcam / kamera ---------- */
.cam-stage { position: absolute; inset: 0; background: #000; }
.cam-stage video { width: 100%; height: 100%; object-fit: cover; }
.cam-hud { position: absolute; inset: 0; padding: var(--r-gap); display: grid; grid-template-rows: auto 1fr auto; pointer-events: none; }
.cam-hud > * { pointer-events: auto; }
.rec-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--r-red); animation: rec-blink 1.1s steps(2, start) infinite; }
@keyframes rec-blink { 50% { opacity: .15; } }
.cam-bar { display: flex; align-items: center; gap: 10px; padding: 11px 15px; border-radius: 15px; background: rgba(0, 0, 0, .62); color: #fff; backdrop-filter: blur(6px); font-size: 15px; font-weight: 700; align-self: start; justify-self: start; }

/** DOM-hjälpare, ikoner och notifieringar. Inga ramverk — ska starta direkt. */

function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (value === null || value === undefined || value === false) continue;
    if (key === 'class') node.className = value;
    else if (key === 'html') node.innerHTML = value;
    else if (key === 'text') node.textContent = value;
    else if (key === 'dataset') Object.assign(node.dataset, value);
    else if (key.startsWith('on') && typeof value === 'function') node.addEventListener(key.slice(2).toLowerCase(), value);
    else if (key === 'value') node.value = value;
    else node.setAttribute(key, value === true ? '' : value);
  }
  for (const child of children.flat()) {
    if (child === null || child === undefined || child === false) continue;
    node.append(child.nodeType ? child : document.createTextNode(child));
  }
  return node;
}

/** Byt ut ett elements innehåll. Till skillnad från replaceChildren() slänger
 *  den villkorliga null-barn i stället för att skriva ut texten "null". */
function setKids(node, ...children) {
  node.replaceChildren(...children.flat().filter((c) => c !== null && c !== undefined && c !== false && c !== ''));
}

function icon(name, className = '') {
  const span = document.createElement('i');
  if (className) span.className = className;
  span.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${PATHS[name] ?? PATHS.target}</svg>`;

const iconSVG = (name) => `<svg viewBox="0 0 24 24" aria-hidden="true">${PATHS[name] ?? PATHS.target}</svg>`;

/* ---------- Notifieringar ---------- */
function toast(message, kind = '', ms = 3200) {
  const stack = document.getElementById('toasts');
  if (!stack) return;
  const node = el('div', { class: `toast ${kind}`.trim(), text: message });
  stack.append(node);
  setTimeout(() => {
    node.classList.add('out');
    setTimeout(() => node.remove(), 260);
  }, ms);
  return node;
}

/** Kort vibration som kvittens — fungerar där Vibration API finns. */
function buzz(pattern = 18) {
  try { navigator.vibrate?.(pattern); } catch { /* ignoreras */ }
}

/* ---------- Formatering ---------- */
const pad2 = (n) => String(n).padStart(2, '0');

function fmtClock(date = new Date()) {
  return `${pad2(date.getHours())}:${pad2(date.getMinutes())}`;
}

function fmtDuration(ms) {
  const total = Math.max(0, Math.round(ms / 1000));
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  return h ? `${h} h ${pad2(m)} min` : m ? `${m} min ${pad2(s)} s` : `${s} s`;
}

function fmtTime(sec) {
  if (!Number.isFinite(sec)) return '0:00';
  const m = Math.floor(sec / 60);
  return `${m}:${pad2(Math.floor(sec % 60))}`;
}

function fmtDistance(meters) {
  if (!Number.isFinite(meters)) return '–';
  if (meters < 950) return `${Math.round(meters / 10) * 10} m`;
  return `${(meters / 1000).toFixed(meters < 10000 ? 1 : 0)} km`;
}

function fmtDate(ts) {
  return new Date(ts).toLocaleDateString('sv-SE', { day: 'numeric', month: 'short' });
}

function fmtDateTime(ts) {
  return new Date(ts).toLocaleString('sv-SE', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
}

/** Ladda ner text som fil — används för export av färddagbok m.m. */
function downloadFile(filename, content, type = 'text/plain;charset=utf-8') {
  const blob = content instanceof Blob ? content : new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = Object.assign(document.createElement('a'), { href: url, download: filename });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

/** Enkel bekräftelseruta med bilstora knappar. */
function confirmBig(title, body, confirmLabel = 'Ja') {
  return new Promise((resolve) => {
    const overlay = document.getElementById('alert-overlay');
    overlay.className = 'alert-overlay calm';
    overlay.hidden = false;
    setKids(overlay, 
      el('h2', { text: title }),
      body ? el('p', { text: body }) : null,
      el('div', { class: 'row' },
        el('button', { class: 'btn', onClick: () => { overlay.hidden = true; resolve(false); }, text: 'Avbryt' }),
        el('button', { class: 'btn primary', onClick: () => { overlay.hidden = true; resolve(true); }, text: confirmLabel }),
      ),
    );
  });
}

/* ===== js/core/bus.js ===== */
/** Enkel händelsebuss. Apparna pratar aldrig direkt med varandra. */
const listeners = new Map();

function on(event, fn) {
  if (!listeners.has(event)) listeners.set(event, new Set());
  listeners.get(event).add(fn);
  return () => off(event, fn);
}

function off(event, fn) {
  listeners.get(event)?.delete(fn);
}

function once(event, fn) {
  const unbind = on(event, (payload) => { unbind(); fn(payload); });
  return unbind;
}

function emit(event, payload) {
  for (const fn of listeners.get(event) ?? []) {
    try { fn(payload); } catch (err) { console.error(`[bus] ${event}`, err); }
  }
}

/* ===== js/core/store.js ===== */
/** localStorage-backad state. Allt överlever att telefonen låser sig i hållaren. */

const KEY = 'reeos.v1';

const DEFAULTS = {
  settings: {
    theme: 'auto',            // auto | night | day
    units: 'metric',
    voice: true,              // läs upp med talsyntes
    voiceRate: 1.05,
    speedVolume: true,        // höj volymen med farten
    wakeLock: true,           // låt skärmen vara tänd
    lockWhileDriving: true,   // blockera textinmatning i rörelse
    speedWarnAt: 0,           // 0 = av, annars km/h
    hudMirror: true,
    autoTripLog: true,
    breakAfterMin: 90,        // pausvarning efter X min körning
  },
  contacts: [
    { id: 'c1', name: 'Hemma', number: '', note: 'Lägg till ditt eget nummer' },
  ],
  places: [
    { id: 'p1', label: 'Hem', lat: null, lon: null },
    { id: 'p2', label: 'Jobb', lat: null, lon: null },
  ],
  quickReplies: [
    'Jag kör just nu, ringer sen.',
    'Är på väg — 10 minuter kvar.',
    'Kan du köra? Jag är trött.',
    'Framme om en stund.',
  ],
  trips: [],       // { id, start, end, km, from, to, purpose, note }
  parking: null,   // { lat, lon, at, note, photo, meterEndsAt, level }
  hazards: [],     // { id, lat, lon, kind, at, note }
  clips: [],       // dashcam-metadata; blobbar ligger i IndexedDB
  stats: { totalKm: 0, breaks: 0, driveMs: 0 },
};

function deepMerge(base, patch) {
  if (Array.isArray(base) || typeof base !== 'object' || base === null) return patch ?? base;
  const out = { ...base };
  for (const [k, v] of Object.entries(patch ?? {})) {
    out[k] = (v && typeof v === 'object' && !Array.isArray(v)) ? deepMerge(base[k] ?? {}, v) : v;
  }
  return out;
}

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    return raw ? deepMerge(DEFAULTS, JSON.parse(raw)) : structuredClone(DEFAULTS);
  } catch {
    return structuredClone(DEFAULTS);
  }
}

const state = load();

let saveTimer = null;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (err) { console.warn('[store] kunde inte spara', err); }
  }, 120);
}

/** Skriv en inställning och meddela lyssnare. */
function setSetting(key, value) {
  state.settings[key] = value;
  save();
  emit('settings:changed', { key, value });
}

/** Lägg till i en lista, spara och notifiera. */
function push(listName, item) {
  state[listName].push(item);
  save();
  emit(`${listName}:changed`, state[listName]);
  return item;
}

function replace(listName, items) {
  state[listName] = items;
  save();
  emit(`${listName}:changed`, items);
}

function remove(listName, id) {
  replace(listName, state[listName].filter((x) => x.id !== id));
}

function setValue(key, value) {
  state[key] = value;
  save();
  emit(`${key}:changed`, value);
}

function resetAll() {
  localStorage.removeItem(KEY);
  Object.assign(state, structuredClone(DEFAULTS));
  emit('store:reset');
}

function exportJSON() {
  return JSON.stringify({ app: 'ReeOS', version: 1, exportedAt: Date.now(), data: state }, null, 2);
}

function importJSON(text) {
  const parsed = JSON.parse(text);
  const data = parsed?.data ?? parsed;
  if (!data || typeof data !== 'object') throw new Error('Filen innehåller ingen ReeOS-data.');
  Object.assign(state, deepMerge(DEFAULTS, data));
  save();
  emit('store:imported');
}

const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

/* ===== js/core/router.js ===== */
/** Appregister och vy-växling. En app åt gången — delad skärm hör inte hemma
 *  i en bil i rörelse. */


const apps = new Map();
let current = null;
let currentTeardown = null;
const history = [];

function register(app) {
  apps.set(app.id, app);
}

const getApp = (id) => apps.get(id);
const allApps = () => [...apps.values()];
const currentApp = () => current;

/** Öppna en app. `params` skickas vidare till dess mount(). */
function open(id, params = {}) {
  const app = apps.get(id);
  if (!app) { console.warn(`[router] okänd app: ${id}`); return; }

  if (current) {
    try { currentTeardown?.(); } catch (err) { console.error('[router] teardown', err); }
    if (current.id !== id) history.push(current.id);
    if (history.length > 12) history.shift();
  }

  const viewport = $('#viewport');
  const screen = document.createElement('section');
  screen.className = `screen${app.flush ? ' flush' : ''}`;
  screen.dataset.app = id;
  viewport.replaceChildren(screen);
  viewport.scrollTop = 0;

  current = app;
  currentTeardown = null;
  try {
    currentTeardown = app.mount(screen, params) ?? null;
  } catch (err) {
    console.error(`[router] ${id} kraschade`, err);
    screen.innerHTML = `<div class="empty"><b>${app.name} kunde inte öppnas</b><span class="hint">${err.message}</span></div>`;
  }

  location.hash = id === 'home' ? '' : `#${id}`;
  emit('router:changed', { id, app, params });
}

function back() {
  const previous = history.pop();
  open(previous ?? 'home');
  // open() la tillbaka den vi lämnade; ta bort så bakåt inte pendlar.
  history.pop();
}

const canGoBack = () => history.length > 0;

function startRouter(defaultId = 'home') {
  const fromHash = location.hash.replace('#', '');
  open(apps.has(fromHash) ? fromHash : defaultId);

  window.addEventListener('hashchange', () => {
    const id = location.hash.replace('#', '') || 'home';
    if (apps.has(id) && current?.id !== id) open(id);
  });
}

/* ===== js/core/sensors.js ===== */
/** Position, fart, riktning, batteri och skärmlås.
 *  En enda GPS-prenumeration som alla appar delar — flera watchPosition
 *  parallellt dränerar batteriet i onödan. */


const sensors = {
  supported: 'geolocation' in navigator,
  status: 'idle',        // idle | pending | live | denied | error
  lat: null,
  lon: null,
  accuracy: null,
  heading: null,         // grader, 0 = norr
  speed: 0,              // m/s
  speedKmh: 0,
  altitude: null,
  updatedAt: 0,
  driving: false,
  batteryLevel: null,
  batteryCharging: null,
};

const R_EARTH = 6371000;
const toRad = (deg) => (deg * Math.PI) / 180;
const toDeg = (rad) => (rad * 180) / Math.PI;

/** Avstånd i meter mellan två WGS84-punkter. */
function distanceBetween(a, b) {
  if (!a || !b || a.lat == null || b.lat == null) return NaN;
  const dLat = toRad(b.lat - a.lat);
  const dLon = toRad(b.lon - a.lon);
  const lat1 = toRad(a.lat);
  const lat2 = toRad(b.lat);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) ** 2;
  return 2 * R_EARTH * Math.asin(Math.sqrt(h));
}

/** Kompassbäring i grader från a till b. */
function bearingBetween(a, b) {
  if (!a || !b || a.lat == null || b.lat == null) return NaN;
  const lat1 = toRad(a.lat);
  const lat2 = toRad(b.lat);
  const dLon = toRad(b.lon - a.lon);
  const y = Math.sin(dLon) * Math.cos(lat2);
  const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
  return (toDeg(Math.atan2(y, x)) + 360) % 360;
}

const compassName = (deg) =>
  ['N', 'NO', 'O', 'SO', 'S', 'SV', 'V', 'NV'][Math.round(((deg % 360) + 360) % 360 / 45) % 8];

/* ---------- Fartutjämning ----------
   Rå GPS-fart hoppar; ett litet glidande medelvärde gör siffran läsbar
   utan att göra den märkbart fördröjd. */
const speedWindow = [];
let lastFix = null;

function smoothSpeed(raw) {
  speedWindow.push(raw);
  if (speedWindow.length > 5) speedWindow.shift();
  return speedWindow.reduce((a, b) => a + b, 0) / speedWindow.length;
}

let watchId = null;

function startGPS() {
  if (!sensors.supported) {
    sensors.status = 'error';
    emit('sensors:status', sensors);
    return;
  }
  if (watchId !== null) return;
  sensors.status = 'pending';
  emit('sensors:status', sensors);

  watchId = navigator.geolocation.watchPosition(onFix, onFixError, {
    enableHighAccuracy: true,
    maximumAge: 1000,
    timeout: 20000,
  });
}

function stopGPS() {
  if (watchId !== null) {
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
  }
  sensors.status = 'idle';
  emit('sensors:status', sensors);
}

function onFix(pos) {
  const { latitude, longitude, accuracy, heading, speed, altitude } = pos.coords;
  const now = pos.timestamp || Date.now();
  const here = { lat: latitude, lon: longitude };

  // Vissa enheter lämnar speed = null. Räkna då fram den ur två fixar.
  let mps = Number.isFinite(speed) && speed !== null ? speed : 0;
  if ((!Number.isFinite(speed) || speed === null) && lastFix) {
    const dt = (now - lastFix.t) / 1000;
    const dist = distanceBetween(lastFix, here);
    if (dt > 0.4 && dt < 30 && Number.isFinite(dist)) mps = dist / dt;
  }
  // Stillastående GPS driver runt några meter — under 0,7 m/s är det brus.
  if (mps < 0.7) mps = 0;

  sensors.lat = latitude;
  sensors.lon = longitude;
  sensors.accuracy = accuracy;
  sensors.altitude = altitude;
  sensors.speed = smoothSpeed(mps);
  sensors.speedKmh = sensors.speed * 3.6;
  if (Number.isFinite(heading) && heading !== null && mps > 1) sensors.heading = heading;
  sensors.updatedAt = now;
  sensors.status = 'live';
  lastFix = { ...here, t: now };

  const wasDriving = sensors.driving;
  if (sensors.speedKmh > 8) sensors.driving = true;
  else if (sensors.speedKmh < 3) sensors.driving = false;

  emit('sensors:fix', sensors);
  if (wasDriving !== sensors.driving) emit('sensors:driving', sensors.driving);

  const warnAt = state.settings.speedWarnAt;
  if (warnAt > 0 && sensors.speedKmh > warnAt) emit('sensors:overspeed', sensors.speedKmh);
}

function onFixError(err) {
  sensors.status = err.code === err.PERMISSION_DENIED ? 'denied' : 'error';
  emit('sensors:status', sensors);
}

/** Nuvarande position, eller null innan första fixen. */
const here = () => (sensors.lat == null ? null : { lat: sensors.lat, lon: sensors.lon });

/** En enstaka färsk position — för "spara p-plats" där det måste vara nu. */
function fixOnce(timeout = 12000) {
  return new Promise((resolve, reject) => {
    if (!sensors.supported) { reject(new Error('Ingen GPS i den här enheten.')); return; }
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude, accuracy: pos.coords.accuracy }),
      (err) => reject(new Error(err.code === err.PERMISSION_DENIED ? 'Platsåtkomst nekad.' : 'Ingen position ännu.')),
      { enableHighAccuracy: true, timeout, maximumAge: 0 },
    );
  });
}

/* ---------- Skärmlås ---------- */
let wakeLock = null;

async function keepScreenAwake(on = true) {
  if (!('wakeLock' in navigator)) return false;
  try {
    if (on) {
      wakeLock ??= await navigator.wakeLock.request('screen');
      wakeLock.addEventListener?.('release', () => { wakeLock = null; });
      return true;
    }
    await wakeLock?.release();
    wakeLock = null;
    return false;
  } catch {
    wakeLock = null;
    return false;
  }
}

// Skärmlåset släpps när fliken göms; ta det igen när den syns.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && state.settings.wakeLock) keepScreenAwake(true);
});

/* ---------- Batteri ---------- */
async function watchBattery() {
  if (!navigator.getBattery) return;
  try {
    const battery = await navigator.getBattery();
    const sync = () => {
      sensors.batteryLevel = Math.round(battery.level * 100);
      sensors.batteryCharging = battery.charging;
      emit('sensors:battery', sensors);
    };
    battery.addEventListener('levelchange', sync);
    battery.addEventListener('chargingchange', sync);
    sync();
  } catch { /* batteristatus är trevligt men inte nödvändigt */ }
}

/* ---------- Enhetsriktning (kompass utan fart) ---------- */
let orientationBound = false;

function watchOrientation() {
  if (orientationBound) return;
  orientationBound = true;
  window.addEventListener('deviceorientationabsolute', onOrientation, true);
  window.addEventListener('deviceorientation', onOrientation, true);
}

function onOrientation(event) {
  const deg = event.webkitCompassHeading ?? (event.absolute && event.alpha !== null ? 360 - event.alpha : null);
  if (deg === null || !Number.isFinite(deg)) return;
  // GPS-riktningen är pålitligare i fart; kompassen får ta över när bilen står still.
  if (sensors.speed < 1.5) sensors.heading = deg;
}

/** iOS kräver ett användarklick innan kompassen får läsas. */
async function requestOrientationPermission() {
  const api = window.DeviceOrientationEvent;
  if (api && typeof api.requestPermission === 'function') {
    try { return (await api.requestPermission()) === 'granted'; } catch { return false; }
  }
  return true;
}

/* ===== js/core/speech.js ===== */
/** Tal in och ut. Allt som går att göra med rösten ska gå att göra med rösten —
 *  händerna hör hemma på ratten. */


const synth = window.speechSynthesis;
let voices = [];

function loadVoices() {
  voices = synth?.getVoices?.() ?? [];
}
loadVoices();
synth?.addEventListener?.('voiceschanged', loadVoices);

function pickVoice() {
  if (!voices.length) loadVoices();
  return voices.find((v) => v.lang === 'sv-SE')
    ?? voices.find((v) => v.lang?.startsWith('sv'))
    ?? voices.find((v) => v.default)
    ?? voices[0]
    ?? null;
}

/** Säg något. `force` läser upp även när röstsvar är avslaget (t.ex. larm). */
function say(text, { force = false, interrupt = true } = {}) {
  if (!synth || !text) return;
  if (!state.settings.voice && !force) return;
  if (interrupt) synth.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  const voice = pickVoice();
  if (voice) utter.voice = voice;
  utter.lang = voice?.lang ?? 'sv-SE';
  utter.rate = state.settings.voiceRate ?? 1;
  utter.pitch = 1;
  synth.speak(utter);
}

function hush() {
  synth?.cancel();
}

/* ---------- Igenkänning ---------- */
const Recognition = window.SpeechRecognition ?? window.webkitSpeechRecognition;
const canListen = Boolean(Recognition);

let recognition = null;
let listening = false;

function listen() {
  return new Promise((resolve, reject) => {
    if (!Recognition) { reject(new Error('Rösttolkning stöds inte i den här webbläsaren.')); return; }
    if (listening) { stopListening(); }

    recognition = new Recognition();
    recognition.lang = 'sv-SE';
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;
    recognition.continuous = false;

    let finalText = '';
    let settled = false;

    recognition.onresult = (event) => {
      let interim = '';
      for (let i = event.resultIndex; i < event.results.length; i += 1) {
        const result = event.results[i];
        if (result.isFinal) finalText += result[0].transcript;
        else interim += result[0].transcript;
      }
      emit('speech:partial', (finalText + interim).trim());
    };
    recognition.onerror = (event) => {
      if (settled) return;
      settled = true;
      listening = false;
      const msg = event.error === 'not-allowed'
        ? 'Mikrofonen är blockerad. Tillåt mikrofon för ReeOS.'
        : event.error === 'no-speech' ? 'Hörde inget.' : 'Rösttolkningen avbröts.';
      reject(new Error(msg));
    };
    recognition.onend = () => {
      listening = false;
      emit('speech:end');
      if (settled) return;
      settled = true;
      const text = finalText.trim();
      if (text) resolve(text);
      else reject(new Error('Hörde inget.'));
    };

    listening = true;
    emit('speech:start');
    try { recognition.start(); }
    catch { listening = false; reject(new Error('Kunde inte starta mikrofonen.')); }
  });
}

function stopListening() {
  try { recognition?.stop(); } catch { /* redan stoppad */ }
  listening = false;
}

const isListening = () => listening;

/** Färddagbok. Loggar sträckan automatiskt så att milersättningen inte
 *  behöver rekonstrueras ur minnet en söndag i januari. */




const STOP_AFTER_MS = 3 * 60 * 1000;   // stillastående så länge = resan är slut

let active = null;      // { id, start, meters, from, lastPoint, lastMoveAt }

function tripStatus() {
  return {
    active: Boolean(active),
    km: active ? active.meters / 1000 : 0,
    durationMs: active ? Date.now() - active.start : 0,
    id: active?.id ?? null,
  };
}

function startTrip(manual = false) {
  if (active) return active;
  const point = here();
  active = {
    id: uid(),
    start: Date.now(),
    meters: 0,
    from: point ? { ...point } : null,
    lastPoint: point ? { ...point } : null,
    lastMoveAt: Date.now(),
  };
  emit('trip:changed', tripStatus());
  if (manual) toast('Resan loggas.', 'ok');
  return active;
}

function endTrip({ purpose = 'privat', note = '' } = {}) {
  if (!active) return null;
  const trip = {
    id: active.id,
    start: active.start,
    end: Date.now(),
    km: Number((active.meters / 1000).toFixed(2)),
    from: active.from,
    to: here(),
    purpose,
    note,
  };
  active = null;
  // Under 300 m är det mest GPS-brus på en parkering, inte en resa.
  trip.recorded = trip.km >= 0.3;
  if (trip.recorded) {
    push('trips', trip);
    state.stats.totalKm = Number((state.stats.totalKm + trip.km).toFixed(2));
    state.stats.driveMs += trip.end - trip.start;
    save();
    toast(`Resa sparad: ${trip.km.toFixed(1)} km.`, 'ok');
  }
  emit('trip:changed', tripStatus());
  return trip;
}

/** Kopplas in från main.js och matas av samma GPS-ström som resten. */
function initTripLogger() {
  on('sensors:fix', () => {
    const point = here();
    if (!point) return;

    if (!active) {
      if (state.settings.autoTripLog && sensors.driving) startTrip();
      return;
    }

    if (active.lastPoint) {
      const step = distanceBetween(active.lastPoint, point);
      // Kasta hopp som är brus (<8 m) eller orimliga (>500 m mellan två fixar).
      if (Number.isFinite(step) && step >= 8 && step < 500) {
        active.meters += step;
        active.lastPoint = { ...point };
        active.lastMoveAt = Date.now();
      }
    } else {
      active.lastPoint = { ...point };
      active.from ??= { ...point };
    }

    if (sensors.speedKmh > 5) active.lastMoveAt = Date.now();
    if (Date.now() - active.lastMoveAt > STOP_AFTER_MS) endTrip();
  });
}

function toCSV(trips) {
  const rows = [['Datum', 'Start', 'Slut', 'Kilometer', 'Ärende', 'Anteckning', 'Från', 'Till']];
  for (const trip of trips) {
    const coord = (p) => (p ? `${p.lat.toFixed(5)} ${p.lon.toFixed(5)}` : '');
    rows.push([
      new Date(trip.start).toLocaleDateString('sv-SE'),
      new Date(trip.start).toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' }),
      new Date(trip.end).toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' }),
      trip.km.toFixed(2).replace('.', ','),
      trip.purpose,
      trip.note ?? '',
      coord(trip.from),
      coord(trip.to),
    ]);
  }
  return rows.map((row) => row.map((cell) => `"${String(cell).replace(/"/g, '""')}"`).join(';')).join('\r\n');
}

            el('b', { text: `${trip.km.toFixed(1)} km · ${trip.purpose}` }),
            el('small', { text: `${fmtDateTime(trip.start)} · ${fmtDuration(trip.end - trip.start)}${trip.note ? ` · ${trip.note}` : ''}` }),
          ),

          }, icon('trash')),
        )),

    }

    const render = () => { renderLive(); renderTotals(); renderList(); };
    render();
    const timer = setInterval(renderLive, 3000);
    const unbind = on('trip:changed', render);
    return () => { clearInterval(timer); unbind(); };
  },
};

/* ===== js/apps/fatigue.js ===== */
/** Trötthetsvakt.
 *  Räknar sammanhängande körtid, väger in klockslaget och påminner om paus.
 *  Varningen tar aldrig över skärmen medan bilen rullar — då kommer den som
 *  röst och banner, och helskärmen väntar tills du står stilla. */





const BREAK_MS = 10 * 60 * 1000;   // stillastående så länge räknas som rast

const watch = {
  drivingMs: 0,
  lastTick: Date.now(),
  stoppedSince: null,
  warned: 0,          // 0 = inget, 1 = förvarning, 2 = full varning
  lastCheckAt: 0,
  reactionMs: null,
};

/** 0–1. Riktvärde, inte en medicinsk bedömning. */
function riskScore() {
  const limitMs = state.settings.breakAfterMin * 60 * 1000;
  const fromTime = Math.min(watch.drivingMs / limitMs, 1.3) * 0.6;
  const hour = new Date().getHours();
  // Dygnsrytmens två svackor: natten och tidiga eftermiddagen.
  const fromHour = (hour >= 1 && hour < 6) ? 0.34 : (hour >= 13 && hour < 15) ? 0.16 : (hour >= 22 || hour < 1) ? 0.2 : 0;
  const fromReaction = watch.reactionMs && watch.reactionMs > 420 ? 0.14 : 0;
  return Math.min(1, fromTime + fromHour + fromReaction);
}

function fatigueStatus() {
  const limitMs = state.settings.breakAfterMin * 60 * 1000;
  return {
    drivingMs: watch.drivingMs,
    limitMs,
    dueForBreak: watch.drivingMs >= limitMs,
    risk: riskScore(),
    reactionMs: watch.reactionMs,
    sinceBreak: watch.stoppedSince,
  };
}

function takeBreak(quiet = false) {
  watch.drivingMs = 0;
  watch.warned = 0;
  state.stats.breaks += 1;
  save();
  emit('fatigue:changed', fatigueStatus());
  if (!quiet) toast('Körtiden nollställd. Kör försiktigt.', 'ok');
}

function initFatigueWatch() {
  setInterval(() => {
    const now = Date.now();
    const delta = now - watch.lastTick;
    watch.lastTick = now;
    if (delta > 60000) return;   // fliken har legat i bakgrunden

    if (sensors.driving) {
      watch.drivingMs += delta;
      watch.stoppedSince = null;
    } else {
      watch.stoppedSince ??= now;
      if (now - watch.stoppedSince >= BREAK_MS && watch.drivingMs > 0) {
        takeBreak(true);
        toast('Rasten är räknad — körtiden nollställd.', 'ok');
      }
    }

    const { limitMs, dueForBreak } = fatigueStatus();
    if (watch.warned < 1 && watch.drivingMs > limitMs * 0.85) {
      watch.warned = 1;
      say('Du har snart kört i ' + Math.round(limitMs / 60000) + ' minuter. Leta upp ett bra ställe att stanna på.', { force: true });
      toast('Paus om ungefär en kvart — börja titta efter en rastplats.', 'warn', 6000);
    } else if (watch.warned < 2 && dueForBreak) {
      watch.warned = 2;
      buzz([80, 120, 80, 120, 80]);
      say('Dags för paus. Du har kört i ' + fmtDuration(watch.drivingMs) + ' utan rast.', { force: true });
      if (sensors.speedKmh < 3) showBreakOverlay();
      else toast('Dags för paus — stanna vid nästa möjlighet.', 'err', 8000);
    }
    emit('fatigue:tick', fatigueStatus());
  }, 5000);

  // Står bilen stilla när full varning redan gått ut? Då kommer helskärmen.
  on('sensors:driving', (driving) => {
    if (!driving && watch.warned >= 2 && watch.drivingMs >= fatigueStatus().limitMs) showBreakOverlay();
  });
}

function showBreakOverlay() {
  const overlay = document.getElementById('alert-overlay');
  if (!overlay || !overlay.hidden) return;
  overlay.className = 'alert-overlay';
  overlay.hidden = false;
  setKids(overlay, 
    el('h2', { text: 'Ta en paus' }),
    el('p', { text: `Du har kört ${fmtDuration(watch.drivingMs)} utan rast. Femton minuter och lite frisk luft gör verklig skillnad.` }),
    el('div', { class: 'row', style: 'justify-content:center' },
      el('button', { class: 'btn', onClick: () => { overlay.hidden = true; }, text: 'Senare' }),
      el('button', { class: 'btn', onClick: () => { overlay.hidden = true; takeBreak(); }, text: 'Jag rastar nu' }),
    ),
  );
}

const fatigueApp = {
  id: 'fatigue',
  name: 'Trötthetsvakt',
  icon: 'coffee',

  mount(root) {
    const summary = el('div', { class: 'card' });
    const test = el('div', { class: 'card' });

    root.append(
      summary,
      el('div', { style: 'height:12px' }),
      test,
      el('div', { style: 'height:12px' }),
      el('div', { class: 'card stack' },
        el('h3', { style: 'margin:0', text: 'Pausintervall' }),
        el('div', { class: 'chips' },
          ...[45, 60, 90, 120].map((min) => el('button', {
            class: `chip-btn${state.settings.breakAfterMin === min ? ' on' : ''}`,
            onClick: (ev) => {
              state.settings.breakAfterMin = min;
              save();
              [...ev.currentTarget.parentElement.children].forEach((c) => c.classList.remove('on'));
              ev.currentTarget.classList.add('on');
              render();
            },
            text: `${min} min`,
          })),
        ),
        el('p', { class: 'hint', text: 'Vakten räknar bara tid då bilen faktiskt rullar. Tio minuter stillastående nollställer räknaren automatiskt.' }),
      ),
      el('div', { style: 'height:12px' }),
      el('p', { class: 'hint', text: 'ReeOS mäter körtid och klockslag — inte ditt medicinska tillstånd. Känner du dig trött ska du stanna oavsett vad appen säger.' }),
    );

    function render() {
      const status = fatigueStatus();
      const pct = Math.min(100, (status.drivingMs / status.limitMs) * 100);
      const risk = status.risk;
      const bar = el('i', { class: risk > 0.75 ? 'high' : risk > 0.45 ? 'mid' : '' });
      bar.style.width = `${Math.max(3, risk * 100)}%`;

      setKids(summary, 
        el('div', { class: 'spread' },
          el('div', {},
            el('div', { class: 'big-num', text: fmtDuration(status.drivingMs) }),
            el('div', { class: 'hint', text: `av ${state.settings.breakAfterMin} min till nästa paus` }),
          ),
          el('span', { class: `pill ${risk > 0.75 ? 'red' : risk > 0.45 ? 'amber' : 'green'}`,
            text: risk > 0.75 ? 'HÖG RISK' : risk > 0.45 ? 'VAR VAKSAM' : 'PIGG' }),
        ),
        el('div', { style: 'height:12px' }),
        el('div', { class: 'bar-meter' }, bar),
        el('div', { class: 'hint', style: 'margin-top:8px', text: `Körtid ${Math.round(pct)} % · klockslag väger in mellan 01–06 och 13–15.` }),
        el('div', { style: 'height:14px' }),
        el('div', { class: 'row' },
          el('button', { class: 'btn primary grow', onClick: () => { takeBreak(); render(); } }, icon('coffee'), 'Jag tar paus nu'),
        ),
        el('div', { class: 'hint', style: 'margin-top:10px', text: `Totalt ${state.stats.breaks} registrerade pauser.` }),
      );
    }

    /* Vakenhetskoll: enkel reaktionsmätning, bara när bilen står still. */
    function renderTest(phase = 'idle', payload = null) {
      if (sensors.driving) {
        setKids(test, 
          el('h3', { text: 'Vakenhetskoll' }),
          el('div', { class: 'hint warn', text: 'Testet går bara att göra när bilen står stilla.' }),
        );
        return;
      }

      if (phase === 'idle') {
        setKids(test, 
          el('h3', { text: 'Vakenhetskoll' }),
          el('p', { class: 'hint', style: 'margin-bottom:12px', text: 'Tryck när rutan blir grön. Under 400 ms är normalt utvilat.' }),
          watch.reactionMs ? el('div', { class: 'hint', style: 'margin-bottom:10px', text: `Senaste: ${watch.reactionMs} ms` }) : null,
          el('button', { class: 'btn block primary', onClick: runTest }, icon('eye'), 'Starta test'),
        );
      } else if (phase === 'wait') {
        setKids(test, 
          el('h3', { text: 'Vakenhetskoll' }),
          el('button', { class: 'btn block', id: 'reaction-pad', style: 'min-height:150px;font-size:20px', text: 'Vänta på grönt…' }),
        );
      } else if (phase === 'go') {
        const pad = el('button', { class: 'btn block', style: 'min-height:150px;font-size:20px;background:var(--r-green);color:#04231a', text: 'TRYCK!' });
        pad.addEventListener('click', payload, { once: true });
        setKids(test, el('h3', { text: 'Vakenhetskoll' }), pad);
      } else if (phase === 'done') {
        const ms = payload;
        setKids(test, 
          el('h3', { text: 'Vakenhetskoll' }),
          el('div', { class: 'big-num' }, String(ms), el('small', { text: 'ms' })),
          el('p', { class: 'hint', style: 'margin:10px 0', text: ms < 400
            ? 'Normal reaktionstid. Kör vidare, men glöm inte pausen.'
            : ms < 550 ? 'Något långsamt. Överväg en kort paus.'
            : 'Klart långsammare än vaket normalläge. Stanna och vila.' }),
          el('button', { class: 'btn block', onClick: () => renderTest('idle') }, 'Kör om testet'),
        );
      }
    }

    let testTimer = null;
    function runTest() {
      renderTest('wait');
      testTimer = setTimeout(() => {
        const startedAt = performance.now();
        renderTest('go', () => {
          const ms = Math.round(performance.now() - startedAt);
          watch.reactionMs = ms;
          watch.lastCheckAt = Date.now();
          buzz();
          renderTest('done', ms);
          render();
        });
      }, 1600 + Math.random() * 2600);
    }

    render();
    renderTest();
    const timer = setInterval(() => { render(); if (!testTimer) renderTest(); }, 4000);
    const unbind = on('fatigue:changed', render);
    return () => { clearInterval(timer); clearTimeout(testTimer); unbind(); };
  },
};

/** Väglag och varningar.
 *  Markera hål, halka, vilt eller kö där du möter det. ReeOS varnar när du
 *  närmar dig en markering igen — din egen, eller en du fått delad till dig.
 *  Ingen server: listan bor i telefonen och byts som fil mellan bilar. */





const HAZARD_KINDS = {
  pothole: { label: 'Hål i vägen', voice: 'Hål i vägen', icon: 'warn' },
  ice: { label: 'Halka', voice: 'Risk för halka', icon: 'warn' },
  wildlife: { label: 'Vilt', voice: 'Viltstråk', icon: 'warn' },
  queue: { label: 'Kö', voice: 'Köbildning', icon: 'car' },
  roadwork: { label: 'Vägarbete', voice: 'Vägarbete', icon: 'road' },
  camera: { label: 'Fartkamera', voice: 'Fartkamera', icon: 'cam' },
};

const announced = new Map();   // id -> tidpunkt, så samma varning inte upprepas

function reportHazard(kind, note = '') {
  const pos = here();
  if (!pos) { toast('Ingen position ännu — kan inte markera.', 'warn'); return null; }
  const hazard = { id: uid(), kind, note, lat: pos.lat, lon: pos.lon, at: Date.now() };
  push('hazards', hazard);
  buzz([20, 50]);
  toast(`${HAZARD_KINDS[kind]?.label ?? 'Markering'} sparad här.`, 'ok');
  return hazard;
}

/** Närmaste markering framför dig inom `radius` meter. */
function nearestHazard(pos, radius = 500) {
  if (!pos) return null;
  let best = null;
  for (const hazard of state.hazards) {
    const distance = distanceBetween(pos, hazard);
    if (!Number.isFinite(distance) || distance > radius) continue;
    if (!best || distance < best.distance) {
      best = { ...hazard, distance, label: HAZARD_KINDS[hazard.kind]?.label ?? 'Varning' };
    }
  }
  return best;
}

/** Bakgrundsvakt: säger till i god tid, men bara för det som ligger framåt. */
function initHazardWatch() {
  on('sensors:fix', () => {
    if (!sensors.driving) return;
    const pos = here();
    // Ju fortare du kör, desto tidigare behöver du veta — ca 20 sekunders varsel.
    const radius = Math.max(220, sensors.speed * 20);

    for (const hazard of state.hazards) {
      const distance = distanceBetween(pos, hazard);
      if (!Number.isFinite(distance) || distance > radius) continue;

      // Ligger den bakom oss? Då är den redan passerad.
      if (Number.isFinite(sensors.heading)) {
        const bearing = bearingBetween(pos, hazard);
        const offset = Math.abs(((bearing - sensors.heading + 540) % 360) - 180);
        if (offset > 70) continue;
      }

      const lastTime = announced.get(hazard.id) ?? 0;
      if (Date.now() - lastTime < 5 * 60000) continue;
      announced.set(hazard.id, Date.now());

      const kind = HAZARD_KINDS[hazard.kind];
      buzz([30, 60, 30]);
      say(`${kind?.voice ?? 'Varning'} om ${fmtDistance(distance)}.`, { force: true });
      toast(`${kind?.label ?? 'Varning'} · ${fmtDistance(distance)} framåt`, 'warn', 6000);
      emit('hazard:near', hazard);
      break;
    }
  });

  on('alerts:quickreport', () => openQuickReport());
}

/** Ett tryck, sex val, klart — tänkt att gå att träffa utan att titta länge. */
function openQuickReport() {
  const overlay = document.getElementById('alert-overlay');
  if (!overlay) return;
  overlay.className = 'alert-overlay calm';
  overlay.hidden = false;
  setKids(overlay, 
    el('h2', { text: 'Vad ser du?' }),
    el('div', { class: 'row', style: 'justify-content:center;max-width:560px' },
      ...Object.entries(HAZARD_KINDS).map(([key, kind]) => el('button', {
        class: 'btn', style: 'min-width:150px',
        onClick: () => { overlay.hidden = true; reportHazard(key); },
      }, icon(kind.icon), kind.label)),
    ),
    el('button', { class: 'btn ghost', style: 'color:#fff;border-color:rgba(255,255,255,.4)', onClick: () => { overlay.hidden = true; }, text: 'Avbryt' }),
  );
}

const alertsApp = {
  id: 'alerts',
  name: 'Väglag',
  icon: 'warn',

  mount(root) {
    const list = el('div', { class: 'list' });

    root.append(
      el('div', { class: 'card' },
        el('h3', { text: 'Markera här' }),
        el('div', { class: 'grid', style: 'grid-template-columns:repeat(auto-fill,minmax(150px,1fr))' },
          ...Object.entries(HAZARD_KINDS).map(([key, kind]) => el('button', {
            class: 'btn', style: 'min-height:74px',
            onClick: () => { reportHazard(key); render(); },
          }, icon(kind.icon), kind.label)),
        ),
        el('p', { class: 'hint', style: 'margin-top:10px', text: 'Markeringen läggs på din nuvarande position. Under körning finns samma knappar bakom varningsikonen i kartvyn.' }),
      ),
      el('div', { style: 'height:12px' }),
      el('div', { class: 'card' },
        el('div', { class: 'spread', style: 'margin-bottom:10px' },
          el('h3', { style: 'margin:0', text: 'Mina markeringar' }),
          el('div', { class: 'row' },
            el('button', {
              class: 'btn small',
              onClick: () => {
                if (!state.hazards.length) { toast('Inget att dela.', 'warn'); return; }
                downloadFile(`reeos-vaglag-${new Date().toISOString().slice(0, 10)}.json`,
                  JSON.stringify({ app: 'ReeOS', kind: 'hazards', hazards: state.hazards }, null, 2), 'application/json');
              },
            }, icon('download'), 'Dela'),
            el('button', { class: 'btn small', onClick: () => importInput.click() }, icon('upload'), 'Läs in'),
          ),
        ),
        list,
      ),
      el('div', { style: 'height:12px' }),
      el('p', { class: 'hint', text: 'Markeringarna ligger bara i den här telefonen. Vill du dela med någon annan bil exporterar du filen och läser in den där.' }),
    );

    const importInput = el('input', { type: 'file', accept: 'application/json,.json', class: 'sr-only' });
    importInput.addEventListener('change', async () => {
      const file = importInput.files?.[0];
      importInput.value = '';
      if (!file) return;
      try {
        const parsed = JSON.parse(await file.text());
        const incoming = Array.isArray(parsed) ? parsed : parsed.hazards;
        if (!Array.isArray(incoming)) throw new Error('Filen innehåller inga markeringar.');
        const known = new Set(state.hazards.map((h) => `${h.lat.toFixed(5)}|${h.lon.toFixed(5)}|${h.kind}`));
        const fresh = incoming
          .filter((h) => Number.isFinite(h.lat) && Number.isFinite(h.lon) && HAZARD_KINDS[h.kind])
          .filter((h) => !known.has(`${h.lat.toFixed(5)}|${h.lon.toFixed(5)}|${h.kind}`))
          .map((h) => ({ id: uid(), kind: h.kind, note: h.note ?? '', lat: h.lat, lon: h.lon, at: h.at ?? Date.now() }));
        replace('hazards', [...state.hazards, ...fresh]);
        toast(`${fresh.length} nya markeringar inlästa.`, 'ok');
        render();
      } catch (err) { toast(err.message, 'err'); }
    });
    root.append(importInput);

    function render() {
      const pos = here();
      const sorted = [...state.hazards].sort((a, b) => {
        if (!pos) return b.at - a.at;
        return distanceBetween(pos, a) - distanceBetween(pos, b);
      });
      setKids(list, 
        ...sorted.map((hazard) => {
          const kind = HAZARD_KINDS[hazard.kind] ?? { label: 'Varning', icon: 'warn' };
          const distance = distanceBetween(pos, hazard);
          return el('div', { class: 'list-item' },
            el('span', { class: 'avatar' }, icon(kind.icon)),
            el('div', { class: 'li-main' },
              el('b', { text: kind.label }),
              el('small', { text: `${fmtDate(hazard.at)}${hazard.note ? ` · ${hazard.note}` : ''}` }),
            ),
            el('span', { class: 'li-end', text: Number.isFinite(distance) ? fmtDistance(distance) : '' }),
            el('button', { class: 'btn small ghost', 'aria-label': 'Ta bort', onClick: () => { remove('hazards', hazard.id); render(); } }, icon('trash')),
          );
        }),
        sorted.length ? null : el('div', { class: 'empty' },
          el('b', { text: 'Inga markeringar' }),
          el('span', { class: 'hint', text: 'Markera det du möter — hålet finns kvar nästa gång du kör här.' })),
      );
    }

    render();
    const unbind = on('hazards:changed', render);
    return () => unbind();
  },
};
