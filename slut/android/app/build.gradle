plugins {
    id 'com.android.application'
}

android {
    namespace 'se.slutspelet.spel'
    compileSdk 35

    defaultConfig {
        applicationId 'se.slutspelet.spel'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        // Demonyckel som ligger i projektet, så att varje bygge kan installeras
        // över det förra. Sätt SLUT_KEYSTORE (+ _PASSWORD, _ALIAS) för en egen nyckel.
        demo {
            storeFile file(System.getenv('SLUT_KEYSTORE') ?: 'slut-demo.jks')
            storePassword System.getenv('SLUT_KEYSTORE_PASSWORD') ?: 'slutspelet'
            keyAlias System.getenv('SLUT_KEY_ALIAS') ?: 'slut'
            keyPassword System.getenv('SLUT_KEY_PASSWORD') ?: System.getenv('SLUT_KEYSTORE_PASSWORD') ?: 'slutspelet'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.demo
        }
    }

    // Spelet (slut/www) packas direkt som appens assets.
    sourceSets {
        main {
            assets.srcDirs = ['../../www']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
