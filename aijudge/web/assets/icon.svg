<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5a2b"/>
      <stop offset="1" stop-color="#5b3618"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0d489"/>
      <stop offset="0.45" stop-color="#c8952e"/>
      <stop offset="1" stop-color="#8c6318"/>
    </linearGradient>
    <radialGradient id="head" cx="0.38" cy="0.32" r="0.78">
      <stop offset="0" stop-color="#fbf3e3"/>
      <stop offset="0.62" stop-color="#eddcbf"/>
      <stop offset="1" stop-color="#cdb695"/>
    </radialGradient>
    <linearGradient id="felt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9c3838"/>
      <stop offset="1" stop-color="#66201f"/>
    </linearGradient>
  </defs>

  <!-- rounded plaque -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#wood)"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="#3a220f" stroke-width="10"/>
  <rect x="40" y="40" width="432" height="432" rx="84" fill="none" stroke="#a97440" stroke-width="4" opacity="0.55"/>

  <!-- drum shell -->
  <circle cx="256" cy="262" r="168" fill="url(#felt)"/>
  <circle cx="256" cy="256" r="162" fill="url(#head)"/>
  <circle cx="256" cy="256" r="162" fill="none" stroke="url(#brass)" stroke-width="16"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#c9b189" stroke-width="3" opacity="0.7"/>

  <!-- tension lugs -->
  <g fill="url(#brass)">
    <circle cx="256" cy="88"  r="15"/><circle cx="374" cy="138" r="15"/>
    <circle cx="424" cy="256" r="15"/><circle cx="374" cy="374" r="15"/>
    <circle cx="256" cy="424" r="15"/><circle cx="138" cy="374" r="15"/>
    <circle cx="88"  cy="256" r="15"/><circle cx="138" cy="138" r="15"/>
  </g>

  <!-- the judge's eyes: two warm lamps on the drum head -->
  <g>
    <ellipse cx="204" cy="228" rx="30" ry="32" fill="#3a220f"/>
    <ellipse cx="308" cy="228" rx="30" ry="32" fill="#3a220f"/>
    <ellipse cx="204" cy="224" rx="18" ry="20" fill="#f6b93b"/>
    <ellipse cx="308" cy="224" rx="18" ry="20" fill="#f6b93b"/>
    <ellipse cx="198" cy="217" rx="6" ry="7" fill="#fff3d0"/>
    <ellipse cx="302" cy="217" rx="6" ry="7" fill="#fff3d0"/>
  </g>

  <!-- gavel struck across the head -->
  <g transform="rotate(-32 256 322)">
    <rect x="150" y="308" width="212" height="30" rx="15" fill="url(#brass)"/>
    <rect x="150" y="308" width="212" height="30" rx="15" fill="none" stroke="#6d4a10" stroke-width="4"/>
    <rect x="228" y="286" width="58" height="74" rx="14" fill="url(#wood)" stroke="#33200e" stroke-width="5"/>
  </g>

  <!-- two stylised drumstick pistols, crossed below -->
  <g stroke="#33200e" stroke-width="5" stroke-linejoin="round">
    <g transform="rotate(28 168 404)">
      <rect x="120" y="392" width="96" height="20" rx="9" fill="url(#brass)"/>
      <rect x="132" y="406" width="26" height="34" rx="9" fill="url(#wood)"/>
      <circle cx="176" cy="402" r="15" fill="#e7d3ac"/>
    </g>
    <g transform="rotate(-28 344 404)">
      <rect x="296" y="392" width="96" height="20" rx="9" fill="url(#brass)"/>
      <rect x="354" y="406" width="26" height="34" rx="9" fill="url(#wood)"/>
      <circle cx="336" cy="402" r="15" fill="#e7d3ac"/>
    </g>
  </g>
</svg>
