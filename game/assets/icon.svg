<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2440"/>
      <stop offset="55%" stop-color="#101726"/>
      <stop offset="100%" stop-color="#0a0e18"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7d868f"/>
      <stop offset="35%" stop-color="#d5dbe2"/>
      <stop offset="65%" stop-color="#9aa3ad"/>
      <stop offset="100%" stop-color="#6b737c"/>
    </linearGradient>
    <linearGradient id="bent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b939c"/>
      <stop offset="50%" stop-color="#e6ebf1"/>
      <stop offset="100%" stop-color="#7f878f"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6d8"/>
      <stop offset="60%" stop-color="#ffe9a8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffe08a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#sky)"/>

    <!-- moon glow behind the bars -->
    <circle cx="352" cy="150" r="118" fill="url(#moon)"/>
    <circle cx="352" cy="150" r="52" fill="#fdf3cf" opacity="0.92"/>

    <!-- searchlight beam -->
    <path d="M 92 -20 L 300 -20 L 470 512 L 210 512 Z" fill="#ffe9a8" opacity="0.06"/>

    <!-- distant wall -->
    <rect x="0" y="330" width="512" height="182" fill="#0d1220"/>
    <rect x="0" y="330" width="512" height="10" fill="#232c40"/>

    <!-- cell bars: two bent open in the middle -->
    <g>
      <rect x="46"  y="52" width="30" height="408" rx="14" fill="url(#bar)"/>
      <rect x="120" y="52" width="30" height="408" rx="14" fill="url(#bar)"/>
      <path d="M 214 52 q 8 120 -52 190 q -60 70 -46 218 l 30 0 q -12 -136 44 -198 q 56 -62 54 -210 z"
            fill="url(#bent)"/>
      <path d="M 298 52 q -8 120 52 190 q 60 70 46 218 l -30 0 q 12 -136 -44 -198 q -56 -62 -54 -210 z"
            fill="url(#bent)"/>
      <rect x="362" y="52" width="30" height="408" rx="14" fill="url(#bar)"/>
      <rect x="436" y="52" width="30" height="408" rx="14" fill="url(#bar)"/>
      <!-- cross rails -->
      <rect x="30" y="86"  width="452" height="20" rx="9" fill="#8f979f"/>
      <rect x="30" y="410" width="452" height="20" rx="9" fill="#8f979f"/>
    </g>

    <!-- escapee squeezing through the gap -->
    <g transform="translate(0,-34)">
      <ellipse cx="256" cy="452" rx="62" ry="14" fill="#000" opacity="0.45"/>
      <!-- legs -->
      <path d="M 236 392 l -20 62" stroke="#e8963a" stroke-width="21" stroke-linecap="round" fill="none"/>
      <path d="M 276 392 l 24 58" stroke="#e8963a" stroke-width="21" stroke-linecap="round" fill="none"/>
      <!-- body -->
      <rect x="216" y="292" width="82" height="112" rx="34" fill="#f0912c"/>
      <rect x="216" y="318" width="82" height="13" fill="#ffe2bd"/>
      <rect x="216" y="352" width="82" height="13" fill="#ffe2bd"/>
      <!-- arms reaching out -->
      <path d="M 222 320 l -54 -30" stroke="#f0912c" stroke-width="22" stroke-linecap="round" fill="none"/>
      <path d="M 292 320 l 56 -26" stroke="#f0912c" stroke-width="22" stroke-linecap="round" fill="none"/>
      <!-- head -->
      <circle cx="257" cy="262" r="42" fill="#ffcf9e"/>
      <path d="M 215 252 a 42 42 0 0 1 84 0 z" fill="#2b3550"/>
    </g>
  </g>

  <rect x="4" y="4" width="504" height="504" rx="110" ry="110"
        fill="none" stroke="#000" stroke-opacity="0.55" stroke-width="8"/>
</svg>
