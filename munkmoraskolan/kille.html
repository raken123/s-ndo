<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=800, height=480, initial-scale=1.0">
<title>NFC-nyckel – Kille</title>
<style>
  /* Skärmen är gjord för 800 × 480 (samma som Arduino GIGA Display). */
  :root {
    --bg: #07111f;
    --panel: #0e1c30;
    --panel-2: #132842;
    --ink: #e8f1ff;
    --muted: #8aa3c2;
    --accent: #38bdf8;
    --accent-2: #2563eb;
    --ok: #22c55e;
    --danger: #ef4444;
    --border: #1f3a5c;
  }
  body[data-tema="tjej"] {
    --bg: #1a0a1c;
    --panel: #2a1030;
    --panel-2: #3a1642;
    --ink: #fdeefe;
    --muted: #d3a6d8;
    --accent: #f472b6;
    --accent-2: #a855f7;
    --border: #5a2466;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none;
  }
  #skarm {
    width: 800px; height: 480px; flex: none;
    background: var(--bg);
    display: grid; grid-template-rows: 56px 1fr;
    transform-origin: center;
    position: relative; overflow: hidden;
  }

  /* ---------- Topp ---------- */
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 0 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .logga {
    width: 34px; height: 34px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center; font-size: 18px;
  }
  .titel b { display: block; font-size: 16px; letter-spacing: .3px; }
  .titel span { font-size: 12px; color: var(--muted); }
  .platser { margin-left: auto; display: flex; gap: 6px; }
  .platser button {
    font: inherit; font-size: 13px; font-weight: 600;
    color: var(--muted); background: transparent;
    border: 1px solid var(--border); border-radius: 999px;
    padding: 8px 12px; cursor: pointer;
  }
  .platser button.vald {
    color: #fff; border-color: transparent;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
  }

  /* ---------- Huvuddel ---------- */
  main { display: grid; grid-template-columns: 410px 1fr; min-height: 0; }

  .skanner {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; padding: 12px;
  }
  .ram {
    position: relative; width: 240px; height: 280px;
    border-radius: 18px; overflow: hidden;
    background: radial-gradient(ellipse at center, var(--panel-2), var(--bg) 75%);
  }
  .kort { position: absolute; inset: 0; margin: auto; width: 150px; color: var(--muted); opacity: .7; }
  .skannar .kort, .ok .kort, .nej .kort { opacity: 1; }
  .ok .kort { color: var(--ok); }
  .nej .kort { color: var(--danger); }
  .horn { position: absolute; width: 36px; height: 36px; border: 4px solid var(--accent); }
  .horn.a { top: 8px; left: 8px; border-right: 0; border-bottom: 0; border-radius: 12px 0 0 0; }
  .horn.b { top: 8px; right: 8px; border-left: 0; border-bottom: 0; border-radius: 0 12px 0 0; }
  .horn.c { bottom: 8px; left: 8px; border-right: 0; border-top: 0; border-radius: 0 0 0 12px; }
  .horn.d { bottom: 8px; right: 8px; border-left: 0; border-top: 0; border-radius: 0 0 12px 0; }
  .vag {
    position: absolute; inset: 0; margin: auto; width: 190px; height: 190px;
    border: 2px dashed var(--accent); border-radius: 50%; opacity: .5;
  }
  .linje {
    position: absolute; left: 0; right: 0; height: 3px; top: 0;
    background: var(--accent); box-shadow: 0 0 18px 4px var(--accent);
    display: none;
  }
  .skannar .linje { display: block; animation: svep 1.1s ease-in-out infinite alternate; }
  .skannar .vag { animation: puls .6s ease-in-out infinite alternate; }
  @keyframes svep { from { top: 6%; } to { top: 94%; } }
  @keyframes puls { from { opacity: .3; } to { opacity: 1; } }

  .ok .horn { border-color: var(--ok); }
  .ok .vag { border-color: var(--ok); border-style: solid; opacity: 1; }
  .nej .horn { border-color: var(--danger); }
  .nej .vag { border-color: var(--danger); border-style: solid; opacity: 1; }

  .stapel { width: 240px; height: 6px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
  .stapel i { display: block; height: 100%; width: 0; background: var(--accent); }
  .skannar .stapel i { animation: fyll var(--skanntid) linear forwards; }
  @keyframes fyll { to { width: 100%; } }

  .status { text-align: center; min-height: 58px; }
  .status b { display: block; font-size: 22px; }
  .status span { font-size: 14px; color: var(--muted); }
  .ok .status b { color: var(--ok); }
  .nej .status b { color: var(--danger); }

  /* ---------- Panel med namn ---------- */
  .panel {
    margin: 10px 10px 10px 0; padding: 10px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    display: flex; flex-direction: column; gap: 8px; min-height: 0;
  }
  .panel-topp { display: flex; align-items: center; gap: 8px; }
  .panel-topp p { font-size: 13px; color: var(--muted); }
  .panel-topp p { margin-right: auto; }
  .panel-topp button {
    flex: none; font: inherit; font-size: 12px; font-weight: 600;
    color: var(--ink); background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  .namn {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
    overflow-y: auto; min-height: 0;
  }
  .namn div {
    font-size: 12px; font-weight: 600; color: var(--muted);
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 9px;
    height: 44px; padding: 0 4px; display: flex; align-items: center; justify-content: center; gap: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: .5;
  }
  .namn div.nyckel { color: var(--ink); border-color: var(--ok); opacity: 1; }
  .namn div.nyckel::after { content: " ✓"; color: var(--ok); }
  .namn div.senast { box-shadow: 0 0 0 2px var(--accent); }
  .tips { font-size: 11px; color: var(--muted); margin-top: auto; }
  .tips code { color: var(--ink); }
  .panel-topp button.aktiv {
    color: #fff; border-color: transparent;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
  }

  /* Stor färgblink när dörren öppnas / nekas */
  .blink { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
  .ok .blink { background: var(--ok); animation: blink .7s ease-out; }
  .nej .blink { background: var(--danger); animation: blink .7s ease-out; }
  @keyframes blink { from { opacity: .35; } to { opacity: 0; } }
</style>
</head>
<body data-tema="kille">
<div id="skarm">
  <header>
    <div class="logga" id="logga">🙂</div>
    <div class="titel">
      <b>Munkmoraskolan · NFC-nyckel</b>
      <span id="undertitel">Kille-skanner</span>
    </div>
    <nav class="platser" id="platser"></nav>
  </header>

  <main>
    <section class="skanner" id="skanner">
      <div class="ram" id="ram">
        <svg class="kort" viewBox="0 0 120 84" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round">
          <rect x="4" y="4" width="112" height="76" rx="10"/>
          <path d="M52 30a14 14 0 0 1 0 24M62 22a26 26 0 0 1 0 40M72 14a38 38 0 0 1 0 56"/>
          <circle cx="42" cy="42" r="4" fill="currentColor" stroke="none"/>
        </svg>
        <div class="vag"></div>
        <div class="horn a"></div><div class="horn b"></div>
        <div class="horn c"></div><div class="horn d"></div>
        <div class="linje"></div>
      </div>
      <div class="stapel"><i></i></div>
      <div class="status" id="status"></div>
    </section>

    <aside class="panel" id="panel">
      <div class="panel-topp">
        <p id="paneltext"></p>
        <button id="nfcknapp" type="button" hidden>📶 Starta NFC</button>
        <button id="serieknapp" type="button" hidden>🔌 Arduino</button>
      </div>
      <div class="namn" id="namn"></div>
      <p class="tips">Testa utan kort: skriv <code>isperson[Raken]</code> och tryck Enter</p>
    </aside>
  </main>
  <div class="blink"></div>
</div>

<script>
  /* ================= INSTÄLLNINGAR – ändra här ================= */

  // "kille" eller "tjej" – styr färger och rubrik.
  const TEMA = "kille";

  // Klassen, i samma ordning som på klassfotot
  // (bakre raden vänster→höger, mitten, sen främre raden).
  const KLASSEN = [
    { namn: "Mattias", roll: "Lärare" },
    { namn: "Ellis" }, { namn: "Sandra" }, { namn: "Felicia" }, { namn: "Loke" },
    { namn: "Adrian" }, { namn: "Benjamin" }, { namn: "Osariemen" },
    { namn: "Matheus" }, { namn: "Malak" }, { namn: "Zindra" }, { namn: "Wille" },
    { namn: "Iason" }, { namn: "Eskil" }, { namn: "Junior" },
    { namn: "Janet", roll: "Lärare" },
    { namn: "Rut" }, { namn: "Raken" }, { namn: "Celine" }, { namn: "Emily" },
    { namn: "Keyla" }, { namn: "Ossian" }, { namn: "Edith" },
  ];

  // Vilka som hör till den här skärmen. Skriv in namnen, t.ex. ["Raken", "Loke"].
  // Tom lista = alla i KLASSEN räknas med.
  const GRUPP = [];

  // Platserna som skärmen kan låsa upp.
  //   vem: "grupp"   → alla i GRUPP (plus lärarna)
  //   vem: [namn...] → bara de namnen
  const PLATSER = [
    { id: "klassrum", namn: "Klassrum 4", ikon: "🏫", vem: "grupp" },
    { id: "klubben",  namn: "Klubben",    ikon: "⭐", vem: "grupp" },
    { id: "lada",     namn: "Rakens låda", ikon: "🔐", vem: ["Raken"] },
  ];

  // Det som står på NFC-kortet: isperson[Raken]
  const KORT_MONSTER = /^isperson\[(.+)\]$/i;

  const LASTID_MS = 700;      // hur länge "Läser kortet…" visas
  const VISA_SVAR_MS = 4000;  // hur länge svaret visas innan skärmen återställs

  /* ============================================================== */

  const TEXT = {
    kille: { rubrik: "Kille-skanner", ikon: "🧢" },
    tjej:  { rubrik: "Tjej-skanner",  ikon: "🎀" },
  }[TEMA];

  document.body.dataset.tema = TEMA;
  document.title = "NFC-nyckel – " + TEXT.rubrik;
  document.getElementById("undertitel").textContent = TEXT.rubrik;
  document.getElementById("logga").textContent = TEXT.ikon;

  const skarm = document.getElementById("skarm");
  const skanner = document.getElementById("skanner");
  const statusEl = document.getElementById("status");
  const namnEl = document.getElementById("namn");
  const platserEl = document.getElementById("platser");
  const panelText = document.getElementById("paneltext");
  const nfcknapp = document.getElementById("nfcknapp");
  const serieknapp = document.getElementById("serieknapp");

  let plats = PLATSER[0];
  let upptagen = false;
  let aterstall = null;

  const vanta = ms => new Promise(r => setTimeout(r, ms));

  /* ---------- Behörighet ---------- */
  function arLarare(namn) {
    return KLASSEN.some(p => p.namn === namn && p.roll === "Lärare");
  }

  function harBehorighet(namn, p) {
    if (!namn) return false;
    if (Array.isArray(p.vem)) return p.vem.includes(namn);
    if (arLarare(namn)) return true;
    const grupp = GRUPP.length ? GRUPP : KLASSEN.map(x => x.namn);
    return grupp.includes(namn);
  }

  // "isperson[Raken]" → { namn: "Raken" }
  function tolkaKort(text) {
    const m = String(text).trim().match(KORT_MONSTER);
    if (!m) return { fel: "ogiltigt" };
    const skrivet = m[1].trim();
    const person = KLASSEN.find(p => p.namn.toLowerCase() === skrivet.toLowerCase());
    return person ? { namn: person.namn } : { fel: "okant", skrivet };
  }

  /* ---------- Visning ---------- */
  function visaStatus(rubrik, text) {
    statusEl.innerHTML = "";
    const b = document.createElement("b");
    const s = document.createElement("span");
    b.textContent = rubrik;
    s.textContent = text;
    statusEl.append(b, s);
  }

  function startaSkannVisning(ms) {
    clearTimeout(aterstall);
    skanner.style.setProperty("--skanntid", ms + "ms");
    skanner.classList.remove("ok", "nej");
    void skanner.offsetWidth;  // starta om animationerna
    skanner.classList.add("skannar");
  }

  function visaSvar(resultat, rubrik, text) {
    skanner.classList.remove("skannar");
    visaStatus(rubrik, text);
    skanner.classList.add(resultat);
    skarm.classList.remove("ok", "nej");
    void skarm.offsetWidth;
    skarm.classList.add(resultat);
    aterstall = setTimeout(vila, VISA_SVAR_MS);
  }

  function uppdateraNamn(senast) {
    panelText.textContent = "Nyckel till " + plats.namn;
    namnEl.querySelectorAll("div").forEach(d => {
      d.classList.toggle("nyckel", harBehorighet(d.dataset.namn, plats));
      d.classList.toggle("senast", d.dataset.namn === senast);
    });
  }

  function vila() {
    clearTimeout(aterstall);
    skanner.classList.remove("skannar", "ok", "nej");
    skarm.classList.remove("ok", "nej");
    upptagen = false;
    visaStatus("Håll kortet mot läsaren", plats.ikon + " " + plats.namn + " är låst");
    uppdateraNamn();
  }

  /* ---------- Ett kort har lästs ---------- */
  async function kortLast(text) {
    if (upptagen) return;
    upptagen = true;
    startaSkannVisning(LASTID_MS);
    visaStatus("Läser kortet…", "Håll kvar kortet");
    await vanta(LASTID_MS);

    const kort = tolkaKort(text);
    if (kort.fel === "ogiltigt") {
      visaSvar("nej", "Ogiltigt kort", "🔒 Kortet är ingen nyckel");
    } else if (kort.fel === "okant") {
      visaSvar("nej", "Okänt namn", "🔒 " + kort.skrivet + " finns inte i klassen");
    } else if (harBehorighet(kort.namn, plats)) {
      visaSvar("ok", "Välkommen, " + kort.namn + "!", "🔓 " + plats.namn + " är upplåst");
    } else {
      visaSvar("nej", "Hej " + kort.namn + "!", "🔒 Du har inte nyckel till " + plats.namn);
    }
    uppdateraNamn(kort.namn);
  }

  /* ---------- Sätt 1: NFC i telefonen/surfplattan (Chrome på Android) ---------- */
  async function startaNfc() {
    try {
      const lasare = new NDEFReader();
      await lasare.scan();
      lasare.onreading = e => {
        for (const post of e.message.records) {
          if (post.recordType !== "text") continue;
          kortLast(new TextDecoder(post.encoding || "utf-8").decode(post.data));
          return;
        }
        kortLast("");
      };
      lasare.onreadingerror = () => {
        if (!upptagen) { upptagen = true; visaSvar("nej", "Kunde inte läsa kortet", "Försök igen"); }
      };
      nfcknapp.hidden = false;
      nfcknapp.textContent = "📶 NFC på";
      nfcknapp.classList.add("aktiv");
      nfcknapp.disabled = true;
    } catch (e) {
      // Första gången måste man ofta trycka på en knapp för att få starta NFC.
      nfcknapp.hidden = false;
    }
  }
  if ("NDEFReader" in window) {
    nfcknapp.onclick = startaNfc;
    startaNfc();
  }

  /* ---------- Sätt 2: USB-läsare som "skriver" kortet som ett tangentbord ---------- */
  let tangenter = "";
  let senasteTangent = 0;
  addEventListener("keydown", e => {
    if (e.key === "Enter") {
      if (tangenter) kortLast(tangenter);
      tangenter = "";
    } else if (e.key.length === 1) {
      if (Date.now() - senasteTangent > 3000) tangenter = "";
      tangenter += e.key;
      senasteTangent = Date.now();
    }
  });

  /* ---------- Sätt 3: Arduino med NFC-läsare via USB-kabel (Chrome/Edge) ---------- */
  if ("serial" in navigator) {
    serieknapp.hidden = false;
    serieknapp.onclick = async () => {
      try {
        const port = await navigator.serial.requestPort();
        await port.open({ baudRate: 115200 });
        serieknapp.textContent = "🔌 Ansluten";
        serieknapp.classList.add("aktiv");
        serieknapp.disabled = true;
        const lasare = port.readable.pipeThrough(new TextDecoderStream()).getReader();
        let buffert = "";
        for (;;) {
          const { value, done } = await lasare.read();
          if (done) break;
          buffert += value;
          let i;
          while ((i = buffert.indexOf("\n")) >= 0) {
            const rad = buffert.slice(0, i).trim();
            buffert = buffert.slice(i + 1);
            if (rad) kortLast(rad);
          }
        }
      } catch (e) {
        console.error(e);
        serieknapp.textContent = "🔌 Arduino";
        serieknapp.classList.remove("aktiv");
        serieknapp.disabled = false;
      }
    };
  }

  /* ---------- Knappar och namn ---------- */
  PLATSER.forEach(p => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = p.ikon + " " + p.namn;
    b.onclick = () => {
      if (upptagen) return;
      plats = p;
      b.blur();  // så att Enter från kortläsaren inte trycker på knappen
      platserEl.querySelectorAll("button").forEach(x => x.classList.toggle("vald", x === b));
      vila();
    };
    if (p === plats) b.classList.add("vald");
    platserEl.append(b);
  });

  KLASSEN.forEach(p => {
    const d = document.createElement("div");
    d.textContent = p.namn;
    d.dataset.namn = p.namn;
    d.title = p.roll || "Elev";
    namnEl.append(d);
  });

  // Skala skärmen så den fyller fönstret men behåller 800 × 480
  function skala() {
    const s = Math.min(innerWidth / 800, innerHeight / 480);
    skarm.style.transform = "scale(" + s + ")";
  }
  addEventListener("resize", skala);
  skala();
  vila();
</script>
</body>
</html>
