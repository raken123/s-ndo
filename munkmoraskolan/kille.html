<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=800, height=480, initial-scale=1.0">
<title>Ansiktsnyckel – Kille</title>
<style>
  /* Skärmen är gjord för 800 × 480 (samma som Arduino GIGA Display). */
  :root {
    --bg: #07111f;
    --panel: #0e1c30;
    --panel-2: #132842;
    --ink: #e8f1ff;
    --muted: #8aa3c2;
    --accent: #38bdf8;
    --accent-2: #2563eb;
    --ok: #22c55e;
    --danger: #ef4444;
    --border: #1f3a5c;
  }
  body[data-tema="tjej"] {
    --bg: #1a0a1c;
    --panel: #2a1030;
    --panel-2: #3a1642;
    --ink: #fdeefe;
    --muted: #d3a6d8;
    --accent: #f472b6;
    --accent-2: #a855f7;
    --border: #5a2466;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none;
  }
  #skarm {
    width: 800px; height: 480px; flex: none;
    background: var(--bg);
    display: grid; grid-template-rows: 56px 1fr;
    transform-origin: center;
    position: relative; overflow: hidden;
  }

  /* ---------- Topp ---------- */
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 0 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .logga {
    width: 34px; height: 34px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center; font-size: 18px;
  }
  .titel b { display: block; font-size: 16px; letter-spacing: .3px; }
  .titel span { font-size: 12px; color: var(--muted); }
  .platser { margin-left: auto; display: flex; gap: 6px; }
  .platser button {
    font: inherit; font-size: 13px; font-weight: 600;
    color: var(--muted); background: transparent;
    border: 1px solid var(--border); border-radius: 999px;
    padding: 8px 12px; cursor: pointer;
  }
  .platser button.vald {
    color: #fff; border-color: transparent;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
  }

  /* ---------- Huvuddel ---------- */
  main { display: grid; grid-template-columns: 410px 1fr; min-height: 0; }

  .skanner {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; padding: 12px;
  }
  .ram {
    position: relative; width: 240px; height: 280px;
    border-radius: 18px; overflow: hidden;
    background: radial-gradient(ellipse at center, var(--panel-2), var(--bg) 75%);
  }
  .ram video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; transform: scaleX(-1); display: none;
  }
  .ram.kamera video { display: block; }
  .ram.kamera .siluett { display: none; }
  .siluett { position: absolute; inset: 0; margin: auto; width: 150px; opacity: .55; }
  .horn { position: absolute; width: 36px; height: 36px; border: 4px solid var(--accent); }
  .horn.a { top: 8px; left: 8px; border-right: 0; border-bottom: 0; border-radius: 12px 0 0 0; }
  .horn.b { top: 8px; right: 8px; border-left: 0; border-bottom: 0; border-radius: 0 12px 0 0; }
  .horn.c { bottom: 8px; left: 8px; border-right: 0; border-top: 0; border-radius: 0 0 0 12px; }
  .horn.d { bottom: 8px; right: 8px; border-left: 0; border-top: 0; border-radius: 0 0 12px 0; }
  .oval {
    position: absolute; inset: 0; margin: auto; width: 170px; height: 220px;
    border: 2px dashed var(--accent); border-radius: 50%; opacity: .5;
  }
  .linje {
    position: absolute; left: 0; right: 0; height: 3px; top: 0;
    background: var(--accent); box-shadow: 0 0 18px 4px var(--accent);
    display: none;
  }
  .skannar .linje { display: block; animation: svep 1.1s ease-in-out infinite alternate; }
  .skannar .oval { animation: puls .6s ease-in-out infinite alternate; }
  @keyframes svep { from { top: 6%; } to { top: 94%; } }
  @keyframes puls { from { opacity: .3; } to { opacity: 1; } }

  .ok .horn { border-color: var(--ok); }
  .ok .oval { border-color: var(--ok); border-style: solid; opacity: 1; }
  .nej .horn { border-color: var(--danger); }
  .nej .oval { border-color: var(--danger); border-style: solid; opacity: 1; }

  .stapel { width: 240px; height: 6px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
  .stapel i { display: block; height: 100%; width: 0; background: var(--accent); }
  .skannar .stapel i { animation: fyll var(--skanntid) linear forwards; }
  @keyframes fyll { to { width: 100%; } }

  .status { text-align: center; min-height: 58px; }
  .status b { display: block; font-size: 22px; }
  .status span { font-size: 14px; color: var(--muted); }
  .ok .status b { color: var(--ok); }
  .nej .status b { color: var(--danger); }

  /* ---------- Panel med namn ---------- */
  .panel {
    margin: 10px 10px 10px 0; padding: 10px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    display: flex; flex-direction: column; gap: 8px; min-height: 0;
  }
  .panel-topp { display: flex; align-items: center; gap: 8px; }
  .panel-topp p { font-size: 13px; color: var(--muted); }
  .panel-topp p { margin-right: auto; }
  .panel-topp button {
    flex: none; font: inherit; font-size: 12px; font-weight: 600;
    color: var(--ink); background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  .namn {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
    overflow-y: auto; min-height: 0;
  }
  .namn button {
    font: inherit; font-size: 12px; font-weight: 600; color: var(--ink);
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 9px;
    height: 44px; padding: 0 4px; cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .namn button:active { transform: scale(.96); }
  .namn button.okand { color: var(--danger); }
  .namn button:disabled { opacity: .4; cursor: default; }
  .namn button.last { cursor: default; }
  .namn button.last:active { transform: none; }
  .namn button.sparad { border-color: var(--ok); }
  .namn button.sparad::after { content: " ✓"; color: var(--ok); }
  .panel.lagg-till { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .panel-topp button.aktiv {
    color: #fff; border-color: transparent;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
  }

  /* Stor färgblink när dörren öppnas / nekas */
  .blink { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
  .ok .blink { background: var(--ok); animation: blink .7s ease-out; }
  .nej .blink { background: var(--danger); animation: blink .7s ease-out; }
  @keyframes blink { from { opacity: .35; } to { opacity: 0; } }
</style>
</head>
<body data-tema="kille">
<div id="skarm">
  <header>
    <div class="logga" id="logga">🙂</div>
    <div class="titel">
      <b>Munkmoraskolan · Ansiktsnyckel</b>
      <span id="undertitel">Kille-skanner</span>
    </div>
    <nav class="platser" id="platser"></nav>
  </header>

  <main>
    <section class="skanner" id="skanner">
      <div class="ram" id="ram">
        <video id="video" autoplay playsinline muted></video>
        <svg class="siluett" viewBox="0 0 100 120" fill="currentColor" style="color:var(--muted)">
          <circle cx="50" cy="38" r="24"/>
          <path d="M8 120c0-26 19-42 42-42s42 16 42 42z"/>
        </svg>
        <div class="oval"></div>
        <div class="horn a"></div><div class="horn b"></div>
        <div class="horn c"></div><div class="horn d"></div>
        <div class="linje"></div>
      </div>
      <div class="stapel"><i></i></div>
      <div class="status" id="status"></div>
    </section>

    <aside class="panel" id="panel">
      <div class="panel-topp">
        <p id="paneltext"></p>
        <button id="bortknapp" type="button" hidden>🗑 Ta bort</button>
        <button id="lagerknapp" type="button" hidden>➕ Lägg till ansikte</button>
      </div>
      <div class="namn" id="namn"></div>
    </aside>
  </main>
  <div class="blink"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7/dist/face-api.js"></script>
<script>
  /* ================= INSTÄLLNINGAR – ändra här ================= */

  // "kille" eller "tjej" – styr färger och rubrik.
  const TEMA = "kille";

  // Klassen, i samma ordning som på klassfotot
  // (bakre raden vänster→höger, mitten, sen främre raden).
  const KLASSEN = [
    { namn: "Mattias", roll: "Lärare" },
    { namn: "Ellis" }, { namn: "Sandra" }, { namn: "Felicia" }, { namn: "Loke" },
    { namn: "Adrian" }, { namn: "Benjamin" }, { namn: "Osariemen" },
    { namn: "Matheus" }, { namn: "Malak" }, { namn: "Zindra" }, { namn: "Wille" },
    { namn: "Iason" }, { namn: "Eskil" }, { namn: "Junior" },
    { namn: "Janet", roll: "Lärare" },
    { namn: "Rut" }, { namn: "Raken" }, { namn: "Celine" }, { namn: "Emily" },
    { namn: "Keyla" }, { namn: "Ossian" }, { namn: "Edith" },
  ];

  // Vilka som hör till den här skärmen. Skriv in namnen, t.ex. ["Raken", "Loke"].
  // Tom lista = alla i KLASSEN räknas med.
  const GRUPP = [];

  // Platserna som skärmen kan låsa upp.
  //   vem: "grupp"   → alla i GRUPP (plus lärarna)
  //   vem: [namn...] → bara de namnen
  const PLATSER = [
    { id: "klassrum", namn: "Klassrum 4", ikon: "🏫", vem: "grupp" },
    { id: "klubben",  namn: "Klubben",    ikon: "⭐", vem: "grupp" },
    { id: "lada",     namn: "Rakens låda", ikon: "🔐", vem: ["Raken"] },
  ];

  // Kod som behövs för att lägga till eller ta bort ansikten. "" = ingen kod.
  // Sätt en kod, annars kan vem som helst spara sitt ansikte som "Raken".
  const PIN = "";

  // Hur lika två ansikten måste vara för att räknas som samma person.
  // Lägre = strängare (färre fel, men missar oftare). 0.45–0.55 brukar funka bra.
  const TROSKEL = 0.5;

  const BILDER_PER_PERSON = 5;  // hur många bilder som tas när ett ansikte läggs till
  const SKANNTID_MS = 1200;     // hur länge skärmen tittar innan den bestämmer sig
  const VISA_SVAR_MS = 4000;    // hur länge svaret visas innan skärmen återställs

  // Varifrån AI-modellerna hämtas (behöver internet när sidan startar).
  const MODELL_URL = "https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7/model/";

  /* ============================================================== */

  const TEXT = {
    kille: { rubrik: "Kille-skanner", ikon: "🧢" },
    tjej:  { rubrik: "Tjej-skanner",  ikon: "🎀" },
  }[TEMA];

  document.body.dataset.tema = TEMA;
  document.title = "Ansiktsnyckel – " + TEXT.rubrik;
  document.getElementById("undertitel").textContent = TEXT.rubrik;
  document.getElementById("logga").textContent = TEXT.ikon;

  const skarm = document.getElementById("skarm");
  const skanner = document.getElementById("skanner");
  const ram = document.getElementById("ram");
  const video = document.getElementById("video");
  const statusEl = document.getElementById("status");
  const namnEl = document.getElementById("namn");
  const platserEl = document.getElementById("platser");
  const panel = document.getElementById("panel");
  const panelText = document.getElementById("paneltext");
  const lagerknapp = document.getElementById("lagerknapp");
  const bortknapp = document.getElementById("bortknapp");

  // "startar" → "skanna" (kameran igång) eller "demo" (ingen kamera/internet).
  // "lagg-till" = man sparar nya ansikten.
  let lage = "startar";
  let taBortLage = false;
  let plats = PLATSER[0];
  let upptagen = false;
  let aterstall = null;

  /* ---------- Sparade ansikten ----------
     Inga bilder sparas. Varje ansikte blir en lista med 128 tal,
     och de ligger bara i den här webbläsaren (localStorage). */
  const LAGRING = "munkmora-ansiktsnyckel";
  let ansikten = {};
  try { ansikten = JSON.parse(localStorage.getItem(LAGRING)) || {}; } catch (e) {}
  function sparaAnsikten() {
    try { localStorage.setItem(LAGRING, JSON.stringify(ansikten)); } catch (e) {}
  }

  function avstand(a, b) {
    let s = 0;
    for (let i = 0; i < a.length; i++) s += (a[i] - b[i]) ** 2;
    return Math.sqrt(s);
  }

  // Vem liknar ansiktet mest? null om ingen är tillräckligt lik.
  function kannIgen(beskrivning, utom) {
    let bast = null, bastAvst = Infinity;
    for (const [namn, lista] of Object.entries(ansikten)) {
      if (namn === utom) continue;
      for (const d of lista) {
        const a = avstand(beskrivning, d);
        if (a < bastAvst) { bastAvst = a; bast = namn; }
      }
    }
    return bastAvst < TROSKEL ? bast : null;
  }

  async function hittaAnsikte() {
    if (video.readyState < 2) return null;
    const svar = await faceapi
      .detectSingleFace(video, new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.5 }))
      .withFaceLandmarks()
      .withFaceDescriptor();
    return svar ? svar.descriptor : null;
  }

  const vanta = ms => new Promise(r => setTimeout(r, ms));

  /* ---------- Behörighet ---------- */
  function arLarare(namn) {
    return KLASSEN.some(p => p.namn === namn && p.roll === "Lärare");
  }

  function harBehorighet(namn, p) {
    if (!namn) return false;
    if (Array.isArray(p.vem)) return p.vem.includes(namn);
    if (arLarare(namn)) return true;
    const grupp = GRUPP.length ? GRUPP : KLASSEN.map(x => x.namn);
    return grupp.includes(namn);
  }

  /* ---------- Visning ---------- */
  function visaStatus(rubrik, text) {
    statusEl.innerHTML = "";
    const b = document.createElement("b");
    const s = document.createElement("span");
    b.textContent = rubrik;
    s.textContent = text;
    statusEl.append(b, s);
  }

  function startaSkannVisning(ms) {
    clearTimeout(aterstall);
    skanner.style.setProperty("--skanntid", ms + "ms");
    skanner.classList.remove("ok", "nej");
    void skanner.offsetWidth;  // starta om animationerna
    skanner.classList.add("skannar");
  }

  function visaSvar(resultat, rubrik, text) {
    skanner.classList.remove("skannar");
    visaStatus(rubrik, text);
    skanner.classList.add(resultat);
    skarm.classList.remove("ok", "nej");
    void skarm.offsetWidth;
    skarm.classList.add(resultat);
    aterstall = setTimeout(vila, VISA_SVAR_MS);
  }

  function visaLasSvar(namn) {
    if (!namn) {
      visaSvar("nej", "Okänt ansikte", "🔒 Åtkomst nekad");
    } else if (harBehorighet(namn, plats)) {
      visaSvar("ok", "Välkommen, " + namn + "!", "🔓 " + plats.namn + " är upplåst");
    } else {
      visaSvar("nej", "Hej " + namn + "!", "🔒 Du har inte nyckel till " + plats.namn);
    }
  }

  function uppdateraPanel() {
    panel.classList.toggle("lagg-till", lage === "lagg-till");
    lagerknapp.hidden = lage === "demo" || lage === "startar";
    lagerknapp.textContent = lage === "lagg-till" ? "✔ Klar" : "➕ Lägg till ansikte";
    lagerknapp.classList.toggle("aktiv", lage === "lagg-till");
    bortknapp.hidden = lage !== "lagg-till";
    bortknapp.classList.toggle("aktiv", taBortLage);

    const antal = Object.keys(ansikten).length;
    panelText.textContent = {
      startar: "Startar kameran…",
      demo: "Demo: vem står framför kameran?",
      skanna: antal + " av " + KLASSEN.length + " har sparat sitt ansikte",
      "lagg-till": taBortLage ? "Tryck på namnet som ska tas bort" : "Tryck på namnet på den som står i kameran",
    }[lage];

    namnEl.querySelectorAll("button").forEach(b => {
      const namn = b.dataset.namn;
      b.classList.toggle("sparad", !!namn && !!ansikten[namn]);
      b.classList.toggle("last", lage === "skanna" || lage === "startar");
      b.disabled = upptagen;
      if (!namn) b.hidden = lage !== "demo";
    });
  }

  function vila() {
    clearTimeout(aterstall);
    skanner.classList.remove("skannar", "ok", "nej");
    skarm.classList.remove("ok", "nej");
    upptagen = false;
    if (lage === "lagg-till") {
      visaStatus(taBortLage ? "Ta bort ansikte" : "Lägg till ansikte",
                 taBortLage ? "Välj namn i listan" : "Stå i ramen och tryck på ditt namn");
    } else if (lage === "demo") {
      visaStatus("Demoläge", plats.ikon + " " + plats.namn + " är låst");
    } else if (lage === "skanna") {
      visaStatus("Titta in i kameran", plats.ikon + " " + plats.namn + " är låst");
    }
    uppdateraPanel();
  }

  /* ---------- Riktig skanning ---------- */
  async function skannaPerson(forsta) {
    upptagen = true;
    uppdateraPanel();
    startaSkannVisning(SKANNTID_MS);
    visaStatus("Skannar ansikte…", "Stå still en sekund");

    if (!Object.keys(ansikten).length) {
      await vanta(SKANNTID_MS);
      visaSvar("nej", "Inga ansikten sparade", "Tryck på ➕ Lägg till ansikte");
      return;
    }

    // Titta flera gånger och låt majoriteten bestämma, så en enstaka felbild inte öppnar.
    const gissningar = [kannIgen(forsta)];
    const slut = Date.now() + SKANNTID_MS;
    while (Date.now() < slut) {
      const d = await hittaAnsikte();
      if (d) gissningar.push(kannIgen(d));
      await vanta(100);
    }
    const rakna = {};
    gissningar.forEach(n => rakna[n] = (rakna[n] || 0) + 1);
    const [vem, antal] = Object.entries(rakna).sort((a, b) => b[1] - a[1])[0];
    const namn = vem !== "null" && antal > gissningar.length / 2 ? vem : null;
    visaLasSvar(namn);
  }

  async function slinga() {
    if (lage === "skanna" && !upptagen) {
      try {
        const d = await hittaAnsikte();
        if (d && lage === "skanna" && !upptagen) await skannaPerson(d);
      } catch (e) { console.error(e); }
    }
    setTimeout(slinga, 300);
  }

  /* ---------- Lägga till / ta bort ansikten ---------- */
  async function laggTill(namn) {
    if (ansikten[namn] && !confirm(namn + " har redan ett sparat ansikte. Ta nya bilder?")) return;
    upptagen = true;
    uppdateraPanel();
    startaSkannVisning(BILDER_PER_PERSON * 600);
    visaStatus("Titta in i kameran, " + namn, "Bild 0 av " + BILDER_PER_PERSON);

    const nya = [];
    const slut = Date.now() + 10000;
    while (nya.length < BILDER_PER_PERSON && Date.now() < slut) {
      const d = await hittaAnsikte();
      if (d) {
        nya.push(Array.from(d));
        visaStatus("Titta in i kameran, " + namn, "Bild " + nya.length + " av " + BILDER_PER_PERSON + " – vrid huvudet lite");
        await vanta(400);
      } else {
        await vanta(150);
      }
    }

    if (nya.length < BILDER_PER_PERSON) {
      visaSvar("nej", "Hittade inget ansikte", "Stå närmare kameran och försök igen");
      return;
    }
    const liknar = kannIgen(nya[0], namn);
    if (liknar) {
      visaSvar("nej", "Inte sparat", "Ansiktet liknar redan " + liknar);
      return;
    }
    ansikten[namn] = nya;
    sparaAnsikten();
    visaSvar("ok", "Sparat!", "Nu känner jag igen " + namn);
  }

  function taBort(namn) {
    if (!ansikten[namn]) {
      visaSvar("nej", namn, "Har inget sparat ansikte");
      return;
    }
    if (!confirm("Ta bort " + namn + "s ansikte?")) return;
    delete ansikten[namn];
    sparaAnsikten();
    visaSvar("ok", "Borttaget", namn + "s ansikte är raderat");
  }

  /* ---------- Demo utan kamera ---------- */
  async function demoSkanna(namn) {
    upptagen = true;
    uppdateraPanel();
    startaSkannVisning(SKANNTID_MS);
    visaStatus("Skannar ansikte…", "Stå still en sekund");
    await vanta(SKANNTID_MS);
    visaLasSvar(namn);
  }

  /* ---------- Knappar ---------- */
  PLATSER.forEach(p => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = p.ikon + " " + p.namn;
    b.onclick = () => {
      if (upptagen) return;
      plats = p;
      platserEl.querySelectorAll("button").forEach(x => x.classList.toggle("vald", x === b));
      vila();
    };
    if (p === plats) b.classList.add("vald");
    platserEl.append(b);
  });

  function namnKlick(namn) {
    if (upptagen) return;
    if (lage === "demo") demoSkanna(namn);
    else if (lage === "lagg-till" && namn) taBortLage ? taBort(namn) : laggTill(namn);
  }

  KLASSEN.forEach(p => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = p.namn;
    b.dataset.namn = p.namn;
    b.title = p.roll || "Elev";
    b.onclick = () => namnKlick(p.namn);
    namnEl.append(b);
  });
  const okand = document.createElement("button");
  okand.type = "button";
  okand.className = "okand";
  okand.textContent = "❓ Okänd";
  okand.onclick = () => namnKlick(null);
  namnEl.append(okand);

  lagerknapp.onclick = () => {
    if (upptagen) return;
    if (lage === "lagg-till") {
      lage = "skanna";
    } else {
      if (PIN && prompt("Skriv koden för att ändra ansikten") !== PIN) return;
      lage = "lagg-till";
    }
    taBortLage = false;
    vila();
  };
  bortknapp.onclick = () => {
    if (upptagen) return;
    taBortLage = !taBortLage;
    vila();
  };

  /* ---------- Start ---------- */
  async function starta() {
    uppdateraPanel();
    visaStatus("Startar…", "Laddar ansiktsigenkänning");
    try {
      if (!window.faceapi) throw new Error("Kunde inte hämta face-api (inget internet?)");
      video.srcObject = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user", width: 640, height: 480 },
      });
      ram.classList.add("kamera");
      await Promise.all([
        faceapi.nets.tinyFaceDetector.loadFromUri(MODELL_URL),
        faceapi.nets.faceLandmark68Net.loadFromUri(MODELL_URL),
        faceapi.nets.faceRecognitionNet.loadFromUri(MODELL_URL),
      ]);
      lage = "skanna";
      vila();
      slinga();
    } catch (e) {
      console.error(e);
      lage = "demo";
      vila();
      visaStatus("Demoläge", "Ingen kamera eller inget internet – tryck på ett namn");
    }
  }

  // Skala skärmen så den fyller fönstret men behåller 800 × 480
  function skala() {
    const s = Math.min(innerWidth / 800, innerHeight / 480);
    skarm.style.transform = "scale(" + s + ")";
  }
  addEventListener("resize", skala);
  skala();
  starta();
</script>
</body>
</html>
