<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b12">
<title>Panter-appen</title>
<style>
  :root {
    --bg: #0b0b12;
    --panel: #151522;
    --panel-2: #1d1d2e;
    --ink: #f1f0f7;
    --muted: #9a98ad;
    --gold: #f5b83d;
    --purple: #7c3aed;
    --purple-soft: #2a1d4d;
    --ok: #22c55e;
    --bad: #ef4444;
    --warn: #f97316;
    --border: #2a2a3d;
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); color: var(--ink); }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 16px; line-height: 1.45;
    min-height: 100vh;
    padding-bottom: 84px;
    transition: filter .6s;
  }
  /* Ju sämre pantern mår, desto gråare blir appen. */
  body.life-low { filter: saturate(.55); }
  body.life-critical { filter: saturate(.2) brightness(.9); }
  body.no-nav { padding-bottom: 24px; }

  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 26px; line-height: 1.15; }
  h2 { font-size: 19px; margin: 22px 0 10px; }
  h3 { font-size: 16px; }
  p { margin: 6px 0; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .gold { color: var(--gold); }

  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px; margin: 12px 0;
  }
  .card.coach { background: linear-gradient(135deg, #1e1535, #151522); border-color: #3b2a66; }
  .card.penalty { border-color: #6b2323; background: linear-gradient(135deg, #2a1414, #151522); }

  button, .btn {
    font: inherit; border: 0; cursor: pointer; border-radius: 12px;
    padding: 13px 16px; font-weight: 600; width: 100%;
    background: var(--gold); color: #1b1203;
  }
  button:disabled { opacity: .45; cursor: default; }
  .btn-ghost { background: var(--panel-2); color: var(--ink); border: 1px solid var(--border); }
  .btn-danger { background: transparent; color: #fca5a5; border: 1px solid #7f1d1d; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }

  input[type=text], textarea {
    width: 100%; font: inherit; color: var(--ink); background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 12px; padding: 12px;
  }
  textarea { min-height: 110px; resize: vertical; }
  input:focus, textarea:focus { outline: 2px solid var(--purple); border-color: transparent; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    width: auto; padding: 9px 13px; border-radius: 999px; font-weight: 500;
    background: var(--panel-2); color: var(--ink); border: 1px solid var(--border);
  }
  .chip.on { background: var(--purple-soft); border-color: var(--purple); }

  /* Status */
  .hero { display: flex; gap: 14px; align-items: center; }
  .panther { width: 96px; height: 96px; flex: none; }
  .meter { height: 10px; background: var(--panel-2); border-radius: 99px; overflow: hidden; margin-top: 6px; }
  .meter > div { height: 100%; border-radius: 99px; transition: width .6s; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .stat { background: var(--panel-2); border-radius: 12px; padding: 10px; text-align: center; }
  .stat b { display: block; font-size: 20px; }
  .stat span { font-size: 12px; color: var(--muted); }

  /* Uppdrag */
  .mission { display: flex; gap: 12px; align-items: center; cursor: pointer; }
  .mission .ico {
    width: 44px; height: 44px; flex: none; border-radius: 12px; display: grid; place-items: center;
    background: var(--panel-2); font-size: 22px;
  }
  .mission .body { flex: 1; min-width: 0; }
  .mission .meta { font-size: 12px; color: var(--muted); }
  .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; }
  .badge.done { background: #123d24; color: #86efac; }
  .badge.failed { background: #3d1212; color: #fca5a5; }
  .badge.open { background: var(--purple-soft); color: #c4b5fd; }
  .tier { color: var(--gold); letter-spacing: 1px; }
  .mission.is-done { opacity: .6; }

  ul.tips { padding-left: 20px; margin: 6px 0; }
  ul.tips li { margin: 4px 0; }
  .safety { font-size: 13px; color: #a7f3d0; background: #0f2a20; border: 1px solid #14532d; border-radius: 12px; padding: 10px 12px; margin: 12px 0; }

  .timer { text-align: center; padding: 8px 0; }
  .timer .t { font-size: 44px; font-weight: 700; font-variant-numeric: tabular-nums; }

  /* Chatt */
  .chat { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
  .msg { max-width: 86%; padding: 10px 13px; border-radius: 14px; white-space: pre-wrap; }
  .msg.bot { background: var(--panel); border: 1px solid #3b2a66; align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.me { background: var(--purple); align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg a { color: var(--gold); }
  .chat-input { position: sticky; bottom: 84px; background: var(--bg); padding: 8px 0; display: flex; gap: 8px; }
  .chat-input input { flex: 1; }
  .chat-input button { width: auto; }
  .suggest { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .suggest .chip { white-space: nowrap; flex: none; }

  /* Navigering */
  nav {
    position: fixed; left: 0; right: 0; bottom: 0; background: #10101a; border-top: 1px solid var(--border);
    display: flex; justify-content: space-around; padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
  }
  nav a {
    color: var(--muted); text-decoration: none; font-size: 11px; display: flex; flex-direction: column;
    align-items: center; gap: 2px; padding: 4px 10px; border-radius: 10px;
  }
  nav a .i { font-size: 21px; }
  nav a.on { color: var(--gold); }

  .toast {
    position: fixed; left: 50%; bottom: 160px; transform: translateX(-50%) translateY(20px);
    background: var(--panel-2); border: 1px solid var(--border); padding: 12px 16px; border-radius: 12px;
    opacity: 0; transition: .3s; pointer-events: none; max-width: 90%; text-align: center; z-index: 10;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .bars { display: flex; flex-direction: column; gap: 8px; }
  .bar-row { display: grid; grid-template-columns: 120px 1fr 44px; gap: 8px; align-items: center; font-size: 14px; }
  .hist-item { border-top: 1px solid var(--border); padding: 10px 0; }
  .hist-item:first-child { border-top: 0; }
  .center { text-align: center; }
  .spacer { height: 10px; }
  a.link { color: var(--gold); }
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav" hidden>
  <a href="#/idag" data-r="idag"><span class="i">🐾</span>Idag</a>
  <a href="#/coach" data-r="coach"><span class="i">💬</span>Coach</a>
  <a href="#/framsteg" data-r="framsteg"><span class="i">📈</span>Framsteg</a>
  <a href="#/installningar" data-r="installningar"><span class="i">⚙️</span>Inställningar</a>
</nav>
<div class="toast" id="toast"></div>

   Allt körs lokalt på telefonen; inget skickas någonstans.

  default: 'Det här uppdraget är helt ofarligt. Känns något fel i stunden får du alltid avbryta – din säkerhet går före alla poäng.',

// tier: 1 = utmanande, 2 = svårt, 3 = riktigt svårt
const MISSIONS = [
  // Kropp

  { id: 'k2', cat: 'kropp', tier: 1, title: 'Promenad utan mobil', timer: 30,

  { id: 'k3', cat: 'kropp', tier: 2, title: '100 knäböj',
    desc: 'Gör 100 knäböj under dagen, uppdelat i så många set du behöver.',

    tips: ['T.ex. 10 set à 10 spridda över dagen.', 'Håll ryggen rak och hälarna i golvet.'] },
  { id: 'k4', cat: 'kropp', tier: 2, title: '10 000 steg',

  { id: 'k5', cat: 'kropp', tier: 2, title: 'Bara trappor',

  { id: 'k6', cat: 'kropp', tier: 3, title: 'Armhävningsstegen',

  { id: 'k7', cat: 'kropp', tier: 3, title: '45 minuter i rörelse', timer: 45,

  // Sinne
  { id: 's1', cat: 'sinne', tier: 1, title: 'Fem tysta minuter',

  { id: 'm5', cat: 'mod', tier: 3, title: 'Säg vad du tycker',

  { id: 'm6', cat: 'mod', tier: 3, title: 'Det obekväma samtalet',

// Straffuppdrag: tråkiga men helt ofarliga. De dyker upp när du ger upp eller missar.
const PENALTIES = [
  { id: 'p1', title: 'Köket skinande', desc: 'Diska allt, torka av bänkarna och plocka undan i köket.' },
  { id: 'p2', title: 'Tillbaka på banan', desc: 'Gå en 20 minuters promenad utan mobil och tänk igenom varför det blev som det blev.' },
  { id: 'p3', title: 'Mobilen i skamvrån', desc: 'Lägg mobilen i ett annat rum i 2 timmar i sträck.' },
  { id: 'p4', title: 'Ärlig analys', desc: 'Skriv minst 100 ord: varför gjordes inte uppdraget, och vad gör du annorlunda imorgon?' },
  { id: 'p5', title: '20 minuters städning', desc: 'Städa ditt rum eller ett gemensamt utrymme i 20 minuter.' },
  { id: 'p6', title: 'Kroppskontroll', desc: 'Gör 30 knäböj och 20 situps (i den takt du klarar).' },
  { id: 'p7', title: 'Läsbot', desc: 'Läs 15 sidor i en bok innan du får öppna något socialt medium.' },
  { id: 'p8', title: 'Tidig kväll', desc: 'Lägg dig 30 minuter tidigare än vanligt ikväll, utan skärm i sängen.' },
];

const RANKS = [
  { xp: 0,    name: 'Kattunge' },
  { xp: 150,  name: 'Ungpanter' },
  { xp: 400,  name: 'Jägare' },
  { xp: 800,  name: 'Skuggpanter' },
  { xp: 1500, name: 'Alfapanter' },
  { xp: 3000, name: 'Legendarisk panter' },
];

const XP_BY_TIER = { 1: 30, 2: 50, 3: 80 };
const RULES = {
  missionsPerDay: 3,
  lifeStart: 70,
  doneLife: 6,         // + livskraft per klarat uppdrag
  giveUpLife: 8,       // - livskraft när du ger upp
  missLife: 12,        // - livskraft per missat uppdrag vid midnatt
  penaltyDailyLife: 4, // - livskraft per dag för varje olöst straffuppdrag
  penaltyDoneLife: 3,
  penaltyXp: 10,
  collapseXpLoss: 0.2, // andel XP som försvinner när livskraften når 0
  streakNeed: 2,       // klara minst så här många uppdrag för att dagen ska räknas
  minReflection: 20,
};

const KEY = 'panter-appen-v1';
let S = null;

/* ---------- hjälpfunktioner ---------- */

function todayStr(d = new Date()) {
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function addDays(ds, n) {
  const [y, m, d] = ds.split('-').map(Number);
  return todayStr(new Date(y, m - 1, d + n));
}
function daysBetween(a, b) {
  const [ay, am, ad] = a.split('-').map(Number);
  const [by, bm, bd] = b.split('-').map(Number);
  return Math.round((Date.UTC(by, bm - 1, bd) - Date.UTC(ay, am - 1, ad)) / 86400000);
}
function hash(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function pick(arr, r = Math.random) { return arr[Math.floor(r() * arr.length)]; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
const byId = id => MISSIONS.find(m => m.id === id);
const penById = id => PENALTIES.find(p => p.id === id);

function rankFor(xp) {
  let i = 0;
  for (let k = 0; k < RANKS.length; k++) if (xp >= RANKS[k].xp) i = k;
  return { ...RANKS[i], index: i, next: RANKS[i + 1] || null };
}
function mood(life) {
  if (life >= 80) return { key: 'wild', label: 'Vild & stark', color: 'var(--ok)' };
  if (life >= 50) return { key: 'ok', label: 'Stabil', color: 'var(--gold)' };
  if (life >= 25) return { key: 'tired', label: 'Trött', color: 'var(--warn)' };
  return { key: 'hurt', label: 'Sårad', color: 'var(--bad)' };
}

/* ---------- lagring ---------- */

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* ingen lagring tillgänglig */ }
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* trasig data – börja om */ }
  return null;
}
function freshState(name, focus, maxTier) {
  return {
    v: 1, name, focus, maxTier,
    seed: Math.floor(Math.random() * 1e9),
    created: todayStr(),
    xp: 0, life: RULES.lifeStart, streak: 0, bestStreak: 0,
    collapses: 0,
    day: null,            // { date, missions: [{ id, status, reflection }], rerolled }
    penalties: [],        // [{ uid, id, date, status }]
    history: [],          // [{ date, id, status, reflection }]
    cat: {},              // { kropp: { done, failed } }
    chat: [],
    timers: {},           // { missionId: startedAtMs }
    log: [],              // händelser som visas för användaren
  };
}

/* ---------- coach-motorn ---------- */

// Hur det har gått senaste tiden (0..1). Styr svårighetsgraden.
function recentSuccess(n = 9) {
  const recent = S.history.slice(-n);
  if (recent.length < 3) return 0.6;
  return recent.filter(h => h.status === 'done').length / recent.length;
}
function targetTier() {
  const rate = recentSuccess();
  const rank = rankFor(S.xp).index;
  let t = 1 + (rank >= 1 ? 0.5 : 0) + (rank >= 3 ? 0.5 : 0);
  if (rate > 0.8) t += 0.7;
  if (rate < 0.4) t -= 0.7;
  if (S.life < 30) t -= 0.5; // pantern är sårad – bygg upp igen
  return clamp(t, 1, S.maxTier);
}
function catWeight(cat) {
  const st = S.cat[cat] || { done: 0, failed: 0 };
  let w = S.focus.includes(cat) ? 3 : 1;
  // Kategorier du ofta ger upp i får lite extra vikt – coachen vill att du växer där.
  if (st.failed > st.done && st.failed >= 2) w += 1.5;
  return w;
}
function generateDay(date, extraSalt = '') {
  const r = rng(hash(S.seed + ':' + date + extraSalt));
  const want = targetTier();
  const recentIds = new Set(S.history.slice(-12).map(h => h.id));
  const chosen = [];
  const usedCats = new Set();
  let guard = 0;
  while (chosen.length < RULES.missionsPerDay && guard++ < 500) {
    const pool = MISSIONS.filter(m =>
      m.tier <= S.maxTier && !chosen.includes(m) && !usedCats.has(m.cat) &&
      (guard > 200 || !recentIds.has(m.id)));
    if (!pool.length) { usedCats.clear(); continue; }
    // Vikta på kategori och hur nära önskad svårighet uppdraget ligger.
    const weights = pool.map(m => catWeight(m.cat) / (1 + 1.5 * Math.abs(m.tier - want)));
    const total = weights.reduce((a, b) => a + b, 0);
    let x = r() * total, m = pool[pool.length - 1];
    for (let i = 0; i < pool.length; i++) { x -= weights[i]; if (x <= 0) { m = pool[i]; break; } }
    chosen.push(m);
    usedCats.add(m.cat);
  }
  return chosen.map(m => ({ id: m.id, status: 'open', reflection: '' }));
}

function addLog(text, kind = 'info') {
  S.log.push({ t: Date.now(), text, kind });
  if (S.log.length > 40) S.log = S.log.slice(-40);
}
function addPenalty(date, reasonTitle) {
  const r = rng(hash(S.seed + ':pen:' + date + ':' + S.penalties.length));
  const open = new Set(S.penalties.filter(p => p.status === 'open').map(p => p.id));
  const pool = PENALTIES.filter(p => !open.has(p.id));
  const p = pick(pool.length ? pool : PENALTIES, r);
  S.penalties.push({ uid: Date.now() + '-' + S.penalties.length, id: p.id, date, status: 'open', reason: reasonTitle });
  return p;
}
function changeLife(delta) {
  S.life = clamp(S.life + delta, 0, 100);
  if (S.life === 0) collapse();
}
function collapse() {
  const lost = Math.round(S.xp * RULES.collapseXpLoss);
  S.xp -= lost;
  S.life = 30;
  S.streak = 0;
  S.collapses++;
  addLog(`Pantern kollapsade. Du tappade ${lost} XP och din streak. Livskraften återställs till 30 – nu bygger vi upp igen.`, 'bad');
}
function markCat(cat, status) {
  S.cat[cat] = S.cat[cat] || { done: 0, failed: 0 };
  S.cat[cat][status === 'done' ? 'done' : 'failed']++;
}

// Stänger gamla dagar och delar ut konsekvenser. Körs vid start och när appen återupptas.
function rollover() {
  const today = todayStr();
  if (!S.day) {
    S.day = { date: today, missions: generateDay(today), rerolled: false };
    save();
    return;
  }
  if (S.day.date === today) return;

  // Straffuppdrag som redan låg olösta när dygnet skiftade (inte de som skapas nu).
  const carriedPen = S.penalties.filter(p => p.status === 'open' && p.date < today).length;

  // 1) Avsluta den senaste dagen.
  const d = S.day;
  const done = d.missions.filter(m => m.status === 'done').length;
  let missed = 0;
  for (const m of d.missions) {
    if (m.status === 'open') {
      m.status = 'failed';
      missed++;
      const mis = byId(m.id);
      S.history.push({ date: d.date, id: m.id, status: 'missed', reflection: '' });
      markCat(mis.cat, 'failed');
      changeLife(-RULES.missLife);
      const p = addPenalty(d.date, mis.title);
      addLog(`Du missade "${mis.title}". −${RULES.missLife} livskraft och ett straffuppdrag: ${p.title}.`, 'bad');
    }
  }
  if (done >= RULES.streakNeed) {
    S.streak++;
    S.bestStreak = Math.max(S.bestStreak, S.streak);
  } else {
    if (S.streak > 0) addLog(`Din streak på ${S.streak} dagar bröts.`, 'bad');
    S.streak = 0;
  }

  // 2) Hela dagar då appen inte ens öppnades räknas som missade.
  const gap = daysBetween(d.date, today) - 1;
  if (gap > 0) {
    const n = Math.min(gap, 7);
    const loss = n * RULES.missLife;
    changeLife(-loss);
    if (S.streak > 0) addLog(`Din streak på ${S.streak} dagar bröts.`, 'bad');
    S.streak = 0;
    addLog(`Du var borta i ${gap} ${gap === 1 ? 'dag' : 'dagar'}. Pantern tappade ${loss} livskraft.`, 'bad');
    addPenalty(addDays(today, -1), 'Frånvaro');
  }

  // 3) Olösta straffuppdrag tär på pantern varje dag.
  if (carriedPen > 0) {
    changeLife(-RULES.penaltyDailyLife * carriedPen);
    addLog(`${carriedPen} olösta straffuppdrag kostade ${RULES.penaltyDailyLife * carriedPen} livskraft.`, 'bad');
  }

  if (missed === 0 && done === d.missions.length) addLog('Alla uppdrag klara igår. Pantern är stolt över dig. 🐆', 'good');

  S.day = { date: today, missions: generateDay(today), rerolled: false };
  S.timers = {};
  save();
}

function completeMission(id, reflection) {
  const m = S.day.missions.find(x => x.id === id);
  if (!m || m.status !== 'open') return;
  const mis = byId(id);
  m.status = 'done';
  m.reflection = reflection;
  const xp = XP_BY_TIER[mis.tier] + (S.streak >= 3 ? 10 : 0);
  const beforeRank = rankFor(S.xp).index;
  S.xp += xp;
  changeLife(RULES.doneLife);
  markCat(mis.cat, 'done');
  S.history.push({ date: S.day.date, id, status: 'done', reflection });
  delete S.timers[id];
  const afterRank = rankFor(S.xp);
  const msg = coachFeedback(mis, reflection, xp);
  pushBot(msg);
  if (afterRank.index > beforeRank) {
    addLog(`Ny rang: ${afterRank.name}! 🎉`, 'good');
    pushBot(`Du är nu ${afterRank.name}. Jag har märkt skillnaden, ${S.name}. Uppdragen kommer bli tuffare härifrån.`);
  }
  save();
  return xp;
}
function giveUpMission(id) {
  const m = S.day.missions.find(x => x.id === id);
  if (!m || m.status !== 'open') return;
  const mis = byId(id);
  m.status = 'failed';
  S.history.push({ date: S.day.date, id, status: 'gaveup', reflection: '' });
  markCat(mis.cat, 'failed');
  changeLife(-RULES.giveUpLife);
  const p = addPenalty(S.day.date, mis.title);
  delete S.timers[id];
  addLog(`Du gav upp "${mis.title}". −${RULES.giveUpLife} livskraft och straffuppdraget "${p.title}".`, 'bad');
  pushBot(pick([
    `Okej. Att ge upp ärligt är bättre än att ljuga för mig. Men det kostar: gör "${p.title}" så är vi kvitt.`,
    `Pantern blev lite svagare nu. Du får straffuppdraget "${p.title}". Imorgon är en ny jakt.`,
    `Jag noterar det. Fundera på vad som stoppade dig – och gör "${p.title}" innan dagen är slut.`,
  ]));
  save();
}
function completePenalty(uid) {
  const p = S.penalties.find(x => x.uid === uid);
  if (!p || p.status !== 'open') return;
  p.status = 'done';
  S.xp += RULES.penaltyXp;
  changeLife(RULES.penaltyDoneLife);
  addLog(`Straffuppdraget "${penById(p.id).title}" avklarat. Skulden är betald.`, 'good');
  save();
}
function rerollDay() {
  if (S.day.rerolled) return false;
  const kept = S.day.missions.filter(m => m.status !== 'open');
  const fresh = generateDay(S.day.date, ':reroll')
    .filter(m => !S.day.missions.some(x => x.id === m.id));
  const need = RULES.missionsPerDay - kept.length;
  S.day.missions = kept.concat(fresh.slice(0, need));
  // Om slumpen gav för få nya: fyll på med vad som helst som inte redan finns.
  for (const mis of MISSIONS) {
    if (S.day.missions.length >= RULES.missionsPerDay) break;
    if (mis.tier <= S.maxTier && !S.day.missions.some(x => x.id === mis.id)) {
      S.day.missions.push({ id: mis.id, status: 'open', reflection: '' });
    }
  }
  S.day.rerolled = true;
  S.timers = {};
  save();
  return true;
}

/* ---------- coachens röst ---------- */

function greeting() {
  const h = new Date().getHours();
  if (h < 5) return 'Mitt i natten';
  if (h < 10) return 'God morgon';
  if (h < 17) return 'Hej';
  if (h < 22) return 'God kväll';
  return 'Sent ute';
}
function dailyBriefing() {
  const mo = mood(S.life);
  const open = S.day.missions.filter(m => m.status === 'open').length;
  const done = S.day.missions.filter(m => m.status === 'done').length;
  const pen = S.penalties.filter(p => p.status === 'open').length;
  const r = rng(hash(S.seed + S.day.date + 'brief'));
  const parts = [`${greeting()}, ${S.name}.`];

  if (pen > 0) parts.push(`Du har ${pen} olöst${pen > 1 ? 'a' : ''} straffuppdrag. Varje natt det ligger kvar tappar pantern ${RULES.penaltyDailyLife} livskraft.`);

  if (done === S.day.missions.length) {
    parts.push(pick(['Alla dagens uppdrag är klara. Det här är vad förändring ser ut som.', 'Full pott idag. Vila med gott samvete.'], r));
  } else if (mo.key === 'hurt') {
    parts.push(pick(['Pantern är sårad. Det du gör idag avgör om den reser sig.', 'Det har gått tungt. Men ett enda klarat uppdrag vänder trenden.'], r));
  } else if (mo.key === 'tired') {
    parts.push(pick(['Pantern är trött. Ge den ett skäl att tro på dig igen.', 'Vi tappar fart. Idag tar vi tillbaka den.'], r));
  } else if (S.streak >= 3) {
    parts.push(pick([`${S.streak} dagar i rad. Bryt inte kedjan nu.`, `Din streak är ${S.streak} dagar. Du ger nu +10 XP extra per uppdrag.`], r));
  } else {
    parts.push(pick(['Tre uppdrag väntar. Inget av dem är lätt – det är poängen.', 'Idag ska du göra något du helst skulle slippa. Sen blir du lite starkare.', 'Livet blir inte bättre av att läsa om det. Det blir bättre av att göra.'], r));
  }

  if (open > 0 && done === 0 && new Date().getHours() >= 18) {
    parts.push('Klockan tickar – uppdrag som inte är gjorda vid midnatt räknas som missade.');
  }
  return parts.join(' ');
}
function coachFeedback(mis, reflection, xp) {
  const r = Math.random;
  const words = reflection.trim().split(/\s+/).length;
  const low = reflection.toLowerCase();
  const out = [];
  if (/(svårt|jobbigt|tungt|läskigt|nervös|pinsamt|obekvämt|ville inte|orkade inte)/.test(low)) {
    out.push(pick(['Du skriver att det var jobbigt – och du gjorde det ändå. Det är exakt så mod ser ut.', 'Att det kändes tungt betyder att det räknades. Lätta saker förändrar ingen.'], r));
  } else if (/(bra|kul|skönt|glad|stolt|lätt|nöjd|härligt|roligt)/.test(low)) {
    out.push(pick(['Kom ihåg den känslan. Nästa gång det tar emot kan du plocka fram den.', 'Så ska det kännas. Du har bevisat för dig själv att du kan.'], r));
  } else {
    out.push(pick(['Snyggt jobbat.', 'Uppdrag slutfört.', 'Pantern såg det där.'], r));
  }
  if (words >= 40) out.push('Tack för en ärlig reflektion – det är i efterhand man lär sig mest.');
  const st = S.cat[mis.cat];
  if (st && st.done === 5) out.push(`Det är ditt 5:e ${CATS[mis.cat].name.toLowerCase()}-uppdrag. Det börjar bli en del av vem du är.`);
  out.push(`+${xp} XP · +${RULES.doneLife} livskraft.`);
  return out.join(' ');
}

const CRISIS = /(självmord|ta livet av mig|vill dö|vill inte leva|skada mig själv|skär mig|döda mig)/;

function coachReply(text) {
  const t = text.toLowerCase();
  const n = S.name;
  const r = Math.random;
  const weak = Object.entries(S.cat).sort((a, b) => (b[1].failed - b[1].done) - (a[1].failed - a[1].done))[0];

  if (CRISIS.test(t)) {
    return `${n}, det du skriver är viktigt och jag vill att du pratar med en människa om det nu. Det är inte ett uppdrag – det är det viktigaste du kan göra.\n\n` +
      '• Akut fara: ring <a href="tel:112">112</a>\n' +
      '• Mind Självmordslinjen: ring <a href="tel:90101">90101</a> (dygnet runt) eller chatta på mind.se\n' +
      '• Vårdguiden: ring <a href="tel:1177">1177</a>\n' +
      '• Under 18? BRIS: ring <a href="tel:116111">116 111</a>\n\n' +
      'Du behöver inte klara det här själv. Säg till någon du litar på idag.';
  }
  const rules = [
    [/(orkar inte|ingen motivation|omotiverad|lat|lathet|gitter inte|pallar inte)/, () => pick([
      'Motivation kommer EFTER att man börjar, inte före. Välj det minsta uppdraget idag och gör bara de första två minuterna. Det brukar räcka för att komma igång.',
      `Ärligt, ${n}: ingen känner sig motiverad jämt. Skillnaden är att vissa gör det ändå. Vilket av dagens uppdrag kan du göra på under 20 minuter?`,
      'Prova "5-sekundersregeln": räkna 5-4-3-2-1 och rör dig innan hjärnan hinner säga nej.'], r)],
    [/(sömn|sova|trött|somna|vaken på natten)/, () => pick([
      'Sömn slår allt. Tre saker: samma sovtid varje dag, ingen skärm sista timmen, och svalt mörkt rum. Välj en av dem ikväll.',
      'Är du trött hela tiden? Kolla koffein efter kl 14, skärmtid i sängen och om du rör dig tillräckligt dagtid. Kvarstår tröttheten länge – prata med vårdcentralen eller 1177.'], r)],
    [/(stress|stressad|ångest|orolig|oro|panik)/, () => pick([
      'När stressen tar över: andas in 4 sekunder, håll 4, ut 6. Gör det fem gånger. Skriv sedan ner allt som snurrar – och välj EN sak att göra först.',
      'Stress krymper när man delar upp. Vad är det minsta steg du kan ta på det som stressar dig? Gör bara det idag.\n\nOm oron är stark eller håller i sig länge är det klokt att prata med någon – en vuxen du litar på, skolkurator eller 1177.'], r)],
    [/(ensam|inga vänner|utanför|ingen bryr)/, () => pick([
      'Ensamhet är vanligare än man tror, och den bryts sällan av sig själv. Ett litet steg: skriv till en person idag och föreslå något konkret, som en promenad.',
      'Mod-uppdragen är gjorda för det här. Börja med att hälsa först på tre personer – kontakt byggs av små ögonblick.'], r)],
    [/(mål|målsättning|vision|vad ska jag göra med mitt liv|framtid)/, () =>
      'Ett bra mål är konkret och mätbart. Byt "komma i form" mot "gå 8 000 steg om dagen i en månad". Skriv ner ETT mål för de kommande 30 dagarna – och berätta för någon om det.'],
    [/(träna|träning|gym|springa|form|vikt)/, () =>
      'Den bästa träningen är den du faktiskt gör. Börja med 20 minuter rörelse varje dag hellre än två timmar en gång i veckan. Och lyssna alltid på kroppen – smärta är en stoppsignal.'],
    [/(plugga|skola|läxa|prov|studier|studera)/, () =>
      'Pluggtips: 25 minuter fokus, 5 minuter paus (Pomodoro). Mobilen i ett annat rum. Förhör dig själv istället för att läsa om – det är dubbelt så effektivt.'],
    [/(mobil|skärm|tiktok|instagram|youtube|scroll|sociala medier|spel)/, () =>
      'Mobilen är byggd för att hålla kvar dig. Tre trick: gråskala-läge, stäng av alla notiser utom samtal, och ladda den utanför sovrummet. Testa ett i en vecka.'],
    [/(pengar|ekonomi|spara|budget)/, () =>
      'Enkel start: spara en fast summa direkt när pengarna kommer in, innan du hinner spendera dem. Och gör Pengakoll-uppdraget – det ger ofta en aha-upplevelse.'],
    [/(farligt|säkert|säkerhet|risk)/, () =>
      'Alla uppdrag i Panter-appen är gjorda för att vara svåra men helt ofarliga. Om något ändå känns fel eller osäkert i stunden – avbryt. Säkerhet slår poäng, alltid.'],
    [/(straff|varför blir det sämre|livskraft|dör pantern|kollaps)/, () =>
      `Så funkar det: klarade uppdrag ger +${RULES.doneLife} livskraft. Ge upp: −${RULES.giveUpLife}. Missa vid midnatt: −${RULES.missLife}. Olösta straffuppdrag: −${RULES.penaltyDailyLife} per natt. Når livskraften 0 kollapsar pantern och du tappar ${Math.round(RULES.collapseXpLoss * 100)} % av din XP och din streak. Appen blir också gråare ju sämre pantern mår.`],
    [/(uppdrag|vad ska jag göra idag|tips|hjälp)/, () => {
      const open = S.day.missions.filter(m => m.status === 'open').map(m => byId(m.id));
      if (!open.length) return 'Du har klarat allt för idag! Vila, eller hjälp någon annan med deras mål.';
      const m = open.sort((a, b) => a.tier - b.tier)[0];
      return `Börja med "${m.title}". ${m.why} Tips: ${m.tips[0]}`;
    }],
    [/(hur går det|statistik|hur gör jag|hur ligger jag till)/, () => {
      const rk = rankFor(S.xp);
      const rate = Math.round(recentSuccess() * 100);
      let s = `Du är ${rk.name} med ${S.xp} XP. Livskraft ${S.life}/100, streak ${S.streak} dagar. Du har klarat ${rate} % av dina senaste uppdrag.`;
      if (weak && weak[1].failed > weak[1].done) s += ` Din svagaste kategori är ${CATS[weak[0]].name.toLowerCase()} – där växer du mest just nu.`;
      return s;
    }],
    [/(^|[^a-zåäö])(hej|tja|hallå|tjena|hejsan)/, () => pick([`Hej ${n}! Vad vill du prata om? Motivation, sömn, stress, mål – eller ett uppdrag?`, `Tjena ${n}. Pantern lyssnar.`], r)],
    [/(tack|tackar)/, () => pick(['Tacka dig själv. Det är du som gör jobbet.', 'Alltid. Nu – ut och jaga.'], r)],
  ];
  for (const [re, fn] of rules) if (re.test(t)) return fn();
  return pick([
    'Berätta mer. Vad är det som känns svårast just nu?',
    `Jag förstår, ${n}. Om du fick ändra EN sak i ditt liv den här veckan – vad skulle det vara?`,
    'Det bästa svaret på det är nog ett uppdrag. Vilket av dagens tre känns mest relevant?',
    'Fråga mig gärna om motivation, sömn, stress, mål, träning, plugg, mobilen eller pengar.',
  ], r);
}
function pushBot(html) {
  S.chat.push({ from: 'bot', html, t: Date.now() });
  if (S.chat.length > 120) S.chat = S.chat.slice(-120);
}

const $app = document.getElementById('app');
const $nav = document.getElementById('nav');

function tierStars(t) { return '★'.repeat(t) + '☆'.repeat(3 - t); }
function tierName(t) { return { 1: 'Utmanande', 2: 'Svårt', 3: 'Riktigt svårt' }[t]; }
function statusBadge(s) {
  if (s === 'done') return '<span class="badge done">Klart</span>';
  if (s === 'failed') return '<span class="badge failed">Misslyckat</span>';
  return '<span class="badge open">Pågår</span>';
}

function viewOnboard() {
  let focus = [];
  let maxTier = 3;
  let step = 0;
  let name = '';
  const draw = () => {
    if (step === 0) {
      $app.innerHTML = `
        <div class="center" style="margin-top:28px">${pantherSVG(90).replace('class="panther"', 'class="panther" style="width:140px;height:140px"')}</div>
        <h1 class="center" style="margin-top:12px">Panter-appen</h1>
        <p class="center muted">En coach som visar dig hur du blir bättre på ditt liv.</p>
        <div class="card">
          <p><b>Så funkar det</b></p>
          <ul class="tips">
            <li>Varje dag får du <b>3 uppdrag i verkligheten</b>. De är svåra – men alltid 0 % farliga.</li>
            <li>Klarar du dem blir pantern starkare och du går upp i rang.</li>
            <li>Ger du upp eller missar blir det <b>sämre</b>: pantern tappar livskraft, du får straffuppdrag, streaken bryts och appen blir grå.</li>
            <li>Allt sparas bara på din telefon.</li>
          </ul>
        </div>
        <button id="go">Jag är redo</button>`;
      document.getElementById('go').onclick = () => { step = 1; draw(); };
    } else if (step === 1) {
      $app.innerHTML = `
        <h1 style="margin-top:20px">Vad heter du?</h1>
        <p class="muted">Pantern vill veta vem den coachar.</p>
        <div class="spacer"></div>
        <input type="text" id="name" maxlength="24" placeholder="Ditt namn" value="${esc(name)}" autocomplete="off">
        <div class="spacer"></div>
        <button id="next" ${name.trim() ? '' : 'disabled'}>Nästa</button>`;
      const inp = document.getElementById('name');
      const btn = document.getElementById('next');
      inp.oninput = () => { name = inp.value; btn.disabled = !name.trim(); };
      inp.onkeydown = e => { if (e.key === 'Enter' && name.trim()) btn.click(); };
      btn.onclick = () => { step = 2; draw(); };
      inp.focus();
    } else if (step === 2) {
      $app.innerHTML = `
        <h1 style="margin-top:20px">Vad vill du bli bättre på?</h1>
        <p class="muted">Välj 1–3 områden. Coachen fokuserar på dem men ger dig ibland annat också.</p>
        <div class="spacer"></div>
        <div class="chips" id="cats">${Object.entries(CATS).map(([k, c]) =>
          `<button class="chip ${focus.includes(k) ? 'on' : ''}" data-k="${k}">${c.icon} ${c.name}</button>`).join('')}</div>
        <div class="spacer"></div><div class="spacer"></div>
        <button id="next" ${focus.length ? '' : 'disabled'}>Nästa</button>`;
      document.querySelectorAll('#cats .chip').forEach(b => b.onclick = () => {
        const k = b.dataset.k;
        if (focus.includes(k)) focus = focus.filter(x => x !== k);
        else if (focus.length < 3) focus.push(k);
        draw();
      });
      document.getElementById('next').onclick = () => { step = 3; draw(); };
    } else {
      const opts = [
        [1, 'Utmanande', 'Jag vill komma igång.'],
        [2, 'Svårt', 'Jag vill bli pushad.'],
        [3, 'Riktigt svårt', 'Ge mig allt. (Rekommenderas)'],
      ];
      $app.innerHTML = `
        <h1 style="margin-top:20px">Hur hårt ska pantern pusha dig?</h1>
        <p class="muted">Det här är taket. Coachen anpassar svårigheten efter hur det går för dig.</p>
        ${opts.map(([t, n, d]) => `
          <div class="card mission" data-t="${t}" style="${maxTier === t ? 'border-color:var(--purple)' : ''}">
            <div class="ico">${'🐾'.repeat(t)}</div>
            <div class="body"><h3>${n} <span class="tier">${tierStars(t)}</span></h3><div class="meta">${d}</div></div>
          </div>`).join('')}
        <button id="start">Starta jakten</button>`;
      document.querySelectorAll('.mission[data-t]').forEach(el => el.onclick = () => { maxTier = Number(el.dataset.t); draw(); });
      document.getElementById('start').onclick = () => {
        S = freshState(name.trim(), focus, maxTier);
        rollover();
        pushBot(`Välkommen, ${S.name}. Jag är din panter. Jag kommer ge dig uppdrag som är obekväma, men aldrig farliga. Gör dem – så blir vi båda starkare. Skippa dem – så märks det. Deal?`);
        save();
        location.replace('#/idag');
      };
    }
  };
  draw();
}

let timerInterval = null;
function viewMission(id) {
  const m = S.day.missions.find(x => x.id === id);
  const mis = byId(id);
  if (!m || !mis) { location.replace('#/idag'); return; }
  const safety = SAFETY[mis.cat] || SAFETY.default;
  const started = S.timers[id];

  $app.innerHTML = `
    <p><a class="link" href="#/idag">← Tillbaka</a></p>
    <div class="card">
      <div class="small muted">${CATS[mis.cat].icon} ${CATS[mis.cat].name} · <span class="tier">${tierStars(mis.tier)}</span> ${tierName(mis.tier)} · ${XP_BY_TIER[mis.tier]} XP</div>
      <h1 style="margin-top:6px">${esc(mis.title)}</h1>
      <p style="margin-top:10px">${esc(mis.desc)}</p>
    </div>
    <div class="card coach"><p>🐆 <b>Varför:</b> ${esc(mis.why)}</p></div>
    <div class="card">
      <h3>Tips från pantern</h3>
      <ul class="tips">${mis.tips.map(t => `<li>${esc(t)}</li>`).join('')}</ul>
    </div>
    <div class="safety">🛡️ ${esc(safety)}</div>

    ${m.status === 'open' ? `
      ${mis.timer ? `<div class="card timer">
        <div class="t" id="tval">${mis.timer}:00</div>
        <div class="small muted" id="tlabel">${started ? 'Timern går – du kan lämna appen.' : `${mis.timer} minuter`}</div>
        <div class="spacer"></div>
        <button class="btn-ghost" id="tbtn">${started ? 'Starta om timern' : 'Starta timer'}</button>
      </div>` : ''}
      <h2>Rapportera</h2>
      <p class="small muted">Beskriv vad du gjorde och hur det kändes (minst ${RULES.minReflection} tecken). Pantern kan inte se dig – den litar på din ärlighet.</p>
      <div class="spacer"></div>
      <textarea id="refl" placeholder="Jag gjorde … och det kändes …"></textarea>
      <div class="spacer"></div>
      <button id="done" disabled>✅ Uppdrag klart</button>
      <div class="spacer"></div>
      <button class="btn-danger" id="giveup">Ge upp (−${RULES.giveUpLife} livskraft + straffuppdrag)</button>
    ` : `
      <div class="card">
        <h3>${m.status === 'done' ? '✅ Klart' : '❌ Misslyckat'}</h3>
        ${m.reflection ? `<p class="muted" style="margin-top:6px">"${esc(m.reflection)}"</p>` : ''}
      </div>
    `}
  `;
  if (m.status !== 'open') return;

  const refl = document.getElementById('refl');
  const done = document.getElementById('done');
  const draftKey = 'draft:' + S.day.date + ':' + id;
  try { refl.value = sessionStorage.getItem(draftKey) || ''; } catch (e) { /* ignoreras */ }
  const check = () => { done.disabled = refl.value.trim().length < RULES.minReflection; };
  refl.oninput = () => {
    check();
    try { sessionStorage.setItem(draftKey, refl.value); } catch (e) { /* ignoreras */ }
  };
  check();
  done.onclick = () => {
    if (mis.timer && S.timers[id] && Date.now() - S.timers[id] < mis.timer * 60000 * 0.9) {
      if (!confirm('Timern är inte klar än. Har du verkligen gjort hela uppdraget?')) return;
    }
    const xp = completeMission(id, refl.value.trim());
    try { sessionStorage.removeItem(draftKey); } catch (e) { /* ignoreras */ }
    toast(`Uppdrag klart! +${xp} XP 🐆`);
    location.hash = '#/coach';
  };
  document.getElementById('giveup').onclick = () => {
    if (confirm('Säker? Pantern tappar livskraft och du får ett straffuppdrag.')) {
      giveUpMission(id);
      toast('Pantern blev svagare…');
      location.hash = '#/idag';
    }
  };

  if (mis.timer) {
    const tval = document.getElementById('tval');
    const tlabel = document.getElementById('tlabel');
    const tick = () => {
      const st = S.timers[id];
      if (!st) return;
      const left = Math.max(0, mis.timer * 60 - Math.floor((Date.now() - st) / 1000));
      tval.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
      if (left === 0) {
        tlabel.textContent = 'Tiden är ute! Skriv din rapport nedan.';
        clearInterval(timerInterval);
        if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
      }
    };
    document.getElementById('tbtn').onclick = () => {
      S.timers[id] = Date.now();
      save();
      tlabel.textContent = 'Timern går – du kan lämna appen.';
      document.getElementById('tbtn').textContent = 'Starta om timern';
      clearInterval(timerInterval);
      timerInterval = setInterval(tick, 1000);
      tick();
    };
    if (S.timers[id]) { timerInterval = setInterval(tick, 1000); tick(); }
  }
}

  $app.innerHTML = `
    <h1>Coachen</h1>
    <p class="muted small">Din panter svarar direkt på telefonen – inget skickas iväg.</p>
    <div class="spacer"></div>
    <div class="chat" id="chat">${S.chat.map(c =>
      `<div class="msg ${c.from === 'bot' ? 'bot' : 'me'}">${c.from === 'bot' ? c.html : esc(c.html)}</div>`).join('')}</div>
    <div class="suggest">${sugg.map(s => `<button class="chip" data-s="${esc(s)}">${esc(s)}</button>`).join('')}</div>
    <div class="chat-input">
      <input type="text" id="msg" placeholder="Skriv till pantern…" autocomplete="off">
      <button id="send">Skicka</button>
    </div>`;
  const input = document.getElementById('msg');
  const send = text => {
    text = text.trim();
    if (!text) return;
    S.chat.push({ from: 'me', html: text, t: Date.now() });
    pushBot(coachReply(text));
    save();
    viewCoach();
    document.getElementById('msg').focus();
  };
  document.getElementById('send').onclick = () => send(input.value);
  input.onkeydown = e => { if (e.key === 'Enter') send(input.value); };
  document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => send(b.dataset.s));
  window.scrollTo(0, document.body.scrollHeight);
}

function viewProgress() {
  const rk = rankFor(S.xp);
  const doneTotal = S.history.filter(h => h.status === 'done').length;
  const failTotal = S.history.length - doneTotal;
  const penDone = S.penalties.filter(p => p.status === 'done').length;
  const rows = Object.entries(CATS).map(([k, c]) => {
    const st = S.cat[k] || { done: 0, failed: 0 };
    const tot = st.done + st.failed;
    const pct = tot ? Math.round(st.done / tot * 100) : 0;
    return `<div class="bar-row"><span>${c.icon} ${c.name}</span>
      <div class="meter" style="margin:0"><div style="width:${pct}%;background:var(--purple)"></div></div>
      <span class="small muted">${st.done}/${tot}</span></div>`;
  }).join('');
  const hist = S.history.slice(-30).reverse();
  const label = { done: '✅', gaveup: '🏳️', missed: '⏰' };

  $app.innerHTML = `
    <h1>Framsteg</h1>
    <div class="card">
      <div class="stats">
        <div class="stat"><b>${doneTotal}</b><span>Klarade</span></div>
        <div class="stat"><b>${failTotal}</b><span>Missade</span></div>
        <div class="stat"><b>${S.bestStreak}</b><span>Bästa streak</span></div>
      </div>
      <p class="small muted" style="margin-top:10px">Rang: <b class="gold">${rk.name}</b> · ${S.xp} XP · ${penDone} straffuppdrag betalda · ${S.collapses} kollaps${S.collapses === 1 ? '' : 'er'}</p>
    </div>
    <h2>Rangstegen</h2>
    <div class="card small">${RANKS.map((r, i) =>
      `<p style="${i === rk.index ? 'color:var(--gold);font-weight:700' : i < rk.index ? '' : 'color:var(--muted)'}">${i <= rk.index ? '🐾' : '·'} ${r.name} <span class="muted">– ${r.xp} XP</span></p>`).join('')}</div>
    <h2>Områden</h2>
    <div class="card bars">${rows}</div>
    <h2>Senaste uppdragen</h2>
    <div class="card">${hist.length ? hist.map(h => {
      const mis = byId(h.id);
      return `<div class="hist-item">
        <div>${label[h.status] || ''} <b>${esc(mis ? mis.title : h.id)}</b> <span class="small muted">${h.date}</span></div>
        ${h.reflection ? `<div class="small muted">"${esc(h.reflection)}"</div>` : ''}
      </div>`;
    }).join('') : '<p class="muted">Inga uppdrag än. Dags att börja jaga!</p>'}</div>`;
}

function viewSettings() {
  $app.innerHTML = `
    <h1>Inställningar</h1>
    <div class="card">
      <h3>Namn</h3>
      <div class="spacer"></div>
      <input type="text" id="name" maxlength="24" value="${esc(S.name)}">
    </div>
    <div class="card">
      <h3>Fokusområden</h3>
      <p class="small muted">Välj 1–3. Gäller från nästa dags uppdrag.</p>
      <div class="spacer"></div>
      <div class="chips" id="cats">${Object.entries(CATS).map(([k, c]) =>
        `<button class="chip ${S.focus.includes(k) ? 'on' : ''}" data-k="${k}">${c.icon} ${c.name}</button>`).join('')}</div>
    </div>
    <div class="card">
      <h3>Maxsvårighet</h3>
      <div class="spacer"></div>
      <div class="chips" id="tiers">${[1, 2, 3].map(t =>
        `<button class="chip ${S.maxTier === t ? 'on' : ''}" data-t="${t}">${tierStars(t)} ${tierName(t)}</button>`).join('')}</div>
    </div>
    <div class="card">
      <h3>Reglerna</h3>
      <ul class="tips small">
        <li>Klarat uppdrag: +XP och +${RULES.doneLife} livskraft.</li>
        <li>Ge upp: −${RULES.giveUpLife} livskraft och ett straffuppdrag.</li>
        <li>Missat vid midnatt: −${RULES.missLife} livskraft och ett straffuppdrag.</li>
        <li>Olöst straffuppdrag: −${RULES.penaltyDailyLife} livskraft per natt.</li>
        <li>Klara minst ${RULES.streakNeed} av 3 per dag för att hålla streaken. Streak ≥ 3 ger +10 XP per uppdrag.</li>
        <li>Livskraft 0 = kollaps: −${Math.round(RULES.collapseXpLoss * 100)} % XP och streaken nollas.</li>
        <li>Alla uppdrag är designade för att vara 0 % farliga. Känns något fel – avbryt alltid.</li>
      </ul>
    </div>
    <div class="card">
      <h3>Behöver du prata med någon?</h3>
      <p class="small">Akut: <a class="link" href="tel:112">112</a> · Mind Självmordslinjen: <a class="link" href="tel:90101">90101</a> · Vårdguiden: <a class="link" href="tel:1177">1177</a> · BRIS (under 18): <a class="link" href="tel:116111">116 111</a></p>
    </div>
    <button class="btn-danger" id="reset">Börja om från noll</button>
    <p class="small muted center" style="margin-top:14px">Panter-appen 1.0 · All data sparas bara på den här telefonen.</p>
  `;
  const nameInp = document.getElementById('name');
  nameInp.onchange = () => { if (nameInp.value.trim()) { S.name = nameInp.value.trim(); save(); toast('Namn sparat'); } };
  document.querySelectorAll('#cats .chip').forEach(b => b.onclick = () => {
    const k = b.dataset.k;
    if (S.focus.includes(k)) { if (S.focus.length > 1) S.focus = S.focus.filter(x => x !== k); }
    else if (S.focus.length < 3) S.focus.push(k);
    save(); viewSettings();
  });
  document.querySelectorAll('#tiers .chip').forEach(b => b.onclick = () => {
    S.maxTier = Number(b.dataset.t); save(); viewSettings();
  });
  document.getElementById('reset').onclick = () => {
    if (confirm('All din framgång, XP och historik försvinner. Är du säker?')) {
      try { localStorage.removeItem(KEY); } catch (e) { /* ignoreras */ }
      S = null;
      location.replace('#/start');
      render();
    }
  };
}

/* ---------- routing ---------- */

let toastTimer = null;
function toast(text) {
  const el = document.getElementById('toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

function render() {
  clearInterval(timerInterval);
  const route = (location.hash || '#/idag').slice(2).split('/');
  if (!S) {
    $nav.hidden = true;
    document.body.classList.add('no-nav');
    document.body.classList.remove('life-low', 'life-critical');
    viewOnboard();
    return;
  }
  rollover();
  $nav.hidden = false;
  document.body.classList.remove('no-nav');
  document.body.classList.toggle('life-low', S.life < 40 && S.life >= 20);
  document.body.classList.toggle('life-critical', S.life < 20);
  const r = route[0] || 'idag';
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('on', a.dataset.r === (r === 'uppdrag' ? 'idag' : r)));
  window.scrollTo(0, 0);
  if (r === 'uppdrag') viewMission(route[1]);
  else if (r === 'coach') viewCoach();
  else if (r === 'framsteg') viewProgress();
  else if (r === 'installningar') viewSettings();
  else viewToday();
}

window.addEventListener('hashchange', render);
// Anropas från Android när appen kommer tillbaka i förgrunden.
window.panterResume = () => {
  if (S && S.day && S.day.date !== todayStr()) render();
};
// Kolla dygnsskiftet även om appen står öppen över midnatt.
setInterval(() => window.panterResume(), 60000);

S = load();
render();
</script>
</body>
