<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>Sändo Tavla — Whiteboard för klassrummet</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header id="topbar">
  <div class="logo-mark">S</div>
  <button id="btn-boards" class="board-pick" title="Alla tavlor">
    <span id="board-name">Tavla 1</span>
    <span class="caret">▾</span>
  </button>
  <div id="page-tabs" class="page-tabs"></div>
  <div class="spacer"></div>
  <div id="mini-dock"></div>
  <div id="credit-chip" class="dock-chip" title="Användningskrediter">💳 5 000 kr</div>
  <div id="topclock" class="topclock">--:--</div>
  <button id="btn-add" class="icon-btn primary" title="Lägg till komponent" aria-label="Lägg till komponent">➕</button>
  <button id="btn-theme" class="icon-btn" title="Mörkt/ljust läge" aria-label="Byt tema">🌙</button>
  <button id="btn-full" class="icon-btn" title="Helskärm" aria-label="Helskärm">⛶</button>
  <button id="btn-settings" class="icon-btn" title="Inställningar" aria-label="Inställningar">⚙️</button>
</header>

<div id="pen-bar" class="pen-bar"></div>

<main id="main">
  <section id="board-view" class="view">
    <div id="board-surface" class="board-surface">
      <canvas id="page-canvas"></canvas>
      <div id="widget-layer" class="widget-layer"></div>
    </div>
  </section>

  <section id="overview" class="view hidden">
    <div class="ov-head">
      <h2>Dina whiteboards</h2>
      <p class="muted">Varje tavla har egna sidor och egna komponenter. Skapa hur många du vill.</p>
    </div>
    <div id="board-grid" class="board-grid"></div>
  </section>

  <section id="full-view" class="view full-view hidden"></section>
</main>

<div id="toast" class="toast hidden"></div>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <h2 id="modal-title">Rubrik</h2>
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button id="modal-cancel" class="btn ghost">Avbryt</button>
      <button id="modal-ok" class="btn">OK</button>
    </div>
  </div>
</div>

<script src="js/core.js"></script>
<script src="js/board.js"></script>
<script src="js/tools-board.js"></script>
<script src="js/tools-time.js"></script>
<script src="js/tools-random.js"></script>
<script src="js/tools-class.js"></script>
<script src="js/tools-learn.js"></script>
<script src="js/tools-trams.js"></script>
<script src="js/settings.js"></script>
<script src="js/main.js"></script>
</body>
</html>
