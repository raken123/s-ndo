name: Chargamo
options:
  bundleIdPrefix: se.chargamo
  deploymentTarget:
    iOS: "16.0"
targets:
  Chargamo:
    type: application
    platform: iOS
    sources:
      - path: Chargamo
    info:
      path: Chargamo/Info.plist
      properties:
        CFBundleDisplayName: Chargamo
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBlack
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Chargamo ser dig genom kameran medan mobilen laddar.
        NSMicrophoneUsageDescription: Chargamo hör dig genom mikrofonen medan mobilen laddar.
        NSMotionUsageDescription: Chargamo märker när du vrider mobilen ett halvt varv.
        CFBundleURLTypes:
          - CFBundleURLName: se.chargamo
            CFBundleURLSchemes:
              - chargamo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.chargamo.app
        PRODUCT_NAME: Chargamo
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
