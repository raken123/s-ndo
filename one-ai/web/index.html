<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>One AI</title>
  <meta name="description" content="One AI: chatta och skapa filer, appar, bilder, video, musik, presentationer, design och 3D-modeller.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Chattar">
      <div class="side-head">
        <div class="brand"><img src="icon.svg" alt="" width="24" height="24"> One AI</div>
        <button class="icon-btn" id="closeSide" title="Stäng sidofältet" aria-label="Stäng sidofältet">
          <svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM9 5v14"/></svg>
        </button>
      </div>
      <button class="side-item new-chat" id="newChat">
        <svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg> Ny chatt
      </button>
      <div class="search-wrap">
        <input id="search" type="search" placeholder="Sök i chattar" aria-label="Sök i chattar">
      </div>
      <nav class="chat-list" id="chatList"></nav>
      <div class="side-foot">
        <button class="account-btn" id="accountBtn">
          <span class="avatar" id="avatar">O</span>
          <span class="account-text"><b id="planName">One Lite</b><small id="unitsLeft">&nbsp;</small></span>
        </button>
        <button class="upgrade-btn" id="upgradeBtn">Uppgradera</button>
      </div>
    </aside>
    <div class="backdrop" id="backdrop"></div>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn" id="openSide" title="Öppna sidofältet" aria-label="Öppna sidofältet">
          <svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM9 5v14"/></svg>
        </button>
        <div class="dropdown">
          <button class="model-btn" id="modelBtn" aria-haspopup="true"><span id="modelName">One 1 Standard</span>
            <svg viewBox="0 0 24 24" class="chev"><path d="M6 9l6 6 6-6"/></svg></button>
          <div class="menu model-menu" id="modelMenu" role="menu"></div>
        </div>
        <div class="grow"></div>
        <button class="icon-btn" id="newChatTop" title="Ny chatt" aria-label="Ny chatt">
          <svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
        </button>
      </header>

      <div class="scroller" id="scroller">
        <div class="empty" id="empty">
          <h1>Vad kan jag hjälpa till med?</h1>
          <div class="suggestions" id="suggestions"></div>
        </div>
        <div class="thread" id="thread"></div>
      </div>

      <div class="composer-wrap">
        <div class="notice" id="notice" hidden></div>
        <form class="composer" id="composer">
          <div class="attachments" id="attachments"></div>
          <textarea id="input" rows="1" placeholder="Fråga eller be One skapa något" aria-label="Meddelande"></textarea>
          <div class="composer-row">
            <button type="button" class="icon-btn round" id="attachBtn" title="Bifoga filer" aria-label="Bifoga filer">
              <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <input type="file" id="fileInput" multiple hidden>
            <div class="dropdown up">
              <button type="button" class="agent-btn" id="agentBtn" aria-haspopup="true">
                <span id="agentIcon">✦</span> <span id="agentName">Auto</span>
                <svg viewBox="0 0 24 24" class="chev"><path d="M6 9l6 6 6-6"/></svg></button>
              <div class="menu agent-menu" id="agentMenu" role="menu"></div>
            </div>
            <div class="grow"></div>
            <button type="submit" class="send-btn" id="sendBtn" title="Skicka" aria-label="Skicka">
              <svg viewBox="0 0 24 24" class="send-icon"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
              <svg viewBox="0 0 24 24" class="stop-icon"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>
            </button>
          </div>
        </form>
        <p class="disclaimer">One AI kan göra misstag. Kontrollera viktig information.</p>
      </div>
    </main>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <h2 id="modalTitle"></h2>
        <button class="icon-btn" id="modalClose" aria-label="Stäng"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>
  <div class="toast" id="toast" hidden></div>

  <script src="js/config.js"></script>
  <script src="js/bridge.js"></script>
  <script src="js/api.js"></script>
  <script src="js/md.js"></script>
  <script src="js/viewer3d.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
