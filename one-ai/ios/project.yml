# XcodeGen spec for the One AI iOS app: `xcodegen generate` makes
# OneAI.xcodeproj (git-ignored). build-ipa.sh does the whole build.
name: OneAI
options:
  bundleIdPrefix: com.oneai
  deploymentTarget:
    iOS: "15.0"
targets:
  OneAI:
    type: application
    platform: iOS
    sources:
      - path: OneAI
        excludes:
          - "www/**"
      - path: OneAI/www
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oneai.app
        PRODUCT_NAME: OneAI
        INFOPLIST_FILE: OneAI/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
