plugins {
    id 'com.android.application'
}

android {
    namespace 'com.oneai.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.oneai.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        // Demo key committed with the project so every build installs over
        // the last one. Set ONEAI_KEYSTORE (+ _PASSWORD, _ALIAS) to sign with
        // your own key before publishing (Google Play needs your upload key).
        demo {
            storeFile file(System.getenv('ONEAI_KEYSTORE') ?: 'oneai-demo.jks')
            storePassword System.getenv('ONEAI_KEYSTORE_PASSWORD') ?: 'oneai-demo'
            keyAlias System.getenv('ONEAI_KEY_ALIAS') ?: 'oneai'
            keyPassword System.getenv('ONEAI_KEY_PASSWORD') ?: System.getenv('ONEAI_KEYSTORE_PASSWORD') ?: 'oneai-demo'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.demo
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// The app ships the web app from one-ai/web, copied in on every build.
def syncWww = tasks.register('syncWww', Sync) {
    from "$rootDir/../web"
    into "$projectDir/src/main/assets/www"
}
preBuild.dependsOn syncWww

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.12.1'
}
