<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#faf8f4">
<title>Eskil i Grytan</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #e8e4dc; touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #wrap { position: fixed; inset: 0; display: grid; place-items: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
(function () {
'use strict';

/* ============================================================
   ESKIL I GRYTAN — ett kritritat fångarspel
   ============================================================ */

var VW = 720, VH = 1280;            // virtuell upplösning, allt ritas i denna
var wrap = document.getElementById('wrap');
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var dpr = Math.min(window.devicePixelRatio || 1, 2);

function resize() {
  var w = wrap.clientWidth || window.innerWidth;
  var h = wrap.clientHeight || window.innerHeight;
  var scale = Math.min(w / VW, h / VH);
  var cw = Math.round(VW * scale), ch = Math.round(VH * scale);
  canvas.style.width = cw + 'px';
  canvas.style.height = ch + 'px';
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function () { setTimeout(resize, 120); });
resize();

/* ---------- slump ---------- */
function makeRng(seed) {
  var s = seed >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) | 0;
    var t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rand(a, b) { return a + Math.random() * (b - a); }
function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

/* ============================================================
   KRIT-RENDERING
   ============================================================ */

/** Drar samma linje flera gånger med små skakningar = kritkänsla. */
function rough(c, pts, o) {
  o = o || {};
  var color = o.color || '#2b2b2b';
  var width = o.width || 5;
  var passes = o.passes || 2;
  var jit = o.jit == null ? 2.2 : o.jit;
  var alpha = o.alpha == null ? 0.75 : o.alpha;
  var rng = o.rng || makeRng(7);

  c.save();
  c.lineCap = 'round';
  c.lineJoin = 'round';
  c.strokeStyle = color;
  for (var p = 0; p < passes; p++) {
    c.globalAlpha = alpha * (0.72 + rng() * 0.38);
    c.lineWidth = width * (0.82 + rng() * 0.36);
    c.beginPath();
    for (var i = 0; i < pts.length; i++) {
      var x = pts[i][0] + (rng() - 0.5) * jit * 2;
      var y = pts[i][1] + (rng() - 0.5) * jit * 2;
      if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
    }
    if (o.close) c.closePath();
    c.stroke();
  }
  c.restore();
}

/** Kladdig kritfyllning: klipp till formen, kluddra streck kors och tvärs. */
function scribble(c, pathFn, box, o) {
  o = o || {};
  var color = o.color || '#7a4a22';
  var spacing = o.spacing || 11;
  var width = o.width || 9;
  var alpha = o.alpha == null ? 0.5 : o.alpha;
  var rng = o.rng || makeRng(11);
  var angles = o.angles || [-0.9, 0.55];

  c.save();
  c.beginPath();
  pathFn(c);
  c.clip();
  c.lineCap = 'round';
  c.strokeStyle = color;

  var cx = box[0] + box[2] / 2, cy = box[1] + box[3] / 2;
  var diag = Math.sqrt(box[2] * box[2] + box[3] * box[3]) / 2 + 12;

  for (var a = 0; a < angles.length; a++) {
    var ang = angles[a] + (rng() - 0.5) * 0.1;
    var dx = Math.cos(ang), dy = Math.sin(ang);
    var nx = -dy, ny = dx;
    for (var t = -diag; t <= diag; t += spacing) {
      c.globalAlpha = alpha * (0.45 + rng() * 0.75);
      c.lineWidth = width * (0.7 + rng() * 0.6);
      c.beginPath();
      for (var s = 0; s <= 6; s++) {
        var u = -diag + (2 * diag * s) / 6;
        var x = cx + nx * t + dx * u + (rng() - 0.5) * 4;
        var y = cy + ny * t + dy * u + (rng() - 0.5) * 4;
        if (s === 0) c.moveTo(x, y); else c.lineTo(x, y);
      }
      c.stroke();
    }
  }
  c.restore();
}

/** Punkter längs en ellipsbåge. */
function arcPts(cx, cy, rx, ry, a0, a1, steps) {
  steps = steps || 26;
  var pts = [];
  for (var i = 0; i <= steps; i++) {
    var a = a0 + ((a1 - a0) * i) / steps;
    pts.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]);
  }
  return pts;
}

/** Rita en gång till en offscreen-canvas (sprite-cache). */
function sprite(w, h, drawFn) {
  var cv = document.createElement('canvas');
  cv.width = Math.ceil(w * dpr * 1.15);
  cv.height = Math.ceil(h * dpr * 1.15);
  var c = cv.getContext('2d');
  c.scale(cv.width / w, cv.height / h);
  drawFn(c, w, h);
  cv._w = w; cv._h = h;
  return cv;
}
function drawSprite(c, sp, x, y, s, rot) {
  s = s == null ? 1 : s;
  c.save();
  c.translate(x, y);
  if (rot) c.rotate(rot);
  c.drawImage(sp, (-sp._w / 2) * s, (-sp._h / 2) * s, sp._w * s, sp._h * s);
  c.restore();
}

/* ---------- färger hämtade från teckningen ---------- */
var COL = {
  paper: '#faf8f4',
  ink: '#2f2f2f',
  brown: '#7a4623',
  brownDark: '#5d3317',
  skin: '#f8e2c4',
  skinLine: '#c98a45',
  grey: '#9c9c9c',
  blue: '#2f6fd0',
  green: '#2fa14e',
  orange: '#f0891f',
  purple: '#7b4fa8',
  red: '#e0392c',
  yellow: '#f0c419',
  pink: '#e8608f'
};
var TITLE_COLORS = [COL.blue, COL.green, COL.green, COL.orange, COL.orange, COL.purple, COL.orange, COL.green, COL.red, COL.red, COL.yellow, COL.yellow];

/* ============================================================
   BAKGRUND: kladdigt papper
   ============================================================ */
var paper = sprite(VW, VH, function (c) {
  c.fillStyle = COL.paper;
  c.fillRect(0, 0, VW, VH);
  var rng = makeRng(1234);
  var smudge = ['#c9b8a6', '#b9a48f', '#d8cfc2', '#8f8f8f', '#c7a98b'];
  for (var i = 0; i < 90; i++) {
    var x = rng() * VW, y = rng() * VH, r = 6 + rng() * 34;
    c.globalAlpha = 0.05 + rng() * 0.09;
    c.fillStyle = smudge[(rng() * smudge.length) | 0];
    c.beginPath();
    c.ellipse(x, y, r, r * (0.4 + rng() * 0.8), rng() * 3.14, 0, 6.3);
    c.fill();
  }
  var flecks = [COL.blue, COL.green, COL.orange, COL.red, COL.yellow, COL.purple, COL.brown, '#555'];
  for (var j = 0; j < 150; j++) {
    var x2 = rng() * VW, y2 = rng() * VH;
    var len = 4 + rng() * 26, ang = rng() * 6.3;
    c.globalAlpha = 0.1 + rng() * 0.3;
    c.strokeStyle = flecks[(rng() * flecks.length) | 0];
    c.lineWidth = 1 + rng() * 3.5;
    c.lineCap = 'round';
    c.beginPath();
    c.moveTo(x2, y2);
    c.quadraticCurveTo(x2 + Math.cos(ang) * len * 0.6 + rng() * 6, y2 + Math.sin(ang) * len * 0.6, x2 + Math.cos(ang) * len, y2 + Math.sin(ang) * len);
    c.stroke();
  }
  c.globalAlpha = 1;
});

/* ============================================================
   SPRITES
   ============================================================ */
var POT_W = 330, POT_H = 250;

var potBack = sprite(POT_W + 60, POT_H, function (c, w) {
  var rng = makeRng(21);
  var cx = w / 2, rimY = 46, rx = POT_W / 2 - 8, ry = 26;
  rough(c, arcPts(cx - rx - 18, rimY + 22, 40, 34, -1.9, 1.9, 20), { color: COL.brown, width: 12, passes: 3, jit: 2.5, rng: rng, alpha: 0.85 });
  rough(c, arcPts(cx + rx + 18, rimY + 22, 40, 34, 1.25, 4.4, 20), { color: COL.brown, width: 12, passes: 3, jit: 2.5, rng: rng, alpha: 0.85 });
  c.save();
  c.beginPath();
  c.ellipse(cx, rimY, rx, ry, 0, 0, 6.3);
  c.fillStyle = '#f2ece2';
  c.fill();
  c.restore();
  rough(c, arcPts(cx, rimY, rx, ry, 0, 6.283, 44), { color: COL.brown, width: 7, passes: 2, jit: 2, rng: rng, close: true });
});

var potFront = sprite(POT_W + 20, POT_H, function (c, w) {
  var rng = makeRng(33);
  var cx = w / 2, rimY = 46, rx = POT_W / 2 - 8, ry = 26;
  var botY = rimY + 168, bry = 22, brx = rx - 34;

  function body(cc) {
    cc.moveTo(cx - rx, rimY);
    cc.lineTo(cx - brx, botY);
    cc.ellipse(cx, botY, brx, bry, 0, Math.PI, 0, true);
    cc.lineTo(cx + rx, rimY);
    cc.ellipse(cx, rimY, rx, ry, 0, 0, Math.PI, false);
    cc.closePath();
  }
  scribble(c, body, [cx - rx, rimY, rx * 2, botY - rimY + bry], {
    color: COL.brown, spacing: 9, width: 11, alpha: 0.5, rng: rng, angles: [-1.15, 0.5, 1.5]
  });
  rough(c, [[cx - rx, rimY], [cx - rx + 8, rimY + 60], [cx - brx - 4, botY - 30], [cx - brx, botY]], { color: COL.brownDark, width: 7, passes: 2, rng: rng });
  rough(c, [[cx + rx, rimY], [cx + rx - 8, rimY + 60], [cx + brx + 4, botY - 30], [cx + brx, botY]], { color: COL.brownDark, width: 7, passes: 2, rng: rng });
  rough(c, arcPts(cx, botY, brx, bry, 0, Math.PI, 22), { color: COL.brownDark, width: 7, passes: 2, rng: rng });
  rough(c, arcPts(cx, rimY, rx, ry, 0, Math.PI, 26), { color: COL.brownDark, width: 8, passes: 2, jit: 1.8, rng: rng });
});

/* --- Eskil: huvud, kockmössa, förkläde med SIGMA --- */
function drawEskil(c, w, h, mood) {
  var rng = makeRng(mood === 'ouch' ? 71 : mood === 'yum' ? 55 : 44);
  var cx = w / 2, headY = h * 0.52, hr = 44;

  var puffs = [[cx - 40, headY - 88, 30], [cx, headY - 104, 34], [cx + 40, headY - 88, 30]];
  for (var i = 0; i < puffs.length; i++) {
    var p = puffs[i];
    c.save();
    c.beginPath();
    c.ellipse(p[0], p[1], p[2], p[2] * 0.92, 0, 0, 6.3);
    c.fillStyle = '#fffdf8';
    c.fill();
    c.restore();
    rough(c, arcPts(p[0], p[1], p[2], p[2] * 0.92, 0, 6.283, 26), { color: COL.grey, width: 4, passes: 2, jit: 2.4, rng: rng, close: true });
  }
  c.save();
  c.beginPath();
  c.moveTo(cx - 52, headY - 86); c.lineTo(cx - 46, headY - 46);
  c.lineTo(cx + 46, headY - 46); c.lineTo(cx + 52, headY - 86);
  c.closePath();
  c.fillStyle = '#fffdf8'; c.fill();
  c.restore();
  rough(c, [[cx - 52, headY - 86], [cx - 47, headY - 60], [cx - 46, headY - 46]], { color: COL.grey, width: 4, passes: 2, rng: rng });
  rough(c, [[cx + 52, headY - 86], [cx + 47, headY - 60], [cx + 46, headY - 46]], { color: COL.grey, width: 4, passes: 2, rng: rng });
  rough(c, [[cx - 47, headY - 47], [cx - 10, headY - 51], [cx + 20, headY - 47], [cx + 47, headY - 50]], { color: COL.grey, width: 5, passes: 2, rng: rng });

  c.save();
  c.beginPath();
  c.ellipse(cx, headY, hr * 0.86, hr, 0, 0, 6.3);
  c.fillStyle = COL.skin; c.fill();
  c.restore();
  rough(c, arcPts(cx, headY, hr * 0.86, hr, 0, 6.283, 30), { color: COL.skinLine, width: 4.5, passes: 2, jit: 1.8, rng: rng, close: true });
  rough(c, arcPts(cx - hr * 0.86, headY + 2, 9, 12, 1.4, 4.9, 12), { color: COL.skinLine, width: 4, passes: 2, rng: rng });
  rough(c, arcPts(cx + hr * 0.86, headY + 2, 9, 12, -1.6, 1.6, 12), { color: COL.skinLine, width: 4, passes: 2, rng: rng });
  rough(c, [[cx - 40, headY - 30], [cx - 26, headY - 40], [cx - 6, headY - 34], [cx + 14, headY - 41], [cx + 38, headY - 30]], { color: '#4a3117', width: 8, passes: 3, jit: 2.6, rng: rng });
  rough(c, [[cx - 42, headY - 22], [cx - 44, headY - 34]], { color: '#4a3117', width: 6, passes: 2, rng: rng });
  rough(c, [[cx + 42, headY - 22], [cx + 44, headY - 34]], { color: '#4a3117', width: 6, passes: 2, rng: rng });

  if (mood === 'ouch') {
    rough(c, [[cx - 24, headY - 12], [cx - 8, headY + 2]], { color: COL.ink, width: 4.5, passes: 2, rng: rng });
    rough(c, [[cx - 24, headY + 2], [cx - 8, headY - 12]], { color: COL.ink, width: 4.5, passes: 2, rng: rng });
    rough(c, [[cx + 8, headY - 12], [cx + 24, headY + 2]], { color: COL.ink, width: 4.5, passes: 2, rng: rng });
    rough(c, [[cx + 8, headY + 2], [cx + 24, headY - 12]], { color: COL.ink, width: 4.5, passes: 2, rng: rng });
  } else {
    c.fillStyle = COL.ink;
    c.beginPath(); c.ellipse(cx - 16, headY - 6, 5.5, 6.5, 0, 0, 6.3); c.fill();
    c.beginPath(); c.ellipse(cx + 16, headY - 6, 5.5, 6.5, 0, 0, 6.3); c.fill();
    rough(c, [[cx - 26, headY - 20], [cx - 16, headY - 24], [cx - 7, headY - 20]], { color: COL.ink, width: 3.5, passes: 2, rng: rng });
    rough(c, [[cx + 7, headY - 20], [cx + 16, headY - 24], [cx + 26, headY - 20]], { color: COL.ink, width: 3.5, passes: 2, rng: rng });
  }
  if (mood === 'yum') {
    rough(c, arcPts(cx, headY + 12, 20, 18, 0.15, Math.PI - 0.15, 16), { color: COL.ink, width: 4.5, passes: 2, rng: rng });
    c.save(); c.globalAlpha = 0.5; c.fillStyle = COL.pink;
    c.beginPath(); c.ellipse(cx, headY + 18, 15, 11, 0, 0, 6.3); c.fill(); c.restore();
  } else if (mood === 'ouch') {
    rough(c, arcPts(cx, headY + 26, 15, 12, Math.PI + 0.2, 6.283 - 0.2, 14), { color: COL.ink, width: 4.5, passes: 2, rng: rng });
  } else {
    rough(c, arcPts(cx, headY + 10, 22, 16, 0.25, Math.PI - 0.25, 16), { color: COL.ink, width: 4.5, passes: 2, rng: rng });
  }
  c.save(); c.globalAlpha = 0.28; c.fillStyle = COL.red;
  c.beginPath(); c.ellipse(cx - 30, headY + 10, 10, 7, 0, 0, 6.3); c.fill();
  c.beginPath(); c.ellipse(cx + 30, headY + 10, 10, 7, 0, 0, 6.3); c.fill();
  c.restore();

  var bodyTop = headY + hr - 2;
  rough(c, [[cx - 12, bodyTop - 6], [cx - 12, bodyTop + 10]], { color: COL.skinLine, width: 4, passes: 2, rng: rng });
  rough(c, [[cx + 12, bodyTop - 6], [cx + 12, bodyTop + 10]], { color: COL.skinLine, width: 4, passes: 2, rng: rng });
  c.save();
  c.beginPath();
  c.moveTo(cx - 62, bodyTop + 26);
  c.lineTo(cx - 54, h - 4); c.lineTo(cx + 54, h - 4); c.lineTo(cx + 62, bodyTop + 26);
  c.closePath();
  c.fillStyle = '#fffdf8'; c.fill();
  c.restore();
  rough(c, [[cx - 62, bodyTop + 26], [cx - 58, bodyTop + 70], [cx - 54, h - 4]], { color: COL.grey, width: 5, passes: 2, rng: rng });
  rough(c, [[cx + 62, bodyTop + 26], [cx + 58, bodyTop + 70], [cx + 54, h - 4]], { color: COL.grey, width: 5, passes: 2, rng: rng });
  rough(c, [[cx - 62, bodyTop + 26], [cx - 20, bodyTop + 20], [cx + 20, bodyTop + 22], [cx + 62, bodyTop + 26]], { color: COL.grey, width: 5, passes: 2, rng: rng });
  rough(c, [[cx - 40, bodyTop + 24], [cx - 16, bodyTop + 2]], { color: COL.grey, width: 4.5, passes: 2, rng: rng });
  rough(c, [[cx + 40, bodyTop + 24], [cx + 16, bodyTop + 2]], { color: COL.grey, width: 4.5, passes: 2, rng: rng });
  c.save();
  c.translate(cx, bodyTop + 66);
  c.rotate(-0.03);
  c.fillStyle = '#3a3a3a';
  c.font = '700 30px "Comic Sans MS", "Chalkboard SE", "Segoe Print", cursive';
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText('SIGMA', 0, 0);
  c.restore();
}
var eskilNormal = sprite(220, 300, function (c, w, h) { drawEskil(c, w, h, 'normal'); });
var eskilYum = sprite(220, 300, function (c, w, h) { drawEskil(c, w, h, 'yum'); });
var eskilOuch = sprite(220, 300, function (c, w, h) { drawEskil(c, w, h, 'ouch'); });

/* --- Spisen (ljus variant används i nattläget) --- */
function makeStove(frameCol, plateCol) {
  return sprite(VW, 300, function (c, w, h) {
    var rng = makeRng(88);
    rough(c, [[40, 40], [w - 40, 40], [w - 40, h - 30], [40, h - 30]], { color: frameCol, width: 6, passes: 2, jit: 2.6, rng: rng, close: true });
    var plates = [[w * 0.22, 130], [w * 0.5, 150], [w * 0.78, 130]];
    for (var p = 0; p < plates.length; p++) {
      var pts = [];
      var rr = p === 1 ? 92 : 66;
      for (var i = 0; i <= 180; i++) {
        var a = (i / 180) * Math.PI * 7;
        var r = (rr * i) / 180;
        pts.push([plates[p][0] + Math.cos(a) * r, plates[p][1] + Math.sin(a) * r * 0.42]);
      }
      rough(c, pts, { color: plateCol, width: 5, passes: 2, jit: 2.4, rng: rng, alpha: 0.72 });
    }
  });
}
var stove = makeStove(COL.ink, '#3b3b3b');
var stoveNight = makeStove('#6f6480', '#c85a2a');

/* --- Ingredienser --- */
function ingSprite(fn) { return sprite(120, 120, fn); }
var SPR = {};

SPR.morot = ingSprite(function (c, w) {
  var rng = makeRng(101), cx = w / 2;
  function body(cc) { cc.moveTo(cx - 26, 34); cc.lineTo(cx + 26, 34); cc.lineTo(cx + 2, 108); cc.closePath(); }
  scribble(c, body, [cx - 28, 30, 56, 80], { color: COL.orange, spacing: 8, width: 9, alpha: 0.6, rng: rng });
  rough(c, [[cx - 26, 34], [cx + 26, 34], [cx + 2, 108], [cx - 26, 34]], { color: '#c96b12', width: 5, passes: 2, rng: rng });
  rough(c, [[cx - 14, 52], [cx + 8, 50]], { color: '#c96b12', width: 3, passes: 1, rng: rng });
  rough(c, [[cx - 8, 72], [cx + 10, 70]], { color: '#c96b12', width: 3, passes: 1, rng: rng });
  rough(c, [[cx - 16, 34], [cx - 30, 8]], { color: COL.green, width: 7, passes: 2, rng: rng });
  rough(c, [[cx, 32], [cx + 2, 4]], { color: COL.green, width: 7, passes: 2, rng: rng });
  rough(c, [[cx + 14, 34], [cx + 30, 10]], { color: COL.green, width: 7, passes: 2, rng: rng });
});

SPR.tomat = ingSprite(function (c, w, h) {
  var rng = makeRng(102), cx = w / 2, cy = h / 2 + 6, r = 38;
  function body(cc) { cc.ellipse(cx, cy, r, r * 0.9, 0, 0, 6.3); }
  scribble(c, body, [cx - r, cy - r, r * 2, r * 2], { color: COL.red, spacing: 8, width: 10, alpha: 0.55, rng: rng });
  rough(c, arcPts(cx, cy, r, r * 0.9, 0, 6.283, 30), { color: '#b32a20', width: 5, passes: 2, rng: rng, close: true });
  rough(c, [[cx - 16, cy - 34], [cx, cy - 42], [cx + 16, cy - 34]], { color: COL.green, width: 6, passes: 2, rng: rng });
  rough(c, [[cx, cy - 42], [cx + 2, cy - 54]], { color: COL.green, width: 6, passes: 2, rng: rng });
  c.save(); c.globalAlpha = 0.5; c.strokeStyle = '#fff'; c.lineWidth = 6; c.lineCap = 'round';
  c.beginPath(); c.arc(cx - 12, cy - 10, 14, 3.5, 4.6); c.stroke(); c.restore();
});

SPR.broccoli = ingSprite(function (c, w) {
  var rng = makeRng(103), cx = w / 2;
  function crown(cc) {
    cc.ellipse(cx - 20, 46, 24, 20, 0, 0, 6.3);
    cc.ellipse(cx + 20, 46, 24, 20, 0, 0, 6.3);
    cc.ellipse(cx, 32, 26, 22, 0, 0, 6.3);
  }
  scribble(c, crown, [cx - 46, 8, 92, 60], { color: COL.green, spacing: 8, width: 10, alpha: 0.55, rng: rng });
  rough(c, arcPts(cx - 20, 46, 24, 20, 0, 6.283, 20), { color: '#1e7538', width: 4.5, passes: 2, rng: rng });

var AC = null, muted = false;
function audio() {
  if (!AC) {
    var A = window.AudioContext || window.webkitAudioContext;
    if (A) AC = new A();
  }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function beep(freq, dur, type, vol, slide) {
  if (muted) return;
  var ac = audio(); if (!ac) return;
  var o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, ac.currentTime);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, slide), ac.currentTime + dur);
  g.gain.setValueAtTime(0.0001, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(vol || 0.16, ac.currentTime + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime + dur + 0.02);
}

  spawnT: 0, spawnGap: 1.0,
  mood: 'normal', moodT: 0, shake: 0, flash: 0, flashCol: '#fff',
  doubleT: 0, levelBanner: 0, t: 0, over: 0,
  // mörka hemligheter
  nightT: 0, night: 0, tripleN: 0, kokbok: false, maxLives: 3,
  hatTaps: 0, plateTaps: 0, tapT: 0, reveal: null, revealT: 0, whisper: 0
};
try { G.best = parseInt(localStorage.getItem('eskil_best') || '0', 10) || 0; } catch (e) {}

function resetGame() {
  G.potX = VW / 2; G.targetX = VW / 2; G.potVX = 0;
  G.score = 0; G.lives = 3; G.level = 1; G.caught = 0; G.combo = 0; G.bestCombo = 0;
  G.items = []; G.parts = []; G.pops = []; G.steam = [];
  G.spawnT = 0.4; G.spawnGap = 1.05;
  G.mood = 'normal'; G.moodT = 0; G.shake = 0; G.flash = 0;
  G.doubleT = 0; G.levelBanner = 0; G.over = 0;
  G.nightT = 0; G.night = 0; G.tripleN = 0; G.kokbok = false; G.maxLives = 3;
}

/* En hemlighet upptäckt: visa den, spara den, spela stinget. */
function findSecret(key) {
  if (hasSecret(key)) return false;
  secretsFound[key] = true;
  saveSecrets();
  for (var i = 0; i < SECRETS.length; i++) {
    if (SECRETS[i].key === key) { G.reveal = SECRETS[i]; G.revealT = 3.6; break; }
  }
  sfxSecret();
  return true;
}

/* Nattläget: papperet svartnar och kritorna lyser. */
function startNight(sec) {
  G.nightT = Math.max(G.nightT, sec);
  sfxNight();
}
function isNight() { return G.night > 0.02; }
function inkCol() { return isNight() ? '#efe7dc' : COL.ink; }
function greyCol() { return isNight() ? '#8d86a0' : COL.grey; }

/* ---------- inmatning ---------- */
var keys = {};
window.addEventListener('keydown', function (e) {
  keys[e.key] = true;
  if (state === 'title') konamiKey(e.key);
  if (e.key === ' ' || e.key === 'Enter') { activate(); e.preventDefault(); }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') e.preventDefault();
  if (e.key === 'm' || e.key === 'M') toggleMute();
});
window.addEventListener('keyup', function (e) { keys[e.key] = false; });

/* skärmkoordinat -> virtuell koordinat (funkar oavsett var canvasen sitter) */
function toScreenX(clientX) {
  var r = canvas.getBoundingClientRect();
  return ((clientX - r.left) / r.width) * VW;
}
function toScreenY(clientY) {
  var r = canvas.getBoundingClientRect();
  return ((clientY - r.top) / r.height) * VH;
}

var dragging = false;
function pointerDown(x, y) {
  audio();
  if (x > VW - 96 && y < 96) { toggleMute(); return; }   // ljudknappen

  if (state === 'secrets') { state = 'title'; return; }

  if (state === 'title') {
    // hemlighetslistan nere till vänster
    if (y > VH - 76 && x < 360) { state = 'secrets'; return; }

    // MÖSSAN: sju knackningar på kockmössan
    if (x > G.potX - 62 && x < G.potX + 62 && y > 716 && y < 828) {
      G.hatTaps++; G.tapT = 2.2;
      beep(300 + G.hatTaps * 60, 0.07, 'square', 0.07);
      if (G.hatTaps >= 7) {
        G.hatTaps = 0;
        if (!findSecret('mossan')) popText(G.potX, 700, 'PIP!', COL.grey);
        else popText(G.potX, 700, 'PIP!', COL.pink, true);
      }
      return;
    }

    // SPISEN: fem vridningar på vänstra plattan
    if (x > 74 && x < 246 && y > 1050 && y < 1170) {
      G.plateTaps++; G.tapT = 2.2;
      beep(120 + G.plateTaps * 22, 0.12, 'sawtooth', 0.07);
      if (G.plateTaps >= 5) {
        G.plateTaps = 0;
        findSecret('spisen');
        G.whisper = 4;
        startNight(6);
        sfxWhisper();
      }
      return;
    }
  }

  if (state !== 'play') { activate(); return; }
  dragging = true;
  G.targetX = x;
}
function pointerMove(x) { if (dragging && state === 'play') G.targetX = x; }
function pointerUp() { dragging = false; }

canvas.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (err) {} }
  pointerDown(toScreenX(e.clientX), toScreenY(e.clientY));
});
canvas.addEventListener('pointermove', function (e) { e.preventDefault(); pointerMove(toScreenX(e.clientX)); });
canvas.addEventListener('pointerup', function (e) { e.preventDefault(); pointerUp(); });
canvas.addEventListener('pointercancel', pointerUp);
canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

function toggleMute() { muted = !muted; if (!muted) beep(660, 0.1, 'triangle', 0.12); }

function activate() {
  audio();
  if (state === 'title') { resetGame(); state = 'play'; sfxLevel(); }
  else if (state === 'over' && G.over > 0.8) { resetGame(); state = 'play'; }
}

/* Konami-koden på titelskärmen väcker också mörkret. */
var konami = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight'];
var konamiPos = 0;
function konamiKey(k) {
  if (k === konami[konamiPos]) {
    konamiPos++;
    if (konamiPos === konami.length) {
      konamiPos = 0;
      findSecret('mossan');
      startNight(6);
    }
  } else {
    konamiPos = (k === konami[0]) ? 1 : 0;
  }
}

/* ---------- effekter ---------- */
function burst(x, y, color, n, power) {
  for (var i = 0; i < (n || 12); i++) {
    var a = rand(0, 6.283), sp = rand(60, 260) * (power || 1);
    G.parts.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 90, life: rand(0.4, 0.9), age: 0, col: color, r: rand(3, 9), rot: rand(0, 6.3), vr: rand(-8, 8) });
  }
}
function popText(x, y, text, color, big) {
  G.pops.push({ x: x, y: y, text: text, col: color, age: 0, life: 1.0, big: !!big });
}

/* ---------- spawn ---------- */
function spawn() {
  var r = Math.random();
  var def;
  var junkChance = clamp(0.12 + G.level * 0.035, 0.12, 0.38);
  if (isNight() && r < 0.10) def = SPOKE;                       // bara i mörkret
  else if (G.level >= 4 && r < 0.022) def = OGA;                // sällsynt, högre nivåer
  else if (r < 0.028 && G.doubleT <= 0) def = BONUS;
  else if (r < junkChance) def = pick(JUNK);
  else def = pick(INGREDIENTS);

  G.items.push({
    def: def, x: rand(90, VW - 90), y: -70,
    vy: (170 + G.level * 26) * rand(0.85, 1.15),
    vx: rand(-30, 30),
    rot: rand(-0.5, 0.5), vr: rand(-1.6, 1.6),
    scale: def.bonus ? 1.05 : rand(0.9, 1.08),
    wob: rand(0, 6.3)
  });
}

/* ---------- uppdatering ---------- */
function update(dt) {
  G.t += dt;

  if (state === 'play') {
    if (keys.ArrowLeft || keys.a || keys.A) G.targetX -= 900 * dt;
    if (keys.ArrowRight || keys.d || keys.D) G.targetX += 900 * dt;
    G.targetX = clamp(G.targetX, POT_W / 2 - 10, VW - POT_W / 2 + 10);
    var dx = G.targetX - G.potX;
    G.potVX = dx * 12;
    G.potX = clamp(G.potX + G.potVX * dt, POT_W / 2 - 10, VW - POT_W / 2 + 10);
  }

  if (G.moodT > 0) { G.moodT -= dt; if (G.moodT <= 0) G.mood = 'normal'; }
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 2.4);
  if (G.flash > 0) G.flash = Math.max(0, G.flash - dt * 2.2);
  if (G.levelBanner > 0) G.levelBanner -= dt;
  if (G.doubleT > 0) G.doubleT -= dt;
  if (G.revealT > 0) { G.revealT -= dt; if (G.revealT <= 0) G.reveal = null; }
  if (G.whisper > 0) G.whisper -= dt;
  if (G.tapT > 0) { G.tapT -= dt; if (G.tapT <= 0) { G.hatTaps = 0; G.plateTaps = 0; } }

  // nattläget tonar in och ut
  if (G.nightT > 0) G.nightT -= dt;
  var wantNight = G.nightT > 0 ? 1 : 0;
  G.night += (wantNight - G.night) * Math.min(1, dt * 2.6);
  if (G.night < 0.02 && !wantNight) G.night = 0;

  // ånga ur grytan
  if (state === 'play' && Math.random() < dt * 14) {
    G.steam.push({ x: G.potX + rand(-90, 90), y: POT_Y + 20, r: rand(10, 26), age: 0, life: rand(1.2, 2.2), vx: rand(-14, 14) });
  }
  for (var s = G.steam.length - 1; s >= 0; s--) {
    var st = G.steam[s];
    st.age += dt; st.y -= 46 * dt; st.x += st.vx * dt; st.r += 12 * dt;
    if (st.age > st.life) G.steam.splice(s, 1);
  }

  if (state === 'play') {
    G.spawnT -= dt;
    G.spawnGap = clamp(1.05 - G.level * 0.055, 0.34, 1.05);
    if (G.spawnT <= 0) { spawn(); G.spawnT = G.spawnGap * rand(0.75, 1.25); }
  }

  for (var i = G.items.length - 1; i >= 0; i--) {
    var it = G.items[i];
    it.y += it.vy * dt;
    it.x += it.vx * dt;
    it.rot += it.vr * dt;
    if (it.x < 60 || it.x > VW - 60) it.vx *= -1;

    var rimY = POT_Y + 30;
    if (state === 'play' && it.y > rimY - 20 && it.y < rimY + 70 && Math.abs(it.x - G.potX) < POT_W / 2 - 30) {
      G.items.splice(i, 1);
      onCatch(it);
      continue;
    }
    if (it.y > VH + 90) {
      G.items.splice(i, 1);
      if (state === 'play' && it.def.good && !it.def.bonus) {
        if (G.combo > 2) popText(it.x, VH - 250, 'MISS!', COL.grey);
        G.combo = 0;
        sfxMiss();
      }
    }
  }

  for (var p = G.parts.length - 1; p >= 0; p--) {
    var pa = G.parts[p];
    pa.age += dt; pa.vy += 900 * dt;
    pa.x += pa.vx * dt; pa.y += pa.vy * dt; pa.rot += pa.vr * dt;
    if (pa.age > pa.life) G.parts.splice(p, 1);
  }
  for (var q = G.pops.length - 1; q >= 0; q--) {
    var po = G.pops[q];
    po.age += dt; po.y -= 60 * dt;
    if (po.age > po.life) G.pops.splice(q, 1);
  }

  if (state === 'over') G.over += dt;
}

function onCatch(it) {
  var d = it.def;
  if (d.bonus) {
    G.doubleT = 8;
    G.mood = 'yum'; G.moodT = 0.8;
    burst(it.x, POT_Y + 20, COL.yellow, 26, 1.3);
    popText(G.potX, POT_Y - 60, 'DUBBLA POÄNG!', COL.yellow, true);
    G.flash = 0.6; G.flashCol = COL.yellow;
    sfxBonus();
    return;
  }
  if (d.good) {
    G.combo++;
    G.bestCombo = Math.max(G.bestCombo, G.combo);
    G.caught++;

    // hemliga föremål
    if (d.key === 'spoke') {
      findSecret('spoke');
      G.mood = 'ouch'; G.moodT = 0.5;
      burst(it.x, POT_Y + 24, '#cfc8e4', 22, 1.2);
    } else if (d.key === 'oga') {
      findSecret('oga');
      G.tripleN = 5;
      popText(G.potX, POT_Y - 96, 'ÖGAT SER DIG', '#3a7d8c', true);
      burst(it.x, POT_Y + 24, '#3a7d8c', 20, 1.1);
    }

    var mult = (G.doubleT > 0 ? 2 : 1) * (isNight() ? 2 : 1) * (G.tripleN > 0 ? 3 : 1);
    var gain = Math.round(d.pts * mult * (1 + Math.min(G.combo, 15) * 0.1));
    G.score += gain;
    if (G.tripleN > 0 && !d.secret) G.tripleN--;
    if (!d.secret) { G.mood = 'yum'; G.moodT = 0.45; }
    burst(it.x, POT_Y + 24, d.hot ? COL.red : COL.green, 12, 0.9);
    popText(it.x, POT_Y - 20, '+' + gain, d.hot ? COL.red : isNight() ? '#c9a6ff' : COL.green);
    if (G.combo >= 3 && G.combo % 3 === 0) popText(G.potX, POT_Y - 90, 'KOMBO x' + G.combo + '!', COL.orange, true);
    sfxCatch(G.combo);

    // MIDNATT: kombo x13 släcker ljuset
    if (G.combo === 13) {
      findSecret('midnatt');
      startNight(20);
      popText(G.potX, POT_Y - 150, 'MIDNATT', '#c9a6ff', true);
    }
    // KOKBOKEN: 666 poäng
    if (!G.kokbok && G.score >= 666) {
      G.kokbok = true;
      findSecret('kokbok');
      G.maxLives = 5;
      G.lives = Math.min(G.maxLives, G.lives + 1);
      G.flash = 0.8; G.flashCol = COL.red;
      startNight(Math.max(8, G.nightT));
      popText(G.potX, POT_Y - 130, 'DEN FÖRBJUDNA KOKBOKEN', COL.red, true);
    }

    var newLevel = Math.floor(G.caught / 10) + 1;
    if (newLevel > G.level) { G.level = newLevel; G.levelBanner = 1.8; sfxLevel(); }
  } else {
    G.lives--;
    G.combo = 0;
    G.mood = 'ouch'; G.moodT = 1.0;
    G.shake = 1;
    G.flash = 0.7; G.flashCol = COL.red;
    burst(it.x, POT_Y + 24, '#4a4a4a', 18, 1.1);
    popText(G.potX, POT_Y - 60, pick(['BLÄÄ!', 'USCH!', 'ÄCKLIGT!', 'INTE MAT!']), COL.red, true);
    sfxBad();
    if (G.lives <= 0) {
      G.lives = 0;
      state = 'over'; G.over = 0;
      if (G.score > G.best) {
        G.best = G.score;
        try { localStorage.setItem('eskil_best', String(G.best)); } catch (e) {}
      }
      setTimeout(sfxOver, 320);
    }
  }
}

/* ============================================================
   RITNING
   ============================================================ */
var FONT = '"Comic Sans MS", "Chalkboard SE", casual, "Segoe Print", "Bradley Hand", cursive, sans-serif';

function crayonText(c, text, x, y, size, color, rot, align) {
  c.save();
  c.translate(x, y);
  if (rot) c.rotate(rot);
  c.font = '700 ' + size + 'px ' + FONT;
  c.textAlign = align || 'center';
  c.textBaseline = 'middle';
  c.lineJoin = 'round';
  c.globalAlpha = 0.28;
  c.lineWidth = size * 0.14;
  c.strokeStyle = color;
  c.strokeText(text, 0, 0);
  c.globalAlpha = 1;
  c.fillStyle = color;
  c.fillText(text, 0, 0);
  c.restore();
}

/** Titel med en färg per bokstav och lite skakighet — som på teckningen.
    Krymper automatiskt så den alltid får plats på bredden. */
function titleText(c, text, x, y, size, wobble, maxW) {
  c.save();
  c.textAlign = 'center'; c.textBaseline = 'middle';
  var widths, total, guard = 0;
  do {
    c.font = '700 ' + size + 'px ' + FONT;
    widths = []; total = 0;
    for (var i = 0; i < text.length; i++) {
      var wch = c.measureText(text[i]).width + size * 0.06;
      widths.push(wch); total += wch;
    }
    if (maxW && total > maxW) size *= 0.92; else break;
  } while (guard++ < 30);
  var cx = x - total / 2;
  for (var j = 0; j < text.length; j++) {
    var col = TITLE_COLORS[j % TITLE_COLORS.length];
    var wob = Math.sin(G.t * 2.2 + j * 0.8) * (wobble || 0);
    c.save();
    c.translate(cx + widths[j] / 2, y + wob);
    c.rotate(Math.sin(j * 1.7) * 0.07);
    c.globalAlpha = 0.3; c.lineWidth = size * 0.13; c.strokeStyle = col; c.lineJoin = 'round';
    c.strokeText(text[j], 0, 0);
    c.globalAlpha = 1; c.fillStyle = col;
    c.fillText(text[j], 0, 0);
    c.restore();
    cx += widths[j];
  }
  c.restore();
}

function drawSteam(c) {
  c.save();
  c.strokeStyle = '#b9b9b9';
  c.lineWidth = 5;
  for (var i = 0; i < G.steam.length; i++) {
    var s = G.steam[i];
    c.globalAlpha = 0.3 * (1 - s.age / s.life);
    c.beginPath();
    c.arc(s.x, s.y, s.r, 0.6, 5.2);
    c.stroke();
  }
  c.restore();
}

function drawPot(c) {
  var bob = Math.sin(G.t * 3) * 3;
  var lean = clamp(G.potVX * 0.00035, -0.06, 0.06);
  c.save();
  c.translate(G.potX, POT_Y + bob);
  c.rotate(lean);
  drawSprite(c, potBack, 0, POT_H / 2 - 20, 1);
  var sp = G.mood === 'yum' ? eskilYum : G.mood === 'ouch' ? eskilOuch : eskilNormal;
  var jump = G.mood === 'yum' ? -8 : 0;
  var ey = -120 + jump + Math.sin(G.t * 2.4) * 2;
  drawSprite(c, sp, 0, ey, 1);

  // i mörkret lyser ögonen
  if (isNight() && G.mood !== 'ouch') {
    c.save();
    c.globalAlpha = G.night * (0.7 + Math.sin(G.t * 6) * 0.2);
    c.fillStyle = '#ffe680';
    c.beginPath(); c.ellipse(-16, ey - 6, 7, 8, 0, 0, 6.3); c.fill();
    c.beginPath(); c.ellipse(16, ey - 6, 7, 8, 0, 0, 6.3); c.fill();
    c.restore();
  }

  // musen från MÖSSAN-hemligheten sitter på kanten
  if (hasSecret('mossan')) {
    drawSprite(c, mouseSpr, 104, 12 + Math.sin(G.t * 2.8) * 2, 1, -0.12);
  }

  drawSprite(c, potFront, 0, POT_H / 2 - 20, 1);
  c.restore();
}

function drawItems(c) {
  for (var i = 0; i < G.items.length; i++) {
    var it = G.items[i];
    var wob = Math.sin(G.t * 4 + it.wob) * 4;
    // i mörkret får allt en svag gloria så även kängan syns
    if (G.night > 0) {
      c.save();
      c.globalAlpha = G.night * 0.16;
      c.fillStyle = '#c9bfe8';
      c.beginPath(); c.arc(it.x, it.y, 48, 0, 6.3); c.fill();
      c.restore();
    }
    if (it.def.bonus || it.def.secret) {
      c.save();
      c.globalAlpha = 0.35 + Math.sin(G.t * 8) * 0.15;
      c.fillStyle = it.def.key === 'spoke' ? '#b9aee0' : it.def.key === 'oga' ? '#5fb3c4' : COL.yellow;
      c.beginPath(); c.arc(it.x, it.y, 52, 0, 6.3); c.fill();
      c.restore();
    }
    c.save();
    if (it.def.key === 'spoke') c.globalAlpha = 0.72 + Math.sin(G.t * 5 + it.wob) * 0.16;
    drawSprite(c, it.def.spr, it.x + wob, it.y, it.scale, it.rot);
    c.restore();
  }
}

function drawParticles(c) {
  for (var i = 0; i < G.parts.length; i++) {
    var p = G.parts[i];
    c.save();
    c.globalAlpha = clamp(1 - p.age / p.life, 0, 1) * 0.9;
    c.translate(p.x, p.y);
    c.rotate(p.rot);
    c.strokeStyle = p.col;
    c.lineWidth = p.r * 0.7;
    c.lineCap = 'round';
    c.beginPath();
    c.moveTo(-p.r, 0); c.lineTo(p.r, 0);
    c.stroke();
    c.restore();
  }
  for (var j = 0; j < G.pops.length; j++) {
    var po = G.pops[j];
    var k = 1 - po.age / po.life;
    c.save();
    c.globalAlpha = clamp(k * 1.4, 0, 1);
    var sc = po.big ? 1 + (1 - k) * 0.25 : 1;
    crayonText(c, po.text, po.x, po.y, (po.big ? 40 : 30) * sc, po.col, Math.sin(po.age * 6) * 0.05);
    c.restore();
  }
}

function drawHud(c) {
  crayonText(c, 'POÄNG ' + G.score, 34, 54, 34, inkCol(), -0.02, 'left');
  crayonText(c, 'BÄST ' + G.best, 34, 96, 22, greyCol(), -0.02, 'left');
  crayonText(c, 'NIVÅ ' + G.level, VW / 2, 54, 30, isNight() ? '#9ec3ff' : COL.blue, 0.02);
  var slots = Math.max(3, G.maxLives);
  for (var i = 0; i < slots; i++) {
    c.save();
    c.globalAlpha = i < G.lives ? 1 : 0.18;
    drawSprite(c, heartSpr, VW - 150 + (i - (slots - 3)) * 46, 100, 0.85, Math.sin(G.t * 3 + i) * 0.06);
    c.restore();
  }
  c.save();
  c.globalAlpha = 0.75;
  crayonText(c, muted ? 'LJUD AV' : 'LJUD PÅ', VW - 56, 50, 20, inkCol());
  c.restore();

  var badgeY = 156;   // under hjärtraden
  if (G.doubleT > 0) {
    crayonText(c, 'x2  ' + G.doubleT.toFixed(1) + 's', VW / 2, badgeY, 28 * (1 + Math.sin(G.t * 10) * 0.06), COL.yellow, 0);
    badgeY += 40;
  }
  if (isNight()) {
    crayonText(c, 'MIDNATT  ' + Math.max(0, G.nightT).toFixed(1) + 's', VW / 2, badgeY, 28, '#c9a6ff', 0);
    badgeY += 40;
  }
  if (G.tripleN > 0) {
    crayonText(c, 'ÖGAT  x3  (' + G.tripleN + ')', VW / 2, badgeY, 28, '#5fb3c4', 0);
  }
  if (G.combo >= 3) {
    var nara = G.combo >= 10 && G.combo < 13 && !hasSecret('midnatt');
    crayonText(c, 'KOMBO x' + G.combo, VW / 2, VH - 44, 30, nara ? '#a06fd0' : COL.orange, Math.sin(G.t * 4) * 0.03);
  }
  if (G.levelBanner > 0) {
    c.save();
    c.globalAlpha = clamp(G.levelBanner / 0.4, 0, 1);
    titleText(c, 'NIVÅ ' + G.level + '!', VW / 2, VH * 0.32, 74, 4, VW - 80);
    c.restore();
  }
}

function drawTitle(c) {
  titleText(c, 'ESKIL I GRYTAN', VW / 2, 150, 92, 5, VW - 60);
  crayonText(c, 'Fånga maten i grytan!', VW / 2, 236, 34, inkCol(), -0.01);
  if (G.best > 0) crayonText(c, 'REKORD: ' + G.best, VW / 2, 292, 30, isNight() ? '#c9a6ff' : COL.purple, -0.02);

  var y0 = 356;
  drawSprite(c, SPR.morot, VW / 2 - 168, y0, 0.72, -0.15);
  drawSprite(c, SPR.tomat, VW / 2 - 80, y0, 0.72, 0.1);
  crayonText(c, '= poäng', VW / 2 + 60, y0, 32, COL.green);
  drawSprite(c, SPR.kanga, VW / 2 - 168, y0 + 92, 0.72, 0.12);
  drawSprite(c, SPR.bomb, VW / 2 - 80, y0 + 92, 0.72, -0.1);
  crayonText(c, '= aj då!', VW / 2 + 60, y0 + 92, 32, COL.red);
  drawSprite(c, SPR.sked, VW / 2 - 124, y0 + 184, 0.72, 0.06);
  crayonText(c, '= dubbla poäng', VW / 2 + 66, y0 + 184, 32, COL.yellow);

  c.save();
  c.globalAlpha = 0.6 + Math.sin(G.t * 4) * 0.4;
  crayonText(c, 'TRYCK FÖR ATT SPELA', VW / 2, 640, 46, COL.red, 0.01);
  c.restore();
  crayonText(c, 'Dra fingret · piltangenter', VW / 2, 690, 26, greyCol());

  // hemligheterna: liten rad nere i hörnet
  var n = secretCount();
  c.save();
  c.globalAlpha = n > 0 ? 0.95 : 0.55;
  crayonText(c, 'MÖRKA HEMLIGHETER  ' + n + '/' + SECRETS.length, 34, VH - 44, 24,
    n > 0 ? '#7b4fa8' : greyCol(), -0.015, 'left');
  c.restore();
}

/** Listan över hemligheter. Hittade visar sin text, resten en ledtråd. */
function drawSecrets(c) {
  c.save();
  c.globalAlpha = 0.93;
  c.fillStyle = isNight() ? '#231d33' : COL.paper;
  c.fillRect(24, 120, VW - 48, VH - 300);
  c.restore();
  rough(c, [[30, 124], [VW - 30, 128], [VW - 34, VH - 186], [34, VH - 190]],
    { color: inkCol(), width: 6, passes: 2, jit: 3, rng: makeRng(4242), close: true });

  titleText(c, 'MÖRKA HEMLIGHETER', VW / 2, 196, 60, 3, VW - 110);
  crayonText(c, secretCount() + ' av ' + SECRETS.length + ' funna', VW / 2, 250, 26, greyCol());

  for (var i = 0; i < SECRETS.length; i++) {
    var s = SECRETS[i], y = 316 + i * 118, got = hasSecret(s.key);
    var col = got ? TITLE_COLORS[(i * 2) % TITLE_COLORS.length] : greyCol();

    c.save();
    c.globalAlpha = got ? 1 : 0.75;
    crayonText(c, (i + 1) + '.', 62, y, 30, col, 0, 'left');
    crayonText(c, got ? s.namn : '? ? ?', 108, y, 34, col, got ? -0.01 : 0, 'left');
    c.restore();

    c.save();
    c.globalAlpha = got ? 0.9 : 0.6;
    // radbryt ledtråden så den får plats
    var ord = (got ? s.text : s.hint).split(' ');
    var rad = '', rader = [];
    for (var w = 0; w < ord.length; w++) {
      var test = rad ? rad + ' ' + ord[w] : ord[w];
      if (test.length > 42) { rader.push(rad); rad = ord[w]; } else rad = test;
    }
    if (rad) rader.push(rad);
    for (var r = 0; r < rader.length && r < 3; r++) {
      crayonText(c, rader[r], 108, y + 32 + r * 26, 21, got ? inkCol() : greyCol(), 0, 'left');
    }
    c.restore();
  }

  c.save();
  c.globalAlpha = 0.55 + Math.sin(G.t * 4) * 0.35;
  crayonText(c, 'TRYCK FÖR ATT STÄNGA', VW / 2, VH - 226, 26, isNight() ? '#9ec3ff' : COL.blue);
  c.restore();
}

/** Kort som visar en nyss upptäckt hemlighet. */
function drawReveal(c) {
  var k = clamp(G.revealT / 0.5, 0, 1) * clamp((3.6 - G.revealT) / 0.35, 0, 1);
  var y = VH * 0.30;
  c.save();
  c.globalAlpha = 0.95 * k;
  c.fillStyle = isNight() ? '#241d36' : COL.paper;
  c.fillRect(46, y - 96, VW - 92, 214);
  c.restore();

  c.save();
  c.globalAlpha = k;
  rough(c, [[52, y - 92], [VW - 52, y - 88], [VW - 56, y + 112], [56, y + 108]],
    { color: '#7b4fa8', width: 6, passes: 2, jit: 3, rng: makeRng(777), close: true });
  crayonText(c, 'MÖRK HEMLIGHET FUNNEN', VW / 2, y - 56, 26, '#a06fd0');
  titleText(c, G.reveal.namn, VW / 2, y - 4, 58, 3, VW - 160);
  var ord = G.reveal.text.split(' '), rad = '', rader = [];
  for (var w = 0; w < ord.length; w++) {
    var test = rad ? rad + ' ' + ord[w] : ord[w];
    if (test.length > 38) { rader.push(rad); rad = ord[w]; } else rad = test;
  }
  if (rad) rader.push(rad);
  for (var r = 0; r < rader.length && r < 3; r++) {
    crayonText(c, rader[r], VW / 2, y + 44 + r * 28, 22, inkCol());
  }
  c.restore();
}

function drawOver(c) {
  c.save();
  c.globalAlpha = 0.87;
  c.fillStyle = isNight() ? '#231d33' : COL.paper;
  c.fillRect(24, VH * 0.16, VW - 48, VH * 0.52);
  c.restore();
  rough(c, [[30, VH * 0.16], [VW - 30, VH * 0.17], [VW - 34, VH * 0.68], [34, VH * 0.67]], { color: inkCol(), width: 6, passes: 2, jit: 3, rng: makeRng(999), close: true });

  titleText(c, 'SLUT!', VW / 2, VH * 0.24, 86, 4, VW - 120);
  crayonText(c, 'Grytan är full av skräp...', VW / 2, VH * 0.31, 28, greyCol());
  crayonText(c, 'POÄNG', VW / 2, VH * 0.38, 34, inkCol());
  crayonText(c, String(G.score), VW / 2, VH * 0.44, 84, COL.red, -0.02);
  crayonText(c, 'Bästa kombo: x' + G.bestCombo + '   ·   Nivå: ' + G.level, VW / 2, VH * 0.50, 26, greyCol());
  crayonText(c, 'Mörka hemligheter: ' + secretCount() + '/' + SECRETS.length, VW / 2, VH * 0.535, 24, '#a06fd0');
  if (G.score >= G.best && G.score > 0) {
    crayonText(c, 'NYTT REKORD!', VW / 2, VH * 0.585, 42, COL.yellow, Math.sin(G.t * 5) * 0.04);
  } else {
    crayonText(c, 'REKORD: ' + G.best, VW / 2, VH * 0.585, 32, isNight() ? '#c9a6ff' : COL.purple);
  }
  if (G.over > 0.8) {
    c.save();
    c.globalAlpha = 0.55 + Math.sin(G.t * 4) * 0.45;
    crayonText(c, 'TRYCK FÖR ATT SPELA IGEN', VW / 2, VH * 0.63, 32, COL.blue);
    c.restore();
  }
}

function render() {
  var c = ctx;
  c.save();
  c.scale(canvas.width / VW, canvas.height / VH);

  var sh = G.shake > 0 ? G.shake * 14 : 0;
  if (sh) c.translate(rand(-sh, sh), rand(-sh, sh));

  c.drawImage(paper, 0, 0, VW, VH);

  // MIDNATT: papperet svartnar, kritorna blir det enda som syns
  if (G.night > 0) {
    c.save();
    c.globalAlpha = G.night * 0.965;
    c.fillStyle = '#140f1e';
    c.fillRect(0, 0, VW, VH);
    c.globalAlpha = G.night * 0.07;
    c.globalCompositeOperation = 'screen';
    c.drawImage(paper, 0, 0, VW, VH);   // kritkladdet lyser svagt igenom
    c.restore();
  }

  c.drawImage(G.night > 0.5 ? stoveNight : stove, 0, VH - 300, VW, 300);

  drawSteam(c);
  if (state === 'title') drawTitle(c);
  drawItems(c);
  drawPot(c);
  drawParticles(c);

  if (state === 'play') drawHud(c);
  if (state === 'over') { drawHud(c); drawOver(c); }
  if (state === 'secrets') drawSecrets(c);

  if (G.whisper > 0) {
    c.save();
    c.globalAlpha = clamp(G.whisper / 1.2, 0, 1) * 0.8;
    crayonText(c, 'elden minns alla som stått i grytan', VW / 2, VH - 150, 26, '#e08a4a', Math.sin(G.t * 2) * 0.02);
    c.restore();
  }
  if (G.reveal && G.revealT > 0) drawReveal(c);

  if (G.flash > 0) {
    c.save();
    c.globalAlpha = G.flash * 0.35;
    c.fillStyle = G.flashCol;
    c.fillRect(0, 0, VW, VH);
    c.restore();
  }
  c.restore();
}

/* ---------- loop ---------- */
var last = 0;
function frame(ts) {
  if (!last) last = ts;
  var dt = Math.min((ts - last) / 1000, 0.05);
  last = ts;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- paus ---------- */
document.addEventListener('visibilitychange', function () {
  if (document.hidden) { dragging = false; last = 0; }
});
document.addEventListener('pause', function () { dragging = false; }, false);
document.addEventListener('resume', function () { last = 0; }, false);

/* ---------- testkrok, bara med ?dbg i adressen ---------- */
if (/[?&]dbg\b/.test(location.search)) {
  window.__dbg = {
    G: G,
    state: function () { return state; },
    setState: function (s) { state = s; },
    secrets: function () { return Object.keys(secretsFound); },
    /* släpp ett bestämt föremål rakt över grytan */
    slapp: function (key) {
      var alla = INGREDIENTS.concat(JUNK, [BONUS, SPOKE, OGA]);
      for (var i = 0; i < alla.length; i++) {
        if (alla[i].key === key) {
          G.items.push({ def: alla[i], x: G.potX, y: -60, vy: 300, vx: 0, rot: 0, vr: 0, scale: 1, wob: 0 });
          return true;
        }
      }
      return false;
    },
    /* autopilot: sikta grytan på det ätbara som är närmast botten */
    auto: function (on) {
      if (!on) { clearInterval(window.__autoId); window.__autoId = 0; return; }
      window.__autoId = setInterval(function () {
        var best = null;
        for (var i = 0; i < G.items.length; i++) {
          var it = G.items[i];
          if (!it.def.good) continue;
          if (!best || it.y > best.y) best = it;
        }
        if (best) G.targetX = best.x;
      }, 16);
    }
  };
}

/* ---------- ikonrendering (används av byggskriptet) ---------- */
window.__renderIcon = function (size, pad) {
  pad = pad == null ? 0 : pad;                 // marginal i andel, för adaptiva ikoner
  var cv = document.createElement('canvas');
  cv.width = cv.height = size;
  var c = cv.getContext('2d');
  c.scale(size / 512, size / 512);

  c.fillStyle = COL.paper;
  c.fillRect(0, 0, 512, 512);
  c.drawImage(paper, 0, 260, 720, 720, 0, 0, 512, 512);   // pappersstruktur

  c.save();
  c.translate(256, 256);
  var s = 1.24 * (1 - pad * 2);
  c.scale(s, s);

  // lite mat runt omkring
  drawSprite(c, SPR.morot, -168, -128, 0.92, -0.35);
  drawSprite(c, SPR.tomat, 158, -142, 0.92, 0.28);
  drawSprite(c, SPR.broccoli, -178, 44, 0.8, 0.3);
  drawSprite(c, SPR.chili, 176, 40, 0.8, -0.25);

  drawSprite(c, potBack, 0, 108, 1);
  drawSprite(c, eskilYum, 0, -78, 1);
  drawSprite(c, potFront, 0, 108, 1);
  c.restore();

  return cv.toDataURL('image/png');
};

/* ---------- Cordova (laddas bara i appen) ---------- */
if (location.protocol === 'file:' || location.hostname === 'localhost') {
  var cdv = document.createElement('script');
  cdv.src = 'cordova.js';
  cdv.onerror = function () {};
  document.head.appendChild(cdv);
  document.addEventListener('deviceready', function () {
    if (window.screen && screen.orientation && screen.orientation.lock) {
      try { screen.orientation.lock('portrait'); } catch (e) {}
    }
  }, false);
}

})();
</script>
