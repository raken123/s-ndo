# XcodeGen-spec. Ett .xcodeproj i git blir en konfliktmaskin — den här filen
# är läsbar och genererar projektet i stället:
#
#   brew install xcodegen && cd ios && xcodegen generate
#
# Det är också vad .github/workflows/ios-ipa.yml gör innan den bygger.
name: SandoElev
options:
  bundleIdPrefix: se.sando
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

targets:
  # Reglerna — Monni och det delade lagret — ligger i ett eget bibliotek.
  # Testerna kan då köras utan testvärd: de startar aldrig appen, och en app
  # som inte startar kan inte hänga testkörningen. Det gör dem också snabba.
  SandoKarna:
    type: framework
    platform: iOS
    sources:
      - path: Karna/Sources/SandoKarna
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.sando.elev.karna
        GENERATE_INFOPLIST_FILE: "YES"

  SandoElev:
    type: application
    platform: iOS
    sources:
      - path: SandoElev
    dependencies:
      - target: SandoKarna
    info:
      path: SandoElev/Info.plist
      properties:
        CFBundleDisplayName: Sändo Elev
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.sando.elev
        INFOPLIST_FILE: SandoElev/Info.plist
        CODE_SIGN_ENTITLEMENTS: SandoElev/SandoElev.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "NO"

schemes:
  SandoElev:
    build:
      targets:
        SandoElev: all
        SandoKarna: all
