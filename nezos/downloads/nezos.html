<style>
:root {
  color-scheme: dark; /* dark native controls (selects, scrollbars) in WebKit/Safari too */
  --bg: #0b0d17;
  --bg-2: #11142280;
  --panel: #151827;
  --panel-2: #1b1f33;
  --line: #262b45;
  --ink: #eef0ff;
  --muted: #9aa0c3;
  --dim: #6b7096;
  --brand: #7c5cff;
  --brand-2: #3ad1ff;
  --ok: #3ddc97;
  --warn: #ffc857;
  --bad: #ff6b81;
  --radius: 14px;
  --font: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
img { max-width: 100%; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 18px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--panel-2); color: var(--ink); font-weight: 600; cursor: pointer; text-decoration: none;
  transition: transform .1s, background .15s, border-color .15s; white-space: nowrap;
}
.btn:hover { border-color: #3a4170; background: #22274080; }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: linear-gradient(135deg, var(--brand), #5b7cff); border-color: transparent; color: #fff; box-shadow: 0 6px 24px #7c5cff40; }
.btn-primary:hover { background: linear-gradient(135deg, #8b6dff, #6a89ff); border-color: transparent; }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-sm { padding: 6px 12px; font-size: 13px; border-radius: 8px; }
.btn-lg { padding: 14px 26px; font-size: 16px; border-radius: 12px; }

.input, select.input, textarea.input {
  color-scheme: dark;
  width: 100%; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--line);
  background: #0f1220; color: var(--ink); outline: none; transition: border-color .15s, box-shadow .15s;
}
.input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px #7c5cff33; }
label.field { display: block; margin-bottom: 14px; }
label.field > span { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }

.badge { white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: #7c5cff22; color: #c3b5ff; border: 1px solid #7c5cff44; }
.badge-credits { background: #3ad1ff18; color: #9fe9ff; border-color: #3ad1ff40; }

/* ---------- nav */
.nav { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 22px; padding: 14px 32px; background: #0b0d17cc; backdrop-filter: blur(14px); border-bottom: 1px solid #ffffff0d; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 19px; letter-spacing: -.02em; text-decoration: none; }
.nav .links { display: flex; gap: 20px; margin-left: 18px; }
.nav .links a { text-decoration: none; color: var(--muted); font-weight: 500; }
.nav .links a:hover { color: var(--ink); }
.nav .right { margin-left: auto; display: flex; gap: 10px; align-items: center; }

/* ---------- landing */
.hero { position: relative; padding: 96px 32px 72px; text-align: center; overflow: hidden; }
.hero::before { content: ''; position: absolute; inset: -40% -10% auto; height: 760px; background: radial-gradient(closest-side, #7c5cff40, transparent 70%), radial-gradient(closest-side at 70% 40%, #3ad1ff26, transparent 70%); pointer-events: none; }
.hero h1 { position: relative; font-size: clamp(40px, 6vw, 76px); line-height: 1.02; letter-spacing: -.04em; margin: 18px auto; max-width: 900px; font-weight: 900; }
.hero h1 .grad { background: linear-gradient(90deg, #b9a6ff, #6ee0ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero p.lead { position: relative; color: var(--muted); font-size: 19px; max-width: 640px; margin: 0 auto 30px; }
.hero .cta { position: relative; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.hero .note { position: relative; margin-top: 14px; font-size: 13px; color: var(--dim); }

.mock { position: relative; max-width: 1100px; margin: 56px auto 0; border-radius: 18px; border: 1px solid var(--line); background: #10131f; box-shadow: 0 40px 120px #00000080, 0 0 0 1px #ffffff08 inset; overflow: hidden; text-align: left; }
.mock .bar { display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.mock .bar i { width: 10px; height: 10px; border-radius: 50%; background: #2a2f4a; display: inline-block; }
.mock .bar .tool { padding: 4px 10px; border-radius: 6px; background: #1b1f33; color: var(--ink); font-weight: 600; }
.mock .body { display: grid; grid-template-columns: 180px 1fr 280px; height: 380px; }
.mock .layers { border-right: 1px solid var(--line); padding: 12px; font-size: 12px; color: var(--muted); }
.mock .layers div { padding: 5px 8px; border-radius: 6px; }
.mock .layers div.sel { background: #7c5cff33; color: #fff; }
.mock canvas { width: 100%; height: 100%; display: block; }
.mock .chat { border-left: 1px solid var(--line); padding: 14px; display: flex; flex-direction: column; gap: 10px; font-size: 13px; }
.mock .chat .m { padding: 9px 12px; border-radius: 12px; background: #1b1f33; }
.mock .chat .m.u { background: #7c5cff; color: #fff; align-self: flex-end; max-width: 85%; }
.mock .chat .compose { margin-top: auto; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); color: var(--dim); }

section.block { padding: 88px 32px; max-width: 1180px; margin: 0 auto; }
section.block h2 { font-size: clamp(30px, 4vw, 44px); letter-spacing: -.03em; margin: 0 0 10px; text-align: center; }
section.block p.sub { text-align: center; color: var(--muted); margin: 0 auto 44px; max-width: 620px; }
.features { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; }
.feature { padding: 22px; border-radius: var(--radius); background: var(--panel); border: 1px solid var(--line); }
.feature .ic { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; font-size: 20px; background: #7c5cff22; margin-bottom: 14px; }
.feature h3 { margin: 0 0 6px; font-size: 17px; }
.feature p { margin: 0; color: var(--muted); font-size: 14px; }

.pricing { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.plan { position: relative; display: flex; flex-direction: column; padding: 22px 20px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); }
.plan.hot { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand), 0 20px 60px #7c5cff30; }
.plan.current { border-color: var(--ok); }
.plan .ribbon { position: absolute; top: -11px; left: 50%; transform: translateX(-50%); padding: 3px 12px; border-radius: 999px; background: var(--brand); font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
.plan h3 { margin: 0; font-size: 18px; }
.plan .tag { color: var(--muted); font-size: 13px; min-height: 40px; margin: 6px 0 14px; }
.plan .price { font-size: 38px; font-weight: 900; letter-spacing: -.03em; }
.plan .price small { font-size: 14px; color: var(--muted); font-weight: 500; }
.plan ul { list-style: none; padding: 0; margin: 16px 0 20px; display: grid; gap: 8px; font-size: 13.5px; color: #cfd3f2; flex: 1; }
.plan li::before { content: '✓'; color: var(--ok); font-weight: 800; margin-right: 8px; }

footer.foot { padding: 40px 32px; border-top: 1px solid #ffffff0d; color: var(--dim); font-size: 13px; display: flex; gap: 20px; justify-content: space-between; flex-wrap: wrap; }

/* ---------- auth */
.auth-wrap { min-height: 100vh; display: grid; place-items: center; padding: 32px; background: radial-gradient(800px 500px at 50% -10%, #7c5cff30, transparent); }
.auth-card { width: 100%; max-width: 420px; padding: 34px; border-radius: 20px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 30px 80px #00000060; }
.auth-card h1 { margin: 14px 0 4px; font-size: 26px; letter-spacing: -.02em; }
.auth-card p.sub { margin: 0 0 22px; color: var(--muted); }
.auth-card .switch { margin-top: 18px; text-align: center; color: var(--muted); font-size: 14px; }
.auth-card .switch a { color: #b9a6ff; font-weight: 600; text-decoration: none; cursor: pointer; }
.err { color: var(--bad); font-size: 14px; min-height: 20px; margin-bottom: 8px; }
.perk { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 10px; background: #3ddc9714; border: 1px solid #3ddc9733; color: #a5f3cf; font-size: 13px; margin-bottom: 18px; }

/* ---------- dashboard */
.dash { max-width: 1180px; margin: 0 auto; padding: 32px; }
.dash-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 26px; }
.dash-head h1 { margin: 0; font-size: 30px; letter-spacing: -.02em; }
.tabs { display: flex; gap: 4px; padding: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; width: fit-content; margin-bottom: 22px; }
.tabs button { padding: 8px 16px; border: 0; background: transparent; border-radius: 9px; color: var(--muted); font-weight: 600; cursor: pointer; }
.tabs button.on { background: var(--panel-2); color: var(--ink); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 26px; }
.stat { padding: 18px; border-radius: var(--radius); background: var(--panel); border: 1px solid var(--line); }
.stat .k { color: var(--muted); font-size: 13px; font-weight: 600; }
.stat .v { font-size: 28px; font-weight: 800; letter-spacing: -.02em; margin-top: 4px; }
.projects { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
.proj { border-radius: var(--radius); background: var(--panel); border: 1px solid var(--line); overflow: hidden; text-decoration: none; display: flex; flex-direction: column; transition: border-color .15s, transform .15s; }
.proj:hover { border-color: #444b80; transform: translateY(-2px); }
.proj .thumb { aspect-ratio: 16/10; background: linear-gradient(135deg, #1d2140, #121528); display: grid; place-items: center; color: var(--dim); font-size: 34px; }
.proj .thumb img { width: 100%; height: 100%; object-fit: cover; }
.proj .meta { padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.proj .meta b { font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.proj .meta small { color: var(--dim); font-size: 12px; }
.proj.new { border-style: dashed; align-items: center; justify-content: center; min-height: 200px; color: var(--muted); font-weight: 600; cursor: pointer; background: transparent; }
.proj.new span { font-size: 34px; color: var(--brand); }
.icon-btn { border: 0; background: transparent; color: var(--dim); cursor: pointer; padding: 4px 6px; border-radius: 6px; }
.icon-btn:hover { background: #ffffff10; color: var(--ink); }
table.tx { width: 100%; border-collapse: collapse; font-size: 14px; }
table.tx th, table.tx td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); }
table.tx th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
.pos { color: var(--ok); font-weight: 700; } .neg { color: var(--bad); font-weight: 700; }

/* ---------- models page */
.model-group { margin-bottom: 30px; }
.model-group h3 { margin: 0 0 12px; display: flex; align-items: center; gap: 10px; }
.model-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.model-card { padding: 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.model-card .id { font-family: var(--mono); font-size: 12px; color: var(--dim); word-break: break-all; }
.model-card .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
.model-card.locked { opacity: .62; }
.lock { color: var(--warn); font-weight: 700; }

/* ---------- modal + toasts */
.modal-back { position: fixed; inset: 0; z-index: 100; background: #05060cb0; backdrop-filter: blur(4px); display: grid; place-items: center; padding: 20px; animation: fade .15s; }
.modal { width: 100%; max-width: 480px; max-height: calc(100vh - 40px); overflow: auto; border-radius: 18px; background: var(--panel); border: 1px solid var(--line); padding: 24px; box-shadow: 0 30px 90px #000a; }
.modal h2 { margin: 0 0 6px; font-size: 20px; }
.modal p.sub { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
.modal .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
@keyframes fade { from { opacity: 0; } }
.toasts { position: fixed; z-index: 200; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { padding: 10px 16px; border-radius: 10px; background: #22263d; border: 1px solid var(--line); box-shadow: 0 10px 30px #0008; font-size: 14px; font-weight: 500; animation: fade .2s; transition: opacity .3s, transform .3s; max-width: 90vw; }
.toast.out { opacity: 0; transform: translateY(6px); }
.toast-error { border-color: #ff6b8155; background: #3a1d28; }
.toast-ok { border-color: #3ddc9755; background: #183126; }

@media (max-width: 860px) {
  .nav .links { display: none; }
  .mock .body { grid-template-columns: 1fr; }
  .mock .layers, .mock .chat { display: none; }
}

body.studio { height: 100vh; overflow: hidden; display: flex; flex-direction: column; background: #0e1018; font-size: 13px; }

/* ---------------- top bar */
.topbar { height: 50px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 10px; background: #151827; border-bottom: 1px solid var(--line); }
.tb-logo { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 8px; }
.tb-logo:hover { background: #ffffff10; }
.tb-name { width: 170px; padding: 6px 8px; border: 1px solid transparent; border-radius: 7px; background: transparent; font-weight: 700; font-size: 14px; outline: none; }
.tb-name:hover { border-color: var(--line); }
.tb-name:focus { border-color: var(--brand); background: #0f1220; }
.tb-save { color: var(--dim); font-size: 11.5px; min-width: 54px; }
.tb-group { display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 9px; background: #0f1220; border: 1px solid var(--line); }
.tb-btn { width: 30px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); cursor: pointer; font-size: 15px; }
.tb-btn:hover { background: #ffffff10; color: var(--ink); }
.tb-btn.on { background: var(--brand); color: #fff; }
.tb-btn:disabled { opacity: .35; cursor: default; background: transparent; }
.tb-create { background: transparent; border: 0; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tb-tool { display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: #d6d9f3; font-weight: 600; cursor: pointer; white-space: nowrap; }
.tb-tool i { font-style: normal; font-size: 15px; }
.tb-tool b { font-size: 9px; color: var(--dim); }
.tb-tool:hover, .dd.open > .tb-tool { background: #ffffff12; }
.tb-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.tb-right .badge-credits { text-decoration: none; }

.dd { position: relative; }
.dd-menu { display: none; position: fixed; z-index: 50; min-width: 230px; padding: 6px; border-radius: 12px; background: #1b1f33; border: 1px solid #333a5e; box-shadow: 0 18px 50px #000a; }
.dd.open .dd-menu { display: block; }
.dd-menu button { display: block; width: 100%; text-align: left; padding: 8px 10px; border: 0; border-radius: 7px; background: transparent; cursor: pointer; font-weight: 500; }
.dd-menu button:hover { background: #7c5cff33; }
.dd-menu hr { border: 0; border-top: 1px solid var(--line); margin: 5px 2px; }

/* ---------------- workspace */
.workspace { flex: 1; min-height: 0; display: grid; grid-template-columns: 230px 1fr 270px 370px; }
.panel { background: #151827; border-right: 1px solid var(--line); overflow: auto; min-height: 0; }
.panel.chat { border-right: 0; border-left: 1px solid var(--line); display: flex; flex-direction: column; overflow: clip; min-width: 0; background: #121522; }
.panel.inspector { border-left: 1px solid var(--line); border-right: 0; }
.panel-head { position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between; align-items: center; padding: 10px 12px 8px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); background: #151827; }
.panel-head .count { font-weight: 600; }

.layers { padding: 0 6px 10px; }
.layer { display: flex; align-items: center; gap: 7px; padding: 5px 8px; border-radius: 7px; cursor: pointer; color: #cdd1ee; user-select: none; }
.layer:hover { background: #ffffff0a; }
.layer.sel { background: #7c5cff40; color: #fff; }
.layer .ic { width: 16px; text-align: center; opacity: .85; }
.layer .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.layer .eye { opacity: 0; border: 0; background: transparent; cursor: pointer; padding: 0 2px; color: var(--muted); }
.layer:hover .eye, .layer .eye.off { opacity: 1; }
.layer .eye.off { color: var(--dim); }
.layer.special { color: var(--muted); }
.layer.hidden-obj .nm { opacity: .5; }
.layer input { flex: 1; min-width: 0; padding: 2px 4px; border-radius: 4px; border: 1px solid var(--brand); background: #0f1220; outline: none; }

.assets { padding: 0 10px 14px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.asset { aspect-ratio: 1; border-radius: 7px; background: #0f1220 center/cover no-repeat; border: 1px solid var(--line); cursor: pointer; display: grid; place-items: center; font-size: 18px; position: relative; overflow: hidden; }
.asset:hover { border-color: var(--brand); }
.assets .empty { grid-column: 1/-1; color: var(--dim); font-size: 12px; padding: 4px 2px; }

/* ---------------- viewport */
.viewport-wrap { position: relative; min-width: 0; background: #0b0d17; }
.viewport { position: absolute; inset: 0; }
.viewport canvas { display: block; outline: none; }
.vp-hint { position: absolute; left: 12px; bottom: 10px; color: #ffffff70; font-size: 11.5px; pointer-events: none; text-shadow: 0 1px 3px #000; }
.play-layer { position: absolute; inset: 0; z-index: 10; background: #000; }
.play-layer iframe { width: 100%; height: 100%; border: 0; display: block; }
.play-bar { position: absolute; right: 10px; bottom: 10px; z-index: 2; display: flex; gap: 6px; align-items: center; padding: 5px 6px 5px 12px; border-radius: 12px; background: #151827e6; border: 1px solid var(--line); box-shadow: 0 8px 30px #0008; }
.play-status { font-weight: 700; color: var(--ok); margin-right: 6px; }
.play-status.testing { color: var(--warn); }

.console { position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 12; max-height: 34%; display: flex; flex-direction: column; border-radius: 12px; background: #0f1220f2; border: 1px solid var(--line); box-shadow: 0 10px 40px #000a; }
.console-head { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--line); }
.console-head span { color: var(--dim); margin-right: auto; }
.console-body { overflow: auto; padding: 6px 10px; font: 12px/1.5 var(--mono); }
.console-body .l-error { color: var(--bad); }
.console-body .l-event { color: var(--brand-2); }

/* ---------------- inspector */
.insp { padding: 4px 12px 20px; }
.insp h4 { margin: 14px 0 8px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); display: flex; justify-content: space-between; align-items: center; }
.insp .title { display: flex; align-items: center; gap: 8px; margin: 12px 0 4px; }
.insp .title input { flex: 1; min-width: 0; font-weight: 700; font-size: 14px; }
.insp .type { color: var(--dim); font-size: 12px; }
.row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.row > label { width: 64px; flex: none; color: var(--muted); font-size: 12px; }
.row .grow { flex: 1; min-width: 0; }
.v3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; flex: 1; }
.num { position: relative; }
.num span { position: absolute; left: 6px; top: 50%; transform: translateY(-50%); font-size: 10px; font-weight: 700; color: var(--dim); pointer-events: none; }

.f { width: 100%; padding: 5px 6px; border-radius: 6px; border: 1px solid transparent; background: #0f1220; outline: none; font-size: 12px; }
.num .f { padding-left: 17px; }

.f:focus { border-color: var(--brand); }

.chip-btn.danger:hover { border-color: var(--bad); color: var(--bad); }
.btn-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.tex-preview { width: 100%; aspect-ratio: 2/1; border-radius: 8px; background: #0f1220 center/cover; border: 1px solid var(--line); margin-bottom: 6px; }

/* ---------------- chat */
.chat-head { padding: 12px 12px 8px; border-bottom: 1px solid var(--line); }
.chat-title { font-weight: 800; font-size: 14px; display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.chat-title .spark { color: var(--brand); }
.modes { display: flex; flex-wrap: wrap; gap: 5px; }
.mode { padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-weight: 600; font-size: 11.5px; cursor: pointer; }
.mode:hover { color: var(--ink); }
.mode.on { background: #7c5cff; border-color: #7c5cff; color: #fff; }
.mode .lk { font-size: 10px; margin-left: 3px; }

.messages { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 14px 12px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 100%; }
.msg.user { align-self: flex-end; max-width: 88%; padding: 9px 12px; border-radius: 14px 14px 4px 14px; background: #7c5cff; color: #fff; white-space: pre-wrap; word-wrap: break-word; }

.msg .ops { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.op { padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; background: #3ddc9718; color: #8ff0c4; border: 1px solid #3ddc9733; }
.op.rm { background: #ff6b8118; color: #ffb3c0; border-color: #ff6b8133; }
.op.up { background: #3ad1ff14; color: #9fe9ff; border-color: #3ad1ff33; }
.link-btn { border: 0; background: transparent; color: #b9a6ff; cursor: pointer; font-weight: 600; font-size: 11px; padding: 0; }
.link-btn:hover { text-decoration: underline; }
.sugs { display: flex; flex-direction: column; gap: 5px; margin-top: 8px; }

.code-area { width: 100%; height: 52vh; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: #0b0d17; color: #e6e8ff; font: 12.5px/1.55 var(--mono); tab-size: 2; resize: vertical; outline: none; white-space: pre; }

.preview-img { width: 100%; border-radius: 10px; border: 1px solid var(--line); margin-top: 10px; display: block; }
.radio-row { display: flex; flex-wrap: wrap; gap: 6px; }

.progress { height: 6px; border-radius: 99px; background: #0f1220; overflow: hidden; margin-top: 12px; }

ton>\n    \u003cdiv class=\"dd\">\n      \u003cbutton class=\"tb-tool\" data-menu=\"scene\">\u003ci>🌄\u003c/i>\u003cspan class=\"lbl\">Scene\u003c/span>\u003cb>▾\u003c/b>\u003c/button>\n      \u003cdiv class=\"dd-menu\" data-for=\"scene\">\n        \u003cbutton data-act=\"ai-scene\">✨ Generate scene with AI…\u003c/button>\n        \u003cbutton data-act=\"ai-game\">🎮 Generate a whole game…\u003c/button>\n        \u003cbutton data-act=\"scene-settings\">⚙ Scene settings\u003c/button>\n        \u003cbutton data-act=\"sky\">🌌 AI skybox…\u003c/button>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"dd\">\n      \u003cbutton class=\"tb-tool\" data-menu=\"light\">\u003ci>💡\u003c/i>\u003cspan class=\"lbl\">Light\u003c/span>\u003cb>▾\u003c/b>\u003c/button>\n      \u003cdiv class=\"dd-menu\" data-for=\"light\">\n        \u003cbutton data-light=\"directional\">☀ Sun (directional)\u003c/button>\u003cbutton data-light=\"point\">💡 Point\u003c/button>\n        \u003cbutton data-light=\"spot\">🔦 Spot\u003c/button>\u003cbutton data-light=\"hemisphere\">🌗 Hemisphere\u003c/button>\n      \u003c/div>\n    \u003c/div>\n    \u003cbutton class=\"tb-tool\" data-add=\"text\">\u003ci>🔤\u003c/i>\u003cspan class=\"lbl\">Text\u003c/span>\u003c/button>\n    \u003cbutton class=\"tb-tool\" data-act=\"audio\">\u003ci>🎙️\u003c/i>\u003cspan class=\"lbl\">Audio\u003c/span>\u003c/button>\n    \u003cbutton class=\"tb-tool\" data-act=\"video\">\u003ci>🎬\u003c/i>\u003cspan class=\"lbl\">Video\u003c/span>\u003c/button>\n    \u003cbutton class=\"tb-tool\" data-act=\"script\">\u003ci>⌨️\u003c/i>\u003cspan class=\"lbl\">Code\u003c/span>\u003c/button>\n    \u003cdiv class=\"dd\">\n      \u003cbutton class=\"tb-tool\" data-menu=\"more\">\u003ci>⋯\u003c/i>\u003cspan class=\"lbl\">More\u003c/span>\u003cb>▾\u003c/b>\u003c/button>\n      \u003cdiv class=\"dd-menu\" data-for=\"more\">\n        \u003cbutton data-act=\"ai-architect\">🧭 Architect a game plan…\u003c/button>\n        \u003cbutton data-act=\"playtest\">🧪 AI playtest\u003c/button>\n        \u003cbutton data-act=\"export\">⬇ Export HTML game\u003c/button>\n        \u003cbutton data-act=\"share\">🔗 Share playable link\u003c/button>\n        \u003cbutton data-act=\"shortcuts\">⌨ Keyboard shortcuts\u003c/button>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"tb-right\">\n    \u003cbutton class=\"tb-btn\" id=\"undoBtn\" title=\"Undo (Ctrl+Z)\">↶\u003c/button>\n    \u003cbutton class=\"tb-btn\" id=\"redoBtn\" title=\"Redo (Ctrl+Shift+Z)\">↷\u003c/button>\n    \u003cbutton class=\"btn btn-sm tb-playtest\" data-act=\"playtest\" title=\"Let the AI playtest your game\">🧪 Playtest\u003c/button>\n    \u003cbutton class=\"btn btn-primary btn-sm\" id=\"playBtn\">▶ Play\u003c/button>\n    \u003ca class=\"badge badge-credits\" id=\"credits\" href=\"/dashboard#plans\" title=\"Credits, click to get more\">— cr\u003c/a>\n  \u003c/div>\n\u003c/header>\n\n\u003cdiv class=\"workspace\">\n  \u003caside class=\"panel left\">\n    \u003cdiv class=\"panel-head\">\u003cspan>Layers\u003c/span>\u003cspan class=\"count\" id=\"layerCount\">\u003c/span>\u003c/div>\n    \u003cdiv class=\"layers\" id=\"layers\">\u003c/div>\n    \u003cdiv class=\"panel-head\">\u003cspan>Assets\u003c/span>\u003c/div>\n    \u003cdiv class=\"assets\" id=\"assets\">\u003c/div>\n  \u003c/aside>\n\n  \u003cmain class=\"viewport-wrap\">\n    \u003cdiv class=\"viewport\" id=\"viewport\">\u003c/div>\n    \u003cdiv class=\"vp-hint\" id=\"vpHint\">Click to select · drag to orbit · right-drag to pan · scroll to zoom\u003c/div>\n    \u003cdiv class=\"play-layer\" id=\"playLayer\" hidden>\n      \u003cdiv class=\"play-bar\">\n        \u003cspan class=\"play-status\" id=\"playStatus\">▶ Playing\u003c/span>\n        \u003cbutton class=\"btn btn-sm\" id=\"restartBtn\">↻ Restart\u003c/button>\n        \u003cbutton class=\"btn btn-sm\" id=\"fullBtn\">⛶\u003c/button>\n        \u003cbutton class=\"btn btn-sm\" id=\"stopBtn\">■ Stop\u003c/button>\n fQo=\"}}\u003c/script>\n\u003c/head>\n\u003cbody>\n\u003cdiv id=\"game\">\u003c/div>\n\u003cscript type=\"module\">\n// Runs inside a sandboxed iframe (opaque origin): game scripts can't touch the\n// studio, the user's session or the API. We only talk via postMessage.\nimport { Runtime, attachPlaytester } from '@nz/public/js/engine/engine.js';\n\nconst container = document.getElementById('game');\nconst post = (msg) => window.parent.postMessage(msg, '*');\nlet rt = null;\n\nwindow.addEventListener('error', (e) => post({ type: 'log', level: 'error', text: e.message }));\nwindow.addEventListener('unhandledrejection', (e) => post({ type: 'log', level: 'error', text: String(e.reason?.message || e.reason) }));\n\nwindow.addEventListener('message', (e) => {\n  if (e.source !== window.parent) return;\n  const { type, scene, options = {} } = e.data || {};\n  if (type === 'load') {\n    rt?.dispose();\n    rt = new Runtime(container, scene, {\n      preserveDrawingBuffer: !!options.playtest,\n      onLog: (level, text) => post({ type: 'log', level, text }),\n      onEvent: (event, data) => post({ type: 'event', event, data }),\n    });\n    rt.renderer.domElement.focus();\n    if (options.playtest) {\n      attachPlaytester(rt, { duration: options.duration || 12, onDone: (report) => post({ type: 'report', report }) });\n    }\n  }\n  if (type === 'stop') { rt?.dispose(); rt = null; }\n  if (type === 'focus') rt?.renderer.domElement.focus();\n});\npost({ type: 'ready' });\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","engineSource":"// Nezos engine: turns a scene document (plain JSON) into three.js objects and\n// runs game scripts against a small, AI-friendly API. Shared by the studio\n// viewport, the sandboxed play mode and exported games.\nimport * as THREE from 'three';\nimport { OrbitControls } from 'three/addons/controls/OrbitControls.js';\n\nexport { THREE };\n\nconst D2R = Math.PI / 180;\nexport const PRIMITIVES = ['box', 'sphere', 'cylinder', 'cone', 'capsule', 'plane', 'torus'];\n\n// ---------------------------------------------------------------- helpers\nconst vec3 = (v, d) => {\n  if (typeof v === 'number' && Number.isFinite(v)) return [v, v, v];\n  return Array.isArray(v) && v.length === 3 && v.every(Number.isFinite) ? v : d;\n};\n\nexport function applyTransform(obj, spec) {\n  const p = vec3(spec.position, [0, 0, 0]);\n  const r = vec3(spec.rotation, [0, 0, 0]);\n  const s = vec3(spec.scale, [1, 1, 1]);\n  obj.position.set(p[0], p[1], p[2]);\n  obj.rotation.set(r[0] * D2R, r[1] * D2R, r[2] * D2R);\n  obj.scale.set(s[0] || 1e-4, s[1] || 1e-4, s[2] || 1e-4);\n}\n\nexport function readTransform(obj) {\n  const round = (n) => Math.round(n * 1000) / 1000;\n  return {\n    position: obj.position.toArray().map(round),\n    rotation: [obj.rotation.x, obj.rotation.y, obj.rotation.z].map((r) => round(r / D2R)),\n    scale: obj.scale.toArray().map(round),\n  };\n}\n\nconst geoCache = new Map();\nfunction geometry(type) {\n  if (geoCache.has(type)) return geoCache.get(type);\n  let g;\n  switch (type) {\n    case 'sphere': g = new THREE.SphereGeometry(0.5, 32, 16); break;\n    case 'cylinder': g = new THREE.CylinderGeometry(0.5, 0.5, 1, 32); break;\n    case 'cone': g = new THREE.ConeGeometry(0.5, 1, 32); break;\n    case 'capsule': g = new THREE.CapsuleGeometry(0.5, 1, 8, 16); break;\n    case 'plane': g = new THREE.PlaneGeometry(1, 1); g.rotateX(-Math.PI / 2); break;\n    case 'torus': g = new THREE.TorusGeometry(0.4, 0.1, 16, 48); break;\n    case 'quad': g = new THREE.PlaneGeometry(1, 1); break;\n    default: g = new THREE.BoxGeometry(1, 1, 1);\n  }\n  geoCache.set(type, g);\n  return g;\n}\n\nconst texLoader = new THREE.TextureLoader();\ntexLoader.setCrossOrigin('anonymous');\nconst texCache = new Map();\nfunction texture(url, repeat) {\n  const rep = vec3([...(Array.isArray(repeat) ? repeat : [1, 1]), 1], [1, 1, 1]);\n  const key = `${url}|${rep[0]}|${rep[1]}`;\n  if (texCache.has(key)) return texCache.get(key);\n  const t = texLoader.load(url);\n  t.colorSpace = THREE.SRGBColorSpace;\n  if (rep[0] !== 1 || rep[1] !== 1) {\n    t.wrapS = t.wrapT = THREE.RepeatWrapping;\n    t.repeat.set(rep[0], rep[1]);\n  }\n  texCache.set(key, t);\n  return t;\n}\n\nfunction material(spec, { doubleSide = false } = {}) {\n  const opacity = Number.isFinite(spec.opacity) ? spec.opacity : 1;\n  const m = new THREE.MeshStandardMaterial({\n    color: spec.color || (spec.texture ? '#ffffff' : '#9aa4b2'),\n    metalness: Number.isFinite(spec.metalness) ? spec.metalness : 0.05,\n    roughness: Number.isFinite(spec.roughness) ? spec.roughness : 0.75,\n    emissive: spec.emissive || '#000000',\n    emissiveIntensity: Number.isFinite(spec.emissiveIntensity) ? spec.emissiveIntensity : 1,\n    transparent: opacity \u003c 1 || spec.type === 'image',\n    opacity,\n    wireframe: !!spec.wireframe,\n    flatShading: !!spec.flatShading,\n    side: doubleSide ? THREE.DoubleSide : THREE.FrontSide,\n  });\n  if (spec.texture) {\n    m.map = texture(spec.texture, spec.textureRepeat);\n    if (spec.type === 'image') m.alphaTest = 0.02;\n  }\n  return m;\n}\n\nexport function textTexture(value = 'Text', color = '#ffffff', background = null) {\n  const canvas = document.createElement('canvas');\n  const ctx = canvas.getContext('2d');\n  const font = 'bold 96px Inter, system-ui, sans-serif';\n  ctx.font = font;\n  const lines = String(value).split('\\n');\n  const w = Math.max(...lines.map((l) => ctx.measureText(l).width), 10) + 48;\n  const h = lines.length * 112 + 24;\n  canvas.width = Math.ceil(w);\n  canvas.height = Math.ceil(h);\n  ctx.font = font;\n  if (background) { ctx.fillStyle = background; ctx.fillRect(0, 0, canvas.width, canvas.height); }\n  ctx.fillStyle = color;\n  ctx.textBaseline = 'top';\n  ctx.textAlign = 'center';\n  lines.forEach((l, i) => ctx.fillText(l, canvas.width / 2, 12 + i * 112));\n  const t = new THREE.CanvasTexture(canvas);\n  t.colorSpace = THREE.SRGBColorSpace;\n  return { texture: t, aspect ();\n  rt.hooks.afterFrame = () => {\n    report.frames++;\n    if (rt.time >= sampleAt) {\n      sampleAt = rt.time + 1;\n      const p = rt.player || rt.entities.find((e) => e.body === 'dynamic');\n      if (p) report.track.push({ t: +rt.time.toFixed(1), name: p.name, pos: p.position.toArray().map((n) => +n.toFixed(2)), grounded: p.grounded });\n    }\n    if ((performance.now() - started) / 1000 >= duration) {\n      rt.hooks.afterFrame = null;\n      rt.hooks.beforeFrame = null;\n      for (const k of held) rt.input.release(k);\n      const fps = report.fpsSamples;\n      report.fps = fps.length ? { avg: Math.round(fps.reduce((a, b) => a + b, 0) / fps.length), min: Math.round(Math.min(...fps)) } : null;\n      delete report.fpsSamples;\n      report.endEntities = rt.entities.length;\n      report.ui = rt.ui.api.snapshot();\n      report.drawCalls = rt.renderer.info.render.calls;\n      report.triangles = rt.renderer.info.render.triangles;\n      try {\n        const c = document.createElement('canvas');\n        const src = rt.renderer.domElement;\n        const scale = 512 / Math.max(src.width, src.height);\n        c.width = Math.round(src.width * scale);\n        c.height = Math.round(src.height * scale);\n        c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);\n        report.screenshot = c.toDataURL('image/jpeg', 0.7);\n      } catch { /* tainted canvas */ }\n      onDone(report);\n    }\n  };\n}\n","threeCdn":"https://cdn.jsdelivr.net/npm/three@0.180.0"}</script>
