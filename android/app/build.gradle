plugins {
    id 'com.android.application'
}

android {
    namespace 'com.raken.bfdia5b'
    compileSdk 34

    defaultConfig {
        applicationId "com.raken.bfdia5b"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

// No dependencies on purpose: the whole game runs on the framework Canvas API.
dependencies {
}
