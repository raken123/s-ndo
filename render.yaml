# One-click deploy of Hub AI Cloud on Render (render.com): New → Blueprint,
# pick this repository and branch. You'll be asked for the API key.
services:
  - type: web
    name: hub-ai-cloud
    runtime: docker
    dockerContext: ./hub-ai/cloud
    dockerfilePath: ./hub-ai/cloud/Dockerfile
    plan: starter            # a disk (below) needs a paid instance
    healthCheckPath: /v1/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: HUBAI_ADMIN_KEY
        generateValue: true
    disk:
      name: hubai-data
      mountPath: /data
      sizeGB: 1
