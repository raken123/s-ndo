var DUR = 39000;
function fmtTime(sec) {
  sec = Math.max(0, Math.ceil(sec));
  return Math.floor(sec / 60) + ':' + (sec % 60 < 10 ? '0' : '') + (sec % 60);
}

function render(t) {
  /* ---- kameraskak vid skriket ---- */
  var shake = 0;
  if (t > 4300 && t < 5400) shake = (1 - (t - 4300) / 1100) * 16;
  var stage = document.getElementById('stage');
  stage.style.setProperty('--shake', shake);
  scene.setAttribute('transform', shake > 0
    ? 'translate(' + (Math.sin(t / 26) * shake) + ',' + (Math.cos(t / 19) * shake * 0.6) + ')' : '');

  /* ---- cringe-mätaren ---- */
  var cringe = 12;
  if (t < 4200) cringe = 12 + Math.sin(t / 400) * 4;
  else if (t < 6300) cringe = lerp(14, 46, p(t, 4200, 6300, 'out'));
  else if (t < 7900) cringe = lerp(46, 98, p(t, 6300, 7900, 'out'));
  else if (t < 17000) cringe = 98;
  else if (t < 27000) cringe = 30 + Math.sin(t / 500) * 10;
  else cringe = 18;
  cringe = Math.round(cringe);
  cringeNum.textContent = cringe;
  var ccol = cringe >= 85 ? C.red : cringe >= 70 ? C.orange : cringe >= 45 ? C.amber : C.green;
  cringeNum.setAttribute('fill', ccol);
  cringeBar.setAttribute('width', Math.max(6, cringe * 2.9));
  cringeBar.setAttribute('fill', ccol);
  cringeLbl.textContent = cringe >= 85 ? 'SUPER CRINGE' : cringe >= 70 ? 'Rejält trams' : cringe >= 45 ? 'Stimmigt' : 'Lugnt';
  cringeLbl.setAttribute('fill', ccol);
  spark.setAttribute('stroke', ccol);
  var pts = [];
  for (var si = 0; si <= 40; si++) {
    var tt = t - (40 - si) * 90;
    var v = tt < 4200 ? 12 + Math.sin(tt / 400) * 4
      : tt < 6300 ? lerp(14, 46, clamp((tt - 4200) / 2100, 0, 1))
      : tt < 7900 ? lerp(46, 98, clamp((tt - 6300) / 1600, 0, 1))
      : tt < 17000 ? 98 : tt < 27000 ? 30 + Math.sin(tt / 500) * 10 : 18;
    pts.push((620 + si * 7.2).toFixed(1) + ',' + (455 - v * 0.66).toFixed(1));
  }
  spark.setAttribute('d', 'M' + pts.join(' L'));
  boardMsg.textContent = t < 6300 ? 'Lyssnar tyst · lokalt läge'
    : t < 8200 ? 'Hörde: skrik i klassrummet'
    : t < 28400 ? 'Utvisning pågår' : 'Lyssnar tyst · lokalt läge';
  sideTime.textContent = fmtTime(1334 - t / 1000);

  /* trafikljuset följer cringe */
  lampRed.setAttribute('fill', cringe >= 85 ? '#ef4444' : '#3a4256');
  lampYel.setAttribute('fill', cringe >= 45 && cringe < 85 ? '#facc15' : '#3a4256');
  lampGrn.setAttribute('fill', cringe < 45 ? C.green : '#3a4256');

  /* ---- larmoverlay ---- */
  var alarmOn = fade(t, 8200, 17400, 260);
  show(alarmG, alarmOn);
  alarmTime.textContent = fmtTime(300 - (t - 8200) / 1000);
  alarmSub.setAttribute('opacity', 0.6 + 0.4 * Math.abs(Math.sin(t / 300)));

  /* ---- lekläget på tavlan ---- */
  var funOn = fade(t, 17600, 31500, 400);
  show(funG, funOn);
  show(wTrams, 1 - Math.max(alarmOn, funOn));
  show(wSide, 1 - Math.max(alarmOn, funOn));
  wheelSpin.setAttribute('transform', 'rotate(' + (t / 3) % 360 + ')');
  diceFace.textContent = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'][Math.floor(t / 420) % 6];
  scoreA.textContent = 3 + Math.floor(clamp((t - 18000) / 2200, 0, 5));
  scoreB.textContent = 2 + Math.floor(clamp((t - 19000) / 2600, 0, 4));

  /* ---- Milo ---- */
  var miloX = 790, miloY = 880, miloS = 1.15, miloVis = 1;
  milo.setMood(t > 4150 && t < 6600 ? 'skrik' : t > 6600 && t < 13000 ? 'ledsen' : t > 30000 ? 'glad' : 'neutral');
  if (t > 4150 && t < 6600) {
    miloY = 880 - 46 - Math.abs(Math.sin(t / 90)) * 10;                    /* reser sig och skriker */
    milo.armL.setAttribute('transform', 'rotate(-40,-40,26)');
    milo.armR.setAttribute('transform', 'rotate(40,40,26)');
  } else {
    milo.armL.setAttribute('transform', '');
    milo.armR.setAttribute('transform', '');
  }
  if (t >= 6600 && t < 10400) { miloY = 834; }
  if (t >= 10400 && t < 13000) {                                            /* går ut, framför bänkarna */
    if (t < 11500) {
      var wa = p(t, 10400, 11500, 'linear');
      miloX = lerp(790, 1640, wa);
      miloY = 940 + Math.abs(Math.sin(t / 110)) * 10;
      miloS = 1.15;
    } else {
      var wb = p(t, 11500, 12700, 'linear');
      miloX = lerp(1640, 1430, wb);
      miloY = lerp(940, 706, wb) + Math.abs(Math.sin(t / 110)) * 8;
      miloS = lerp(1.15, 0.8, wb);
    }
    miloVis = 1 - p(t, 12350, 12900);
  }
  if (t >= 13000 && t < 28700) { miloVis = 0; }
  if (t >= 28700) {                                                         /* kommer in igen och sätter sig */
    if (t < 30000) {
      var wc = p(t, 28800, 30000, 'linear');
      miloX = lerp(1430, 1640, wc);
      miloY = lerp(706, 940, wc) + Math.abs(Math.sin(t / 120)) * 8;
      miloS = lerp(0.8, 1.15, wc);
    } else {
      var wd = p(t, 30000, 31600, 'linear');
      miloX = lerp(1640, 790, wd);
      miloY = 940 - wd * 60 + (wd < 1 ? Math.abs(Math.sin(t / 120)) * 8 : 0);
      miloS = 1.15;
    }
    miloVis = p(t, 28700, 29100);
  }
  show(miloG, miloVis);
  move(miloG, miloX, miloY, miloS);

  /* ---- dörren ---- */
  var doorOpen = Math.max(fade(t, 12100, 13400, 250), fade(t, 28300, 29400, 250));
  doorPanel.setAttribute('transform', 'translate(' + (1430 * doorOpen * 0) + ',0) scale(' + (1 - doorOpen * 0.86) + ',1)');
  doorPanel.setAttribute('transform-origin', '1336px 480px');
  doorDark.setAttribute('opacity', doorOpen);

  /* ---- läraren ---- */
  var tTalk = t > 30600 && t < 33400;
  tMouth.setAttribute('d', tTalk && Math.floor(t / 150) % 2 ? 'M-13,-14 q13,16 26,0' : 'M-13,-16 q13,9 26,0');
  tArm.setAttribute('transform', tTalk ? 'rotate(' + (-30 + Math.sin(t / 200) * 12) + ',45,30)' :
    (t > 6800 && t < 10200 ? 'rotate(-52,45,30)' : ''));
  teacher.setAttribute('transform', 'translate(0,' + (Math.sin(t / 900) * 3) + ')');

  /* övriga elever tittar och lever lite */
  backKids.concat(frontKids).forEach(function (k, i) {
    var bob = Math.sin(t / 700 + i) * 3;
    k.head.setAttribute('transform', 'translate(' + (t > 4200 && t < 7000 ? 6 : 0) + ',' + bob + ')');
    k.setMood(t > 17600 && t < 31500 ? 'glad' : t > 4200 && t < 7000 ? 'ledsen' : 'neutral');
  });

  /* ---- pratbubblor ---- */
  var mb = fade(t, 4250, 6800, 260);
  show(miloBubble, mb);
  move(miloBubble, 1480, 300 - (1 - p(t, 4250, 4600, 'out')) * 40, 0.9 + 0.1 * p(t, 4250, 4600, 'out'));
  var tb = fade(t, 30700, 33300, 300);
  show(teacherBubble, tb);
  move(teacherBubble, 700, 250 - (1 - p(t, 30700, 31000, 'out')) * 30);

  /* ---- installationskortet ---- */
  var inst = fade(t, 13600, 17500, 350);
  show(installG, inst);
  var pop = p(t, 13600, 14100, 'out');
  move(instCard, 960 * (1 - (0.9 + 0.1 * pop)), 540 * (1 - (0.9 + 0.1 * pop)), 0.9 + 0.1 * pop);
  var pulse = 1 + Math.sin(t / 180) * 0.02 * (t < 14700 ? 1 : 0);
  instBtn.setAttribute('transform', 'translate(' + (960 * (1 - pulse)) + ',' + (668 * (1 - pulse)) + ') scale(' + pulse + ')');
  var fingerIn = fade(t, 14000, 16000, 250);
  show(fingerG, fingerIn);
  var press = t < 14700 ? p(t, 14200, 14700, 'out') : 1 - p(t, 14700, 15100, 'out');
  move(fingerG, 1180, 700 + 90 - press * 60);
  var rip = p(t, 14680, 15200, 'out');
  ripple.setAttribute('opacity', t > 14680 && t < 15250 ? (1 - rip) : 0);
  ripple.setAttribute('r', 10 + rip * 130);
  ripple.setAttribute('cx', 1180); ripple.setAttribute('cy', 668);
  var prog = p(t, 14800, 16300, 'linear');
  instProg.setAttribute('opacity', t > 14800 && t < 16500 ? 1 : (t >= 16500 ? 1 : 0));
  instProg.setAttribute('width', 800 * (t >= 16400 ? 1 : prog));
  show(instDone, p(t, 16400, 16700));

  /* ---- hallen och delad bild ---- */
  var hall = fade(t, 17800, 28600, 400);
  show(hallG, hall);
  move(hallG, -660 * (1 - p(t, 17800, 18400, 'out')) + (t > 28100 ? -660 * p(t, 28100, 28600, 'in') : 0), 0);
  hallSplitLine.setAttribute('opacity', hall);
  hallTime.textContent = fmtTime(300 - (t - 8200) / 1000);
  hallKidG.setAttribute('transform', 'translate(330,' + (756 + Math.sin(t / 800) * 4) + ') scale(1.2)');

  /* ---- bildtexter ---- */
  var capOn = 0;
  if (t > 18600 && t < 23000) { capOn = fade(t, 18600, 23000, 350); capTitle.textContent = 'Inne: 47 komponenter och full fart.'; capSub.textContent = 'Lyckohjul, tärning, bingo, poängtavla, rörelsepauser.'; }
  else if (t > 23200 && t < 27600) { capOn = fade(t, 23200, 27600, 350); capTitle.textContent = 'Ute: fem minuters eftertanke.'; capSub.textContent = 'Tramsdetektorn håller koll — läraren slipper höja rösten.'; }
  else if (t > 8600 && t < 12000) { capOn = fade(t, 8600, 12000, 350); capTitle.textContent = 'Tramsdetektorn hörde det.'; capSub.textContent = 'Cringe-nivå 98 av 100. Utvisad i fem minuter.'; }
  show(capG, capOn);

  /* ---- konfetti ---- */
  var confOn = fade(t, 19000, 27000, 600);
  show(confG, confOn);
  conf.forEach(function (c) {
    var y = ((c.y + (t - 19000) * c.sp / 1000) % 1500) - 200;
    c.el.setAttribute('transform', 'translate(' + c.x + ',' + y + ') rotate(' + (c.rot + t * c.sw / 12) + ')');
  });

  /* ---- slutkort ---- */
  var end = fade(t, 33600, DUR, 500);
  show(endG, end);
  var epop = p(t, 33600, 34400, 'out');
  endLogo.setAttribute('transform', 'translate(' + (960 * (1 - (0.85 + 0.15 * epop))) + ',' + (340 * (1 - (0.85 + 0.15 * epop))) + ') scale(' + (0.85 + 0.15 * epop) + ')');
  var ep = 1 + Math.sin(t / 260) * 0.015;
  endBtn.setAttribute('transform', 'translate(' + (960 * (1 - ep)) + ',' + (855 * (1 - ep)) + ') scale(' + ep + ')');
}

K.play(render, DUR);
</script>
</body>
</html>
