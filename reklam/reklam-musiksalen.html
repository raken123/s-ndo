<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Sändo Tavla — Musiksalen</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #0b0e17; overflow: hidden; }
  #stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px;
    transform-origin: center center; background: #e8e2f5;
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  svg { display: block; }
  text { font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
</style>
</head>
<body>
<div id="stage"><svg id="scene" width="1920" height="1080" viewBox="0 0 1920 1080"></svg></div>
<script src="filmkit.js"></script>
<script src="miljoer.js"></script>
<script>
/* ===================================================================
   Sändo Tavla — "Musiksalen"
   Genrep inför luciatåget — texten på tavlan och turen på skärmen.
   =================================================================== */
var K = Filmkit, M = Miljoer, scene = K.scene, C = K.C, SKIN = K.SKIN, SHIRT = K.SHIRT;
var el = K.el, txt = K.txt, clamp = K.clamp, lerp = K.lerp, p = K.p, fade = K.fade;
var show = K.show, move = K.move, kid = K.kid, bubble = K.bubble;

/* Stående figur med ben */
function person(x, y, s, opts) {
  var g = el('g', {}, scene);
  var k = kid(g, opts || {});
  el('rect', { x: -24, y: 80, width: 18, height: 46, rx: 9, fill: '#2f3a4d' }, k);
  el('rect', { x: 6, y: 80, width: 18, height: 46, rx: 9, fill: '#2f3a4d' }, k);
  g.k = k; g.home = [x, y, s];
  move(g, x, y, s);
  return g;
}
function hop(g, x, y, s, t, fart) {
  move(g, x, y - Math.abs(Math.sin(t / (fart || 130))) * 12, s);
}
function fmt(sec) {
  sec = Math.max(0, Math.ceil(sec));
  return Math.floor(sec / 60) + ':' + (sec % 60 < 10 ? '0' : '') + (sec % 60);
}


M.musiksal();
var sc = K.wallScreen(1120, 120, 740, 440, 'Musiksalen');

/* sångtexten */
var wText = el('g', {}, sc);
var textCard = K.widget(sc, 1150, 210, 680, 200, '🔠 Storskärmstext — Luciasången');
wText.appendChild(textCard);
var rader = ['Natten går tunga fjät', 'runt gård och stuva.', 'Kring jord som sol förlät,', 'skuggorna ruva.'];
var radTxt = [];
rader.forEach(function (r, i) {
  radTxt.push(txt(r, { x: 1490, y: 274 + i * 34, 'text-anchor': 'middle', 'font-size': 24, 'font-weight': 700, fill: C.muted }, textCard));
});
var boll = el('circle', { cx: 1490, cy: 250, r: 11, fill: C.amber, opacity: 0 }, textCard);

/* turordning för solon */
var wSolo = K.widget(sc, 1150, 426, 400, 106, '🎤 Turordning — solon');
var soloNu = txt('Nu: Iris', { x: 1170, y: 482, 'font-size': 24, 'font-weight': 800, fill: C.brand }, wSolo);
var soloSen = txt('Sedan: Ali · Sara', { x: 1330, y: 482, 'font-size': 18, fill: C.muted }, wSolo);
/* timer */
var wTid = K.widget(sc, 1570, 426, 260, 106, '⏳ Genrep');
var tidTxt = txt('12:00', { x: 1700, y: 486, 'text-anchor': 'middle', 'font-size': 34, 'font-weight': 800, fill: C.brand }, wTid);

/* folk */
var larG = el('g', {}, scene);
var lar = K.grownup(larG, '#7c3aed', SKIN[2], '#5b3a1e');
move(larG, 250, 760, 1.15);
var kor = [];
[[640, 800, 1.0], [800, 810, 1.0], [960, 800, 1.0], [1120, 810, 1.0]].forEach(function (b, i) {
  kor.push(person(b[0], b[1], b[2], { skin: SKIN[i + 1], shirt: SHIRT[i + 2], hair: ['#3b2a1e', '#20242e', '#6b3f1d', '#8a5a2b'][i] }));
});
var iris = person(470, 790, 1.05, { skin: SKIN[4], shirt: '#ec4899', hair: '#8a5a2b' });

var bJag = K.speech(480, 130, ['Får jag verkligen?'], 38, [-40, 300], 620, 430);
var cap = K.captionBar();
var slut = K.endCard('Texten alla ser. Turen alla litar på.', 'Storskärmstext · Turordning · Timer · Stjärnor', 'egMusik');

/* sången: tolv toner från 20,0 s, en halv sekund var */
var SANG = 20000, TON = 500;
var DUR = 38000;
function render(t) {
  tidTxt.textContent = fmt(720 - t / 1000 * 20);
  sc.clock.textContent = '11:' + ('0' + (40 + Math.floor(t / 4000))).slice(-2);
  soloNu.textContent = t < 27000 ? 'Nu: Iris' : 'Nu: Ali';
  soloSen.textContent = t < 27000 ? 'Sedan: Ali · Sara' : 'Sedan: Sara';

  /* bollen studsar över raden som sjungs */
  var sjunger = t >= SANG && t < SANG + 12 * TON;
  boll.setAttribute('opacity', sjunger ? 1 : 0);
  var ton = Math.floor((t - SANG) / TON), rad = clamp(Math.floor(ton / 3), 0, 3);
  radTxt.forEach(function (l, i) {
    l.setAttribute('fill', sjunger && i === rad ? C.ink : C.muted);
    l.setAttribute('font-size', sjunger && i === rad ? 26 : 23);
  });
  if (sjunger) {
    var it = ((t - SANG) % TON) / TON, kol = ton % 3;
    boll.setAttribute('cx', 1330 + kol * 160);
    boll.setAttribute('cy', 274 + rad * 34 - 22 - Math.sin(it * Math.PI) * 26);
  }

  lar.talk((t > 3000 && t < 7000) || (t > 31000 && t < 34000), t);
  lar.arm.setAttribute('transform', sjunger ? 'rotate(' + (-42 + Math.sin(t / 250) * 26) + ',45,30)' : (t > 8000 && t < 9600 ? 'rotate(-56,45,30)' : ''));

  kor.forEach(function (g, i) {
    var b = g.home;
    var gunga = sjunger ? Math.sin(t / 260 + i * 0.6) * 8 : Math.sin(t / 800 + i) * 3;
    move(g, b[0] + gunga, b[1], b[2]);
    g.k.setMood(t > 12000 ? 'glad' : 'neutral');
    g.k.armL.setAttribute('transform', sjunger ? 'rotate(' + (26 + Math.sin(t / 260 + i) * 14) + ',-36,26)' : '');
    g.k.armR.setAttribute('transform', sjunger ? 'rotate(' + (-26 - Math.sin(t / 260 + i) * 14) + ',36,26)' : '');
  });
  /* Iris tvekar, går fram och tar sitt solo */
  var ix = 470, iy = 790, isc = 1.05;
  if (t > 9800 && t < 30000) {
    var w = p(t, 9800, 12000, 'inOut');
    ix = lerp(470, 900, w); iy = lerp(790, 700, w); isc = lerp(1.05, 0.95, w);
  } else if (t >= 30000) {
    var w2 = p(t, 30000, 32000, 'inOut');
    ix = lerp(900, 470, w2); iy = lerp(700, 790, w2); isc = lerp(0.95, 1.05, w2);
  }
  move(iris, ix, iy - (sjunger ? Math.abs(Math.sin(t / 300)) * 6 : 0), isc);
  iris.k.setMood(t < 9000 ? 'ledsen' : 'glad');

  bJag.play(t, 5600, 9200);
  cap.play(t, [
    [1200, 4600, 'Genrep inför luciatåget.', 'Ingen kommer ihåg andra versen. Ingen.'],
    [6000, 9200, 'Iris vill sjunga solot.', 'Men vågar inte säga det högt.'],
    [10400, 13600, 'Turordningen står på tavlan.', 'Iris först, sedan Ali, sedan Sara. Klart.'],
    [21000, 25000, 'Och texten finns där hela tiden.', 'Bollen visar var i sången klassen är.'],
    [27200, 30600, 'Andra versen gick också bra.', 'När alla ser texten vågar fler sjunga.']
  ]);
  slut.play(t, 33000, DUR);
}


K.play(render, DUR);
</script>
</body>
</html>
