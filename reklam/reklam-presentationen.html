<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Sändo Tavla — Presentationen</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #0b0e17; overflow: hidden; }
  #stage {
    position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px;
    transform-origin: center center; background: #eef1f8;
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  svg { display: block; }
  text { font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
</style>
</head>
<body>
<div id="stage"><svg id="scene" width="1920" height="1080" viewBox="0 0 1920 1080"></svg></div>
<script src="filmkit.js"></script>
<script>
/* ===================================================================
   Sändo Tavla — "Presentationen"
   Vera ska redovisa idag. Presentationen ligger hemma. Läxan också.
   =================================================================== */
var K = Filmkit, scene = K.scene, C = K.C, SKIN = K.SKIN, SHIRT = K.SHIRT;
var el = K.el, txt = K.txt, clamp = K.clamp, lerp = K.lerp, p = K.p, fade = K.fade;
var show = K.show, move = K.move, kid = K.kid, bubble = K.bubble;

/* ---------- klassrum och tavla ---------- */
var R = K.buildRoom();
var doorPanel = R.doorPanel, doorDark = R.doorDark;
var B = K.buildBoard();
var screen = B.screen;
K.boardTopbar(screen);

/* ---------- tavlans innehåll ---------- */
/* Turordning */
var wQueue = el('g', {}, screen);
var qCard = K.widget(screen, 600, 216, 420, 310, '📋 Turordning — redovisningar');
wQueue.appendChild(qCard);
var queueRows = [];
[['Milo', 'Vattnets kretslopp'], ['Vera', 'Vulkaner'], ['Ali', 'Rymden']].forEach(function (r, i) {
  var g = el('g', {}, wQueue);
  el('rect', { x: 620, y: 270, width: 380, height: 68, rx: 12, fill: i === 1 ? '#eef2ff' : '#f7f9fd', stroke: i === 1 ? C.brand : C.line, 'stroke-width': i === 1 ? 3 : 2 }, g);
  el('circle', { cx: 654, cy: 304, r: 20, fill: i === 1 ? C.brand : '#dfe5f2' }, g);
  var num = txt(String(i + 1), { x: 654, y: 311, 'text-anchor': 'middle', 'font-size': 19, 'font-weight': 800, fill: i === 1 ? '#fff' : C.muted }, g);
  txt(r[0], { x: 686, y: 300, 'font-size': 22, 'font-weight': 700, fill: C.ink }, g);
  txt(r[1], { x: 686, y: 324, 'font-size': 16, fill: C.muted }, g);
  g.num = num;
  g.circle = g.querySelector('circle');
  g.box = g.querySelector('rect');
  queueRows.push(g);
});
var queueNote = txt('', { x: 810, y: 500, 'text-anchor': 'middle', 'font-size': 19, 'font-weight': 700, fill: C.green }, wQueue);

/* Timer bredvid */
var wTimer = K.widget(screen, 1040, 216, 190, 150, '⏳ Förberedelse');
var timerTxt = txt('10:00', { x: 1135, y: 320, 'text-anchor': 'middle', 'font-size': 50, 'font-weight': 800, fill: C.brand }, wTimer);
/* Läxan ligger kvar hela lektionen */
var wLaxa = K.widget(screen, 1040, 386, 190, 140, '📌 Läxa');
txt('Arbetsboken', { x: 1060, y: 442, 'font-size': 18, 'font-weight': 700, fill: C.ink }, wLaxa);
txt('s. 42–43', { x: 1060, y: 470, 'font-size': 22, 'font-weight': 800, fill: C.brand }, wLaxa);
txt('till fredag', { x: 1060, y: 498, 'font-size': 16, fill: C.muted }, wLaxa);

/* AI-Läraren plockar fram stommen */
var wAI = el('g', { opacity: 0 }, screen);
var aiCard = K.widget(screen, 600, 216, 420, 310, '👩‍🏫 AI-Lärare');
wAI.appendChild(aiCard);
el('rect', { x: 620, y: 262, width: 300, height: 30, rx: 9, fill: '#eef2ff' }, aiCard);
txt('📄 Arbetsbok 5B.pdf', { x: 630, y: 283, 'font-size': 14, 'font-weight': 600, fill: C.brand }, aiCard);
txt('“Ge stommen till kapitel 4 — vulkaner.”', { x: 620, y: 322, 'font-size': 18, 'font-weight': 700, fill: C.ink }, aiCard);
var aiBullets = [];
['Vad en vulkan är — en spricka i jordskorpan', 'Magma, lava och aska: vad är skillnaden?', 'Varför vulkaner ligger där de ligger',
 'Ett exempel: Eyjafjallajökull 2010', 'Vad man gör om man bor nära en'].forEach(function (s, i) {
  var b = txt('•  ' + s, { x: 620, y: 360 + i * 32, 'font-size': 17, fill: C.ink, opacity: 0 }, aiCard);
  aiBullets.push(b);
});
var aiSrc = txt('Ur arbetsboken s. 38–43', { x: 620, y: 520, 'font-size': 15, 'font-weight': 700, fill: C.green, opacity: 0 }, aiCard);

/* Veras stödord under redovisningen */
var wNotes = el('g', { opacity: 0 }, screen);
var nCard = K.widget(screen, 600, 216, 630, 310, '📝 Veras stödord — Vulkaner');
wNotes.appendChild(nCard);
var noteLines = [];
['1. En vulkan är en spricka i jordskorpan', '2. Magma blir lava när den når ytan',
 '3. De ligger där jordens plattor möts', '4. Eyjafjallajökull stoppade flygen 2010',
 '5. Man övar, lyssnar på varning och håller sig undan'].forEach(function (s, i) {
  noteLines.push(txt(s, { x: 626, y: 300 + i * 44, 'font-size': 24, fill: C.ink, opacity: 0 }, nCard));
});

/* Stjärna till Vera */
var wStar = el('g', { opacity: 0 }, screen);
var sCard = K.widget(screen, 1040, 216, 190, 150, '⭐ Stjärnor');
wStar.appendChild(sCard);
txt('Vera', { x: 1060, y: 290, 'font-size': 20, 'font-weight': 700, fill: C.ink }, sCard);
var starTxt = txt('⭐⭐⭐', { x: 1060, y: 330, 'font-size': 24 }, sCard);
var starPlus = txt('+1 för att du löste det', { x: 1060, y: 356, 'font-size': 14, 'font-weight': 700, fill: C.green, opacity: 0 }, sCard);

/* Läxan i stort på slutet */
var wLaxaBig = el('g', { opacity: 0 }, screen);
var lCard = K.widget(screen, 600, 216, 630, 310, '📌 Läxa till fredag');
wLaxaBig.appendChild(lCard);
txt('Arbetsboken sidan 42–43', { x: 915, y: 330, 'text-anchor': 'middle', 'font-size': 42, 'font-weight': 800, fill: C.ink }, lCard);
txt('Skriv tre frågor du vill ställa om vulkaner.', { x: 915, y: 386, 'text-anchor': 'middle', 'font-size': 24, fill: C.muted }, lCard);
txt('Står kvar på tavlan hela veckan.', { x: 915, y: 460, 'text-anchor': 'middle', 'font-size': 22, 'font-weight': 700, fill: C.green }, lCard);

/* ---------- människorna ---------- */
var deskRow = el('g', {}, scene);
function desk(x, y, w) {
  var g = el('g', {}, deskRow);
  el('rect', { x: x - w / 2, y: y, width: w, height: 16, rx: 6, fill: '#c68a52' }, g);
  el('rect', { x: x - w / 2 + 10, y: y + 16, width: 12, height: 70, fill: '#a06f3f' }, g);
  el('rect', { x: x + w / 2 - 22, y: y + 16, width: 12, height: 70, fill: '#a06f3f' }, g);
  return g;
}
var backKids = [];
[[700, 690], [900, 690], [1100, 690]].forEach(function (pos, i) {
  var g = el('g', {}, scene);
  var k = kid(g, { skin: SKIN[i % SKIN.length], shirt: SHIRT[i], hair: ['#3b2a1e', '#6b3f1d', '#20242e'][i] });
  move(g, pos[0], pos[1], 0.85);
  backKids.push(k);
  desk(pos[0], pos[1] + 60, 150);
});
/* Vera sitter längst fram till vänster */
var veraG = el('g', {}, scene);
var vera = kid(veraG, { skin: SKIN[4], shirt: '#ec4899', hair: '#8a5a2b' });
move(veraG, 620, 880, 1.1);
var veraDesk = desk(620, 950, 200);
/* ryggsäcken hon letar i */
var bagG = el('g', {}, scene);
el('path', { d: 'M0,0 h96 a14,14 0 0 1 14,14 v86 a14,14 0 0 1 -14,14 h-96 a14,14 0 0 1 -14,-14 v-86 a14,14 0 0 1 14,-14 z', fill: '#2f6fb5' }, bagG);
el('rect', { x: 10, y: 40, width: 76, height: 34, rx: 8, fill: '#255a94' }, bagG);
var bagFlap = el('path', { d: 'M-14,14 h124 v-6 a14,14 0 0 0 -14,-14 h-96 a14,14 0 0 0 -14,14 z', fill: '#1e4f85' }, bagG);
move(bagG, 730, 900, 1);
/* Milo som redovisar */
var miloG = el('g', { opacity: 0 }, scene);
var milo = kid(miloG, { skin: SKIN[1], shirt: SHIRT[1], hair: '#2b1c12' });
move(miloG, 420, 660, 1.0);
/* övriga i främre raden */
var frontKids = [];
[[1010, 880], [1290, 880]].forEach(function (pos, i) {
  var g = el('g', {}, scene);
  var k = kid(g, { skin: SKIN[(i + 2) % SKIN.length], shirt: SHIRT[i + 4], hair: ['#20242e', '#3b2a1e'][i] });
  move(g, pos[0], pos[1], 1.05);
  frontKids.push(k);
  desk(pos[0], pos[1] + 70, 190);
});
/* läraren */
var larareG = el('g', {}, scene);
var larare = K.grownup(larareG, '#0f766e', SKIN[2], '#5b3a1e');
move(larareG, 300, 700, 1.15);

/* ---------- pratbubblor ---------- */
function makeBubble(w, h, lines, size, tail, x, y) {
  var g = el('g', { opacity: 0 }, scene);
  bubble(g, w, h, lines, size, tail);
  g.pos = [x, y];
  return g;
}
var bGlomde = makeBubble(700, 190, ['Jag glömde presentationen…', 'och läxan.'], 44, [-540, 530], 1180, 330);
var bLugn = makeBubble(620, 150, ['Lugn. Vi löser det.'], 42, [-400, 380], 720, 300);
var bMilo = makeBubble(600, 130, ['…och därför rör sig vattnet.'], 38, [-360, 340], 800, 300);
var bBravo = makeBubble(430, 120, ['Bra jobbat!'], 42, [140, 520], 1200, 330);

/* ---------- bildtexter ---------- */
var capG = el('g', { opacity: 0 }, scene);
el('rect', { x: 300, y: 936, width: 1320, height: 118, rx: 26, fill: 'rgba(12,16,28,.86)' }, capG);
var capTitle = txt('', { x: 960, y: 990, 'text-anchor': 'middle', 'font-size': 44, 'font-weight': 800, fill: '#fff' }, capG);
var capSub = txt('', { x: 960, y: 1032, 'text-anchor': 'middle', 'font-size': 27, fill: '#c7cede' }, capG);

/* ---------- slutkort ---------- */
var defs = scene.querySelector('defs');
var eg = el('linearGradient', { id: 'eg4', x1: 0, y1: 0, x2: 1, y2: 1 }, defs);
el('stop', { offset: 0, 'stop-color': '#4f46e5' }, eg);
el('stop', { offset: 1, 'stop-color': '#06b6d4' }, eg);
var endG = el('g', { opacity: 0 }, scene);
el('rect', { x: 0, y: 0, width: 1920, height: 1080, fill: 'url(#eg4)' }, endG);
var endLogo = el('g', {}, endG);
el('rect', { x: 830, y: 190, width: 260, height: 260, rx: 70, fill: '#fff' }, endLogo);
txt('S', { x: 960, y: 400, 'text-anchor': 'middle', 'font-size': 190, 'font-weight': 800, fill: C.brand }, endLogo);
txt('Sändo Tavla', { x: 960, y: 570, 'text-anchor': 'middle', 'font-size': 96, 'font-weight': 800, fill: '#fff' }, endG);
txt('Ingen behöver stå där oförberedd.', { x: 960, y: 640, 'text-anchor': 'middle', 'font-size': 40, fill: '#e6e9ff' }, endG);
txt('Turordning · Timer · AI-Lärare · Anteckningar · Läxan kvar på tavlan', { x: 960, y: 706, 'text-anchor': 'middle', 'font-size': 29, fill: '#dfe3ff' }, endG);
var endBtn = el('g', {}, endG);
el('rect', { x: 560, y: 780, width: 800, height: 110, rx: 30, fill: '#fff' }, endBtn);
txt('INSTALLERA FÖR BRA ELEVER', { x: 960, y: 852, 'text-anchor': 'middle', 'font-size': 42, 'font-weight': 800, fill: C.brand }, endBtn);
txt('Android 8.0+  ·  fungerar offline', { x: 960, y: 940, 'text-anchor': 'middle', 'font-size': 26, fill: '#e6e9ff' }, endG);

/* ===================================================================
   Tidslinjen
   =================================================================== */
var DUR = 41000;
function fmt(sec) {
  sec = Math.max(0, Math.ceil(sec));
  return Math.floor(sec / 60) + ':' + (sec % 60 < 10 ? '0' : '') + (sec % 60);
}
function setBubble(g, t, a, b) {
  var v = fade(t, a, b, 280);
  show(g, v);
  move(g, g.pos[0], g.pos[1] - (1 - p(t, a, a + 350, 'out')) * 30);
}

function render(t) {
  /* ---- Vera letar i väskan och blir förtvivlad ---- */
  var searching = t > 3600 && t < 6400;
  vera.setMood(t < 3600 ? 'neutral' : t < 9800 ? 'ledsen' : t < 25000 ? 'neutral' : 'glad');
  vera.armL.setAttribute('transform', searching ? 'rotate(' + (30 + Math.sin(t / 90) * 22) + ',-36,26)' : '');
  vera.armR.setAttribute('transform', searching ? 'rotate(' + (-30 + Math.cos(t / 95) * 22) + ',36,26)' : '');
  bagFlap.setAttribute('transform', searching || t > 6400 ? 'rotate(-38,-14,14)' : '');
  move(bagG, 762, 872 - (searching ? Math.abs(Math.sin(t / 120)) * 8 : 0), 1);
  show(bagG, 1 - p(t, 19000, 19600));

  /* Vera går fram till tavlan och redovisar */
  var vX = 620, vY = 880, vS = 1.1;
  if (t > 24800 && t < 31600) {
    var w = p(t, 24800, 26200, 'inOut');
    vX = lerp(620, 460, w);
    vY = lerp(880, 700, w);
    vS = lerp(1.1, 1.0, w);
  } else if (t >= 31600) {
    var w2 = p(t, 31600, 33000, 'inOut');
    vX = lerp(460, 620, w2);
    vY = lerp(700, 880, w2);
    vS = lerp(1.0, 1.1, w2);
  }
  move(veraG, vX, vY, vS);
  show(veraDesk, t < 24800 || t > 32600 ? 1 : 0.35);
  /* pratar när hon redovisar */
  if (t > 26400 && t < 31000) {
    vera.mouth.setAttribute('d', Math.floor(t / 160) % 2 ? 'M-14,-18 q14,16 28,0' : 'M-12,-16 q12,8 24,0');
    vera.mouth.setAttribute('fill', Math.floor(t / 160) % 2 ? '#7f1d1d' : 'none');
    vera.armR.setAttribute('transform', 'rotate(' + (-40 + Math.sin(t / 300) * 16) + ',36,26)');
  }

  /* ---- Milo redovisar först ---- */
  show(miloG, fade(t, 18800, 24600, 300));
  milo.setMood('glad');
  if (t > 19200 && t < 24000) {
    milo.mouth.setAttribute('d', Math.floor(t / 170) % 2 ? 'M-14,-18 q14,16 28,0' : 'M-12,-16 q12,8 24,0');
    milo.armR.setAttribute('transform', 'rotate(' + (-36 + Math.cos(t / 320) * 14) + ',36,26)');
  }
  move(miloG, 420, 660 + Math.sin(t / 700) * 3, 1.0);

  /* ---- läraren ---- */
  larare.talk((t > 9600 && t < 12600) || (t > 33200 && t < 35400), t);
  larare.arm.setAttribute('transform',
    (t > 9600 && t < 11200) || (t > 13600 && t < 15000) || (t > 33000 && t < 34400)
      ? 'rotate(-56,45,30)' : '');
  larare.body.setAttribute('transform', 'translate(0,' + Math.sin(t / 900) * 3 + ')');

  /* ---- klasskamraterna ---- */
  backKids.concat(frontKids).forEach(function (k, i) {
    k.head.setAttribute('transform', 'translate(0,' + Math.sin(t / 700 + i) * 3 + ')');
    k.setMood(t > 29500 ? 'glad' : t > 4200 && t < 9600 ? 'ledsen' : 'neutral');
    /* applåder på slutet */
    var clap = t > 29800 && t < 32200;
    k.armL.setAttribute('transform', clap ? 'rotate(' + (34 + Math.sin(t / 70) * 26) + ',-36,26)' : '');
    k.armR.setAttribute('transform', clap ? 'rotate(' + (-34 - Math.sin(t / 70) * 26) + ',36,26)' : '');
  });

  /* ---- tavlan ---- */
  var scQueue = Math.max(fade(t, 0, 18600, 300), 0);
  var scAI = fade(t, 14200, 18600, 350);
  var scNotes = fade(t, 25600, 32600, 350);
  var scLaxa = fade(t, 32900, 37000, 350);
  show(wQueue, Math.min(scQueue, 1 - scAI) * (1 - Math.max(scNotes, scLaxa)));
  show(wAI, scAI * (1 - Math.max(scNotes, scLaxa)));
  show(wNotes, scNotes);
  show(wLaxaBig, scLaxa);
  show(wTimer, Math.max(fade(t, 13400, 25400, 300), 0) * (1 - scLaxa));
  show(wLaxa, (1 - Math.max(fade(t, 13400, 25400, 300), scLaxa)) * fade(t, 0, 37000, 300));
  show(wStar, fade(t, 29600, 32700, 300) * (1 - scLaxa));

  /* turordningen: Vera byter plats till sist */
  var swap = p(t, 10200, 11400, 'inOut');
  queueRows.forEach(function (g, i) {
    var slot = i;
    if (i === 1) slot = lerp(1, 2, swap);
    if (i === 2) slot = lerp(2, 1, swap);
    g.setAttribute('transform', 'translate(0,' + slot * 78 + ')');
    var nr = i === 1 ? Math.round(lerp(2, 3, swap)) : i === 2 ? Math.round(lerp(3, 2, swap)) : 1;
    g.num.textContent = nr;
    /* den som står på tur markeras */
    var upNow = (t < 24600 && nr === 1) || (t >= 24600 && nr === 3);
    g.box.setAttribute('fill', upNow ? '#eef2ff' : '#f7f9fd');
    g.box.setAttribute('stroke', upNow ? C.brand : C.line);
    g.circle.setAttribute('fill', upNow ? C.brand : '#dfe5f2');
    g.num.setAttribute('fill', upNow ? '#fff' : C.muted);
  });
  queueNote.textContent = t > 11400 && t < 18600 ? '↕️ Vera flyttad sist — får tio minuter' : '';

  timerTxt.textContent = fmt(600 - (t - 13600) / 1000 * 60);
  timerTxt.setAttribute('fill', (600 - (t - 13600) / 1000 * 60) < 120 ? C.amber : C.brand);

  /* AI-Lärarens punkter tonar in en och en */
  aiBullets.forEach(function (b, i) {
    b.setAttribute('opacity', p(t, 15400 + i * 420, 15800 + i * 420));
  });
  aiSrc.setAttribute('opacity', p(t, 17700, 18100));
  /* Veras stödord */
  noteLines.forEach(function (l, i) {
    l.setAttribute('opacity', p(t, 26000 + i * 260, 26400 + i * 260));
  });
  starTxt.textContent = t > 30400 ? '⭐⭐⭐⭐' : '⭐⭐⭐';
  starPlus.setAttribute('opacity', p(t, 30400, 30800));

  /* ---- pratbubblor ---- */
  setBubble(bGlomde, t, 5200, 9400);
  setBubble(bLugn, t, 9800, 12600);
  setBubble(bMilo, t, 19600, 23400);
  setBubble(bBravo, t, 30000, 32400);

  /* ---- bildtexter ---- */
  var capOn = 0;
  if (t > 1200 && t < 3800) { capOn = fade(t, 1200, 3800, 300); capTitle.textContent = 'Redovisningsdag i 5B.'; capSub.textContent = 'Vera står som nummer två på tavlan.'; }
  else if (t > 6200 && t < 9200) { capOn = fade(t, 6200, 9200, 300); capTitle.textContent = 'Väskan är tom.'; capSub.textContent = 'Presentationen ligger hemma. Läxan också.'; }
  else if (t > 11600 && t < 14000) { capOn = fade(t, 11600, 14000, 300); capTitle.textContent = 'Turordningen ändras på en sekund.'; capSub.textContent = 'Vera flyttas sist och får tio minuter.'; }
  else if (t > 16000 && t < 18400) { capOn = fade(t, 16000, 18400, 300); capTitle.textContent = 'Stommen finns i hennes egen arbetsbok.'; capSub.textContent = 'AI-Läraren plockar fram fem punkter ur kapitel 4.'; }
  else if (t > 20200 && t < 23600) { capOn = fade(t, 20200, 23600, 300); capTitle.textContent = 'Under tiden redovisar Milo.'; capSub.textContent = 'Timern på tavlan håller reda på Veras tio minuter.'; }
  else if (t > 27200 && t < 29400) { capOn = fade(t, 27200, 29400, 300); capTitle.textContent = 'Och så gick det ändå bra.'; capSub.textContent = 'Stödorden står på tavlan — hon behövde bara berätta.'; }
  else if (t > 33600 && t < 36600) { capOn = fade(t, 33600, 36600, 300); capTitle.textContent = 'Och läxan?'; capSub.textContent = 'Den står kvar på tavlan hela veckan. Ingen kan glömma den igen.'; }
  show(capG, capOn);

  /* ---- slutkort ---- */
  var end = fade(t, 37200, DUR, 450);
  show(endG, end);
  var epop = p(t, 37200, 38000, 'out');
  endLogo.setAttribute('transform', 'translate(' + (960 * (1 - (0.85 + 0.15 * epop))) + ',' +
    (320 * (1 - (0.85 + 0.15 * epop))) + ') scale(' + (0.85 + 0.15 * epop) + ')');
  var ep = 1 + Math.sin(t / 260) * 0.015;
  endBtn.setAttribute('transform', 'translate(' + (960 * (1 - ep)) + ',' + (835 * (1 - ep)) + ') scale(' + ep + ')');
}

K.play(render, DUR);
</script>
</body>
</html>
