<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Sändo Tavla — Biblioteket</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #0b0e17; overflow: hidden; }
  #stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px;
    transform-origin: center center; background: #f3efe6;
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  svg { display: block; }
  text { font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
</style>
</head>
<body>
<div id="stage"><svg id="scene" width="1920" height="1080" viewBox="0 0 1920 1080"></svg></div>
<script src="filmkit.js"></script>
<script src="miljoer.js"></script>
<script>
/* ===================================================================
   Sändo Tavla — "Biblioteket"
   Läsvila, viskningar och en ny elev som vågar rösta.
   =================================================================== */
var K = Filmkit, M = Miljoer, scene = K.scene, C = K.C, SKIN = K.SKIN, SHIRT = K.SHIRT;
var el = K.el, txt = K.txt, clamp = K.clamp, lerp = K.lerp, p = K.p, fade = K.fade;
var show = K.show, move = K.move, kid = K.kid, bubble = K.bubble;

/* Stående figur med ben */
function person(x, y, s, opts) {
  var g = el('g', {}, scene);
  var k = kid(g, opts || {});
  el('rect', { x: -24, y: 80, width: 18, height: 46, rx: 9, fill: '#2f3a4d' }, k);
  el('rect', { x: 6, y: 80, width: 18, height: 46, rx: 9, fill: '#2f3a4d' }, k);
  g.k = k; g.home = [x, y, s];
  move(g, x, y, s);
  return g;
}
function hop(g, x, y, s, t, fart) {
  move(g, x, y - Math.abs(Math.sin(t / (fart || 130))) * 12, s);
}
function fmt(sec) {
  sec = Math.max(0, Math.ceil(sec));
  return Math.floor(sec / 60) + ':' + (sec % 60 < 10 ? '0' : '') + (sec % 60);
}


M.bibliotek();
var sc = K.wallScreen(1180, 120, 700, 430, 'Biblioteket');

var wLjud = K.widget(sc, 1210, 210, 380, 180, '🔊 Läsro');
var ljudFace = txt('🙂', { x: 1290, y: 310, 'text-anchor': 'middle', 'font-size': 54 }, wLjud);
var ljudNum = txt('22', { x: 1370, y: 306, 'font-size': 44, 'font-weight': 800, fill: C.green }, wLjud);
el('rect', { x: 1230, y: 330, width: 340, height: 18, rx: 9, fill: '#e5e9f2' }, wLjud);
var ljudBar = el('rect', { x: 1230, y: 330, width: 70, height: 18, rx: 9, fill: C.green }, wLjud);
var ljudMsg = txt('Skön läsro', { x: 1230, y: 372, 'font-size': 17, 'font-weight': 600, fill: C.muted }, wLjud);
var wTid = K.widget(sc, 1610, 210, 240, 180, '⏳ Läsvila');
var tidTxt = txt('15:00', { x: 1730, y: 310, 'text-anchor': 'middle', 'font-size': 42, 'font-weight': 800, fill: C.brand }, wTid);
txt('sedan högläsning', { x: 1730, y: 352, 'text-anchor': 'middle', 'font-size': 15, fill: C.muted }, wTid);

var wVal = el('g', { opacity: 0 }, sc);
var valCard = K.widget(sc, 1210, 406, 640, 126, '📊 Vilken bok läser vi högt?');
wVal.appendChild(valCard);
var valRader = [];
[['Mysteriet på vinden', C.brand], ['Draken som bakade', C.cyan], ['Rymdhunden Rex', C.amber]].forEach(function (v, i) {
  var g = el('g', {}, wVal);
  var y = 460 + i * 26;
  txt(v[0], { x: 1228, y: y + 6, 'font-size': 16, 'font-weight': 600, fill: C.ink }, g);
  el('rect', { x: 1470, y: y - 12, width: 300, height: 18, rx: 9, fill: '#e9edf5' }, g);
  var bar = el('rect', { x: 1470, y: y - 12, width: 8, height: 18, rx: 9, fill: v[1] }, g);
  var num = txt('0', { x: 1790, y: y + 5, 'font-size': 16, 'font-weight': 800, fill: C.muted }, g);
  valRader.push({ bar: bar, num: num });
});

var wHog = el('g', { opacity: 0 }, sc);
var hogCard = K.widget(sc, 1210, 406, 640, 126, '📖 Högläsning');
wHog.appendChild(hogCard);
txt('Mysteriet på vinden — kapitel 1', { x: 1530, y: 480, 'text-anchor': 'middle', 'font-size': 26, 'font-weight': 800, fill: C.ink }, hogCard);
txt('Vald av klassen. Föreslagen av Noor.', { x: 1530, y: 512, 'text-anchor': 'middle', 'font-size': 18, fill: C.green }, hogCard);

/* folk */
var bibG = el('g', {}, scene);
var bib = K.grownup(bibG, '#7c3aed', SKIN[0], '#5b3a1e');
move(bibG, 980, 700, 1.15);
var lasare = [];
[[380, 830, 1.0, 0], [560, 850, 1.0, 1], [720, 870, 1.0, 2]].forEach(function (b, i) {
  var g = person(b[0], b[1], b[2], { skin: SKIN[i + 1], shirt: SHIRT[i], hair: ['#3b2a1e', '#20242e', '#6b3f1d'][i] });
  /* bok i knäet */
  el('rect', { x: -34, y: 40, width: 68, height: 44, rx: 6, fill: ['#c0392b', '#2e86c1', '#27ae60'][i] }, g.k);
  el('rect', { x: -2, y: 40, width: 4, height: 44, fill: '#fff' }, g.k);
  lasare.push(g);
});
var noor = person(1280, 800, 1.05, { skin: SKIN[3], shirt: '#14b8a6', hair: '#20242e' });

var bViska = K.speech(430, 130, ['Psst! Kolla här!'], 38, [-40, 340], 640, 470);
var bJag = K.speech(500, 130, ['Jag har en idé…'], 38, [80, 330], 1120, 470);
var cap = K.captionBar();
var slut = K.endCard('Även tystnad går att visa.', 'Ljudnivå · Timer · Omröstning · Dagens fråga', 'egBib');

var DUR = 38000;
function render(t) {
  /* ljudnivån: låg gräns i biblioteket */
  var nl = t < 5200 ? 22 : t < 8400 ? lerp(22, 44, p(t, 5200, 8400, 'out'))
    : t < 11000 ? lerp(44, 20, p(t, 8400, 11000, 'inOut')) : 20 + Math.sin(t / 900) * 5;
  if (t > 22000 && t < 26000) nl = lerp(22, 38, p(t, 22000, 24000, 'out')) - lerp(0, 16, p(t, 24000, 26000));
  nl = Math.round(nl);
  var col = nl >= 40 ? C.amber : C.green;
  ljudNum.textContent = nl;
  ljudNum.setAttribute('fill', col);
  ljudBar.setAttribute('width', Math.max(14, nl * 3.4));
  ljudBar.setAttribute('fill', col);
  ljudFace.textContent = nl >= 40 ? '🤫' : '🙂';
  ljudMsg.textContent = nl >= 40 ? 'Viskningen hörs ända hit' : 'Skön läsro';
  ljudMsg.setAttribute('fill', col);
  tidTxt.textContent = fmt(900 - t / 1000 * 60);
  sc.clock.textContent = '13:' + ('0' + (5 + Math.floor(t / 3000))).slice(-2);

  show(wVal, fade(t, 13800, 25600, 350));
  show(wHog, fade(t, 26000, 33600, 350));
  var roster = [Math.round(lerp(0, 14, p(t, 15200, 23400, 'out'))),
                Math.round(lerp(0, 9, p(t, 15200, 23400, 'out'))),
                Math.round(lerp(0, 5, p(t, 15200, 22000, 'out')))];
  valRader.forEach(function (r, i) {
    r.bar.setAttribute('width', Math.max(8, roster[i] * 20));
    r.num.textContent = roster[i];
    r.num.setAttribute('fill', i === 0 && t > 23400 ? C.green : C.muted);
  });

  bib.talk((t > 12600 && t < 15400) || (t > 26200 && t < 30000), t);
  bib.arm.setAttribute('transform', (t > 13400 && t < 15000) || (t > 26000 && t < 27400) ? 'rotate(-54,45,30)' : '');

  lasare.forEach(function (g, i) {
    var b = g.home;
    move(g, b[0], b[1] + Math.sin(t / 900 + i) * 3, b[2]);
    g.k.setMood(t > 26000 ? 'glad' : 'neutral');
    g.k.head.setAttribute('transform', nl >= 40 ? 'translate(5,-3)' : 'translate(0,' + Math.sin(t / 800 + i) * 2 + ')');
  });
  /* Noor: står avvaktande, går fram och röstar, sätter sig med de andra */
  var nx = 1280, ny = 800, ns = 1.05;
  if (t > 16000 && t < 19000) { nx = lerp(1280, 1120, p(t, 16000, 17600, 'inOut')); }
  else if (t >= 19000 && t < 27000) { nx = 1120; }
  else if (t >= 27000) {
    var w = p(t, 27200, 29600, 'inOut');
    nx = lerp(1120, 880, w); ny = lerp(800, 880, w); ns = lerp(1.05, 1.0, w);
  }
  move(noor, nx, ny - (t > 16000 && t < 17600 ? Math.abs(Math.sin(t / 130)) * 8 : 0), ns);
  noor.k.setMood(t < 13000 ? 'ledsen' : t > 23400 ? 'glad' : 'neutral');
  noor.k.armR.setAttribute('transform', t > 17800 && t < 20600 ? 'rotate(-72,36,26)' : '');

  bViska.play(t, 6000, 8600);
  bJag.play(t, 17800, 20400);
  cap.play(t, [
    [1400, 4600, 'Läsvila i biblioteket.', 'Femton minuter, och det ska vara tyst.'],
    [6600, 10200, 'Även viskningar räknas.', 'Gränsen är satt lågt här — och alla ser den.'],
    [12800, 16400, 'Noor är ny och vet inte vad hon ska läsa.', 'Hon vågar inte fråga högt.'],
    [18000, 21600, 'Men hon vågade rösta.', 'Bokvalet görs på skärmen, inte med handuppräckning.'],
    [23600, 26000, '“Mysteriet på vinden” vann.', 'Med fjorton röster av tjugoåtta.'],
    [27600, 31400, 'Och det var Noors förslag.', 'Nu sitter hon med i ringen.']
  ]);
  slut.play(t, 32600, DUR);
}


K.play(render, DUR);
</script>
</body>
</html>
