<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Sändo Tavla — Slöjden</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #0b0e17; overflow: hidden; }
  #stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px;
    transform-origin: center center; background: #e9e6dd;
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  svg { display: block; }
  text { font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
</style>
</head>
<body>
<div id="stage"><svg id="scene" width="1920" height="1080" viewBox="0 0 1920 1080"></svg></div>
<script src="filmkit.js"></script>
<script src="miljoer.js"></script>
<script>
/* ===================================================================
   Sändo Tavla — "Slöjden"
   En såg, tjugo elever och ett trafikljus som håller ordning.
   =================================================================== */
var K = Filmkit, M = Miljoer, scene = K.scene, C = K.C, SKIN = K.SKIN, SHIRT = K.SHIRT;
var el = K.el, txt = K.txt, clamp = K.clamp, lerp = K.lerp, p = K.p, fade = K.fade;
var show = K.show, move = K.move, kid = K.kid, bubble = K.bubble;

/* Stående figur med ben */
function person(x, y, s, opts) {
  var g = el('g', {}, scene);
  var k = kid(g, opts || {});
  el('rect', { x: -24, y: 80, width: 18, height: 46, rx: 9, fill: '#2f3a4d' }, k);
  el('rect', { x: 6, y: 80, width: 18, height: 46, rx: 9, fill: '#2f3a4d' }, k);
  g.k = k; g.home = [x, y, s];
  move(g, x, y, s);
  return g;
}
function hop(g, x, y, s, t, fart) {
  move(g, x, y - Math.abs(Math.sin(t / (fart || 130))) * 12, s);
}
function fmt(sec) {
  sec = Math.max(0, Math.ceil(sec));
  return Math.floor(sec / 60) + ':' + (sec % 60 < 10 ? '0' : '') + (sec % 60);
}


var milj = M.slojd();
var sc = K.wallScreen(600, 110, 700, 420, 'Slöjden');

/* trafikljus för maskinen */
var wLjus = K.widget(sc, 630, 196, 210, 300, '🚦 Sågen');
var lR = el('circle', { cx: 735, cy: 268, r: 30, fill: '#3a4256' }, wLjus);
var lY = el('circle', { cx: 735, cy: 338, r: 30, fill: '#3a4256' }, wLjus);
var lG = el('circle', { cx: 735, cy: 408, r: 30, fill: C.green }, wLjus);
var ljusTxt = txt('Ledig', { x: 735, y: 470, 'text-anchor': 'middle', 'font-size': 20, 'font-weight': 800, fill: C.green }, wLjus);
/* turordning till maskinen */
var wKo = K.widget(sc, 860, 196, 410, 140, '📋 Kö till sågen');
var koNu = txt('Nu: Alva', { x: 880, y: 262, 'font-size': 24, 'font-weight': 800, fill: C.brand }, wKo);
var koSen = txt('Sedan: Milo · Sam', { x: 880, y: 300, 'font-size': 19, fill: C.muted }, wKo);
/* limtimer */
var wLim = K.widget(sc, 860, 356, 410, 140, '⏳ Limmet torkar');
var limTxt = txt('—', { x: 1000, y: 434, 'text-anchor': 'middle', 'font-size': 40, 'font-weight': 800, fill: C.brand }, wLim);
var limKlar = txt('', { x: 1160, y: 434, 'text-anchor': 'middle', 'font-size': 20, 'font-weight': 700, fill: C.green }, wLim);

/* folk */
var larG = el('g', {}, scene);
var lar = K.grownup(larG, '#334155', SKIN[2], '#3b2a1e');
el('rect', { x: -34, y: 20, width: 68, height: 96, rx: 18, fill: '#8a5a3b' }, lar.body);
move(larG, 250, 800, 1.2);
var alva = person(1690, 800, 1.0, { skin: SKIN[4], shirt: '#ec4899', hair: '#8a5a2b' });
var elever = [];
[[700, 830, 1.0], [900, 840, 1.0], [1180, 850, 1.0]].forEach(function (b, i) {
  elever.push(person(b[0], b[1], b[2], { skin: SKIN[i], shirt: SHIRT[i + 1], hair: ['#20242e', '#6b3f1d', '#3b2a1e'][i] }));
});

var bMinTur = K.speech(430, 130, ['Är det min tur nu?'], 38, [200, 330], 1150, 620);
var cap = K.captionBar();
var slut = K.endCard('Ordning där det behövs mest.', 'Trafikljus · Turordning · Timer · Anteckningar', 'egSlojd');

var DUR = 38000;
function render(t) {
  var sagar = t > 9000 && t < 21000;
  lR.setAttribute('fill', sagar ? '#ef4444' : '#3a4256');
  lG.setAttribute('fill', sagar ? '#3a4256' : C.green);
  lY.setAttribute('fill', (t > 21000 && t < 23000) ? '#facc15' : '#3a4256');
  ljusTxt.textContent = sagar ? 'Upptagen' : (t > 21000 && t < 23000) ? 'Byte' : 'Ledig';
  ljusTxt.setAttribute('fill', sagar ? C.red : (t > 21000 && t < 23000) ? C.amber : C.green);
  koNu.textContent = t < 22000 ? 'Nu: Alva' : 'Nu: Milo';
  koSen.textContent = t < 22000 ? 'Sedan: Milo · Sam' : 'Sedan: Sam';
  var lim = 1200 - Math.max(0, t - 14600) / 1000 * 45;
  limTxt.textContent = t < 14600 ? '—' : fmt(lim);
  limKlar.textContent = lim <= 0 ? '✅ Klart att slipa' : '';
  sc.clock.textContent = '13:' + ('0' + (10 + Math.floor(t / 3500))).slice(-2);
  /* sågen surrar och skakar när den går */
  milj.maskin.setAttribute('transform', sagar ? 'translate(' + (Math.sin(t / 30) * 2) + ',0)' : '');

  lar.talk((t > 3200 && t < 7000) || (t > 30000 && t < 33000), t);
  lar.arm.setAttribute('transform', (t > 6600 && t < 8200) || (t > 22000 && t < 23400) ? 'rotate(-56,45,30)' : '');

  elever.forEach(function (g, i) {
    var b = g.home;
    move(g, b[0], b[1] + Math.sin(t / 800 + i) * 3, b[2]);
    g.k.setMood(t > 30000 ? 'glad' : 'neutral');
    g.k.armR.setAttribute('transform', 'rotate(' + (-24 + Math.sin(t / (240 + i * 40)) * 26) + ',36,26)');
    /* Milo går fram när det blir hans tur */
    if (i === 1 && t > 22600) {
      var w = p(t, 22600, 25000, 'inOut');
      move(g, lerp(b[0], 1640, w), lerp(b[1], 810, w), b[2]);
    }
  });
  /* Alva sågar och går tillbaka */
  var ax = 1690, ay = 800;
  if (t > 21400) { var w2 = p(t, 21400, 23800, 'inOut'); ax = lerp(1690, 1300, w2); ay = lerp(800, 850, w2); }
  move(alva, ax, ay - (sagar ? Math.abs(Math.sin(t / 90)) * 4 : 0), 1.0);
  alva.k.setMood(t > 21400 ? 'glad' : 'neutral');
  alva.k.armL.setAttribute('transform', sagar ? 'rotate(-46,-36,26)' : '');

  bMinTur.play(t, 4200, 7400);
  cap.play(t, [
    [1200, 4000, 'Slöjden. En såg, tjugo elever.', 'Och alla vill vara först.'],
    [5000, 8000, '“Är det min tur nu?”', 'Frågan som ställs fyrtio gånger per lektion.'],
    [9600, 13400, 'Nu står det på tavlan.', 'Rött ljus när sågen går. Kön syns för alla.'],
    [15000, 18600, 'Limmet får också sin egen tid.', 'Tjugo minuter — ingen behöver gissa.'],
    [23400, 27000, 'Grönt igen. Nästa i kön.', 'Läraren kan hålla ögonen på händerna i stället.']
  ]);
  slut.play(t, 33400, DUR);
}


K.play(render, DUR);
</script>
</body>
</html>
