plugins {
    id 'com.android.application'
}

android {
    namespace 'ai.raken.app'
    compileSdk 35

    defaultConfig {
        applicationId 'ai.raken.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    // The web app in ../../app is bundled as-is into the APK's assets.
    sourceSets {
        main {
            assets.srcDirs += ['../../app']
        }
    }

    signingConfigs {
        // Release builds are signed with a keystore if RAKEN_KEYSTORE is set,
        // otherwise with the debug key so the APK is still installable.
        release {
            def ks = System.getenv('RAKEN_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('RAKEN_KEYSTORE_PASSWORD')
                keyAlias System.getenv('RAKEN_KEY_ALIAS')
                keyPassword System.getenv('RAKEN_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('RAKEN_KEYSTORE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
