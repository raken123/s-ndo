<!DOCTYPE html>

<style>
/* Layout: one 16:9 film stage with a slim control bar under it, centred in a dark screening room. */
:root{
  --room:#0e0b16; --bar:#191427; --barline:#2c2440; --fg:#f3efff; --muted:#a49cbc;
  --tq:#1fd3c4; --lila:#a46bff; --focus:#ffe066;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--room);color:var(--fg);font-family:var(--ui);overflow-x:hidden}
#app{box-sizing:border-box;min-height:100%;display:flex;align-items:center;justify-content:center;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--room)}
#player{width:min(100%, calc((100vh - 96px) * 16 / 9));min-width:0;display:flex;flex-direction:column;gap:8px}
@supports (height:100dvh){#player{width:min(100%, calc((100dvh - 96px) * 16 / 9))}}
#stage{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;background:#000;border-radius:6px;overflow:hidden;
  box-shadow:0 18px 60px rgba(0,0,0,.55)}
#c{display:block;width:100%;height:100%}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2%;
  background:radial-gradient(ellipse at 50% 40%,rgba(60,30,110,.55),rgba(5,3,10,.88));text-align:center;padding:4%}
#ov h1{margin:0;font-size:clamp(20px,5.2vw,64px);line-height:1.02;letter-spacing:.02em;font-weight:900;text-wrap:balance;
  color:#fff;text-shadow:0 .06em 0 #5b2bb0,0 .12em .3em rgba(0,0,0,.6)}
#ov h1 span{display:block;font-size:.42em;letter-spacing:.32em;color:var(--tq);text-shadow:none;margin-bottom:.4em}
#ov p{margin:0;color:var(--muted);font-size:clamp(11px,1.5vw,17px);max-width:46ch}
#big{font:800 clamp(14px,2.2vw,24px) var(--ui);color:#170f26;background:var(--focus);border:0;border-radius:999px;
  padding:.7em 1.6em;cursor:pointer;display:flex;align-items:center;gap:.5em;box-shadow:0 6px 0 #b38f12}

#bar{display:flex;align-items:center;gap:6px;background:var(--bar);border:1px solid var(--barline);border-radius:10px;padding:5px 8px;min-width:0}

@media (prefers-reduced-motion:reduce){#big{transition:none}}

<div id="app">
  <div id="player">
    <div id="stage">
      <canvas id="c" width="1920" height="1080" aria-label="Animerad film: Wille – Rasten som försvann"></canvas>
      <div id="ov">
        <h1><span>EN ANIMERAD KORTFILM</span>WILLE – RASTEN<br>SOM FÖRSVANN</h1>
        <p id="ovtext">5 minuter · svenska undertexter · ljud skapas i webbläsaren</p>
        <button id="big" type="button"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg><span id="bigtxt">Spela filmen</span></button>

      <button id="bRe" type="button" aria-label="Spela om från början"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg></button>

      <button id="bFs" type="button" aria-label="Helskärm"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5v2H6v3H4zm10-5h6v5h-2V6h-4V4zM6 15v3h3v2H4v-5h2zm12 0h2v5h-5v-2h3v-3z"/></svg></button>
    </div>

<script>
"use strict";
// ===================== KÄRNA =====================
const W = 1920, H = 1080, DUR = 300, TAU = Math.PI * 2;
const cv = document.getElementById('c');
const g = cv.getContext('2d');
let T = 0;            // filmens gemensamma klocka i sekunder
let SC = 1;           // skalning från 1920-koordinater till canvas-pixlar
const FONT = 'system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
const INK = '#241a33';

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ss = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const eio = t => { t = clamp(t, 0, 1); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const eout = t => { t = clamp(t, 0, 1); return 1 - Math.pow(1 - t, 3); };
const ein = t => { t = clamp(t, 0, 1); return t * t * t; };
const lin = t => clamp(t, 0, 1);
const prog = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const bump = (t, a, b) => Math.sin(prog(t, a, b) * Math.PI);
const R = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

// keyframes: [[t, v], ...]  v kan vara tal eller array
function kf(t, K, ease = ss) {
  if (t <= K[0][0]) return K[0][1];
  for (let i = 0; i < K.length - 1; i++) {
    const [a, va] = K[i], [b, vb] = K[i + 1];
    if (t <= b) {
      const p = ease((t - a) / (b - a || 1));
      return Array.isArray(va) ? va.map((v, j) => lerp(v, vb[j], p)) : lerp(va, vb, p);
    }
  }
  return K[K.length - 1][1];
}
// rörelsebana: [[t, x, y], ...]
function path(t, K, ease = lin) {
  const segA = i => { for (let j = i; j >= 0 && j < K.length - 1; j--) { const dx = K[j + 1][1] - K[j][1], dy = K[j + 1][2] - K[j][2]; if (Math.hypot(dx, dy) > 1) return Math.atan2(dy, dx); } for (let j = i; j < K.length - 1; j++) { const dx = K[j + 1][1] - K[j][1], dy = K[j + 1][2] - K[j][2]; if (Math.hypot(dx, dy) > 1) return Math.atan2(dy, dx); } return 0; };
  if (t <= K[0][0]) return { x: K[0][1], y: K[0][2], ang: segA(0), v: 0 };
  for (let i = 0; i < K.length - 1; i++) {
    const a = K[i], b = K[i + 1];
    if (t <= b[0]) {
      const p = ease((t - a[0]) / (b[0] - a[0]));
      const dx = b[1] - a[1], dy = b[2] - a[2], d = Math.hypot(dx, dy);
      return { x: a[1] + dx * p, y: a[2] + dy * p, ang: d > 1 ? Math.atan2(dy, dx) : segA(i), v: d / (b[0] - a[0]) };
    }
  }
  const L = K[K.length - 1];
  return { x: L[1], y: L[2], ang: segA(K.length - 2), v: 0 };
}

// ---------- ritprimitiver ----------
function rect(x, y, w, h, c) { g.fillStyle = c; g.fillRect(x, y, w, h); }
function circ(x, y, r, c) { g.beginPath(); g.arc(x, y, Math.max(0, r), 0, TAU); g.fillStyle = c; g.fill(); }
function ell(x, y, rx, ry, c, rot = 0) { g.beginPath(); g.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot, 0, TAU); g.fillStyle = c; g.fill(); }
function rrect(x, y, w, h, r) {
  r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function rr(x, y, w, h, r, c, stroke, lw) { rrect(x, y, w, h, r); if (c) { g.fillStyle = c; g.fill(); } if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw || 4; g.stroke(); } }
function line(x1, y1, x2, y2, c, w) { g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.strokeStyle = c; g.lineWidth = w; g.lineCap = 'round'; g.stroke(); }
function inkS(w = 5) { g.strokeStyle = INK; g.lineWidth = w; g.lineJoin = 'round'; g.stroke(); }
function text(s, x, y, size, c, align = 'center', weight = 800) {
  g.font = `${weight} ${size}px ${FONT}`; g.textAlign = align; g.textBaseline = 'middle'; g.fillStyle = c; g.fillText(s, x, y);
}
function textO(s, x, y, size, c, oc, ow, align = 'center', weight = 900) {
  g.font = `${weight} ${size}px ${FONT}`; g.textAlign = align; g.textBaseline = 'middle';
  g.lineJoin = 'round'; g.strokeStyle = oc; g.lineWidth = ow; g.strokeText(s, x, y); g.fillStyle = c; g.fillText(s, x, y);
}
function limb(x1, y1, x2, y2, w, col) { line(x1, y1, x2, y2, INK, w + 9); line(x1, y1, x2, y2, col, w); }
function glow(x, y, r, col, a = 1) {
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.globalAlpha = a; g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); g.globalAlpha = 1;
}
function cam(cx, cy, z = 1, rot = 0) {
  g.translate(W / 2, H / 2); if (rot) g.rotate(rot); g.scale(z, z); g.translate(-cx, -cy);
}
function shake(a, f = 23) { return [Math.sin(T * f) * a + Math.sin(T * f * 1.7) * a * .5, Math.cos(T * f * 1.3) * a]; }
function speedLines(n, col, a, seed = 1, horiz = true) {
  g.globalAlpha = a;
  for (let i = 0; i < n; i++) {
    const y = R(i * 3.1 + seed) * H, len = 200 + R(i * 7.3) * 500;
    const x = ((R(i * 1.7) * W * 2 - T * 2600 * (0.6 + R(i))) % (W + len) + W + len) % (W + len) - len;
    if (horiz) line(x, y, x + len, y, col, 3 + R(i) * 5); else line(y * 16 / 9, x * 9 / 16, y * 16 / 9, x * 9 / 16 + len * .6, col, 4);
  }
  g.globalAlpha = 1;
}
function rays(x, y, n, col, a, spin, r = 1600) {
  g.save(); g.translate(x, y); g.rotate(T * spin); g.globalAlpha = a; g.fillStyle = col;
  for (let i = 0; i < n; i++) { g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, r, i / n * TAU, (i + .5) / n * TAU); g.closePath(); g.fill(); }
  g.restore(); g.globalAlpha = 1;
}

// ===================== FIGURER =====================
const CH = {
  raken: { name: 'Raken', sw: '#17c3b6', swD: '#0d958b', pants: '#33456a', skin: '#d39b74', skinD: '#b07a55', hair: '#2f1d10', shoe: '#f2f2f2', leg: 82, tor: 104, tw: 84, hr: 56, arm: 86, hs: 'curly', blink: 0.3 },
  wille: { name: 'Wille', sw: '#8c4de4', swD: '#6532b2', pants: '#2b2f40', skin: '#f3c8a2', skinD: '#d6a07a', hair: '#f4c443', shoe: '#e2423a', leg: 66, tor: 96, tw: 100, hr: 61, arm: 78, hs: 'spiky', bag: true, freckles: true, blink: 1.9 },
  froken: { name: 'Fröken', sw: '#df4f5b', swD: '#ad3742', pants: '#3a2c4a', skin: '#e8b995', skinD: '#c99472', hair: '#7d4f33', shoe: '#5a2a2a', leg: 120, tor: 142, tw: 96, hr: 52, arm: 112, hs: 'bun', glasses: true, skirt: '#6b3f8f', blink: 1.1 },
  vakt: { name: 'Vaktmästaren', sw: '#4a6890', swD: '#34507a', pants: '#4a6890', skin: '#d7a587', skinD: '#b5836a', hair: '#9b9b9b', shoe: '#3b2a20', leg: 104, tor: 134, tw: 126, hr: 55, arm: 106, hs: 'cap', mustache: true, overall: true, blink: 2.6 },
  k1: { name: '', sw: '#f2a23a', swD: '#c47c1f', pants: '#3d4a5c', skin: '#8d5a3b', skinD: '#6e4229', hair: '#1b1210', shoe: '#444', leg: 72, tor: 96, tw: 88, hr: 54, arm: 78, hs: 'round', blink: .7 },
  k2: { name: '', sw: '#58b84a', swD: '#3d8a32', pants: '#5c3d3d', skin: '#f0c7a8', skinD: '#d19f7e', hair: '#b4462b', shoe: '#333', leg: 72, tor: 96, tw: 86, hr: 54, arm: 78, hs: 'pony', blink: 2.2 },
  k3: { name: '', sw: '#ff7aa8', swD: '#d65383', pants: '#2f3c55', skin: '#c88b62', skinD: '#a56d47', hair: '#3a2416', shoe: '#555', leg: 72, tor: 96, tw: 86, hr: 54, arm: 78, hs: 'round', blink: 3.1 },
  k4: { name: '', sw: '#3f8ef0', swD: '#2a68bd', pants: '#3b3b3b', skin: '#f5d0b0', skinD: '#d8a988', hair: '#e8d9a0', shoe: '#222', leg: 72, tor: 96, tw: 86, hr: 54, arm: 78, hs: 'pony', blink: 1.4 },
};

// vem pratar just nu (styr munrörelser från undertexterna)
let SUBS = [];
function isTalking(who) {
  const n = CH[who] ? CH[who].name : who;
  for (const s of SUBS) if (T >= s[0] && T < s[1] - 0.15 && s[2] === n && !s[4]) return true;
  return false;
}

function person(o) {
  const c = CH[o.who], s = o.s ?? 1;
  const f = clamp(o.face ?? 1, -1, 1), fs = f >= 0 ? 1 : -1, af = Math.abs(f);
  const ph = o.ph ?? 0, amp = o.amp ?? 0;
  const bob = Math.abs(Math.sin(ph)) * 8 * amp;
  g.save(); g.translate(o.x, o.y); g.scale(s, s);
  g.lineJoin = 'round'; g.lineCap = 'round';
  if (!o.noShadow) { g.globalAlpha = .2; ell(0, 2, c.tw * .75, 13, '#000'); g.globalAlpha = 1; }
  g.translate(0, -(o.jump || 0) - bob);
  if (o.rot) g.rotate(o.rot);
  if (o.lean) { g.translate(0, -c.leg); g.rotate(o.lean); g.translate(0, c.leg); }
  const hipY = -c.leg, topY = hipY - c.tor, shY = topY + 22, headY = topY - c.hr * .72 + (o.squash || 0);
  // ben
  if (!o.noLegs) {
    const sw = Math.sin(ph) * .8 * amp;
    for (const [lx, a] of [[-c.tw * .18, -sw], [c.tw * .18, sw]]) {
      const la = a * (af > .2 ? 1 : .5) + (o.legA || 0) * fs;
      const ex = lx + Math.sin(la) * c.leg, ey = hipY + Math.cos(la) * c.leg;
      limb(lx, hipY, ex, ey, c.tw * .27, c.pants);
      ell(ex + fs * 9 * af, ey - 3, 22, 12, c.shoe); g.beginPath(); g.ellipse(ex + fs * 9 * af, ey - 3, 22, 12, 0, 0, TAU); inkS(4);
    }
  }
  // väska bakom
  const showBag = c.bag && o.bag !== false;
  if (showBag && af > .25) {
    const bx = -fs * c.tw * .5;
    rr(bx - 34, shY - 12, 68, c.tor - 6, 20, '#3da35e', INK, 5);
    rr(bx - 24 - fs * 6, shY + 34, 40, 34, 10, '#f39a33', INK, 4);
  }
  // kjol
  if (c.skirt) {
    g.beginPath(); g.moveTo(-c.tw * .5, hipY - 16); g.lineTo(c.tw * .5, hipY - 16); g.lineTo(c.tw * .72, hipY + 58); g.lineTo(-c.tw * .72, hipY + 58); g.closePath();
    g.fillStyle = c.skirt; g.fill(); inkS(5);
  }
  // kropp
  rr(-c.tw / 2, topY, c.tw, c.tor + 8, 34, c.sw, INK, 5);
  if (o.who === 'raken') { g.save(); rrect(-c.tw / 2, topY, c.tw, c.tor + 8, 34); g.clip(); rect(-c.tw / 2, shY + 26, c.tw, 13, '#e9fffb'); rect(-c.tw / 2, hipY - 8, c.tw, 16, c.swD); g.restore(); }
  if (o.who === 'wille') { g.save(); g.translate(f * 12, shY + 40); g.beginPath(); for (let i = 0; i < 10; i++) { const r = i % 2 ? 9 : 20, a = -Math.PI / 2 + i * TAU / 10; g.lineTo(Math.cos(a) * r, Math.sin(a) * r); } g.closePath(); g.fillStyle = '#ffd84a'; g.fill(); inkS(3); g.restore(); rect(-c.tw / 2 + 4, hipY - 6, c.tw - 8, 12, c.swD); }
  if (o.who === 'froken') { line(f * 6, topY + 10, f * 6, hipY - 18, '#ad3742', 4); for (let i = 0; i < 3; i++) circ(f * 6 + 10, topY + 40 + i * 28, 5, '#ffd27a'); }
  if (c.overall) { rr(-c.tw * .3 + f * 6, topY + 24, c.tw * .6, 64, 10, '#5f80aa', INK, 4); line(-c.tw * .3 + f * 6 + 6, topY + 24, -c.tw * .42, topY + 4, '#5f80aa', 9); line(c.tw * .3 + f * 6 - 6, topY + 24, c.tw * .42, topY + 4, '#5f80aa', 9); rect(c.tw * .1 + f * 6, topY + 34, 8, 26, '#e33'); rect(-c.tw / 2 + 3, hipY - 14, c.tw - 6, 12, '#2c3b55'); circ(c.tw * .36, hipY - 2, 10, '#d8b13a'); circ(c.tw * .4, hipY + 14, 7, '#bbb'); }
  // hals/krage
  ell(f * 6, topY + 4, c.tw * .22, 12, c.skinD);
  if (showBag && af <= .25) { line(-c.tw * .28, topY + 6, -c.tw * .3, hipY - 20, '#2d7a45', 10); line(c.tw * .28, topY + 6, c.tw * .3, hipY - 20, '#2d7a45', 10); }
  // armar
  const swA = Math.sin(ph) * .9 * amp;
  const arms = [
    { side: -1, a: o.aL ?? (.14 + swA * (fs > 0 ? 1 : -1) * .7 + amp * .2), e: o.eL ?? (.15 + amp * .8), item: o.itemL },
    { side: 1, a: o.aR ?? (.14 - swA * (fs > 0 ? 1 : -1) * .7 + amp * .2), e: o.eR ?? (.15 + amp * .8), item: o.itemR },
  ];
  const hands = {};
  for (const A of arms) {
    const sx = A.side * (c.tw / 2 - 10), sy = shY;
    const u = c.arm * .52, l = c.arm * .5;
    const ex = sx + A.side * Math.sin(A.a) * u, ey = sy + Math.cos(A.a) * u;
    const hx = ex + A.side * Math.sin(A.a + A.e) * l, hy = ey + Math.cos(A.a + A.e) * l;
    limb(sx, sy, ex, ey, c.tw * .24, c.sw); limb(ex, ey, hx, hy, c.tw * .22, c.sw);
    if (A.item) A.item(hx, hy, A.side);
    circ(hx, hy, c.hr * .24 + 3, INK); circ(hx, hy, c.hr * .24, c.skin);
    hands[A.side] = [hx, hy];
  }
  // huvud
  const hx = f * c.hr * .12, hy = headY;
  if (af < .85) { circ(hx - c.hr * .96, hy + 6, c.hr * .22 + 3, INK); circ(hx - c.hr * .96, hy + 6, c.hr * .22, c.skin); circ(hx + c.hr * .96, hy + 6, c.hr * .22 + 3, INK); circ(hx + c.hr * .96, hy + 6, c.hr * .22, c.skin); }
  else { circ(hx - fs * c.hr * .88, hy + 6, c.hr * .22 + 3, INK); circ(hx - fs * c.hr * .88, hy + 6, c.hr * .22, c.skin); }
  hairBack(c, hx, hy, fs, f);
  circ(hx, hy, c.hr + 3, INK); circ(hx, hy, c.hr, c.skin);
  face(o, c, hx, hy, f, fs, af);
  hairFront(c, hx, hy, fs, f, o);
  if (o.extra) o.extra(hx, hy, hands);
  g.restore();
}

function hairBack(c, hx, hy, fs, f) {
