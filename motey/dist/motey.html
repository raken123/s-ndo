<style>
/* Motey – stilmall */
:root {
  --bg: #F6F4FF;
  --surface: #FFFFFF;
  --surface-2: #EFEBFF;
  --ink: #1E1B3A;
  --ink-2: #5B5878;
  --line: #E1DCF5;
  --brand: #6C4CF5;
  --brand-2: #8F75FF;
  --brand-ink: #FFFFFF;
  --coral: #FF7A59;
  --mint: #19C79A;
  --sun: #FFC93C;
  --rose: #FF5C8A;
  --danger: #E5484D;
  --radius: 18px;
  --shadow: 0 6px 24px rgba(40, 24, 120, .10);
  --font: "Nunito", "Segoe UI", "SF Pro Rounded", system-ui, -apple-system, Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12101F; --surface: #1C1930; --surface-2: #252142; --ink: #F3F1FF; --ink-2: #ABA6CC;
    --line: #322D55; --shadow: 0 6px 24px rgba(0, 0, 0, .35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12101F; --surface: #1C1930; --surface-2: #252142; --ink: #F3F1FF; --ink-2: #ABA6CC;
  --line: #322D55; --shadow: 0 6px 24px rgba(0, 0, 0, .35); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font);
  font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--brand); }
h1, h2, h3 { line-height: 1.2; margin: 0 0 .4em; }
h1 { font-size: 1.6rem; font-weight: 900; }
h2 { font-size: 1.25rem; font-weight: 850; }
h3 { font-size: 1.05rem; font-weight: 800; }
p { margin: 0 0 .7em; }
.muted { color: var(--ink-2); }
.small { font-size: .86rem; }
.hidden { display: none !important; }

/* ---------- layout ---------- */
.app { min-height: 100%; display: flex; }
.rail {
  display: none; flex-direction: column; gap: 6px; width: 230px; padding: 18px 14px;
  background: var(--surface); border-right: 1px solid var(--line); position: sticky; top: 0; height: 100vh;
}
.rail .motey-logo { margin: 0 6px 18px; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px;
  padding: 10px 16px; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
}
.topbar .spacer { flex: 1; }
.view { padding: 16px 16px 96px; max-width: 980px; width: 100%; margin: 0 auto; }
.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; display: flex;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
}
.tabbar button, .rail button.nav {
  flex: 1; border: 0; background: none; border-radius: 12px; padding: 6px 4px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .72rem; font-weight: 700; color: var(--ink-2);
}
.tabbar button .ico, .rail button.nav .ico { font-size: 1.3rem; line-height: 1; }
.tabbar button.on, .rail button.nav.on { color: var(--brand); background: var(--surface-2); }
.rail button.nav { flex: none; flex-direction: row; gap: 12px; font-size: .98rem; padding: 10px 12px; justify-content: flex-start; }
@media (min-width: 900px) {
  .rail { display: flex; }
  .tabbar { display: none; }
  .topbar .motey-logo { display: none; }
  .view { padding: 24px 28px 48px; }
}

/* ---------- logo ---------- */
.motey-logo { display: inline-flex; align-items: center; gap: 8px; }
.motey-word {
  font-weight: 900; font-size: 1.45rem; letter-spacing: -.02em;
  background: linear-gradient(90deg, var(--brand), var(--rose)); -webkit-background-clip: text; background-clip: text; color: transparent;
}

/* ---------- mascot animation ---------- */
.motey-svg { overflow: visible; display: block; }
.motey-svg.is-alive .mt-body { animation: mt-float 3.2s ease-in-out infinite; transform-origin: 100px 160px; }
.motey-svg.is-alive .mt-shadow { animation: mt-shadow 3.2s ease-in-out infinite; transform-origin: 104px 190px; }
.motey-svg.is-alive .mt-eye { animation: mt-blink 4.6s infinite; transform-origin: 100px 82px; }
.motey-svg.is-talking .mt-smile { opacity: 0; }
.motey-svg.is-talking .mt-talk { animation: mt-talk .28s ease-in-out infinite alternate; transform-origin: 100px 122px; }
.motey-svg.is-talking .mt-body { animation: mt-bob .5s ease-in-out infinite alternate; }
@keyframes mt-float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-7px) } }
@keyframes mt-shadow { 0%,100% { transform: scaleX(1); opacity: 1 } 50% { transform: scaleX(.85); opacity: .7 } }
@keyframes mt-blink { 0%,92%,100% { transform: scaleY(1) } 95% { transform: scaleY(.1) } }
@keyframes mt-talk { from { opacity: 1; transform: scaleY(.25) } to { opacity: 1; transform: scaleY(1) } }
@keyframes mt-bob { from { transform: translateY(0) rotate(-1.5deg) } to { transform: translateY(-4px) rotate(1.5deg) } }

/* ---------- components ---------- */
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px;
}
.card.hero {
  display: flex; gap: 16px; align-items: center;
  background: linear-gradient(135deg, var(--brand) 0%, #9B6BFF 55%, var(--rose) 130%);
  color: #fff; border: 0;
}
.card.hero .muted { color: rgba(255,255,255,.85); }
.card.hero .btn.ghost { color: #fff; border-color: rgba(255,255,255,.55); }
.grid { display: grid; gap: 14px; }
@media (min-width: 640px) { .grid.two { grid-template-columns: 1fr 1fr; } .grid.three { grid-template-columns: repeat(3, 1fr); } }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.stack > * + * { margin-top: 10px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px;
  border: 2px solid transparent; padding: 10px 18px; font-weight: 800; cursor: pointer;
  background: var(--brand); color: var(--brand-ink); transition: transform .08s, filter .15s; text-decoration: none;
  min-height: 44px;
}
.btn:hover { filter: brightness(1.07); }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.ghost { background: transparent; color: var(--brand); border-color: var(--line); }
.btn.coral { background: var(--coral); }
.btn.mint { background: var(--mint); }
.btn.dark { background: var(--ink); color: var(--bg); }
.btn.sm { padding: 6px 12px; min-height: 34px; font-size: .88rem; }
.btn.block { width: 100%; }
.icon-btn { border: 0; background: var(--surface-2); border-radius: 12px; width: 40px; height: 40px; cursor: pointer; font-size: 1.15rem; }

.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; cursor: pointer;
  background: var(--surface-2); border: 2px solid transparent; font-weight: 700; font-size: .9rem; user-select: none;
}
.chip.on { border-color: var(--brand); background: color-mix(in srgb, var(--brand) 14%, var(--surface)); color: var(--brand); }
.badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: .75rem; font-weight: 800; background: var(--surface-2); color: var(--ink-2); }
.badge.warn { background: #FFE9E0; color: #C2410C; }
.badge.ok { background: #DDFBEF; color: #047857; }
.badge.brand { background: color-mix(in srgb, var(--brand) 16%, var(--surface)); color: var(--brand); }

label.field { display: block; font-weight: 700; font-size: .9rem; margin-bottom: 10px; }
label.field > span { display: block; margin-bottom: 4px; }
input[type=text], input[type=email], input[type=password], input[type=url], input[type=datetime-local], select, textarea {
  width: 100%; padding: 11px 13px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); outline: none;
}
input:focus, select:focus, textarea:focus { border-color: var(--brand); }
textarea { min-height: 120px; resize: vertical; }
.switch { display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 700; margin-bottom: 10px; }
.switch input { width: 20px; height: 20px; accent-color: var(--brand); }

/* meeting list */
.meeting {
  display: flex; gap: 14px; align-items: center; padding: 14px; border-radius: 16px; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); margin-bottom: 10px; transition: transform .1s;
}
.meeting:hover { transform: translateY(-1px); }
.meeting .date {
  width: 54px; flex: none; text-align: center; border-radius: 12px; padding: 6px 0; background: var(--surface-2); font-weight: 900; line-height: 1.1;
}
.meeting .date small { display: block; font-size: .7rem; color: var(--ink-2); font-weight: 800; text-transform: uppercase; }
.meeting .info { flex: 1; min-width: 0; }
.meeting .info .t { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* tabs inside a view */
.tabs { display: flex; gap: 6px; overflow-x: auto; margin: 6px 0 14px; padding-bottom: 2px; }
.tabs button { border: 0; background: var(--surface-2); padding: 8px 14px; border-radius: 999px; font-weight: 800; cursor: pointer; white-space: nowrap; }
.tabs button.on { background: var(--ink); color: var(--bg); }

.transcript .line { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.transcript .who { font-weight: 800; min-width: 84px; color: var(--brand); }
ul.clean { list-style: none; margin: 0; padding: 0; }
ul.clean li { padding: 8px 0 8px 28px; position: relative; }
ul.clean li::before { content: attr(data-ico); position: absolute; left: 0; top: 7px; }

.file {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: var(--surface-2); margin-bottom: 8px;
}
.file .fi { font-size: 1.5rem; }
.file .fn { flex: 1; min-width: 0; font-weight: 700; overflow-wrap: anywhere; }

/* ---------- Motey pop-up (catch-up) ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 100; display: flex; align-items: flex-end; justify-content: center;
  background: rgba(18, 12, 48, .45); backdrop-filter: blur(3px); animation: fade .2s;
}
@media (min-width: 700px) { .overlay { align-items: center; } }
.sheet {
  width: 100%; max-width: 620px; max-height: 92vh; overflow: auto; background: var(--surface);
  border-radius: 26px 26px 0 0; padding: 58px 18px calc(20px + env(safe-area-inset-bottom)); position: relative;
  animation: rise .35s cubic-bezier(.2, 1.3, .4, 1);
}
@media (min-width: 700px) { .sheet { border-radius: 26px; } }
.sheet .close { position: absolute; top: 12px; right: 12px; }
.motey-stage { display: flex; gap: 14px; align-items: flex-start; }
.motey-stage .motey-svg { flex: none; animation: pop .5s cubic-bezier(.2, 1.6, .4, 1); }
.speech {
  position: relative; background: var(--surface-2); border-radius: 20px; padding: 14px 16px; flex: 1; font-weight: 600;
}
.speech::before {
  content: ""; position: absolute; left: -9px; top: 22px; border: 10px solid transparent; border-right-color: var(--surface-2); border-left: 0;
}
.typing::after { content: "▍"; animation: blinkc 1s steps(1) infinite; color: var(--brand); }
@keyframes blinkc { 50% { opacity: 0 } }
@keyframes fade { from { opacity: 0 } }
@keyframes rise { from { transform: translateY(60px); opacity: 0 } }
@keyframes pop { 0% { transform: scale(.2) rotate(-20deg); opacity: 0 } 100% { transform: none; opacity: 1 } }
.steps { display: flex; gap: 6px; margin: 14px 0; }
.steps i { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
.steps i.on { background: var(--brand); }
.sending { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 14px; background: var(--surface-2); margin-top: 10px; }
.plane { font-size: 1.6rem; animation: fly 1.2s ease-in-out infinite; }
@keyframes fly { 0% { transform: translate(0, 0) } 50% { transform: translate(14px, -8px) rotate(8deg) } 100% { transform: translate(0, 0) } }

/* toast */
.toasts { position: fixed; left: 50%; bottom: 86px; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 8px; width: min(92vw, 420px); }
.toast { background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 14px; font-weight: 700; box-shadow: var(--shadow); animation: rise .3s; }

/* ---------- Live AI ---------- */
.live-stage { display: grid; gap: 14px; }
@media (min-width: 760px) { .live-stage { grid-template-columns: 1fr 1fr; } }
.speaker-card { border-radius: 22px; padding: 16px; min-height: 260px; display: flex; flex-direction: column; gap: 12px; position: relative; overflow: hidden; }
.speaker-card.original { background: #2A2440; color: #EDEAFF; }
.speaker-card.motey { background: linear-gradient(160deg, #EDE7FF, #FFE6EF); color: #1E1B3A; }
.speaker-card .who { display: flex; gap: 10px; align-items: center; font-weight: 900; }
.speaker-card .say { font-size: 1.15rem; font-weight: 700; line-height: 1.4; }
.speaker-card.original.dim .say { filter: blur(5px); user-select: none; }
.boss-face { width: 64px; height: 64px; flex: none; }
.live-log { max-height: 300px; overflow: auto; }
.live-log .pair { padding: 10px 0; border-bottom: 1px dashed var(--line); }
.live-log .o { color: var(--ink-2); text-decoration: line-through; font-size: .9rem; }
.rec-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--danger); display: inline-block; animation: blinkc 1s steps(1) infinite; }

/* ---------- TikTok ---------- */
.tt-wrap { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; justify-content: center; }
.tt-phone {
  position: relative; width: min(360px, 92vw); aspect-ratio: 9 / 16; border-radius: 28px; overflow: hidden; background: #000;
  box-shadow: 0 20px 50px rgba(0, 0, 0, .35); border: 6px solid #111;
}
.tt-phone canvas { width: 100%; height: 100%; display: block; }
.tt-side { position: absolute; right: 8px; bottom: 90px; display: flex; flex-direction: column; gap: 14px; align-items: center; color: #fff; font-weight: 800; font-size: .75rem; text-shadow: 0 1px 3px #000; }
.tt-side button { border: 0; background: rgba(255, 255, 255, .16); color: #fff; width: 46px; height: 46px; border-radius: 50%; font-size: 1.3rem; cursor: pointer; backdrop-filter: blur(4px); }
.tt-side button.liked { background: var(--rose); }
.tt-play { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, .25); border: 0; color: #fff; font-size: 4rem; cursor: pointer; }
.tt-panel { flex: 1; min-width: 260px; max-width: 460px; }
.progress { height: 10px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.progress > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--brand), var(--rose)); transition: width .2s; }
.scene-list li { padding: 6px 0; border-bottom: 1px dashed var(--line); }

/* ---------- Game ---------- */
.game-shell { position: relative; border-radius: 20px; overflow: hidden; background: #0E0B22; box-shadow: var(--shadow); touch-action: none; user-select: none; }
.game-shell canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; }
.game-hud { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; gap: 8px; flex-wrap: wrap; pointer-events: none; }
.game-hud span { background: rgba(14, 11, 34, .75); color: #fff; padding: 4px 10px; border-radius: 999px; font-weight: 800; font-size: .85rem; }
.game-say {
  position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; gap: 10px; align-items: flex-end; pointer-events: none;
}
.game-say .speech { background: rgba(255, 255, 255, .96); color: #1E1B3A; font-size: .95rem; }
.game-say .speech::before { border-right-color: rgba(255, 255, 255, .96); top: auto; bottom: 18px; }
.game-say .btn { pointer-events: auto; }
.dpad { position: absolute; right: 12px; bottom: 96px; display: grid; grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(3, 48px); gap: 4px; }
.dpad button { border: 0; border-radius: 12px; background: rgba(255, 255, 255, .18); color: #fff; font-size: 1.3rem; touch-action: none; }
.dpad .act { background: var(--coral); font-size: .8rem; font-weight: 900; }
@media (hover: hover) and (pointer: fine) { .dpad { display: none; } }
.quiz-opt { display: block; width: 100%; text-align: left; margin: 8px 0; padding: 12px 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 700; }
.quiz-opt:hover { border-color: var(--brand); }
.quiz-opt.right { border-color: var(--mint); background: #DDFBEF; color: #065F46; }
.quiz-opt.wrong { border-color: var(--danger); background: #FFE4E6; color: #9F1239; animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-6px) } 75% { transform: translateX(6px) } }

.empty { text-align: center; padding: 30px 10px; }
.empty .motey-svg { margin: 0 auto 10px; }
kbd { background: var(--surface-2); border: 1px solid var(--line); border-bottom-width: 3px; border-radius: 6px; padding: 0 6px; font-size: .85em; }
.ai-tag { font-size: .72rem; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); }
.ai-tag.claude { background: #FCE7D6; color: #9A3412; }

/* ---------- chat ---------- */
.avatar { width: 44px; height: 44px; flex: none; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 900; font-size: 1rem; overflow: hidden; }
.chatrow .prev { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.unread { background: var(--coral); color: #fff; border-radius: 999px; min-width: 24px; height: 24px; padding: 0 7px; display: inline-flex; align-items: center; justify-content: center; font-weight: 900; font-size: .8rem; }
.chat-head { display: flex; gap: 10px; align-items: center; padding: 6px 0 10px; border-bottom: 1px solid var(--line); }
.chat-head .t { font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.msgs { display: flex; flex-direction: column; gap: 6px; padding: 12px 2px; min-height: 40vh; max-height: calc(100vh - 290px); overflow-y: auto; }
.msgs.compact { max-height: none; flex: 1; min-height: 0; }
.msg { max-width: 82%; align-self: flex-start; }
.msg.mine { align-self: flex-end; text-align: right; }
.msg .from { font-size: .75rem; font-weight: 800; margin: 0 0 2px 10px; }
.msg .bub { display: inline-block; text-align: left; background: var(--surface); border: 1px solid var(--line); padding: 9px 13px; border-radius: 18px 18px 18px 6px; overflow-wrap: anywhere; }
.msg.mine .bub { background: var(--brand); color: #fff; border-color: transparent; border-radius: 18px 18px 6px 18px; }
.msg.mine .bub a { color: #fff; }
.msg .when { font-size: .68rem; color: var(--ink-2); margin: 2px 10px 0; }
.sysmsg { align-self: center; font-size: .78rem; color: var(--ink-2); background: var(--surface-2); padding: 4px 12px; border-radius: 999px; text-align: center; }
.trmsg { align-self: stretch; font-size: .88rem; color: var(--ink-2); font-style: italic; padding: 2px 10px; border-left: 3px solid var(--brand-2); }
.filemsg { display: flex; gap: 10px; align-items: center; border: 0; background: rgba(255, 255, 255, .18); color: inherit; padding: 6px 8px; border-radius: 12px; cursor: pointer; text-align: left; font-size: 1.3rem; }
.filemsg span { font-size: .9rem; }
.msg:not(.mine) .filemsg { background: var(--surface-2); }
.composer { display: flex; gap: 8px; align-items: flex-end; padding: 10px 0 4px; border-top: 1px solid var(--line); }
.composer textarea { min-height: 44px; max-height: 140px; resize: none; border-radius: 22px; padding: 11px 16px; }
.composer .icon-btn { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex: none; }
.composer .btn { width: 48px; padding: 0; flex: none; }

/* ---------- call ---------- */
.call { display: flex; flex-direction: column; gap: 10px; min-height: calc(100vh - 170px); position: relative; }
.call-top { display: flex; gap: 10px; align-items: center; }
.tiles { flex: 1; display: grid; gap: 8px; grid-template-columns: 1fr; align-content: center; }
.tiles[data-n="2"] { grid-template-columns: 1fr; }
@media (min-width: 700px) { .tiles[data-n="2"], .tiles[data-n="3"], .tiles[data-n="4"] { grid-template-columns: 1fr 1fr; } .tiles[data-n="5"], .tiles[data-n="6"] { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 699px) { .tiles[data-n="3"], .tiles[data-n="4"], .tiles[data-n="5"], .tiles[data-n="6"] { grid-template-columns: 1fr 1fr; } }
.tile { position: relative; background: #1E1B3A; border-radius: 18px; overflow: hidden; aspect-ratio: 16 / 10; }
.tile video { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile.self video { transform: scaleX(-1); }
.tile .tname { position: absolute; left: 10px; bottom: 8px; background: rgba(0, 0, 0, .55); color: #fff; padding: 2px 10px; border-radius: 999px; font-size: .8rem; font-weight: 800; }
.tile .tav { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; font-size: 2.6rem; font-weight: 900; color: #fff; background: linear-gradient(135deg, #6C4CF5, #FF5C8A); }
.tile.novideo .tav { display: flex; }
.tile.novideo video { opacity: 0; }
.call-bar { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; padding: 8px 0; }
.cbtn { width: 54px; height: 54px; border-radius: 50%; border: 0; background: var(--surface-2); font-size: 1.35rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; color: inherit; }
.cbtn.off { background: #FFE4E6; text-decoration: line-through; }
.cbtn.on { background: var(--brand); color: #fff; }
.cbtn.end { background: var(--danger); color: #fff; transform: rotate(135deg); }
.captions { background: rgba(30, 27, 58, .85); color: #fff; padding: 8px 14px; border-radius: 12px; font-weight: 700; text-align: center; }
.call-chat { position: fixed; right: 12px; bottom: 90px; width: min(380px, calc(100vw - 24px)); height: min(60vh, 520px); background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); padding: 8px 12px; display: flex; flex-direction: column; z-index: 40; }
.call-chat.hidden { display: none; }
@media (min-width: 900px) { .call-chat { bottom: 24px; } }
.mode-pick { display: grid; gap: 10px; margin-top: 10px; }
.mode-pick button { text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: 18px; padding: 14px; cursor: pointer; }
.mode-pick button:hover { border-color: var(--brand); }
.mode-pick b { display: block; font-size: 1.05rem; }
.demo-banner { display: flex; gap: 10px; align-items: center; background: #FFF4D6; color: #7A5300; border-radius: 14px; padding: 10px 14px; margin-bottom: 12px; font-weight: 700; font-size: .9rem; }
:root[data-theme="dark"] .demo-banner { background: #3A2F12; color: #FFD979; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .demo-banner { background: #3A2F12; color: #FFD979; } }
.tabbar button span:last-child { font-size: .66rem; }
.swatch { width: 28px; height: 28px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; }
.swatch.on { border-color: var(--ink); }
.has-badge { position: relative; }
.has-badge::after { content: attr(data-badge); position: absolute; top: 2px; right: calc(50% - 22px); background: var(--coral); color: #fff; font-size: .65rem; font-weight: 900; min-width: 18px; height: 18px; border-radius: 9px; display: flex; align-items: center; justify-content: center; padding: 0 4px; }
.rail .has-badge::after { position: static; margin-left: auto; }
.mode-pick .small { display: block; margin-top: 2px; }

/* ---------- plans ---------- */
.planpill { font-size: .78rem; font-weight: 900; padding: 5px 11px; border-radius: 999px; text-decoration: none; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.planpill.plus { background: color-mix(in srgb, var(--brand) 16%, var(--surface)); color: var(--brand); }
.planpill.pro { background: linear-gradient(90deg, #FF7A59, #FF5C8A); color: #fff; }
.meter .progress { margin: 6px 0 4px; }
.meter.big .progress { height: 14px; }
.plans { display: grid; gap: 14px; margin-bottom: 14px; }
@media (min-width: 760px) { .plans { grid-template-columns: repeat(3, 1fr); } }
.plan { background: var(--surface); border: 2px solid var(--line); border-radius: 22px; padding: 18px; display: flex; flex-direction: column; }
.plan.on { border-color: var(--brand); box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand) 15%, transparent); }
.plan.pro { background: linear-gradient(170deg, var(--surface) 60%, color-mix(in srgb, var(--coral) 14%, var(--surface))); }
.plan .pname { font-weight: 900; font-size: 1.2rem; }
.plan .pprice { font-weight: 900; font-size: 2rem; margin: 4px 0; }
.plan .pprice small { font-size: .9rem; color: var(--ink-2); }
.plan ul { flex: 1; margin-bottom: 12px; }
.plan li { font-size: .9rem; padding: 4px 0 4px 24px; }
table.cost { width: 100%; border-collapse: collapse; font-size: .88rem; }

<script>
/* Motey – the speech-bubble mascot.
 * One SVG, drawn as a real illustration of the hand-drawn sketch:
 * a chat bubble with a tail, two big oval eyes and a small smile.
 * CSS classes drive blinking, floating and talking (see motey.css). */
(function () {
  'use strict';
  let uid = 0;

  // Bubble body with the tail at the lower left, like the sketch.
  const BODY = 'M100 20C152 20 184 50 184 88C184 127 151 153 104 155' +
    'C92 155 81 153 71 150L45 178C40 183 33 179 35 173L45 142' +
    'C27 130 16 111 16 88C16 50 48 20 100 20Z';

  function svg(opts) {
    opts = opts || {};
    const id = 'mt' + (++uid);
    const mood = opts.mood || 'happy';         // happy | wow | worried | wink
    const cls = ['motey-svg'];
    if (opts.animate !== false) cls.push('is-alive');
    if (opts.talking) cls.push('is-talking');
    if (opts.className) cls.push(opts.className);
    const size = opts.size || 120;
    const brow = mood === 'worried'
      ? '<path class="mt-brow" d="M60 58l26-9M140 58l-26-9" stroke="#1E1B3A" stroke-width="6" stroke-linecap="round" fill="none"/>' : '';
    const leftEye = mood === 'wink'
      ? '<path d="M62 86q16-14 32 0" class="mt-wink" stroke="#1E1B3A" stroke-width="7" stroke-linecap="round" fill="none"/>'
      : `<g class="mt-eye"><ellipse cx="78" cy="82" rx="15.5" ry="${mood === 'wow' ? 26 : 23}" fill="#1E1B3A"/>` +
        '<circle cx="72.5" cy="71" r="5.5" fill="#fff"/><circle cx="82" cy="92" r="2.6" fill="#fff" opacity=".85"/></g>';
    const rightEye = `<g class="mt-eye"><ellipse cx="122" cy="82" rx="15.5" ry="${mood === 'wow' ? 26 : 23}" fill="#1E1B3A"/>` +
      '<circle cx="116.5" cy="71" r="5.5" fill="#fff"/><circle cx="126" cy="92" r="2.6" fill="#fff" opacity=".85"/></g>';
    const mouth = mood === 'wow'
      ? '<ellipse class="mt-mouth-o" cx="100" cy="121" rx="7" ry="8" fill="#1E1B3A"/>'
      : '<path class="mt-smile" d="M89 118q11 10 22 0" stroke="#1E1B3A" stroke-width="5.5" stroke-linecap="round" fill="none"/>' +
        '<ellipse class="mt-talk" cx="100" cy="122" rx="9" ry="7" fill="#1E1B3A" opacity="0"/>';
    return `<svg class="${cls.join(' ')}" viewBox="0 0 200 200" width="${size}" height="${size}" role="img" aria-label="Motey">
  <defs>
    <linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E9E4FF"/>
    </linearGradient>
    <radialGradient id="${id}s" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#1E1B3A" stop-opacity=".22"/><stop offset="1" stop-color="#1E1B3A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse class="mt-shadow" cx="104" cy="190" rx="54" ry="7" fill="url(#${id}s)"/>
  <g class="mt-body">
    <path d="${BODY}" fill="url(#${id}g)" stroke="#1E1B3A" stroke-width="7" stroke-linejoin="round"/>
    <path d="M44 62C52 44 70 34 92 32" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".9"/>
    ${brow}
    <g class="mt-eyes">${leftEye}${rightEye}</g>
    <ellipse cx="58" cy="110" rx="11" ry="6" fill="#FF8FB1" opacity=".55"/>
    <ellipse cx="142" cy="110" rx="11" ry="6" fill="#FF8FB1" opacity=".55"/>
    ${mouth}
  </g>
</svg>`;
  }

  function logo(opts) {
    opts = opts || {};
    return `<span class="motey-logo">${svg({ size: opts.size || 34, animate: opts.animate })}` +
      `<span class="motey-word">Motey</span></span>`;
  }

  window.Mascot = { svg, logo, BODY };
})();

<script>
/* Motey – state, demo meetings and persistence (localStorage). */
(function () {
  'use strict';
  const KEY = 'motey.v1';
  const DAY = 864e5;

  function at(daysFromToday, hh, mm) {
    const d = new Date();
    d.setHours(hh, mm || 0, 0, 0);
    return new Date(d.getTime() + daysFromToday * DAY).toISOString();
  }
  function lines(txt) {
    return txt.trim().split('\n').map(l => {
      const i = l.indexOf(':');
      return { who: l.slice(0, i).trim(), text: l.slice(i + 1).trim() };
    });
  }

  const DEMO_IDS = ['nova-1', 'nova-2', 'fin-1', 'boss-1'];
  function demoMeetings(user, boss) {
    const lastWeekday = -6;
    return [
      {
        id: 'nova-1', demo: true, title: 'Veckomöte – Projekt Nova', series: 'nova', start: at(lastWeekday, 9), durationMin: 45,
        attendees: [boss, 'Ali', 'Sara', user], boss, attended: false,
        transcript: lines(`
${boss}: Godmorgon allihop. ${user} är inte här idag, så vi tar det kort.
Ali: Designen för appen är klar och testgruppen gillade den.
${boss}: Bra. Då är designen godkänd. Vi bestämde att lanseringen flyttas till den 14 november.
Sara: Kunderna i Göteborg vill ha en demo innan dess, helst vecka 44.
${boss}: Sara ansvarar för demon i Göteborg. Budgeten för marknadsföring ligger på 120 000 kr.
Ali: Vi har använt ungefär 45 procent av budgeten hittills.
${boss}: ${user} ska skicka Kundrapport_Q3.pdf och Budget_Nova.xlsx till mig senast fredag.
Sara: Vi behöver också uppdatera supportsidan innan lanseringen.
${boss}: Viktigt: alla ska testa betalflödet på sina egna telefoner till nästa möte.
Ali: Jag tar fram en checklista för testningen.
${boss}: Toppen. Nästa möte är samma tid nästa vecka. Tack allihop!`),
        files: [
          { name: 'Kundrapport_Q3.pdf', status: 'missing', owner: user },
          { name: 'Budget_Nova.xlsx', status: 'missing', owner: user }
        ]
      },
      {
        id: 'nova-2', demo: true, title: 'Veckomöte – Projekt Nova', series: 'nova', start: at(0, new Date().getHours() + 1), durationMin: 45,
        attendees: [boss, 'Ali', 'Sara', user], boss, attended: null, transcript: [], files: []
      },
      {
        id: 'fin-1', demo: true, title: 'Finansmöte – F-skatt, moms & budget', series: 'fin', start: at(-1, 13), durationMin: 60,
        attendees: ['Lena (ekonomi)', boss, user], boss, attended: true,
        transcript: lines(`
Lena (ekonomi): Välkomna! Idag går vi igenom skatterna inför nästa kvartal.
Lena (ekonomi): Först F-skatt. Konsulterna vi anlitar måste ha F-skatt, annars måste vi dra skatt och betala arbetsgivaravgifter åt dem.
${boss}: Kolla alltid att leverantören har F-skatt innan vi betalar en faktura.
Lena (ekonomi): Sen momsen. Vi lägger 25 procent moms på våra tjänster och momsdeklarationen ska in den 12:e varje månad.
${user}: Kan vi dra av momsen på det nya kontorsmaterialet?
Lena (ekonomi): Ja, ingående moms på inköp i verksamheten får vi dra av.
Lena (ekonomi): Arbetsgivaravgifterna är ungefär 31 procent ovanpå bruttolönen, så en lön på 40 000 kr kostar runt 52 600 kr.
${boss}: Budgeten för nästa kvartal är 2,4 miljoner kr och vi får inte gå över den.
Lena (ekonomi): Likviditeten är okej, men kassaflödet blir tajt i december när bonusarna betalas ut.
${boss}: Beslut: vi skickar alla fakturor inom 5 dagar efter leverans för att förbättra kassaflödet.
Lena (ekonomi): Bokslutet görs i januari, så alla kvitton måste vara inne senast 15 januari.
${boss}: ${user}, du ska gå igenom leverantörslistan och kontrollera F-skatt för alla konsulter.`),
        files: [{ name: 'Leverantörslista.xlsx', status: 'missing', owner: user }]
      },
      {
        id: 'boss-1', demo: true, title: 'Kvartalsgenomgång med Gunnar', series: 'gunnar', start: at(-3, 15), durationMin: 30,
        attendees: ['Gunnar (chef)', user], boss: 'Gunnar (chef)', attended: true,
        transcript: lines(`
Gunnar (chef): Det här är helt oacceptabelt! Försäljningen ligger 12 procent under målet.
Gunnar (chef): Jag vill ha en ny plan på mitt bord i morgon bitti, inga ursäkter.
${user}: Vi har haft problem med leveranserna från lagret.
Gunnar (chef): Det är inte mitt problem. Ni måste lösa det själva, omedelbart!
Gunnar (chef): Och varför har ingen svarat på mitt mejl från i måndags?
Gunnar (chef): Från och med nu vill jag ha en statusrapport varje fredag klockan 15.
Gunnar (chef): Om siffrorna inte är bättre nästa månad blir det en allvarlig diskussion.
Gunnar (chef): Skärpning nu. Mötet är slut.`),
        files: []
      }
    ];
  }

  const defaults = () => ({
    version: 1,
    onboarded: false,
    settings: {
      name: 'Ronny', bossName: 'Birgitta', bossEmail: '',
      autoSend: true, sendMethod: 'email', webhookUrl: '',
      geminiKey: '', serverUrl: '', modelFlash: '', modelLive: '', testPlans: false, liveVoice: 'Puck', replaceVoice: 'Charon', replaceNotes: '', replaceHear: false,
      voice: true, liveStyle: 'snall', theme: 'auto',
      demo: true, showDemo: false, color: '#6C4CF5', relays: '', turnUrl: '', turnUser: '', turnPass: ''
    },
    meetings: [],
    rooms: [],
    outbox: [],
    stats: { wallsBroken: 0, videos: 0, restyled: 0 }
  });

  let state;
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) state = Object.assign(defaults(), JSON.parse(raw));
    } catch (e) { /* storage blocked – start fresh */ }
    if (!state) state = defaults();
    state.settings = Object.assign(defaults().settings, state.settings);
    delete state.settings.apiKey; delete state.settings.model; // Claude settings from 1.0/1.1
    state.meetings.forEach(m => { if (DEMO_IDS.includes(m.id)) m.demo = true; });
    if (!state.meetings.some(m => m.demo)) state.meetings = state.meetings.concat(demoMeetings(state.settings.name, state.settings.bossName));
    return state;
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* quota or blocked */ }
  }
  function reset() {
    const real = state ? state.meetings.filter(m => m.room) : [];
    const keep = state ? { settings: state.settings, rooms: state.rooms, outbox: state.outbox, onboarded: state.onboarded } : {};
    state = Object.assign(defaults(), keep);
    state.meetings = real.concat(demoMeetings(state.settings.name, state.settings.bossName));
    save();
  }
  // Meetings the user sees: real ones always, demo ones only while exploring.
  function visible() {
    return state.meetings.filter(m => !m.demo || state.settings.demo || state.settings.showDemo);
  }

  const byStart = (a, b) => new Date(a.start) - new Date(b.start);
  function meeting(id) { return state.meetings.find(m => m.id === id); }
  function sorted() { return visible().slice().sort(byStart); }
  function isPast(m) { return new Date(m.start).getTime() + (m.durationMin || 30) * 6e4 < Date.now(); }
  function previousInSeries(m) {
    if (!m.series) return null;
    return sorted().filter(x => x.series === m.series && new Date(x.start) < new Date(m.start)).pop() || null;
  }
  // The next upcoming meeting whose previous session in the series was missed.
  function pendingCatchUp() {
    const upcoming = sorted().filter(m => !isPast(m));
    for (const m of upcoming) {
      const prev = previousInSeries(m);
      if (prev && prev.attended === false && !prev.caughtUp) return { next: m, prev };
    }
    return null;
  }
  function addMeeting(m) {
    m.id = m.id || 'm' + Date.now().toString(36);
    state.meetings.push(m);
    save();
    return m;
  }
  function removeMeeting(id) {
    state.meetings = state.meetings.filter(m => m.id !== id);
    save();
  }

  /* Transcript import: plain "Namn: text", WebVTT (Teams/Zoom/Meet) and SRT. */
  function parseTranscript(raw) {
    const out = [];
    const txt = String(raw || '').replace(/\r/g, '');
    const blocks = txt.split(/\n\s*\n/);
    const isCaption = /^WEBVTT/.test(txt) || /-->/.test(txt);
    if (isCaption) {
      for (const b of blocks) {
        const ls = b.split('\n').filter(l => l.trim() && !/-->/.test(l) && !/^\d+$/.test(l.trim()) && !/^WEBVTT/.test(l) && !/^NOTE/.test(l));
        if (!ls.length) continue;
        let text = ls.join(' ');
        let who = 'Talare';
        const v = text.match(/<v\s+([^>]+)>/);
        if (v) { who = v[1].trim(); text = text.replace(/<[^>]+>/g, ''); }
        else {
          const c = text.match(/^([^:]{2,40}):\s*(.+)$/);
          if (c) { who = c[1].trim(); text = c[2]; }
        }
        text = text.replace(/<[^>]+>/g, '').trim();
        const last = out[out.length - 1];
        if (last && last.who === who) last.text += ' ' + text; else out.push({ who, text });
      }
      return out;
    }
    for (const l of txt.split('\n')) {
      if (!l.trim()) continue;
      const c = l.match(/^\s*([^:]{1,40}):\s*(.+)$/);
      if (c) out.push({ who: c[1].trim(), text: c[2].trim() });
      else if (out.length) out[out.length - 1].text += ' ' + l.trim();
      else out.push({ who: 'Talare', text: l.trim() });
    }
    return out;
  }

  window.Store = {
    load, save, reset, visible, meeting, sorted, isPast, previousInSeries, pendingCatchUp,
    addMeeting, removeMeeting, parseTranscript, demoMeetings,
    get state() { return state; },
    get settings() { return state.settings; }
  };
})();

</script>
<script>
/* Motey – platform bridge.
 * Same app runs in a browser, in the Android shell (window.MoteyAndroid,
 * injected by the APK) and in the desktop shell (Neutralino: NL_TOKEN/NL_PORT
 * globals and a WebSocket to the native core). */
(function () {
  'use strict';

  const android = () => window.MoteyAndroid || null;
  const desktop = () => !!(window.NL_TOKEN && window.NL_PORT);
  const kind = () => android() ? 'android' : desktop() ? 'desktop' : 'web';

  /* ---- minimal Neutralino native client (same wire format as neutralino.js) ---- */
  let ws = null, wsReady = null;
  const calls = {};
  function nlConnect() {
    if (wsReady) return wsReady;
    wsReady = new Promise((resolve, reject) => {
      const token = window.NL_TOKEN || '';
      ws = new WebSocket(`ws://127.0.0.1:${window.NL_PORT}?connectToken=${token.split('.')[1] || ''}`);
      ws.addEventListener('open', () => resolve(ws));
      ws.addEventListener('error', reject);
      ws.addEventListener('message', ev => {
        let msg; try { msg = JSON.parse(ev.data); } catch (e) { return; }
        const c = msg.id && calls[msg.id];
        if (!c) return;
        delete calls[msg.id];
        if (msg.data && msg.data.error) c.reject(msg.data.error);
        else c.resolve(msg.data && 'returnValue' in msg.data ? msg.data.returnValue : msg.data);
      });
    });
    return wsReady;
  }
  async function nl(method, data) {
    await nlConnect();
    const id = (crypto.randomUUID && crypto.randomUUID()) || String(Date.now() + Math.random());
    return new Promise((resolve, reject) => {
      calls[id] = { resolve, reject };
      ws.send(JSON.stringify({ id, method, data, accessToken: window.NL_TOKEN }));
    });
  }

  function bufToB64(buf) {
    const bytes = new Uint8Array(buf);
    let s = '';
    for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(s);
  }
  async function blobToB64(blob) { return bufToB64(await blob.arrayBuffer()); }

  /* Save a file where the user can find it. Returns a short human message. */
  async function saveFile(name, blob) {
    if (android()) {
      const msg = android().saveFile(name, await blobToB64(blob), blob.type || 'application/octet-stream');
      return msg || `Sparad i Hämtade filer: ${name}`;
    }
    if (desktop()) {
      try {
        const path = await nl('os.showSaveDialog', { title: 'Spara ' + name, defaultPath: name });
        if (!path) return 'Avbrutet';
        await nl('filesystem.writeBinaryFile', { path, data: await blobToB64(blob) });
        return 'Sparad: ' + path;
      } catch (e) { /* fall through to browser download */ }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
    return 'Nedladdad: ' + name;
  }

  async function openUrl(url) {
    if (android()) { android().openUrl(url); return; }
    if (desktop()) { try { await nl('os.open', { url }); return; } catch (e) { /* fallback */ } }
    if (url.startsWith('mailto:')) location.href = url; else window.open(url, '_blank', 'noopener');
  }

  /* ---- speech ---- */
  let voice = null;
  function pickVoice() {
    if (!('speechSynthesis' in window)) return null;
    const vs = speechSynthesis.getVoices();
    voice = vs.find(v => /^sv/i.test(v.lang)) || vs.find(v => /swed/i.test(v.name)) || null;
    return voice;
  }
  if ('speechSynthesis' in window) {
    pickVoice();
    speechSynthesis.onvoiceschanged = pickVoice;
  }
  // Strip emoji so the voice doesn't read them out loud.
  const clean = t => String(t).replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu, '').trim();

  function speak(text, opts) {
    opts = opts || {};
    const t = clean(text);
    if (!t || (window.Store && Store.settings && !Store.settings.voice)) { opts.onend && setTimeout(opts.onend, 1200 + t.length * 45); return; }
    if (android() && android().speak) {
      android().speak(t, String(opts.rate || 1), String(opts.pitch || 1));
      // Android TTS has no JS callback; estimate the duration.
      opts.onend && setTimeout(opts.onend, 900 + t.length * 62 / (opts.rate || 1));
      return;
    }
    if (!('speechSynthesis' in window)) { opts.onend && setTimeout(opts.onend, 900 + t.length * 55); return; }
    const u = new SpeechSynthesisUtterance(t);
    u.lang = 'sv-SE';
    if (voice || pickVoice()) u.voice = voice;
    u.rate = opts.rate || 1.02; u.pitch = opts.pitch || 1.15;
    let done = false;
    const end = () => { if (!done) { done = true; opts.onend && opts.onend(); } };
    u.onend = end; u.onerror = end;
    // Some engines never fire onend; never block the UI on it.
    setTimeout(end, 2500 + t.length * 90);
    speechSynthesis.speak(u);
  }
  function stopSpeaking() {
    if (android() && android().stopSpeaking) android().stopSpeaking();
    if ('speechSynthesis' in window) speechSynthesis.cancel();
  }

  /* ---- speech recognition (only where the engine offers it) ---- */
  function recognizer() {
    const R = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!R) return null;
    const r = new R();
    r.lang = 'sv-SE'; r.continuous = true; r.interimResults = false;
    return r;
  }

  /* ---- notifications, sharing, clipboard ---- */
  let asked = false;
  function notify(title, body) {
    if (android() && android().showNotification) { android().showNotification(String(title), String(body || '')); return; }
    if (desktop()) { nl('os.showNotification', { title, content: body || '' }).catch(() => {}); return; }
    if (!('Notification' in window)) return;
    if (Notification.permission === 'granted') { try { new Notification(title, { body, icon: 'img/icon-192.png' }); } catch (e) { /* not allowed here */ } }
    else if (Notification.permission === 'default' && !asked) { asked = true; Notification.requestPermission().catch(() => {}); }
  }
  async function copy(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* fall back */ }
    const t = document.createElement('textarea');
    t.value = text; t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.appendChild(t); t.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (e) { /* unsupported */ }
    t.remove();
    return ok;
  }
  async function share(text, title) {
    if (android() && android().shareText) { android().shareText(String(text)); return; }

    if (await copy(text)) window.App && App.toast('Kopierat – klistra in där du vill dela 📋');
  }

  window.Platform = { kind, saveFile, openUrl, speak, stopSpeaking, recognizer, blobToB64, bufToB64, nl, notify, copy, share };

<script>
/* Motey – Gemini API client.
 *   Gemini 3.8 Flash       → summaries, catch-up, TikTok scripts, game levels, questions
 *   Gemini 3.8 Flash Live  → Live AI (the style swap, with Motey's voice) and Live Replace
 *
 * Two ways to reach Gemini:
 *   1. Motey-servern (Mer → Prenumeration): the server holds the API key and
 *      counts usage per subscription. This is how a published Motey should run.
 *   2. Your own key (Mer → AI), stored only on this device – for testing.
 * Model ids are looked up from the models list, so "3.8 Flash" and
 * "3.8 Flash Live" resolve to whatever exact ids Google publishes. */
(function () {
  'use strict';
  const API = 'https://generativelanguage.googleapis.com/v1beta';
  const LIVE_WS = 'wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent';
  const DEFAULTS = { flash: 'gemini-3.8-flash', live: 'gemini-3.8-flash-live' };
  const S = () => Store.settings;
  const server = () => (S().serverUrl || '').replace(/\/+$/, '');
  const key = () => S().geminiKey || '';
  const available = () => !!(server() || key());

  class GeminiError extends Error { constructor(msg, status, kind) { super(msg); this.status = status; this.kind = kind; } }

  async function request(path, opts) {
    const url = server() ? `${server()}/v1/ai${path}` : `${S().geminiApi || API}${path}`;
    const headers = { 'content-type': 'application/json' };
    if (server()) headers.authorization = 'Bearer ' + Plans.token(); else headers['x-goog-api-key'] = key();
    const res = await fetch(url, Object.assign({ headers }, opts));
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      const msg = (data.error && (data.error.message || data.error)) || 'HTTP ' + res.status;
      throw new GeminiError(String(msg), res.status, data.error && data.error.kind);
    }
    return data;
  }

  /* ---------- model ids ---------- */
  let resolved = null;
  async function models() {
    if (S().modelFlash && S().modelLive) return { flash: S().modelFlash, live: S().modelLive };
    if (!resolved) {
      resolved = (async () => {
        const out = Object.assign({}, DEFAULTS);
        try {
          const d = await request('/models?pageSize=1000', { method: 'GET' });
          const list = (d.models || []).map(m => ({ id: m.name.replace(/^models\//, ''), methods: m.supportedGenerationMethods || [] }));
          const pick = (rx, method) => {
            const c = list.filter(m => rx.test(m.id) && m.methods.includes(method));
            // prefer stable ids over previews, shortest name wins
            c.sort((a, b) => (/preview|exp/.test(a.id) - /preview|exp/.test(b.id)) || a.id.length - b.id.length);
            return c[0] && c[0].id;
          };
          out.flash = pick(/^gemini-3\.8-flash(?!.*(live|audio|tts|image|lite))/, 'generateContent') || out.flash;
          out.live = pick(/3\.8-flash.*(live|native-audio)|live.*3\.8-flash/, 'bidiGenerateContent') || out.live;
        } catch (e) { console.warn('kunde inte läsa modellistan, använder standardnamn', e.message); }
        return out;
      })();
    }
    const r = await resolved;
    return { flash: S().modelFlash || r.flash, live: S().modelLive || r.live };
  }

  /* ---------- Gemini 3.8 Flash: one request, text or JSON back ---------- */
  // schema uses Gemini's OpenAPI subset: {type:'OBJECT', properties, required}
  async function generate({ system, prompt, parts, schema, action, temperature }) {
    const m = (await models()).flash;
    const body = {
      contents: [{ role: 'user', parts: parts || [{ text: prompt }] }],
      generationConfig: { temperature: temperature == null ? 0.7 : temperature }
    };
    if (system) body.systemInstruction = { parts: [{ text: system }] };
    if (schema) { body.generationConfig.responseMimeType = 'application/json'; body.generationConfig.responseSchema = schema; }
    if (server()) body.motey = { action }; // the server meters it; Google never sees this field
    const d = await request(`/models/${encodeURIComponent(m)}:generateContent`, { method: 'POST', body: JSON.stringify(body) });
    if (d.promptFeedback && d.promptFeedback.blockReason) throw new GeminiError('blockerad: ' + d.promptFeedback.blockReason, 400, 'blocked');
    const c = (d.candidates || [])[0];
    const text = c && c.content && (c.content.parts || []).map(p => p.text || '').join('');
    if (!text) throw new GeminiError('tomt svar' + (c && c.finishReason ? ' (' + c.finishReason + ')' : ''), 500);
    if (d.motey && window.Plans) Plans.serverUsage(d.motey);
    return schema ? JSON.parse(text) : text.trim();
  }
  const S_ = {
    str: { type: 'STRING' }, int: { type: 'INTEGER' },
    arr: items => ({ type: 'ARRAY', items }),
    obj: (properties, required) => ({ type: 'OBJECT', properties, required: required || Object.keys(properties) })
  };

  /* ---------- Gemini 3.8 Flash Live: a two-way WebSocket session ---------- */
  class Live {
    constructor(opts) {
      this.o = opts; // { system, voice, modality: 'AUDIO'|'TEXT', action, onText, onAudio, onIn, onTurn, onClose, onError }
      this.ws = null; this.ready = null; this.closed = false;
    }
    async open() {
      const m = (await models()).live;
      const url = server()
        ? `${server().replace(/^http/, 'ws')}/v1/ai/live?token=${encodeURIComponent(Plans.token())}&action=${encodeURIComponent(this.o.action || 'live')}`
        : `${S().geminiWs || LIVE_WS}?key=${encodeURIComponent(key())}`;
      this.ready = new Promise((resolve, reject) => {
        const ws = this.ws = new WebSocket(url);
        ws.onopen = () => {
          const setup = {
            model: 'models/' + m,
            generationConfig: { responseModalities: [this.o.modality || 'AUDIO'] },
            systemInstruction: { parts: [{ text: this.o.system || '' }] },
            outputAudioTranscription: {},
            inputAudioTranscription: {}
          };
          if ((this.o.modality || 'AUDIO') === 'AUDIO') setup.generationConfig.speechConfig = { voiceConfig: { prebuiltVoiceConfig: { voiceName: this.o.voice || 'Puck' } } };
          ws.send(JSON.stringify({ setup }));
        };
        ws.onmessage = async ev => {
          const raw = typeof ev.data === 'string' ? ev.data : await ev.data.text();
          let msg; try { msg = JSON.parse(raw); } catch (e) { return; }
          if (msg.setupComplete) return resolve(this);
          if (msg.motey && window.Plans) Plans.serverUsage(msg.motey);
          if (msg.error) { const e = new GeminiError(msg.error.message || 'fel', msg.error.code, msg.error.kind); this.o.onError && this.o.onError(e); return reject(e); }
          const sc = msg.serverContent;
          if (!sc) return;
          if (sc.inputTranscription && sc.inputTranscription.text) this.o.onIn && this.o.onIn(sc.inputTranscription.text);
          if (sc.outputTranscription && sc.outputTranscription.text) this.o.onText && this.o.onText(sc.outputTranscription.text);
          for (const p of (sc.modelTurn && sc.modelTurn.parts) || []) {
            if (p.text && this.o.onText && this.o.modality === 'TEXT') this.o.onText(p.text);
            if (p.inlineData && /audio/.test(p.inlineData.mimeType) && this.o.onAudio) this.o.onAudio(p.inlineData.data, p.inlineData.mimeType);
          }
          if (sc.interrupted && this.o.onInterrupt) this.o.onInterrupt();
          if (sc.turnComplete && this.o.onTurn) this.o.onTurn();
        };
        ws.onerror = () => reject(new GeminiError('kunde inte ansluta till Gemini Live', 0));
        ws.onclose = ev => {
          this.closed = true;
          if (ev.code === 4402 || ev.code === 4403) this.o.onError && this.o.onError(new GeminiError(ev.reason || 'kvoten är slut', 402, 'quota'));
          this.o.onClose && this.o.onClose(ev);
          reject(new GeminiError(ev.reason || 'stängd', ev.code));
        };
      });
      return this.ready;
    }
    text(t) { this.send({ clientContent: { turns: [{ role: 'user', parts: [{ text: t }] }], turnComplete: true } }); }
    audio(b64) { this.send({ realtimeInput: { audio: { data: b64, mimeType: 'audio/pcm;rate=16000' } } }); }
    send(obj) { if (this.ws && this.ws.readyState === 1) this.ws.send(JSON.stringify(obj)); }
    close() { this.closed = true; try { this.ws && this.ws.close(); } catch (e) { /* closed */ } }
  }

  /* ---------- audio helpers ---------- */
  const AC = window.AudioContext || window.webkitAudioContext;
  // One or more MediaStreams (mixed) → 16 kHz 16-bit PCM chunks (base64) every ~130 ms.
  function pcmCapture(streams, onChunk) {
    const ctx = new AC({ sampleRate: 16000 });
    const mix = ctx.createGain();
    const proc = ctx.createScriptProcessor(2048, 1, 1);
    const ratio = ctx.sampleRate / 16000;
    proc.onaudioprocess = e => {
      const f = e.inputBuffer.getChannelData(0);
      const n = Math.floor(f.length / ratio);
      const out = new Int16Array(n);
      for (let i = 0; i < n; i++) { const s = Math.max(-1, Math.min(1, f[Math.floor(i * ratio)])); out[i] = s < 0 ? s * 0x8000 : s * 0x7FFF; }
      onChunk(Platform.bufToB64(out.buffer));
    };
    const mute = ctx.createGain(); mute.gain.value = 0;
    mix.connect(proc); proc.connect(mute); mute.connect(ctx.destination);
    const srcs = [];
    const add = st => { if (st && st.getAudioTracks().length) { const src = ctx.createMediaStreamSource(new MediaStream(st.getAudioTracks())); src.connect(mix); srcs.push(src); } };
    [].concat(streams).forEach(add);
    if (ctx.state === 'suspended') ctx.resume();
    return { ctx, add, stop() { try { srcs.forEach(x => x.disconnect()); proc.disconnect(); ctx.close(); } catch (e) { /* closed */ } } };
  }
  // 24 kHz PCM from Gemini → speakers (and optionally a MediaStream for calls).
  function pcmPlayer(opts) {
    opts = opts || {};
    const ctx = new AC();
    const out = ctx.createGain();
    const an = ctx.createAnalyser(); an.fftSize = 512;
    out.connect(an);
    if (opts.speakers !== false) out.connect(ctx.destination);
    const dest = ctx.createMediaStreamDestination ? ctx.createMediaStreamDestination() : null;
    if (dest) out.connect(dest);
    let at = 0;
    const sources = new Set();
    const lvl = new Uint8Array(an.fftSize);
    return {
      ctx, stream: dest && dest.stream,
      play(b64, mime) {
        if (ctx.state === 'suspended') ctx.resume();
        const rate = +((mime || '').match(/rate=(\d+)/) || [0, 24000])[1];
        const bin = atob(b64), n = bin.length >> 1;
        const buf = ctx.createBuffer(1, n, rate), ch = buf.getChannelData(0);
        for (let i = 0; i < n; i++) { let v = bin.charCodeAt(2 * i) | (bin.charCodeAt(2 * i + 1) << 8); if (v >= 0x8000) v -= 0x10000; ch[i] = v / 0x8000; }
        const s = ctx.createBufferSource(); s.buffer = buf; s.connect(out);
        at = Math.max(at, ctx.currentTime + 0.03); s.start(at); at += buf.duration;
        sources.add(s); s.onended = () => sources.delete(s);
      },
      flush() { sources.forEach(s => { try { s.stop(); } catch (e) { /* done */ } }); sources.clear(); at = 0; },
      level() { an.getByteTimeDomainData(lvl); let m = 0; for (const v of lvl) m = Math.max(m, Math.abs(v - 128)); return m / 128; },
      speaking() { return ctx.currentTime < at; },
      close() { this.flush(); try { ctx.close(); } catch (e) { /* closed */ } }
    };
  }

  const VOICES = [['Puck', 'Glad (Motey)'], ['Kore', 'Lugn'], ['Aoede', 'Ljus'], ['Charon', 'Djup'], ['Fenrir', 'Energisk'], ['Leda', 'Mjuk']];

  window.Gemini = { available, generate, Live, models, pcmCapture, pcmPlayer, schema: S_, GeminiError, VOICES, DEFAULTS, reset() { resolved = null; } };
})();

/* Motey – builds real documents in the browser, no libraries:
 * PDF (text, A4, Helvetica), XLSX and DOCX (Office Open XML in a stored ZIP). */
(function () {
  'use strict';

  /* ---------- ZIP (stored, UTF-8 names) ---------- */
  const CRC = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
    return t;
  })();
  function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
  function zip(files, mime) {
    const enc = new TextEncoder();
    const parts = [], central = [];
    let offset = 0;
    const d = new Date();
    const dosTime = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
    const dosDate = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
    for (const f of files) {
      const name = enc.encode(f.name);
      const data = typeof f.data === 'string' ? enc.encode(f.data) : f.data;
      const crc = crc32(data);
      const h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
      h.setUint16(10, dosTime, true); h.setUint16(12, dosDate, true); h.setUint32(14, crc, true);
      h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, name.length, true); h.setUint16(28, 0, true);
      parts.push(new Uint8Array(h.buffer), name, data);
      const c = new DataView(new ArrayBuffer(46));
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
      c.setUint16(12, dosTime, true); c.setUint16(14, dosDate, true); c.setUint32(16, crc, true);
      c.setUint32(20, data.length, true); c.setUint32(24, data.length, true); c.setUint16(28, name.length, true);
      c.setUint32(42, offset, true);
      central.push(new Uint8Array(c.buffer), name);
      offset += 30 + name.length + data.length;
    }
    const csize = central.reduce((s, p) => s + p.length, 0);
    const e = new DataView(new ArrayBuffer(22));
    e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true);
    e.setUint32(12, csize, true); e.setUint32(16, offset, true);

  }

  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  /* ---------- PDF ---------- */
  const WIN = { '€': 0x80, '‚': 0x82, '„': 0x84, '…': 0x85, '•': 0x95, '–': 0x96, '—': 0x97, '‘': 0x91, '’': 0x92, '“': 0x93, '”': 0x94, '™': 0x99 };
  function pdfHex(s) {
    let h = '';
    for (const ch of String(s)) {
      let c = ch.codePointAt(0);

      h += c.toString(16).padStart(2, '0');

    const max = Math.max(10, Math.floor(width / (size * 0.52)));
    const out = [];
    for (const para of String(text).split('\n')) {
      let line = '';
      for (const w of para.split(/\s+/)) {
        if ((line + ' ' + w).trim().length > max) { if (line) out.push(line); line = w; }

      if (b.h1) { put('F2', 20, b.h1, M, 6); pages[pages.length - 1].push(`0.42 0.30 0.96 RG 2 w ${M} ${y.toFixed(1)} m ${W - M} ${y.toFixed(1)} l S`); y -= 10; }
      else if (b.h2) { y -= 6; put('F2', 13, b.h2, M, 2); }

      else if (b.small) put('F1', 9, b.small, M, 4);
      else put('F1', 11, b.p || '', M, 5);

    const objs = [];
    objs[1] = '<< /Type /Catalog /Pages 2 0 R >>';
    objs[3] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
    objs[4] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
    const kids = [];
    pages.forEach((ops, i) => {
      const pid = 5 + i * 2, cid = 6 + i * 2;
      const stream = ops.join('\n') + `\nBT /F1 8 Tf ${M} 30 Td ${pdfHex('Skapad av Motey – sida ' + (i + 1) + ' av ' + pages.length)} Tj ET`;
      objs[pid] = `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${cid} 0 R >>`;
      objs[cid] = `<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`;
      kids.push(`${pid} 0 R`);
    });
    objs[2] = `<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${pages.length} >>`;
    let out = '%PDF-1.4\n';
    const offs = [];
    for (let i = 1; i < objs.length; i++) { offs[i] = out.length; out += `${i} 0 obj\n${objs[i]}\nendobj\n`; }
    const xref = out.length;
    out += `xref\n0 ${objs.length}\n0000000000 65535 f \n` + offs.slice(1).map(o => String(o).padStart(10, '0') + ' 00000 n \n').join('');
    out += `trailer\n<< /Size ${objs.length} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
    return new Blob([out], { type: 'application/pdf' });
  }

  function colName(i) { let s = ''; i++; while (i) { const r = (i - 1) % 26; s = String.fromCharCode(65 + r) + s; i = Math.floor((i - 1) / 26); } return s; }

        return typeof v.n === 'number' ? `<c r="${ref}" s="1"><v>${v.n}</v></c>` : `<c r="${ref}" t="inlineStr" s="1"><is><t>${esc(v.b)}</t></is></c>`;

      { name: '[Content_Types].xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="${NS}/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>` },
      { name: '_rels/.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${NS}/package/2006/relationships"><Relationship Id="rId1" Type="${NS}/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>` },
      { name: 'xl/workbook.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="${NS}/spreadsheetml/2006/main" xmlns:r="${NS}/officeDocument/2006/relationships"><sheets><sheet name="${esc(sheetName.slice(0, 31))}" sheetId="1" r:id="rId1"/></sheets></workbook>` },
      { name: 'xl/_rels/workbook.xml.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${NS}/package/2006/relationships"><Relationship Id="rId1" Type="${NS}/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="${NS}/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>` },
      { name: 'xl/styles.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="${NS}/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs></styleSheet>` },
      { name: 'xl/worksheets/sheet1.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="${NS}/spreadsheetml/2006/main"><cols><col min="1" max="1" width="60" customWidth="1"/><col min="2" max="4" width="18" customWidth="1"/></cols><sheetData>${body}</sheetData></worksheet>` }

    return b;
  }

  /* Build a draft of a missing file from what was said in the meeting. */
  function draftFor(meeting, sum, fileName) {
    const ext = (fileName.split('.').pop() || '').toLowerCase();
    if (ext === 'xlsx' || ext === 'xls' || ext === 'csv') {
      const nums = amounts(meeting);
      const rows = [
        [{ b: fileName.replace(/\.[^.]+$/, '').replace(/_/g, ' ') }],
        [`${meeting.title} – utkast skapat av Motey`],
        [],
        [{ b: 'Beskrivning' }, { b: 'Värde' }, { b: 'Enhet' }, { b: 'Sagt av' }]
      ];
      nums.forEach(r => rows.push([r.text, r.n, r.enhet, r.who]));
      if (!nums.length) sum.points.forEach(p => rows.push([p]));
      rows.push([], [{ b: 'Att göra' }]);
      sum.actions.forEach(a => rows.push([a.what, '', '', a.who || '']));
      if (ext === 'csv') {
        const csv = rows.map(r => r.map(v => v && typeof v === 'object' ? (v.b || v.n) : v).map(v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`).join(';')).join('\r\n');
        return { name: fileName, blob: new Blob(['﻿' + csv], { type: 'text/csv' }) };
      }
      return { name: fileName.replace(/\.xls$/i, '.xlsx'), blob: xlsx('Motey', rows) };
    }
    const blocks = reportBlocks(meeting, sum, fileName);
    if (ext === 'docx' || ext === 'doc') return { name: fileName.replace(/\.doc$/i, '.docx'), blob: docx(blocks) };
    if (ext === 'pdf') return { name: fileName, blob: pdf(blocks) };
    // Anything else (pptx, key, …): a PDF with the same base name.
    return { name: fileName.replace(/\.[^.]+$/, '') + '.pdf', blob: pdf(blocks) };
  }

  window.Docs = { zip, pdf, xlsx, docx, draftFor, reportBlocks, amounts, crc32 };
})();

    (st.swap || []).forEach(([rx, rep]) => { t = t.replace(rx, rep); });
    if (st.lower) t = t.toLowerCase().replace(/\.$/, '');
    const sentences = x => x.replace(/([.!?]\s+)([a-zåäö])/g, (m, a, b) => a + b.toUpperCase());
    if (st.wrap) return st.wrap(sentences(cap(t)));
    if (st.lower) return pick(st.pre) + t + pick(st.post);
    return sentences(cap(pick(st.pre || ['']) + cap(t) + pick(st.post || [''])));
  }

  function localVideoScript(meeting, sum) {
    const scenes = [];
    const cs = concepts(meeting);
    const kws = sum.keywords || [];
    scenes.push({ caption: `POV: du missade "${meeting.title}" 😅 Här är allt på 30 sekunder`, narration: `Du missade ${meeting.title}? Ingen fara, här är allt på trettio sekunder!`, query: cs[0] ? GLOSSARY[cs[0]].wiki : kws[0], emoji: '⏱️' });
    const pts = sum.points.slice(0, 4);
    pts.forEach((p, i) => {
      const txt = p.replace(/^[^:]+:\s*/, '');
      const c = cs.find(k => ALIASES[k].some(a => txt.toLowerCase().includes(a)));
      const kw = c ? GLOSSARY[c].wiki : (words(txt).find(w => kws.includes(w)) || kws[i] || 'kontor');
      scenes.push({ caption: shorten(txt, 90), narration: txt, query: kw, emoji: c ? GLOSSARY[c].icon : ['💡', '📌', '🚀', '🎯'][i % 4] });
    });
    if (sum.actions.length) {
      const a = sum.actions.slice(0, 2).map(x => `${x.who}: ${shorten(x.what, 50)}`).join(' · ');
      scenes.push({ caption: 'Att göra ✅ ' + a, narration: 'Att göra: ' + sum.actions.slice(0, 2).map(x => x.who + ' ' + x.what).join('. '), query: 'Checklista', emoji: '✅' });
    }
    scenes.push({ caption: 'Följ för fler möten du slipper sitta i 😎', narration: 'Följ Motey för fler möten du slipper sitta i!', query: null, emoji: '💜' });
    return scenes;
  }
  const shorten = (s, n) => s.length > n ? s.slice(0, n - 1).replace(/\s\S*$/, '') + '…' : s;

  function localLevel(meeting) {
    let cs = concepts(meeting).map(k => Object.assign({ key: k }, GLOSSARY[k]));
    const t = meeting.transcript || [];
    // Meetings without finance words: build walls from the meeting's own keywords.
    if (cs.length < 3) {
      const kws = keywords(meeting, 10).filter(w => w.length > 4);
      for (const w of kws) {
        if (cs.length >= 4) break;
        const line = t.find(l => l.text.toLowerCase().includes(w));
        if (!line) continue;
        const others = t.filter(l => l !== line && l.text.length > 20).map(l => shorten(l.text, 80));
        const right = shorten(line.text, 80);
        const opts = [right, pick(others) || 'Det pratade ingen om', 'Att mötet skulle ställas in'].filter((v, i, a) => a.indexOf(v) === i);
        while (opts.length < 3) opts.push('Ingenting alls');
        const order = opts.map((o, i) => ({ o, r: Math.random() + (i === 0 ? 0 : 0) })).sort((a, b) => a.r - b.r).map(x => x.o);
        cs.push({ key: w, term: cap(w), icon: '🧱', wiki: w, explain: `På mötet sa ${firstName(line.who)}: ”${line.text}”`, howTo: 'Kom ihåg vad som sades – svara rätt så krossar du väggen!', q: `Vad sades om ”${w}” på mötet?`, opts: order, a: order.indexOf(right) });
      }
    }
    const facts = localSummary(meeting).points.slice(0, 6).map(p => p.replace(/^[^:]+:\s*/, ''));
    return { title: meeting.title, walls: cs.slice(0, 6), facts };
  }

  function localAnswer(question, meeting) {
    const q = question.toLowerCase();
    for (const [k, al] of Object.entries(ALIASES)) if (al.some(a => q.includes(a)) || q.includes(k)) {
      const g = GLOSSARY[k];
      return `${g.term}: ${g.explain} ${g.howTo}`;
    }
    const qs = words(q);
    let best = null, bs = 0;
    for (const l of meeting ? meeting.transcript || [] : []) {
      const s = words(l.text).filter(w => qs.includes(w)).length;
      if (s > bs) { bs = s; best = l; }
    }
    if (best) return `På mötet sa ${firstName(best.who)}: ”${best.text}”`;
    return 'Det vet jag inte riktigt än! När Gemini är kopplat (Mer → AI) kan jag svara på allt. 😊';
  }

  /* ---------- Gemini 3.8 Flash ---------- */
  const hasKey = () => !!(window.Gemini && Gemini.available());
  const SYS = 'Du är Motey, en glad AI-mötesassistent formad som en pratbubbla. Du svarar alltid på svenska, kort och tydligt.';
  const transcriptText = m => (m.transcript || []).map(l => `${l.who}: ${l.text}`).join('\n');
  const G = () => Gemini.schema;

  // Usage gate: in Lite, Plus and Pro every AI thing counts (offline engine too).
  function gate(action) { if (!Plans.allow(action)) throw new Plans.QuotaError('quota', action); }
  async function withFallback(action, fnGemini, fnLocal) {
    if (action) gate(action);
    let r;
    if (!hasKey()) r = { source: 'local', value: fnLocal() };
    else {
      try { r = { source: 'gemini', value: await fnGemini() }; }
      catch (e) {
        if (e.kind === 'quota' || e.status === 402) { Plans.refresh(); Plans.upgradeSheet(new Plans.QuotaError('quota', action)); throw new Plans.QuotaError('quota', action); }
        console.warn('Gemini misslyckades, använder offline-motorn:', e.message);
        r = { source: 'local', value: fnLocal(), error: e.message };
      }
    }
    if (action) Plans.charge(action);
    return r;
  }

  /* ---------- public API ---------- */
  const cache = {};
  // opts.charge: count it as a "Sammanfattning" (the summary tab); internal uses are free.
  async function summarize(meeting, opts) {
    const key = meeting.id + ':' + (meeting.transcript || []).length + ':' + hasKey();
    if (cache[key]) return cache[key];
    if (!(meeting.transcript || []).length) return { source: 'local', value: localSummary(meeting) };
    const r = await withFallback(opts && opts.charge ? 'summary' : null, async () => {
      const v = await Gemini.generate({
        system: SYS, action: 'summary',
        prompt: `Sammanfatta mötet "${meeting.title}". Ge en kort sammanfattning (2–3 meningar), de viktigaste punkterna, beslut, att göra-punkter med ansvarig person, alla filer/dokument som nämns och 6–8 nyckelord.\n\nTranskript:\n${transcriptText(meeting)}`,
        schema: G().obj({ summary: G().str, points: G().arr(G().str), decisions: G().arr(G().str), actions: G().arr(G().obj({ who: G().str, what: G().str })), files: G().arr(G().str), keywords: G().arr(G().str) })
      });
      (meeting.files || []).forEach(f => v.files.includes(f.name) || v.files.push(f.name));
      return v;
    }, () => localSummary(meeting));
    cache[key] = r;
    return r;
  }

  async function catchUp(prev, user) {
    gate('catchup');
    const sum = (await summarize(prev)).value;
    const d0 = new Date(prev.start), today = new Date();
    const ago = Math.round((new Date(today.toDateString()) - new Date(d0.toDateString())) / 864e5);
    const day = ago === 0 ? 'dag' : ago === 1 ? 'går' : d0.toLocaleDateString('sv-SE', { weekday: 'long' }) + 's';
    const mine = sum.actions.filter(a => firstName(a.who).toLowerCase() === firstName(user).toLowerCase() || a.who === 'Alla');
    const r = await withFallback('catchup',
      () => Gemini.generate({
        system: SYS, action: 'catchup',
        prompt: `${user} missade mötet "${prev.title}" i ${day}. Skriv en kort, varm och lite rolig uppdatering (max 70 ord) direkt till ${user}: vad som hände, vilka beslut som togs och vad ${user} själv ska göra. Ingen rubrik.\n\nTranskript:\n${transcriptText(prev)}`
      }),
      () => `Hej ${user}! Du missade "${prev.title}" i ${day}. ${sum.summary}` +
        (sum.decisions.length ? ` Det viktigaste beslutet: ${sum.decisions[0].replace(/^[^:]+:\s*/, '').replace(/^((bra|toppen|okej|tack|beslut)[.!:,]?\s*)+/i, '')}` : '') +
        (mine.length ? ` Och du ska: ${mine.map(a => a.what.replace(new RegExp('^' + firstName(user) + ',?\\s+(du\\s+)?ska\\s+', 'i'), '').replace(/^alla ska\s+/i, 'precis som alla andra ').replace(/\bsina\b/g, 'dina').replace(/\bsitt\b/g, 'ditt').replace(/\bsin\b/g, 'din').replace(/\btill mig\b/i, 'till ' + (a.from || 'chefen')).replace(/\.$/, '')).join(', och ')}.` : '')
    );
    return { text: r.value, source: r.source, sum, mine };
  }

  // Offline style swap (demo, and when Gemini isn't connected). With Gemini the
  // Live AI screen uses Gemini 3.8 Flash Live instead, see live.js.
  async function restyle(text, style) {
    return { source: 'local', value: localRestyle(text, style) };
  }
  function liveInstruction(style, who) {
    const st = STYLES[style] || STYLES.snall;
    return `Du är Motey och tar ${who ? who + 's' : 'talarens'} plats i ett möte i realtid. Varje gång du hör eller får en replik ska du direkt säga samma sak igen på svenska i stilen "${st.name}". ` +
      'Behåll exakt samma budskap, fakta, siffror, datum, namn och uppgifter – bara tonen ändras, och den ska vara vänlig och lätt att höra. ' +
      'Svara aldrig på frågor, lägg inte till något eget och kommentera inte. Säg bara den omskrivna repliken. Är det tyst eller ohörbart säger du ingenting.';
  }

  async function videoScript(meeting) {
    const sum = (await summarize(meeting)).value;
    return withFallback('tiktok',
      () => Gemini.generate({
        system: SYS + ' Du gör korta, roliga vertikala videor (TikTok-stil) om möten.', action: 'tiktok', temperature: 0.9,
        prompt: `Gör ett manus för en 30–40 sekunders TikTok-video om mötet "${meeting.title}". 5–7 scener. Varje scen: caption (max 90 tecken, gärna med emoji), narration (det som sägs, max 25 ord), query (ett sökord för en passande Wikipedia-bild, helst ett substantiv på svenska, eller tom sträng), emoji (en emoji). Första scenen är en hook, sista en uppmaning.\n\nTranskript:\n${transcriptText(meeting)}`,
        schema: G().obj({ scenes: G().arr(G().obj({ caption: G().str, narration: G().str, query: G().str, emoji: G().str })) })
      }).then(v => v.scenes),
      () => localVideoScript(meeting, sum)
    );
  }

  async function gameLevel(meeting) {
    return withFallback('game',
      () => Gemini.generate({
        system: SYS + ' Du bygger banor i ett pedagogiskt spel där varje vägg är ett begrepp från mötet.', action: 'game', temperature: 0.6,
        prompt: `Gör 3–6 väggar till en spelbana om mötet "${meeting.title}". Varje vägg är ett viktigt begrepp från mötet (t.ex. F-skatt, moms). För varje: term, icon (en emoji), explain (förklara begreppet enkelt och korrekt, 2–3 meningar), howTo (så "förstör" man väggen = vad man konkret gör i verkligheten, 1–2 meningar), q (en kontrollfråga), opts (exakt 3 svarsalternativ), a (index 0–2 för rätt svar). Lägg också till 3–6 korta facts från mötet.\n\nTranskript:\n${transcriptText(meeting)}`,
        schema: G().obj({ walls: G().arr(G().obj({ term: G().str, icon: G().str, explain: G().str, howTo: G().str, q: G().str, opts: G().arr(G().str), a: G().int })), facts: G().arr(G().str) })
      }).then(v => ({ title: meeting.title, walls: v.walls.filter(w => w.opts.length >= 2 && w.a >= 0 && w.a < w.opts.length).slice(0, 6), facts: v.facts })),
      () => localLevel(meeting)
    );
  }

  async function ask(question, meeting) {
    return withFallback('ask',
      () => Gemini.generate({
        system: SYS + ' Du är spelkompis i Motey-spelläget och förklarar saker enkelt.', action: 'ask',
        prompt: `Fråga: ${question}\n\nSvara kort (max 60 ord).` + (meeting ? `\n\nMötets transkript:\n${transcriptText(meeting)}` : '')
      }),
      () => localAnswer(question, meeting)
    );
  }

  async function testKey() {
    const m = await Gemini.models();
    const hi = await Gemini.generate({ system: SYS, prompt: 'Säg hej i max fem ord.', action: 'test' });
    return `${hi} (${m.flash} · ${m.live})`;
  }

  window.AI = { summarize, catchUp, restyle, liveInstruction, videoScript, gameLevel, ask, testKey, hasKey, STYLES, GLOSSARY, keywords, concepts, localRestyle, localSummary, firstName };
})();
