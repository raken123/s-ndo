<style>
/* Motey – stilmall */
:root {
  --bg: #F6F4FF;
  --surface: #FFFFFF;
  --surface-2: #EFEBFF;
  --ink: #1E1B3A;
  --ink-2: #5B5878;
  --line: #E1DCF5;
  --brand: #6C4CF5;
  --brand-2: #8F75FF;
  --brand-ink: #FFFFFF;
  --coral: #FF7A59;
  --mint: #19C79A;
  --sun: #FFC93C;
  --rose: #FF5C8A;
  --danger: #E5484D;
  --radius: 18px;
  --shadow: 0 6px 24px rgba(40, 24, 120, .10);
  --font: "Nunito", "Segoe UI", "SF Pro Rounded", system-ui, -apple-system, Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12101F; --surface: #1C1930; --surface-2: #252142; --ink: #F3F1FF; --ink-2: #ABA6CC;
    --line: #322D55; --shadow: 0 6px 24px rgba(0, 0, 0, .35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12101F; --surface: #1C1930; --surface-2: #252142; --ink: #F3F1FF; --ink-2: #ABA6CC;
  --line: #322D55; --shadow: 0 6px 24px rgba(0, 0, 0, .35); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font);
  font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--brand); }
h1, h2, h3 { line-height: 1.2; margin: 0 0 .4em; }
h1 { font-size: 1.6rem; font-weight: 900; }
h2 { font-size: 1.25rem; font-weight: 850; }
h3 { font-size: 1.05rem; font-weight: 800; }
p { margin: 0 0 .7em; }
.muted { color: var(--ink-2); }
.small { font-size: .86rem; }
.hidden { display: none !important; }

/* ---------- layout ---------- */
.app { min-height: 100%; display: flex; }
.rail {
  display: none; flex-direction: column; gap: 6px; width: 230px; padding: 18px 14px;
  background: var(--surface); border-right: 1px solid var(--line); position: sticky; top: 0; height: 100vh;
}
.rail .motey-logo { margin: 0 6px 18px; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px;
  padding: 10px 16px; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
}
.topbar .spacer { flex: 1; }
.view { padding: 16px 16px 96px; max-width: 980px; width: 100%; margin: 0 auto; }
.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; display: flex;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
}
.tabbar button, .rail button.nav {
  flex: 1; border: 0; background: none; border-radius: 12px; padding: 6px 4px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .72rem; font-weight: 700; color: var(--ink-2);
}
.tabbar button .ico, .rail button.nav .ico { font-size: 1.3rem; line-height: 1; }
.tabbar button.on, .rail button.nav.on { color: var(--brand); background: var(--surface-2); }
.rail button.nav { flex: none; flex-direction: row; gap: 12px; font-size: .98rem; padding: 10px 12px; justify-content: flex-start; }
@media (min-width: 900px) {

}

/* ---------- logo ---------- */
.motey-logo { display: inline-flex; align-items: center; gap: 8px; }
.motey-word {
  font-weight: 900; font-size: 1.45rem; letter-spacing: -.02em;
  background: linear-gradient(90deg, var(--brand), var(--rose)); -webkit-background-clip: text; background-clip: text; color: transparent;
}

/* ---------- mascot animation ---------- */
.motey-svg { overflow: visible; display: block; }
.motey-svg.is-alive .mt-body { animation: mt-float 3.2s ease-in-out infinite; transform-origin: 100px 160px; }
.motey-svg.is-alive .mt-shadow { animation: mt-shadow 3.2s ease-in-out infinite; transform-origin: 104px 190px; }
.motey-svg.is-alive .mt-eye { animation: mt-blink 4.6s infinite; transform-origin: 100px 82px; }
.motey-svg.is-talking .mt-smile { opacity: 0; }
.motey-svg.is-talking .mt-talk { animation: mt-talk .28s ease-in-out infinite alternate; transform-origin: 100px 122px; }
.motey-svg.is-talking .mt-body { animation: mt-bob .5s ease-in-out infinite alternate; }
@keyframes mt-float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-7px) } }
@keyframes mt-shadow { 0%,100% { transform: scaleX(1); opacity: 1 } 50% { transform: scaleX(.85); opacity: .7 } }
@keyframes mt-blink { 0%,92%,100% { transform: scaleY(1) } 95% { transform: scaleY(.1) } }
@keyframes mt-talk { from { opacity: 1; transform: scaleY(.25) } to { opacity: 1; transform: scaleY(1) } }
@keyframes mt-bob { from { transform: translateY(0) rotate(-1.5deg) } to { transform: translateY(-4px) rotate(1.5deg) } }

/* ---------- components ---------- */
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px;
}
.card.hero {
  display: flex; gap: 16px; align-items: center;
  background: linear-gradient(135deg, var(--brand) 0%, #9B6BFF 55%, var(--rose) 130%);
  color: #fff; border: 0;
}
.card.hero .muted { color: rgba(255,255,255,.85); }
.card.hero .btn.ghost { color: #fff; border-color: rgba(255,255,255,.55); }
.grid { display: grid; gap: 14px; }
@media (min-width: 640px) { .grid.two { grid-template-columns: 1fr 1fr; } .grid.three { grid-template-columns: repeat(3, 1fr); } }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.stack > * + * { margin-top: 10px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px;
  border: 2px solid transparent; padding: 10px 18px; font-weight: 800; cursor: pointer;
  background: var(--brand); color: var(--brand-ink); transition: transform .08s, filter .15s; text-decoration: none;
  min-height: 44px;
}
.btn:hover { filter: brightness(1.07); }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.ghost { background: transparent; color: var(--brand); border-color: var(--line); }
.btn.coral { background: var(--coral); }
.btn.mint { background: var(--mint); }
.btn.dark { background: var(--ink); color: var(--bg); }
.btn.sm { padding: 6px 12px; min-height: 34px; font-size: .88rem; }

.icon-btn { border: 0; background: var(--surface-2); border-radius: 12px; width: 40px; height: 40px; cursor: pointer; font-size: 1.15rem; }

.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; cursor: pointer;
  background: var(--surface-2); border: 2px solid transparent; font-weight: 700; font-size: .9rem; user-select: none;
}
.chip.on { border-color: var(--brand); background: color-mix(in srgb, var(--brand) 14%, var(--surface)); color: var(--brand); }
.badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: .75rem; font-weight: 800; background: var(--surface-2); color: var(--ink-2); }
.badge.warn { background: #FFE9E0; color: #C2410C; }

.badge.brand { background: color-mix(in srgb, var(--brand) 16%, var(--surface)); color: var(--brand); }

label.field { display: block; font-weight: 700; font-size: .9rem; margin-bottom: 10px; }
label.field > span { display: block; margin-bottom: 4px; }
input[type=text], input[type=email], input[type=password], input[type=url], input[type=datetime-local], select, textarea {
  width: 100%; padding: 11px 13px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); outline: none;
}
input:focus, select:focus, textarea:focus { border-color: var(--brand); }
textarea { min-height: 120px; resize: vertical; }

/* meeting list */
.meeting {
  display: flex; gap: 14px; align-items: center; padding: 14px; border-radius: 16px; cursor: pointer;

}
.meeting:hover { transform: translateY(-1px); }

}
.meeting .date small { display: block; font-size: .7rem; color: var(--ink-2); font-weight: 800; text-transform: uppercase; }
.meeting .info { flex: 1; min-width: 0; }
.meeting .info .t { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* tabs inside a view */
.tabs { display: flex; gap: 6px; overflow-x: auto; margin: 6px 0 14px; padding-bottom: 2px; }
.tabs button { border: 0; background: var(--surface-2); padding: 8px 14px; border-radius: 999px; font-weight: 800; cursor: pointer; white-space: nowrap; }

.transcript .line { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); }

}

/* ---------- Motey pop-up (catch-up) ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 100; display: flex; align-items: flex-end; justify-content: center;
  background: rgba(18, 12, 48, .45); backdrop-filter: blur(3px); animation: fade .2s;
}
@media (min-width: 700px) { .overlay { align-items: center; } }
.sheet {
  width: 100%; max-width: 620px; max-height: 92vh; overflow: auto; background: var(--surface);
  border-radius: 26px 26px 0 0; padding: 58px 18px calc(20px + env(safe-area-inset-bottom)); position: relative;
  animation: rise .35s cubic-bezier(.2, 1.3, .4, 1);
}

.sheet .close { position: absolute; top: 12px; right: 12px; }
.motey-stage { display: flex; gap: 14px; align-items: flex-start; }
.motey-stage .motey-svg { flex: none; animation: pop .5s cubic-bezier(.2, 1.6, .4, 1); }
.speech {
  position: relative; background: var(--surface-2); border-radius: 20px; padding: 14px 16px; flex: 1; font-weight: 600;
}
.speech::before {
  content: ""; position: absolute; left: -9px; top: 22px; border: 10px solid transparent; border-right-color: var(--surface-2); border-left: 0;
}
.typing::after { content: "▍"; animation: blinkc 1s steps(1) infinite; color: var(--brand); }
@keyframes blinkc { 50% { opacity: 0 } }
@keyframes fade { from { opacity: 0 } }
@keyframes rise { from { transform: translateY(60px); opacity: 0 } }
@keyframes pop { 0% { transform: scale(.2) rotate(-20deg); opacity: 0 } 100% { transform: none; opacity: 1 } }
.steps { display: flex; gap: 6px; margin: 14px 0; }
.steps i { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
.steps i.on { background: var(--brand); }
.sending { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 14px; background: var(--surface-2); margin-top: 10px; }
.plane { font-size: 1.6rem; animation: fly 1.2s ease-in-out infinite; }
@keyframes fly { 0% { transform: translate(0, 0) } 50% { transform: translate(14px, -8px) rotate(8deg) } 100% { transform: translate(0, 0) } }

/* toast */
.toasts { position: fixed; left: 50%; bottom: 86px; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 8px; width: min(92vw, 420px); }
.toast { background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 14px; font-weight: 700; box-shadow: var(--shadow); animation: rise .3s; }

/* ---------- Live AI ---------- */
.live-stage { display: grid; gap: 14px; }
@media (min-width: 760px) { .live-stage { grid-template-columns: 1fr 1fr; } }
.speaker-card { border-radius: 22px; padding: 16px; min-height: 260px; display: flex; flex-direction: column; gap: 12px; position: relative; overflow: hidden; }
.speaker-card.original { background: #2A2440; color: #EDEAFF; }
.speaker-card.motey { background: linear-gradient(160deg, #EDE7FF, #FFE6EF); color: #1E1B3A; }
.speaker-card .who { display: flex; gap: 10px; align-items: center; font-weight: 900; }
.speaker-card .say { font-size: 1.15rem; font-weight: 700; line-height: 1.4; }
.speaker-card.original.dim .say { filter: blur(5px); user-select: none; }
.boss-face { width: 64px; height: 64px; flex: none; }
.live-log { max-height: 300px; overflow: auto; }
.live-log .pair { padding: 10px 0; border-bottom: 1px dashed var(--line); }
.live-log .o { color: var(--ink-2); text-decoration: line-through; font-size: .9rem; }
.rec-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--danger); display: inline-block; animation: blinkc 1s steps(1) infinite; }

/* ---------- TikTok ---------- */
.tt-wrap { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; justify-content: center; }
.tt-phone {
  position: relative; width: min(360px, 92vw); aspect-ratio: 9 / 16; border-radius: 28px; overflow: hidden; background: #000;
  box-shadow: 0 20px 50px rgba(0, 0, 0, .35); border: 6px solid #111;
}
.tt-phone canvas { width: 100%; height: 100%; display: block; }
.tt-side { position: absolute; right: 8px; bottom: 90px; display: flex; flex-direction: column; gap: 14px; align-items: center; color: #fff; font-weight: 800; font-size: .75rem; text-shadow: 0 1px 3px #000; }
.tt-side button { border: 0; background: rgba(255, 255, 255, .16); color: #fff; width: 46px; height: 46px; border-radius: 50%; font-size: 1.3rem; cursor: pointer; backdrop-filter: blur(4px); }
.tt-side button.liked { background: var(--rose); }
.tt-play { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, .25); border: 0; color: #fff; font-size: 4rem; cursor: pointer; }
.tt-panel { flex: 1; min-width: 260px; max-width: 460px; }
.progress { height: 10px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.progress > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--brand), var(--rose)); transition: width .2s; }
.scene-list li { padding: 6px 0; border-bottom: 1px dashed var(--line); }

/* ---------- Game ---------- */
.game-shell { position: relative; border-radius: 20px; overflow: hidden; background: #0E0B22; box-shadow: var(--shadow); touch-action: none; user-select: none; }
.game-shell canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; }
.game-hud { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; gap: 8px; flex-wrap: wrap; pointer-events: none; }
.game-hud span { background: rgba(14, 11, 34, .75); color: #fff; padding: 4px 10px; border-radius: 999px; font-weight: 800; font-size: .85rem; }
.game-say {
  position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; gap: 10px; align-items: flex-end; pointer-events: none;
}
.game-say .speech { background: rgba(255, 255, 255, .96); color: #1E1B3A; font-size: .95rem; }
.game-say .speech::before { border-right-color: rgba(255, 255, 255, .96); top: auto; bottom: 18px; }
.game-say .btn { pointer-events: auto; }
.dpad { position: absolute; right: 12px; bottom: 96px; display: grid; grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(3, 48px); gap: 4px; }
.dpad button { border: 0; border-radius: 12px; background: rgba(255, 255, 255, .18); color: #fff; font-size: 1.3rem; touch-action: none; }
.dpad .act { background: var(--coral); font-size: .8rem; font-weight: 900; }
@media (hover: hover) and (pointer: fine) { .dpad { display: none; } }
.quiz-opt { display: block; width: 100%; text-align: left; margin: 8px 0; padding: 12px 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 700; }

@keyframes shake { 25% { transform: translateX(-6px) } 75% { transform: translateX(6px) } }

.empty { text-align: center; padding: 30px 10px; }

<script>
/* Motey – the speech-bubble mascot.
 * One SVG, drawn as a real illustration of the hand-drawn sketch:
 * a chat bubble with a tail, two big oval eyes and a small smile.
 * CSS classes drive blinking, floating and talking (see motey.css). */
(function () {
  'use strict';
  let uid = 0;

  // Bubble body with the tail at the lower left, like the sketch.
  const BODY = 'M100 20C152 20 184 50 184 88C184 127 151 153 104 155' +
    'C92 155 81 153 71 150L45 178C40 183 33 179 35 173L45 142' +
    'C27 130 16 111 16 88C16 50 48 20 100 20Z';

  function svg(opts) {
    opts = opts || {};
    const id = 'mt' + (++uid);
    const mood = opts.mood || 'happy';         // happy | wow | worried | wink
    const cls = ['motey-svg'];
    if (opts.animate !== false) cls.push('is-alive');
    if (opts.talking) cls.push('is-talking');
    if (opts.className) cls.push(opts.className);
    const size = opts.size || 120;
    const brow = mood === 'worried'
      ? '<path class="mt-brow" d="M60 58l26-9M140 58l-26-9" stroke="#1E1B3A" stroke-width="6" stroke-linecap="round" fill="none"/>' : '';
    const leftEye = mood === 'wink'
      ? '<path d="M62 86q16-14 32 0" class="mt-wink" stroke="#1E1B3A" stroke-width="7" stroke-linecap="round" fill="none"/>'
      : `<g class="mt-eye"><ellipse cx="78" cy="82" rx="15.5" ry="${mood === 'wow' ? 26 : 23}" fill="#1E1B3A"/>` +
        '<circle cx="72.5" cy="71" r="5.5" fill="#fff"/><circle cx="82" cy="92" r="2.6" fill="#fff" opacity=".85"/></g>';
    const rightEye = `<g class="mt-eye"><ellipse cx="122" cy="82" rx="15.5" ry="${mood === 'wow' ? 26 : 23}" fill="#1E1B3A"/>` +
      '<circle cx="116.5" cy="71" r="5.5" fill="#fff"/><circle cx="126" cy="92" r="2.6" fill="#fff" opacity=".85"/></g>';
    const mouth = mood === 'wow'
      ? '<ellipse class="mt-mouth-o" cx="100" cy="121" rx="7" ry="8" fill="#1E1B3A"/>'
      : '<path class="mt-smile" d="M89 118q11 10 22 0" stroke="#1E1B3A" stroke-width="5.5" stroke-linecap="round" fill="none"/>' +
        '<ellipse class="mt-talk" cx="100" cy="122" rx="9" ry="7" fill="#1E1B3A" opacity="0"/>';
    return `<svg class="${cls.join(' ')}" viewBox="0 0 200 200" width="${size}" height="${size}" role="img" aria-label="Motey">
  <defs>
    <linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E9E4FF"/>
    </linearGradient>
    <radialGradient id="${id}s" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#1E1B3A" stop-opacity=".22"/><stop offset="1" stop-color="#1E1B3A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse class="mt-shadow" cx="104" cy="190" rx="54" ry="7" fill="url(#${id}s)"/>
  <g class="mt-body">
    <path d="${BODY}" fill="url(#${id}g)" stroke="#1E1B3A" stroke-width="7" stroke-linejoin="round"/>
    <path d="M44 62C52 44 70 34 92 32" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".9"/>
    ${brow}
    <g class="mt-eyes">${leftEye}${rightEye}</g>
    <ellipse cx="58" cy="110" rx="11" ry="6" fill="#FF8FB1" opacity=".55"/>
    <ellipse cx="142" cy="110" rx="11" ry="6" fill="#FF8FB1" opacity=".55"/>
    ${mouth}
  </g>
</svg>`;
  }

  function logo(opts) {
    opts = opts || {};
    return `<span class="motey-logo">${svg({ size: opts.size || 34, animate: opts.animate })}` +
      `<span class="motey-word">Motey</span></span>`;
  }

  window.Mascot = { svg, logo, BODY };
})();

</script>

  function isPast(m) { return new Date(m.start).getTime() + (m.durationMin || 30) * 6e4 < Date.now(); }

<script>
/* Motey – platform bridge.
 * Same app runs in a browser, in the Android shell (window.MoteyAndroid,
 * injected by the APK) and in the desktop shell (Neutralino: NL_TOKEN/NL_PORT
 * globals and a WebSocket to the native core). */
(function () {
  'use strict';

  const android = () => window.MoteyAndroid || null;
  const desktop = () => !!(window.NL_TOKEN && window.NL_PORT);
  const kind = () => android() ? 'android' : desktop() ? 'desktop' : 'web';

  /* ---- minimal Neutralino native client (same wire format as neutralino.js) ---- */
  let ws = null, wsReady = null;
  const calls = {};
  function nlConnect() {
    if (wsReady) return wsReady;
    wsReady = new Promise((resolve, reject) => {
      const token = window.NL_TOKEN || '';
      ws = new WebSocket(`ws://127.0.0.1:${window.NL_PORT}?connectToken=${token.split('.')[1] || ''}`);
      ws.addEventListener('open', () => resolve(ws));
      ws.addEventListener('error', reject);
      ws.addEventListener('message', ev => {
        let msg; try { msg = JSON.parse(ev.data); } catch (e) { return; }
        const c = msg.id && calls[msg.id];
        if (!c) return;
        delete calls[msg.id];
        if (msg.data && msg.data.error) c.reject(msg.data.error);
        else c.resolve(msg.data && 'returnValue' in msg.data ? msg.data.returnValue : msg.data);
      });
    });
    return wsReady;
  }
  async function nl(method, data) {
    await nlConnect();
    const id = (crypto.randomUUID && crypto.randomUUID()) || String(Date.now() + Math.random());
    return new Promise((resolve, reject) => {
      calls[id] = { resolve, reject };
      ws.send(JSON.stringify({ id, method, data, accessToken: window.NL_TOKEN }));
    });
  }

  function bufToB64(buf) {
    const bytes = new Uint8Array(buf);
    let s = '';
    for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(s);
  }
  async function blobToB64(blob) { return bufToB64(await blob.arrayBuffer()); }

  /* Save a file where the user can find it. Returns a short human message. */
  async function saveFile(name, blob) {
    if (android()) {
      const msg = android().saveFile(name, await blobToB64(blob), blob.type || 'application/octet-stream');
      return msg || `Sparad i Hämtade filer: ${name}`;
    }
    if (desktop()) {
      try {
        const path = await nl('os.showSaveDialog', { title: 'Spara ' + name, defaultPath: name });
        if (!path) return 'Avbrutet';
        await nl('filesystem.writeBinaryFile', { path, data: await blobToB64(blob) });
        return 'Sparad: ' + path;
      } catch (e) { /* fall through to browser download */ }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
    return 'Nedladdad: ' + name;
  }

  async function openUrl(url) {
    if (android()) { android().openUrl(url); return; }
    if (desktop()) { try { await nl('os.open', { url }); return; } catch (e) { /* fallback */ } }
    if (url.startsWith('mailto:')) location.href = url; else window.open(url, '_blank', 'noopener');
  }

  /* ---- speech ---- */
  let voice = null;
  function pickVoice() {
    if (!('speechSynthesis' in window)) return null;
    const vs = speechSynthesis.getVoices();
    voice = vs.find(v => /^sv/i.test(v.lang)) || vs.find(v => /swed/i.test(v.name)) || null;
    return voice;
  }
  if ('speechSynthesis' in window) {
    pickVoice();
    speechSynthesis.onvoiceschanged = pickVoice;
  }
  // Strip emoji so the voice doesn't read them out loud.
  const clean = t => String(t).replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu, '').trim();

  function speak(text, opts) {
    opts = opts || {};
    const t = clean(text);
    if (!t || (window.Store && Store.settings && !Store.settings.voice)) { opts.onend && setTimeout(opts.onend, 1200 + t.length * 45); return; }
    if (android() && android().speak) {
      android().speak(t, String(opts.rate || 1), String(opts.pitch || 1));
      // Android TTS has no JS callback; estimate the duration.
      opts.onend && setTimeout(opts.onend, 900 + t.length * 62 / (opts.rate || 1));
      return;
    }
    if (!('speechSynthesis' in window)) { opts.onend && setTimeout(opts.onend, 900 + t.length * 55); return; }
    const u = new SpeechSynthesisUtterance(t);
    u.lang = 'sv-SE';
    if (voice || pickVoice()) u.voice = voice;
    u.rate = opts.rate || 1.02; u.pitch = opts.pitch || 1.15;
    let done = false;
    const end = () => { if (!done) { done = true; opts.onend && opts.onend(); } };
    u.onend = end; u.onerror = end;
    // Some engines never fire onend; never block the UI on it.
    setTimeout(end, 2500 + t.length * 90);
    speechSynthesis.speak(u);
  }
  function stopSpeaking() {
    if (android() && android().stopSpeaking) android().stopSpeaking();
    if ('speechSynthesis' in window) speechSynthesis.cancel();
  }

  /* ---- speech recognition (only where the engine offers it) ---- */
  function recognizer() {
    const R = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!R) return null;
    const r = new R();
    r.lang = 'sv-SE'; r.continuous = true; r.interimResults = false;
    return r;
  }

  window.Platform = { kind, saveFile, openUrl, speak, stopSpeaking, recognizer, blobToB64, bufToB64, nl };
})();

/* Motey – builds real documents in the browser, no libraries:
 * PDF (text, A4, Helvetica), XLSX and DOCX (Office Open XML in a stored ZIP). */
(function () {
  'use strict';

  /* ---------- ZIP (stored, UTF-8 names) ---------- */
  const CRC = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
    return t;

  function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }

      const data = typeof f.data === 'string' ? enc.encode(f.data) : f.data;
      const crc = crc32(data);

      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
      h.setUint16(10, dosTime, true); h.setUint16(12, dosDate, true); h.setUint32(14, crc, true);

      c.setUint16(12, dosTime, true); c.setUint16(14, dosDate, true); c.setUint32(16, crc, true);
      c.setUint32(20, data.length, true); c.setUint32(24, data.length, true); c.setUint16(28, name.length, true);

  /* ---------- PDF ---------- */
  const WIN = { '€': 0x80, '‚': 0x82, '„': 0x84, '…': 0x85, '•': 0x95, '–': 0x96, '—': 0x97, '‘': 0x91, '’': 0x92, '“': 0x93, '”': 0x94, '™': 0x99 };

  /* ---------- XLSX ---------- */
  function colName(i) { let s = ''; i++; while (i) { const r = (i - 1) % 26; s = String.fromCharCode(65 + r) + s; i = Math.floor((i - 1) / 26); } return s; }

      { name: '[Content_Types].xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="${NS}/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>` },
      { name: '_rels/.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${NS}/package/2006/relationships"><Relationship Id="rId1" Type="${NS}/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>` },
      { name: 'xl/workbook.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="${NS}/spreadsheetml/2006/main" xmlns:r="${NS}/officeDocument/2006/relationships"><sheets><sheet name="${esc(sheetName.slice(0, 31))}" sheetId="1" r:id="rId1"/></sheets></workbook>` },
      { name: 'xl/_rels/workbook.xml.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${NS}/package/2006/relationships"><Relationship Id="rId1" Type="${NS}/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="${NS}/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>` },

  }

  /* ---------- DOCX ---------- */
  function docx(blocks) {
    const NS = 'http://schemas.openxmlformats.org';

    const rows = [];

  }

    const d = new Date(meeting.start).toLocaleDateString('sv-SE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    const b = [

    if (sum.decisions.length) { b.push({ h2: 'Beslut' }); sum.decisions.forEach(p => b.push({ li: p })); }
    if (sum.actions.length) { b.push({ h2: 'Att göra' }); sum.actions.forEach(a => b.push({ li: (a.who ? a.who + ': ' : '') + a.what })); }
    const nums = amounts(meeting);
    if (nums.length) { b.push({ h2: 'Siffror från mötet' }); nums.forEach(r => b.push({ li: r.text })); }

  }

  /* Build a draft of a missing file from what was said in the meeting. */
  function draftFor(meeting, sum, fileName) {
    const ext = (fileName.split('.').pop() || '').toLowerCase();
    if (ext === 'xlsx' || ext === 'xls' || ext === 'csv') {
      const nums = amounts(meeting);
      const rows = [
        [{ b: fileName.replace(/\.[^.]+$/, '').replace(/_/g, ' ') }],
        [`${meeting.title} – utkast skapat av Motey`],
        [],
        [{ b: 'Beskrivning' }, { b: 'Värde' }, { b: 'Enhet' }, { b: 'Sagt av' }]
      ];
      nums.forEach(r => rows.push([r.text, r.n, r.enhet, r.who]));
      if (!nums.length) sum.points.forEach(p => rows.push([p]));
      rows.push([], [{ b: 'Att göra' }]);
      sum.actions.forEach(a => rows.push([a.what, '', '', a.who || '']));
      if (ext === 'csv') {
        const csv = rows.map(r => r.map(v => v && typeof v === 'object' ? (v.b || v.n) : v).map(v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`).join(';')).join('\r\n');

      }
      return { name: fileName.replace(/\.xls$/i, '.xlsx'), blob: xlsx('Motey', rows) };
    }
    const blocks = reportBlocks(meeting, sum, fileName);
    if (ext === 'docx' || ext === 'doc') return { name: fileName.replace(/\.doc$/i, '.docx'), blob: docx(blocks) };
    if (ext === 'pdf') return { name: fileName, blob: pdf(blocks) };
    // Anything else (pptx, key, …): a PDF with the same base name.
    return { name: fileName.replace(/\.[^.]+$/, '') + '.pdf', blob: pdf(blocks) };
  }

  window.Docs = { zip, pdf, xlsx, docx, draftFor, reportBlocks, amounts, crc32 };

      const c = cs.find(k => ALIASES[k].some(a => txt.toLowerCase().includes(a)));
      const kw = c ? GLOSSARY[c].wiki : (words(txt).find(w => kws.includes(w)) || kws[i] || 'kontor');
      scenes.push({ caption: shorten(txt, 90), narration: txt, query: kw, emoji: c ? GLOSSARY[c].icon : ['💡', '📌', '🚀', '🎯'][i % 4] });
    });
    if (sum.actions.length) {
      const a = sum.actions.slice(0, 2).map(x => `${x.who}: ${shorten(x.what, 50)}`).join(' · ');
      scenes.push({ caption: 'Att göra ✅ ' + a, narration: 'Att göra: ' + sum.actions.slice(0, 2).map(x => x.who + ' ' + x.what).join('. '), query: 'Checklista', emoji: '✅' });
    }
    scenes.push({ caption: 'Följ för fler möten du slipper sitta i 😎', narration: 'Följ Motey för fler möten du slipper sitta i!', query: null, emoji: '💜' });
    return scenes;
  }
  const shorten = (s, n) => s.length > n ? s.slice(0, n - 1).replace(/\s\S*$/, '') + '…' : s;

  function localLevel(meeting) {
    let cs = concepts(meeting).map(k => Object.assign({ key: k }, GLOSSARY[k]));
    const t = meeting.transcript || [];
    // Meetings without finance words: build walls from the meeting's own keywords.
    if (cs.length < 3) {
      const kws = keywords(meeting, 10).filter(w => w.length > 4);
      for (const w of kws) {
        if (cs.length >= 4) break;
        const line = t.find(l => l.text.toLowerCase().includes(w));
        if (!line) continue;
        const others = t.filter(l => l !== line && l.text.length > 20).map(l => shorten(l.text, 80));
        const right = shorten(line.text, 80);
        const opts = [right, pick(others) || 'Det pratade ingen om', 'Att mötet skulle ställas in'].filter((v, i, a) => a.indexOf(v) === i);
        while (opts.length < 3) opts.push('Ingenting alls');
        const order = opts.map((o, i) => ({ o, r: Math.random() + (i === 0 ? 0 : 0) })).sort((a, b) => a.r - b.r).map(x => x.o);
        cs.push({ key: w, term: cap(w), icon: '🧱', wiki: w, explain: `På mötet sa ${firstName(line.who)}: ”${line.text}”`, howTo: 'Kom ihåg vad som sades – svara rätt så krossar du väggen!', q: `Vad sades om ”${w}” på mötet?`, opts: order, a: order.indexOf(right) });
      }
    }
    const facts = localSummary(meeting).points.slice(0, 6).map(p => p.replace(/^[^:]+:\s*/, ''));
    return { title: meeting.title, walls: cs.slice(0, 6), facts };
  }

  function localAnswer(question, meeting) {
    const q = question.toLowerCase();
    for (const [k, al] of Object.entries(ALIASES)) if (al.some(a => q.includes(a)) || q.includes(k)) {
      const g = GLOSSARY[k];
      return `${g.term}: ${g.explain} ${g.howTo}`;
    }
    const qs = words(q);
    let best = null, bs = 0;
    for (const l of meeting ? meeting.transcript || [] : []) {
      const s = words(l.text).filter(w => qs.includes(w)).length;
      if (s > bs) { bs = s; best = l; }
    }
    if (best) return `På mötet sa ${firstName(best.who)}: ”${best.text}”`;
    return 'Det vet jag inte riktigt än! Lägg till en Claude-nyckel i Inställningar så kan jag svara på allt. 😊';
  }

  /* ---------- Claude (Messages API, raw fetch from the webview) ---------- */
  const hasKey = () => !!(window.Store && Store.settings.apiKey);
  async function claude({ system, prompt, schema, effort, maxTokens }) {
    const s = Store.settings;
    const body = {
      model: s.model || 'claude-opus-5-5',
      max_tokens: maxTokens || 16000,
      system,
      messages: [{ role: 'user', content: prompt }],
      output_config: { effort: effort || 'low' },
      // On a safety-classifier decline, let the API retry on its recommended fallback model.
      fallbacks: 'default'
    };
    if (schema) body.output_config.format = { type: 'json_schema', schema };
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        'x-api-key': s.apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-beta': 'server-side-fallback-2026-07-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify(body)
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error((data.error && data.error.message) || ('HTTP ' + res.status));
    if (data.stop_reason === 'refusal') throw new Error('refusal');
    const text = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
    if (!text) throw new Error('empty');
    return schema ? JSON.parse(text) : text.trim();
  }
  const SYS = 'Du är Motey, en glad AI-mötesassistent formad som en pratbubbla. Du svarar alltid på svenska, kort och tydligt.';
  const transcriptText = m => (m.transcript || []).map(l => `${l.who}: ${l.text}`).join('\n');
  const obj = (props, req) => ({ type: 'object', properties: props, required: req || Object.keys(props), additionalProperties: false });
  const str = { type: 'string' };
  const arr = items => ({ type: 'array', items });

  async function withFallback(fnClaude, fnLocal) {
    if (!hasKey()) return { source: 'local', value: fnLocal() };
    try { return { source: 'claude', value: await fnClaude() }; }
    catch (e) { console.warn('Claude misslyckades, använder offline-motorn:', e.message); return { source: 'local', value: fnLocal(), error: e.message }; }
  }

  /* ---------- public API ---------- */
  const cache = {};
  async function summarize(meeting) {
    const key = meeting.id + ':' + (meeting.transcript || []).length + ':' + hasKey();
    if (cache[key]) return cache[key];
    const r = await withFallback(async () => {
      const v = await claude({
        system: SYS, effort: 'medium',
        prompt: `Sammanfatta mötet "${meeting.title}". Ge en kort sammanfattning (2–3 meningar), de viktigaste punkterna, beslut, att göra-punkter med ansvarig person, alla filer/dokument som nämns och 6–8 nyckelord.\n\nTranskript:\n${transcriptText(meeting)}`,
        schema: obj({ summary: str, points: arr(str), decisions: arr(str), actions: arr(obj({ who: str, what: str })), files: arr(str), keywords: arr(str) })
      });
      (meeting.files || []).forEach(f => v.files.includes(f.name) || v.files.push(f.name));
      return v;
    }, () => localSummary(meeting));
    if (!(meeting.transcript || []).length) r.value = localSummary(meeting);
    cache[key] = r;
    return r;
  }

  async function catchUp(prev, user) {
    const sum = (await summarize(prev)).value;
    const day = new Date(prev.start).toLocaleDateString('sv-SE', { weekday: 'long' }) + 's';
    const mine = sum.actions.filter(a => firstName(a.who).toLowerCase() === firstName(user).toLowerCase() || a.who === 'Alla');
    const r = await withFallback(
      () => claude({
        system: SYS, effort: 'low',
        prompt: `${user} missade mötet "${prev.title}" i ${day}. Skriv en kort, varm och lite rolig uppdatering (max 70 ord) direkt till ${user}: vad som hände, vilka beslut som togs och vad ${user} själv ska göra. Ingen rubrik.\n\nTranskript:\n${transcriptText(prev)}`
      }),
      () => `Hej ${user}! Du missade "${prev.title}" i ${day}. ${sum.summary}` +
        (sum.decisions.length ? ` Det viktigaste beslutet: ${sum.decisions[0].replace(/^[^:]+:\s*/, '').replace(/^((bra|toppen|okej|tack|beslut)[.!:,]?\s*)+/i, '')}` : '') +
        (mine.length ? ` Och du ska: ${mine.map(a => a.what.replace(new RegExp('^' + firstName(user) + ',?\\s+(du\\s+)?ska\\s+', 'i'), '').replace(/^alla ska\s+/i, 'precis som alla andra ').replace(/\bsina\b/g, 'dina').replace(/\bsitt\b/g, 'ditt').replace(/\bsin\b/g, 'din').replace(/\btill mig\b/i, 'till ' + (a.from || 'chefen')).replace(/\.$/, '')).join(', och ')}.` : '')
    );
    return { text: r.value, source: r.source, sum, mine };
  }

  async function restyle(text, style) {
    const st = STYLES[style] || STYLES.snall;
    return withFallback(
      () => claude({
        system: SYS + ' Du ersätter en talare i ett möte i realtid.',
        effort: 'low', maxTokens: 1024,
        prompt: `Skriv om repliken i stilen "${st.name}". Behåll exakt samma budskap, fakta, siffror, datum och uppgifter – bara tonen ändras, och den ska vara vänlig. Svara endast med den nya repliken.\n\nReplik: ${text}`
      }),
      () => localRestyle(text, style)
    );
  }

  async function videoScript(meeting) {
    const sum = (await summarize(meeting)).value;
    return withFallback(
      () => claude({
        system: SYS + ' Du gör korta, roliga vertikala videor (TikTok-stil) om möten.',
        effort: 'low',
        prompt: `Gör ett manus för en 30–40 sekunders TikTok-video om mötet "${meeting.title}". 5–7 scener. Varje scen: caption (max 90 tecken, gärna med emoji), narration (det som sägs, max 25 ord), query (ett sökord för en passande Wikipedia-bild, helst ett substantiv på svenska, eller tom sträng), emoji (en emoji). Första scenen är en hook, sista en uppmaning.\n\nTranskript:\n${transcriptText(meeting)}`,
        schema: obj({ scenes: arr(obj({ caption: str, narration: str, query: str, emoji: str })) })
      }).then(v => v.scenes),
      () => localVideoScript(meeting, sum)
    );
  }

  async function gameLevel(meeting) {
    return withFallback(
      () => claude({
        system: SYS + ' Du bygger banor i ett pedagogiskt spel där varje vägg är ett begrepp från mötet.',
        effort: 'medium',
        prompt: `Gör 3–6 väggar till en spelbana om mötet "${meeting.title}". Varje vägg är ett viktigt begrepp från mötet (t.ex. F-skatt, moms). För varje: term, icon (en emoji), explain (förklara begreppet enkelt och korrekt, 2–3 meningar), howTo (så "förstör" man väggen = vad man konkret gör i verkligheten, 1–2 meningar), q (en kontrollfråga), opts (exakt 3 svarsalternativ), a (index 0–2 för rätt svar). Lägg också till 3–6 korta facts från mötet.\n\nTranskript:\n${transcriptText(meeting)}`,
        schema: obj({ walls: arr(obj({ term: str, icon: str, explain: str, howTo: str, q: str, opts: arr(str), a: { type: 'integer' } })), facts: arr(str) })
      }).then(v => ({ title: meeting.title, walls: v.walls.filter(w => w.opts.length >= 2 && w.a >= 0 && w.a < w.opts.length).slice(0, 6), facts: v.facts })),
      () => localLevel(meeting)
    );
  }

  async function ask(question, meeting) {
    return withFallback(
      () => claude({
        system: SYS + ' Du är spelkompis i Motey-spelläget och förklarar saker enkelt.',
        effort: 'low', maxTokens: 1024,
        prompt: `Fråga: ${question}\n\nSvara kort (max 60 ord).` + (meeting ? `\n\nMötets transkript:\n${transcriptText(meeting)}` : '')
      }),
      () => localAnswer(question, meeting)
    );
  }

  async function testKey() {
    return claude({ system: SYS, prompt: 'Säg hej i max fem ord.', effort: 'low', maxTokens: 256 });
  }

  window.AI = { summarize, catchUp, restyle, videoScript, gameLevel, ask, testKey, hasKey, STYLES, GLOSSARY, keywords, concepts, localRestyle, localSummary, firstName };
})();

</script>
<script>
/* Motey Live AI (example 2): replace a speaker with Motey – same sentences, new style. */
(function () {
  'use strict';
  const $ = (s, el) => (el || document).querySelector(s);
  const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));

  function bossFace() {
    return `<svg class="boss-face" viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="34" r="24" fill="#F2C9A0" stroke="#1E1B3A" stroke-width="3"/>
      <path d="M10 28c2-16 42-16 44 0-6-6-12-9-22-9S16 22 10 28z" fill="#5B3A29" stroke="#1E1B3A" stroke-width="3" stroke-linejoin="round"/>
      <path d="M18 30l10 4M46 30l-10 4" stroke="#1E1B3A" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="24" cy="38" r="2.6" fill="#1E1B3A"/><circle cx="40" cy="38" r="2.6" fill="#1E1B3A"/>
      <path d="M24 50q8-6 16 0" fill="none" stroke="#1E1B3A" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="17" cy="45" rx="4" ry="2.5" fill="#FF5C5C" opacity=".55"/><ellipse cx="47" cy="45" rx="4" ry="2.5" fill="#FF5C5C" opacity=".55"/>
      <path d="M52 14l4-4M56 20l5-1M48 10l1-5" stroke="#FF5C5C" stroke-width="2.5" stroke-linecap="round"/>
    </svg>`;
  }

  let alive = false, rec = null, timer = null;

  function render(v, meeting, ui) {
    if (!meeting) return ui.pickMeeting(v, 'live', '🎭 Motey Live AI', 'Har du en arg och sträng chef? Välj ett möte – Motey tar chefens plats och säger samma sak, fast i en stil du gillar.');
    alive = true;
    const esc = ui.esc;
    const S = Store.settings;
    const t = meeting.transcript || [];
    const counts = {};
    t.forEach(l => { counts[l.who] = (counts[l.who] || 0) + 1; });
    const speakers = Object.keys(counts);
    const me = AI.firstName(S.name).toLowerCase();
    let target = speakers.find(p => /chef/i.test(p)) || speakers.find(p => AI.firstName(p) === AI.firstName(meeting.boss)) ||
      speakers.filter(p => AI.firstName(p).toLowerCase() !== me).sort((a, b) => counts[b] - counts[a])[0] || speakers[0];
    let style = S.liveStyle || 'snall';
    let showOrig = false;
    const canListen = !!Platform.recognizer();

    v.innerHTML = `
      <div class="row between"><a href="#/live" class="btn sm ghost">‹ Byt möte</a><span class="badge brand">${AI.hasKey() ? 'Claude' : 'Offline-AI'}</span></div>
      <h1 style="margin-top:12px">🎭 Live AI – ${esc(meeting.title)}</h1>
      <div class="card">
        <p class="small muted" style="margin:0 0 6px">Vem ska Motey ersätta?</p>
        <div class="row" id="who">${speakers.map(p => `<span class="chip ${p === target ? 'on' : ''}" data-p="${esc(p)}">${esc(AI.firstName(p))}</span>`).join('')}</div>
        <p class="small muted" style="margin:12px 0 6px">Stil</p>
        <div class="row" id="styles">${Object.entries(AI.STYLES).map(([k, s]) => `<span class="chip ${k === style ? 'on' : ''}" data-s="${k}">${s.icon} ${s.name}</span>`).join('')}</div>
      </div>
      <div class="live-stage">
        <div class="speaker-card original dim" id="orig">
          <div class="who">${bossFace()}<div><div id="orig-name">${esc(AI.firstName(target))}</div><div class="small" style="opacity:.7">Originalet – dolt</div></div></div>
          <div class="say" id="orig-say">…</div>
          <label class="switch small" style="margin-top:auto"><input type="checkbox" id="showo"> Visa originalet</label>
        </div>
        <div class="speaker-card motey">
          <div class="who"><span id="mface">${Mascot.svg({ size: 64 })}</span><div>Motey<div class="small" style="opacity:.7" id="mstyle">${AI.STYLES[style].icon} ${AI.STYLES[style].name}</div></div></div>
          <div class="say" id="motey-say">Tryck på ▶ så tar jag över mötet!</div>
        </div>
      </div>
      <div class="row" style="margin:14px 0">
        <button class="btn" id="play">▶ Spela upp mötet live</button>
        ${canListen ? '<button class="btn ghost" id="listen">🎙 Lyssna på riktigt möte</button>' : ''}
      </div>
      <div class="card"><div class="row"><input type="text" id="typed" placeholder="Skriv vad chefen säger…" style="flex:1"><button class="btn coral" id="conv">Byt stil</button></div></div>
      <div class="card"><h3>Logg</h3><div class="live-log" id="log"><p class="muted small">Här hamnar allt som sägs.</p></div></div>`;

    const log = $('#log', v);
    const addLog = html => { if (log.querySelector('.muted')) log.innerHTML = ''; log.insertAdjacentHTML('afterbegin', `<div class="pair">${html}</div>`); };
    const setTalking = on => { const svg = $('#mface .motey-svg', v); if (svg) svg.classList.toggle('is-talking', on); };

    $$('#who .chip', v).forEach(c => c.addEventListener('click', () => {
      target = c.dataset.p; $$('#who .chip', v).forEach(x => x.classList.toggle('on', x === c));
      $('#orig-name', v).textContent = AI.firstName(target);
    }));
    $$('#styles .chip', v).forEach(c => c.addEventListener('click', () => {
      style = c.dataset.s; S.liveStyle = style; Store.save();
      $$('#styles .chip', v).forEach(x => x.classList.toggle('on', x === c));
      $('#mstyle', v).textContent = `${AI.STYLES[style].icon} ${AI.STYLES[style].name}`;
    }));
    $('#showo', v).addEventListener('change', e => {
      showOrig = e.target.checked;
      $('#orig', v).classList.toggle('dim', !showOrig);
      $('#orig .small', v).textContent = showOrig ? 'Originalet' : 'Originalet – dolt';
    });

    async function convert(text, who) {
      $('#orig-say', v).textContent = text;
      $('#motey-say', v).innerHTML = '<span class="typing"></span>';
      const r = await AI.restyle(text, style);
      if (!alive) return;
      Store.state.stats.restyled++; Store.save();
      $('#motey-say', v).textContent = r.value;
      addLog(`<div class="o">${ui.esc(AI.firstName(who || target))}: ${ui.esc(text)}</div><div><b>Motey:</b> ${ui.esc(r.value)}</div>`);
      setTalking(true);
      await new Promise(res => Platform.speak(r.value, { onend: res, pitch: 1.25 }));
      setTalking(false);
    }

    let playing = false;
    $('#play', v).addEventListener('click', async () => {
      const btn = $('#play', v);
      if (playing) { playing = false; Platform.stopSpeaking(); btn.textContent = '▶ Spela upp mötet live'; return; }
      playing = true; btn.textContent = '⏹ Stoppa';
      for (const l of t) {
        if (!playing || !alive) break;
        if (l.who === target) await convert(l.text, l.who);
        else {
          addLog(`<div><b>${ui.esc(AI.firstName(l.who))}:</b> ${ui.esc(l.text)}</div>`);
          await new Promise(res => { timer = setTimeout(res, 1200 + l.text.length * 25); });
        }
      }
      playing = false; if (alive) btn.textContent = '▶ Spela upp mötet live';
    });
    $('#conv', v).addEventListener('click', () => { const x = $('#typed', v).value.trim(); if (x) { $('#typed', v).value = ''; convert(x, target); } });
    $('#typed', v).addEventListener('keydown', e => { if (e.key === 'Enter') $('#conv', v).click(); });

    const lb = $('#listen', v);
    if (lb) lb.addEventListener('click', () => {
      if (rec) { rec.stop(); rec = null; lb.innerHTML = '🎙 Lyssna på riktigt möte'; return; }
      rec = Platform.recognizer();
      rec.onresult = e => { const r = e.results[e.results.length - 1]; if (r.isFinal) convert(r[0].transcript.trim(), target); };
      rec.onend = () => { if (rec) try { rec.start(); } catch (e) { /* already running */ } };
      rec.onerror = ev => ui.toast('Mikrofonen: ' + ev.error);
      try { rec.start(); lb.innerHTML = '<span class="rec-dot"></span> Lyssnar… (tryck för att sluta)'; } catch (e) { ui.toast('Kunde inte starta mikrofonen'); rec = null; }
    });
  }

  function destroy() {
    alive = false; clearTimeout(timer);
    if (rec) { const r = rec; rec = null; try { r.stop(); } catch (e) { /* ignore */ } }
    Platform.stopSpeaking();
  }

  window.LiveMode = { render, destroy, bossFace };
})();

</script>
<script>
/* Motey TikTok-läge (example 3): turns a meeting into a short vertical video
 * with an animated presenter, pictures from Wikipedia, captions and a beat.
 * Plays in the app (with voice) and exports as a video file. */
(function () {
  'use strict';
  const $ = (s, el) => (el || document).querySelector(s);
  const W = 720, H = 1280;
  let alive = false, raf = 0, audio = null, state = null;

  /* ---------- pictures from the internet ---------- */
  async function wikiImage(q) {
    if (!q) return null;
    for (const lang of ['sv', 'en']) {
      try {
        const ctl = new AbortController();
        const to = setTimeout(() => ctl.abort(), 6000);
        const r = await fetch(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(q.replace(/ /g, '_'))}`, { signal: ctl.signal });
        clearTimeout(to);
        if (!r.ok) continue;
        const j = await r.json();
        let src = j.thumbnail && j.thumbnail.source;
        if (!src) continue;
        src = src.replace(/\/(\d+)px-/, '/720px-');
        const img = await loadImg(src).catch(() => loadImg(j.thumbnail.source));
        return { img, credit: 'Bild: Wikipedia / ' + (j.title || q) };
      } catch (e) { /* offline or not found */ }
    }
    return null;
  }
  function loadImg(src) {
    return new Promise((res, rej) => {
      const i = new Image();
      i.crossOrigin = 'anonymous'; // keeps the canvas exportable
      i.onload = () => res(i); i.onerror = rej;
      i.src = src;
    });
  }

  /* ---------- music: a small generated beat (WebAudio) ---------- */
  function makeAudio() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    const ctx = new AC();
    const out = ctx.createGain(); out.gain.value = 0.35;
    out.connect(ctx.destination);
    const rec = ctx.createMediaStreamDestination ? ctx.createMediaStreamDestination() : null;
    if (rec) out.connect(rec);
    const bpm = 104, beat = 60 / bpm;
    const chords = [[57, 60, 64], [53, 57, 60], [55, 59, 62], [52, 55, 59]];
    const f = n => 440 * Math.pow(2, (n - 69) / 12);
    let next = ctx.currentTime + 0.05, step = 0, timer = null;
    let noise = ctx.createBuffer(1, ctx.sampleRate * 0.2, ctx.sampleRate);
    const nd = noise.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    function kick(t) { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.15); g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.25); o.connect(g).connect(out); o.start(t); o.stop(t + 0.3); }
    function hat(t, v) { const s = ctx.createBufferSource(), g = ctx.createGain(), hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 7000; s.buffer = noise; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.05); s.connect(hp).connect(g).connect(out); s.start(t); s.stop(t + 0.06); }
    function pad(t, notes) { notes.forEach(n => { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'triangle'; o.frequency.value = f(n); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.07, t + 0.05); g.gain.linearRampToValueAtTime(0, t + beat * 3.8); o.connect(g).connect(out); o.start(t); o.stop(t + beat * 4); }); }
    function bass(t, n) { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'sawtooth'; o.frequency.value = f(n - 24); const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 400; g.gain.setValueAtTime(0.18, t); g.gain.exponentialRampToValueAtTime(0.001, t + beat * 0.9); o.connect(lp).connect(g).connect(out); o.start(t); o.stop(t + beat); }
    function sched() {
      while (next < ctx.currentTime + 0.2) {
        const s8 = step % 8;
        if (s8 % 2 === 0) hat(next, 0.12); else hat(next, 0.05);
        if (s8 === 0 || s8 === 4 || s8 === 5) kick(next);
        const bar = Math.floor(step / 8) % 4;
        if (s8 === 0) pad(next, chords[bar]);
        if (s8 % 2 === 0) bass(next, chords[bar][0]);
        next += beat / 2; step++;
      }
    }
    return {
      ctx, stream: rec && rec.stream,
      start() { if (ctx.state === 'suspended') ctx.resume(); next = ctx.currentTime + 0.05; sched(); timer = setInterval(sched, 50); },
      stop() { clearInterval(timer); },
      close() { clearInterval(timer); try { ctx.close(); } catch (e) { /* closed */ } }
    };
  }

  /* ---------- drawing ---------- */
  const HUES = [262, 330, 200, 150, 28, 290, 190];
  function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
  function wrapLines(c, text, maxW) {
    const out = []; let line = '';
    for (const w of text.split(/\s+/)) { const t = line ? line + ' ' + w : w; if (c.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t; }
    if (line) out.push(line); return out;
  }
  // Path2D of the Motey bubble (same outline as the SVG mascot).
  let bubble = null;
  function drawMotey(c, x, y, s, t, talking) {
    bubble = bubble || new Path2D(Mascot.BODY);
    c.save(); c.translate(x, y + Math.sin(t * 3) * 4 * s); c.scale(s, s); c.translate(-100, -100);
    c.fillStyle = '#fff'; c.strokeStyle = '#1E1B3A'; c.lineWidth = 7; c.lineJoin = 'round';
    c.fill(bubble); c.stroke(bubble);
    const blink = (t % 4) > 3.85 ? 0.12 : 1;
    c.fillStyle = '#1E1B3A';
    [[78, 82], [122, 82]].forEach(([ex, ey]) => { c.beginPath(); c.ellipse(ex, ey, 15.5, 23 * blink, 0, 0, 7); c.fill(); });
    if (blink === 1) { c.fillStyle = '#fff'; [[72.5, 71], [116.5, 71]].forEach(([ex, ey]) => { c.beginPath(); c.arc(ex, ey, 5.5, 0, 7); c.fill(); }); }
    c.fillStyle = 'rgba(255,143,177,.55)'; [[58, 110], [142, 110]].forEach(([ex, ey]) => { c.beginPath(); c.ellipse(ex, ey, 11, 6, 0, 0, 7); c.fill(); });
    c.fillStyle = '#1E1B3A';
    if (talking) { c.beginPath(); c.ellipse(100, 122, 9, 2 + 6 * Math.abs(Math.sin(t * 14)), 0, 0, 7); c.fill(); }
    else { c.beginPath(); c.lineWidth = 5.5; c.lineCap = 'round'; c.moveTo(89, 118); c.quadraticCurveTo(100, 128, 111, 118); c.stroke(); }
    c.restore();
  }
  // The animated presenter ("en animerad person").
  function drawPresenter(c, x, y, t, talking) {
    const bob = Math.sin(t * 2.2) * 5;
    c.save(); c.translate(x, y + bob);
    // body
    c.fillStyle = '#6C4CF5'; rr(c, -95, 40, 190, 230, 80); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.moveTo(-26, 40); c.lineTo(0, 86); c.lineTo(26, 40); c.closePath(); c.fill();
    // arms – one gestures while talking
    const g = talking ? Math.sin(t * 5) * 0.5 : 0.1;
    c.strokeStyle = '#6C4CF5'; c.lineWidth = 34; c.lineCap = 'round';
    c.beginPath(); c.moveTo(-80, 90); c.lineTo(-120, 190); c.stroke();
    c.save(); c.translate(80, 90); c.rotate(-1.1 - g); c.beginPath(); c.moveTo(0, 0); c.lineTo(0, -95); c.stroke();
    c.fillStyle = '#F2C29B'; c.beginPath(); c.arc(0, -108, 20, 0, 7); c.fill(); c.restore();
    c.fillStyle = '#F2C29B'; c.beginPath(); c.arc(-120, 198, 20, 0, 7); c.fill();
    // neck + head
    c.fillStyle = '#F2C29B'; c.fillRect(-18, 10, 36, 36);
    c.beginPath(); c.ellipse(0, -40, 66, 74, 0, 0, 7); c.fill();
    // hair
    c.fillStyle = '#2B1B12'; c.beginPath(); c.ellipse(0, -88, 70, 40, 0, Math.PI, 0); c.fill();
    c.beginPath(); c.ellipse(-48, -60, 22, 40, 0.3, 0, 7); c.fill(); c.beginPath(); c.ellipse(46, -66, 18, 30, -0.3, 0, 7); c.fill();
    // eyes
    const blink = (t % 3.3) > 3.15 ? 0.1 : 1;
    c.fillStyle = '#1E1B3A'; [-24, 24].forEach(ex => { c.beginPath(); c.ellipse(ex, -40, 8, 10 * blink, 0, 0, 7); c.fill(); });
    c.fillStyle = '#fff'; if (blink === 1) [-27, 21].forEach(ex => { c.beginPath(); c.arc(ex, -44, 3, 0, 7); c.fill(); });
    c.strokeStyle = '#2B1B12'; c.lineWidth = 6; c.lineCap = 'round';
    c.beginPath(); c.moveTo(-36, -62 - (talking ? Math.abs(Math.sin(t * 3)) * 5 : 0)); c.lineTo(-14, -64); c.moveTo(14, -64); c.lineTo(36, -62); c.stroke();
    c.fillStyle = 'rgba(255,110,140,.45)'; [-40, 40].forEach(ex => { c.beginPath(); c.ellipse(ex, -16, 11, 7, 0, 0, 7); c.fill(); });
    // mouth
    c.fillStyle = '#7A1F2B';
    const open = talking ? 4 + 13 * Math.abs(Math.sin(t * 13) * Math.sin(t * 7.3)) : 3;
    c.beginPath(); c.ellipse(0, 4, 18, open, 0, 0, 7); c.fill();
    c.restore();
  }

  function frame(c, st, time, talkingOverride) {
    const scenes = st.scenes;
    let acc = 0, i = 0;
    while (i < scenes.length - 1 && time > acc + scenes[i].dur) { acc += scenes[i].dur; i++; }
    const sc = scenes[i], lt = Math.min(time - acc, sc.dur), p = lt / sc.dur;
    const hue = HUES[i % HUES.length];
    // background
    const g = c.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, `hsl(${hue},85%,62%)`); g.addColorStop(1, `hsl(${(hue + 50) % 360},80%,45%)`);
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    c.globalAlpha = 0.12; c.fillStyle = '#fff';
    for (let k = 0; k < 7; k++) { c.beginPath(); c.arc((k * 173 + time * 30) % (W + 200) - 100, 200 + (k * 211) % 900, 40 + k * 12, 0, 7); c.fill(); }
    c.globalAlpha = 1;
    // story bars
    scenes.forEach((s, k) => {
      const bw = (W - 40 - (scenes.length - 1) * 6) / scenes.length, bx = 20 + k * (bw + 6);
      c.fillStyle = 'rgba(255,255,255,.35)'; rr(c, bx, 22, bw, 6, 3); c.fill();
      c.fillStyle = '#fff'; rr(c, bx, 22, bw * (k < i ? 1 : k === i ? p : 0), 6, 3); c.fill();
    });
    // picture card with a slow zoom
    const cx = 50, cy = 120, cw = W - 100, ch = 600;
    const enter = Math.min(1, lt / 0.35);
    c.save(); c.translate(W / 2, cy + ch / 2); c.rotate((1 - enter) * 0.15 * (i % 2 ? 1 : -1)); c.scale(0.8 + 0.2 * enter, 0.8 + 0.2 * enter); c.translate(-W / 2, -(cy + ch / 2));
    c.shadowColor = 'rgba(0,0,0,.35)'; c.shadowBlur = 30; c.shadowOffsetY = 12;
    c.fillStyle = '#fff'; rr(c, cx - 10, cy - 10, cw + 20, ch + 20, 34); c.fill();
    c.shadowColor = 'transparent';
    c.save(); rr(c, cx, cy, cw, ch, 26); c.clip();
    if (sc.image) {
      const im = sc.image.img, z = 1.05 + 0.12 * p;
      const sc2 = Math.max(cw / im.width, ch / im.height) * z;
      c.drawImage(im, cx + (cw - im.width * sc2) / 2 - 20 * p, cy + (ch - im.height * sc2) / 2, im.width * sc2, im.height * sc2);
      c.fillStyle = 'rgba(0,0,0,.45)'; c.fillRect(cx, cy + ch - 34, cw, 34);
      c.fillStyle = '#fff'; c.font = '600 18px system-ui, sans-serif'; c.textAlign = 'left'; c.fillText(sc.image.credit, cx + 14, cy + ch - 11);
    } else {
      const gg = c.createLinearGradient(cx, cy, cx + cw, cy + ch);
      gg.addColorStop(0, `hsl(${(hue + 180) % 360},90%,92%)`); gg.addColorStop(1, `hsl(${(hue + 210) % 360},90%,80%)`);
      c.fillStyle = gg; c.fillRect(cx, cy, cw, ch);
      if (i === scenes.length - 1) drawMotey(c, W / 2, cy + ch / 2 - 10, 2.2, time, false);
      else { c.font = '220px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(sc.emoji || '💡', W / 2, cy + ch / 2 + Math.sin(time * 3) * 10); c.textBaseline = 'alphabetic'; }
    }
    c.restore();
    // emoji sticker
    c.font = '84px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; c.textAlign = 'center';
    c.save(); c.translate(cx + cw - 20, cy + 20); c.rotate(Math.sin(time * 4) * 0.2); c.scale(1 + 0.1 * Math.sin(time * 6), 1 + 0.1 * Math.sin(time * 6)); c.fillText(sc.emoji || '✨', 0, 30); c.restore();
    c.restore();
    // captions, word by word
    c.font = '900 50px "Nunito","Segoe UI",system-ui,sans-serif'; c.textAlign = 'center';
    const lines = wrapLines(c, sc.caption, W - 90).slice(0, 4);
    const total = lines.join(' ').split(' ').length;
    const shown = Math.min(total, Math.floor(p * total * 1.6) + 1);
    let n = 0;
    lines.forEach((ln, k) => {
      const y = 800 + k * 62;
      const ws = ln.split(' ');
      let x = W / 2 - c.measureText(ln).width / 2;
      c.textAlign = 'left';
      ws.forEach(w => {
        n++;
        if (n <= shown) {
          c.lineWidth = 10; c.strokeStyle = '#1E1B3A'; c.lineJoin = 'round'; c.strokeText(w, x, y);
          c.fillStyle = n === shown ? '#FFE14D' : '#fff'; c.fillText(w, x, y);
        }
        x += c.measureText(w + ' ').width;
      });
    });
    c.textAlign = 'center';
    // presenter + Motey
    const talking = talkingOverride !== undefined ? talkingOverride : (lt > 0.3 && lt < sc.dur - 0.4);
    drawPresenter(c, 190, 1120, time, talking);
    drawMotey(c, 610, 1090, 0.62, time + 1, !talking && i % 2 === 1);
    // footer
    c.textAlign = 'left'; c.fillStyle = '#fff'; c.font = '800 28px system-ui, sans-serif';
    c.shadowColor = 'rgba(0,0,0,.5)'; c.shadowBlur = 6;
    c.fillText('@motey.ai', 330, 1165);
    c.font = '600 22px system-ui, sans-serif';
    c.fillText(('♫ Motey beats – ' + st.title).slice(0, 38), 330, 1200);
    c.shadowColor = 'transparent';
    return { i, lt, sc };
  }

  /* ---------- UI ---------- */
  function render(v, meeting, ui) {
    if (!meeting) return ui.pickMeeting(v, 'tiktok', '🎬 TikTok-läge', 'Orkar du inte läsa? Motey gör mötet till en kort video med en animerad presentatör, bilder från internet och text.');
    alive = true;
    const esc = ui.esc;
    v.innerHTML = `<div class="row between"><a href="#/tiktok" class="btn sm ghost">‹ Byt möte</a><span class="badge brand" id="src">…</span></div>
      <h1 style="margin-top:12px">🎬 ${esc(meeting.title)}</h1>
      <div class="tt-wrap">
        <div class="tt-phone"><canvas id="tt" width="${W}" height="${H}"></canvas>
          <button class="tt-play hidden" id="ttplay" aria-label="Spela">▶</button>
          <div class="tt-side"><button id="like" aria-label="Gilla">❤️</button><span id="likes">0</span>
            <button id="cmt" aria-label="Sammanfattning">💬</button><span>Info</span>
            <button id="dl" aria-label="Spara video">⬇️</button><span>Spara</span>
            <button id="again" aria-label="Ny video">🔄</button><span>Ny</span></div></div>
        <div class="tt-panel card">
          <h3>Så här gör Motey videon</h3>
          <div class="progress"><i id="bar"></i></div><p class="small muted" id="status" style="margin-top:6px">Skriver manus…</p>
          <ol class="scene-list small" id="scenes"></ol>
          <p class="small muted">Presentatören och Motey animeras i realtid. Bilderna hämtas från Wikipedia när det finns nät. Den sparade videon har text och musik – rösten hörs bara i appen.</p>
        </div>
      </div>`;
    const canvas = $('#tt', v), c = canvas.getContext('2d');
    const status = t => { const s = $('#status', v); if (s) s.textContent = t; };
    const bar = x => { const b = $('#bar', v); if (b) b.style.width = Math.round(x * 100) + '%'; };
    let likes = 0;
    $('#like', v).addEventListener('click', e => { likes++; e.currentTarget.classList.add('liked'); $('#likes', v).textContent = likes; });
    $('#cmt', v).addEventListener('click', () => ui.toast(state ? state.scenes.map(s => s.caption).join(' · ').slice(0, 300) : '…', 6000));
    $('#again', v).addEventListener('click', () => { stop(); build(); });
    $('#dl', v).addEventListener('click', () => exportVideo());
    $('#ttplay', v).addEventListener('click', () => play());

    async function build() {
      bar(0.05); status('Skriver manus…');
      const r = await AI.videoScript(meeting);
      if (!alive) return;
      $('#src', v).textContent = r.source === 'claude' ? 'Manus: Claude' : 'Manus: Offline-AI';
      const scenes = r.value.map(s => Object.assign({}, s, { dur: Math.max(4.2, Math.min(7.5, s.caption.split(' ').length * 0.42 + 1.6)) }));
      $('#scenes', v).innerHTML = scenes.map(s => `<li>${esc(s.emoji || '')} ${esc(s.caption)}</li>`).join('');
      status('Hämtar bilder från internet…');
      let done = 0;
      await Promise.all(scenes.map(async s => { s.image = await wikiImage(s.query); done++; bar(0.1 + 0.8 * done / scenes.length); }));
      if (!alive) return;
      const imgs = scenes.filter(s => s.image).length;
      bar(1); status(`Klar! ${scenes.length} scener, ${imgs} bilder från internet.`);
      state = { scenes, title: meeting.title, total: scenes.reduce((a, s) => a + s.dur, 0) };
      Store.state.stats.videos++; Store.save();
      frame(c, state, 0.01, false);
      $('#ttplay', v).classList.remove('hidden');
    }

    let t0 = 0, lastScene = -1;
    function play() {
      if (!state) return;
      $('#ttplay', v).classList.add('hidden');
      if (!audio) audio = makeAudio();
      if (audio) audio.start();
      t0 = performance.now(); lastScene = -1;
      const loop = now => {
        if (!alive) return;
        const time = (now - t0) / 1000;
        if (time >= state.total) { stop(); frame(c, state, state.total - 0.01, false); $('#ttplay', v).classList.remove('hidden'); return; }
        const f = frame(c, state, time);
        if (f.i !== lastScene) { lastScene = f.i; Platform.stopSpeaking(); Platform.speak(f.sc.narration || f.sc.caption, { rate: 1.08 }); }
        raf = requestAnimationFrame(loop);
      };
      raf = requestAnimationFrame(loop);
    }
    function stop() { cancelAnimationFrame(raf); if (audio) audio.stop(); Platform.stopSpeaking(); }

    async function exportVideo() {
      if (!state) return ui.toast('Vänta tills videon är klar');
      if (!window.MediaRecorder || !canvas.captureStream) return ui.toast('Den här enheten kan inte spela in video 😕');
      stop();
      $('#ttplay', v).classList.add('hidden');
      if (!audio) audio = makeAudio();
      const stream = canvas.captureStream(30);
      if (audio && audio.stream) audio.stream.getAudioTracks().forEach(tr => stream.addTrack(tr));
      const types = ['video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
      const type = types.find(x => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(x)) || '';
      let rec;
      try { rec = new MediaRecorder(stream, type ? { mimeType: type, videoBitsPerSecond: 4e6 } : undefined); }
      catch (e) { return ui.toast('Kunde inte starta inspelningen: ' + e.message); }
      const chunks = [];
      rec.ondataavailable = e => e.data.size && chunks.push(e.data);
      const finished = new Promise(res => { rec.onstop = res; });
      rec.start(500);
      if (audio) audio.start();
      const start = performance.now();
      await new Promise(res => {
        const loop = now => {
          if (!alive) return res();
          const time = (now - start) / 1000;
          if (time >= state.total) return res();
          frame(c, state, time);
          bar(time / state.total); status(`Spelar in video… ${Math.round(100 * time / state.total)} %`);
          raf = requestAnimationFrame(loop);
        };
        raf = requestAnimationFrame(loop);
      });
      if (audio) audio.stop();
      rec.stop(); await finished;
      if (!alive) return;
      const mime = (rec.mimeType || type || 'video/webm').split(';')[0];
      const blob = new Blob(chunks, { type: mime });
      const name = `Motey-${meeting.title.replace(/[^\wåäöÅÄÖ-]+/g, '_')}.${mime.includes('mp4') ? 'mp4' : 'webm'}`;
      status('Video klar (' + (blob.size / 1e6).toFixed(1) + ' MB)');
      ui.toast(await Platform.saveFile(name, blob));
      $('#ttplay', v).classList.remove('hidden');
    }

    build();
  }

  function destroy() {
    alive = false; cancelAnimationFrame(raf);
    if (audio) { audio.close(); audio = null; }
    state = null;
  }

  window.TikTokMode = { render, destroy, frame, drawMotey };
})();

</script>
<script>

(function () {
  'use strict';
  const $ = (s, el) => (el || document).querySelector(s);
  const VW = 960, VH = 540, FLOOR_TOP = 150, FLOOR_BOT = 480, GAP = 560;
  let alive = false, raf = 0, keyHandlers = null;

  function render(v, meeting, ui) {

    alive = true;
    const esc = ui.esc;
    const S = Store.settings;
    v.innerHTML = `<div class="row between"><a href="#/game" class="btn sm ghost">‹ Byt möte</a><span class="badge brand" id="gsrc">Bygger banan…</span></div>
      <h1 style="margin-top:12px">🎮 ${esc(meeting.title)}</h1>
      <div class="game-shell" id="shell">
        <canvas id="gc" width="${VW}" height="${VH}"></canvas>
        <div class="game-hud"><span id="h-xp">⭐ 0 XP</span><span id="h-walls">🧱 0/0</span><span id="h-facts">📄 0</span><span id="h-time">⏱ 0:00</span></div>
        <div class="game-say"><div id="g-motey"></div><div class="speech" id="g-say">Laddar…</div></div>
        <div class="dpad">
          <span></span><button data-k="up">▲</button><span></span>
          <button data-k="left">◀</button><button class="act" data-k="act">KROSSA</button><button data-k="right">▶</button>
          <span></span><button data-k="down">▼</button><span></span>
        </div>
      </div>
      <p class="small muted" style="margin-top:8px">Styr med <kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd> eller <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>. Tryck <kbd>E</kbd> eller <kbd>Mellanslag</kbd> vid en vägg.</p>
      <div class="card"><h3>💬 Fråga Motey (Live AI)</h3><div class="row"><input type="text" id="g-q" placeholder="Vad är skillnaden på F-skatt och A-skatt?" style="flex:1"><button class="btn" id="g-ask">Fråga</button></div></div>`;
    $('#g-motey', v).innerHTML = Mascot.svg({ size: 70 });
    const canvas = $('#gc', v), c = canvas.getContext('2d');
    const keys = {};
    let level = null, walls = [], facts = [], props = [], particles = [], won = false, busy = false;
    const player = { x: 120, y: 300, w: 34, h: 52, dir: 1, step: 0 };
    const buddy = { x: 60, y: 250 };
    let xp = 0, factsGot = 0, startT = performance.now(), cam = 0, worldW = 2000, sayTimer = 0;

    function say(text, opts) {
      const el = $('#g-say', v); if (!el) return;
      el.textContent = text;
      const svg = $('#g-motey .motey-svg', v);
