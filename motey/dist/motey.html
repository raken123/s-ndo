<script>
/* Motey – Nostr transport, written from the specs (NIP-01, BIP-340).
 * Motey uses public Nostr relays as a mailbox: every message is AES-GCM
 * encrypted with the room key before it leaves the device, so relays only
 * see random-looking bytes, a room tag and a throwaway public key. */
(function () {
  'use strict';
  const enc = new TextEncoder();

  /* ---------------- bytes ---------------- */
  const hex = b => Array.from(b, x => x.toString(16).padStart(2, '0')).join('');
  const unhex = h => new Uint8Array(h.match(/../g).map(x => parseInt(x, 16)));
  const concat = (...a) => { const o = new Uint8Array(a.reduce((s, x) => s + x.length, 0)); let i = 0; for (const x of a) { o.set(x, i); i += x.length; } return o; };
  const b64 = u => { let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const b64url = u => b64(u).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const unb64url = s => unb64(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4));
  const rand = n => crypto.getRandomValues(new Uint8Array(n));
  const sha256 = async data => new Uint8Array(await crypto.subtle.digest('SHA-256', typeof data === 'string' ? enc.encode(data) : data));

  /* ---------------- secp256k1 + BIP-340 signing ---------------- */
  const P = 2n ** 256n - 0x1000003D1n;
  const N = 0xFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFEBAAEDCE6AF48A03BBFD25E8CD0364141n;
  const G = [0x79BE667EF9DCBBAC55A06295CE870B07029BFCDB2DCE28D959F2815B16F81798n,
             0x483ADA7726A3C4655DA4FBFC0E1108A8FD17B448A68554199C47D08FFB10D4B8n, 1n];
  const mod = (a, m = P) => { const r = a % m; return r >= 0n ? r : r + m; };
  function inv(a, m = P) {
    let [x0, x1, r0, r1] = [0n, 1n, m, mod(a, m)];
    while (r1) { const q = r0 / r1; [r0, r1] = [r1, r0 - q * r1]; [x0, x1] = [x1, x0 - q * x1]; }
    return mod(x0, m);
  }
  // Jacobian coordinates [X, Y, Z]; Z = 0 is the point at infinity.
  function dbl([X, Y, Z]) {
    if (!Y || !Z) return [0n, 1n, 0n];
    const S = mod(4n * X * Y * Y), M = mod(3n * X * X);
    const X3 = mod(M * M - 2n * S);
    return [X3, mod(M * (S - X3) - 8n * Y ** 4n), mod(2n * Y * Z)];
  }
  function add(p, q) {
    if (!p[2]) return q; if (!q[2]) return p;
    const [X1, Y1, Z1] = p, [X2, Y2, Z2] = q;
    const Z1Z1 = mod(Z1 * Z1), Z2Z2 = mod(Z2 * Z2);
    const U1 = mod(X1 * Z2Z2), U2 = mod(X2 * Z1Z1), S1 = mod(Y1 * Z2 * Z2Z2), S2 = mod(Y2 * Z1 * Z1Z1);
    if (U1 === U2) return S1 === S2 ? dbl(p) : [0n, 1n, 0n];
    const H = mod(U2 - U1), R = mod(S2 - S1), H2 = mod(H * H), H3 = mod(H * H2), U1H2 = mod(U1 * H2);
    const X3 = mod(R * R - H3 - 2n * U1H2);
    return [X3, mod(R * (U1H2 - X3) - S1 * H3), mod(H * Z1 * Z2)];
  }
  function mul(k, p = G) {
    let r = [0n, 1n, 0n];
    for (let i = BigInt(k.toString(2).length) - 1n; i >= 0n; i--) { r = dbl(r); if ((k >> i) & 1n) r = add(r, p); }
    return r;
  }
  function affine([X, Y, Z]) { const zi = inv(Z), zi2 = mod(zi * zi); return [mod(X * zi2), mod(Y * zi2 * zi)]; }
  const big = b => BigInt('0x' + (hex(b) || '0'));
  const bytes32 = n => unhex(n.toString(16).padStart(64, '0'));
  async function tagged(tag, ...msgs) { const t = await sha256(tag); return sha256(concat(t, t, ...msgs)); }

  function newSecret() {
    for (;;) { const k = big(rand(32)); if (k > 0n && k < N) return bytes32(k); }
  }
  function publicKey(sk) { return bytes32(affine(mul(big(sk)))[0]); }

  async function schnorrSign(msg, sk, aux) {
    const d0 = big(sk);
    const [px, py] = affine(mul(d0));
    const d = py % 2n === 0n ? d0 : N - d0;
    const t = new Uint8Array(32);
    const ah = await tagged('BIP0340/aux', aux || rand(32));
    const db = bytes32(d);
    for (let i = 0; i < 32; i++) t[i] = db[i] ^ ah[i];
    const k0 = mod(big(await tagged('BIP0340/nonce', t, bytes32(px), msg)), N);
    if (!k0) throw new Error('bad nonce');
    const [rx, ry] = affine(mul(k0));
    const k = ry % 2n === 0n ? k0 : N - k0;
    const e = mod(big(await tagged('BIP0340/challenge', bytes32(rx), bytes32(px), msg)), N);
    return concat(bytes32(rx), bytes32(mod(k + e * d, N)));
  }
  // Verification (used by the self-test; relay events are authenticated by AES-GCM instead).
  async function schnorrVerify(sig, msg, pub) {
    const x = big(pub);
    if (x >= P) return false;
    const c = mod(x ** 3n + 7n);
    let y = c;
    { let r = 1n, b = c, e = (P + 1n) / 4n; while (e) { if (e & 1n) r = mod(r * b); b = mod(b * b); e >>= 1n; } y = r; }
    if (mod(y * y) !== c) return false;
    if (y % 2n) y = P - y;
    const r = big(sig.slice(0, 32)), s = big(sig.slice(32));
    if (r >= P || s >= N) return false;
    const e = mod(big(await tagged('BIP0340/challenge', sig.slice(0, 32), pub, msg)), N);
    const R = add(mul(s), mul(N - e, [x, y, 1n]));
    if (!R[2]) return false;
    const [Rx, Ry] = affine(R);
    return Ry % 2n === 0n && Rx === r;
  }

  /* ---------------- NIP-01 events ---------------- */
  async function signEvent(ev, sk) {
    const pubkey = hex(publicKey(sk));
    const e = { pubkey, created_at: ev.created_at || Math.floor(Date.now() / 1000), kind: ev.kind, tags: ev.tags || [], content: ev.content || '' };
    const id = await sha256(JSON.stringify([0, e.pubkey, e.created_at, e.kind, e.tags, e.content]));
    e.id = hex(id);
    e.sig = hex(await schnorrSign(id, sk));
    return e;
  }

  /* ---------------- AES-GCM ---------------- */
  const keyCache = new Map();
  async function aesKey(raw) {
    const k = typeof raw === 'string' ? raw : b64(raw);
    if (!keyCache.has(k)) keyCache.set(k, crypto.subtle.importKey('raw', typeof raw === 'string' ? unb64(raw) : raw, 'AES-GCM', false, ['encrypt', 'decrypt']));
    return keyCache.get(k);
  }
  async function seal(keyB64, obj) {
    const iv = rand(12);
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await aesKey(keyB64), enc.encode(JSON.stringify(obj))));
    return b64(concat(iv, ct));
  }
  async function open(keyB64, content) {
    const raw = unb64(content);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: raw.slice(0, 12) }, await aesKey(keyB64), raw.slice(12));
    return JSON.parse(new TextDecoder().decode(pt));
  }

  /* ---------------- relay pool ---------------- */
  class Relay {
    constructor(url, pool) { this.url = url; this.pool = pool; this.ws = null; this.status = 'off'; this.wait = 1000; this.closed = false; this.connect(); }
    connect() {
      if (this.closed) return;
      this.status = 'connecting';
      let ws;
      try { ws = new WebSocket(this.url); } catch (e) { return this.retry(); }
      this.ws = ws;
      ws.onopen = () => {
        this.status = 'open'; this.wait = 1000;
        for (const [id, s] of this.pool.subs) this.send(['REQ', id, ...s.filters]);
        for (const ev of this.pool.outbox.values()) this.send(['EVENT', ev]);
        this.pool.changed();
      };
      ws.onmessage = m => {
        let d; try { d = JSON.parse(m.data); } catch (e) { return; }
        if (d[0] === 'EVENT') this.pool.onEvent(d[1], d[2], this);
        else if (d[0] === 'EOSE') this.pool.onEose(d[1], this);
        else if (d[0] === 'OK') this.pool.onOk(d[1], d[2], d[3], this);
      };
      ws.onclose = () => { this.status = 'off'; this.pool.changed(); this.retry(); };
      ws.onerror = () => { try { ws.close(); } catch (e) { /* closing */ } };
    }
    retry() { if (this.closed) return; setTimeout(() => this.connect(), this.wait); this.wait = Math.min(this.wait * 2, 30000); }
    send(msg) { if (this.ws && this.ws.readyState === 1) { this.ws.send(JSON.stringify(msg)); return true; } return false; }
    close() { this.closed = true; try { this.ws && this.ws.close(); } catch (e) { /* closed */ } }
  }

  class Pool {
    constructor(urls) { this.subs = new Map(); this.outbox = new Map(); this.seen = new Set(); this.listeners = new Set(); this.relays = []; this.setRelays(urls); }
    setRelays(urls) {
      this.relays.forEach(r => r.close());
      this.relays = [...new Set(urls)].filter(u => /^wss?:\/\//.test(u)).map(u => new Relay(u, this));
    }
    changed() { this.listeners.forEach(f => f(this.state())); }
    state() { return this.relays.map(r => ({ url: r.url, status: r.status })); }
    online() { return this.relays.filter(r => r.status === 'open').length; }
    sub(id, filters, onEvent, onEose) {
      this.subs.set(id, { filters, onEvent, onEose, eosed: new Set() });
      this.relays.forEach(r => r.send(['REQ', id, ...filters]));
    }
    unsub(id) { this.subs.delete(id); this.relays.forEach(r => r.send(['CLOSE', id])); }
    onEvent(subId, ev, relay) {
      const s = this.subs.get(subId);
      if (!s || !ev || !ev.id) return;
      if (this.seen.has(ev.id)) return;
      this.seen.add(ev.id);
      if (this.seen.size > 20000) this.seen = new Set([...this.seen].slice(-10000));
      s.onEvent(ev, relay.url);
    }
    onEose(subId, relay) { const s = this.subs.get(subId); if (s && !s.eosed.has(relay.url)) { s.eosed.add(relay.url); s.onEose && s.onEose(relay.url); } }
    onOk(id, ok, msg) { const p = this.outbox.get(id); if (p && ok) { this.outbox.delete(id); } if (!ok) console.warn('relay refused', id, msg); }
    publish(ev, keep) {
      // Stored events wait in the outbox until a relay confirms them; ephemeral ones are fire-and-forget.
      if (keep) this.outbox.set(ev.id, ev);
      let sent = 0;
      this.relays.forEach(r => { if (r.send(['EVENT', ev])) sent++; });
      return sent;
    }
  }

  window.Nostr = { Pool, signEvent, seal, open, newSecret, publicKey, schnorrSign, schnorrVerify, sha256, hex, unhex, b64, unb64, b64url, unb64url, rand };
})();

<script>
/* Motey – real meetings and messages between devices, with no Motey server.
 *
 * A "room" is a chat or a meeting. It has a random id and a random 256-bit
 * key; both travel only inside the invite code. Messages are encrypted with
 * the key and stored on public Nostr relays (NIP-01), which act as a mailbox,
 * so people get what was said while they were offline. Calls are WebRTC
 * directly between devices; the relays only pass the encrypted handshake.
 * Each room gets its own signing key derived from this device's secret, so
 * relays cannot link the rooms you are in. */
(function () {
  'use strict';
  const N = window.Nostr;
  const KIND_STORED = 4333, KIND_SIGNAL = 24333;
  const DEFAULT_RELAYS = ['wss://relay.damus.io', 'wss://nos.lol', 'wss://nostr.mom', 'wss://relay.primal.net'];
  const INVITE_BASE = 'https://raken123.github.io/s-ndo/motey/dist/motey.html';
  const MAX_FILE = 750 * 1024, CHUNK = 16 * 1024;
  const COLORS = ['#6C4CF5', '#FF7A59', '#19C79A', '#FF5C8A', '#2F80ED', '#F2A007', '#9B51E0'];

  let pool = null, started = false;
  const listeners = { message: new Set(), signal: new Set(), status: new Set(), rooms: new Set() };
  const emit = (k, ...a) => listeners[k].forEach(f => { try { f(...a); } catch (e) { console.error(e); } });
  const on = (k, f) => { listeners[k].add(f); return () => listeners[k].delete(f); };

  /* ---------------- identity ---------------- */
  function secret() {
    let s = null;
    try { s = localStorage.getItem('motey.sk'); } catch (e) { /* blocked */ }
    if (!s) { s = N.hex(N.newSecret()); try { localStorage.setItem('motey.sk', s); } catch (e) { /* blocked */ } }
    return s;
  }
  const roomKeys = new Map();
  async function roomSigner(room) {
    if (!roomKeys.has(room.id)) {
      // per-room key: sha256(device secret || room id), reduced into range by retrying
      let k = await N.sha256(secret() + ':' + room.id);
      while (k.every(b => b === 0)) k = await N.sha256(k);
      roomKeys.set(room.id, { sk: k, pk: N.hex(N.publicKey(k)) });
    }
    return roomKeys.get(room.id);
  }
  const me = () => ({ name: Store.settings.name || 'Jag', color: Store.settings.color || COLORS[0] });

  /* ---------------- rooms ---------------- */
  const rooms = () => Store.state.rooms || (Store.state.rooms = []);
  const room = id => rooms().find(r => r.id === id);
  async function tagFor(id) { return N.hex(await N.sha256('motey-room/' + id)).slice(0, 32); }

  async function createRoom({ name, kind, meta }) {
    const r = { id: N.hex(N.rand(16)), key: N.b64(N.rand(32)), name: name || 'Chatt', kind: kind || 'chat', created: Date.now(), lastRead: Date.now(), members: {}, synced: 0 };
    r.tag = await tagFor(r.id);
    rooms().push(r); Store.save();
    await resubscribe();
    await hello(r);
    if (meta) await send(r.id, Object.assign({ t: 'meta' }, meta));
    emit('rooms');
    return r;
  }
  function inviteCode(r) { return 'M1' + N.b64url(N.unhex(r.id + '')) + '.' + N.b64url(N.unb64(r.key)); }
  function inviteLink(r) { return INVITE_BASE + '#join=' + inviteCode(r); }
  function parseInvite(text) {
    const m = String(text || '').match(/M1([A-Za-z0-9_-]{22})\.([A-Za-z0-9_-]{43})/);
    if (!m) return null;
    return { id: N.hex(N.unb64url(m[1])), key: N.b64(N.unb64url(m[2])) };
  }
  async function join(text, name) {
    const inv = parseInvite(text);
    if (!inv) throw new Error('Det där ser inte ut som en Motey-inbjudan.');
    let r = room(inv.id);
    if (!r) {
      r = { id: inv.id, key: inv.key, name: name || 'Ny chatt', kind: 'chat', created: Date.now(), lastRead: 0, members: {}, synced: 0, joinedViaInvite: true };
      r.tag = await tagFor(r.id);
      rooms().push(r); Store.save();
      await resubscribe();
      await hello(r);
      emit('rooms');
    }
    return r;
  }
  function leave(id) {
    Store.state.rooms = rooms().filter(r => r.id !== id);
    try { localStorage.removeItem('motey.msgs.' + id); } catch (e) { /* blocked */ }
    Store.state.meetings = Store.state.meetings.filter(m => m.room !== id);
    Store.save(); resubscribe(); emit('rooms');
  }
  const hello = r => send(r.id, { t: 'hello', name: me().name, color: me().color });

  /* ---------------- local message log ---------------- */
  const logs = new Map();
  function messages(id) {
    if (!logs.has(id)) {
      let a = [];
      try { a = JSON.parse(localStorage.getItem('motey.msgs.' + id) || '[]'); } catch (e) { /* corrupt or blocked */ }
      logs.set(id, a);
    }
    return logs.get(id);
  }
  let saveTimer = 0;
  const dirty = new Set();
  function persist(id) {
    dirty.add(id);
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      for (const d of dirty) {
        const a = messages(d);
        if (a.length > 2000) a.splice(0, a.length - 2000);
        try { localStorage.setItem('motey.msgs.' + d, JSON.stringify(a)); } catch (e) { console.warn('kunde inte spara meddelanden', e); }
      }
      dirty.clear();
      Store.save();
    }, 300);
  }
  function insert(r, msg) {
    const a = messages(r.id);
    if (a.some(x => x.id === msg.id)) return false;
    let i = a.length;
    while (i > 0 && a[i - 1].at > msg.at) i--;
    a.splice(i, 0, msg);
    persist(r.id);
    return true;
  }

  /* ---------------- sending ---------------- */
  async function send(roomId, payload) {
    const r = room(roomId);
    if (!r) throw new Error('okänt rum');
    const s = await roomSigner(r);
    payload = Object.assign({ v: 1, pk: s.pk, name: me().name }, payload);
    const ev = await N.signEvent({ kind: KIND_STORED, tags: [['y', r.tag]], content: await N.seal(r.key, payload) }, s.sk);
    const msg = toMsg(ev, payload, true);
    if (payload.t !== 'chunk') { handle(r, msg, true); }
    if (pool) pool.publish(ev, true);
    return msg;
  }
  async function signal(roomId, payload) {
    const r = room(roomId);
    if (!r || !pool) return;
    const s = await roomSigner(r);
    payload = Object.assign({ v: 1, pk: s.pk, name: me().name }, payload);
    const ev = await N.signEvent({ kind: KIND_SIGNAL, tags: [['y', r.tag]], content: await N.seal(r.key, payload) }, s.sk);
    pool.publish(ev, false);
  }
  const sendText = (roomId, text) => send(roomId, { t: 'msg', text: String(text).slice(0, 4000) });
  const sendTranscript = (roomId, text) => send(roomId, { t: 'tr', text: String(text).slice(0, 2000) });

  async function sendFile(roomId, blob, name) {
    if (blob.size > MAX_FILE) throw new Error(`Filen är för stor (max ${Math.round(MAX_FILE / 1024)} kB).`);
    const bytes = new Uint8Array(await blob.arrayBuffer());
    const fid = N.hex(N.rand(8));
    const n = Math.max(1, Math.ceil(bytes.length / CHUNK));
    await Files.putMeta(fid, { name, mime: blob.type || 'application/octet-stream', size: bytes.length, n });
    for (let i = 0; i < n; i++) {
      const d = N.b64(bytes.subarray(i * CHUNK, (i + 1) * CHUNK));
      await Files.putChunk(fid, i, d);
      await send(roomId, { t: 'chunk', fid, i, n, d });
      await new Promise(res => setTimeout(res, 120)); // be gentle with public relays
    }
    return send(roomId, { t: 'file', fid, fname: name, mime: blob.type || 'application/octet-stream', size: bytes.length, n });
  }

  /* ---------------- receiving ---------------- */
  function toMsg(ev, p, mine) {
    return { id: ev.id, pk: p.pk, name: p.name, at: (p.at || ev.created_at * 1000), t: p.t, text: p.text, fid: p.fid, fname: p.fname, mime: p.mime, size: p.size, n: p.n, meta: p.t === 'meta' ? p : undefined, code: p.code, color: p.color, mine: !!mine };
  }
  async function onStored(ev) {
    const r = rooms().find(x => ev.tags && ev.tags.some(t => t[0] === 'y' && t[1] === x.tag));
    if (!r) return;
    let p;
    try { p = await N.open(r.key, ev.content); } catch (e) { return; } // not for us / tampered
    if (!p || p.pk !== ev.pubkey) return;
    r.synced = Math.max(r.synced || 0, ev.created_at);
    if (p.t === 'chunk') { await Files.putChunk(p.fid, p.i, p.d); Files.progress(p.fid); return; }
    const mine = p.pk === (await roomSigner(r)).pk;
    handle(r, toMsg(ev, p, mine), mine);
  }
  function handle(r, msg, mine) {
    const fresh = insert(r, msg);
    if (msg.pk) {
      const m = r.members[msg.pk] || (r.members[msg.pk] = {});
      m.name = msg.name || m.name; if (msg.color) m.color = msg.color;
      m.seen = Math.max(m.seen || 0, msg.at);
      if (mine) m.me = true;
    }
    if (msg.t === 'meta') applyMeta(r, msg);
    if (msg.t === 'next' && msg.code) join(msg.code).catch(() => {});
    if (msg.t === 'file' && fresh) Files.putMeta(msg.fid, { name: msg.fname, mime: msg.mime, size: msg.size, n: msg.n });
    if (!fresh) return;
    if (!mine && (msg.t === 'msg' || msg.t === 'file') && msg.at > (r.lastRead || 0)) {
      r.unread = (r.unread || 0) + 1;
      if (document.hidden || location.hash !== '#/chat/' + r.id) Platform.notify(`${msg.name} i ${r.name}`, msg.t === 'file' ? '📎 ' + msg.fname : msg.text);
    }
    if (r.kind === 'meeting') syncMeeting(r);
    emit('message', r, msg);
  }

  /* ---------------- meetings on top of rooms ---------------- */
  function applyMeta(r, msg) {
    const prev = r.meta;
    if (prev && prev.at > msg.at) return;
    r.meta = Object.assign({}, msg.meta, { at: msg.at, hostPk: prev ? prev.hostPk : msg.pk, hostName: prev ? prev.hostName : msg.name });
    r.kind = 'meeting';
    r.name = r.meta.title || r.name;
    syncMeeting(r);
    emit('rooms');
  }
  // Keep a Store meeting in step with its room, so every Motey mode (summary,
  // catch-up, Live AI, TikTok, game) works on real meetings too.
  function syncMeeting(r) {
    if (!r.meta) return;
    const id = 'r-' + r.id;
    let m = Store.meeting(id);
    if (!m) { m = { id, room: r.id, attended: null, files: [] }; Store.state.meetings.push(m); }
    const mt = r.meta;
    Object.assign(m, { title: mt.title, start: mt.start, durationMin: mt.durationMin || 45, series: mt.series || r.id, repeat: mt.repeat || '', boss: mt.hostName });
    const msgs = messages(r.id);
    const names = new Set(Object.values(r.members).map(x => x.name).filter(Boolean));
    m.attendees = [...names];
    m.transcript = msgs.filter(x => (x.t === 'msg' || x.t === 'tr') && x.text).map(x => ({ who: x.name || 'Någon', text: x.text, at: x.at, kind: x.t }));
    const shared = msgs.filter(x => x.t === 'file');
    const wanted = (mt.files || []).map(String);
    for (const name of wanted) {
      let f = m.files.find(x => x.name === name);
      if (!f) { f = { name, status: 'missing', owner: '' }; m.files.push(f); }
      const got = shared.filter(x => x.fname === name).pop();
      if (got) Object.assign(f, { status: 'sent', fid: got.fid, from: got.name, mime: got.mime });
    }
    for (const s of shared) if (!m.files.some(f => f.fid === s.fid || (f.name === s.fname && f.status !== 'missing' && !f.fid))) {
      if (!wanted.includes(s.fname)) m.files.push({ name: s.fname, status: 'sent', fid: s.fid, from: s.name, mime: s.mime, extra: true });
    }
    if (msgs.some(x => x.t === 'call' && x.mine)) m.attended = true;
    Store.save();
  }
  // A real meeting is "missed" when it is over and this device never joined the call.
  function updateAttendance() {
    for (const m of Store.state.meetings) {
      if (!m.room || m.attended === true) continue;
      if (Store.isPast(m)) m.attended = false;
    }
    autoNext();
    Store.save();
  }
  // Weekly meetings: the host's device books the next one and invites the room to it.
  async function autoNext() {
    for (const r of rooms()) {
      if (!r.meta || r.meta.repeat !== 'weekly' || r.nextBooked) continue;
      const s = await roomSigner(r);
      if (r.meta.hostPk !== s.pk) continue;
      const m = Store.meeting('r-' + r.id);
      if (!m || new Date(m.start).getTime() > Date.now()) continue;
      if (messages(r.id).some(x => x.t === 'next')) { r.nextBooked = true; continue; }
      r.nextBooked = true;
      await bookNext(r.id);
    }
  }
  async function bookNext(roomId) {
    const r = room(roomId);
    const mt = r.meta;
    let start = new Date(mt.start).getTime();
    do start += 7 * 864e5; while (start < Date.now() - 36e5);
    const nr = await createRoom({ name: mt.title, kind: 'meeting', meta: { title: mt.title, start: new Date(start).toISOString(), durationMin: mt.durationMin, series: mt.series, repeat: mt.repeat, files: mt.files } });
    await send(roomId, { t: 'next', code: inviteCode(nr), text: `Nästa möte: ${new Date(start).toLocaleString('sv-SE', { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' })}` });
    return nr;
  }

  /* ---------------- relay connection ---------------- */
  async function resubscribe() {
    if (!pool) return;
    const rs = rooms();
    pool.unsub('motey-msgs'); pool.unsub('motey-sig');
    if (!rs.length) return;
    const tags = rs.map(r => r.tag);
    const since = rs.every(r => r.synced) ? Math.min(...rs.map(r => r.synced)) - 600 : undefined;
    const f = { kinds: [KIND_STORED], '#y': tags, limit: 2000 };
    if (since) f.since = since;
    pool.sub('motey-msgs', [f], ev => onStored(ev).catch(e => console.warn(e)), () => { Store.save(); emit('status', status()); });
    pool.sub('motey-sig', [{ kinds: [KIND_SIGNAL], '#y': tags, since: Math.floor(Date.now() / 1000) - 30 }], ev => onSignal(ev).catch(e => console.warn(e)));
  }
  async function onSignal(ev) {
    const r = rooms().find(x => ev.tags && ev.tags.some(t => t[0] === 'y' && t[1] === x.tag));
    if (!r) return;
    let p; try { p = await N.open(r.key, ev.content); } catch (e) { return; }
    if (!p || p.pk !== ev.pubkey) return;
    const mine = (await roomSigner(r)).pk;
    if (p.pk === mine || (p.to && p.to !== mine)) return;
    if (p.name) { const m = r.members[p.pk] || (r.members[p.pk] = {}); m.name = p.name; m.live = Date.now(); }
    emit('signal', r, p);
  }
  function relays() {
    const list = (Store.settings.relays || '').split(/\s+/).filter(Boolean);
    return list.length ? list : DEFAULT_RELAYS;
  }
  function start() {
    if (started) return;
    started = true;
    pool = new N.Pool(relays());
    pool.listeners.add(() => emit('status', status()));
    resubscribe();
    for (const r of rooms()) if (r.kind === 'meeting') syncMeeting(r);
    updateAttendance();
    setInterval(updateAttendance, 60000);
  }
  function restart() { if (pool) pool.setRelays(relays()); resubscribe(); }
  function status() { return { online: pool ? pool.online() : 0, total: pool ? pool.relays.length : 0, relays: pool ? pool.state() : [] }; }

  /* ---------------- files (IndexedDB) ---------------- */
  const Files = (() => {
    let dbp = null;
    const db = () => dbp || (dbp = new Promise((res, rej) => {
      const q = indexedDB.open('motey-files', 1);
      q.onupgradeneeded = () => { q.result.createObjectStore('meta'); q.result.createObjectStore('chunks'); };
      q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
    }));
    const tx = async (store, mode, fn) => { const d = await db(); return new Promise((res, rej) => { const t = d.transaction(store, mode); const r = fn(t.objectStore(store)); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); }); };
    const waiting = new Map();
    return {
      putMeta: (fid, meta) => tx('meta', 'readwrite', s => s.put(meta, fid)).catch(() => {}),
      putChunk: (fid, i, d) => tx('chunks', 'readwrite', s => s.put(d, fid + ':' + i)).catch(() => {}),
      async get(fid) {
        const meta = await tx('meta', 'readonly', s => s.get(fid)).catch(() => null);
        if (!meta) return null;
        const parts = [];
        for (let i = 0; i < meta.n; i++) {
          const d = await tx('chunks', 'readonly', s => s.get(fid + ':' + i)).catch(() => null);
          if (!d) return { meta, missing: true, have: i };
          parts.push(N.unb64(d));
        }
        return { meta, blob: new Blob(parts, { type: meta.mime }) };
      },
      progress(fid) { const f = waiting.get(fid); if (f) f(); },
      wait(fid, cb) { waiting.set(fid, cb); }
    };
  })();

  window.MoteyNet = {
    start, restart, status, on, rooms, room, createRoom, join, leave, inviteCode, inviteLink, parseInvite,
    send, sendText, sendTranscript, sendFile, signal, messages, roomSigner, me, bookNext, syncMeeting, updateAttendance,
    files: Files, COLORS, DEFAULT_RELAYS, MAX_FILE,
    get started() { return started; }
  };
})();

<script>
/* Motey prenumerationer – Lite, Plus, Pro.
 * Usage is counted in "Plus units": a Plus month is 100 units = 100 %.
 * Lite gets a quarter of that (25 units), so 25 % in Plus is 100 % in Lite.
 * With Motey-servern the server counts and enforces; without it the count
 * lives on this device (fine for testing, not for selling). */
(function () {
  'use strict';
  const PLANS = {
    lite: { id: 'lite', name: 'Motey Lite', price: 0, quota: 25, live: false, replace: false,
      blurb: 'Gratis. Gräns på allting – varje liten sak räknas, även spel och TikTok. Ingen AI-Live.' },
    plus: { id: 'plus', name: 'Motey Plus', price: 12, quota: 100, live: true, replace: false,
      blurb: 'Mer användning och AI-Live. AI-Live tar 5 % per minut – passar dig som har online-möten ungefär 4 gånger i månaden.' },
    pro: { id: 'pro', name: 'Motey Pro', price: 310, quota: 2000, live: true, replace: true,
      blurb: 'Mycket mer användning och Live Replace: en 3D-version av dig pratar i mötet medan du är på stranden.' }
  };
  // cost of each thing, in Plus units (Plus month = 100)
  const COST = {
    summary: 1, catchup: 1, ask: 0.5, fix: 1, tiktok: 4, game: 3, scan: 2,
    live_min: 5,     // AI-Live (style swap with Motey's voice), per started minute
    replace_min: 5   // Live Replace (Pro), per started minute
  };
  const LABEL = { summary: 'Sammanfattning', catchup: 'Vad hände förra gången', ask: 'Fråga Motey', fix: 'Motey fixar en fil', tiktok: 'TikTok-video', game: 'Spelbana', scan: '3D-skanning', live_min: 'AI-Live, per minut', replace_min: 'Live Replace, per minut' };

  const S = () => Store.settings;
  const server = () => (S().serverUrl || '').replace(/\/+$/, '');
  const period = () => new Date().toISOString().slice(0, 7);

  function token() {
    let t = null;
    try { t = localStorage.getItem('motey.token'); } catch (e) { /* blocked */ }
    if (!t) { t = Nostr.hex(Nostr.rand(24)); try { localStorage.setItem('motey.token', t); } catch (e) { /* blocked */ } }
    return t;
  }
  function state() {
    const st = Store.state;
    if (!st.plan) st.plan = { id: 'lite', used: 0, period: period() };
    if (st.plan.period !== period()) { st.plan.used = 0; st.plan.period = period(); }
    return st.plan;
  }
  const plan = () => PLANS[state().id] || PLANS.lite;
  const pct = () => Math.min(100, Math.round(100 * state().used / plan().quota));
  const can = f => !!plan()[f];
  // Demo mode is for looking around: nothing is counted there.
  const metered = () => !S().demo;

  class QuotaError extends Error { constructor(kind, action) { super(kind === 'feature' ? 'Kräver en högre plan' : 'Kvoten är slut'); this.kind = kind; this.action = action; } }

  // Check before doing something; count it afterwards with charge().
  function check(action) {
    if (!metered()) return true;
    if ((action === 'live_min') && !can('live')) throw new QuotaError('feature', action);
    if ((action === 'replace_min' || action === 'scan') && !can('replace')) throw new QuotaError('feature', action);
    if (state().used + (COST[action] || 0) > plan().quota + 1e-9) throw new QuotaError('quota', action);
    return true;
  }
  function charge(action, n) {
    if (!metered()) return;
    if (server()) return; // the server counts; numbers come back via serverUsage()
    state().used = Math.round((state().used + (COST[action] || 0) * (n || 1)) * 100) / 100;
    Store.save();
    paintPill();
  }
  function serverUsage(u) {
    const s = state();
    if (u.plan && PLANS[u.plan]) s.id = u.plan;
    if (typeof u.used === 'number') s.used = u.used;
    if (u.period) s.period = u.period;
    Store.save(); paintPill();
  }
  async function refresh() {
    if (!server()) return state();
    try {
      const r = await fetch(server() + '/v1/me', { headers: { authorization: 'Bearer ' + token() } });
      if (r.ok) serverUsage(await r.json());
    } catch (e) { /* offline – keep last known */ }
    return state();
  }
  // Guard used by every AI feature: shows the upgrade sheet and returns false when blocked.
  function allow(action) {
    try { check(action); return true; }
    catch (e) { if (e instanceof QuotaError) { upgradeSheet(e); return false; } throw e; }
  }

  /* ---------------- buying ---------------- */
  async function buy(id) {
    if (id === 'lite') return manage();
    if (server()) {
      try {
        const r = await fetch(server() + '/v1/checkout', { method: 'POST', headers: { 'content-type': 'application/json', authorization: 'Bearer ' + token() }, body: JSON.stringify({ plan: id }) });
        const d = await r.json();
        if (!r.ok || !d.url) throw new Error(d.error || 'HTTP ' + r.status);
        App.toast('Öppnar betalningen… kom tillbaka hit när du är klar 💜', 5000);
        await Platform.openUrl(d.url);
        pollAfterBuy();
      } catch (e) { App.toast('Kunde inte starta betalningen: ' + e.message, 6000); }
      return;
    }
    if (S().testPlans) { state().id = id; Store.save(); paintPill(); App.toast(`TESTLÄGE: ${PLANS[id].name} aktiverad (ingen betalning)`); App.go('#/plans'); return; }
    App.sheet(`<div class="motey-stage">${Mascot.svg({ size: 80, mood: 'worried' })}<div class="speech">Betalningen är inte kopplad än. Den som driver Motey behöver starta Motey-servern med Stripe – se README. Utan server går det att prova planerna i testläge under Mer.</div></div>`);
  }
  async function manage() {
    if (!server()) { if (S().testPlans) { state().id = 'lite'; Store.save(); paintPill(); App.go('#/plans'); } return; }
    try {
      const r = await fetch(server() + '/v1/portal', { method: 'POST', headers: { authorization: 'Bearer ' + token() } });
      const d = await r.json();
      if (d.url) Platform.openUrl(d.url); else App.toast(d.error || 'Ingen prenumeration att hantera');
    } catch (e) { App.toast('Kunde inte nå servern'); }
  }
  let polls = 0;
  function pollAfterBuy() {
    polls = 0;
    const was = state().id;
    const t = setInterval(async () => {
      await refresh();
      if (state().id !== was || ++polls > 60) { clearInterval(t); if (state().id !== was) { App.toast(`🎉 Välkommen till ${plan().name}!`, 5000); App.go('#/plans'); } }
    }, 5000);
    window.addEventListener('focus', () => refresh(), { once: true });
  }

  /* ---------------- UI ---------------- */
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function meter(big) {
    const p = pct();
    const color = p >= 90 ? 'var(--danger)' : p >= 70 ? 'var(--coral)' : 'var(--mint)';
    return `<div class="meter ${big ? 'big' : ''}"><div class="row between"><b>${esc(plan().name)}</b><span>${S().demo ? 'Demo – räknas inte' : p + ' % använt'}</span></div>
      <div class="progress"><i style="width:${S().demo ? 0 : p}%;background:${color}"></i></div>
      ${big && !S().demo ? `<div class="small muted">Nollställs den 1:a varje månad.${server() ? '' : ' Räknas på den här enheten.'}</div>` : ''}</div>`;
  }
  function paintPill() {
    const el = document.getElementById('planpill');
    if (!el) return;
    el.textContent = S().demo ? 'Demo' : `${plan().name.replace('Motey ', '')} · ${pct()} %`;
    el.className = 'planpill ' + plan().id;
  }
  function upgradeSheet(err) {
    const feature = err.kind === 'feature';
    const need = err.action === 'replace_min' || err.action === 'scan' ? 'pro' : 'plus';
    const text = feature
      ? (need === 'pro' ? 'Live Replace finns i Motey Pro. Då pratar en 3D-version av dig i mötet medan du är någon helt annanstans. 🏖️' : 'AI-Live finns inte i Lite. Med Motey Plus byter jag stil på chefen i realtid – med min egen röst!')
      : `Månadens ${plan().name}-kvot är slut (${LABEL[err.action] || 'det här'} behöver lite mer). Uppgradera så fortsätter jag direkt – eller vänta till den 1:a.`;
    const sh = App.sheet(`<div class="motey-stage">${Mascot.svg({ size: 84, mood: 'worried' })}<div class="speech">${esc(text)}</div></div>
      <div style="margin-top:14px">${meter(true)}</div>
      <div class="row" style="margin-top:14px">${['plus', 'pro'].filter(id => PLANS[id].quota > plan().quota || (feature && PLANS[id][need === 'pro' ? 'replace' : 'live'])).map(id => `<button class="btn ${id === need ? '' : 'ghost'}" data-buy="${id}">${PLANS[id].name} – ${PLANS[id].price} kr/mån</button>`).join('')}
      <a class="btn ghost" href="#/plans">Jämför planer</a></div>`);
    sh.el.querySelectorAll('[data-buy]').forEach(b => b.addEventListener('click', () => { sh.close(); buy(b.dataset.buy); }));
    sh.el.querySelector('a').addEventListener('click', () => sh.close());
  }
  function render(v) {
    refresh().then(() => { if (location.hash === '#/plans') { const m = v.querySelector('#meterbox'); if (m) m.innerHTML = meter(true); } });
    const cur = plan().id;
    const feats = {
      lite: ['Möten, samtal och chattar', 'Sammanfattningar, spel och TikTok – med gräns', 'Offline-AI när kvoten räcker', '✗ Ingen AI-Live', '✗ Ingen Live Replace'],
      plus: ['Allt i Lite', '4× så mycket användning', 'AI-Live med Gemini 3.8 Flash Live (5 % per minut)', 'TikTok och spel med Gemini 3.8 Flash', '✗ Ingen Live Replace'],
      pro: ['Allt i Plus', '20× så mycket som Plus', '🏖️ Live Replace – 3D-du pratar i mötet', 'Skanna ditt 3D-ansikte', 'Live-minuter för hela månaden']
    };
    v.innerHTML = `<h1>Prenumeration</h1>
      ${S().demo ? '<div class="demo-banner">👀 I demon räknas ingenting. Börja på riktigt för att använda din plan.</div>' : ''}
      <div class="card" id="meterbox">${meter(true)}</div>
      <div class="plans">${Object.values(PLANS).map(p => `<div class="plan ${p.id} ${p.id === cur ? 'on' : ''}">
        <div class="pname">${p.name}${p.id === 'pro' ? ' <span class="badge brand">3D</span>' : ''}</div>
        <div class="pprice">${p.price ? p.price + ' kr<small>/mån</small>' : 'Gratis'}</div>
        <p class="small muted">${esc(p.blurb)}</p>
        <ul class="clean">${feats[p.id].map(f => `<li data-ico="${f.startsWith('✗') ? '' : '✓'}">${esc(f.replace(/^✗ /, '✗ '))}</li>`).join('')}</ul>
        ${p.id === cur ? '<button class="btn ghost block" disabled>Din plan</button>' : `<button class="btn block ${p.id === 'pro' ? 'coral' : ''}" data-buy="${p.id}">${p.price ? (PLANS[cur].price > p.price ? 'Byt till ' : 'Uppgradera till ') + p.name.replace('Motey ', '') : 'Byt till Lite'}</button>`}
      </div>`).join('')}</div>
      <div class="card"><h3>Vad saker kostar</h3><p class="small muted">I procent av månadens kvot för varje plan.</p>
        <table class="cost"><tr><th></th><th>Lite</th><th>Plus</th><th>Pro</th></tr>
        ${Object.keys(COST).map(k => `<tr><td>${LABEL[k]}</td>${['lite', 'plus', 'pro'].map(id => {
          const P = PLANS[id];
          const ok = !(k === 'live_min' && !P.live) && !((k === 'replace_min' || k === 'scan') && !P.replace);
          const v = 100 * COST[k] / P.quota;
          return `<td>${ok ? (v < 0.1 ? '<0,1' : String(Math.round(v * 10) / 10).replace('.', ',')) + ' %' : '–'}</td>`;
        }).join('')}</tr>`).join('')}</table></div>
      ${server() ? '<button class="btn ghost" id="manage">Hantera prenumeration</button>' : ''}`;
    v.querySelectorAll('[data-buy]').forEach(b => b.addEventListener('click', () => buy(b.dataset.buy)));
    const mg = v.querySelector('#manage'); if (mg) mg.addEventListener('click', manage);
  }

  window.Plans = { PLANS, COST, LABEL, plan, pct, can, check, charge, allow, refresh, serverUsage, token, buy, manage, render, meter, paintPill, upgradeSheet, QuotaError, state };
})();

</script>
<script>
/* Motey Chattar – real text messages between people, inside Motey.
 * Works on MoteyNet rooms; in demo mode a local chat with Motey is shown instead. */
(function () {
  'use strict';
  const $ = (s, el) => (el || document).querySelector(s);
  const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const isDemo = () => Store.settings.demo;
  let offs = [];
  const cleanup = () => { offs.forEach(f => f()); offs = []; };

  const time = at => {
    const d = new Date(at), now = new Date();
    return d.toDateString() === now.toDateString() ? d.toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit' })
      : d.toLocaleDateString('sv-SE', { day: 'numeric', month: 'short' });
  };
  const initials = n => String(n || '?').trim().split(/\s+/).map(x => x[0]).slice(0, 2).join('').toUpperCase();
  function avatar(name, color, kind) {
    if (kind === 'meeting') return '<span class="avatar" style="background:#FFE6DC">📅</span>';
    if (kind === 'motey') return `<span class="avatar" style="background:#EDE7FF">${Mascot.svg({ size: 30, animate: false })}</span>`;
    return `<span class="avatar" style="background:${esc(color || '#6C4CF5')};color:#fff">${esc(initials(name))}</span>`;
  }
  function lastMsg(r) {
    const a = MoteyNet.messages(r.id).filter(m => ['msg', 'file', 'tr', 'next'].includes(m.t));
    return a[a.length - 1];
  }
  function statusPill() {
    const s = MoteyNet.status();
    const ok = s.online > 0;
    return `<span class="badge ${ok ? 'ok' : 'warn'}" id="netpill" title="${esc(s.relays.map(r => r.url + ': ' + r.status).join('\n'))}">${ok ? '●' : '○'} ${ok ? 'Ansluten' : 'Ansluter…'} ${s.online}/${s.total}</span>`;
  }

  /* ---------------- chat list ---------------- */
  function renderList(v, ui) {
    if (isDemo()) return renderDemo(v, ui);
    const rs = MoteyNet.rooms().slice().sort((a, b) => ((lastMsg(b) || {}).at || b.created) - ((lastMsg(a) || {}).at || a.created));
    v.innerHTML = `<div class="row between"><h1 style="margin:0">💬 Chattar</h1>${statusPill()}</div>
      <p class="muted">Meddelanden och möten med riktiga människor – krypterade, bara ni som har inbjudan kan läsa.</p>
      <div class="row" style="margin-bottom:14px"><button class="btn" id="newchat">＋ Ny chatt</button><button class="btn ghost" id="joinchat">🔗 Gå med med kod</button></div>
      <div id="rooms">${rs.map(r => {
        const l = lastMsg(r);
        const prev = !l ? '<i>Inga meddelanden än</i>' : l.t === 'file' ? '📎 ' + esc(l.fname) : l.t === 'tr' ? '🎙️ ' + esc(l.text) : esc((l.mine ? 'Du: ' : (l.name ? l.name + ': ' : '')) + (l.text || ''));
        return `<div class="meeting chatrow" data-id="${r.id}" role="button" tabindex="0">${avatar(r.name, '#6C4CF5', r.kind)}
          <div class="info"><div class="row between"><div class="t">${esc(r.name)}</div><small class="muted">${l ? time(l.at) : ''}</small></div>
          <div class="small muted prev">${prev}</div></div>${r.unread ? `<span class="unread">${r.unread}</span>` : ''}</div>`;
      }).join('') || `<div class="card empty">${Mascot.svg({ size: 90 })}<p><b>Inga chattar än.</b></p><p class="small muted">Starta en chatt och skicka inbjudan till någon – eller klistra in en kod du har fått.</p></div>`}</div>`;
    $$('.chatrow', v).forEach(el => el.addEventListener('click', () => App.go('#/chat/' + el.dataset.id)));
    $('#newchat', v).addEventListener('click', () => newChatSheet());
    $('#joinchat', v).addEventListener('click', () => joinSheet());
    offs.push(MoteyNet.on('message', () => renderList(v, ui)), MoteyNet.on('rooms', () => renderList(v, ui)),
      MoteyNet.on('status', () => { const p = $('#netpill', v); if (p) p.outerHTML = statusPill(); }));
  }

  function newChatSheet() {
    const sh = App.sheet(`<h2>Ny chatt</h2><label class="field"><span>Namn på chatten</span><input type="text" id="cn" placeholder="t.ex. Projekt Nova eller Lisa"></label>
      <button class="btn block" id="cgo">Skapa och bjud in</button>`);
    $('#cn', sh.el).focus();
    $('#cgo', sh.el).addEventListener('click', async () => {
      const r = await MoteyNet.createRoom({ name: $('#cn', sh.el).value.trim() || 'Chatt', kind: 'chat' });
      sh.close(); App.go('#/chat/' + r.id); inviteSheet(r);
    });
  }

  function joinSheet(prefill) {
    const sh = App.sheet(`<h2>Gå med</h2><p class="muted small">Klistra in inbjudan (koden eller länken) som du har fått.</p>
      <label class="field"><span>Inbjudan</span><textarea id="jc" style="min-height:80px" placeholder="M1…">${esc(prefill || '')}</textarea></label>
      <button class="btn block" id="jgo">Gå med</button><p class="small" id="jerr" style="color:var(--danger)"></p>`);
    $('#jgo', sh.el).addEventListener('click', async () => {
      try {
        const r = await MoteyNet.join($('#jc', sh.el).value);
        sh.close(); App.toast('Du är med! 🎉');
        App.go(r.kind === 'meeting' && r.meta ? '#/m/r-' + r.id : '#/chat/' + r.id);
      } catch (e) { $('#jerr', sh.el).textContent = e.message; }
    });
  }

  function inviteSheet(r) {
    const code = MoteyNet.inviteCode(r), link = MoteyNet.inviteLink(r);
    const what = r.kind === 'meeting' ? `mötet "${r.name}"` : `chatten "${r.name}"`;
    const text = `Hej! Gå med i ${what} i Motey 💬\n\n1. Öppna länken (eller appen Motey → Gå med)\n${link}\n\n2. Eller klistra in koden i Motey:\n${code}`;
    const sh = App.sheet(`<div class="motey-stage">${Mascot.svg({ size: 70, mood: 'wink' })}<div class="speech">Skicka inbjudan till dem som ska vara med. Alla som har koden kan läsa ${r.kind === 'meeting' ? 'mötet' : 'chatten'} – dela den bara med rätt personer.</div></div>
      <label class="field" style="margin-top:14px"><span>Kod</span><input type="text" readonly value="${esc(code)}" id="ic"></label>
      <div class="row"><button class="btn" id="icopy">📋 Kopiera inbjudan</button><button class="btn ghost" id="ishare">📤 Dela</button><button class="btn ghost" id="imail">✉️ E-post</button><button class="btn ghost" id="isms">💬 SMS</button></div>`);
    $('#ic', sh.el).addEventListener('focus', e => e.target.select());
    $('#icopy', sh.el).addEventListener('click', async () => App.toast(await Platform.copy(text) ? 'Inbjudan kopierad 📋' : 'Markera koden och kopiera den'));
    $('#ishare', sh.el).addEventListener('click', () => Platform.share(text, 'Motey-inbjudan'));
    $('#imail', sh.el).addEventListener('click', () => Platform.openUrl(`mailto:?subject=${encodeURIComponent('Inbjudan till ' + r.name + ' i Motey')}&body=${encodeURIComponent(text)}`));
    $('#isms', sh.el).addEventListener('click', () => Platform.openUrl('sms:?&body=' + encodeURIComponent(text)));
  }

  /* ---------------- one conversation ---------------- */
  function bubble(m, r) {
    const who = esc(m.name || 'Någon');
    if (m.t === 'hello') return `<div class="sysmsg">👋 ${m.mine ? 'Du' : who} gick med</div>`;
    if (m.t === 'call') return `<div class="sysmsg">📞 ${m.mine ? 'Du' : who} gick med i samtalet</div>`;
    if (m.t === 'meta') return `<div class="sysmsg">📅 ${who} ${m.meta && m.meta.title ? 'planerade ”' + esc(m.meta.title) + '” ' + esc(new Date(m.meta.start).toLocaleString('sv-SE', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })) : 'uppdaterade mötet'}</div>`;
    if (m.t === 'next') return `<div class="sysmsg">📅 ${esc(m.text || 'Nästa möte är bokat')} – du är inbjuden automatiskt.</div>`;
    if (m.t === 'tr') return `<div class="trmsg">🎙️ <b>${who}:</b> ${esc(m.text)}</div>`;
    const body = m.t === 'file'
      ? `<button class="filemsg" data-fid="${esc(m.fid)}" data-name="${esc(m.fname)}">📎 <span><b>${esc(m.fname)}</b><br><small>${Math.max(1, Math.round((m.size || 0) / 1024))} kB · tryck för att spara</small></span></button>`
      : esc(m.text).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/\n/g, '<br>');
    const col = (r.members[m.pk] || {}).color || '#6C4CF5';
    return `<div class="msg ${m.mine ? 'mine' : ''}">${m.mine ? '' : `<div class="from" style="color:${esc(col)}">${who}</div>`}<div class="bub">${body}</div><div class="when">${time(m.at)}</div></div>`;
  }

  function mountRoom(container, roomId, opts) {
    opts = opts || {};
    const r = MoteyNet.room(roomId);
    if (!r) { container.innerHTML = '<p class="muted">Chatten finns inte längre.</p>'; return () => {}; }
    container.innerHTML = `<div class="msgs ${opts.compact ? 'compact' : ''}" id="msgs"></div>
      <div class="composer"><label class="icon-btn" title="Skicka fil">📎<input type="file" id="cf" hidden></label>
      <textarea id="ct" rows="1" placeholder="Skriv ett meddelande…"></textarea><button class="btn" id="cs" aria-label="Skicka">➤</button></div>`;
    const list = $('#msgs', container);
    const draw = () => {
      const a = MoteyNet.messages(r.id).filter(m => m.t !== 'chunk');
      list.innerHTML = a.map(m => bubble(m, r)).join('') || '<p class="muted small" style="text-align:center">Säg hej! 👋</p>';
      list.scrollTop = list.scrollHeight;
      $$('.filemsg', list).forEach(b => b.addEventListener('click', () => downloadFile(b.dataset.fid, b.dataset.name)));
      r.lastRead = Date.now(); r.unread = 0; Store.save();
    };
    draw();
    const ta = $('#ct', container);
    const sendNow = async () => {
      const t = ta.value.trim(); if (!t) return;
      ta.value = ''; ta.style.height = '';
      await MoteyNet.sendText(r.id, t);
    };
    $('#cs', container).addEventListener('click', sendNow);
    ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendNow(); } });
    ta.addEventListener('input', () => { ta.style.height = 'auto'; ta.style.height = Math.min(140, ta.scrollHeight) + 'px'; });
    $('#cf', container).addEventListener('change', async e => {
      const f = e.target.files[0]; if (!f) return;
      try { App.toast('Skickar ' + f.name + '…'); await MoteyNet.sendFile(r.id, f, f.name); App.toast('📎 Skickad'); }
      catch (err) { App.toast(err.message, 5000); }
      e.target.value = '';
    });
    const off = MoteyNet.on('message', (room) => { if (room.id === r.id) draw(); });
    return off;
  }

  async function downloadFile(fid, name) {
    const f = await MoteyNet.files.get(fid);
    if (!f) return App.toast('Filen har inte kommit fram än');
    if (f.missing) return App.toast(`Hämtar filen… (${f.have}/${f.meta.n})`);
    App.toast(await Platform.saveFile(name || f.meta.name, f.blob));
  }

  function renderRoom(v, id, ui) {
    if (isDemo()) return renderDemo(v, ui);
    const r = MoteyNet.room(id);
    if (!r) return App.go('#/chat');
    const n = Object.keys(r.members).length;
    v.innerHTML = `<div class="chat-head"><a href="#/chat" class="btn sm ghost">‹</a>${avatar(r.name, '#6C4CF5', r.kind)}
      <div style="flex:1;min-width:0"><div class="t">${esc(r.name)}</div><div class="small muted">${n} ${n === 1 ? 'person' : 'personer'} · ${Object.values(r.members).map(m => esc(m.name)).filter(Boolean).slice(0, 4).join(', ')}</div></div>
      <button class="icon-btn" id="call" title="Ring">📞</button><button class="icon-btn" id="inv" title="Bjud in">🔗</button><button class="icon-btn" id="more" title="Mer">⋯</button></div>
      ${r.kind === 'meeting' && r.meta ? `<a class="card" href="#/m/r-${r.id}" style="display:block;text-decoration:none;color:inherit;padding:10px 14px;margin:8px 0">📅 <b>${esc(r.meta.title)}</b> · ${esc(new Date(r.meta.start).toLocaleString('sv-SE', { weekday: 'long', hour: '2-digit', minute: '2-digit' }))} <span class="muted">– öppna mötet ›</span></a>` : ''}
      <div id="room"></div>`;
    $('#call', v).addEventListener('click', () => App.go('#/call/' + r.id));
    $('#inv', v).addEventListener('click', () => inviteSheet(r));
    $('#more', v).addEventListener('click', () => {
      const sh = App.sheet(`<h2>${esc(r.name)}</h2>
        <button class="btn ghost block" id="sum">✨ Motey, sammanfatta chatten</button><br><br>
        ${r.kind !== 'meeting' ? '<label class="field"><span>Byt namn</span><input type="text" id="rn" value="' + esc(r.name) + '"></label><button class="btn ghost block" id="rsave">Spara namn</button><br><br>' : ''}
        <button class="btn block" style="background:var(--danger)" id="leave">Lämna ${r.kind === 'meeting' ? 'mötet' : 'chatten'}</button>`);
      $('#sum', sh.el).addEventListener('click', async () => {
        const pseudo = { id: 'chat-' + r.id, title: r.name, attendees: Object.values(r.members).map(m => m.name), transcript: MoteyNet.messages(r.id).filter(m => m.t === 'msg' || m.t === 'tr').map(m => ({ who: m.name, text: m.text })), files: [] };
        let s; try { s = (await AI.summarize(pseudo, { charge: true })).value; } catch (e) { sh.close(); return; }
        sh.close();
        const s2 = App.sheet(`<div id="sumb"></div>`);
        App.moteySays($('#sumb', s2.el), s.summary + (s.actions.length ? ' Att göra: ' + s.actions.map(a => a.who + ' – ' + a.what).join('; ') : ''));
      });
      const rs = $('#rsave', sh.el);
      if (rs) rs.addEventListener('click', () => { r.name = $('#rn', sh.el).value.trim() || r.name; Store.save(); sh.close(); renderRoom(v, id, ui); });
      $('#leave', sh.el).addEventListener('click', () => { if (confirm('Lämna och ta bort från den här enheten?')) { sh.close(); MoteyNet.leave(r.id); App.go('#/chat'); } });
    });
    offs.push(mountRoom($('#room', v), r.id));
    // the meeting info (name, time) can arrive after the chat is opened
    const sig = r.name + r.kind;
    offs.push(MoteyNet.on('rooms', () => { if (location.hash === '#/chat/' + id && r.name + r.kind !== sig) { cleanup(); renderRoom(v, id, ui); } }));
  }

  /* ---------------- demo ---------------- */
  const demoLog = [];
  function renderDemo(v) {
    if (!demoLog.length) {
      const n = AI.firstName(Store.settings.bossName || 'Birgitta');
      demoLog.push({ who: n, text: `Hej ${AI.firstName(Store.settings.name)}! Hann du titta på budgeten?`, at: Date.now() - 36e5 },
        { who: 'Du', mine: true, text: 'Inte än, jag missade mötet 😅', at: Date.now() - 35e5 },
        { who: 'Motey', motey: true, text: 'Lugn! Jag har sammanfattat mötet åt dig. Tryck på 👀 på Hem så berättar jag allt.', at: Date.now() - 34e5 });
    }
    v.innerHTML = `<div class="card hero" style="padding:14px">${Mascot.svg({ size: 64 })}<div style="flex:1"><b>Det här är demon.</b><div class="small muted">Riktiga chattar och möten med andra människor startar du med ett klick.</div></div><button class="btn ghost sm" id="goreal">Börja på riktigt</button></div>
      <div class="chat-head">${avatar('', '', 'motey')}<div style="flex:1"><div class="t">Projekt Nova (demo)</div><div class="small muted">Birgitta, Motey och du</div></div></div>
      <div class="msgs" id="msgs"></div>
      <div class="composer"><textarea id="ct" rows="1" placeholder="Skriv något – Motey svarar"></textarea><button class="btn" id="cs">➤</button></div>`;
    const draw = () => {
      $('#msgs', v).innerHTML = demoLog.map(m => `<div class="msg ${m.mine ? 'mine' : ''}">${m.mine ? '' : `<div class="from">${esc(m.who)}</div>`}<div class="bub">${esc(m.text)}</div><div class="when">${time(m.at)}</div></div>`).join('');
      $('#msgs', v).scrollTop = 1e9;
    };
    draw();
    const send = async () => {
      const t = $('#ct', v).value.trim(); if (!t) return;
      $('#ct', v).value = '';
      demoLog.push({ who: 'Du', mine: true, text: t, at: Date.now() }); draw();
      const r = await AI.ask(t, Store.meeting('fin-1'));
      setTimeout(() => { demoLog.push({ who: 'Motey', motey: true, text: r.value, at: Date.now() }); if (document.body.contains(v)) draw(); }, 600);
    };
    $('#cs', v).addEventListener('click', send);
    $('#ct', v).addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
    $('#goreal', v).addEventListener('click', () => App.goReal());
  }

  window.ChatMode = {
    render(v, id, ui) { cleanup(); return id ? renderRoom(v, id, ui) : renderList(v, ui); },
    destroy: cleanup, mountRoom, inviteSheet, joinSheet, downloadFile, avatar
  };
})();

</script>
<script>
/* Motey samtal – video and voice calls straight between devices (WebRTC mesh,
 * up to ~6 people). The encrypted handshake goes through MoteyNet signals.
 * Rule that avoids both sides calling at once: of every pair, the device
 * with the larger key makes the offer. */
(function () {
  'use strict';
  const $ = (s, el) => (el || document).querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let session = null;

  function iceServers() {
    const s = Store.settings;
    const list = [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun.cloudflare.com:3478'] }];
    if (s.turnUrl) list.push({ urls: s.turnUrl.split(/\s+/).filter(Boolean), username: s.turnUser || undefined, credential: s.turnPass || undefined });
    return list;
  }
  const gathered = pc => new Promise(res => {
    if (pc.iceGatheringState === 'complete') return res();
    const h = () => { if (pc.iceGatheringState === 'complete') { pc.removeEventListener('icegatheringstatechange', h); res(); } };
    pc.addEventListener('icegatheringstatechange', h);
    setTimeout(res, 2500);
  });

  async function render(v, roomId, ui) {
    if (Store.settings.demo) return renderDemo(v);
    const r = MoteyNet.room(roomId);
    if (!r) return App.go('#/chat');
    const meeting = Store.meeting('r-' + r.id);
    v.innerHTML = `<div class="call">
      <div class="call-top"><a class="btn sm ghost" href="${meeting ? '#/m/' + meeting.id : '#/chat/' + r.id}" id="back">‹</a>
        <div style="flex:1;min-width:0"><b>${esc(r.name)}</b><div class="small muted" id="cstat">Startar kamera…</div></div>
        <span class="badge" id="ccount">1</span></div>
      <div class="tiles" id="tiles"></div>
      <div class="captions hidden" id="caps"></div>
      <div class="call-bar">
        <button class="cbtn" id="mic" title="Mikrofon">🎤</button>
        <button class="cbtn" id="cam" title="Kamera">📷</button>
        <button class="cbtn" id="scr" title="Dela skärm">🖥️</button>
        <button class="cbtn" id="notes" title="Motey antecknar">📝</button>
        <button class="cbtn" id="restyle" title="AI-Live: byt stil på någon">🎭</button>
        <button class="cbtn" id="replace" title="Live Replace (Pro)">🏖️</button>
        <button class="cbtn" id="chat" title="Chatt">💬</button>
        <button class="cbtn end" id="end" title="Lämna">✆</button>
      </div>
      <div class="call-chat hidden" id="cchat"></div>
      <div class="replace-panel hidden" id="rpanel"></div>
    </div>`;
    const s = session = { r, pk: (await MoteyNet.roomSigner(r)).pk, peers: new Map(), local: null, alive: true, rec: null, offs: [], out: {} };
    // what we send: normally camera + microphone; Live Replace swaps in the 3D head and Gemini's voice
    const outgoing = () => new MediaStream([s.out.audio || s.local.getAudioTracks()[0], s.out.video || (s.screen && s.screen.getVideoTracks()[0]) || s.local.getVideoTracks()[0]].filter(Boolean));
    s.outgoing = outgoing;
    const status = t => { const e = $('#cstat', v); if (e) e.textContent = t; };
    const count = () => { const e = $('#ccount', v); if (e) e.textContent = (1 + [...s.peers.values()].filter(p => p.connected).length) + ' i samtalet'; };

    // local media: video+audio, else audio only, else listen-only
    try { s.local = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true }, video: { width: { ideal: 640 }, height: { ideal: 360 }, facingMode: 'user' } }); }
    catch (e) {
      try { s.local = await navigator.mediaDevices.getUserMedia({ audio: true }); ui.toast('Ingen kamera – du är med med ljud'); }
      catch (e2) { s.local = new MediaStream(); ui.toast('Mikrofon och kamera är blockerade – du kan lyssna och se'); }
    }
    if (!s.alive) return stopLocal(s);
    tile('me', MoteyNet.me().name + ' (du)', s.local, true);
    status('Väntar på de andra… dela inbjudan om ingen är här.');

    function tile(id, name, stream, self) {
      let t = $('#t-' + id, v);
      if (!t) {
        t = document.createElement('div'); t.className = 'tile' + (self ? ' self' : ''); t.id = 't-' + id;
        t.innerHTML = `<video autoplay playsinline ${self ? 'muted' : ''}></video><div class="tname">${esc(name)}</div><div class="tav">${esc(String(name)[0] || '?').toUpperCase()}</div>`;
        $('#tiles', v).appendChild(t);
      }
      const vid = $('video', t);
      if (vid.srcObject !== stream) vid.srcObject = stream;
      const hasVideo = stream && stream.getVideoTracks().some(x => x.readyState === 'live' && x.enabled);
      t.classList.toggle('novideo', !hasVideo);
      vid.play().catch(() => {});
      layout();
      return t;
    }
    function layout() { const n = $('#tiles', v).children.length; $('#tiles', v).dataset.n = Math.min(n, 6); }

    function peer(pk, name) {
      let p = s.peers.get(pk);
      if (!p) { p = { pk, name: name || 'Någon', pc: null, sid: null, seen: Date.now(), connected: false }; s.peers.set(pk, p); }
      if (name) p.name = name;
      p.seen = Date.now();
      return p;
    }
    function newPc(p) {
      if (p.pc) try { p.pc.close(); } catch (e) { /* closed */ }
      const pc = new RTCPeerConnection({ iceServers: iceServers() });
      p.pc = pc; p.connected = false; p.started = Date.now();
      const outS = outgoing(); outS.getTracks().forEach(t => pc.addTrack(t, outS));
      // make sure we can receive even if we send nothing
      if (!s.local.getAudioTracks().length) pc.addTransceiver('audio', { direction: 'recvonly' });
      if (!s.local.getVideoTracks().length) pc.addTransceiver('video', { direction: 'recvonly' });
      const remote = new MediaStream();
      p.remote = remote;
      pc.ontrack = e => { remote.addTrack(e.track); e.track.onunmute = () => tile(p.pk, p.name, remote); tile(p.pk, p.name, remote); if (e.track.kind === 'audio' && s.onRemoteAudio) s.onRemoteAudio(p, remote); };
      pc.onconnectionstatechange = () => {
        if (pc !== p.pc) return;
        p.connected = pc.connectionState === 'connected';
        if (p.connected) status('Ansluten 🎉');
        if (pc.connectionState === 'failed') { status('Anslutningen bröts – försöker igen…'); if (s.pk > p.pk) setTimeout(() => offer(p), 1500); }
        count();
      };
      return pc;
    }
    async function offer(p) {
      if (!s.alive) return;
      p.sid = Math.random().toString(36).slice(2);
      const pc = newPc(p);
      await pc.setLocalDescription(await pc.createOffer());
      await gathered(pc);
      MoteyNet.signal(r.id, { t: 'rtc', type: 'offer', to: p.pk, sid: p.sid, sdp: pc.localDescription.sdp });
    }
    async function answer(p, msg) {
      p.sid = msg.sid;
      const pc = newPc(p);
      await pc.setRemoteDescription({ type: 'offer', sdp: msg.sdp });
      await pc.setLocalDescription(await pc.createAnswer());
      await gathered(pc);
      MoteyNet.signal(r.id, { t: 'rtc', type: 'answer', to: p.pk, sid: p.sid, sdp: pc.localDescription.sdp });
    }
    const needsOffer = p => s.pk > p.pk && (!p.pc || ['failed', 'closed'].includes(p.pc.connectionState) || (!p.connected && Date.now() - p.started > 15000));

    s.offs.push(MoteyNet.on('signal', async (room, m) => {
      if (room.id !== r.id || m.t !== 'rtc' || !s.alive) return;
      const p = peer(m.pk, m.name);
      try {
        if (m.type === 'join' || m.type === 'here') {
          if (m.type === 'join') MoteyNet.signal(r.id, { t: 'rtc', type: 'here', to: m.pk });
          if (needsOffer(p)) await offer(p);
        } else if (m.type === 'offer') await answer(p, m);
        else if (m.type === 'answer' && m.sid === p.sid && p.pc && p.pc.signalingState === 'have-local-offer') await p.pc.setRemoteDescription({ type: 'answer', sdp: m.sdp });
        else if (m.type === 'bye') drop(p.pk);
      } catch (e) { console.warn('rtc', e); }
    }));
    function drop(pk) {
      const p = s.peers.get(pk); if (!p) return;
      try { p.pc && p.pc.close(); } catch (e) { /* closed */ }
      s.peers.delete(pk);
      const t = $('#t-' + pk, v); if (t) t.remove();
      layout(); count();
    }

    // announce, then keep saying "here" so late joiners find us
    MoteyNet.signal(r.id, { t: 'rtc', type: 'join' });
    MoteyNet.send(r.id, { t: 'call' });
    if (meeting) { meeting.attended = true; Store.save(); }
    s.beat = setInterval(() => {
      MoteyNet.signal(r.id, { t: 'rtc', type: 'here' });
      for (const p of s.peers.values()) {
        if (Date.now() - p.seen > 35000) drop(p.pk);
        else if (needsOffer(p)) offer(p);
      }
    }, 8000);

    /* ---------- controls ---------- */
    const toggle = (kind, btn) => {
      const tr = s.local[kind === 'audio' ? 'getAudioTracks' : 'getVideoTracks']();
      if (!tr.length) return ui.toast(kind === 'audio' ? 'Ingen mikrofon' : 'Ingen kamera');
      const on = !tr[0].enabled; tr.forEach(t => { t.enabled = on; });
      btn.classList.toggle('off', !on);
      if (kind === 'video') tile('me', MoteyNet.me().name + ' (du)', s.local, true);
    };
    $('#mic', v).addEventListener('click', e => toggle('audio', e.currentTarget));
    $('#cam', v).addEventListener('click', e => toggle('video', e.currentTarget));
    const scr = $('#scr', v);
    if (!navigator.mediaDevices.getDisplayMedia) scr.classList.add('hidden');
    scr.addEventListener('click', async () => {
      if (s.screen) return stopScreen();
      try {
        s.screen = await navigator.mediaDevices.getDisplayMedia({ video: true });
        const track = s.screen.getVideoTracks()[0];
        if (s.replace) { s.screen.getTracks().forEach(t => t.stop()); s.screen = null; return ui.toast('Stäng av Live Replace först'); }
        swapVideo(track); scr.classList.add('on');
        track.onended = stopScreen;
      } catch (e) { s.screen = null; }
    });
    function stopScreen() {
      if (!s.screen) return;
      s.screen.getTracks().forEach(t => t.stop()); s.screen = null; scr.classList.remove('on');
      swapVideo(s.local.getVideoTracks()[0] || null);
    }
    function swapVideo(track) {
      for (const p of s.peers.values()) if (p.pc) p.pc.getTransceivers().filter(x => x.receiver.track.kind === 'video').forEach(x => x.sender.replaceTrack(track).catch(() => {}));
      const preview = new MediaStream([...s.local.getAudioTracks(), ...(track ? [track] : [])]);
      tile('me', MoteyNet.me().name + ' (du)', preview, true);
    }
    // Motey takes notes: speech → text → shared transcript of the meeting
    const notes = $('#notes', v);
    if (!Platform.recognizer()) notes.title = 'Motey antecknar (stöds inte i den här webbläsaren – skriv i chatten i stället)';
    notes.addEventListener('click', () => {
      if (s.rec) { const x = s.rec; s.rec = null; x.stop(); notes.classList.remove('on'); $('#caps', v).classList.add('hidden'); return; }
      const rec = Platform.recognizer();
      if (!rec) return ui.toast('Den här enheten kan inte göra tal till text. Skriv i chatten så hamnar det i protokollet.', 5000);
      rec.interimResults = true;
      rec.onresult = e => {
        const res = e.results[e.results.length - 1];
        $('#caps', v).textContent = res[0].transcript;
        if (res.isFinal && res[0].transcript.trim()) MoteyNet.sendTranscript(r.id, res[0].transcript.trim());
      };
      rec.onend = () => { if (s.rec === rec) try { rec.start(); } catch (e) { /* running */ } };
      rec.onerror = ev => { if (ev.error === 'not-allowed') { s.rec = null; notes.classList.remove('on'); ui.toast('Mikrofonen är blockerad för tal till text'); } };
      try { rec.start(); s.rec = rec; notes.classList.add('on'); $('#caps', v).classList.remove('hidden'); ui.toast('📝 Motey antecknar – allt sagt hamnar i mötesprotokollet'); }
      catch (e) { ui.toast('Kunde inte starta tal till text'); }
    });
    /* ---------- AI-Live in the call: hear someone in another style ---------- */
    $('#restyle', v).addEventListener('click', () => {
      if (s.styler) return stopStyler();
      if (!Plans.allow('live_min')) return;
      if (!AI.hasKey()) return ui.toast('AI-Live behöver Gemini – koppla under Mer → AI', 5000);
      const people = [...s.peers.values()].filter(p => p.remote);
      if (!people.length) return ui.toast('Ingen annan är med i samtalet än');
      const sh = App.sheet(`<h2>🎭 Byt stil på någon</h2><p class="muted small">Du hör Motey säga samma sak i stället för personen – bara du, de andra märker inget. Gemini 3.8 Flash Live.</p>
        <p class="small muted">Vem?</p><div class="row" id="rp">${people.map((p, i) => `<span class="chip ${i ? '' : 'on'}" data-pk="${p.pk}">${esc(p.name)}</span>`).join('')}</div>
        <p class="small muted" style="margin-top:12px">Stil</p><div class="row" id="rs">${Object.entries(AI.STYLES).map(([k, x]) => `<span class="chip ${k === (Store.settings.liveStyle || 'snall') ? 'on' : ''}" data-s="${k}">${x.icon} ${x.name}</span>`).join('')}</div>
        <button class="btn block" id="rgo" style="margin-top:14px">Starta</button>`);
      const pickOne = sel => sh.el.querySelectorAll(sel + ' .chip').forEach(c => c.addEventListener('click', () => sh.el.querySelectorAll(sel + ' .chip').forEach(x => x.classList.toggle('on', x === c))));
      pickOne('#rp'); pickOne('#rs');
      $('#rgo', sh.el).addEventListener('click', async () => {
        const p = s.peers.get($('#rp .chip.on', sh.el).dataset.pk), style = $('#rs .chip.on', sh.el).dataset.s;
        Store.settings.liveStyle = style; Store.save(); sh.close();
        const vid = $('#t-' + p.pk + ' video', v); if (vid) vid.muted = true;
        const caps = $('#caps', v); caps.classList.remove('hidden'); caps.textContent = `🎭 ${p.name} i stilen ${AI.STYLES[style].name}…`;
        let out = '';
        const sess = LiveMode.liveSession({
          system: AI.liveInstruction(style, p.name), voice: Store.settings.liveVoice || 'Puck',
          onOut: t => { caps.textContent = '🎭 ' + t; }, onIn: () => {}, onTurn: (i, o) => { out = o; },
          onTalking: () => {}, onError: e => { if (!(e instanceof Plans.QuotaError)) ui.toast('AI-Live: ' + e.message); stopStyler(); }
        });
        try { if (!(await sess.open())) return; } catch (e) { ui.toast('Kunde inte starta AI-Live: ' + e.message); if (vid) vid.muted = false; return; }
        const cap = Gemini.pcmCapture([p.remote], b64 => sess.live && !sess.live.closed && sess.live.audio(b64));
        s.styler = { sess, cap, vid, pk: p.pk };
        $('#restyle', v).classList.add('on');
      });
    });
    function stopStyler() {
      const x = s.styler; s.styler = null; if (!x) return;
      x.cap.stop(); x.sess.close(); if (x.vid) x.vid.muted = false;
      $('#restyle', v).classList.remove('on'); if (!s.rec) $('#caps', v).classList.add('hidden');
    }
    s.stopStyler = stopStyler;

    /* ---------- Live Replace (Pro): a 3D you talks in the meeting ---------- */
    $('#replace', v).addEventListener('click', () => s.replace ? stopReplace() : startReplace());
    async function startReplace() {
      if (!Plans.allow('replace_min')) return;
      if (!Avatar.hasFace()) { ui.toast('Skanna ditt 3D-ansikte först (tar en halv minut)', 5000); return App.go('#/scan'); }
      if (!AI.hasKey()) return ui.toast('Live Replace behöver Gemini – koppla under Mer → AI', 5000);
      const me = MoteyNet.me().name, St = Store.settings;
      const sofar = MoteyNet.messages(r.id).filter(m => (m.t === 'msg' || m.t === 'tr') && m.text).slice(-40).map(m => `${m.name}: ${m.text}`).join('\n');
      const head = Avatar.createHead(Avatar.load(), { width: 640, height: 360 });
      await head.ready;
      const player = Gemini.pcmPlayer({ speakers: !!St.replaceHear });
      head.setLevel(() => player.level());
      let inp = '', out = '';
      const panel = $('#rpanel', v);
      const live = new Gemini.Live({
        action: 'replace', modality: 'AUDIO', voice: St.replaceVoice || 'Charon',
        system: `Du är ${me}s digitala 3D-tvilling i videomötet "${r.name}". ${me} är inte vid datorn just nu, så du pratar som ${me} – i första person, på svenska, kort och naturligt (en eller två meningar). ` +
          `Det du hör är de andra i mötet. Svara bara när någon pratar till ${me} eller frågar alla; annars är du tyst. Lova inget och hitta inte på siffror – säg att du återkommer om du inte vet. ` +
          `Om någon frågar om du är en AI svarar du ärligt att du är ${me}s AI-tvilling i Motey. Meddelanden som börjar med [Från ${me}] är instruktioner från riktiga ${me} – följ dem.\n\n` +
          `Det här vet du: ${St.replaceNotes || '(inget särskilt)'}\n\nMötet hittills:\n${sofar || '(inget än)'}`,
        onAudio: (d, m) => player.play(d, m),
        onInterrupt: () => player.flush(),
        onIn: t => { inp += t; },
        onText: t => { out += t; const e = $('#r-said', v); if (e) e.textContent = out; },
        onTurn: () => {
          if (inp.trim()) MoteyNet.sendTranscript(r.id, 'Mötet: ' + inp.trim());
          if (out.trim()) MoteyNet.sendTranscript(r.id, out.trim() + ' (3D-tvilling)');
          inp = ''; out = '';
        },
        onError: e => { ui.toast('Live Replace: ' + e.message, 5000); stopReplace(); }
      });
      try { await live.open(); } catch (e) { head.destroy(); player.close(); return ui.toast('Kunde inte starta Gemini Live: ' + e.message, 6000); }
      Plans.charge('replace_min');
      const minute = setInterval(() => { try { Plans.check('replace_min'); Plans.charge('replace_min'); } catch (e) { stopReplace(); Plans.upgradeSheet(e); } }, 60000);
      const cap = Gemini.pcmCapture([...s.peers.values()].map(p => p.remote).filter(Boolean), b64 => !live.closed && live.audio(b64));
      s.onRemoteAudio = (p, st) => cap.add(st);
      let raf = 0; const loop = () => { head.frame(); raf = requestAnimationFrame(loop); }; loop();
      const vt = head.canvas.captureStream(25).getVideoTracks()[0];
      const at = player.stream && player.stream.getAudioTracks()[0];
      s.out = { audio: at, video: vt };
      swapTracks();
      tile('me', me + ' (3D-tvilling)', new MediaStream([vt]), false);
      $('#t-me', v).classList.remove('self');
      s.replace = { live, player, cap, head, minute, stop() { cancelAnimationFrame(raf); } };
      $('#replace', v).classList.add('on');
      panel.innerHTML = `<div class="row between"><b>🏖️ Live Replace är på</b><button class="btn sm" id="r-stop">Ta över själv</button></div>
        <div class="small muted">3D-du pratar i mötet med Gemini 3.8 Flash Live. Ingen kan höra dig nu.</div>
        <div class="r-said" id="r-said">…</div>
        <div class="row"><input type="text" id="r-say" placeholder="Säg åt 3D-du, t.ex. ”säg att jag skickar rapporten i morgon”" style="flex:1"><button class="btn sm" id="r-send">Skicka</button></div>
        <label class="switch small" style="margin:8px 0 0"><input type="checkbox" id="r-hear" ${St.replaceHear ? 'checked' : ''}> Hör vad 3D-du säger</label>`;
      panel.classList.remove('hidden');
      $('#r-stop', panel).addEventListener('click', stopReplace);
      const send = () => { const t = $('#r-say', panel).value.trim(); if (!t) return; $('#r-say', panel).value = ''; live.text(`[Från ${me}] ${t}`); };
      $('#r-send', panel).addEventListener('click', send);
      $('#r-say', panel).addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
      $('#r-hear', panel).addEventListener('change', e => { St.replaceHear = e.target.checked; Store.save(); ui.toast('Gäller nästa gång du startar Live Replace'); });
      MoteyNet.sendText(r.id, `🤖 ${me}s AI-tvilling tar mötet en stund (Motey Live Replace).`);
    }
    function stopReplace() {
      const x = s.replace; s.replace = null; if (!x) return;
      clearInterval(x.minute); x.stop(); x.cap.stop(); x.live.close(); x.player.close(); x.head.destroy();
      s.onRemoteAudio = null; s.out = {};
      swapTracks();
      $('#t-me', v).classList.add('self');
      tile('me', MoteyNet.me().name + ' (du)', s.local, true);
      $('#replace', v).classList.remove('on'); $('#rpanel', v).classList.add('hidden');
      MoteyNet.sendText(r.id, `🙋 ${MoteyNet.me().name} är tillbaka själv.`);
    }
    s.stopReplace = stopReplace;
    function swapTracks() {
      const o = outgoing();
      const a = o.getAudioTracks()[0] || null, vtr = o.getVideoTracks()[0] || null;
      for (const p of s.peers.values()) if (p.pc) p.pc.getTransceivers().forEach(x => {
        const k = x.receiver.track.kind;
        x.sender.replaceTrack(k === 'audio' ? a : vtr).catch(() => {});
      });
    }

    $('#chat', v).addEventListener('click', e => {
      const c = $('#cchat', v);
      const show = c.classList.toggle('hidden') === false;
      e.currentTarget.classList.toggle('on', show);
      if (show && !c.dataset.mounted) { c.dataset.mounted = '1'; s.offs.push(ChatMode.mountRoom(c, r.id, { compact: true })); }
    });
    $('#end', v).addEventListener('click', () => App.go(meeting ? '#/m/' + meeting.id : '#/chat/' + r.id));
  }

  function stopLocal(s) { if (s.local) s.local.getTracks().forEach(t => t.stop()); if (s.screen) s.screen.getTracks().forEach(t => t.stop()); }

  function destroy() {
    const s = session; session = null;
    if (!s) return;
    s.alive = false;
    clearInterval(s.beat);
    try { s.stopReplace && s.stopReplace(); s.stopStyler && s.stopStyler(); } catch (e) { /* closing anyway */ }
    if (s.rec) { const r = s.rec; s.rec = null; try { r.stop(); } catch (e) { /* stopped */ } }
    try { MoteyNet.signal(s.r.id, { t: 'rtc', type: 'bye' }); } catch (e) { /* offline */ }
    for (const p of s.peers.values()) try { p.pc && p.pc.close(); } catch (e) { /* closed */ }
    stopLocal(s);
    s.offs.forEach(f => f());
  }

  /* Demo: try your camera with Motey as the other participant. */
  async function renderDemo(v) {
    v.innerHTML = `<div class="call"><div class="call-top"><a class="btn sm ghost" href="#/home">‹</a><div style="flex:1"><b>Testsamtal (demo)</b><div class="small muted">Så här ser ett Motey-möte ut. Riktiga samtal startar du när du börjar på riktigt.</div></div></div>
      <div class="tiles" id="tiles" data-n="2"><div class="tile self" id="t-me"><video autoplay playsinline muted></video><div class="tname">Du</div><div class="tav">🙂</div></div>
      <div class="tile novideo"><div class="tname">Motey</div><div class="tav" style="background:#EDE7FF">${Mascot.svg({ size: 90, talking: true })}</div></div></div>
      <div class="call-bar"><button class="btn" id="goreal">🚀 Börja på riktigt</button><a class="cbtn end" href="#/home">✆</a></div></div>`;
    $('#goreal', v).addEventListener('click', () => App.goReal());

      const vid = $('#t-me video', v); vid.srcObject = st; $('#t-me', v).classList.remove('novideo');
    } catch (e) { $('#t-me', v).classList.add('novideo'); }

  }
  const origDestroy = destroy;
  window.CallMode = {
    render,
    destroy() { if (session && session.demo) { stopLocal(session); session = null; return; } origDestroy(); }
  };
})();
