<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Hub AI</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top">
  <button class="brand" data-go="create" aria-label="Hub AI home">Hub AI</button>
  <span class="grow"></span>
  <button class="pill" id="credits" data-go="plans"></button>
  <button class="icon" data-go="settings" aria-label="Settings">
    <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.6-2-3.4-2.4 1a7.7 7.7 0 0 0-2.6-1.5L14 2.5h-4l-.4 2.5A7.7 7.7 0 0 0 7 6.5l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 3l-2 1.6 2 3.4 2.4-1a7.7 7.7 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.7 7.7 0 0 0 2.6-1.5l2.4 1 2-3.4Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
  </button>
</header>

<main id="view"></main>

<nav class="tabs" id="tabs">
  <button data-go="create"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg><span>Create</span></button>
  <button data-go="hubs"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg><span>Hubs</span></button>
  <button data-go="funhub"><svg viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="2.5"/><path d="M10.5 9.5v5l4-2.5z"/></svg><span>FunHub</span></button>
  <button data-go="features"><svg viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg><span>Tools</span></button>
  <button data-go="plans"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg><span>Plans</span></button>
</nav>

<div class="overlay" id="overlay" hidden></div>
<div class="sheet" id="sheet" hidden></div>
<div class="player" id="player" hidden>
  <div class="player-bar"><button class="icon" id="playerClose" aria-label="Close">✕</button><span id="playerTitle"></span></div>
  <iframe id="playerFrame" title="Hub" sandbox="allow-scripts allow-forms allow-modals allow-pointer-lock allow-downloads"></iframe>
</div>
<div class="toast" id="toast" hidden></div>

<script src="js/config.js"></script>
<script src="js/bridge.js"></script>
<script src="js/cloud-config.js"></script>
<script src="js/templates.js"></script>
<script src="js/cloud.js"></script>
<script src="js/plans.js"></script>
<script src="js/features.js"></script>
<script src="js/kinds.js"></script>
<script src="js/zip.js"></script>
<script src="js/funhub.js"></script>
<script src="js/whatsnew.js"></script>
<script src="js/app.js"></script>
</body>
</html>
