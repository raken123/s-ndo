<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Max's selfie</title>
<!-- The "photo" the Photo Booth ad edits: ?v=before (photo-booth curtain,
     banana peel on Max's head) or ?v=after (sunset, no peel). screens_v2.js
     shoots both at 1024x1024. -->
<style>html, body { margin: 0; background: #000; } svg { display: block; width: 1024px; height: 1024px; }</style>
</head>
<body>
<svg id="s" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="maxFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eef38a"/><stop offset="0.55" stop-color="#d8e04a"/><stop offset="1" stop-color="#b9c42a"/>
    </linearGradient>
    <linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1b5a"/><stop offset="0.45" stop-color="#e2557a"/><stop offset="0.75" stop-color="#ff9b45"/><stop offset="1" stop-color="#ffd27a"/>
    </linearGradient>
  </defs>
  <g id="bg"></g>
  <g id="chars"></g>
  <g id="top"></g>
</svg>
<script src="cats.js"></script>
<script>
var after = location.search.indexOf('after') >= 0;
var bg = $('bg');
if (after) {
  el('rect', { width: 1024, height: 1024, fill: 'url(#sunset)' }, bg);
  el('circle', { cx: 760, cy: 640, r: 150, fill: '#ffe08a', opacity: 0.9 }, bg);
  el('path', { d: 'M0,760 C200,700 400,820 620,760 C800,710 920,760 1024,740 L1024,1024 L0,1024 Z', fill: '#3a2350' }, bg);
  el('path', { d: 'M0,860 C260,820 520,900 1024,850 L1024,1024 L0,1024 Z', fill: '#251636' }, bg);
} else {
  el('rect', { width: 1024, height: 1024, fill: '#7a1630' }, bg);
  for (var x = 0; x < 1024; x += 64) el('rect', { x: x, width: 30, height: 1024, fill: '#8f1d3a' }, bg);
  el('rect', { width: 1024, height: 1024, fill: '#fff', opacity: 0.12 }, bg);
}
TL = { mouth: {}, lines: [] };
var max = makeCat('max');
poseCat(max, 0.6, { x: 512, y: 1120, s: 1.45, look: 0.1, eyes: after ? 'happy' : 'wide', brow: after ? 0 : 1, armL: after ? 120 : 30, armR: after ? -40 : -30 });
if (!after) {
  // the banana peel, flopped over his head
  var p = el('g', { transform: 'translate(500,250) rotate(-8) scale(1.6)' }, $('top'));
  el('path', { d: 'M-30,10 C-110,0 -150,40 -140,90 C-110,70 -70,50 -30,30 Z', fill: '#ffd23a', stroke: '#5a3a12', 'stroke-width': 7 }, p);
  el('path', { d: 'M30,10 C110,0 150,40 140,90 C110,70 70,50 30,30 Z', fill: '#ffd23a', stroke: '#5a3a12', 'stroke-width': 7 }, p);
  el('path', { d: 'M-8,22 C-60,40 -60,110 -40,150 C-20,110 -10,70 0,30 Z', fill: '#f0b400', stroke: '#5a3a12', 'stroke-width': 6 }, p);
  el('path', { d: 'M-34,26 C-30,-60 -10,-90 0,-100 C10,-90 30,-60 34,26 Z', fill: '#ffe680', stroke: '#5a3a12', 'stroke-width': 7 }, p);
  el('path', { d: 'M-5,-98 L5,-98 L3,-122 L-3,-122 Z', fill: '#6b4512', stroke: '#6b4512', 'stroke-width': 6 }, p);
  [[-90, 60], [100, 55], [-20, -40]].forEach(function (s) { el('circle', { cx: s[0], cy: s[1], r: 7, fill: '#8a6a1a', opacity: 0.6 }, p); });
}
</script>
</body>
</html>
