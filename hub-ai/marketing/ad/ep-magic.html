<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hub AI — The Great Maxini</title>
<!-- Episode 3 (1080x1920, ~19 s): the Great Maxini tries to make an app
     appear and gets a banana peel; Minnie asks Hub AI for a card trick app.
     Timings follow build/ep/magic/timeline.json. -->
<style>
  html, body { margin: 0; background: #000; }
  svg { display: block; width: 1080px; height: 1920px; }
  text { font-family: "DejaVu Sans", "Noto Color Emoji", sans-serif; }
</style>
</head>
<body>
<script src="cats.js"></script>
<script src="stage.js"></script>
<script>
var max, minnie, F = {}, o = '#1b1b1b';

function drape(parent, w, flip) {
  var g = el('g', {}, parent), d = '';
  el('rect', { x: flip ? -w : 0, y: 0, width: w, height: 1920, fill: '#b3122e' }, g);
  for (var x = 30; x < w; x += 70) {
    var xx = flip ? -x : x;
    el('path', { d: 'M' + xx + ',0 L' + xx + ',1920', stroke: '#7d0c20', 'stroke-width': 18, opacity: 0.7 }, g);
    el('path', { d: 'M' + (xx + (flip ? -22 : 22)) + ',0 L' + (xx + (flip ? -22 : 22)) + ',1920', stroke: '#e0344f', 'stroke-width': 8, opacity: 0.6 }, g);
  }
  el('rect', { x: flip ? -w : 0, y: 0, width: w, height: 1920, fill: 'none', stroke: o, 'stroke-width': 8 }, g);
  void d;
  return g;
}

function setup() {
  var bg = $('bg');
  el('rect', { width: 1080, height: 1920, fill: '#241338' }, bg);
  var r = rnd(12);
  for (var i = 0; i < 40; i++) {
    var s = el('text', { x: r() * 1080, y: 250 + r() * 1100, 'font-size': 26 + r() * 30, fill: '#ffd23a', opacity: 0.25 + r() * 0.3, 'text-anchor': 'middle' }, bg);
    s.textContent = '✦';
  }
  // stage floor
  el('rect', { y: 1460, width: 1080, height: 460, fill: '#7a4a24' }, bg);
  el('rect', { y: 1440, width: 1080, height: 36, fill: '#a8703c', stroke: o, 'stroke-width': 6 }, bg);
  for (var k = 0; k < 8; k++) el('path', { d: 'M0,' + (1520 + k * 55) + ' L1080,' + (1520 + k * 55), stroke: '#5e3a1a', 'stroke-width': 4, opacity: 0.6 }, bg);
  // spotlight (moves from Max to Minnie)
  F.spot = el('g', {}, $('props'));
  el('path', { d: 'M-60,0 L60,0 L330,1530 L-330,1530 Z', fill: '#fff6c8', opacity: 0.16 }, F.spot);
  el('ellipse', { cx: 0, cy: 1530, rx: 330, ry: 60, fill: '#fff6c8', opacity: 0.3 }, F.spot);
  // the little magic table
  F.table = el('g', { transform: 'translate(660,1460)' }, $('props'));
  el('rect', { x: -14, y: -230, width: 28, height: 230, fill: '#3b2408' }, F.table);
  el('ellipse', { cx: 0, cy: -230, rx: 130, ry: 26, fill: '#6c2bd9', stroke: o, 'stroke-width': 7 }, F.table);
  el('path', { d: 'M-130,-230 L-120,-170 L120,-170 L130,-230', fill: '#6c2bd9', stroke: o, 'stroke-width': 7, 'stroke-linejoin': 'round' }, F.table);
  el('path', { d: 'M-80,-200 L-70,-180 M0,-205 L0,-180 M80,-200 L70,-180', stroke: '#ffd23a', 'stroke-width': 6 }, F.table);
  // the banana peel that appears instead of an app
  F.peel = el('g', { transform: 'translate(620,1250)' }, $('props'));
  el('path', { d: 'M-20,0 C-80,-10 -120,10 -110,40 C-80,30 -50,20 -20,10 Z', fill: '#ffd23a', stroke: o, 'stroke-width': 6 }, F.peel);
  el('path', { d: 'M20,0 C80,-10 120,10 110,40 C80,30 50,20 20,10 Z', fill: '#ffd23a', stroke: o, 'stroke-width': 6 }, F.peel);
  el('path', { d: 'M-24,8 C-30,-60 -10,-110 0,-130 C10,-110 30,-60 24,8 Z', fill: '#ffe680', stroke: o, 'stroke-width': 6 }, F.peel);
  el('path', { d: 'M-4,-128 L4,-128 L2,-150 L-2,-150 Z', fill: '#6b4512', stroke: '#6b4512', 'stroke-width': 6 }, F.peel);
  el('ellipse', { cx: 0, cy: 18, rx: 34, ry: 12, fill: '#f0b400', stroke: o, 'stroke-width': 6 }, F.peel);

  max = makeCat('max', $('chars'));
  minnie = makeCat('minnie', $('chars'));
  costume(max, 'tophat');
  costume(minnie, 'bow-tie');
  // Max's wand
  F.wand = el('g', { transform: 'translate(74,64) rotate(-35)' }, max.armR);
  el('rect', { x: -9, y: -170, width: 18, height: 170, rx: 6, fill: '#1b1b1b' }, F.wand);
  el('rect', { x: -9, y: -170, width: 18, height: 34, rx: 6, fill: '#fff', stroke: o, 'stroke-width': 4 }, F.wand);
  F.sparkles = [];
  for (var sp = 0; sp < 12; sp++) {
    var t1 = el('text', { 'font-size': 60, 'text-anchor': 'middle', fill: '#ffe066', stroke: o, 'stroke-width': 3, 'paint-order': 'stroke', opacity: 0 }, $('fx'));
    t1.textContent = sp % 2 ? '✦' : '★';
    F.sparkles.push(t1);
  }
  // audience in front
  F.crowd = [];
  for (var c = 0; c < 9; c++) {
    var h = el('g', {}, $('front'));
    var x = 60 + c * 120, col = c % 2 ? '#3a2550' : '#2e1d40';
    el('path', { d: 'M-60,40 L-56,-60 L-30,-30 Z M60,40 L56,-60 L30,-30 Z', fill: col }, h);
    el('ellipse', { cx: 0, cy: 30, rx: 70, ry: 80, fill: col }, h);
    F.crowd.push([h, x]);
  }
  // curtains and valance (in front of everything on stage)
  F.curL = drape($('front'), 560, false);
  F.curR = drape($('front'), 560, true);
  var val = el('g', {}, $('front'));
  el('rect', { width: 1080, height: 110, fill: '#9c0f27', stroke: o, 'stroke-width': 8 }, val);
  for (var v = 0; v < 9; v++) el('path', { d: 'M' + (v * 120) + ',110 Q' + (v * 120 + 60) + ',190 ' + (v * 120 + 120) + ',110 Z', fill: '#9c0f27', stroke: o, 'stroke-width': 6 }, val);
  el('path', { d: 'M0,100 L1080,100', stroke: '#ffd23a', 'stroke-width': 10 }, val);
}

function sparkle(t, t0, x, y, seed) {
  // returns a list of [x, y, scale, opacity] for 6 sparkles around (x, y)
  var r = rnd(seed), out = [];
  for (var i = 0; i < 6; i++) {
    var d = t - t0 - r() * 0.3, a = r() * Math.PI * 2, dist = 60 + r() * 160;
    if (d >= 0 && d < 0.9) out.push([x + Math.cos(a) * dist * easeOut(d / 0.9), y + Math.sin(a) * dist * easeOut(d / 0.9), 0.6 + r(), 1 - d / 0.9]);
  }
  return out;
}

function render(t) {
  if (endCard(t)) { caption(t); flash(t, [[M.end, 0.3]]); return; }
  // curtains open
  var open = easeInOut(seg(t, M.curtain + 0.2, M.curtain + 1.5));
  F.curL.setAttribute('transform', 'translate(' + (-490 * open) + ',0)');
  F.curR.setAttribute('transform', 'translate(' + (1080 + 490 * open) + ',0)');
  // Max, the Great Maxini
  var swap = easeInOut(seg(t, M.minnie - 0.3, M.minnie + 0.4));
  var mp = { x: lerp(330, 270, swap), y: 1560, s: 0.95, look: 0.3, eyes: 'open', brow: 0.3, armL: 25, armR: -25 };
  var peek = easeOut(seg(t, M.poof + 0.5, M.poof + 0.9));
  var np = { x: lerp(lerp(1400, 1040, peek), 770, swap), y: 1560, s: 0.95, rot: (1 - swap) * peek * -14, look: -0.7, eyes: 'open', armL: 25, armR: -25 };
  if (at(t, 'curtain', 'trick') && t > M.curtain + 1.2) { mp.armL = 130; mp.armR = -130; mp.eyes = 'happy'; }
  if (at(t, 'trick', 'wave')) { mp.armL = 60; mp.armR = -50; mp.look = 0; }
  if (at(t, 'wave', 'poof')) { mp.armR = -95 + Math.sin(t * 18) * 35; mp.armL = 40; mp.brow = 0.6; mp.look = 0.8; }
  if (at(t, 'poof', 'minnie')) {
    mp.armR = -20; mp.look = 0.9;
    mp.eyes = t > M.poof + 0.6 ? 'bored' : 'wide';
    mp.brow = t > M.poof + 0.6 ? -0.4 : 1;
    np.eyes = 'happy';
  }
  if (t >= M.minnie) { np.look = -0.2; np.armL = 60; np.armR = -60; mp.look = 1; mp.armR = -20; mp.brow = 0; }
  var snap = TL.lines[4].start + 1.0;
  if (t >= snap && t < M.built + 0.4) { np.armR = -130 + Math.sin(t * 20) * 8; np.armL = 30; }
  if (t >= M.built) { np.eyes = 'happy'; np.armL = 120; np.armR = -120; }
  if (t >= M.applause + 0.5) { mp.eyes = 'wide'; mp.brow = 1; mp.armL = 110; mp.armR = -110; }
  if (t >= TL.lines[7].start) { mp.eyes = 'happy'; mp.brow = 0; np.armL = 40; np.armR = -110; }
  poseCat(max, t, mp);
  poseCat(minnie, t, np);
  // spotlight follows the star of the moment
  var sx = t < M.minnie ? mp.x : lerp(mp.x, np.x, swap);
  F.spot.setAttribute('transform', 'translate(' + sx + ',0)');
  // the peel appears out of the poof
  F.peel.setAttribute('opacity', t >= M.poof + 0.25 && t < M.minnie + 0.2 ? 1 : 0);
  F.peel.setAttribute('transform', 'translate(660,1250) scale(' + easeBack(seg(t, M.poof + 0.25, M.poof + 0.55)) + ')');
  F.table.setAttribute('transform', 'translate(660,1460)');
  puff('poof', t, M.poof, 660, 1170, 200, 1.1, '#e7dcff');
  puff('poof2', t, M.built - 0.1, 540, 880, 260, 0.9, '#e7dcff');
  // sparkles from the wand, and around the new app
  var sp = [];
  if (at(t, 'wave', 'poof')) {
    var tip = [mp.x + 140 + Math.sin(t * 18) * 40, 1060 - Math.cos(t * 18) * 40];
    sp = sp.concat(sparkle(t, M.wave, tip[0], tip[1], 1), sparkle(t, M.wave + 0.45, tip[0], tip[1], 2));
  }
  sp = sp.concat(sparkle(t, M.built, 540, 860, 3), sparkle(t, M.built + 0.3, 540, 860, 4));
  F.sparkles.forEach(function (s, i) {
    var v = sp[i];
    s.setAttribute('opacity', v ? v[3] : 0);
    if (v) s.setAttribute('transform', 'translate(' + v[0] + ',' + v[1] + ') scale(' + v[2] + ') rotate(' + t * 200 + ')');
  });
  // the phone
  phone({ show: t >= snap && t < M.end, k: easeBack(seg(t, snap, snap + 0.4)), x: 540, y: 860, s: 0.5, rot: Math.sin(t * 2) * 3,
    screen: t >= M.built ? 'magic-result' : 'magic-create', scroll: easeInOut(seg(t, M.built + 0.8, M.built + 1.8)) * 60 });
  // the audience bobs, and cheers on the applause
  var cheer = t >= M.applause ? 1 : 0;
  F.crowd.forEach(function (c, i) {
    var b = Math.sin(t * (cheer ? 14 : 2) + i * 1.7) * (cheer ? 22 : 6);
    c[0].setAttribute('transform', 'translate(' + c[1] + ',' + (1840 + b - cheer * 20) + ')');
  });
  stamp('maxini', t, M.curtain + 0.9, M.trick, 'The Great Maxini', { fill: '#6c2bd9', size: 80, y: 1000, rot: -4 });
  stamp('abra', t, M.wave + 0.1, M.poof, 'ABRACADABRA!', { burst: true, fill: '#ffd23a', color: '#6c2bd9', size: 72, x: 560, y: 640, w: 400, h: 170 });
  stamp('peel', t, M.poof + 0.9, M.minnie - 0.2, '…oops', { fill: '#ffe680', color: '#1b1b1b', size: 70, x: 700, y: 1000, rot: 6 });
  stamp('tada', t, TL.lines[5].start, M.applause + 0.4, 'TA-DA!', { burst: true, fill: '#ff4f8b', size: 100, x: 830, y: 640, w: 240, h: 150, rot: 8 });
  emojiRain(t, [[M.applause, 2.6, '👏', 18, 9, true], [M.applause + 0.4, 2.4, '🌹', 10, 10]]);
  confetti(t, [[M.built + 0.2, 540, 860, 13, 60, 2.4]]);
  flash(t, [[M.poof, 0.25, 0.6], [M.built, 0.25, 0.7]]);
  shake(t, [[M.poof, 0.3, 8]]);
  caption(t);
}

function init(tl) {
  TL = tl;
  stage({ screens: ['magic-create', 'magic-result'], tagline: "It's not magic. It's Hub AI.", costumes: { max: 'tophat', minnie: 'bow-tie' } });
  setup();
  render(0);
}
play('build/ep/magic');
</script>
</body>
</html>
