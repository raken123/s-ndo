<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hub AI — Lights, Camera, Banana</title>
<!-- Update ad 2 (1080x1920, ~19 s): in a film studio Max wants a cartoon but
     drawing takes forever; Minnie asks Hub AI for an animation, it plays on
     the big screen, and one tap turns it into a video.
     Timings: build/ep/studio/timeline.json. -->
<style>
  html, body { margin: 0; background: #000; }
  svg { display: block; width: 1080px; height: 1920px; }
  text { font-family: "DejaVu Sans", "Noto Color Emoji", sans-serif; }
</style>
</head>
<body>
<script src="cats.js"></script>
<script src="stage.js"></script>
<script>
var max, minnie, F = {}, o = '#1b1b1b';

function setup() {
  var bg = $('bg');
  el('rect', { width: 1080, height: 1920, fill: '#17121f' }, bg);
  for (var x = 0; x < 1080; x += 90) el('rect', { x: x, y: 0, width: 44, height: 1500, fill: '#1d1727' }, bg);
  el('rect', { y: 1480, width: 1080, height: 440, fill: '#2a2233' }, bg);
  el('rect', { y: 1470, width: 1080, height: 20, fill: '#3a3047' }, bg);
  // the big screen
  el('rect', { x: 80, y: 600, width: 920, height: 520, rx: 10, fill: '#0c0c10', stroke: '#47405a', 'stroke-width': 14 }, bg);
  var scr = el('g', { 'clip-path': 'url(#bigClip)' }, bg);
  F.blank = el('g', {}, scr);
  el('rect', { x: 92, y: 612, width: 896, height: 496, fill: '#e9e6dd' }, F.blank);
  F.count = el('text', { x: 540, y: 920, 'font-size': 220, 'font-weight': 900, fill: '#3a3a3a', 'text-anchor': 'middle' }, F.blank);
  F.sweep = el('path', { fill: '#cfcac0' }, F.blank);
  F.film = el('g', { opacity: 0 }, scr);
  el('rect', { x: 92, y: 612, width: 896, height: 496, fill: 'url(#night)' }, F.film);
  F.stars = [];
  var r = rnd(4);
  for (var i = 0; i < 60; i++) F.stars.push(el('circle', { cx: 92 + r() * 896, cy: 612 + r() * 496, r: 1.5 + r() * 2.5, fill: '#fff' }, F.film));
  el('circle', { cx: 830, cy: 730, r: 90, fill: '#ffe066' }, F.film);
  [[805, 705, 16], [860, 760, 22], [815, 775, 10]].forEach(function (c) { el('circle', { cx: c[0], cy: c[1], r: c[2], fill: '#f0c419' }, F.film); });
  F.rocket = el('g', {}, F.film);
  el('path', { d: 'M-14,40 L0,80 L14,40 Z', fill: '#ff9b2f' }, F.rocket);
  el('path', { d: 'M-30,40 L-16,10 L16,10 L30,40 Z', fill: '#e5484d' }, F.rocket);
  el('path', { d: 'M-16,40 L-16,-20 Q0,-62 16,-20 L16,40 Z', fill: '#f4f4f4' }, F.rocket);
  el('circle', { cy: -4, r: 8, fill: '#7cc4ff' }, F.rocket);
  F.title = el('text', { x: 540, y: 1075, 'font-size': 44, 'font-weight': 900, fill: '#fff', 'text-anchor': 'middle', opacity: 0 }, F.film);
  F.title.textContent = 'TO THE MOON';
  // studio lamps
  [[60, 300, 20], [1020, 300, -20]].forEach(function (l) {
    var g = el('g', { transform: 'translate(' + l[0] + ',' + l[1] + ') rotate(' + l[2] + ')' }, $('props'));
    el('path', { d: 'M-40,0 L40,0 L260,1250 L-260,1250 Z', fill: '#fff6c8', opacity: 0.07 }, g);
    el('rect', { x: -50, y: -60, width: 100, height: 70, rx: 12, fill: '#2b2b38', stroke: o, 'stroke-width': 6 }, g);
  });
  // the clapperboard
  F.clap = el('g', {}, $('front'));
  el('rect', { x: -230, y: -100, width: 460, height: 280, rx: 14, fill: '#1b1b1b', stroke: '#eee', 'stroke-width': 6 }, F.clap);
  var t1 = el('text', { x: -200, y: -20, 'font-size': 44, 'font-weight': 800, fill: '#fff' }, F.clap); t1.textContent = 'HUB AI STUDIOS';
  var t2 = el('text', { x: -200, y: 50, 'font-size': 36, fill: '#ddd' }, F.clap); t2.textContent = 'SCENE 1 · TAKE 1';
  var t3 = el('text', { x: -200, y: 120, 'font-size': 36, fill: '#ffd23a' }, F.clap); t3.textContent = 'DIR: MAX';
  F.arm = el('g', {}, F.clap);
  el('rect', { x: -230, y: -150, width: 460, height: 50, fill: '#1b1b1b', stroke: '#eee', 'stroke-width': 6 }, F.arm);
  for (var s2 = 0; s2 < 6; s2++) el('path', { d: 'M' + (-210 + s2 * 80) + ',-148 l40,0 l-30,46 l-40,0 Z', fill: '#eee' }, F.arm);
  // paper from Max's drawing attempts
  F.papers = [0, 1, 2, 3, 4].map(function () { var p = el('text', { 'font-size': 80, 'text-anchor': 'middle', opacity: 0 }, $('fx')); p.textContent = '📄'; return p; });
  max = makeCat('max', $('chars'));
  minnie = makeCat('minnie', $('chars'));
  costume(max, 'beret');
  F.maxShades = costume(max, 'shades');
  F.pencil = el('g', { transform: 'translate(74,64) rotate(-40)' }, max.armR);
  el('rect', { x: -9, y: -110, width: 18, height: 110, fill: '#ffd23a', stroke: o, 'stroke-width': 4 }, F.pencil);
  el('path', { d: 'M-9,-110 L0,-134 L9,-110 Z', fill: '#f2d7b0', stroke: o, 'stroke-width': 4 }, F.pencil);
  F.rec = el('g', { opacity: 0 }, $('fx'));
  el('rect', { x: -110, y: -36, width: 220, height: 72, rx: 36, fill: '#1b1b1b', stroke: '#fff', 'stroke-width': 4 }, F.rec);
  F.recDot = el('circle', { cx: -66, cy: 0, r: 18, fill: '#e5484d' }, F.rec);
  var rt = el('text', { x: 20, y: 14, 'font-size': 40, 'font-weight': 900, fill: '#fff', 'text-anchor': 'middle' }, F.rec); rt.textContent = 'REC';
}

function render(t) {
  if (endCard(t)) { caption(t); flash(t, [[M.end, 0.3]]); return; }
  // the clapperboard snaps shut, then flies off
  var shut = easeInOut(seg(t, M.clap + 0.8, M.clap + 1.2)), away = easeInOut(seg(t, M.clap + 1.35, M.max + 0.2));
  F.arm.setAttribute('transform', 'rotate(' + (-25 * (1 - shut)) + ',-230,-100)');
  F.clap.setAttribute('transform', 'translate(' + lerp(540, -400, away) + ',' + lerp(1100, 900, away) + ') rotate(' + (-6 - away * 40) + ') scale(' + (1 + 0.05 * Math.sin(Math.PI * shut)) + ')');
  // the big screen: a film countdown until the animation is built
  var playing = t >= M.built;
  F.blank.setAttribute('opacity', playing ? 0 : 1);
  F.film.setAttribute('opacity', playing ? 1 : 0);
  var cd = 3 - Math.floor((t * 1.2) % 3);
  F.count.textContent = cd;
  var a = (t * 1.2 % 1) * Math.PI * 2;
  F.sweep.setAttribute('d', 'M540,860 L540,600 A260,260 0 ' + (a > Math.PI ? 1 : 0) + ',1 ' + (540 + Math.sin(a) * 260) + ',' + (860 - Math.cos(a) * 260) + ' Z');
  F.sweep.setAttribute('opacity', 0.5);
  var k = ((t - M.built) / 3.5) % 1;
  F.rocket.setAttribute('transform', 'translate(' + lerp(180, 760, k) + ',' + lerp(1050, 760, k) + ') rotate(' + 50 + ') scale(1.3)');
  F.stars.forEach(function (s, i) { s.setAttribute('opacity', 0.5 + 0.5 * Math.sin(t * 3 + i)); });
  F.title.setAttribute('opacity', seg(t, M.built + 0.5, M.built + 1.2));
  // the cats
  var mp = { x: 250, y: 1780, s: 0.85, look: 0.4, eyes: 'open', brow: 0, armL: 25, armR: -25 };
  var np = { x: lerp(1400, 840, easeOut(seg(t, M.minnie - 0.5, M.minnie + 0.1))), y: 1780, s: 0.85, look: -0.6, eyes: 'happy', armL: 25, armR: -25 };
  if (t < M.max) { mp.armL = 110; mp.eyes = 'happy'; }
  var drawing = at(t, 'max', 'minnie');
  if (drawing) { mp.armR = -50 + Math.sin(t * 30) * 25; mp.brow = 0.5; mp.eyes = t > TL.lines[1].end - 0.9 ? 'bored' : 'open'; }
  F.pencil.setAttribute('opacity', t < M.minnie ? 1 : 0);
  if (at(t, 'minnie', 'phone')) { np.armL = 100; np.eyes = 'open'; mp.look = 1; }
  if (at(t, 'phone', 'built')) { np.armR = -100; mp.look = 0.7; }
  if (at(t, 'built', 'video')) { mp.eyes = 'wide'; mp.brow = 1; mp.armL = 120; mp.armR = -120; mp.look = 0; }
  if (at(t, 'video', 'star')) { np.armR = -120; np.armL = 40; mp.look = 0.8; mp.eyes = 'open'; }
  if (t >= M.star) { mp.eyes = 'happy'; mp.armL = 130; mp.armR = -130; mp.y -= Math.abs(Math.sin((t - M.star) * 8)) * 40; }
  F.maxShades.setAttribute('opacity', t >= M.star ? 1 : 0);
  poseCat(max, t, mp);
  poseCat(minnie, t, np);
  // crumpled drawings fly away
  F.papers.forEach(function (p, i) {
    var t0 = M.max + 0.4 + i * 0.5, d = t - t0, r = rnd(60 + i);
    p.setAttribute('opacity', d > 0 && d < 1.2 ? 1 - d / 1.2 : 0);
    p.setAttribute('transform', 'translate(' + (330 + d * (200 + r() * 300) * (i % 2 ? 1 : -0.6)) + ',' + (1350 - d * 500 + d * d * 500) + ') rotate(' + d * 300 + ')');
  });
  // the phone
  var pk = easeBack(seg(t, M.phone, M.phone + 0.4));
  phone({ show: t >= M.phone, k: pk, x: 540, y: 1330, s: 0.48, rot: Math.sin(t * 2) * 2,
    screen: t >= M.video + 0.5 ? 'v2-studio-video' : t >= M.built ? 'v2-studio-result' : 'v2-studio-create' });
  // recording
  var rec = t >= M.video + 0.5 && t < M.star;
  F.rec.setAttribute('opacity', rec ? 1 : 0);
  F.rec.setAttribute('transform', 'translate(240,690) scale(0.8)');
  F.recDot.setAttribute('opacity', Math.floor(t * 3) % 2 ? 1 : 0.3);
  stamp('draw1', t, M.max + 0.5, M.minnie, 'draw…', { fill: '#fff', color: '#1b1b1b', size: 60, x: 420, y: 1250, rot: -8 });
  stamp('draw2', t, M.max + 1.2, M.minnie, '…erase…', { fill: '#fff', color: '#1b1b1b', size: 60, x: 640, y: 1360, rot: 6 });
  stamp('forever', t, M.max + 2.0, M.minnie, '😩 FOREVER', { burst: true, fill: '#ffd23a', color: '#e5484d', size: 64, x: 560, y: 1180, w: 300, h: 150 });
  stamp('anim', t, M.built + 0.2, M.video, 'ANIMATION ✓', { fill: '#06d6a0', color: '#0d0d0d', size: 60, y: 1640, rot: -3 });
  ['9:16', '1:1', '16:9'].forEach(function (f, i) {
    var pos = [[300, 1180], [780, 1180], [540, 1640]][i];
    stamp('f' + i, t, M.video + 1.0 + i * 0.25, M.star, f, { fill: '#4cc9f0', color: '#0d0d0d', size: 54, x: pos[0], y: pos[1], rot: (i - 1) * 6 });
  });
  stamp('star', t, M.star + 0.1, M.end, '⭐ MOVIE STAR', { burst: true, fill: '#ffd23a', color: '#e5484d', size: 70, y: 1150, w: 360, h: 170 });
  emojiRain(t, [[M.star, 1.6, '⭐', 16, 71]]);
  confetti(t, [[M.built, 540, 860, 72, 60, 2.6]]);
  flash(t, [[M.clap + 1.2, 0.2, 0.5], [M.built, 0.25, 0.6]]);
  shake(t, [[M.clap + 1.2, 0.25, 8]]);
  caption(t);
}

function init(tl) {
  TL = tl;
  stage({ screens: ['v2-studio-create', 'v2-studio-result', 'v2-studio-video'], tagline: 'Animations in seconds. Export as video.', subline: 'Make anything by just asking.', badge: 'NEW: ANIMATIONS', costumes: { max: 'beret' } });
  var d = $('s').querySelector('defs');
  el('clipPath', { id: 'bigClip' }, d).appendChild(el('rect', { x: 92, y: 612, width: 896, height: 496 }));
  var g = el('linearGradient', { id: 'night', x1: 0, y1: 0, x2: 0, y2: 1 }, d);
  el('stop', { offset: '0', 'stop-color': '#0b0f2e' }, g); el('stop', { offset: '1', 'stop-color': '#3a1d5c' }, g);
  setup();
  render(0);
}
play('build/ep/studio');
</script>
</body>
</html>
