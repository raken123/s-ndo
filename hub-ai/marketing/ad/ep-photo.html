<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hub AI — Photo Booth</title>
<!-- Update ad 5 (1080x1920, ~21 s): Max's photo-booth selfie has a banana
     peel on his head; Minnie edits it away with Hub AI (and adds a sunset),
     then shows everything else the update can make.
     Timings: build/ep/photo/timeline.json. -->
<style>
  html, body { margin: 0; background: #000; }
  svg { display: block; width: 1080px; height: 1920px; }
  text { font-family: "DejaVu Sans", "Noto Color Emoji", sans-serif; }
</style>
</head>
<body>
<script src="cats.js"></script>
<script src="stage.js"></script>
<script>
var max, minnie, F = {}, o = '#1b1b1b';

function peel(parent) {
  var p = el('g', { transform: 'translate(-8,-600) rotate(-8) scale(1.1)' }, parent);
  el('path', { d: 'M-30,10 C-110,0 -150,40 -140,90 C-110,70 -70,50 -30,30 Z', fill: '#ffd23a', stroke: '#5a3a12', 'stroke-width': 7 }, p);
  el('path', { d: 'M30,10 C110,0 150,40 140,90 C110,70 70,50 30,30 Z', fill: '#ffd23a', stroke: '#5a3a12', 'stroke-width': 7 }, p);
  el('path', { d: 'M-8,22 C-60,40 -60,110 -40,150 C-20,110 -10,70 0,30 Z', fill: '#f0b400', stroke: '#5a3a12', 'stroke-width': 6 }, p);
  el('path', { d: 'M-34,26 C-30,-60 -10,-90 0,-100 C10,-90 30,-60 34,26 Z', fill: '#ffe680', stroke: '#5a3a12', 'stroke-width': 7 }, p);
  el('path', { d: 'M-5,-98 L5,-98 L3,-122 L-3,-122 Z', fill: '#6b4512', stroke: '#6b4512', 'stroke-width': 6 }, p);
  return p;
}

function setup() {
  var bg = $('bg');
  el('rect', { width: 1080, height: 1920, fill: '#7a1630' }, bg);
  for (var x = 0; x < 1080; x += 72) el('rect', { x: x, width: 34, height: 1920, fill: '#8f1d3a' }, bg);
  el('rect', { y: 1500, width: 1080, height: 420, fill: '#3a1220' }, bg);
  var sign = el('g', { transform: 'translate(540,640)' }, bg);
  el('rect', { x: -230, y: -55, width: 460, height: 100, rx: 50, fill: '#1b1b1b', stroke: '#ffd23a', 'stroke-width': 6 }, sign);
  var st = el('text', { y: 18, 'font-size': 50, 'font-weight': 900, fill: '#ffd23a', 'text-anchor': 'middle' }, sign); st.textContent = '📸 PHOTO BOOTH';
  // the polaroid
  F.pol = el('g', { opacity: 0 }, $('mid'));
  el('rect', { x: -250, y: -250, width: 500, height: 580, rx: 10, fill: '#fbfaf5', stroke: '#d9d6cc', 'stroke-width': 4 }, F.pol);
  F.before = el('image', { href: 'build/screens/v2-photo-before.png', x: -220, y: -220, width: 440, height: 440 }, F.pol);
  F.after = el('image', { href: 'build/screens/v2-photo-after.png', x: -220, y: -220, width: 440, height: 440, opacity: 0 }, F.pol);
  var cap = el('text', { y: 290, 'font-size': 40, fill: '#333', 'text-anchor': 'middle', 'font-style': 'italic' }, F.pol); cap.textContent = 'Max, 2026';
  F.sparks = [0, 1, 2, 3, 4, 5].map(function () { var s = el('text', { 'font-size': 70, 'text-anchor': 'middle', opacity: 0, fill: '#ffe066', stroke: o, 'stroke-width': 3, 'paint-order': 'stroke' }, $('fx')); s.textContent = '✦'; return s; });
  // the things you can make, flying in
  F.things = [['🎮', 'Games'], ['🌐', 'Websites'], ['✒️', 'Logos'], ['🔀', 'Diagrams'], ['📄', 'Documents']].map(function (x) {
    var g = el('g', { opacity: 0 }, $('fx'));
    el('rect', { x: -150, y: -50, width: 300, height: 100, rx: 50, fill: '#fff', stroke: o, 'stroke-width': 6 }, g);
    var e = el('text', { x: -100, y: 20, 'font-size': 54, 'text-anchor': 'middle' }, g); e.textContent = x[0];
    var n = el('text', { x: 30, y: 16, 'font-size': 40, 'font-weight': 800, fill: '#1b1b1b', 'text-anchor': 'middle' }, g); n.textContent = x[1];
    return g;
  });
  max = makeCat('max', $('chars'));
  minnie = makeCat('minnie', $('chars'));
  F.peel = peel(max.inner);
}

function render(t) {
  if (endCard(t)) { caption(t); flash(t, [[M.end, 0.3]]); return; }
  var L = TL.lines;
  // the polaroid slides out, then moves aside for the list
  var out = easeBack(seg(t, M.snap + 0.2, M.snap + 0.8)), aside = easeInOut(seg(t, M.more, M.more + 0.6)), bye = seg(t, M.more + 0.6, M.more + 1.1);
  F.pol.setAttribute('opacity', t >= M.snap + 0.2 ? 1 - bye : 0);
  F.pol.setAttribute('transform', 'translate(' + lerp(540, 250, aside) + ',' + lerp(lerp(1500, 1000, out), 930, aside) + ') rotate(' + lerp(-4, -10, aside) + ') scale(' + lerp(Math.max(0.001, out), 0.55, aside) + ')');
  var fixed = easeInOut(seg(t, M.built, M.built + 0.5));
  F.after.setAttribute('opacity', fixed);
  F.sparks.forEach(function (s, i) {
    var d = t - M.built - i * 0.08, a = i / 6 * Math.PI * 2;
    s.setAttribute('opacity', d > 0 && d < 0.9 ? 1 - d / 0.9 : 0);
    s.setAttribute('transform', 'translate(' + (540 + Math.cos(a) * (150 + d * 250)) + ',' + (1000 + Math.sin(a) * (150 + d * 250)) + ') rotate(' + d * 300 + ')');
  });
  // the peel on Max's head goes when the photo is fixed
  F.peel.setAttribute('opacity', t < M.built + 0.25 ? 1 : 0);
  puff('peelpoof', t, M.built + 0.15, 230, 1290, 120, 0.9, '#fff3b0');
  // the cats
  var mp = { x: 230, y: 1800, s: 0.85, look: 0.4, eyes: 'happy', brow: 0, armL: 120, armR: -120 };
  var np = { x: 860, y: 1800, s: 0.85, look: -0.6, eyes: 'happy', armL: 25, armR: -25 };
  if (t >= M.snap) { mp.armL = 30; mp.armR = -30; mp.eyes = 'open'; }
  if (at(t, 'look', 'phone')) { mp.eyes = 'wide'; mp.brow = 1; mp.armL = 120; mp.armR = -120; mp.look = 1; np.eyes = 'open'; }
  if (at(t, 'phone', 'built')) { np.armL = 40; np.armR = -110; np.eyes = 'open'; mp.look = 1; mp.eyes = 'open'; }
  if (at(t, 'built', 'more')) { mp.eyes = 'happy'; mp.armL = 130; mp.armR = -130; }
  if (at(t, 'more', 'outro')) { np.armL = 110 + Math.sin(t * 6) * 15; np.eyes = 'open'; mp.look = 0.8; mp.eyes = 'open'; }
  if (t >= M.outro) { mp.eyes = 'happy'; np.eyes = 'happy'; mp.armL = 130; mp.armR = -130; np.armL = 130; np.armR = -130;
    mp.y -= Math.abs(Math.sin((t - M.outro) * 7)) * 30; np.y -= Math.abs(Math.sin((t - M.outro) * 7 + 1)) * 30; }
  poseCat(max, t, mp);
  poseCat(minnie, t, np);
  // the phone
  var pk = easeBack(seg(t, M.phone, M.phone + 0.4)), gone = seg(t, M.outro - 0.3, M.outro);
  phone({ show: t >= M.phone && t < M.outro, k: pk * (1 - gone), x: lerp(780, 760, aside), y: lerp(1080, 1060, aside), s: 0.44, rot: 5 + Math.sin(t * 2) * 2,
    screen: t >= M.more + 0.4 ? 'v2-kinds' : t >= M.built ? 'v2-photo-result' : 'v2-photo-create' });
  // the list of things to make
  F.things.forEach(function (g, i) {
    var t0 = L[4].start + 1.3 + i * 0.5, k = easeBack(seg(t, t0, t0 + 0.35)), hide = seg(t, M.outro - 0.3, M.outro);
    var pos = [300, 860 + i * 104];
    g.setAttribute('opacity', t >= t0 ? 1 - hide : 0);
    g.setAttribute('transform', 'translate(' + (pos[0] + (i % 2 ? 30 : -30)) + ',' + pos[1] + ') scale(' + Math.max(0.001, k * 0.85) + ') rotate(' + (i % 2 ? 3 : -3) + ')');
  });
  stamp('cheese', t, M.pose, M.snap, '😁 CHEESE!', { fill: '#ffd23a', color: '#1b1b1b', size: 64, x: 560, y: 1000, rot: -4 });
  stamp('oh', t, M.look, M.phone, '🍌 ?!', { burst: true, fill: '#fff', color: '#e5484d', size: 80, x: 780, y: 1120, w: 220, h: 150 });
  stamp('fixed', t, M.built + 0.4, M.more, 'EDITED ✓', { fill: '#06d6a0', color: '#0d0d0d', size: 60, x: 540, y: 1420, rot: -3 });
  var A = L[5], third = (A.end - A.start) / 3;
  stamp('o1', t, A.start + 0.1, M.end, '13 THINGS TO MAKE', { fill: '#ffd23a', color: '#0d0d0d', size: 62, y: 900, rot: -4 });
  stamp('o2', t, A.start + third, M.end, '20 PRO TOOLS', { fill: '#4cc9f0', color: '#0d0d0d', size: 62, y: 1080, rot: 3 });
  stamp('o3', t, A.start + third * 2, M.end, '1 HUB AI', { burst: true, fill: '#ff4f8b', color: '#fff', size: 90, y: 1290, w: 330, h: 170 });
  confetti(t, [[M.built, 540, 1000, 101, 60, 2.6], [A.start + third * 2, 540, 1290, 102, 80, 2.8]]);
  flash(t, [[M.snap, 0.35, 1]]);
  shake(t, [[M.look, 0.3, 8]]);
  caption(t);
}

function init(tl) {
  TL = tl;
  stage({ screens: ['v2-photo-create', 'v2-photo-result', 'v2-kinds'], tagline: 'Apps, animations, slides, 3D, photos and more.', subline: 'Make anything by just asking.', badge: 'NEW UPDATE' });
  setup();
  render(0);
}
play('build/ep/photo');
</script>
</body>
</html>
