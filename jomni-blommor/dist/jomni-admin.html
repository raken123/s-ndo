<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="jomni-api" content="https://jomniblommor.se">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Jomni Admin</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%23f8e4e8%22%2F%3E%3Cg%20fill%3D%22%23b8475f%22%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2222%22%20r%3D%228%22%2F%3E%3Ccircle%20cx%3D%2242%22%20cy%3D%2230%22%20r%3D%228%22%2F%3E%3Ccircle%20cx%3D%2238%22%20cy%3D%2242%22%20r%3D%228%22%2F%3E%3Ccircle%20cx%3D%2226%22%20cy%3D%2242%22%20r%3D%228%22%2F%3E%3Ccircle%20cx%3D%2222%22%20cy%3D%2230%22%20r%3D%228%22%2F%3E%3C%2Fg%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2233%22%20r%3D%226%22%20fill%3D%22%23f6c343%22%2F%3E%3C%2Fsvg%3E" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
:root {
  --bg: #fbf7f2;
  --surface: #ffffff;
  --surface-2: #f5eee6;
  --ink: #2b2522;
  --muted: #736860;
  --line: #e9dfd4;
  --rose: #b8475f;
  --rose-dark: #963a4e;
  --rose-soft: #f8e4e8;
  --sage: #5e7f66;
  --sage-soft: #e7efe8;
  --coin: #c98a12;
  --coin-soft: #fdf1d6;
  --diamond: #1f8aa8;
  --diamond-soft: #ddf2f8;
  --danger: #b3261e;
  --radius: 18px;
  --shadow: 0 10px 30px rgba(60, 40, 30, .08);
  --serif: 'Fraunces', Georgia, serif;
  --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--sans); overflow-x: hidden; }
h1, h2, h3 { font-family: var(--serif); font-weight: 600; line-height: 1.15; margin: 0 0 .4em; letter-spacing: -.01em; }
h1 { font-size: clamp(2rem, 5vw, 3.3rem); }
h2 { font-size: clamp(1.5rem, 3vw, 2rem); }
h3 { font-size: 1.2rem; }
p { margin: 0 0 1em; }
a { color: var(--rose); }
button, input, select, textarea { font: inherit; color: inherit; }
img, svg { display: block; max-width: 100%; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.hidden { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* Header */
.top { position: sticky; top: 0; z-index: 20; background: rgba(251, 247, 242, .92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 12px; height: 64px; }
.logo { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); font-family: var(--serif); font-size: 1.35rem; font-weight: 600; margin-right: auto; }
.logo-mark { width: 34px; height: 34px; border-radius: 50%; background: var(--rose-soft); display: grid; place-items: center; font-size: 1.1rem; }
.nav { display: flex; gap: 4px; }
.nav a { text-decoration: none; color: var(--ink); padding: 8px 12px; border-radius: 999px; font-weight: 500; font-size: .95rem; }
.nav a.active, .nav a:hover { background: var(--surface-2); }
.cart-btn { position: relative; border: 0; background: var(--ink); color: #fff; border-radius: 999px; padding: 9px 16px; cursor: pointer; font-weight: 600; display: flex; gap: 6px; align-items: center; }
.cart-count { background: var(--rose); border-radius: 999px; min-width: 22px; height: 22px; display: inline-grid; place-items: center; font-size: .78rem; padding: 0 6px; }
.wallet-pill { display: flex; gap: 6px; font-size: .85rem; font-weight: 600; }
.wallet-pill span { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
@media (max-width: 760px) {
  .nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--line); justify-content: space-around; padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); z-index: 30; }
  .nav a { font-size: .85rem; padding: 8px 10px; }
  .wallet-pill { display: none; }
  body { padding-bottom: 64px; }
}

/* Buttons & forms */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 999px; padding: 12px 22px; font-weight: 600; cursor: pointer; text-decoration: none; background: var(--rose); color: #fff; transition: background .15s, transform .1s; }
.btn:hover { background: var(--rose-dark); }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.ghost:hover { background: var(--surface-2); }
.btn.dark { background: var(--ink); }
.btn.sage { background: var(--sage); }
.btn.block { width: 100%; }
.btn.sm { padding: 7px 14px; font-size: .9rem; }
label { display: block; font-weight: 500; font-size: .92rem; margin-bottom: 12px; }
label > span { display: block; margin-bottom: 4px; }
input, select, textarea { width: 100%; padding: 11px 13px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); outline: none; }
input:focus, select:focus, textarea:focus { border-color: var(--rose); box-shadow: 0 0 0 3px var(--rose-soft); }
textarea { min-height: 80px; resize: vertical; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 560px) { .row { grid-template-columns: 1fr; } }
.error { color: var(--danger); font-weight: 500; font-size: .92rem; }
.ok { color: var(--sage); font-weight: 600; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
.chip { display: inline-block; font-size: .78rem; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); }
.chip.rose { background: var(--rose-soft); color: var(--rose-dark); }
.chip.sage { background: var(--sage-soft); color: var(--sage); }

/* Hero */
.hero { padding: 48px 0 28px; display: grid; grid-template-columns: 1.1fr .9fr; gap: 32px; align-items: center; }
.hero p { font-size: 1.12rem; color: var(--muted); max-width: 34em; }
.hero-art { background: radial-gradient(circle at 50% 45%, var(--rose-soft), transparent 70%); border-radius: 50%; max-width: 360px; margin: 0 auto; }
.perks { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
@media (max-width: 760px) { .hero { grid-template-columns: 1fr; padding-top: 24px; } .hero-art { max-width: 220px; order: -1; } }

/* Products */
.filters { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 16px; }
.filters button { border: 1.5px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap; font-weight: 500; }
.filters button.active { background: var(--ink); color: #fff; border-color: var(--ink); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; padding-bottom: 40px; }
.product { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; transition: transform .15s, box-shadow .15s; }
.product:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
.product .art { background: var(--surface-2); padding: 14px 24px 4px; cursor: pointer; }
.product .body { padding: 14px 16px 16px; display: flex; flex-direction: column; flex: 1; gap: 6px; }
.product h3 { margin: 0; }
.product .desc { color: var(--muted); font-size: .9rem; flex: 1; }
.product .buy { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
.price { font-weight: 700; font-size: 1.1rem; }
.coin-hint { font-size: .8rem; color: var(--coin); font-weight: 600; }

/* Detail */
.detail { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; padding: 32px 0 48px; align-items: start; }
.detail .art { background: var(--surface-2); border-radius: var(--radius); padding: 30px; }
.qty { display: inline-flex; align-items: center; border: 1.5px solid var(--line); border-radius: 999px; overflow: hidden; }
.qty button { border: 0; background: none; width: 40px; height: 40px; font-size: 1.2rem; cursor: pointer; }
.qty span { min-width: 30px; text-align: center; font-weight: 600; }
@media (max-width: 760px) { .detail { grid-template-columns: 1fr; padding-top: 16px; } }

/* Drawer */
.drawer-bg { position: fixed; inset: 0; background: rgba(30, 20, 15, .35); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100%); background: var(--bg); z-index: 50; display: flex; flex-direction: column; box-shadow: -10px 0 40px rgba(0, 0, 0, .15); }
.drawer header { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid var(--line); }
.drawer .items { flex: 1; overflow-y: auto; padding: 12px 20px; }
.drawer footer { padding: 16px 20px calc(16px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--surface); }
.line { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.line .thumb { background: var(--surface-2); border-radius: 12px; padding: 4px; }
.icon-btn { border: 0; background: var(--surface-2); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 1.1rem; }

/* Checkout */
.checkout { display: grid; grid-template-columns: 1.4fr 1fr; gap: 24px; padding: 28px 0 48px; align-items: start; }
.checkout section { margin-bottom: 18px; }
.step { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.step b { width: 28px; height: 28px; border-radius: 50%; background: var(--rose); color: #fff; display: grid; place-items: center; font-size: .9rem; }
.options { display: grid; gap: 10px; margin-bottom: 12px; }
.option { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border: 1.5px solid var(--line); border-radius: 14px; cursor: pointer; background: var(--surface); margin: 0; }
.option input { width: auto; margin-top: 4px; accent-color: var(--rose); }
.option.selected { border-color: var(--rose); background: var(--rose-soft); }
.slots { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.slots button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 14px; cursor: pointer; font-weight: 600; }
.slots button.active { border-color: var(--rose); background: var(--rose-soft); color: var(--rose-dark); }
.summary { position: sticky; top: 84px; }
.sum-row { display: flex; justify-content: space-between; padding: 4px 0; }
.sum-row.total { font-weight: 700; font-size: 1.2rem; border-top: 1px solid var(--line); margin-top: 8px; padding-top: 12px; }
.discount-row { display: flex; gap: 8px; }
.discount-row input { text-transform: uppercase; }
.pay-buttons { display: grid; gap: 10px; }
.pay-apple { background: #000; color: #fff; border: 0; border-radius: 10px; height: 50px; font-weight: 600; font-size: 1.05rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
.pay-google { background: #fff; color: #3c4043; border: 1.5px solid #dadce0; border-radius: 10px; height: 50px; font-weight: 600; font-size: 1.05rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
.pay-google .g { font-weight: 700; background: conic-gradient(#ea4335 0 25%, #fbbc05 0 50%, #34a853 0 75%, #4285f4 0); -webkit-background-clip: text; background-clip: text; color: transparent; font-size: 1.2rem; }
.divider { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: .85rem; margin: 6px 0; }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--line); }
.demo-note { background: var(--coin-soft); border-radius: 12px; padding: 10px 12px; font-size: .88rem; margin-bottom: 12px; }
@media (max-width: 860px) { .checkout { grid-template-columns: 1fr; } .summary { position: static; order: -1; } }

/* Tracking */
.timeline { list-style: none; padding: 0; margin: 16px 0; }
.timeline li { position: relative; padding: 0 0 18px 34px; color: var(--muted); }
.timeline li::before { content: ''; position: absolute; left: 8px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--line); }
.timeline li::after { content: ''; position: absolute; left: 13px; top: 20px; bottom: 0; width: 2px; background: var(--line); }
.timeline li:last-child::after { display: none; }
.timeline li.done { color: var(--ink); font-weight: 500; }
.timeline li.done::before { background: var(--sage); box-shadow: 0 0 0 4px var(--sage-soft); }
.stars { display: flex; gap: 4px; }
.stars button { border: 0; background: none; font-size: 2rem; cursor: pointer; color: #d9cfc4; padding: 0; line-height: 1; }
.stars button.on { color: #e7a92a; }

/* Rewards */
.balances { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 18px 0; }
.balance { border-radius: var(--radius); padding: 18px; }
.balance .big { font-size: 1.9rem; font-weight: 700; font-family: var(--serif); }
.balance.coin { background: var(--coin-soft); color: #7a5208; }
.balance.diamond { background: var(--diamond-soft); color: #0f5568; }
.balance.plus { background: var(--rose-soft); color: var(--rose-dark); }
@media (max-width: 700px) { .balances { grid-template-columns: 1fr; } }
.rewards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.reward { display: flex; flex-direction: column; gap: 8px; }
.plus-card { background: linear-gradient(135deg, #3a2430, #7b3148); color: #fff; border: 0; }
.plus-card .muted { color: #f1d6de; }
.rates { display: flex; flex-wrap: wrap; gap: 10px; }
.rates span { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; font-weight: 600; font-size: .92rem; }
.code { font-family: ui-monospace, Menlo, monospace; font-weight: 700; background: var(--surface-2); padding: 3px 8px; border-radius: 8px; letter-spacing: .04em; }

.page { padding: 28px 0 48px; }
.narrow { max-width: 640px; }
.tabs { display: flex; gap: 6px; margin-bottom: 16px; }
.tabs button { border: 0; background: var(--surface-2); border-radius: 999px; padding: 8px 16px; cursor: pointer; font-weight: 600; }
.tabs button.active { background: var(--ink); color: #fff; }
.list-item { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: center; }

/* Footer */
.foot { border-top: 1px solid var(--line); margin-top: 32px; padding: 28px 0 36px; color: var(--muted); font-size: .9rem; }
.foot .wrap { display: flex; flex-direction: column; gap: 14px; align-items: center; text-align: center; }
.admin-link { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: var(--muted); border: 1.5px solid var(--line); border-radius: 999px; padding: 7px 16px; font-weight: 600; font-size: .85rem; }
.admin-link:hover { color: var(--ink); background: var(--surface-2); }

.toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 999px; z-index: 60; font-weight: 500; box-shadow: var(--shadow); max-width: calc(100% - 32px); text-align: center; }

/* Admin */
.admin-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 18px 0; }
.admin-top h1 { font-size: 1.6rem; margin: 0 auto 0 0; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
.stat .big { font-size: 1.6rem; font-weight: 700; font-family: var(--serif); }
@media (max-width: 760px) { .stats { grid-template-columns: 1fr 1fr; } }
.orders { display: grid; gap: 12px; }
.order { background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--line); border-radius: 16px; padding: 16px; }
.order.st-paid { border-left-color: var(--rose); }
.order.st-preparing { border-left-color: var(--coin); }
.order.st-out_for_delivery { border-left-color: var(--diamond); }
.order.st-delivered { border-left-color: var(--sage); opacity: .8; }
.order.st-cancelled { opacity: .55; }
.order-head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.order-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 12px 0; font-size: .92rem; }
.order-grid h4 { margin: 0 0 4px; font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
@media (max-width: 760px) { .order-grid { grid-template-columns: 1fr; } }
.due { font-weight: 700; }
.due.late { color: var(--danger); }
.due.soon { color: var(--coin); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.toolbar select { width: auto; }
.toolbar label { display: flex; gap: 6px; align-items: center; margin: 0; font-weight: 500; }
.toolbar label input { width: auto; }
.star-balance { font-size: 3rem; font-family: var(--serif); font-weight: 700; color: #b77c0c; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 860px) { .two { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <main id="admin" class="wrap"></main>
  <footer class="foot"><div class="wrap"><a class="admin-link" href="jomni-blommor.html">← Till butiken</a></div></footer>
  <script type="module">
// Serverns adress. Tom = samma domän. Fristående HTML-filer sätter <meta name="jomni-api">.
const API_BASE = (document.querySelector('meta[name="jomni-api"]')?.content || '').replace(/\/$/, '');
const $ = (sel, el = document) => el.querySelector(sel);
const $$ = (sel, el = document) => [...el.querySelectorAll(sel)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const kr = (n) => `${Number(n).toLocaleString('sv-SE')} kr`;
const fmtDate = (d) => new Date(`${d}T12:00:00`).toLocaleDateString('sv-SE', { weekday: 'short', day: 'numeric', month: 'short' });
const fmtTime = (iso) => new Date(iso).toLocaleString('sv-SE', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

const store = {
  get(k) { try { return localStorage.getItem(`jomni.${k}`); } catch { return null; } },
  set(k, v) { try { if (v == null) localStorage.removeItem(`jomni.${k}`); else localStorage.setItem(`jomni.${k}`, v); } catch { /* privat läge */ } },
};

const state = { token: store.get('admin'), tab: 'orders', filter: 'active', unpaid: false, orders: [], seen: null, stats: null };
const root = $('#admin');

async function api(path, { method = 'GET', body } = {}) {
  const res = await fetch(`${API_BASE}/api${path}`, {
    method,
    headers: { 'Content-Type': 'application/json', ...(state.token ? { Authorization: `Bearer ${state.token}` } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const json = await res.json().catch(() => ({}));
  if (res.status === 401 && path !== '/admin/login') { logout(); throw new Error('Logga in igen.'); }
  if (!res.ok) throw new Error(json.error || 'Något gick fel.');
  return json;
}

function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.append(el);
  setTimeout(() => el.remove(), 3500);
}

function logout() {
  state.token = null;
  store.set('admin', null);
  clearInterval(state.timer);
  renderLogin();
}

function renderLogin() {
  root.innerHTML = `
    <div class="page narrow" style="max-width:420px">
      <h1>🔒 Admin</h1>
      <form class="card" id="login">
        <label><span>Lösenord</span><input type="password" name="password" autocomplete="current-password" required autofocus></label>
        <p class="error" id="login-err"></p>
        <button class="btn block">Logga in</button>
      </form>
    </div>`;
  $('#login').onsubmit = async (e) => {
    e.preventDefault();
    try {
      const { token } = await api('/admin/login', { method: 'POST', body: { password: e.target.password.value } });
      state.token = token;
      store.set('admin', token);
      start();
    } catch (err) { $('#login-err').textContent = err.message; }
  };
}

// ---------------------------------------------------------------- dashboard
function renderShell() {
  root.innerHTML = `
    <div class="admin-top">
      <h1>🌸 Jomni Admin</h1>
      <button class="btn ghost sm" id="notif">🔔 Aviseringar</button>
      <button class="btn ghost sm" id="logout">Logga ut</button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="tabs">
      <button data-tab="orders" class="${state.tab === 'orders' ? 'active' : ''}">📦 Beställningar</button>
      <button data-tab="stars" class="${state.tab === 'stars' ? 'active' : ''}">⭐ Stjärnor & rabatter</button>
    </div>
    <div id="tab"></div>`;
  $('#logout').onclick = logout;
  $('#notif').onclick = async () => {
    if (!('Notification' in window)) { toast('Webbläsaren stöder inte aviseringar. Använd iPhone-appen.'); return; }
    const p = await Notification.requestPermission();
    toast(p === 'granted' ? 'Du får en avisering när en ny beställning kommer in.' : 'Aviseringar är avstängda.');
  };
  $$('[data-tab]').forEach((b) => { b.onclick = () => { state.tab = b.dataset.tab; renderShell(); renderStats(); renderTab(); }; });
}

function renderStats() {
  const s = state.stats;
  if (!s) return;
  $('#stats').innerHTML = `
    <div class="stat"><div class="small muted">Leverera idag</div><div class="big">${s.deliverToday}</div></div>
    <div class="stat"><div class="small muted">Att leverera totalt</div><div class="big">${s.toDeliver}</div></div>
    <div class="stat"><div class="small muted">Försäljning idag</div><div class="big">${kr(s.revenueToday)}</div><div class="small muted">${s.ordersToday} beställningar</div></div>
    <div class="stat"><div class="small muted">Stjärnor</div><div class="big">⭐ ${s.stars.balance}</div><div class="small muted">${s.stars.average ? `Snitt ${s.stars.average.toLocaleString('sv-SE')} av ${s.stars.ratings} betyg` : 'Inga betyg än'}</div></div>`;
}

function renderTab() {
  if (state.tab === 'orders') renderOrders();
  else renderStars();
}

function dueInfo(o) {
  const ms = Date.parse(o.deliverBy) - Date.now();
  if (['delivered', 'cancelled'].includes(o.status)) return { cls: '', text: '' };
  if (ms < 0) return { cls: 'late', text: 'Nu!' };
  if (ms < 3 * 3600e3) return { cls: 'soon', text: `om ${Math.max(1, Math.round(ms / 60000))} min` };
  return { cls: '', text: '' };
}

const NEXT = {
  paid: [['preparing', 'Börja binda 💐']],
  preparing: [['out_for_delivery', 'Ute för leverans 🚲']],
  out_for_delivery: [['delivered', 'Levererad ✅']],
};

function renderOrders() {
  const active = ['paid', 'preparing', 'out_for_delivery'];
  let list = state.orders;
  if (state.filter === 'active') list = list.filter((o) => active.includes(o.status)).sort((a, b) => a.deliverBy.localeCompare(b.deliverBy));
  else if (state.filter !== 'all') list = list.filter((o) => o.status === state.filter);
  $('#tab').innerHTML = `
    <div class="toolbar">
      <select id="filter" aria-label="Filter">
        <option value="active">Att leverera (efter leveranstid)</option>
        <option value="all">Alla</option>
        <option value="delivered">Levererade</option>
        <option value="cancelled">Avbrutna</option>
      </select>
      <label><input type="checkbox" id="unpaid" ${state.unpaid ? 'checked' : ''}> Visa obetalda</label>
      <span class="small muted">${list.length} st · uppdateras automatiskt</span>
    </div>
    <div class="orders">${list.length ? list.map(orderCard).join('') : '<div class="card muted">Inga beställningar här just nu. 🌿</div>'}</div>`;
  $('#filter').value = state.filter;
  $('#filter').onchange = (e) => { state.filter = e.target.value; renderOrders(); };
  $('#unpaid').onchange = (e) => { state.unpaid = e.target.checked; refresh(); };
  $('#tab').onclick = async (e) => {
    const b = e.target.closest('[data-status]');
    if (!b) return;
    if (b.dataset.status === 'cancelled' && !confirm('Avbryta beställningen? Glöm inte att återbetala i Stripe.')) return;
    b.disabled = true;
    try {
      const { order } = await api(`/admin/orders/${b.dataset.id}`, { method: 'PATCH', body: { status: b.dataset.status } });
      state.orders = state.orders.map((o) => (o.id === order.id ? order : o));
      renderOrders();
      refreshStats();
    } catch (err) { toast(err.message); b.disabled = false; }
  };
}

function orderCard(o) {
  const d = o.delivery;
  const due = dueInfo(o);
  const addr = `${d.address}, ${d.postcode} ${d.city}`;
  const pay = { apple_pay: 'Apple Pay', google_pay: 'Google Pay', card: 'Kort', free: 'Gratis' }[o.payment.method] || o.payment.method || '–';
  return `<article class="order st-${o.status}">
    <div class="order-head">
      <div><strong style="font-size:1.1rem">#${o.number}</strong> <span class="chip">${esc(o.statusLabel)}</span></div>
      <div class="due ${due.cls}">🕑 ${esc(fmtDate(d.date))}${d.slotLabel ? ` kl ${esc(d.slotLabel)}` : ' · PostNord'} ${due.text ? `· ${due.text}` : ''}</div>
    </div>
    <div class="order-grid">
      <div><h4>Bukett</h4>${o.lines.map((l) => `${l.qty} × ${esc(l.name)}`).join('<br>')}
        <div class="small muted" style="margin-top:4px">${kr(o.total)} · ${esc(pay)}${o.discount ? ` · kod ${esc(o.discount.code)}` : ''}</div></div>
      <div><h4>Leverera till</h4><strong>${esc(d.recipient)}</strong> · <a href="tel:${esc(d.recipientPhone)}">${esc(d.recipientPhone)}</a><br>
        <a href="https://maps.google.com/?q=${encodeURIComponent(addr)}" target="_blank" rel="noopener">${esc(addr)}</a>
        ${d.instructions ? `<div class="small">📝 ${esc(d.instructions)}</div>` : ''}</div>
      <div><h4>Beställare</h4>${esc(o.customer.name)}<br><a href="tel:${esc(o.customer.phone)}">${esc(o.customer.phone)}</a><br>
        <a href="mailto:${esc(o.customer.email)}">${esc(o.customer.email)}</a>
        <div class="small muted">Beställd ${fmtTime(o.createdAt)}</div></div>
    </div>
    ${d.message ? `<p class="small">💌 Kort: <em>”${esc(d.message)}”</em></p>` : ''}
    ${o.rating ? `<p class="small">${'⭐'.repeat(o.rating.stars)} ${esc(o.rating.comment)}</p>` : ''}
    <div class="actions">
      ${(NEXT[o.status] || []).map(([s, label]) => `<button class="btn sm" data-id="${o.id}" data-status="${s}">${label}</button>`).join('')}
      ${['paid', 'preparing'].includes(o.status) ? `<button class="btn ghost sm" data-id="${o.id}" data-status="cancelled">Avbryt</button>` : ''}
    </div>
  </article>`;
}

// ---------------------------------------------------------------- stjärnor & rabatter
async function renderStars() {
  const s = state.stats;
  $('#tab').innerHTML = `
    <div class="two">
      <div class="card">
        <h3>Dina stjärnor</h3>
        <div class="star-balance">⭐ ${s.stars.balance}</div>
        <p class="muted small">Kunderna ger 1–5 stjärnor efter leverans. Totalt ${s.stars.received} ⭐ intjänade, ${s.stars.spent} ⭐ använda.</p>
        <h4>Senaste betygen</h4>
        ${s.recentRatings.length ? s.recentRatings.map((r) => `<div class="list-item"><div>${'⭐'.repeat(r.stars)} <span class="small muted">#${r.number} · ${esc(r.name)}</span>${r.comment ? `<div class="small">”${esc(r.comment)}”</div>` : ''}</div></div>`).join('') : '<p class="muted small">Inga betyg ännu.</p>'}
      </div>
      <form class="card" id="new-discount">
        <h3>Skapa rabatt med stjärnor</h3>
        <label><span>Typ</span><select name="type">
          <option value="percent">Procent rabatt (1 ⭐ per %)</option>
          <option value="amount">Kronor rabatt (1 ⭐ per 10 kr)</option>
          <option value="free_delivery">Gratis leverans (5 ⭐)</option>
          <option value="free_bouquet">Gratis bukett upp till X kr (1 ⭐ per 10 kr)</option>
        </select></label>
        <label id="value-row"><span>Värde</span><input name="value" type="number" min="1" value="10"></label>
        <div class="row">
          <label><span>Kod (valfri)</span><input name="code" placeholder="SOMMAR10" style="text-transform:uppercase"></label>
          <label><span>Max antal användningar</span><input name="maxUses" type="number" min="1" placeholder="Obegränsat"></label>
        </div>
        <label><span>Giltig till och med (valfritt)</span><input name="expiresAt" type="date"></label>
        <p><strong id="cost">Kostar 10 ⭐</strong></p>
        <p class="error" id="disc-err"></p>
        <button class="btn block">Skapa rabattkod</button>
      </form>
    </div>
    <div class="card" style="margin-top:16px"><h3>Rabattkoder</h3><div id="codes" class="muted">Laddar …</div></div>`;

  const form = $('#new-discount');
  const updCost = async () => {
    $('#value-row').classList.toggle('hidden', form.type.value === 'free_delivery');
    try {
      const { cost } = await api('/admin/discounts/cost', { method: 'POST', body: { type: form.type.value, value: Number(form.value.value) } });
      $('#cost').textContent = `Kostar ${cost} ⭐ (du har ${state.stats.stars.balance} ⭐)`;
      $('#cost').style.color = cost > state.stats.stars.balance ? 'var(--danger)' : '';
    } catch { /* ignorera */ }
  };
  form.type.onchange = updCost;
  form.value.oninput = updCost;
  updCost();
  form.onsubmit = async (e) => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(form));
    try {
      const { discount } = await api('/admin/discounts', { method: 'POST', body: f });
      toast(`Rabattkoden ${discount.code} är skapad!`);
      await refreshStats();
      renderStars();
    } catch (err) { $('#disc-err').textContent = err.message; }
  };
  loadCodes();
}

async function loadCodes() {
  const { discounts } = await api('/admin/discounts');
  const box = $('#codes');
  if (!box) return;
  box.classList.remove('muted');
  box.innerHTML = discounts.length ? discounts.map((d) => `
    <div class="list-item">
      <div><span class="code">${esc(d.code)}</span> ${esc(d.label)}
        <div class="small muted">Använd ${d.uses}${d.maxUses ? ` av ${d.maxUses}` : ''} gånger · ${d.starCost} ⭐${d.expiresAt ? ` · t.o.m. ${new Date(d.expiresAt).toLocaleDateString('sv-SE')}` : ''}${d.disabled ? ' · <strong>inaktiverad</strong>' : ''}</div></div>
      ${d.disabled ? '' : `<button class="btn ghost sm" data-del="${esc(d.code)}">Ta bort</button>`}
    </div>`).join('') : '<p class="muted">Inga rabattkoder ännu.</p>';
  box.onclick = async (e) => {
    const b = e.target.closest('[data-del]');
    if (!b || !confirm(`Ta bort ${b.dataset.del}? Oanvända koder ger tillbaka stjärnorna.`)) return;
    const { refunded } = await api(`/admin/discounts/${encodeURIComponent(b.dataset.del)}`, { method: 'DELETE' });
    toast(refunded ? `Koden togs bort och ${refunded} ⭐ kom tillbaka.` : 'Koden togs bort.');
    await refreshStats();
    renderStars();
  };
}

// ---------------------------------------------------------------- data
async function refreshStats() {
  state.stats = await api('/admin/stats');
  renderStats();
}

async function refresh() {
  try {
    const { orders } = await api(`/admin/orders${state.unpaid ? '?include_unpaid=1' : ''}`);
    const ids = new Set(orders.map((o) => o.id));
    if (state.seen) {
      const fresh = orders.filter((o) => !state.seen.has(o.id) && o.status === 'paid');
      for (const o of fresh) {
        const d = o.delivery;
        const body = `${d.date}${d.slotLabel ? ` kl ${d.slotLabel}` : ''} · ${d.address}, ${d.city}`;
        toast(`Ny beställning #${o.number}!`);
        if ('Notification' in window && Notification.permission === 'granted') {
          new Notification(`Ny beställning #${o.number} – du måste leverera`, { body, tag: o.id, requireInteraction: true });
        }
      }
    }
    state.seen = ids;
    state.orders = orders;
    await refreshStats();
    if (state.tab === 'orders' && !document.activeElement?.closest?.('#tab select')) renderOrders();
  } catch (e) { if (state.token) toast(e.message); }
}

async function start() {
  renderShell();
  await refresh();
  renderTab();
  clearInterval(state.timer);
  state.timer = setInterval(refresh, 20000);
}

if (state.token) start(); else renderLogin();

</script>
</body>
</html>
