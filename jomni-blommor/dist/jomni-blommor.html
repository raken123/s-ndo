  <style>
:root {
  --bg: #fbf7f2;
  --surface: #ffffff;
  --surface-2: #f5eee6;
  --ink: #2b2522;
  --muted: #736860;
  --line: #e9dfd4;
  --rose: #b8475f;
  --rose-dark: #963a4e;
  --rose-soft: #f8e4e8;
  --sage: #5e7f66;
  --sage-soft: #e7efe8;
  --coin: #c98a12;
  --coin-soft: #fdf1d6;
  --diamond: #1f8aa8;
  --diamond-soft: #ddf2f8;
  --danger: #b3261e;
  --radius: 18px;
  --shadow: 0 10px 30px rgba(60, 40, 30, .08);
  --serif: 'Fraunces', Georgia, serif;
  --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--sans); overflow-x: hidden; }
h1, h2, h3 { font-family: var(--serif); font-weight: 600; line-height: 1.15; margin: 0 0 .4em; letter-spacing: -.01em; }
h1 { font-size: clamp(2rem, 5vw, 3.3rem); }
h2 { font-size: clamp(1.5rem, 3vw, 2rem); }
h3 { font-size: 1.2rem; }
p { margin: 0 0 1em; }
a { color: var(--rose); }
button, input, select, textarea { font: inherit; color: inherit; }
img, svg { display: block; max-width: 100%; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.hidden { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* Header */
.top { position: sticky; top: 0; z-index: 20; background: rgba(251, 247, 242, .92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 12px; height: 64px; }
.logo { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); font-family: var(--serif); font-size: 1.35rem; font-weight: 600; margin-right: auto; }
.logo-mark { width: 34px; height: 34px; border-radius: 50%; background: var(--rose-soft); display: grid; place-items: center; font-size: 1.1rem; }
.nav { display: flex; gap: 4px; }
.nav a { text-decoration: none; color: var(--ink); padding: 8px 12px; border-radius: 999px; font-weight: 500; font-size: .95rem; }
.nav a.active, .nav a:hover { background: var(--surface-2); }
.cart-btn { position: relative; border: 0; background: var(--ink); color: #fff; border-radius: 999px; padding: 9px 16px; cursor: pointer; font-weight: 600; display: flex; gap: 6px; align-items: center; }
.cart-count { background: var(--rose); border-radius: 999px; min-width: 22px; height: 22px; display: inline-grid; place-items: center; font-size: .78rem; padding: 0 6px; }
.wallet-pill { display: flex; gap: 6px; font-size: .85rem; font-weight: 600; }
.wallet-pill span { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
@media (max-width: 760px) {
  .nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--line); justify-content: space-around; padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); z-index: 30; }
  .nav a { font-size: .85rem; padding: 8px 10px; }
  .wallet-pill { display: none; }
  body { padding-bottom: 64px; }
}

/* Buttons & forms */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 999px; padding: 12px 22px; font-weight: 600; cursor: pointer; text-decoration: none; background: var(--rose); color: #fff; transition: background .15s, transform .1s; }
.btn:hover { background: var(--rose-dark); }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn.ghost:hover { background: var(--surface-2); }
.btn.dark { background: var(--ink); }
.btn.sage { background: var(--sage); }
.btn.block { width: 100%; }
.btn.sm { padding: 7px 14px; font-size: .9rem; }
label { display: block; font-weight: 500; font-size: .92rem; margin-bottom: 12px; }
label > span { display: block; margin-bottom: 4px; }
input, select, textarea { width: 100%; padding: 11px 13px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); outline: none; }
input:focus, select:focus, textarea:focus { border-color: var(--rose); box-shadow: 0 0 0 3px var(--rose-soft); }
textarea { min-height: 80px; resize: vertical; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 560px) { .row { grid-template-columns: 1fr; } }
.error { color: var(--danger); font-weight: 500; font-size: .92rem; }
.ok { color: var(--sage); font-weight: 600; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
.chip { display: inline-block; font-size: .78rem; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); }
.chip.rose { background: var(--rose-soft); color: var(--rose-dark); }
.chip.sage { background: var(--sage-soft); color: var(--sage); }

/* Hero */
.hero { padding: 48px 0 28px; display: grid; grid-template-columns: 1.1fr .9fr; gap: 32px; align-items: center; }
.hero p { font-size: 1.12rem; color: var(--muted); max-width: 34em; }
.hero-art { background: radial-gradient(circle at 50% 45%, var(--rose-soft), transparent 70%); border-radius: 50%; max-width: 360px; margin: 0 auto; }
.perks { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
@media (max-width: 760px) { .hero { grid-template-columns: 1fr; padding-top: 24px; } .hero-art { max-width: 220px; order: -1; } }

/* Products */
.filters { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 16px; }
.filters button { border: 1.5px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap; font-weight: 500; }
.filters button.active { background: var(--ink); color: #fff; border-color: var(--ink); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; padding-bottom: 40px; }
.product { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; transition: transform .15s, box-shadow .15s; }
.product:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
.product .art { background: var(--surface-2); padding: 14px 24px 4px; cursor: pointer; }
.product .body { padding: 14px 16px 16px; display: flex; flex-direction: column; flex: 1; gap: 6px; }
.product h3 { margin: 0; }
.product .desc { color: var(--muted); font-size: .9rem; flex: 1; }
.product .buy { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
.price { font-weight: 700; font-size: 1.1rem; }
.coin-hint { font-size: .8rem; color: var(--coin); font-weight: 600; }

/* Detail */
.detail { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; padding: 32px 0 48px; align-items: start; }
.detail .art { background: var(--surface-2); border-radius: var(--radius); padding: 30px; }
.qty { display: inline-flex; align-items: center; border: 1.5px solid var(--line); border-radius: 999px; overflow: hidden; }
.qty button { border: 0; background: none; width: 40px; height: 40px; font-size: 1.2rem; cursor: pointer; }
.qty span { min-width: 30px; text-align: center; font-weight: 600; }
@media (max-width: 760px) { .detail { grid-template-columns: 1fr; padding-top: 16px; } }

/* Drawer */
.drawer-bg { position: fixed; inset: 0; background: rgba(30, 20, 15, .35); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100%); background: var(--bg); z-index: 50; display: flex; flex-direction: column; box-shadow: -10px 0 40px rgba(0, 0, 0, .15); }
.drawer header { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid var(--line); }
.drawer .items { flex: 1; overflow-y: auto; padding: 12px 20px; }
.drawer footer { padding: 16px 20px calc(16px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--surface); }
.line { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.line .thumb { background: var(--surface-2); border-radius: 12px; padding: 4px; }
.icon-btn { border: 0; background: var(--surface-2); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 1.1rem; }

/* Checkout */
.checkout { display: grid; grid-template-columns: 1.4fr 1fr; gap: 24px; padding: 28px 0 48px; align-items: start; }
.checkout section { margin-bottom: 18px; }
.step { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.step b { width: 28px; height: 28px; border-radius: 50%; background: var(--rose); color: #fff; display: grid; place-items: center; font-size: .9rem; }
.options { display: grid; gap: 10px; margin-bottom: 12px; }
.option { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border: 1.5px solid var(--line); border-radius: 14px; cursor: pointer; background: var(--surface); margin: 0; }
.option input { width: auto; margin-top: 4px; accent-color: var(--rose); }
.option.selected { border-color: var(--rose); background: var(--rose-soft); }
.slots { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.slots button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 14px; cursor: pointer; font-weight: 600; }
.slots button.active { border-color: var(--rose); background: var(--rose-soft); color: var(--rose-dark); }
.summary { position: sticky; top: 84px; }
.sum-row { display: flex; justify-content: space-between; padding: 4px 0; }
.sum-row.total { font-weight: 700; font-size: 1.2rem; border-top: 1px solid var(--line); margin-top: 8px; padding-top: 12px; }
.discount-row { display: flex; gap: 8px; }
.discount-row input { text-transform: uppercase; }
.pay-buttons { display: grid; gap: 10px; }
.pay-apple { background: #000; color: #fff; border: 0; border-radius: 10px; height: 50px; font-weight: 600; font-size: 1.05rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
.pay-google { background: #fff; color: #3c4043; border: 1.5px solid #dadce0; border-radius: 10px; height: 50px; font-weight: 600; font-size: 1.05rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
.pay-google .g { font-weight: 700; background: conic-gradient(#ea4335 0 25%, #fbbc05 0 50%, #34a853 0 75%, #4285f4 0); -webkit-background-clip: text; background-clip: text; color: transparent; font-size: 1.2rem; }
.divider { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: .85rem; margin: 6px 0; }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--line); }
.demo-note { background: var(--coin-soft); border-radius: 12px; padding: 10px 12px; font-size: .88rem; margin-bottom: 12px; }
@media (max-width: 860px) { .checkout { grid-template-columns: 1fr; } .summary { position: static; order: -1; } }

/* Tracking */
.timeline { list-style: none; padding: 0; margin: 16px 0; }
.timeline li { position: relative; padding: 0 0 18px 34px; color: var(--muted); }
.timeline li::before { content: ''; position: absolute; left: 8px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--line); }
.timeline li::after { content: ''; position: absolute; left: 13px; top: 20px; bottom: 0; width: 2px; background: var(--line); }
.timeline li:last-child::after { display: none; }
.timeline li.done { color: var(--ink); font-weight: 500; }
.timeline li.done::before { background: var(--sage); box-shadow: 0 0 0 4px var(--sage-soft); }
.stars { display: flex; gap: 4px; }
.stars button { border: 0; background: none; font-size: 2rem; cursor: pointer; color: #d9cfc4; padding: 0; line-height: 1; }
.stars button.on { color: #e7a92a; }

/* Rewards */
.balances { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 18px 0; }
.balance { border-radius: var(--radius); padding: 18px; }
.balance .big { font-size: 1.9rem; font-weight: 700; font-family: var(--serif); }
.balance.coin { background: var(--coin-soft); color: #7a5208; }
.balance.diamond { background: var(--diamond-soft); color: #0f5568; }
.balance.plus { background: var(--rose-soft); color: var(--rose-dark); }
@media (max-width: 700px) { .balances { grid-template-columns: 1fr; } }
.rewards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.reward { display: flex; flex-direction: column; gap: 8px; }
.plus-card { background: linear-gradient(135deg, #3a2430, #7b3148); color: #fff; border: 0; }
.plus-card .muted { color: #f1d6de; }
.rates { display: flex; flex-wrap: wrap; gap: 10px; }
.rates span { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; font-weight: 600; font-size: .92rem; }
.code { font-family: ui-monospace, Menlo, monospace; font-weight: 700; background: var(--surface-2); padding: 3px 8px; border-radius: 8px; letter-spacing: .04em; }

.page { padding: 28px 0 48px; }
.narrow { max-width: 640px; }
.tabs { display: flex; gap: 6px; margin-bottom: 16px; }
.tabs button { border: 0; background: var(--surface-2); border-radius: 999px; padding: 8px 16px; cursor: pointer; font-weight: 600; }
.tabs button.active { background: var(--ink); color: #fff; }
.list-item { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: center; }

/* Footer */
.foot { border-top: 1px solid var(--line); margin-top: 32px; padding: 28px 0 36px; color: var(--muted); font-size: .9rem; }
.foot .wrap { display: flex; flex-direction: column; gap: 14px; align-items: center; text-align: center; }
.admin-link { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: var(--muted); border: 1.5px solid var(--line); border-radius: 999px; padding: 7px 16px; font-weight: 600; font-size: .85rem; }
.admin-link:hover { color: var(--ink); background: var(--surface-2); }

.toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 999px; z-index: 60; font-weight: 500; box-shadow: var(--shadow); max-width: calc(100% - 32px); text-align: center; }

/* Admin */
.admin-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 18px 0; }
.admin-top h1 { font-size: 1.6rem; margin: 0 auto 0 0; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
.stat .big { font-size: 1.6rem; font-weight: 700; font-family: var(--serif); }
@media (max-width: 760px) { .stats { grid-template-columns: 1fr 1fr; } }
.orders { display: grid; gap: 12px; }
.order { background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--line); border-radius: 16px; padding: 16px; }
.order.st-paid { border-left-color: var(--rose); }
.order.st-preparing { border-left-color: var(--coin); }
.order.st-out_for_delivery { border-left-color: var(--diamond); }
.order.st-delivered { border-left-color: var(--sage); opacity: .8; }
.order.st-cancelled { opacity: .55; }
.order-head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.order-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 12px 0; font-size: .92rem; }
.order-grid h4 { margin: 0 0 4px; font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
@media (max-width: 760px) { .order-grid { grid-template-columns: 1fr; } }
.due { font-weight: 700; }
.due.late { color: var(--danger); }
.due.soon { color: var(--coin); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.toolbar select { width: auto; }
.toolbar label { display: flex; gap: 6px; align-items: center; margin: 0; font-weight: 500; }
.toolbar label input { width: auto; }
.star-balance { font-size: 3rem; font-family: var(--serif); font-weight: 700; color: #b77c0c; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 860px) { .two { grid-template-columns: 1fr; } }
</style>
</head>

  <script type="module">
// Ritar en bukett som SVG utifrån produktens färger. Samma motiv ritas i iPhone-appen.
function rng(seed) {
  let h = 2166136261;
  for (const ch of seed) h = Math.imul(h ^ ch.charCodeAt(0), 16777619);
  return () => {
    h = Math.imul(h ^ (h >>> 15), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    return ((h ^= h >>> 16) >>> 0) / 4294967296;
  };
}

const BLOOMS = [[100, 70], [70, 88], [130, 88], [85, 58], [118, 56], [100, 100], [55, 70], [145, 70], [100, 42]];

function bouquetSVG(p, { size = '100%' } = {}) {
  const r = rng(p.id);
  const leaves = [[-38, 60, 92], [38, 140, 92], [-65, 48, 70], [65, 152, 70], [-15, 78, 50], [15, 122, 50]]
    .map(([rot, x, y]) => `<ellipse cx="${x}" cy="${y}" rx="11" ry="30" transform="rotate(${rot} ${x} ${y})" fill="${p.leaf}" opacity="${0.75 + r() * 0.25}"/>`)
    .join('');
  const blooms = BLOOMS.map(([x, y], i) => {
    const c = p.colors[i % p.colors.length];
    const rad = 13 + r() * 5;
    const rot = r() * 72;
    const petals = Array.from({ length: 5 }, (_, k) => {
      const a = ((rot + k * 72) * Math.PI) / 180;
      return `<circle cx="${(x + Math.cos(a) * rad * 0.55).toFixed(1)}" cy="${(y + Math.sin(a) * rad * 0.55).toFixed(1)}" r="${(rad * 0.62).toFixed(1)}" fill="${c}"/>`;
    }).join('');
    return `<g stroke="rgba(0,0,0,.08)" stroke-width="1">${petals}</g><circle cx="${x}" cy="${y}" r="${(rad * 0.3).toFixed(1)}" fill="rgba(0,0,0,.14)"/>`;
  }).join('');
  return `<svg viewBox="0 0 200 200" width="${size}" height="${size}" role="img" aria-label="${p.name}" xmlns="http://www.w3.org/2000/svg">
    <path d="M60 176 L100 116 L140 176 Z" fill="${p.leaf}" opacity=".55"/>
    ${leaves}${blooms}
    <path d="M42 104 L100 192 L158 104 Q100 124 42 104 Z" fill="${p.paper}" stroke="rgba(0,0,0,.10)" stroke-width="1.5"/>
    <path d="M42 104 L100 192 L72 110 Z" fill="rgba(0,0,0,.05)"/>
    <path d="M86 152 Q100 146 114 152 L112 160 Q100 156 88 160 Z" fill="${p.colors[0]}" opacity=".9"/>
  </svg>`;
}


// ---------------------------------------------------------------- utils
// Serverns adress. Tom = samma domän. Fristående HTML-filer sätter <meta name="jomni-api">.
const API_BASE = (document.querySelector('meta[name="jomni-api"]')?.content || '').replace(/\/$/, '');
const $ = (sel, el = document) => el.querySelector(sel);
const $$ = (sel, el = document) => [...el.querySelectorAll(sel)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const kr = (n) => `${Number(n).toLocaleString('sv-SE')} kr`;
const num = (n, d = 3) => Number(n).toLocaleString('sv-SE', { maximumFractionDigits: d });
const fmtDate = (d) => new Date(`${d}T12:00:00`).toLocaleDateString('sv-SE', { weekday: 'long', day: 'numeric', month: 'long' });
const fmtTime = (iso) => new Date(iso).toLocaleString('sv-SE', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

const store = {
  get(k, d = null) { try { const v = localStorage.getItem(`jomni.${k}`); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { if (v == null) localStorage.removeItem(`jomni.${k}`); else localStorage.setItem(`jomni.${k}`, JSON.stringify(v)); } catch { /* privat läge */ } },
};

const state = {
  config: null,
  products: [],
  cart: store.get('cart', []),
  token: store.get('token'),
  user: null,
  filter: 'Alla',
  checkout: { postcode: '', quote: null, zoneId: null, date: null, slot: null, discountCode: '', pricing: null },
};

async function api(path, { method = 'GET', body } = {}) {
  const res = await fetch(`${API_BASE}/api${path}`, {
    method,
    headers: { 'Content-Type': 'application/json', ...(state.token ? { Authorization: `Bearer ${state.token}` } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const json = await res.json().catch(() => ({}));
  if (res.status === 401 && state.token && path.startsWith('/me')) setSession(null);
  if (!res.ok) throw new Error(json.error || 'Något gick fel.');
  return json;
}

function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.append(el);
  setTimeout(() => el.remove(), 3200);
}

const productById = (id) => state.products.find((p) => p.id === id);
const coinsFor = (kronor) => (Math.floor(kronor) * state.config.loyalty.milliCoinsPerKrona
  * (state.user?.plus.active ? state.config.loyalty.plusMultiplier : 1)) / 1000;

// ---------------------------------------------------------------- session & cart
function setSession(token, user = null) {
  state.token = token;
  state.user = user;
  store.set('token', token);
  renderHeader();
}

async function refreshUser() {
  if (!state.token) return;
  try { state.user = (await api('/me')).user; } catch { /* utloggad */ }
  renderHeader();
}

function saveCart() {
  store.set('cart', state.cart);
  renderHeader();
}

function addToCart(id, qty = 1) {
  const line = state.cart.find((l) => l.productId === id);
  if (line) line.qty = Math.min(20, line.qty + qty);
  else state.cart.push({ productId: id, qty });
  saveCart();
  openCart();
}

function cartSubtotal() {
  return state.cart.reduce((s, l) => s + (productById(l.productId)?.price || 0) * l.qty, 0);
}

function renderHeader() {
  $('#cart-count').textContent = state.cart.reduce((s, l) => s + l.qty, 0);
  $('#wallet-pill').innerHTML = state.user
    ? `<span title="Mynt">🪙 ${num(state.user.coins)}</span><span title="Diamanter">💎 ${num(state.user.diamonds, 4)}</span>${state.user.plus.active ? '<span>✨ Plus</span>' : ''}`
    : '';
}

function openCart() {
  const root = $('#drawer-root');
  const lines = state.cart.filter((l) => productById(l.productId));
  root.innerHTML = `
    <div class="drawer-bg" data-close></div>
    <aside class="drawer" role="dialog" aria-label="Varukorg">
      <header><h3 style="margin:0">Din varukorg</h3><button class="icon-btn" data-close aria-label="Stäng">✕</button></header>
      <div class="items">
        ${lines.length ? lines.map((l) => {
          const p = productById(l.productId);
          return `<div class="line">
            <div class="thumb">${bouquetSVG(p)}</div>
            <div><strong>${esc(p.name)}</strong><div class="muted small">${kr(p.price)}</div>
              <div class="qty" style="margin-top:6px"><button data-dec="${p.id}" aria-label="Minska">−</button><span>${l.qty}</span><button data-inc="${p.id}" aria-label="Öka">+</button></div>
            </div>
            <strong>${kr(p.price * l.qty)}</strong>
          </div>`;
        }).join('') : '<p class="muted" style="padding:30px 0;text-align:center">Varukorgen är tom. 🌷</p>'}
      </div>
      ${lines.length ? `<footer>
        <div class="sum-row"><span>Summa</span><strong>${kr(cartSubtotal())}</strong></div>
        <p class="coin-hint">Du får ${num(coinsFor(cartSubtotal()))} 🪙 mynt på köpet${state.user ? '' : ' (logga in)'}</p>
        <a class="btn block" href="#/kassa" data-close>Till kassan</a>
      </footer>` : ''}
    </aside>`;
  root.onclick = (e) => {
    const t = e.target.closest('[data-close],[data-inc],[data-dec]');
    if (!t) return;
    if (t.dataset.close !== undefined) { root.innerHTML = ''; return; }
    const id = t.dataset.inc || t.dataset.dec;
    const line = state.cart.find((l) => l.productId === id);
    line.qty += t.dataset.inc ? 1 : -1;
    line.qty = Math.min(20, line.qty);
    state.cart = state.cart.filter((l) => l.qty > 0);
    saveCart();
    openCart();
  };
}

async function loadQuote(postcode, date) {
  const co = state.checkout;
  co.postcode = postcode;
  const box = $('#delivery-options');
  try {
    co.quote = await api('/delivery/quote', { method: 'POST', body: { postcode, date } });
    if (!co.quote.options.some((o) => o.id === co.zoneId)) { co.zoneId = co.quote.options[0].id; co.slot = null; }
    const opt = co.quote.options.find((o) => o.id === co.zoneId);
    if (!date || date !== opt.date) co.date = opt.date;
    if (!opt.slots.some((s) => s.id === co.slot)) co.slot = opt.slots[0]?.id || null;
    renderDeliveryOptions();
    updatePricing();
  } catch (e) {
    co.quote = null;
    box.innerHTML = `<p class="error">${esc(e.message)}</p>`;
    updatePricing();
  }
}

function renderDeliveryOptions() {
  const co = state.checkout;
  const opt = co.quote.options.find((o) => o.id === co.zoneId);
  const sub = cartSubtotal();
  $('#delivery-options').innerHTML = `
    <div class="options">${co.quote.options.map((o) => {
      const fee = o.freeOver != null && sub >= o.freeOver ? 0 : o.fee;
      return `<label class="option ${o.id === co.zoneId ? 'selected' : ''}">
        <input type="radio" name="zone" value="${o.id}" ${o.id === co.zoneId ? 'checked' : ''}>
        <div><strong>${esc(o.name)} · ${fee ? kr(fee) : 'Gratis'}</strong><div class="small muted">${esc(o.description)}${o.freeOver ? ` Fri frakt över ${kr(o.freeOver)}.` : ''}</div>
        <div class="small">Tidigast ${fmtDate(o.earliestDate)}</div></div>
      </label>`;
    }).join('')}</div>
    <label><span>Leveransdag</span><input type="date" name="date" value="${co.date}" min="${opt.earliestDate}" max="${opt.maxDate}" required></label>
    ${opt.hasSlots ? `<span class="small" style="font-weight:500">Tidsfönster</span>
      <div class="slots">${opt.slots.length ? opt.slots.map((s) => `<button type="button" data-slot="${s.id}" class="${s.id === co.slot ? 'active' : ''}">${esc(s.label)}</button>`).join('')
        : '<span class="error">Inga lediga tider den dagen – välj en annan dag.</span>'}</div>` : '<p class="small muted">PostNord delar ut under dagen. Leverans måndag–fredag.</p>'}`;
  $$('input[name="zone"]').forEach((r) => { r.onchange = () => { co.zoneId = r.value; co.slot = null; loadQuote(co.postcode, co.date); }; });
  $('input[name="date"]').onchange = (e) => loadQuote(co.postcode, e.target.value);
  $$('[data-slot]').forEach((b) => { b.onclick = () => { co.slot = b.dataset.slot; renderDeliveryOptions(); }; });
}

async function updatePricing() {
  const co = state.checkout;
  const box = $('#summary');
  if (!box) return;
  try {
    co.pricing = await api('/cart/price', { method: 'POST', body: { items: state.cart, discountCode: co.discountCode, zoneId: co.quote ? co.zoneId : null } });
  } catch (e) {
    box.innerHTML = `<p class="error">${esc(e.message)}</p>`;
    return;
  }
  const p = co.pricing;
  box.innerHTML = `
    <h3>Din beställning</h3>
    ${p.lines.map((l) => `<div class="sum-row"><span>${l.qty} × ${esc(l.name)}</span><span>${kr(l.total)}</span></div>`).join('')}
    <div class="sum-row"><span>Leverans</span><span>${co.quote ? (p.deliveryFee ? kr(p.deliveryFee) : 'Gratis') : '–'}</span></div>
    ${p.discount ? `<div class="sum-row ok"><span>${esc(p.discount.label)} (${esc(p.discount.code)})</span><span>−${kr(p.discount.amount)}</span></div>` : ''}
    <div class="sum-row total"><span>Att betala</span><span>${kr(p.total)}</span></div>
    <p class="coin-hint">+${num(coinsFor(p.productTotal))} 🪙 mynt${state.user?.plus.active ? ' · dubbla med Plus ✨' : ''}</p>
    <div class="discount-row" style="margin-top:12px">
      <input id="discount" placeholder="Rabattkod" value="${esc(co.discountCode)}" aria-label="Rabattkod">
      <button type="button" class="btn ghost sm" id="apply-discount">Använd</button>
    </div>
    ${p.discountError ? `<p class="error small" style="margin-top:6px">${esc(p.discountError)}</p>` : ''}`;
  $('#apply-discount').onclick = () => { co.discountCode = $('#discount').value.trim(); updatePricing(); };
  if (elements && p.total >= 3) elements.update({ amount: p.total * 100 });
}

function collectOrder(wallet) {
  const co = state.checkout;
  const form = $('#co-form');
  const f = Object.fromEntries(new FormData(form));
  const err = (m) => { $('#co-error').textContent = m; return null; };
  $('#co-error').textContent = '';
  if (!co.quote) return err('Ange postnummer och välj leveranssätt.');
  const opt = co.quote.options.find((o) => o.id === co.zoneId);
  if (opt.hasSlots && !co.slot) return err('Välj ett tidsfönster för leveransen.');
  for (const el of $$('input[required]', form)) {
    if (!el.value.trim()) { el.focus(); return err('Fyll i alla obligatoriska fält.'); }
  }
  if (!form.email.checkValidity()) { form.email.focus(); return err('Ange en giltig e-postadress.'); }
  if (co.pricing?.discountError) return err('Ta bort eller ändra rabattkoden.');
  return {
    items: state.cart,
    discountCode: co.discountCode,
    wallet,
    customer: { name: f.name, email: f.email, phone: f.phone },
    delivery: {
      recipient: f.recipient, recipientPhone: f.recipientPhone, address: f.address, postcode: co.postcode, city: f.city,
      message: f.message, instructions: f.instructions, zoneId: co.zoneId, date: co.date, slot: opt.hasSlots ? co.slot : null,
    },
  };
}

function rememberOrder(res) {
  const list = store.get('orders', []);
  list.unshift({ id: res.order.id, t: res.trackingToken, number: res.order.number, date: res.order.delivery.date });
  store.set('orders', list.slice(0, 20));
}

function orderPlaced(res) {
  state.cart = [];
  saveCart();
  state.checkout = { ...state.checkout, discountCode: '', pricing: null };
  location.hash = `#/order/${res.order.id}?t=${encodeURIComponent(res.trackingToken)}`;
  refreshUser();
}

async function payDemo(wallet) {
  const body = collectOrder(wallet);
  if (!body) return;
  $$('[data-demo]').forEach((b) => { b.disabled = true; });
  try {
    const res = await api('/orders', { method: 'POST', body });
    rememberOrder(res);
    if (res.payment.mode === 'demo') await api(`/orders/${res.order.id}/demo-pay`, { method: 'POST', body: { t: res.trackingToken, wallet } });
    orderPlaced(res);
  } catch (e) {
    $('#co-error').textContent = e.message;
    $$('[data-demo]').forEach((b) => { b.disabled = false; });
  }
}

async function setupStripe() {
  const Stripe = await waitForStripe();
  const cfg = state.config.payments;
  if (!Stripe || !cfg.stripePublishableKey) { $('#co-error').textContent = 'Kunde inte ladda betalningen.'; return; }
  stripe = stripe || Stripe(cfg.stripePublishableKey, { locale: 'sv' });
  const amount = Math.max(300, (state.checkout.pricing?.total || cartSubtotal()) * 100);
  elements = stripe.elements({
    mode: 'payment', amount, currency: 'sek',
    appearance: { theme: 'stripe', variables: { colorPrimary: '#b8475f', borderRadius: '12px', fontFamily: 'Inter, system-ui, sans-serif' } },
  });
  const express = elements.create('expressCheckout', {
    paymentMethods: { applePay: 'always', googlePay: 'always', link: 'never', amazonPay: 'never', paypal: 'never' },
    buttonType: { applePay: 'buy', googlePay: 'buy' },
    buttonHeight: 50,
  });
  express.mount('#express');
  express.on('click', (ev) => { if (collectOrder(ev.expressPaymentType)) ev.resolve(); });
  express.on('confirm', (ev) => payStripe(ev.expressPaymentType, ev));
  const card = elements.create('payment', { wallets: { applePay: 'never', googlePay: 'never' }, layout: 'tabs' });
  card.mount('#card-element');
  $('#card-pay').onclick = () => payStripe('card');
}

async function payStripe(wallet, expressEvent) {
  const body = collectOrder(wallet);
  if (!body) { expressEvent?.paymentFailed({ reason: 'invalid_shipping_address' }); return; }
  const btn = $('#card-pay');
  btn.disabled = true;
  try {
    const { error: submitError } = await elements.submit();
    if (submitError) throw new Error(submitError.message);
    const res = await api('/orders', { method: 'POST', body });
    rememberOrder(res);
    if (res.payment.mode === 'stripe') {
      const returnUrl = `${location.origin}/#/order/${res.order.id}?t=${encodeURIComponent(res.trackingToken)}`;
      const { error } = await stripe.confirmPayment({
        elements, clientSecret: res.payment.clientSecret, confirmParams: { return_url: returnUrl }, redirect: 'if_required',
      });
      if (error) throw new Error(error.message);
      await api(`/orders/${res.order.id}/confirm`, { method: 'POST', body: { t: res.trackingToken } });
    }
    orderPlaced(res);
  } catch (e) {
    $('#co-error').textContent = e.message;
    expressEvent?.paymentFailed?.();
    btn.disabled = false;
  }
}

// ---------------------------------------------------------------- tracking
let pollTimer = null;
const FLOW = ['paid', 'preparing', 'out_for_delivery', 'delivered'];

async function viewOrder(id, t) {
  clearTimeout(pollTimer);
  let o;
  try {
    ({ order: o } = await api(`/orders/${id}?t=${encodeURIComponent(t || '')}`));
    if (o.status === 'awaiting_payment' && state.config.payments.mode === 'stripe') {
      ({ order: o } = await api(`/orders/${id}/confirm`, { method: 'POST', body: { t } }));
    }
  } catch (e) {
    view().innerHTML = `<div class="page narrow"><h2>Beställningen hittades inte</h2><p>${esc(e.message)}</p></div>`;
    return;
  }
  const reached = (s) => o.history.find((h) => h.status === s);
  const d = o.delivery;
  view().innerHTML = `
    <div class="page narrow">
      ${o.status === 'paid' ? '<p class="chip sage">Tack för din beställning! 💐</p>' : ''}
      <h1>Beställning #${o.number}</h1>
      <p class="muted">Status: <strong>${esc(o.statusLabel)}</strong></p>
      <div class="card">
        ${o.status === 'cancelled' ? '<p class="error">Beställningen är avbruten. Kontakta oss om du har frågor.</p>'
          : o.status === 'awaiting_payment' ? '<p>Vi väntar på bekräftelse av betalningen …</p>'
          : `<ul class="timeline">${FLOW.map((s) => {
            const h = reached(s);
            const label = { paid: 'Beställning mottagen', preparing: 'Buketten binds', out_for_delivery: d.slotLabel ? 'Budet är på väg' : 'Skickad med PostNord', delivered: 'Levererad' }[s];
            return `<li class="${h ? 'done' : ''}">${label}${h ? ` <span class="small muted">· ${fmtTime(h.at)}</span>` : ''}</li>`;
          }).join('')}</ul>`}
        <div class="sum-row"><span>Leverans</span><strong>${esc(fmtDate(d.date))}${d.slotLabel ? ` kl ${esc(d.slotLabel)}` : ''}</strong></div>
        <div class="sum-row"><span>Till</span><span>${esc(d.recipient)}, ${esc(d.address)}, ${esc(d.postcode)} ${esc(d.city)}</span></div>
        <div class="sum-row"><span>Sätt</span><span>${esc(d.zoneName)}</span></div>
        ${d.message ? `<div class="sum-row"><span>Kort</span><em>”${esc(d.message)}”</em></div>` : ''}
        <hr style="border:0;border-top:1px solid var(--line);margin:12px 0">
        ${o.lines.map((l) => `<div class="sum-row"><span>${l.qty} × ${esc(l.name)}</span><span>${kr(l.total)}</span></div>`).join('')}
        <div class="sum-row"><span>Leverans</span><span>${o.deliveryFee ? kr(o.deliveryFee) : 'Gratis'}</span></div>
        ${o.discount ? `<div class="sum-row ok"><span>${esc(o.discount.label)}</span><span>−${kr(o.discount.amount)}</span></div>` : ''}
        <div class="sum-row total"><span>Betalt</span><span>${kr(o.total)}</span></div>
        ${o.coinsEarned ? `<p class="coin-hint">Du fick ${num(o.coinsEarned)} 🪙 mynt${o.plusBonus ? ' (dubbla med Plus ✨)' : ''}</p>` : ''}
      </div>
      <div id="rate"></div>
    </div>`;
  if (o.canRate) {
    let stars = 0;
    $('#rate').innerHTML = `<div class="card" style="margin-top:16px">
      <h3>Hur blev det?</h3><p class="muted">Ge Jomni Blommor ett betyg.</p>
      <div class="stars">${[1, 2, 3, 4, 5].map((n) => `<button data-star="${n}" aria-label="${n} stjärnor">★</button>`).join('')}</div>
      <label style="margin-top:10px"><span>Kommentar (valfritt)</span><textarea id="rate-comment" maxlength="500"></textarea></label>
      <button class="btn" id="rate-send" disabled>Skicka betyg</button> <span class="error" id="rate-err"></span></div>`;
    $$('[data-star]').forEach((b) => {
      b.onclick = () => {
        stars = Number(b.dataset.star);
        $$('[data-star]').forEach((x) => x.classList.toggle('on', Number(x.dataset.star) <= stars));
        $('#rate-send').disabled = false;
      };
    });
    $('#rate-send').onclick = async () => {
      try {
        await api(`/orders/${id}/rate`, { method: 'POST', body: { t, stars, comment: $('#rate-comment').value } });
        toast('Tack för ditt betyg! ⭐');
        viewOrder(id, t);
      } catch (e) { $('#rate-err').textContent = e.message; }
    };
  } else if (o.rating) {
    $('#rate').innerHTML = `<p style="margin-top:16px">Ditt betyg: ${'⭐'.repeat(o.rating.stars)}</p>`;
  }
  if (!['delivered', 'cancelled'].includes(o.status)) {
    pollTimer = setTimeout(() => { if (location.hash.includes(id)) viewOrder(id, t); }, o.status === 'awaiting_payment' ? 4000 : 30000);
  }
}

// ---------------------------------------------------------------- konto
function authForm() {
  let tab = 'login';
  const draw = () => {
    view().innerHTML = `
      <div class="page narrow">
        <h2>Ditt konto</h2>
        <p class="muted">Logga in för att samla 🪙 mynt, växla till 💎 diamanter och se dina beställningar.</p>
        <div class="tabs"><button data-tab="login" class="${tab === 'login' ? 'active' : ''}">Logga in</button><button data-tab="register" class="${tab === 'register' ? 'active' : ''}">Skapa konto</button></div>
        <form class="card" id="auth">
          ${tab === 'register' ? '<label><span>Namn</span><input name="name" autocomplete="name" required></label>' : ''}
          <label><span>E-post</span><input name="email" type="email" autocomplete="email" required></label>
          <label><span>Lösenord</span><input name="password" type="password" autocomplete="${tab === 'login' ? 'current-password' : 'new-password'}" minlength="8" required></label>
          <p class="error" id="auth-err"></p>
          <button class="btn block">${tab === 'login' ? 'Logga in' : 'Skapa konto'}</button>
        </form>
        ${guestOrders()}
      </div>`;
    $$('[data-tab]').forEach((b) => { b.onclick = () => { tab = b.dataset.tab; draw(); }; });
    $('#auth').onsubmit = async (e) => {
      e.preventDefault();
      const f = Object.fromEntries(new FormData(e.target));
      try {
        const res = await api(`/auth/${tab}`, { method: 'POST', body: f });
        setSession(res.token, res.user);
        toast(tab === 'login' ? `Välkommen tillbaka, ${res.user.name}!` : 'Välkommen till Jomni Blommor! 🌸');
        route();
      } catch (err) { $('#auth-err').textContent = err.message; }
    };
  };
  draw();
}

function guestOrders() {
  const list = store.get('orders', []);
  if (!list.length) return '';
  return `<div class="card" style="margin-top:16px"><h3>Beställningar från den här enheten</h3>
    ${list.map((o) => `<div class="list-item"><span>#${o.number} · ${esc(o.date)}</span><a href="#/order/${esc(o.id)}?t=${encodeURIComponent(o.t)}">Följ</a></div>`).join('')}</div>`;
}

async function viewAccount() {
  if (!state.token) { authForm(); return; }
  await refreshUser();
  const u = state.user;
  if (!u) { authForm(); return; }
  view().innerHTML = `
    <div class="page">
      <h2>Hej ${esc(u.name)}! 🌷</h2>
      ${balancesHTML(u)}
      <div class="card"><h3>Mina beställningar</h3><div id="my-orders" class="muted">Laddar …</div></div>
      ${u.rewards.length ? `<div class="card" style="margin-top:16px"><h3>Mina belöningskoder</h3>
        ${u.rewards.map((r) => `<div class="list-item"><span>${esc(r.label)}</span><span class="code" style="${r.used ? 'text-decoration:line-through;opacity:.5' : ''}">${esc(r.code)}</span></div>`).join('')}</div>` : ''}
      <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">
        <a class="btn" href="#/beloningar">Växla mynt & belöningar</a>
        <button class="btn ghost" id="logout">Logga ut</button>
        <button class="btn ghost" id="delete-account" style="color:var(--danger)">Radera konto</button>
      </div>
    </div>`;
  $('#logout').onclick = async () => { await api('/auth/logout', { method: 'POST' }).catch(() => {}); setSession(null); route(); };
  $('#delete-account').onclick = async () => {
    const password = prompt('Radera ditt konto för alltid? Mynt, diamanter och belöningskoder försvinner. Skriv ditt lösenord för att bekräfta:');
    if (!password) return;
    try {
      await api('/me', { method: 'DELETE', body: { password } });

      toast('Ditt konto är raderat.');
      route();
    } catch (e) { toast(e.message); }

  try {
    const { orders } = await api('/me/orders');
    $('#my-orders').innerHTML = orders.length ? orders.map((o) => `
      <div class="list-item"><div><strong>#${o.number}</strong> · ${o.lines.map((l) => `${l.qty}× ${esc(l.name)}`).join(', ')}<div class="small muted">${esc(fmtDate(o.delivery.date))} · ${esc(o.statusLabel)}</div></div>
      <a class="btn ghost sm" href="#/order/${o.id}?t=${encodeURIComponent(o.trackingToken)}">${o.canRate ? 'Betygsätt' : 'Följ'}</a></div>`).join('')

  } catch (e) { $('#my-orders').textContent = e.message; }
}

// ---------------------------------------------------------------- router
function route() {
  const [path, qs] = (location.hash.slice(1) || '/').split('?');
  const parts = path.split('/').filter(Boolean);
  const q = new URLSearchParams(qs || '');
  $$('[data-nav]').forEach((a) => a.classList.toggle('active', (a.dataset.nav === 'shop' && !parts.length) || a.dataset.nav === parts[0]));
  if (parts[0] !== 'kassa') elements = null;
  window.scrollTo(0, 0);
  switch (parts[0]) {
    case undefined: case 'buketter': return viewShop();
    case 'bukett': return viewProduct(parts[1]);
    case 'kassa': return viewCheckout();
    case 'order': return viewOrder(parts[1], q.get('t'));
    case 'konto': return viewAccount();
    case 'beloningar': return viewRewards();
    default: return viewShop();
  }
}

async function init() {
  $('#cart-btn').onclick = openCart;
  try {
    const [config, { products }] = await Promise.all([api('/config'), api('/products')]);
    state.config = config;
    state.products = products;
  } catch {
    view().innerHTML = '<div class="page"><h2>Butiken är inte nåbar just nu</h2><p>Försök igen om en stund.</p></div>';
    return;
  }
  await refreshUser();
  const params = new URLSearchParams(location.search);
  if (params.get('plus') === 'success' && params.get('session_id') && state.token) {
    try {
      state.user = (await api('/plus/confirm', { method: 'POST', body: { sessionId: params.get('session_id') } })).user;
      toast('Välkommen till Jomni Plus! ✨ Nu får du dubbla mynt.');
    } catch (e) { toast(e.message); }
    history.replaceState(null, '', `/${location.hash}`);
  }
  renderHeader();
  window.addEventListener('hashchange', route);
  route();
}

init();
