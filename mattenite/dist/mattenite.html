    gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
    return b;
  }

  function ibuf(data) {
    var b = gl.createBuffer();
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, b);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, data, gl.STATIC_DRAW);
    return b;
  }

  var PILLARS = [];

  function buildMeshes() {
    // Golv
    var f = new Builder();
    f.p.push(-R, 0, -R, R, 0, -R, R, 0, R, -R, 0, R);
    for (var k = 0; k < 4; k++) { f.n.push(0, 1, 0); f.c.push(0.06, 0.09, 0.20); }
    f.u.push(0, 0, 1, 0, 1, 1, 0, 1);
    f.i.push(0, 1, 2, 0, 2, 3);
    meshes.floor = f.upload();

    // Väggar runt arenan
    var w = new Builder();
    var t = 0.7, h = 3.4;
    w.box(0, h / 2, -R - t / 2, R * 2 + t * 2, h, t, [0.16, 0.13, 0.34], [0.42, 0.30, 0.86]);
    w.box(0, h / 2, R + t / 2, R * 2 + t * 2, h, t, [0.16, 0.13, 0.34], [0.42, 0.30, 0.86]);
    w.box(-R - t / 2, h / 2, 0, t, h, R * 2 + t * 2, [0.14, 0.12, 0.31], [0.42, 0.30, 0.86]);
    w.box(R + t / 2, h / 2, 0, t, h, R * 2 + t * 2, [0.14, 0.12, 0.31], [0.42, 0.30, 0.86]);
    meshes.walls = w.upload();

    // Neonlist längs väggarnas nederkant — ger arenan konturer
    var tr = new Builder();
    var neon = [0.36, 0.92, 0.86];
    tr.box(0, 0.10, -R + 0.05, R * 2, 0.2, 0.12, neon, neon);
    tr.box(0, 0.10, R - 0.05, R * 2, 0.2, 0.12, neon, neon);
    tr.box(-R + 0.05, 0.10, 0, 0.12, 0.2, R * 2, neon, neon);
    tr.box(R - 0.05, 0.10, 0, 0.12, 0.2, R * 2, neon, neon);
    meshes.trim = tr.upload();

    // Pelare
    PILLARS = [
      { x: -6.5, z: -6.5, w: 2.2, d: 2.2, h: 3.0 },
      { x: 6.5, z: -6.5, w: 2.2, d: 2.2, h: 3.0 },
      { x: -6.5, z: 6.5, w: 2.2, d: 2.2, h: 3.0 },
      { x: 6.5, z: 6.5, w: 2.2, d: 2.2, h: 3.0 },
      { x: 0, z: 0, w: 3.0, d: 3.0, h: 2.2 },
      { x: 0, z: -10, w: 4.0, d: 1.0, h: 1.5 },
      { x: 0, z: 10, w: 4.0, d: 1.0, h: 1.5 },
      { x: -10, z: 0, w: 1.0, d: 4.0, h: 1.5 },
      { x: 10, z: 0, w: 1.0, d: 4.0, h: 1.5 }
    ];
    var p = new Builder();
    PILLARS.forEach(function (b) {
      p.box(b.x, b.h / 2, b.z, b.w, b.h, b.d, [0.13, 0.16, 0.38], [0.00, 0.78, 0.70]);
    });
    meshes.pillars = p.upload();

    // Spelarkropp (två lådor) och bomb
    var body = new Builder();
    body.box(0, 0.55, 0, 0.72, 1.10, 0.52, [1, 1, 1], [1, 1, 1]);
    body.box(0, 1.34, 0, 0.52, 0.48, 0.48, [1, 1, 1], [1, 1, 1]);
    meshes.body = body.upload();

    meshes.bomb = new Builder().sphere(0.30, 14, 10, [0.10, 0.10, 0.14]).upload();
    meshes.glow = new Builder().sphere(1.0, 12, 8, [1, 0.35, 0.35]).upload();
    meshes.quad = new Builder().quad(1, 1, [1, 1, 1]).upload();

    // Sotfläck efter en explosion
    var sc = new Builder();
    sc.p.push(-1, 0, -1, 1, 0, -1, 1, 0, 1, -1, 0, 1);
    for (var q = 0; q < 4; q++) { sc.n.push(0, 1, 0); sc.c.push(0.02, 0.02, 0.03); }
    sc.u.push(0, 0, 1, 0, 1, 1, 0, 1);
    sc.i.push(0, 1, 2, 0, 2, 3);
    meshes.scorch = sc.upload();
  }

  /* ---------- Texturer ------------------------------------------------- */

  function texFromCanvas(cv) {
    var t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, cv);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return t;
  }

  function avatarTexture(emoji, name, color) {
    var cv = document.createElement('canvas');
    cv.width = cv.height = 128;
    var c = cv.getContext('2d');
    c.clearRect(0, 0, 128, 128);
    c.fillStyle = color;
    c.beginPath();
    c.arc(64, 58, 40, 0, Math.PI * 2);
    c.fill();
    c.font = '54px sans-serif';
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.fillText(emoji, 64, 58);
    c.font = 'bold 20px sans-serif';
    c.fillStyle = '#ffffff';
    c.fillText(name.slice(0, 9), 64, 112);
    return texFromCanvas(cv);
  }

  function sparkTexture() {
    var cv = document.createElement('canvas');
    cv.width = cv.height = 64;
    var c = cv.getContext('2d');
    var g = c.createRadialGradient(32, 32, 2, 32, 32, 30);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(0.35, 'rgba(255,199,58,0.95)');
    g.addColorStop(1, 'rgba(255,77,109,0)');
    c.fillStyle = g;
    c.fillRect(0, 0, 64, 64);
    return texFromCanvas(cv);
  }

  /* ======================================================================
     Ritning
     ====================================================================== */

  function bindMesh(m) {
    gl.bindBuffer(gl.ARRAY_BUFFER, m.pos); gl.enableVertexAttribArray(loc.aPos); gl.vertexAttribPointer(loc.aPos, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, m.nrm); gl.enableVertexAttribArray(loc.aNrm); gl.vertexAttribPointer(loc.aNrm, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, m.col); gl.enableVertexAttribArray(loc.aCol); gl.vertexAttribPointer(loc.aCol, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, m.uv); gl.enableVertexAttribArray(loc.aUV); gl.vertexAttribPointer(loc.aUV, 2, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, m.idx);
  }

  function draw(mesh, model, opts) {
    opts = opts || {};
    gl.uniformMatrix4fv(loc.uModel, false, model);
    gl.uniform1f(loc.uUseTex, opts.tex ? 1 : 0);
    gl.uniform1f(loc.uGrid, opts.grid ? 1 : 0);
    gl.uniform1f(loc.uAlpha, opts.alpha === undefined ? 1 : opts.alpha);
    gl.uniform1f(loc.uEmissive, opts.emissive || 0);
    var t = opts.tint || [1, 1, 1];
    gl.uniform3f(loc.uTint, t[0], t[1], t[2]);
    if (opts.tex) {
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, opts.tex);
      gl.uniform1i(loc.uTex, 0);
    }
    bindMesh(mesh);
    gl.drawElements(gl.TRIANGLES, mesh.count, gl.UNSIGNED_SHORT, 0);
  }

  /* ======================================================================
     Spelvärld
     ====================================================================== */

  var S = null;   // rundans tillstånd
  A.state = function () { return S; };
  A.pillars = function () { return PILLARS; };

  var COLORS = ['#7c5cff', '#00e5c8', '#ffc73a', '#ff4d6d', '#3ddc84', '#f472b6'];

  function inPillar(x, z, pad) {
    for (var i = 0; i < PILLARS.length; i++) {
      var b = PILLARS[i];
      if (Math.abs(x - b.x) < b.w / 2 + pad && Math.abs(z - b.z) < b.d / 2 + pad) return b;
    }
    return null;
  }

  function freeSpot(pad) {
    for (var tries = 0; tries < 200; tries++) {
      var x = (Math.random() * 2 - 1) * (R - 1.4);
      var z = (Math.random() * 2 - 1) * (R - 1.4);
      if (!inPillar(x, z, pad)) return { x: x, z: z };
    }
    return { x: 0, z: R - 2 };
  }

  function collide(p, nx, nz) {
    var lim = R - PR - 0.35;
    nx = Math.max(-lim, Math.min(lim, nx));
    nz = Math.max(-lim, Math.min(lim, nz));
    if (!inPillar(nx, p.z, PR)) p.x = nx;
    if (!inPillar(p.x, nz, PR)) p.z = nz;
  }

  A.start = function (cfg) {
    cfg = cfg || {};
    var diff = cfg.diff || 2;
    var bots = cfg.bots === undefined ? 3 : cfg.bots;

    S = {
      cfg: { diff: diff, bots: bots, cat: cfg.cat || 'mix' },
      players: [], mines: [], scorches: [], particles: [],
      bomb: null, phase: 'roam', q: null, qShownAt: 0, round: 0,
      feed: [], startedAt: Date.now(), over: false,
      shake: 0, flash: 0, ticked: 0,
      m: { correct: 0, wrong: 0, streak: 0, best: 0, throws: 0, mines: 0, booms: 0, kos: 0, walked: 0 }
    };

    var spot = spawnSpot(0);
    S.players.push({
      id: 'you', name: M.profile.name, av: M.profile.avatar, you: true,
      x: spot.x, z: spot.z, yaw: Math.atan2(-spot.x, spot.z), pitch: 0,
      lives: LIVES, alive: true, skill: 1, color: COLORS[0], tex: null
    });

    var avs = M.shuffle(M.AVATARS.filter(function (a) { return a !== M.profile.avatar; }));
    var names = M.shuffle(M.BOT_NAMES.slice());
    for (var i = 0; i < bots; i++) {
      var sp = spawnSpot(i + 1, bots + 1);
      S.players.push({
        id: 'b' + i, name: names[i], av: avs[i % avs.length], you: false,
        x: sp.x, z: sp.z, yaw: Math.random() * 6.28, pitch: 0,
        lives: LIVES, alive: true, skill: 0.5 + Math.random() * 0.45,
        color: COLORS[(i + 1) % COLORS.length], tex: null,
        wx: 0, wz: 0, thinkAt: 0
      });
    }
    S.players.forEach(function (p) {
      p.tex = avatarTexture(p.av, p.you ? 'Du' : p.name, p.color);
      newWaypoint(p);
    });

    placeMines();
    say('🕳️ ' + S.mines.length + ' osynliga bomber ligger i arenan. Gå försiktigt.');
    M.bump('arena3dGames');
    M.save();
  };

  /* Startpositioner på en ring runt mitten, med fritt utrymme runt sig. */
  function spawnSpot(index, total) {
    var ang = (index / (total || 6)) * Math.PI * 2 + Math.random() * 0.4;
    var rad = R - 3.2;
    for (var k = 0; k < 12; k++) {
      var x = Math.cos(ang) * rad, z = Math.sin(ang) * rad;
      if (!inPillar(x, z, 1.2)) return { x: x, z: z };
      ang += 0.35;
    }
    return freeSpot(1.0);
  }

  function placeMines() {
    S.mines = [];
    var n = 8 + S.cfg.diff * 3;
    for (var i = 0; i < n; i++) {
      var s = freeSpot(1.0);
      S.mines.push({ x: s.x, z: s.z });
    }
  }

  function newWaypoint(p) {
    var s = freeSpot(0.9);
    p.wx = s.x; p.wz = s.z;
  }

  function say(txt) {
    S.feed.unshift(txt);
    if (S.feed.length > 20) S.feed.pop();
    if (A.onFeed) A.onFeed();
  }

  function alive() { return S.players.filter(function (p) { return p.alive; }); }
  function you() { return S.players[0]; }
  A.you = you;

  /* ---------- Bomben ---------------------------------------------------- */

  var LIVES = 2;

  function bombTime() {
    var base = M.DIFFS[S.cfg.diff - 1].time * 0.62;
    return Math.max(5, base - S.round * 0.8);
  }

  function triggerMine(p, mi) {
    S.mines.splice(mi, 1);
    S.bomb = { holder: p, t: bombTime(), max: bombTime(), fly: null, thrower: null };
    if (p.you) {
      S.m.mines++;
      M.bump('minesStepped');
      M.ui.buzz([60, 40, 60]);
      M.ui.sfx.boom();
      say('💥 Du trampade på en osynlig bomb!');
      askQuestion();
    } else {
      say('💣 ' + p.name + ' trampade på en bomb.');
      M.ui.sfx.throwIt();
      botThink();
    }
    if (A.onPhase) A.onPhase();
  }

  function askQuestion() {
    S.q = M.question(S.cfg.cat, S.cfg.diff);
    S.qShownAt = Date.now();
    S.phase = 'answer';
    if (A.onQuestion) A.onQuestion();
  }

  function botThink() {
    var b = S.bomb.holder;
    S.bomb.thinkAt = Date.now() + (1300 + (1 - b.skill) * 2400) * (0.7 + Math.random() * 0.6);
  }

  A.answer = function (idx) {
    if (S.phase !== 'answer' || !S.q) return;
    var right = idx === S.q.correct;
    var ms = Date.now() - S.qShownAt;

    M.bump('answers');
    if (right) {
      S.m.correct++;
      S.m.streak++;
      S.m.best = Math.max(S.m.best, S.m.streak);
      M.bump('correct');
      M.bump('cat_' + S.q.cat);
      M.setMax('bestStreak', S.m.streak);
      if (S.q.answer === 42) M.bump('answer42');
      if (ms < 3000) M.bump('fastAnswers3');
      if (ms < 1500) M.bump('fastAnswers15');
      M.ui.sfx.right();
      M.ui.buzz(20);
      S.phase = 'throw';
      say('✅ Rätt! Sikta på någon och kasta.');
    } else {
      S.m.wrong++;
      S.m.streak = 0;
      M.bump('wrong');
      M.ui.sfx.wrong();
      M.ui.buzz([40, 60, 40]);
      S.bomb.t = Math.max(0.4, S.bomb.t - 2);
      say('❌ Fel — två sekunder brann upp.');
      setTimeout(function () { if (S && S.phase === 'answer') askQuestion(); }, 500);
      if (A.onQuestion) A.onQuestion();
      return;
    }
    if (A.onPhase) A.onPhase();
  };

  /* Kasta bomben: mot ett id, eller mot den man siktar på. */
  A.throwAt = function (id) {
    if (S.phase !== 'throw' || !S.bomb) return;
    var target = null;
    if (id) {
      S.players.forEach(function (p) { if (p.id === id && p.alive) target = p; });
    } else {
      target = aimTarget() || nearestOther(you());
    }
    if (!target) return;
    doThrow(S.bomb.holder, target);
    S.m.throws++;
    M.bump('throws');
    if (S.bomb && S.bomb.t < 1) M.bump('clutchThrows');
  };

  function doThrow(from, to) {
    var b = S.bomb;
    b.thrower = from;
    b.fly = { fromX: from.x, fromZ: from.z, toX: to.x, toZ: to.z, t: 0, dur: 0.45, target: to };
    S.phase = 'fly';
    S.q = null;
    M.ui.sfx.throwIt();
    say('🤾 ' + (from.you ? 'Du' : from.name) + ' → ' + (to.you ? 'dig' : to.name));
    if (A.onPhase) A.onPhase();
  }

  function landBomb() {
    var b = S.bomb;
    var to = b.fly.target;
    b.holder = to;
    b.fly = null;
    if (to.you) {
      say('💣 Du fick bomben!');
      M.ui.buzz([50, 30, 50]);
      askQuestion();
    } else {
      S.phase = 'roam';
      botThink();
    }
    if (A.onPhase) A.onPhase();
  }

  function aimTarget() {
    var me = you(), best = null, bestDot = 0.86;
    S.players.forEach(function (p) {
      if (p === me || !p.alive) return;
      var dx = p.x - me.x, dz = p.z - me.z;
      var d = Math.sqrt(dx * dx + dz * dz) || 1;
      var fx = Math.sin(me.yaw), fz = -Math.cos(me.yaw);
      var dot = (dx / d) * fx + (dz / d) * fz;
      if (dot > bestDot) { bestDot = dot; best = p; }
    });
    return best;
  }
  A.aimTarget = aimTarget;

  function nearestOther(me) {
    var best = null, bd = 1e9;
    S.players.forEach(function (p) {
      if (p === me || !p.alive) return;
      var d = (p.x - me.x) * (p.x - me.x) + (p.z - me.z) * (p.z - me.z);
      if (d < bd) { bd = d; best = p; }
    });
    return best;
  }

  function explode() {
    var b = S.bomb, h = b.holder;
    S.scorches.push({ x: h.x, z: h.z, t: 0 });
    for (var i = 0; i < 22; i++) {
      S.particles.push({
        x: h.x, y: 0.6 + Math.random(), z: h.z,
        vx: (Math.random() - 0.5) * 6, vy: 2 + Math.random() * 4, vz: (Math.random() - 0.5) * 6,
        life: 0.9 + Math.random() * 0.5, max: 1.4, size: 0.5 + Math.random()
      });
    }
    M.ui.sfx.boom();
    S.flash = 1;
    if (h.you) {
      S.shake = 1;
      S.m.booms++;
      M.bump('booms');
      M.ui.buzz([90, 60, 120]);
    }
    if (b.thrower && b.thrower.you && !h.you && h.lives === 1) { S.m.kos++; M.bump('knockouts'); }

    h.lives--;
    say('💥 BOOM! ' + (h.you ? 'Du' : h.name) + ' sprängdes.');
    if (h.lives <= 0) {
      h.alive = false;
      say('☠️ ' + (h.you ? 'Du är utslagen' : h.name + ' är ute'));
      if (h.you) M.ui.sfx.lose();
    }

    S.bomb = null;
    S.q = null;
    S.phase = 'roam';
    S.round++;

    if (alive().length <= 1) return endRound();
    if (!you().alive) {
      say('📺 Du är ute — rundan är slut för din del.');
      setTimeout(function () { if (S && !S.over) endRound(); }, 1400);
      return;
    }
    if (S.mines.length < 6) placeMines();
    if (A.onPhase) A.onPhase();
  }

  /* ---------- Rundans slut ---------------------------------------------- */

  function endRound() {
    if (S.over) return;
    S.over = true;
    S.phase = 'over';
    var live = alive();
    var win = live.length === 1 && live[0].you;
    var wasLocked = !M.arcadeUnlocked();
    var secs = Math.round((Date.now() - S.startedAt) / 1000);
    M.bump('secondsPlayed', secs);

    var coins = 12 + S.m.correct * 2 + S.cfg.diff * 5;
    var xp = 20 + S.m.correct * 3;

    if (win) {
      M.bump('arena3dWins');
      M.bump('wins');
      M.profile.stats.winStreak++;
      M.setMax('bestWinStreak', M.profile.stats.winStreak);
      if (S.m.mines === 0) M.bump('noMineWins');
      if (you().lives === LIVES) M.bump('arenaFlawless');
      coins += 40 + S.cfg.diff * 10;
      xp += 70;
    } else {
      M.profile.stats.winStreak = 0;
    }
    M.bump('gamesPlayed');
    M.setMax('arenaBestStreak', S.m.best);
    M.bump('walkedMeters', Math.round(S.m.walked));

    M.addCoins(coins, true);
    var lv = M.addXp(xp);
    M.pushHistory({ mode: 'arena', win: win, result: (win ? 'Sist kvar' : 'Utslagen') + ' · ' + S.m.correct + ' rätt' });
    M.save();

    var fresh = M.checkAchievements();
    var justUnlocked = wasLocked && M.arcadeUnlocked();

    if (A.onOver) A.onOver({ win: win, coins: coins, xp: xp, levels: lv.levels, fresh: fresh, unlocked: justUnlocked, secs: secs });
  }

  A.quit = function () {
    if (S && !S.over) {
      M.bump('secondsPlayed', Math.round((Date.now() - S.startedAt) / 1000));
      M.save();
    }
    S = null;
    stopLoop();
  };

  /* ======================================================================
     Uppdatering
     ====================================================================== */

  var input = { fx: 0, fz: 0, look: 0, lookY: 0 };
  A.input = input;

  function update(dt) {
    if (!S || S.over) return;
    var me = you();

    // Din rörelse
    if (me.alive) {
      me.yaw += input.look * dt * 2.6;
      me.pitch = Math.max(-0.55, Math.min(0.55, me.pitch + input.lookY * dt * 2.0));
      input.look *= 0.82;
      input.lookY *= 0.82;

      var frozen = S.phase === 'answer';
      if (!frozen) {
        var fwd = input.fz, str = input.fx;
        var len = Math.sqrt(fwd * fwd + str * str);
        if (len > 1) { fwd /= len; str /= len; }
        var sinY = Math.sin(me.yaw), cosY = Math.cos(me.yaw);
        var dx = (sinY * -fwd + cosY * str) * SPEED * dt;
        var dz = (-cosY * -fwd + sinY * str) * SPEED * dt;
        if (dx || dz) {
          collide(me, me.x + dx, me.z + dz);
          S.m.walked += Math.sqrt(dx * dx + dz * dz);
        }
      }
    }

    // Botarna
    S.players.forEach(function (p) {
      if (p.you || !p.alive) return;
      var tx = p.wx, tz = p.wz;
      var holder = S.bomb && S.bomb.holder;
      if (holder && holder !== p && holder.alive) {
        // fly från den som håller i bomben
        var away = Math.atan2(p.x - holder.x, -(p.z - holder.z));
        tx = p.x + Math.sin(away) * 6;
        tz = p.z - Math.cos(away) * 6;
      }
      var dx = tx - p.x, dz = tz - p.z;
      var d = Math.sqrt(dx * dx + dz * dz);
      if (d < 0.6 && !holder) newWaypoint(p);
      if (d > 0.001) {
        var step = BOT_SPEED * dt * (holder === p ? 0.6 : 1);
        var nx = p.x + dx / d * step, nz = p.z + dz / d * step;
        var before = p.x + '|' + p.z;
        collide(p, nx, nz);
        if (before === p.x + '|' + p.z) newWaypoint(p);
        p.yaw = Math.atan2(dx, -dz);
      }
    });

    // Minor — bara när ingen har bomben
    if (!S.bomb) {
      for (var i = S.mines.length - 1; i >= 0; i--) {
        var mn = S.mines[i];
        for (var j = 0; j < S.players.length; j++) {
          var p = S.players[j];
          if (!p.alive) continue;
          var dd = (p.x - mn.x) * (p.x - mn.x) + (p.z - mn.z) * (p.z - mn.z);
          if (dd < MINE_R * MINE_R) { triggerMine(p, i); break; }
        }
        if (S.bomb) break;
      }
    }

    // Bomben
    if (S.bomb) {
      var b = S.bomb;
      if (b.fly) {
        b.fly.t += dt;
        b.fly.toX = b.fly.target.x;
        b.fly.toZ = b.fly.target.z;
        if (b.fly.t >= b.fly.dur) landBomb();
      } else {
        b.t -= dt;
        if (b.t <= 3 && Math.floor(b.t * 2) !== S.ticked) { S.ticked = Math.floor(b.t * 2); M.ui.sfx.tick(); }
        if (b.t <= 0) { explode(); return; }
        if (!b.holder.you && S.phase === 'roam' && b.thinkAt && Date.now() >= b.thinkAt) {
          var ok = Math.random() < (b.holder.skill - (S.cfg.diff - 2) * 0.06);
          if (ok) {
            var t2 = nearestOther(b.holder);
            if (t2) doThrow(b.holder, t2);
          } else {
            b.t = Math.max(0.4, b.t - 2);
            say('❌ ' + b.holder.name + ' svarade fel (−2 s)');
            botThink();
          }
        }
      }
    }

    // Effekter
    S.particles.forEach(function (q) {
      q.life -= dt;
      q.x += q.vx * dt; q.y += q.vy * dt; q.z += q.vz * dt;
      q.vy -= 9 * dt;
    });
    S.particles = S.particles.filter(function (q) { return q.life > 0; });
    S.scorches.forEach(function (s) { s.t += dt; });
    if (S.scorches.length > 12) S.scorches.shift();
    S.shake = Math.max(0, S.shake - dt * 2);
    S.flash = Math.max(0, S.flash - dt * 2.5);
  }

  /* ---------- Närmaste mina (för minsökaren) ---------------------------- */

  A.mineProximity = function () {
    if (!S || S.bomb) return 0;
    var me = you(), best = 1e9;
    S.mines.forEach(function (m) {
      var d = Math.sqrt((me.x - m.x) * (me.x - m.x) + (me.z - m.z) * (me.z - m.z));
      if (d < best) best = d;
    });
    var range = 2.2 + (4 - S.cfg.diff) * 0.5;
    return best > range ? 0 : 1 - best / range;
  };

  /* ======================================================================
     Rendering
     ====================================================================== */

  function render() {
    if (!S || !gl) return;
    var me = you();
    var w = canvas.width, h = canvas.height;
    gl.viewport(0, 0, w, h);
    gl.clearColor(0.03, 0.04, 0.10, 1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    var shake = S.shake * 0.09;
    var proj = perspective(1.15, w / h, 0.1, 90);
    var camY = EYE + (Math.random() - 0.5) * shake;
    var view = multiply(
      multiply(rotationX(-me.pitch), rotationY(-me.yaw)),
      translation(-me.x, -camY, -me.z)
    );

    gl.uniformMatrix4fv(loc.uProj, false, proj);
    gl.uniformMatrix4fv(loc.uView, false, view);
    gl.uniform3f(loc.uFogCol, 0.04, 0.05, 0.13);

    draw(meshes.floor, mat4(), { grid: true });
    draw(meshes.walls, mat4(), {});
    draw(meshes.trim, mat4(), { emissive: 1 });
    draw(meshes.pillars, mat4(), {});

    S.scorches.forEach(function (s) {
      draw(meshes.scorch, multiply(translation(s.x, 0.02, s.z), scaling(1.5, 1, 1.5)), { alpha: 0.75, emissive: 1 });
    });

    // Spelare
    S.players.forEach(function (p) {
      if (!p.alive || p.you) return;
      var isHolder = S.bomb && S.bomb.holder === p && !S.bomb.fly;
      var c = hexToRgb(p.color);
      var model = multiply(translation(p.x, 0, p.z), rotationY(p.yaw));
      draw(meshes.body, model, { tint: isHolder ? [1.4, 0.5, 0.5] : c, emissive: isHolder ? 0.5 : 0 });

      // namnskylt som alltid vänder sig mot kameran
      var bill = multiply(multiply(translation(p.x, 2.35, p.z), rotationY(me.yaw)), scaling(1.1, 1.1, 1.1));
      draw(meshes.quad, bill, { tex: p.tex, emissive: 1, alpha: 1 });
    });

    // Bomben
    if (S.bomb) {
      var bx, bz, by, scale = 1, glow = 0.55;
      var pulse = 1 + Math.sin(Date.now() / 90) * 0.12;
      if (S.bomb.fly) {
        var f = S.bomb.fly, k = Math.min(1, f.t / f.dur);
        bx = f.fromX + (f.toX - f.fromX) * k;
        bz = f.fromZ + (f.toZ - f.fromZ) * k;
        by = 1.4 + Math.sin(k * Math.PI) * 2.4;
      } else if (S.bomb.holder.you) {
        // Håller du bomben själv hålls den framför kameran, annars hamnar den i ögat
        var fx = Math.sin(me.yaw), fz = -Math.cos(me.yaw);
        var rx = Math.cos(me.yaw), rz = Math.sin(me.yaw);
        bx = me.x + fx * 0.85 + rx * 0.34;
        bz = me.z + fz * 0.85 + rz * 0.34;
        by = EYE - 0.34 + Math.sin(Date.now() / 260) * 0.03;
        scale = 0.8;
        glow = 0;
      } else {
        var hd = S.bomb.holder;
        bx = hd.x; bz = hd.z; by = 2.05 + Math.sin(Date.now() / 200) * 0.08;
      }
      var sc = pulse * scale;
      draw(meshes.bomb, multiply(translation(bx, by, bz), scaling(sc, sc, sc)), { emissive: 0.35 });
      if (glow) {
        draw(meshes.glow, multiply(translation(bx, by, bz), scaling(glow * pulse, glow * pulse, glow * pulse)),
          { alpha: 0.28, emissive: 1, tint: [1, 0.3, 0.35] });
      }
    }

    // Partiklar
    if (S.particles.length) {
      S.particles.forEach(function (q) {
        var s = q.size * (q.life / q.max) * 2.2;
        var mdl = multiply(multiply(translation(q.x, q.y, q.z), rotationY(me.yaw)), scaling(s, s, s));
        draw(meshes.quad, mdl, { tex: textures.spark, alpha: Math.max(0, q.life / q.max), emissive: 1 });
      });
    }
  }

  function hexToRgb(hex) {
    return [
      parseInt(hex.slice(1, 3), 16) / 255,
      parseInt(hex.slice(3, 5), 16) / 255,
      parseInt(hex.slice(5, 7), 16) / 255
    ];
  }

  /* ======================================================================
     Loop
     ====================================================================== */

  A.init = function (cv) {
    if (gl) return true;
    try {
      if (!initGL(cv)) return false;
      textures.spark = sparkTexture();
      return true;
    } catch (e) {
      return false;
    }
  };

  A.resize = function () {
    if (!canvas) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var r = canvas.getBoundingClientRect();
    canvas.width = Math.max(1, Math.round(r.width * dpr));
    canvas.height = Math.max(1, Math.round(r.height * dpr));
  };

  A.loop = function () {
    stopLoop();
    lastT = performance.now();
    var step = function (t) {
      raf = requestAnimationFrame(step);
      var dt = Math.min(0.05, (t - lastT) / 1000);
      lastT = t;
      update(dt);
      render();
      if (A.onFrame) A.onFrame(dt);
    };
    raf = requestAnimationFrame(step);
  };

  function stopLoop() {
    if (raf) cancelAnimationFrame(raf);
    raf = null;
  }
  A.stop = stopLoop;

})(window.MATTENITE = window.MATTENITE || {});

</script>
<script>
/* ==========================================================================
   arena-ui.js — meny, HUD och styrning för Minfältet 3D
   ========================================================================== */
(function (M) {
  'use strict';

  var ui = M.ui, A = M.arena;
  var $ = ui.$, $$ = ui.$$, esc = ui.esc;

  var stage = null, mapCtx = null, glOk = null;
  var cfg = { diff: 2, cat: 'mix', bots: 3 };
  var keys = {};
  var lookDrag = null, stickDrag = null;

  /* ---------- Menyvyn ------------------------------------------------------- */

  ui.renderArena = function () {
    var s = M.profile.stats;
    var left = Math.max(0, M.ARCADE_REQUIRED - s.arena3dWins);

    $('#view-arena').innerHTML =
      '<div class="view-head"><h2>Minfältet 3D</h2>' +
        '<p>Gå runt i arenan i förstaperson. Överallt ligger osynliga bomber — trampar du på en får du en mattefråga.</p></div>' +

      '<div class="card">' +
        '<h3>🕹️ Så funkar det</h3>' +
        '<p class="sub">1. Gå runt med spaken (eller WASD). Kameran vrids genom att dra på höger sida.<br>' +
        '2. Trampar du på en osynlig bomb startar frågan direkt — och klockan tickar.<br>' +
        '3. Svarar du rätt får du sikta och kasta bomben på någon annan.<br>' +
        '4. Smäller den i dina händer förlorar du ett liv. Sist kvar vinner rundan.</p>' +
      '</div>' +

      '<div class="card">' +
        '<h3>⚙️ Runda</h3>' +
        '<div class="sub" style="margin-bottom:6px">Svårighet</div>' +
        '<div class="seg" id="a-diff">' + M.DIFFS.map(function (d) {
          return '<button data-d="' + d.id + '" class="' + (cfg.diff === d.id ? 'on' : '') + '">' + d.name + '</button>';
        }).join('') + '</div>' +
        '<div class="sub" style="margin:12px 0 6px">Motståndare i arenan</div>' +
        '<div class="seg" id="a-bots">' + [1, 2, 3, 4, 5].map(function (n) {
          return '<button data-b="' + n + '" class="' + (cfg.bots === n ? 'on' : '') + '">' + n + '</button>';
        }).join('') + '</div>' +
        '<label class="field" style="margin-top:12px"><span>Frågekategori</span><select id="a-cat">' +
          '<option value="mix">🎲 Blandat</option>' +
          M.CATEGORIES.map(function (c) { return '<option value="' + c.id + '"' + (cfg.cat === c.id ? ' selected' : '') + '>' + c.icon + ' ' + c.name + '</option>'; }).join('') +
        '</select></label>' +
        '<button class="btn block mt" id="a-start">▶ Gå in i arenan</button>' +
      '</div>' +

      '<div class="card lock-card">' +
        (M.arcadeUnlocked()
          ? '<span class="big">🕹️</span><b>Arcade Mode är upplåst</b>' +
            '<p class="sub" style="margin-top:4px">Du levde sist ' + s.arena3dWins + ' gånger. Hela 2D-spelet finns i Arcade-fliken.</p>'
          : '<span class="big">🔒</span><b>Arcade Mode är låst</b>' +
            '<p class="sub" style="margin-top:4px">Lev sist i ' + M.ARCADE_REQUIRED + ' rundor för att låsa upp lobbies, blixt, duell, överlevnad, träning och dagens utmaning.</p>' +
            keysRow(s.arena3dWins) +
            '<p class="sub">' + s.arena3dWins + ' av ' + M.ARCADE_REQUIRED + ' — ' + left + ' kvar</p>') +
      '</div>' +

      '<div class="grid grid-3">' +
        tile(s.arena3dWins, 'Sist kvar') + tile(s.arena3dGames, 'Rundor') + tile(s.minesStepped, 'Bomber trampade') +
      '</div>';

    $$('#a-diff button').forEach(function (b) { b.onclick = function () { cfg.diff = +b.dataset.d; ui.renderArena(); }; });
    $$('#a-bots button').forEach(function (b) { b.onclick = function () { cfg.bots = +b.dataset.b; ui.renderArena(); }; });
    $('#a-cat').onchange = function () { cfg.cat = this.value; };
    $('#a-start').onclick = startRound;
  };

  function tile(num, lbl) {
    return '<div class="stat-tile"><div class="num">' + num + '</div><div class="lbl">' + lbl + '</div></div>';
  }

  function keysRow(n) {
    var out = '<div class="keys">';
    for (var i = 0; i < M.ARCADE_REQUIRED; i++) out += '<i class="' + (i < n ? 'on' : '') + '">' + (i < n ? '🔑' : '·') + '</i>';
    return out + '</div>';
  }

  /* ---------- Scenen ------------------------------------------------------- */

  function buildStage() {
    if (stage) return;
    stage = document.createElement('div');
    stage.className = 'arena-stage';
    stage.id = 'arena-stage';
    stage.innerHTML =
      '<canvas id="arena-canvas"></canvas>' +
      '<div class="a-flash" id="a-flash"></div>' +
      '<div class="a-danger" id="a-danger"></div>' +
      '<div class="a-hud">' +
        '<div class="a-top">' +
          '<div class="a-pill" id="a-lives">❤️❤️</div>' +
          '<div class="a-pill a-timer" id="a-timer" style="display:none"><span id="a-tlabel">Bomb</span>' +
            '<div class="bar"><i id="a-tbar"></i></div></div>' +
        '</div>' +
        '<canvas id="arena-map" width="192" height="192"></canvas>' +
        '<div class="a-detector"><span id="a-detlabel">MINSÖKARE</span><div class="bar"><i id="a-detbar"></i></div></div>' +
        '<div class="a-cross" id="a-cross"></div>' +
        '<div class="a-feed" id="a-feed"></div>' +
        '<div class="a-look" id="a-look"></div>' +
        '<div class="a-stick" id="a-stick"><i id="a-knob"></i></div>' +
        '<div class="a-hint">Dra här för att se dig omkring</div>' +
        '<div class="a-btns" id="a-btns">' +
          '<button class="a-exit" id="a-exit">✕ Lämna</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(stage);

    mapCtx = $('#arena-map').getContext('2d');
    $('#a-exit').onclick = quitRound;
    bindControls();
  }

  function startRound() {
    buildStage();
    stage.classList.add('on');
    var cv = $('#arena-canvas');
    if (glOk === null) glOk = A.init(cv);
    if (!glOk) {
      stage.classList.remove('on');
      M.forceArcade();
      ui.modal('<h3>3D fungerar inte här</h3><p class="sub">Den här enheten saknar WebGL, så Minfältet kan inte köras. ' +
        'Arcade Mode har låsts upp åt dig i stället.</p><button class="btn block mt" data-x="ok">Okej</button>', function (box) {
          $$('[data-x]', box).forEach(function (b) { b.onclick = function () { ui.closeModal(); ui.show('arcade'); }; });
        });
      return;
    }

    A.resize();
    A.start({ diff: cfg.diff, cat: cfg.cat, bots: cfg.bots });
    A.onQuestion = renderQuestion;
    A.onPhase = renderPhase;
    A.onFeed = renderFeed;
    A.onFrame = onFrame;
    A.onOver = renderOver;
    renderPhase();
    renderFeed();
    A.loop();
    ui.toast('🕳️', 'Se upp var du går', 'Bomberna är osynliga.', 2600);
  }

  ui.leaveArena = function () { quitRound(); };

  function quitRound() {
    A.quit();
    A.onQuestion = A.onPhase = A.onFeed = A.onFrame = A.onOver = null;
    if (stage) {
      stage.classList.remove('on');
      var q = $('#a-q'); if (q) q.remove();
      var o = $('#a-over'); if (o) o.remove();
    }
    ui.renderArena();
    ui.refreshChips();
  }

  /* ---------- HUD per bildruta --------------------------------------------- */

  function onFrame() {
    var S = A.state();
    if (!S) return;
    var me = A.you();

    $('#a-lives').textContent = me.alive ? '❤️'.repeat(Math.max(0, me.lives)) : '☠️';

    var tm = $('#a-timer');
    if (S.bomb && !S.bomb.fly) {
      tm.style.display = '';
      var pct = Math.max(0, Math.min(100, S.bomb.t / S.bomb.max * 100));
      $('#a-tbar').style.width = pct + '%';
      tm.classList.toggle('hot', S.bomb.t < S.bomb.max * 0.35);
      $('#a-tlabel').textContent = (S.bomb.holder.you ? 'Din bomb' : S.bomb.holder.name + 's bomb') + ' · ' + S.bomb.t.toFixed(1) + ' s';
    } else {
      tm.style.display = 'none';
    }

    var prox = A.mineProximity();
    $('#a-detbar').style.width = Math.round(prox * 100) + '%';
    $('#a-detlabel').textContent = prox > 0.75 ? '⚠️ PRECIS DÄR' : prox > 0.3 ? '⚠️ NÄRA' : 'MINSÖKARE';

    var cross = $('#a-cross');
    var aim = S.phase === 'throw' ? A.aimTarget() : null;
    cross.classList.toggle('lock', !!aim);

    $('#a-flash').style.opacity = S.flash * 0.6;
    $('#a-danger').classList.toggle('on', !!(S.bomb && !S.bomb.fly && S.bomb.holder.you));

    drawMap(S, me);
    if (S.phase === 'throw') updateThrowChips(aim);
  }

  function drawMap(S, me) {
    var c = mapCtx, n = 192, R = 13;
    c.clearRect(0, 0, n, n);
    var sc = n / (R * 2 + 2);
    var toX = function (x) { return n / 2 + x * sc; };
    var toY = function (z) { return n / 2 + z * sc; };

    c.strokeStyle = 'rgba(255,255,255,.22)';
    c.lineWidth = 2;
    c.strokeRect(toX(-R), toY(-R), R * 2 * sc, R * 2 * sc);

    c.fillStyle = 'rgba(0,229,200,.22)';
    (A.pillars ? A.pillars() : []).forEach(function (p) {
      c.fillRect(toX(p.x - p.w / 2), toY(p.z - p.d / 2), p.w * sc, p.d * sc);
    });

    S.players.forEach(function (p) {
      if (!p.alive || p.you) return;
      var holder = S.bomb && S.bomb.holder === p;
      c.fillStyle = holder ? '#ff4d6d' : p.color;
      c.beginPath();
      c.arc(toX(p.x), toY(p.z), holder ? 7 : 5, 0, 6.3);
      c.fill();
    });

    // Du, som en riktad triangel
    c.save();
    c.translate(toX(me.x), toY(me.z));
    c.rotate(me.yaw);
    c.fillStyle = '#ffffff';
    c.beginPath();
    c.moveTo(0, -9); c.lineTo(6, 7); c.lineTo(-6, 7);
    c.closePath();
    c.fill();
    c.restore();
  }

  /* ---------- Fråga, kastläge, flöde -------------------------------------- */

  function renderQuestion() {
    var S = A.state();
    if (!S || !S.q) return;
    var box = $('#a-q');
    if (!box) {
      box = document.createElement('div');
      box.className = 'a-q';
      box.id = 'a-q';
      $('.a-hud', stage).appendChild(box);
    }
    box.innerHTML =
      '<div class="q-cat">' + M.catName(S.q.cat) + ' · du står på en bomb</div>' +
      '<div class="q-text">' + esc(S.q.text) + ' = ?</div>' +
      '<div class="q-streak">' + (S.m.streak >= 2 ? '🔥 ' + S.m.streak + ' i rad' : 'Svara rätt för att kunna kasta') + '</div>' +
      '<div class="opts" id="a-opts">' + S.q.options.map(function (o, i) {
        return '<button class="opt" data-aopt="' + i + '">' + esc(o) + '</button>';
      }).join('') + '</div>';

    $$('[data-aopt]', box).forEach(function (b) {
      b.onclick = function () {
        var i = +b.dataset.aopt;
        var correct = S.q.correct;
        $$('[data-aopt]', box).forEach(function (x, xi) {
          x.disabled = true;
          if (xi === correct) x.classList.add('right');
          else if (xi === i) x.classList.add('wrong');
        });
        A.answer(i);
      };
    });
  }

  function renderPhase() {
    var S = A.state();
    if (!S) return;
    var q = $('#a-q');
    if (S.phase !== 'answer' && q) q.remove();
    var chips = $('#a-chips');
    if (S.phase !== 'throw' && chips) chips.remove();
    if (S.phase === 'throw') buildThrowChips();
  }

  function buildThrowChips() {
    var S = A.state();
    if ($('#a-chips')) return;
    var wrap = document.createElement('div');
    wrap.id = 'a-chips';
    wrap.innerHTML =
      '<div class="a-chips">' + S.players.filter(function (p) { return p.alive && !p.you; }).map(function (p) {
        return '<button class="a-chip" data-tid="' + p.id + '">' + p.av + ' ' + esc(p.name) + '</button>';
      }).join('') + '</div>' +
      '<button class="a-throw" id="a-throwbtn">🎯 KASTA</button>';
    $('#a-btns').insertBefore(wrap, $('#a-exit'));
    $$('[data-tid]', wrap).forEach(function (b) {
      b.onclick = function () { A.throwAt(b.dataset.tid); };
    });
    $('#a-throwbtn').onclick = function () { A.throwAt(null); };
  }

  function updateThrowChips(aim) {
    $$('#a-chips [data-tid]').forEach(function (b) {
      b.classList.toggle('aim', !!aim && aim.id === b.dataset.tid);
    });
  }

  function renderFeed() {
    var S = A.state();
    if (!S || !$('#a-feed')) return;
    $('#a-feed').innerHTML = S.feed.slice(0, 4).map(function (f) { return '<div>' + esc(f) + '</div>'; }).join('');
  }

  function renderOver(res) {
    var S = A.state();
    var wrap = document.createElement('div');
    wrap.className = 'a-over';
    wrap.id = 'a-over';
    wrap.innerHTML =
      '<div class="box">' +
        '<div style="font-size:46px">' + (res.win ? '🏁' : '☠️') + '</div>' +
        '<h2 style="font-size:22px;margin:6px 0 4px">' + (res.win ? 'Du levde sist!' : 'Du sprängdes') + '</h2>' +
        '<p class="sub">' + S.m.correct + ' rätt · ' + S.m.mines + ' bomber trampade · ' + S.m.throws + ' kast</p>' +
        '<div class="row mt" style="justify-content:center;gap:14px;font-weight:800">' +
          '<span style="color:var(--warn)">🪙 +' + res.coins + '</span>' +
          '<span style="color:var(--brand-2)">✨ +' + res.xp + ' XP</span>' +
        '</div>' +
        (res.unlocked
          ? '<div class="card mt" style="margin-bottom:0;text-align:center"><h3 style="justify-content:center">🗝️ Arcade Mode upplåst!</h3>' +
            '<p class="sub">Fem rundor som sist kvar. Lobbies, blixt, duell, överlevnad, träning och dagens utmaning är öppna nu.</p></div>'
          : (!M.arcadeUnlocked()
              ? '<p class="sub mt">' + M.profile.stats.arena3dWins + '/' + M.ARCADE_REQUIRED + ' rundor mot Arcade Mode' + keysRow(M.profile.stats.arena3dWins) + '</p>'
              : '')) +
        '<div class="row mt" style="gap:8px">' +
          '<button class="btn ghost" data-a="out">← Ut</button>' +
          '<button class="btn" style="flex:1" data-a="again">🔁 Ny runda</button>' +
        '</div>' +
      '</div>';
    $('.a-hud', stage).appendChild(wrap);

    if (res.win) { ui.sfx.win(); ui.confetti(80); }
    if (res.fresh.length) setTimeout(function () { ui.achToast(res.fresh); }, 600);
    if (res.unlocked) {
      ui.toast('🗝️', 'Arcade Mode upplåst!', 'Hela 2D-spelet är ditt.', 4200);
      ui.confetti(60);
    }
    ui.refreshChips();

    $$('[data-a]', wrap).forEach(function (b) {
      b.onclick = function () {
        var again = b.dataset.a === 'again';
        wrap.remove();
        A.quit();
        if (again) startRound();
        else quitRound();
      };
    });
  }

  /* ---------- Styrning ----------------------------------------------------- */

  function bindControls() {
    var stick = $('#a-stick'), knob = $('#a-knob'), look = $('#a-look');

    function stickSet(t) {
      var r = stick.getBoundingClientRect();
      var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      var dx = (t.clientX - cx) / (r.width / 2), dy = (t.clientY - cy) / (r.height / 2);
      var len = Math.sqrt(dx * dx + dy * dy);
      if (len > 1) { dx /= len; dy /= len; }
      A.input.fx = dx;
      A.input.fz = -dy;
      knob.style.transform = 'translate(' + (dx * 34) + 'px,' + (dy * 34) + 'px)';
    }

    function stickEnd() {
      stickDrag = null;
      A.input.fx = A.input.fz = 0;
      knob.style.transform = '';
    }

    stick.addEventListener('touchstart', function (e) {
      e.preventDefault();
      stickDrag = e.changedTouches[0].identifier;
      stickSet(e.changedTouches[0]);
    }, { passive: false });

    stick.addEventListener('touchmove', function (e) {
      for (var i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === stickDrag) stickSet(e.changedTouches[i]);
      }
      e.preventDefault();
    }, { passive: false });

    stick.addEventListener('touchend', stickEnd);
    stick.addEventListener('touchcancel', stickEnd);

    stick.addEventListener('mousedown', function (e) { stickDrag = 'mouse'; stickSet(e); e.preventDefault(); });
    window.addEventListener('mousemove', function (e) {
      if (stickDrag === 'mouse') stickSet(e);
      if (lookDrag === 'mouse') { lookMove(e.clientX, e.clientY); }
    });
    window.addEventListener('mouseup', function () {
      if (stickDrag === 'mouse') stickEnd();
      lookDrag = null;
    });

    var lastLook = null;
    function lookMove(x, y) {
      if (lastLook) {
        var me = A.you();
        if (me) {
          me.yaw += (x - lastLook.x) * 0.006;
          me.pitch = Math.max(-0.55, Math.min(0.55, me.pitch - (y - lastLook.y) * 0.004));
        }
      }
      lastLook = { x: x, y: y };
    }

    look.addEventListener('touchstart', function (e) {
      e.preventDefault();
      lookDrag = e.changedTouches[0].identifier;
      lastLook = { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
    }, { passive: false });

    look.addEventListener('touchmove', function (e) {
      for (var i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === lookDrag) {
          lookMove(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
        }
      }
      e.preventDefault();
    }, { passive: false });

    look.addEventListener('touchend', function () { lookDrag = null; lastLook = null; });
    look.addEventListener('mousedown', function (e) { lookDrag = 'mouse'; lastLook = { x: e.clientX, y: e.clientY }; e.preventDefault(); });

    window.addEventListener('keydown', function (e) {
      if (!A.state()) return;
      keys[e.key.toLowerCase()] = true;
      applyKeys();
      var S = A.state();
      if (S.phase === 'answer' && /^[1-4]$/.test(e.key)) {
        var btn = $('#a-opts .opt:nth-child(' + e.key + ')');
        if (btn && !btn.disabled) btn.click();
      }
      if (S.phase === 'throw' && (e.key === ' ' || e.key === 'Enter')) A.throwAt(null);
    });

    window.addEventListener('keyup', function (e) {
      keys[e.key.toLowerCase()] = false;
      applyKeys();
    });

    window.addEventListener('resize', function () { if (A.state()) A.resize(); });
  }

  function applyKeys() {
    var f = 0, s = 0;
    if (keys.w || keys.arrowup) f += 1;
    if (keys.s || keys.arrowdown) f -= 1;
    if (keys.a) s -= 1;
    if (keys.d) s += 1;
    A.input.fz = f;
    A.input.fx = s;
    A.input.look = (keys.arrowright ? 1 : 0) - (keys.arrowleft ? 1 : 0);
  }

  /* Exponera pelarna till minikartan */
  A.pillars = A.pillars || function () { return []; };

})(window.MATTENITE = window.MATTENITE || {});

</script>
<script>
/* ==========================================================================
   app.js — start, Cordova-koppling, hårdvaruknappar
   ========================================================================== */
(function (M) {
  'use strict';

  function boot() {
    M.load();
    M.ui.refreshChips();
    M.ui.show('home');

    // Nya prestationer kan ha tillkommit sedan förra versionen
    var fresh = M.checkAchievements();
    if (fresh.length) setTimeout(function () { M.ui.achToast(fresh); }, 800);

    // Tabbar
    M.ui.$$('.tabbar button').forEach(function (b) {
      b.onclick = function () { M.ui.show(b.dataset.tab); };
    });

    // Stäng modal när man klickar utanför
    M.ui.$('#modal').onclick = function (e) {
      if (e.target.id === 'modal') M.ui.closeModal();
    };

    // Spara när appen går i bakgrunden
    document.addEventListener('pause', M.save, false);
    window.addEventListener('beforeunload', M.save);

    // Android-bakåtknapp
    document.addEventListener('backbutton', function () {
      if (M.ui.$('#modal').classList.contains('open')) return M.ui.closeModal();
      var stage = M.ui.$('#arena-stage');
      if (stage && stage.classList.contains('on')) return M.ui.leaveArena();
      if (M.game.running) return M.ui.show('home');
      if (M.ui.current !== 'home') return M.ui.show('home');
      if (navigator.app && navigator.app.exitApp) navigator.app.exitApp();
    }, false);

    // Tangentbord: 1-4 svarar, Esc stänger modal
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') return M.ui.closeModal();
      if (M.game.running && M.game.phase === 'answer' && /^[1-4]$/.test(e.key)) {
        M.game.answer(parseInt(e.key, 10) - 1);
      }
    });
  }

  // Spelet behöver inga Cordova-plugin, så vi startar direkt och låter
  // cordova.js ladda i bakgrunden för bakåtknappen och pause-händelsen.
  if (window.location.protocol === 'file:' && !window.cordova) {
    var s = document.createElement('script');
    s.src = 'cordova.js';
    s.onerror = function () { /* körs utanför Cordova — spelet fungerar ändå */ };
    document.head.appendChild(s);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

})(window.MATTENITE = window.MATTENITE || {});

</script>
