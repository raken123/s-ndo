<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d17">
<meta name="color-scheme" content="dark">
<title>Tvätt-OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0d17; --bg2:#121629; --panel:#1a1f36; --panel2:#232a48;
    --ink:#e9ecf5; --muted:#8a91a8; --dim:#4a516b; --line:#323a5e;
    --cyan:#22d3ee; --violet:#7c5cff; --gold:#f5c542; --pink:#ec4899;
    --green:#34d399; --red:#ef4444; --orange:#fb923c;
    --px:4px;
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{
    background:
      radial-gradient(110% 70% at 20% 0%,#1d1840 0%,transparent 60%),
      radial-gradient(90% 60% at 100% 100%,#0f2733 0%,transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:'VT323',ui-monospace,Menlo,Consolas,monospace;
    font-size:21px;line-height:1.15;
    -webkit-font-smoothing:none;font-smooth:never;
    overflow:hidden;
  }
  .h,button,.btn,label.lbl,.tag,.pxf{font-family:'Press Start 2P',ui-monospace,monospace;letter-spacing:0}
  img.pix,canvas{image-rendering:pixelated;image-rendering:crisp-edges}
  ::selection{background:var(--pink);color:#fff}

  /* ---------- CRT overlay ---------- */
  #crt{pointer-events:none;position:fixed;inset:0;z-index:200;
    background:
      repeating-linear-gradient(to bottom,rgba(0,0,0,.22) 0 1px,transparent 1px 3px),
      radial-gradient(120% 100% at 50% 50%,transparent 60%,rgba(0,0,0,.55) 100%);
    animation:flicker 4s steps(2) infinite}
  body.nocrt #crt{display:none}
  @keyframes flicker{0%,100%{opacity:1}50%{opacity:.93}}

  /* ---------- pixel boxes & buttons ---------- */
  .pbox{background:var(--panel);margin:var(--px);
    box-shadow:0 calc(-1*var(--px)) 0 0 var(--line),0 var(--px) 0 0 var(--line),
               calc(-1*var(--px)) 0 0 0 var(--line),var(--px) 0 0 0 var(--line)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
    font-size:10px;line-height:1.4;padding:12px 14px;margin:var(--px);border:none;cursor:pointer;
    color:#fff;background:var(--violet);text-transform:uppercase;
    box-shadow:0 -4px 0 0 #0b0d17,0 4px 0 0 #0b0d17,-4px 0 0 0 #0b0d17,4px 0 0 0 #0b0d17,
               inset -4px -4px 0 0 rgba(0,0,0,.35),inset 4px 4px 0 0 rgba(255,255,255,.18)}
  .btn:hover{filter:brightness(1.15)}
  .btn:active{transform:translate(2px,2px);
    box-shadow:0 -4px 0 0 #0b0d17,0 4px 0 0 #0b0d17,-4px 0 0 0 #0b0d17,4px 0 0 0 #0b0d17,
               inset 4px 4px 0 0 rgba(0,0,0,.35)}
  .btn:disabled{opacity:.45;cursor:default;filter:none;transform:none}
  .btn.ghost{background:var(--panel2);color:var(--ink)}
  .btn.cyan{background:#0e7490}
  .btn.gold{background:var(--gold);color:#241a00}
  .btn.pink{background:var(--pink)}
  .btn.green{background:#059669}
  .btn.red{background:#b91c1c}
  .btn.small{font-size:8px;padding:9px 10px}
  .btn.big{font-size:12px;padding:16px 20px}
  .btn.block{display:flex;width:calc(100% - 8px)}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .btns{margin-top:14px}
  .muted{color:var(--muted)}
  .center{text-align:center}
  .glow{text-shadow:0 0 8px rgba(34,211,238,.55)}

  input,textarea,select{font-family:'VT323',ui-monospace,monospace;font-size:21px;color:var(--ink);
    background:#0e1122;border:none;outline:none;padding:10px 12px;width:100%;margin:var(--px);
    box-shadow:0 -4px 0 0 var(--line),0 4px 0 0 var(--line),-4px 0 0 0 var(--line),4px 0 0 0 var(--line)}
  input:focus,textarea:focus,select:focus{box-shadow:0 -4px 0 0 var(--cyan),0 4px 0 0 var(--cyan),-4px 0 0 0 var(--cyan),4px 0 0 0 var(--cyan)}
  textarea{min-height:84px;resize:vertical}
  label.lbl{display:block;font-size:8px;color:var(--muted);margin:16px 4px 6px;text-transform:uppercase}
  input[type=checkbox]{width:auto;margin:0 10px 0 4px;accent-color:var(--pink);transform:scale(1.3)}
  .check{display:flex;align-items:center;margin:10px 0;cursor:pointer}

  /* ---------- typewriter ---------- */
  .tw{white-space:pre-wrap;min-height:1.15em}
  .cur{display:inline-block;width:.55em;height:.95em;background:var(--cyan);vertical-align:-2px;margin-left:1px;
    animation:blink .8s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .typing{cursor:pointer}
  .think{color:var(--pink);font-family:'Press Start 2P',monospace;font-size:10px;margin:14px 4px}
  .think::after{content:'';animation:dots 1.2s steps(4) infinite}
  @keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}

  /* ---------- screens ---------- */
  .screen{position:fixed;inset:0;display:none;overflow-y:auto;
    padding:calc(18px + var(--safe-t)) 16px calc(18px + var(--safe-b))}
  .screen.on{display:block}
  .wrap{max-width:560px;margin:0 auto}

  /* boot */
  #boot{cursor:pointer}
  #boot-log{font-size:22px;color:var(--green);text-shadow:0 0 6px rgba(52,211,153,.5);margin-top:6vh}
  #boot-go{margin-top:28px;font-family:'Press Start 2P',monospace;font-size:12px;color:var(--gold);
    visibility:hidden;animation:blink 1s steps(1) infinite}
  #boot-go.on{visibility:visible}
  .logo-big{font-size:clamp(22px,7vw,40px);line-height:1.25;text-align:center;
    background:linear-gradient(90deg,var(--violet),var(--cyan) 55%,var(--pink));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(4px 4px 0 #000)}
  .logo-sub{text-align:center;color:var(--muted);margin-top:8px}

  /* washer with spinning drum */
  .washer{position:relative;margin:26px auto 18px;--s:8px;width:calc(14*var(--s));height:calc(14*var(--s))}
  .washer img{position:absolute;left:0;top:0;width:100%;height:100%}
  .washer .drum{left:calc(4*var(--s));top:calc(6*var(--s));width:calc(6*var(--s));height:calc(6*var(--s));
    animation:spin .9s steps(4) infinite}
  .washer.fast .drum{animation-duration:.35s}
  @keyframes spin{to{transform:rotate(360deg)}}
  .washer.shake{animation:shake .12s steps(2) infinite}
  @keyframes shake{50%{transform:translateX(4px)}}

  /* login */
  #login-msg{text-align:center;font-size:23px;min-height:3.6em;margin:6px 0 14px}
  #whoami{margin-top:16px;padding:16px}
  #whoami:empty{display:none}
  #whoami .tw{font-size:23px}

  /* scanner modal */
  .scanner{position:relative;width:max-content;margin:18px auto}
  .waves{position:absolute;right:-34px;top:50%;transform:translateY(-50%);display:flex;gap:6px}
  .waves i{display:block;width:6px;height:22px;background:var(--cyan);animation:wave 1.2s steps(1) infinite}
  .waves i:nth-child(2){height:36px;animation-delay:.2s}
  .waves i:nth-child(3){height:50px;animation-delay:.4s}
  @keyframes wave{0%,60%{opacity:.15}20%{opacity:1}}
  .scanner.ok .waves i{background:var(--green);animation:none;opacity:1}
  .sim{margin-top:14px;padding:12px;background:#0e1122}
  .sim p{font-size:18px;margin-bottom:8px}

  /* ---------- app ---------- */
  #app{padding:0;display:none;flex-direction:column;overflow:hidden}
  #app.on{display:flex}
  #top{display:flex;align-items:center;gap:10px;padding:calc(10px + var(--safe-t)) 16px 10px;
    background:#0e1122;border-bottom:4px solid var(--line);flex-shrink:0}
  #top .h.logo{font-size:12px;color:var(--cyan);white-space:nowrap}
  #top .who{margin-left:auto;font-size:19px;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #top .btn{margin:4px}
  #view{flex:1;overflow-y:auto;padding:18px 16px 30px}
  #view > .wrap{max-width:980px}
  #status{flex-shrink:0;display:flex;gap:18px;padding:7px 16px calc(7px + var(--safe-b));background:#0e1122;
    border-top:4px solid var(--line);font-size:18px;color:var(--muted);white-space:nowrap;overflow:hidden}
  #status b{color:var(--green);font-weight:normal}
  #status .warn{color:var(--pink)}

  .vhead{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .vhead h2{font-size:14px;color:var(--ink);margin-left:6px}
  .vintro{color:var(--muted);margin:0 4px 14px}

  .hello{margin:4px 4px 14px}
  .hello .big{font-family:'Press Start 2P',monospace;font-size:clamp(12px,3.6vw,18px);line-height:1.5;color:var(--ink)}
  .hello #nexttxt{color:var(--gold);margin-top:6px;font-size:22px}
  .tip{display:flex;gap:14px;align-items:flex-start;padding:14px;margin-bottom:22px}
  .tip img{flex-shrink:0}
  .tip .tag{font-size:8px;color:var(--pink);display:block;margin-bottom:6px}

  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
  .tile{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 8px 14px;cursor:pointer;
    border:none;color:var(--ink);background:var(--panel);text-align:center;
    animation:pop .35s steps(3) both;animation-delay:calc(var(--d)*70ms)}
  .tile span{font-size:10px;line-height:1.4}
  .tile small{font-family:'VT323',monospace;font-size:18px;color:var(--muted)}
  .tile:hover{background:var(--panel2);transform:translate(-2px,-2px)}
  .tile:hover span{color:var(--cyan)}
  .tile:active{transform:translate(2px,2px)}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}

  /* schedule */
  .weeknav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .weeknav .h{font-size:12px;text-align:center}
  .weeknav .h small{display:block;font-size:8px;color:var(--pink);margin-top:6px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:18px;color:var(--muted);margin:0 4px 10px}
  .legend i{display:inline-block;width:14px;height:14px;margin-right:5px;vertical-align:-1px}
  .sched{display:grid;grid-template-columns:52px repeat(5,minmax(0,1fr));gap:5px}
  .sh{font-size:17px;text-align:center;color:var(--muted);padding-bottom:2px}
  .dl{font-family:'Press Start 2P',monospace;font-size:8px;line-height:1.6;display:flex;flex-direction:column;justify-content:center;color:var(--ink)}
  .dl small{font-family:'VT323',monospace;font-size:17px;color:var(--muted)}
  .dl.today{color:var(--gold)}
  .cell{height:46px;border:none;cursor:pointer;font-family:'VT323',monospace;font-size:18px;line-height:1;
    display:grid;place-items:center;padding:0 2px;overflow:hidden}
  .cell.free{background:#0f2a21;color:var(--green);box-shadow:inset 0 0 0 3px #1d6b51}
  .cell.free:hover{background:#174a38}
  .cell.mine{background:var(--gold);color:#241a00;box-shadow:inset -3px -3px 0 rgba(0,0,0,.3)}
  .cell.busy{background:#1a1e32;color:#5c6379}
  .cell.past{background:repeating-linear-gradient(45deg,#121522 0 4px,#0d1019 4px 8px);color:#343a52;cursor:default}
  .cell.past.was-mine{color:#8a7a3a}
  .cell.hint{box-shadow:inset 0 0 0 3px var(--pink);animation:blink 1s steps(1) 4}

  .sugg{padding:14px;margin:12px 4px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;
    animation:pop .3s steps(3) both}
  .sugg .when{font-family:'Press Start 2P',monospace;font-size:10px;color:var(--gold);line-height:1.5}
  .sugg .why{flex:1 1 220px;color:var(--ink)}
  .sugg.booked{opacity:.6}
  .out{padding:14px;margin-top:14px;font-size:21px}
  .out:empty{display:none}

  /* memories */
  .mem{display:flex;gap:10px;align-items:flex-start;padding:12px;margin:10px 4px}
  .mem p{flex:1;white-space:pre-wrap}
  .mem small{display:block;color:var(--dim);font-size:16px;margin-top:4px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
  .chip{text-align:left;font-family:'VT323',monospace;font-size:18px;background:#0e1122;color:var(--cyan);border:none;
    padding:5px 9px;cursor:pointer;box-shadow:inset 0 0 0 2px #164e63}
  .chip:hover{background:#164e63;color:#fff}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;align-items:start}
  .section{padding:14px}
  .section > .h{font-size:10px;color:var(--cyan);margin-bottom:10px;line-height:1.5}

  /* chat */
  .chat{display:flex;flex-direction:column;gap:10px;margin-bottom:12px;min-height:180px}
  .msg{max-width:88%;padding:10px 12px;white-space:pre-wrap}
  .msg.me{align-self:flex-end;background:#2b2160;box-shadow:0 0 0 3px #4b3aa8}
  .msg.bot{align-self:flex-start;background:#0f2730;box-shadow:0 0 0 3px #155e75}
  .msg .tag{font-size:7px;display:block;margin-bottom:6px;color:var(--muted)}
  .chatbar{display:flex;gap:6px;align-items:center;position:sticky;bottom:-30px;background:var(--bg);padding:8px 0}
  .chatbar input{flex:1}

  /* tabs */
  .tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
  .tabs .btn.on{background:var(--pink)}

  /* games */
  .players{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .players .btn.on{background:var(--gold);color:#241a00}
  .socks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:380px;margin:10px auto}
  .sock{aspect-ratio:1;border:none;background:#232a48;cursor:pointer;display:grid;place-items:center;
    box-shadow:inset -4px -4px 0 rgba(0,0,0,.35),inset 4px 4px 0 rgba(255,255,255,.08)}
  .sock .q{font-family:'Press Start 2P',monospace;font-size:16px;color:var(--dim)}
  .sock.open{background:#0e1122}
  .sock.done{background:#0f2a21;box-shadow:inset 0 0 0 3px #1d6b51}
  .sock img{width:60%;height:auto}
  .gstat{display:flex;justify-content:space-between;max-width:384px;margin:8px auto;font-family:'Press Start 2P',monospace;font-size:10px}
  .gstat .lives{color:var(--red)}
  #gc{display:block;width:100%;max-width:384px;margin:0 auto;background:#0e1122;touch-action:none;
    box-shadow:0 -4px 0 0 var(--line),0 4px 0 0 var(--line),-4px 0 0 0 var(--line),4px 0 0 0 var(--line)}
  .gamearea{margin-top:14px}
  .riddle{font-size:24px;color:var(--ink)}
  .win{font-family:'Press Start 2P',monospace;font-size:12px;color:var(--gold);text-align:center;margin:12px 0;line-height:1.6;
    animation:blink .5s steps(1) 6}

  .preview{max-width:220px;margin:10px 4px;display:block}
  .warnbox{padding:12px;margin:12px 4px;background:#2a0f1f;box-shadow:inset 0 0 0 3px #7a1f48;font-size:19px}
  .okbox{padding:12px;margin:12px 4px;background:#0f2a21;box-shadow:inset 0 0 0 3px #1d6b51;font-size:19px}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:19px}
  .kv dt{color:var(--muted)}

  /* modal / toast */
  #modal{position:fixed;inset:0;z-index:150;background:rgba(5,6,10,.8);display:flex;align-items:center;justify-content:center;padding:16px}
  #modal.hide{display:none}
  .mbox{width:100%;max-width:470px;max-height:calc(100% - 20px);overflow-y:auto;padding:20px;animation:pop .25s steps(3) both}
  .mbox h3{font-size:12px;color:var(--cyan);margin-bottom:12px;line-height:1.5}
  #toast{position:fixed;left:50%;bottom:calc(60px + var(--safe-b));transform:translateX(-50%);z-index:180;
    font-family:'Press Start 2P',monospace;font-size:9px;line-height:1.5;padding:12px 16px;background:var(--gold);color:#241a00;
    box-shadow:0 -4px 0 #000,0 4px 0 #000,-4px 0 0 #000,4px 0 0 #000;display:none;max-width:calc(100% - 40px);text-align:center}
  #toast.on{display:block;animation:pop .2s steps(2) both}
  #toast.err{background:var(--red);color:#fff}

  @media (max-width:520px){
    body{font-size:20px}
    #top .h.logo{font-size:9px}
    .sched{grid-template-columns:40px repeat(5,minmax(0,1fr));gap:4px}
    .cell{height:42px;font-size:16px}
    .sh{font-size:15px}
    .tiles{grid-template-columns:repeat(2,1fr);gap:10px}
    .tile{padding:14px 6px 12px}
    .tile span{font-size:9px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:0s!important;animation-iteration-count:1!important}
  }
</style>
</head>
<body>
<div id="crt"></div>

<!-- ============ BOOT ============ -->
<section id="boot" class="screen on" aria-live="polite">
  <div class="wrap">
    <div id="boot-log" class="tw"></div>
    <div id="boot-go">▶ TRYCK FÖR ATT STARTA</div>
  </div>
</section>

<!-- ============ LOGIN ============ -->
<section id="login" class="screen">
  <div class="wrap">
    <h1 class="h logo-big">TVÄTT-OS</h1>
    <p class="logo-sub">Tvättstugans smarta launcher</p>
    <div class="washer" id="login-washer"></div>
    <p id="login-msg" class="tw"></p>
    <button class="btn big block pink" id="btn-scan">▣ SKANNA NFC-KORT</button>
    <button class="btn block ghost" id="btn-new">+ NYTT KONTO</button>
    <div id="whoami" class="pbox"></div>
  </div>
</section>

<!-- ============ REGISTER ============ -->
<section id="register" class="screen">
  <div class="wrap">
    <div class="vhead"><button class="btn small ghost" id="reg-back">◄ TILLBAKA</button><h2 class="h">NYTT KONTO</h2></div>
    <p class="tw vintro" id="reg-intro"></p>
    <label class="lbl" for="reg-name">Förnamn</label>
    <input id="reg-name" autocomplete="given-name" maxlength="30" placeholder="t.ex. Johan">
    <label class="lbl" for="reg-apt">Lägenhetsnummer</label>
    <input id="reg-apt" inputmode="numeric" maxlength="8" placeholder="t.ex. 1104">
    <label class="lbl" for="reg-pin">PIN-kod (valfri, 4–6 siffror)</label>
    <input id="reg-pin" type="password" inputmode="numeric" maxlength="6" placeholder="Extra skydd om kortet tappas bort">
    <label class="lbl" for="reg-kid">Barn som ska kunna spela (valfritt)</label>
    <div class="row" style="flex-wrap:nowrap">
      <input id="reg-kid" maxlength="20" placeholder="Namn, t.ex. Liam">
      <input id="reg-kidlikes" maxlength="80" placeholder="Gillar… t.ex. dinosaurier">
    </div>
    <label class="lbl">NFC-kort</label>
    <div class="pbox" style="padding:12px;display:flex;align-items:center;gap:12px">
      <span id="reg-cardimg"></span>
      <span id="reg-cardstate" class="muted">Inget kort kopplat ännu.</span>
    </div>
    <button class="btn block cyan" id="reg-scan">▣ SKANNA KORT ATT KOPPLA</button>
    <button class="btn big block pink" id="reg-go" disabled>✓ SKAPA KONTO</button>
  </div>
</section>

<!-- ============ APP ============ -->
<section id="app" class="screen">
  <header id="top">
    <span class="h logo">TVÄTT-OS</span>
    <span class="who" id="top-who"></span>
    <button class="btn small ghost" id="top-sound" title="Ljud av/på">♪</button>
    <button class="btn small red" id="top-out" title="Logga ut">⏻</button>
  </header>
  <main id="view"></main>
  <footer id="status"></footer>
</section>

<div id="modal" class="hide"><div class="mbox pbox"></div></div>
<div id="toast"></div>

<script>
'use strict';
/* =====================================================================
   Tvätt-OS — tvättstugans launcher
   Allt sparas lokalt i webbläsaren (localStorage). AI = Google Gemini,
   nyckeln läggs in under Inställningar och lagras bara på enheten.
   ===================================================================== */

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ---------------- storage ---------------- */
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
let users = LS.get('tvos_users', null);
let bookings = LS.get('tvos_bookings', []);
const settings = Object.assign({
  apiKey: '', model: 'gemini-2.5-flash', endpoint: 'auto', working: null,
  speed: 'slow', sound: true, crt: true, autoLogout: true
}, LS.get('tvos_settings', {}));
let scores = LS.get('tvos_scores', {});
const saveUsers = () => LS.set('tvos_users', users);

  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));

}

function neighbor(date, i) {
  const h = fnv('n' + date + '#' + i);
  const pct = [28, 20, 24, 45, 52][i] + (isWeekend(date) ? 14 : 0);
  if (h % 100 >= pct) return null;
  const mine = new Set((users || []).map(u => u.apt));
  const pool = NEIGH.filter(a => !mine.has(a));
  return pool[(h >>> 8) % pool.length] || NEIGH[0];
}
function slotInfo(date, i) {
  const past = slotAt(date, i, true) <= new Date();
  const b = bookings.find(x => x.date === date && x.slot === i);
  if (b) {
    if (me && b.userId === me.id) return { st: 'mine', past, b };
    const u = users.find(u => u.id === b.userId);
    return { st: 'busy', who: u ? u.apt : '?', past, b };
  }
  const n = neighbor(date, i);
  if (n) return { st: 'busy', who: n, past };

}

  return out;
}

const pixCache = {};
function pix(name, over) {
  const key = name + (over ? JSON.stringify(over) : '');
  if (pixCache[key]) return pixCache[key];
  const rows = BM[name]; const w = Math.max(...rows.map(r => r.length)), h = rows.length;
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const x = cv.getContext('2d');
  rows.forEach((r, j) => [...r].forEach((ch, i) => {
    if (ch === '.') return; const col = (over && over[ch]) || PAL[ch]; if (!col) return;
    x.fillStyle = col; x.fillRect(i, j, 1, 1);
  }));
  return (pixCache[key] = { url: cv.toDataURL(), w, h, canvas: cv });
}

let ac = null;
function beep(f = 880, d = 0.04, type = 'square', vol = 0.025, delay = 0) {
  if (!settings.sound) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const t = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d + 0.02);
  } catch {}
}

const SPEED = { slow: 24, normal: 60, fast: 400 };
async function typeInto(el, text, { append = false, cursor = true } = {}) {
  if (!el) return false;
  const tok = {}; el._tw = tok; el.classList.add('typing');
  if (!append) el.textContent = '';
  const tn = document.createTextNode(''); el.appendChild(tn);
  const cur = document.createElement('span'); cur.className = 'cur';
  if (cursor) el.appendChild(cur);
  text = String(text ?? '');
  const base = SPEED[settings.speed] || 24;
  const cps = text.length > 260 ? Math.max(base, text.length / 14) : base;
  let i = 0, n = 0;
  while (i < text.length) {
    if (el._tw !== tok) { cur.remove(); return false; }
    if (tok.skip || !el.isConnected) { tn.data += text.slice(i); break; }
    const ch = text[i++]; tn.data += ch;
    if (ch.trim() && n++ % 3 === 0) blip();
    await sleep(/[.!?]/.test(ch) ? 7000 / cps : /[,:\n]/.test(ch) ? 3500 / cps : 1000 / cps);
  }
  cur.remove(); el.classList.remove('typing'); return true;
}
document.addEventListener('click', e => { const t = e.target.closest('.typing'); if (t && t._tw) t._tw.skip = true; });

const FALLBACK_MODELS = ['gemini-2.5-flash', 'gemini-flash-latest', 'gemini-3-flash-preview', 'gemini-2.0-flash'];
const ENDPOINTS = {
  studio: (m, k) => ({ url: `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(m)}:generateContent`, headers: { 'x-goog-api-key': k } }),
  vertex: (m, k) => ({ url: `https://aiplatform.googleapis.com/v1/publishers/google/models/${encodeURIComponent(m)}:generateContent?key=${encodeURIComponent(k)}`, headers: {} })
};
const hasKey = () => !!settings.apiKey.trim();
class NoKey extends Error { constructor() { super('Ingen Gemini-nyckel inlagd'); this.nokey = true; } }
function combos() {
  const k = settings.apiKey.trim();
  const eps = settings.endpoint === 'auto' ? (k.startsWith('AQ.') ? ['vertex', 'studio'] : ['studio', 'vertex']) : [settings.endpoint];
  const models = [...new Set([settings.model.trim() || FALLBACK_MODELS[0], ...FALLBACK_MODELS])];
  const list = [];
  for (const e of eps) for (const m of models) list.push({ ep: e, model: m });
  const w = settings.working;
  if (w && w.key === fnv(k)) {
    const i = list.findIndex(c => c.ep === w.ep && c.model === w.model);
    if (i > 0) list.unshift(list.splice(i, 1)[0]);
  }
  return list;
}
async function gemini({ system, contents, prompt, json = false, temperature = 0.7, image }) {
  if (!hasKey()) throw new NoKey();
  const k = settings.apiKey.trim();
  if (!contents) {
    const parts = [{ text: prompt }];
    if (image) parts.unshift({ inlineData: { mimeType: image.mime, data: image.data } });
    contents = [{ role: 'user', parts }];
  }
  const body = JSON.stringify({
    ...(system ? { systemInstruction: { parts: [{ text: system }] } } : {}),
    contents,
    generationConfig: { temperature, ...(json ? { responseMimeType: 'application/json' } : {}) }
  });
  let lastErr;
  for (const c of combos()) {
    const { url, headers } = ENDPOINTS[c.ep](c.model, k);
    let res, data;
    try {
      res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', ...headers }, body });
      data = await res.json().catch(() => ({}));
    } catch (e) { lastErr = new Error('Nätverksfel mot ' + c.ep + ' (' + e.message + ')'); continue; }
    if (!res.ok) {
      const msg = data?.error?.message || ('HTTP ' + res.status);
      lastErr = new Error(msg);
      // fel modell/fel endpoint för den här nyckeln → prova nästa kombination
      if ([400, 401, 403, 404].includes(res.status) && !/safety|blocked/i.test(msg)) continue;
      throw lastErr;
    }
    const cand = data.candidates?.[0];
    const text = (cand?.content?.parts || []).map(p => p.text || '').join('').trim();
    if (!text) throw new Error('Tomt svar från AI:n (' + (cand?.finishReason || data.promptFeedback?.blockReason || 'okänt') + ')');
    if (!settings.working || settings.working.ep !== c.ep || settings.working.model !== c.model) {
      settings.working = { ep: c.ep, model: c.model, key: fnv(k) }; saveSettings(); renderStatus();
    }
    return json ? parseJSON(text) : text;
  }
  throw lastErr || new Error('AI:n svarade inte');
}
function parseJSON(t) {
  t = t.replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
  try { return JSON.parse(t); } catch {}
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a >= 0 && b > a) { try { return JSON.parse(t.slice(a, b + 1)); } catch {} }
  throw new Error('AI:n svarade i fel format — försök igen');
}

const hasNFC = 'NDEFReader' in window;
async function hashCard(raw) {
  const s = 'tvos:' + String(raw).trim().toUpperCase();
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return [...new Uint8Array(buf)].slice(0, 12).map(b => b.toString(16).padStart(2, '0')).join('');
  } catch { return fnv(s).toString(16).padStart(8, '0') + fnv(s + '#').toString(16).padStart(8, '0'); }
}
function readNFC(signal) {
  return new Promise(async (res, rej) => {
    try {
      const r = new NDEFReader();
      signal.addEventListener('abort', () => rej(new DOMException('avbrutet', 'AbortError')));
      r.onreading = e => {
        let id = e.serialNumber;
        if (!id && e.message) { try { id = [...e.message.records].map(x => new TextDecoder().decode(x.data)).join('|'); } catch {} }
        id ? res(id) : rej(new Error('Kortet saknar ID'));
      };
      r.onreadingerror = () => rej(new Error('Kunde inte läsa kortet — håll det stilla och försök igen'));
      await r.scan({ signal });
    } catch (e) { rej(e); }
  });
}

}

async function runPlanner() {
  const out = $('#pl-out'); const btn = $('#pl-go'); btn.disabled = true;
  out.innerHTML = `<div class="washer fast shake" style="--s:5px">${washerHTML()}</div><p class="think center">AI:N PLANERAR</p>`;
  const wish = $('#pl-wish').value.trim();
  let summary, list;
  try {
    const r = await gemini({
      json: true, temperature: 0.4,
      system: 'Du är AI-planeraren i en svensk tvättstuga. Du väljer de bästa tvättiderna åt användaren utifrån deras minnen (arbetsschema med udda/jämna ISO-veckor, barn, preferenser) och väljer ENDAST bland de lediga pass som listas. Räkna noga ut om en vecka är udda eller jämn utifrån ISO-veckonumret som anges. Svara på svenska, vänligt och kort. Svara ENBART med JSON: {"summary":"1–2 meningar om hur du resonerat","suggestions":[{"date":"YYYY-MM-DD","slot":0,"reason":"kort motivering, max 18 ord"}]} med 1–3 förslag, bäst först.',
      prompt: `${aiContext()}\n\nLediga pass kommande 14 dagar:\n${calendarText()}\n\nAnvändarens önskemål just nu: ${wish || '(inga särskilda)'}`
    });
    summary = clean(r.summary); list = validSuggestions(r.suggestions);
    if (!list.length) summary += '\n(AI:n hittade inga giltiga lediga pass — prova schemat manuellt.)';
  } catch (e) {
    if (!e.nokey) { out.innerHTML = aiErrorHTML(e); btn.disabled = false; return; }
    ({ summary, list } = offlinePlan());
    summary = 'AI-KÄRNAN ÄR OFFLINE — ENKEL PLANERING UTAN AI:\n' + summary;
  }
  if (!out.isConnected) return;
  out.innerHTML = `<div class="out pbox"><p class="tw" id="pl-sum"></p></div><div id="pl-list"></div>`;
  await typeInto($('#pl-sum'), summary);
  const l = $('#pl-list'); if (l) l.innerHTML = suggHTML(list) + (list.length ? '' : '<p class="muted">Inga förslag.</p>');
  if (btn.isConnected) btn.disabled = false;
}
function offlinePlan() {
  const txt = me.memories.map(m => m.text.toLowerCase()).join(' ');
  const pref = /kväll/.test(txt) ? [4, 3] : /morgon|förmiddag/.test(txt) ? [0, 1] : /helg/.test(txt) ? [1, 2] : [3, 4, 2];
  const free = freeSlots(10);
  const ranked = free.map(s => ({ ...s, score: (pref.includes(s.slot) ? 10 - pref.indexOf(s.slot) : 0) - (parseYmd(s.date) - new Date()) / 864e5 * 0.3 }))
    .sort((a, b) => b.score - a.score).slice(0, 3)
    .map(s => ({ date: s.date, slot: s.slot, reason: pref.includes(s.slot) ? 'Matchar tiden på dygnet du föredrar.' : 'Första lediga pass.' }));
  return { summary: 'Jag valde lediga pass som matchar den tid på dygnet dina minnen nämner.', list: ranked };
}

function shrinkImage(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => {
      const im = new Image();
      im.onload = () => {
        const m = 1024, sc = Math.min(1, m / Math.max(im.width, im.height));
        const c = document.createElement('canvas'); c.width = Math.round(im.width * sc); c.height = Math.round(im.height * sc);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        res({ mime: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.85).split(',')[1] });
      };
      im.onerror = () => rej(new Error('Kunde inte läsa bilden')); im.src = r.result;
    };
    r.onerror = () => rej(r.error); r.readAsDataURL(file);
  });
}

  area.innerHTML = `<div class="gstat"><span>DRAG: <span id="sk-m">0</span></span><span>REKORD: ${best ?? '—'}</span></div>
    <div class="socks">${deck.map((d, k) => `<button class="sock" data-k="${k}"><span class="q">?</span></button>`).join('')}</div><div id="sk-win"></div>`;
  const face = (k, show) => { const b = $(`[data-k="${k}"]`, area); b.classList.toggle('open', show); b.innerHTML = show ? img('sock', 5, { x: deck[k].c }) : '<span class="q">?</span>'; };
  $$('.sock', area).forEach(b => b.onclick = async () => {
    const k = +b.dataset.k; if (lock || open.includes(k) || done.has(k)) return;
    face(k, true); beep(440 + k * 30, 0.04); open.push(k);
    if (open.length < 2) return;
    moves++; $('#sk-m').textContent = moves;
    const [a, c] = open; open = [];
    if (deck[a].c === deck[c].c) {
      done.add(a); done.add(c); sfx.coin();
      [a, c].forEach(x => $(`[data-k="${x}"]`, area).classList.add('done'));
      if (done.size === deck.length) {
        sfx.ok();
        const rec = best === undefined || moves < best; if (rec) { scores[scoreKey('socks')] = moves; saveScores(); }
        $('#sk-win').innerHTML = `<p class="win">ALLA PAR HITTADE!<br>${moves} DRAG${rec ? ' · NYTT REKORD!' : ''}</p><div class="center"><button class="btn gold" id="sk-again">SPELA IGEN</button></div>`;
        $('#sk-again').onclick = () => gameSocks(area);
      }
    } else { lock = true; await sleep(700); face(a, false); face(c, false); lock = false; }
  });
}
function gameCatch(area) {
  const W = 128, H = 160;
  const best = scores[scoreKey('catch')] || 0;
  area.innerHTML = `<div class="gstat"><span>POÄNG: <span id="gc-s">0</span></span><span>REKORD: ${best}</span><span class="lives" id="gc-l">♥♥♥</span></div>
    <canvas id="gc" width="${W}" height="${H}"></canvas><p class="muted center" style="margin-top:8px">Dra med fingret eller använd ◄ ► · Fånga kläder, undvik lera!</p>
    <div class="center"><button class="btn gold" id="gc-go">▶ START</button></div>`;
  const cv = $('#gc'), ctx = cv.getContext('2d'); ctx.imageSmoothingEnabled = false;
  const CLOTH = ['#ec4899', '#22d3ee', '#f5c542', '#34d399', '#7c5cff', '#fb923c'];
  let raf = 0, running = false, bx = W / 2 - 8, items = [], score = 0, lives = 3, t = 0, keys = {}, last = 0;
  const drawBg = () => {
    ctx.fillStyle = '#0e1122'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#151a30'; for (let y = 0; y < H; y += 16) for (let x = (y / 16) % 2 * 8; x < W; x += 16) ctx.fillRect(x, y, 8, 8);
    ctx.fillStyle = '#323a5e'; ctx.fillRect(0, H - 6, W, 6);
  };
  const draw = () => {
    drawBg();
    items.forEach(it => ctx.drawImage(pix(it.kind, it.kind === 'mud' ? null : { x: it.c }).canvas, Math.round(it.x), Math.round(it.y)));
    ctx.drawImage(pix('basket').canvas, Math.round(bx), H - 13);
  };
  const spawn = () => {
    const kind = Math.random() < Math.min(0.35, 0.15 + score * 0.01) ? 'mud' : ['shirt', 'sock', 'pants'][Math.floor(Math.random() * 3)];
    const p = pix(kind); items.push({ kind, c: CLOTH[Math.floor(Math.random() * CLOTH.length)], x: Math.random() * (W - p.w), y: -p.h, w: p.w, h: p.h, vy: 0.5 + Math.random() * 0.4 + score * 0.03 });
  };
  const loop = ts => {
    const dt = Math.min(3, (ts - last) / 16.7 || 1); last = ts; t += dt;
    if (keys.ArrowLeft) bx -= 2.4 * dt; if (keys.ArrowRight) bx += 2.4 * dt;
    bx = Math.max(0, Math.min(W - 16, bx));
    if (t > Math.max(22, 60 - score * 1.5)) { t = 0; spawn(); }
    for (const it of items) {
      it.y += it.vy * dt;
      if (it.y + it.h >= H - 12 && it.y < H - 6 && it.x + it.w > bx + 1 && it.x < bx + 15) {
        it.gone = true;
        if (it.kind === 'mud') { lives--; sfx.err(); } else { score++; sfx.coin(); }
      } else if (it.y > H) { it.gone = true; if (it.kind !== 'mud') { lives--; beep(180, 0.1, 'sawtooth', 0.02); } }
    }
    items = items.filter(i => !i.gone);
    $('#gc-s').textContent = score; $('#gc-l').textContent = '♥'.repeat(Math.max(0, lives)) || '—';
    draw();
    if (lives <= 0) return over();
    raf = requestAnimationFrame(loop);
  };
  const over = () => {
    running = false; sfx.err();
    ctx.fillStyle = 'rgba(11,13,23,.75)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#f5c542'; ctx.font = '8px "Press Start 2P", monospace'; ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', W / 2, H / 2 - 6); ctx.fillStyle = '#e9ecf5'; ctx.fillText(score + ' P', W / 2, H / 2 + 10);
    if (score > best) { scores[scoreKey('catch')] = score; saveScores(); toast('NYTT REKORD: ' + score); }
    $('#gc-go').textContent = '▶ IGEN'; $('#gc-go').hidden = false;
  };
  const start = () => { items = []; score = 0; lives = 3; t = 0; bx = W / 2 - 8; running = true; last = performance.now(); $('#gc-go').hidden = true; raf = requestAnimationFrame(loop); };
  const kd = e => { if (['ArrowLeft', 'ArrowRight'].includes(e.key) && running) { keys[e.key] = true; e.preventDefault(); } };
  const ku = e => { keys[e.key] = false; };
  const pm = e => { if (!running) return; const r = cv.getBoundingClientRect(); bx = (e.clientX - r.left) / r.width * W - 8; };
  document.addEventListener('keydown', kd); document.addEventListener('keyup', ku);
  cv.addEventListener('pointermove', pm); cv.addEventListener('pointerdown', pm);
  $('#gc-go').onclick = start; draw();
  cleanup = () => { cancelAnimationFrame(raf); running = false; document.removeEventListener('keydown', kd); document.removeEventListener('keyup', ku); };
}
const RIDDLES = [
  { riddle: 'Jag har en stor rund mun men äter aldrig. Jag snurrar och snurrar men blir aldrig yr. Vad är jag?', hint: 'Jag bor i tvättstugan.', answer: 'tvättmaskin' },
  { riddle: 'Vi är alltid två, men en av oss försvinner jämt i tvätten. Vilka är vi?', hint: 'Du har oss på fötterna.', answer: 'strumpor' },
  { riddle: 'Ju mer jag torkar, desto blötare blir jag. Vad är jag?', hint: 'Du använder mig efter badet.', answer: 'handduk' },
  { riddle: 'Jag håller hårt i tvätten på linan hela dagen men blir aldrig trött. Vad är jag?', hint: 'Jag har två små ben som nyper.', answer: 'klädnypa' }
];
async function gameRiddle(area) {
  area.innerHTML = '<p class="think">AI:N HITTAR PÅ EN GÅTA</p>';
  let r;
  try {
    r = await gemini({ json: true, temperature: 1,
      prompt: `Hitta på en rolig gåta på enkel svenska för ett barn som heter ${player.name}${player.likes ? ' och gillar ' + player.likes : ''}. Gärna med koppling till intressena eller till tvätt. Svaret ska vara ETT ord. Svara ENBART med JSON: {"riddle":"...","hint":"...","answer":"ett ord"}` });
    if (!r.riddle || !r.answer) throw new Error('fel format');
  } catch (e) { r = RIDDLES[Math.floor(Math.random() * RIDDLES.length)]; if (!e.nokey) toast('AI:N SVARADE INTE — HÄR ÄR EN EGEN GÅTA'); }
  area.innerHTML = `<div class="out pbox"><p class="tw riddle" id="rd-q"></p>
    <div class="row" style="flex-wrap:nowrap;margin-top:12px"><input id="rd-a" placeholder="Ditt svar…" autocomplete="off"><button class="btn green" id="rd-ok">GISSA</button></div>
    <div class="row"><button class="btn small ghost" id="rd-hint">💡 LEDTRÅD</button><button class="btn small ghost" id="rd-show">VISA SVARET</button><button class="btn small pink" id="rd-new">NY GÅTA</button></div>
    <p class="tw" id="rd-msg" style="margin-top:10px;color:var(--gold)"></p></div>`;
  typeInto($('#rd-q'), r.riddle);
  const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '');
  const guess = () => {
    const a = norm($('#rd-a').value), ans = norm(r.answer); if (!a) return;
    const right = a === ans || (a.length > 3 && (ans.includes(a) || a.includes(ans)));
    if (right) { sfx.ok(); typeInto($('#rd-msg'), `RÄTT, ${player.name.toUpperCase()}! SVARET ÄR: ${String(r.answer).toUpperCase()} ★`); }
    else { sfx.err(); typeInto($('#rd-msg'), 'INTE RIKTIGT… FÖRSÖK IGEN!'); }
  };
  $('#rd-ok').onclick = guess; $('#rd-a').onkeydown = e => { if (e.key === 'Enter') guess(); };
  $('#rd-hint').onclick = () => typeInto($('#rd-msg'), 'LEDTRÅD: ' + (r.hint || 'Tänk efter lite till!'));
  $('#rd-show').onclick = () => typeInto($('#rd-msg'), 'SVARET ÄR: ' + String(r.answer).toUpperCase());
  $('#rd-new').onclick = () => gameRiddle(area);
}
async function gameStory(area) {

    <input id="sg-theme" placeholder="${esc(player.likes ? 'T.ex. ' + player.likes.split(',')[0] : 'T.ex. en strumpa som rymmer')}">
    <button class="btn block pink" id="sg-go">▶ BERÄTTA EN SAGA</button></div><div id="sg-out"></div>`;
  $('#sg-go').onclick = async () => {

      text = clean(await gemini({ temperature: 1, system: 'Du skriver korta, roliga och trygga godnattsagor på enkel svenska för barn 4–9 år. Ingen markdown.',

    }
    out.innerHTML = '<div class="out pbox"><p class="tw" id="sg-txt"></p></div>';
    typeInto($('#sg-txt'), text);

}
