# Builds BFDI Talk for Windows (.exe installer), macOS (.dmg) and Android (.apk).
# Add a repository secret named GEMINI_API_KEY to bake the Gemini key into the builds;
# without it the apps ask for a key in Settings.
# Push a tag like bfdi-talk-v1.0.0 to also publish a GitHub Release with all three files.
name: BFDI Talk builds

on:
  push:
    branches: [main, 'claude/bfdi-talk-app-*']
    tags: ['bfdi-talk-v*']
    paths: ['bfdi-talk/**', '.github/workflows/bfdi-talk.yml']
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: bfdi-talk

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows EXE
            os: windows-latest
            script: dist:win
            artifact: BFDI-Talk-Windows
            files: bfdi-talk/dist/*.exe
          - name: macOS DMG
            os: macos-latest
            script: dist:mac
            artifact: BFDI-Talk-macOS
            files: bfdi-talk/dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bfdi-talk/package-lock.json
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bfdi-talk/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run android:sync
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Build APK
        working-directory: bfdi-talk/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Name the APK
        run: |
          mkdir -p dist
          VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/BFDI-Talk-${VERSION}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: BFDI-Talk-Android
          path: bfdi-talk/dist/*.apk
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/bfdi-talk-v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: BFDI Talk ${{ github.ref_name }}
          files: out/*
