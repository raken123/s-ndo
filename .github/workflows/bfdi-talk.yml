# Builds BFDI Talk for Windows (.exe installer), macOS (.dmg), Android (.apk) and the web (one .html file).
# Add a repository secret named GEMINI_API_KEY to bake the Gemini key into the builds;
# without it the apps ask for a key in Settings.
# Push a tag like bfdi-talk-v1.0.0 to also publish a GitHub Release with all the files.
name: BFDI Talk builds

on:
  push:
    branches: [main, 'claude/bfdi-talk-app-*']
    tags: ['bfdi-talk-v*']
    paths: ['bfdi-talk/**', '.github/workflows/bfdi-talk.yml']
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: bfdi-talk

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows EXE
            os: windows-latest
            script: dist:win
            artifact: BFDI-Talk-Windows
            files: bfdi-talk/dist/*.exe
          - name: macOS DMG
            os: macos-latest
            script: dist:mac
            artifact: BFDI-Talk-macOS
            files: bfdi-talk/dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bfdi-talk/package-lock.json
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
      - name: Smoke-test the Mac app (install from DMG, verify signature, launch)
        if: runner.os == 'macOS'
        run: |
          set -x
          sw_vers
          DMG=$(ls dist/*.dmg | head -1)
          hdiutil attach "$DMG" -nobrowse -mountpoint /tmp/bfdi-dmg
          ls -la /tmp/bfdi-dmg
          ditto "/tmp/bfdi-dmg/BFDI Talk.app" "/tmp/BFDI Talk.app"
          hdiutil detach /tmp/bfdi-dmg
          APP="/tmp/BFDI Talk.app"
          codesign --verify --deep --strict --verbose=2 "$APP" || echo "::warning::codesign verify failed"
          codesign -dvv "$APP" 2>&1 | head -20 || true
          codesign -d --entitlements - "$APP" || true
          spctl --assess --type execute -vv "$APP" || true
          "$APP/Contents/MacOS/BFDI Talk" --enable-logging=stderr --v=0 > /tmp/bfdi-run.log 2>&1 &
          PID=$!
          sleep 25
          if kill -0 $PID 2>/dev/null; then
            echo "APP STILL RUNNING AFTER 25s"
            screencapture -x /tmp/bfdi-screen.png || true
            kill $PID; RESULT=ok
          else
            wait $PID; echo "APP EXITED with code $?"; RESULT=crashed
          fi
          tail -150 /tmp/bfdi-run.log
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/*BFDI* 2>/dev/null | head -2); do echo "== $f"; head -120 "$f"; done
          mkdir -p smoke && cp /tmp/bfdi-run.log smoke/ && cp /tmp/bfdi-screen.png smoke/ 2>/dev/null || true
          cp ~/Library/Logs/DiagnosticReports/*BFDI* smoke/ 2>/dev/null || true
          [ "$RESULT" = ok ]
      - name: Upload Mac smoke-test logs
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: BFDI-Talk-macOS-smoke-test
          path: bfdi-talk/smoke/
          if-no-files-found: ignore

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bfdi-talk/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run android:sync
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - name: Build APK
        working-directory: bfdi-talk/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Name the APK
        run: |
          mkdir -p dist
          VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/BFDI-Talk-${VERSION}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: BFDI-Talk-Android
          path: bfdi-talk/dist/*.apk
          if-no-files-found: error

  web:
    name: Web (one HTML file)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bfdi-talk/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build BFDI-Talk.html (website + the whole app)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          node tools/make_site.mjs --with-key --with-accounts --out "dist/BFDI-Talk-${VERSION}.html"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: BFDI-Talk-Web
          path: bfdi-talk/dist/*.html
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/bfdi-talk-v')
    needs: [desktop, android, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: BFDI Talk ${{ github.ref_name }}
          files: out/*
