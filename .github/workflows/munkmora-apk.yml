name: Munkmora APK

on:
  push:
    branches: ["main", "claude/**"]
    paths:
      - "munkmora/**"
      - "!munkmora/dist/**"
      - ".github/workflows/munkmora-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: munkmora-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: munkmora
    steps:
      - uses: actions/checkout@v4

      - name: Check the web app's script
        run: |
          python3 -c "import re,sys; s=open('web/index.html',encoding='utf-8').read(); open('/tmp/app.js','w',encoding='utf-8').write(re.search(r'<script>(.*)</script>', s, re.S).group(1))"
          node --check /tmp/app.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/app.apk
          cp web/index.html dist/app.html
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: munkmora-app
          path: |
            munkmora/dist/app.apk
            munkmora/dist/app.html

      # Keep a downloadable copy on the branch, next to the source.
      - name: Commit APK to the branch
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/app.apk dist/app.html
          if git diff --cached --quiet; then
            echo "APK unchanged"
            exit 0
          fi
          git commit -m "Build Munkmora APK from ${GITHUB_SHA::7}"
          git checkout -- .
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
