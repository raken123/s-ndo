name: Hub AI APK

on:
  push:
    branches: ["main", "claude/**"]
    paths:
      - "hub-ai/**"
      - "!hub-ai/dist/**"
      - ".github/workflows/hub-ai-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hub-ai-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub-ai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test Hub AI Cloud and its training pipeline (Python)
        working-directory: hub-ai/cloud
        run: python -m unittest discover -s tests -v

      # Set the repository variable HUBAI_CLOUD_URL to your deployed server
      # and the apps connect to it without any setup.
      - name: Point the app at Hub AI Cloud
        if: vars.HUBAI_CLOUD_URL != ''
        env:
          CLOUD_URL: ${{ vars.HUBAI_CLOUD_URL }}
        run: |
          python -c "import json,os; print('window.HUB_CONFIG = { cloudUrl: %s };' % json.dumps(os.environ['CLOUD_URL']))" > app/src/main/assets/www/js/config.js
          cat app/src/main/assets/www/js/config.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/HubAI-1.0.0.apk
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: HubAI-apk
          path: hub-ai/dist/HubAI-1.0.0.apk

      - name: Refresh the APK on the Hub AI release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view hub-ai-v1.0.0 >/dev/null 2>&1; then
            gh release upload hub-ai-v1.0.0 dist/HubAI-1.0.0.apk --clobber
          fi

      # Keep a downloadable copy on the branch, next to the source.
      - name: Commit APK to the branch
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/HubAI-1.0.0.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
            exit 0
          fi
          git commit -m "Build Hub AI APK from ${GITHUB_SHA::7}"
          git checkout -- .
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
