name: Build BFDIA 5B (Android)

on:
  push:
    branches: ["**"]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Run the head-less game-core tests
        run: ./tools/run-core-tests.sh

      - name: Type-check the Android layer against the stubs
        run: ./tools/typecheck-ui.sh

      - name: Build the debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Build the unsigned release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload the installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bfdia5b-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload the unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: bfdia5b-release-unsigned-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
