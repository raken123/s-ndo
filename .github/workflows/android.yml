name: Android build (APK + AAB)

on:
  push:
    paths:
      - 'android/**'
      - 'body-party/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4

      # Use your own upload key when the repository secrets exist; otherwise sign with a
      # throwaway key so the APK can still be installed for testing.
      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            {
              echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks"
              echo "KEYSTORE_PASSWORD=$KS_PASS"
              echo "KEY_ALIAS=$KS_ALIAS"
              echo "KEY_PASSWORD=${KS_KEY_PASS:-$KS_PASS}"
            } >> "$GITHUB_ENV"
          else
            keytool -genkeypair -keystore "$RUNNER_TEMP/test.jks" -alias bodyparty -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass testtest -keypass testtest -dname "CN=Body Party test build"
            {
              echo "KEYSTORE_FILE=$RUNNER_TEMP/test.jks"
              echo "KEYSTORE_PASSWORD=testtest"
              echo "KEY_ALIAS=bodyparty"
              echo "KEY_PASSWORD=testtest"
            } >> "$GITHUB_ENV"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret – signed with a temporary test key. Add your upload key before publishing to Google Play."
          fi

      - name: Build APK and AAB
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/BodyParty-1.0.${VERSION_CODE}.apk
          cp app/build/outputs/bundle/release/app-release.aab ../dist/BodyParty-1.0.${VERSION_CODE}.aab
          ls -la ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: BodyParty-android-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
