# Builds the RAKEN AI UI prototype into an installable debug APK.
name: Build RAKEN AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'raken-ai/**'
      - '.github/workflows/raken-apk.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: raken-ai/android
        run: |
          gradle wrapper --gradle-version 8.7
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: raken-ai-debug-apk
          path: raken-ai/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Actions artifacts expire and need a GitHub login to fetch, so the APK is
      # also committed to the branch. '[skip ci]' keeps this from re-triggering
      # the workflow.
      - name: Publish APK to the branch
        run: |
          mkdir -p raken-ai/dist
          cp raken-ai/android/app/build/outputs/apk/debug/app-debug.apk \
             raken-ai/dist/raken-ai-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f raken-ai/dist/raken-ai-debug.apk
          if git diff --cached --quiet; then
            echo "APK unchanged — nothing to commit"
          else
            git commit -m "Publish RAKEN AI debug APK [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
