# Builds the RAKEN AI UI prototype into an installable debug APK.
name: Build RAKEN AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'raken-ai/**'
      - '.github/workflows/raken-apk.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: raken-ai/android
        run: |
          gradle wrapper --gradle-version 8.7
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: raken-ai-debug-apk
          path: raken-ai/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
