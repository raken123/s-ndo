# Builds Raken AI for every platform.
#  - desktop: Windows, macOS (Apple Silicon + Intel) and Linux (.deb + tar) from the official Electron runtimes
#  - android: an installable APK
#  - web: served by the existing GitHub Pages workflow from raken-ai/app
# Push a tag like raken-ai-v1.0.0 to also publish a GitHub Release with every file attached.
name: Raken AI builds

on:
  push:
    branches: ["main"]
    paths: ["raken-ai/**", ".github/workflows/raken-ai.yml"]
    tags: ["raken-ai-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Syntax-check the web app
        run: for f in raken-ai/app/config.js raken-ai/app/sw.js raken-ai/app/js/*.js raken-ai/desktop/*.js; do node --check "$f"; done

  desktop:
    runs-on: ubuntu-latest
    needs: web-check
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y xz-utils unzip dpkg-dev xvfb
      - name: Build desktop packages
        working-directory: raken-ai/desktop
        run: python3 build.py deb linux-tar win mac mac-x64 --smoke
      - uses: actions/upload-artifact@v4
        with:
          name: raken-ai-desktop
          path: raken-ai/desktop/dist/*

  android:
    runs-on: ubuntu-latest
    needs: web-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: "temurin", java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.14.3" }
      - name: Build APK
        working-directory: raken-ai/android
        run: gradle --no-daemon assembleRelease
      - name: Rename APK
        run: cp raken-ai/android/app/build/outputs/apk/release/app-release.apk raken-ai-1.0.0-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: raken-ai-android
          path: raken-ai-1.0.0-android.apk

  release:
    if: startsWith(github.ref, 'refs/tags/raken-ai-v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/raken-ai-desktop/*
            out/raken-ai-android/*
