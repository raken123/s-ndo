name: Hub AI desktop

on:
  push:
    branches: ["main", "claude/**"]
    paths:
      - "hub-ai/**"
      - "!hub-ai/dist/**"
      - ".github/workflows/hub-ai-desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hub-ai-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: hub-ai/desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Electron and electron-builder
        run: npm install --no-audit --no-fund

      - name: Build installers
        run: npm run dist:${{ matrix.target }}

      - name: List output
        shell: bash
        run: ls -l release

      - uses: actions/upload-artifact@v4
        with:
          name: hub-ai-${{ matrix.target }}
          if-no-files-found: error
          path: |
            hub-ai/desktop/release/*.dmg
            hub-ai/desktop/release/*.exe
            hub-ai/desktop/release/*.deb

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: hub-ai-v1.0.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish to the Hub AI release
        run: |
          # The APK workflow commits its build to the branch; take the newest.
          git fetch -q origin "$GITHUB_REF_NAME"
          git show "FETCH_HEAD:hub-ai/dist/HubAI-1.0.0.apk" > out/HubAI-1.0.0.apk || rm -f out/HubAI-1.0.0.apk
          ls -l out
          (cd out && sha256sum * > SHA256SUMS.txt)
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --prerelease \
              --title "Hub AI 1.0.0" --notes-file hub-ai/desktop/RELEASE_NOTES.md
          else
            gh release edit "$TAG" --notes-file hub-ai/desktop/RELEASE_NOTES.md
          fi
          gh release upload "$TAG" out/* --clobber
