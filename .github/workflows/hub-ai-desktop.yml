name: Hub AI desktop

on:
  push:
    branches: ["main", "claude/**"]
    paths:
      - "hub-ai/**"
      - "!hub-ai/dist/**"
      - ".github/workflows/hub-ai-desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hub-ai-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: hub-ai/desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Electron and electron-builder
        run: npm install --no-audit --no-fund

      - name: Point the app at Hub AI Cloud
        if: vars.HUBAI_CLOUD_URL != ''
        shell: bash
        env:
          CLOUD_URL: ${{ vars.HUBAI_CLOUD_URL }}
        run: |
          node -e "console.log('window.HUB_CONFIG = { cloudUrl: ' + JSON.stringify(process.env.CLOUD_URL) + ' };')" > ../app/src/main/assets/www/js/config.js
          cat ../app/src/main/assets/www/js/config.js

      # A local Hub AI Cloud with fake models, so the smoke tests below can
      # generate a hub through the real API.
      - name: Start a test Hub AI Cloud
        if: matrix.target != 'win'
        shell: bash
        working-directory: hub-ai/cloud
        run: |
          HUBAI_FAKE_MODELS=1 HUBAI_QUIET=1 nohup python3 -m hubcloud --host 127.0.0.1 --port 8799 --db "$RUNNER_TEMP/hubai.sqlite3" > "$RUNNER_TEMP/cloud.log" 2>&1 &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8799/v1/health && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/cloud.log"; exit 1

      - name: Build installers
        run: npm run dist:${{ matrix.target }}

      - name: List output
        shell: bash
        run: ls -l release

      # An unsigned or badly signed app is what makes macOS call it
      # "damaged". Check every DMG the way a Mac would see it, and start the
      # Apple Silicon app (the runner is arm64).
      - name: Verify macOS apps
        if: matrix.target == 'mac'
        run: |
          set -euo pipefail
          for dmg in release/*.dmg; do
            echo "== $dmg"
            hdiutil verify "$dmg"
            mnt=$(mktemp -d)
            hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
            app="$mnt/Hub AI.app"
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv "$app" 2>&1 | grep -E "^(Identifier|Format|Signature)"
            lipo -archs "$app/Contents/MacOS/Hub AI"
            if [[ "$dmg" == *arm64* ]]; then
              code=0
              HUBAI_SAVE_DIR=$(mktemp -d) HUBAI_SMOKE=1 HUBAI_SMOKE_OUT="$PWD/smoke.log" HUBAI_SMOKE_CLOUD=http://127.0.0.1:8799 ELECTRON_ENABLE_LOGGING=1 \
                perl -e 'alarm 120; exec { $ARGV[0] } @ARGV or die "exec failed: $!"' "$app/Contents/MacOS/Hub AI" 2>&1 | tail -40 || code=$?
              echo "app exit: $code"
              cat smoke.log || true
              grep -q SMOKE_OK smoke.log
            fi
            hdiutil detach "$mnt"
          done

      - name: Start the Linux app
        if: matrix.target == 'linux'
        run: |
          HUBAI_SAVE_DIR=$(mktemp -d) HUBAI_SMOKE=1 HUBAI_SMOKE_OUT="$PWD/smoke.log" HUBAI_SMOKE_CLOUD=http://127.0.0.1:8799 \
            timeout 120 xvfb-run -a release/linux-unpacked/hub-ai --no-sandbox || true
          cat smoke.log
          grep -q SMOKE_OK smoke.log

      - uses: actions/upload-artifact@v4
        with:
          name: hub-ai-${{ matrix.target }}
          if-no-files-found: error
          path: |
            hub-ai/desktop/release/*.dmg
            hub-ai/desktop/release/*.exe
            hub-ai/desktop/release/*.deb

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: hub-ai-v1.0.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish to the Hub AI release
        run: |
          # The APK workflow commits its build to the branch; take the newest.
          git fetch -q origin "$GITHUB_REF_NAME"
          git show "FETCH_HEAD:hub-ai/dist/HubAI-1.0.0.apk" > out/HubAI-1.0.0.apk || rm -f out/HubAI-1.0.0.apk
          ls -l out
          (cd out && sha256sum * > SHA256SUMS.txt)
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --prerelease \
              --title "Hub AI 1.0.0" --notes-file hub-ai/desktop/RELEASE_NOTES.md
          else
            gh release edit "$TAG" --notes-file hub-ai/desktop/RELEASE_NOTES.md
          fi
          gh release upload "$TAG" out/* --clobber
