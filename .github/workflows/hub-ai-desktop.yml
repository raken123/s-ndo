name: Hub AI desktop

on:
  push:
    branches: ["main", "claude/**"]
    paths:
      - "hub-ai/**"
      - "!hub-ai/dist/**"
      - ".github/workflows/hub-ai-desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hub-ai-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: hub-ai/desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Electron and electron-builder
        run: npm install --no-audit --no-fund

      - name: Build installers
        run: npm run dist:${{ matrix.target }}

      - name: List output
        shell: bash
        run: ls -l release

      # An unsigned or badly signed app is what makes macOS call it
      # "damaged". Check every DMG the way a Mac would see it, and start the
      # Apple Silicon app (the runner is arm64).
      - name: Verify macOS apps
        if: matrix.target == 'mac'
        run: |
          set -euo pipefail
          for dmg in release/*.dmg; do
            echo "== $dmg"
            hdiutil verify "$dmg"
            mnt=$(mktemp -d)
            hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
            app="$mnt/Hub AI.app"
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv "$app" 2>&1 | grep -E "^(Identifier|Format|Signature)"
            lipo -archs "$app/Contents/MacOS/Hub AI"
            if [[ "$dmg" == *arm64* ]]; then
              HUBAI_SAVE_DIR=$(mktemp -d) HUBAI_SMOKE=1 perl -e 'alarm 120; exec @ARGV' "$app/Contents/MacOS/Hub AI" | tee smoke.log
              grep -q SMOKE_OK smoke.log
            fi
            hdiutil detach "$mnt"
          done

      - name: Start the Linux app
        if: matrix.target == 'linux'
        run: |
          HUBAI_SAVE_DIR=$(mktemp -d) HUBAI_SMOKE=1 timeout 120 xvfb-run -a release/linux-unpacked/hub-ai --no-sandbox | tee smoke.log
          grep -q SMOKE_OK smoke.log

      - uses: actions/upload-artifact@v4
        with:
          name: hub-ai-${{ matrix.target }}
          if-no-files-found: error
          path: |
            hub-ai/desktop/release/*.dmg
            hub-ai/desktop/release/*.exe
            hub-ai/desktop/release/*.deb

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: hub-ai-v1.0.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish to the Hub AI release
        run: |
          # The APK workflow commits its build to the branch; take the newest.
          git fetch -q origin "$GITHUB_REF_NAME"
          git show "FETCH_HEAD:hub-ai/dist/HubAI-1.0.0.apk" > out/HubAI-1.0.0.apk || rm -f out/HubAI-1.0.0.apk
          ls -l out
          (cd out && sha256sum * > SHA256SUMS.txt)
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --prerelease \
              --title "Hub AI 1.0.0" --notes-file hub-ai/desktop/RELEASE_NOTES.md
          else
            gh release edit "$TAG" --notes-file hub-ai/desktop/RELEASE_NOTES.md
          fi
          gh release upload "$TAG" out/* --clobber
