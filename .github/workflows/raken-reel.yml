# Renders the RAKEN AI ad reel to MP4.
# The frames come from reel.html one seek() at a time, so the output is
# deterministic; ffmpeg on the runner does the H.264 encode.
name: Render RAKEN AI reel

on:
  workflow_dispatch:
  push:
    paths:
      - 'raken-ai/ads/**'
      - '.github/workflows/raken-reel.yml'

permissions:
  contents: write

jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fonts the design depends on
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation

      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Check ffmpeg
        run: ffmpeg -version | head -1

      - name: Render frames and encode
        run: node raken-ai/ads/render-reel.js raken-ai/ads

      - name: Upload MP4s
        uses: actions/upload-artifact@v4
        with:
          name: raken-ai-reel
          path: raken-ai/ads/*.mp4
          if-no-files-found: error

      # Artifacts expire and need a login, so the videos are committed too.
      - name: Publish MP4s to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f raken-ai/ads/*.mp4
          if git diff --cached --quiet; then
            echo "videos unchanged — nothing to commit"
          else
            git commit -m "Publish RAKEN AI ad reel [skip ci]"
            git pull --rebase origin ${GITHUB_REF_NAME}
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
