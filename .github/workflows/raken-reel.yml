# Renders the RAKEN AI ad reel to MP4.
# The frames come from reel.html one seek() at a time, so the output is
# deterministic; ffmpeg on the runner does the H.264 encode.
name: Render RAKEN AI reel

on:
  workflow_dispatch:
  push:
    paths:
      - 'raken-ai/ads/**'
      - '.github/workflows/raken-reel.yml'

permissions:
  contents: write

jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Encoder and the fonts the design depends on
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-liberation

      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Check the encoder
        run: |
          ffmpeg -hide_banner -version | head -1
          ffmpeg -hide_banner -encoders | grep -q ' libx264 ' \
            || { echo 'libx264 missing — cannot encode H.264'; exit 1; }

      - name: Render frames and encode
        run: node raken-ai/ads/render-reel.js raken-ai/ads

      # Pull frames back out of the finished file — proves it decodes, not just
      # that the encoder exited 0.
      - name: Verify the encode
        run: |
          mkdir -p raken-ai/ads/verify
          for t in 1.6 5.6 9.6 13.6 17.6 21.8; do
            ffmpeg -hide_banner -loglevel error -y -ss $t \
              -i raken-ai/ads/raken-ai-reel.mp4 -frames:v 1 \
              -vf scale=360:-1 "raken-ai/ads/verify/t$t.png"
          done
          ls -la raken-ai/ads/verify
          ffprobe -hide_banner -v error -select_streams v:0 \
            -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames \
            -show_entries format=duration,size -of default=noprint_wrappers=1 \
            raken-ai/ads/raken-ai-reel.mp4

      - name: Upload MP4s
        uses: actions/upload-artifact@v4
        with:
          name: raken-ai-reel
          path: raken-ai/ads/*.mp4
          if-no-files-found: error

      # Artifacts expire and need a login, so the videos are committed too.
      - name: Publish MP4s to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f raken-ai/ads/*.mp4 raken-ai/ads/verify/*.png
          if git diff --cached --quiet; then
            echo "videos unchanged — nothing to commit"
          else
            git commit -m "Publish RAKEN AI ad reel [skip ci]"
            git pull --rebase origin ${GITHUB_REF_NAME}
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
