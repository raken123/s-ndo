name: Build Chargamo APK

on:
  push:
    paths:
      - "chargamo/**"
      - ".github/workflows/chargamo-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chargamo-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build release APK
        working-directory: chargamo
        run: gradle --no-daemon assembleRelease

      - name: Collect APK
        run: |
          mkdir -p apk
          cp chargamo/app/build/outputs/apk/release/app-release.apk apk/Chargamo.apk
          ls -l apk

      - uses: actions/upload-artifact@v4
        with:
          name: Chargamo-apk
          path: apk/Chargamo.apk

      # Pushes made with GITHUB_TOKEN do not trigger workflows, so this cannot loop.
      - name: Commit APK to the branch
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add apk/Chargamo.apk
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build apk/Chargamo.apk from ${GITHUB_SHA::7}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
