# Builds ChatGPT Agents for every platform and publishes a GitHub Release.
#   HTML  - agents/dist/chatgpt-agents.html (single file)
#   APK   - Android, Capacitor, debug-signed (installable by sideloading)
#   EXE   - Windows x64 NSIS installer, Electron
#   DMG   - macOS Apple Silicon + Intel, Electron, ad-hoc signed
#   IPA   - iOS, Capacitor, unsigned (sign/sideload with AltStore, Sideloadly, etc.)
name: Build ChatGPT Agents

on:
  push:
    paths: ["agents/**", ".github/workflows/agents-build.yml"]
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: "1.0.0"

jobs:
  html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 agents/build.py
      - uses: actions/upload-artifact@v4
        with: { name: html, path: agents/dist/chatgpt-agents.html }

  windows:
    needs: html
    runs-on: windows-latest
    defaults: { run: { shell: bash, working-directory: agents/electron } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { name: html, path: agents/dist }
      - run: npm install --no-audit --no-fund
      - run: npm run prepare-app
      - run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with: { name: exe, path: "agents/electron/out/*.exe" }

  macos:
    needs: html
    runs-on: macos-latest
    defaults: { run: { working-directory: agents/electron } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { name: html, path: agents/dist }
      - run: npm install --no-audit --no-fund
      - run: npm run prepare-app
      - run: CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac dir --arm64 --x64 --publish never
      - name: Ad-hoc sign and make DMGs
        run: |
          for pair in "mac-arm64:arm64" "mac:x64"; do
            dir="${pair%%:*}"; arch="${pair##*:}"
            app="out/$dir/ChatGPT Agents.app"
            codesign --force --deep --sign - "$app"
            codesign --verify --deep "$app"
            stage="stage-$arch"; rm -rf "$stage"; mkdir "$stage"
            cp -R "$app" "$stage/"
            ln -s /Applications "$stage/Applications"
            hdiutil create -volname "ChatGPT Agents" -srcfolder "$stage" -ov -format UDZO "out/ChatGPT-Agents-$VERSION-$arch.dmg"
          done
          ls -la out/*.dmg
      - uses: actions/upload-artifact@v4
        with: { name: dmg, path: "agents/electron/out/*.dmg" }

  android:
    needs: html
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: agents/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - uses: actions/download-artifact@v4
        with: { name: html, path: agents/dist }
      - run: npm install --no-audit --no-fund
      - run: npm run prepare-app
      - run: npx cap add android
      - name: App icons and splash
        continue-on-error: true
        run: npx @capacitor/assets generate --android --assetPath ../assets --iconBackgroundColor '#212121' --iconBackgroundColorDark '#212121' --splashBackgroundColor '#212121' --splashBackgroundColorDark '#212121'
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk "ChatGPT-Agents-$VERSION.apk"
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: "agents/mobile/*.apk" }

  ios:
    needs: html
    runs-on: macos-latest
    defaults: { run: { working-directory: agents/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { name: html, path: agents/dist }
      - run: npm install --no-audit --no-fund
      - run: npm run prepare-app
      - run: npx cap add ios
      - name: App icons and splash
        continue-on-error: true
        run: npx @capacitor/assets generate --ios --assetPath ../assets --iconBackgroundColor '#212121' --iconBackgroundColorDark '#212121' --splashBackgroundColor '#212121' --splashBackgroundColorDark '#212121'
      - run: npx cap sync ios
      - name: Build unsigned IPA
        working-directory: agents/mobile/ios/App
        run: |
          if [ -d App.xcworkspace ]; then target=(-workspace App.xcworkspace); else target=(-project App.xcodeproj); fi
          xcodebuild "${target[@]}" -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry "../../ChatGPT-Agents-$VERSION.ipa" Payload
      - uses: actions/upload-artifact@v4
        with: { name: ipa, path: "agents/mobile/*.ipa" }

  release:
    needs: [html, windows, macos, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dl, merge-multiple: true }
      - name: Publish release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          ls -la dl
          (cd dl && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          tag="agents-v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dl/* --clobber
          else
            gh release create "$tag" dl/* --target "$GITHUB_SHA" --title "ChatGPT Agents $VERSION" --notes-file agents/RELEASE_NOTES.md
          fi
